# the kernel `@ScheduledJob` (ADMIN-HIGH-013). Every raw `@Cron` / `@Interval` /
# `@Timeout` runs on every replica of its service with no lease and no
# heartbeat. tests/invariants/scheduled-jobs-leased.spec.ts requires every
# scheduled method in apps/, libs/ and platform/libs/ to be `@ScheduledJob`, or
