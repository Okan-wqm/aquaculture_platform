  - name: observability_service
    application: observability-service
    description: Observability — migration audit sink, security events sink, Prometheus/OTEL exporter
    publish:
      - 'events.platform.schema-migration.>'
      - 'events.security.events.>'
      - '$JS.API.>'
      - '_INBOX.>'
    subscribe:
      - 'events.platform.schema-migration.>'
      - 'events.security.events.>'
      - '$JS.API.>'
      - '_INBOX.>'

  # ---------------------------------------------------------------------------
  # config-service: dynamic per-tenant configuration
  # ---------------------------------------------------------------------------
  # Onboarded to the event backbone 2026-07-12 (DB-INFRA-HIGH-003) solely to be
  # a GDPR tenant-erasure target: it consumes TenantErasureRequested via a
  # JetStream pull consumer ($JS.API.> + _INBOX.>) and publishes the erasure
  # proof events via its own outbox worker (own cert). No domain events.
  - name: config_service
    application: config-service
    description: Dynamic per-tenant configuration — GDPR tenant-erasure target (proof publisher); config-runtime read responder
    publish:
      - 'events.*.ConfigServiceTenantDataErased'
      - 'events.*.ConfigServiceTenantDataErasureFailed'
      - 'events.*.ConfigServiceTenantErasureBlocked'
      # Faz C (D6): metadata-only config-change signal, emitted via config_outbox
      # on every mutating config write (consumers filter). NEVER carries the value/secret.
      - 'events.*.ConfigurationChanged'
      # Faz C (SEC-CRITICAL-001): config replies to billing's SCOPED secret-read
      # inbox — config is the ONLY CN that publishes this token.
      - '_INBOXBILLINGCFG.>'
      # Config is the only publisher to farm's scoped credential reply inbox.
      - '_INBOXFARMMARINECFG.>'
      - 'events.platform.schema-migration.>'
      - 'events.security.events.>'
      - '$JS.API.>'
      - '_INBOX.>'
    subscribe:
      # Faz C (D6): config-runtime request-reply responder subjects. The secret
      # reply is published back on the caller's SCOPED `_INBOXBILLINGCFG.>` inbox.
      - 'config.runtime.get'
      - 'config.runtime.get_secret'
      - 'config.marine_credentials.resolve'
      - 'config.marine_credentials.upsert'
      - '$JS.API.>'
      - '_INBOX.>'

  # ---------------------------------------------------------------------------
  # event-store-service: event persistence + projections
  # ---------------------------------------------------------------------------
  # Onboarded to the event backbone 2026-07-12 (DB-INFRA-HIGH-003) as a GDPR
  # tenant-erasure target: consumes TenantErasureRequested via a JetStream pull
  # consumer and publishes proof events via its own outbox. Erases the tenant-
  # column projection tables; stored_events (immutable) awaits crypto-shred.
  - name: event_store_service
    application: event-store-service
    description: Event persistence + projections — GDPR tenant-erasure target (proof publisher)
    publish:
      - 'events.*.EventStoreServiceTenantDataErased'
      - 'events.*.EventStoreServiceTenantDataErasureFailed'
      - 'events.*.EventStoreServiceTenantErasureBlocked'
      - 'events.platform.schema-migration.>'
      - 'events.security.events.>'
      - '$JS.API.>'
      - '_INBOX.>'
    subscribe:
      - '$JS.API.>'
      - '_INBOX.>'
