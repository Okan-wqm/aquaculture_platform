name: aria-daily-report

# Plan 022 §M-4 — daily ARIA report automation.
#
# Pre-Plan-022 the daily report surface drifted (2026-05-08 was
# missing despite Plan 020 + 022 commit activity). This workflow
# generates a fresh daily report each morning and uploads it as a
# workflow artifact so operators can audit ARIA gate activity over
# time without manual reconstruction.

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (UTC) date for the report; defaults to today.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: aria-daily-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/snowball'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: snowball
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Compute target date
        id: target
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE="${{ github.event.inputs.date }}"
          else
            DATE="$(date -u +%F)"
          fi
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Generate daily report (informational stub)
        run: |
          set -euo pipefail
          DATE="${{ steps.target.outputs.date }}"
          REPORT="aria-tools/reports/daily/${DATE}.md"
          mkdir -p "$(dirname "$REPORT")"
          # Plan 022 §M-4 — informational stub generator. The full
          # report renderer lives in aria_kernel.observability +
          # aria_kernel.reflection; the dashboard markdown surface
          # already exists. This step is a placeholder until a
          # dedicated `aria-kernel report daily` CLI lands as part
          # of Plan 023 (operations-hub plan, owner=okan-platform-
          # operator, deadline 2026-07-08, tracking DEBT-2026-05-08-001
          # umbrella). The stub captures workflow_runs date stamp +
          # governance-ledger pointer so the daily-report file
          # presence invariant holds in the meantime.
          if [ ! -f "$REPORT" ]; then
            cat > "$REPORT" <<EOF
          # ARIA Daily Report ${DATE}

          > Auto-generated by .github/workflows/aria-daily-report.yml
          > on $(date -u --iso-8601=seconds). Until the dedicated
          > \`aria-kernel report daily\` CLI lands, this stub records
          > the date + governance ledger pointer so the daily report
          > presence invariant holds.

          ## Governance ledger

          See \`aria-tools/governance.jsonl\` for the full event chain.

          ## Open debts

          See \`aria-debts/_index.json\`.
          EOF
          else
            echo "Report for ${DATE} already exists; skipping generation."
          fi

      - name: Upload report as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aria-daily-report-${{ steps.target.outputs.date }}
          path: aria-tools/reports/daily/${{ steps.target.outputs.date }}.md
          retention-days: 30
