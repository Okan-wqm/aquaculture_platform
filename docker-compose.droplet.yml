# =============================================================================
# Aquaculture Platform - DigitalOcean Droplet (4 CPU / 8GB RAM)
#
# All services enabled. Total memory budget: ~7GB
#
# Usage:
#   docker compose -f docker-compose.droplet.yml pull
#   docker compose -f docker-compose.droplet.yml up -d
# =============================================================================

# SEC-013: Trust boundary — all inter-service traffic (AUTH headers, GraphQL queries,
# NATS messages) travels on the aqua-internal Docker bridge network in plain HTTP/TCP.
# aqua-internal is marked internal: true so it cannot route to the internet.
# If a container escape occurs, traffic on this network is readable by other containers.
# For stronger isolation, consider a service mesh (e.g., Traefik mTLS or Consul Connect).

networks:
  aqua-network:
    driver: bridge
  aqua-internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:
  mosquitto_data:
  mosquitto_log:

services:
  # ===========================================================================
  # Infrastructure
  # ===========================================================================

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: aqua-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquaculture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-aquaculture}
      POSTGRES_SHARED_BUFFERS: 512MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1536MB
      POSTGRES_WORK_MEM: 16MB
      POSTGRES_MAINTENANCE_WORK_MEM: 128MB
      # SEC-015: Per-service DB passwords (passed to 00-init-schemas.sh)
      # If not set, random passwords are generated at first init.
      AUTH_SERVICE_DB_PASS: ${AUTH_SERVICE_DB_PASS:-}
      FARM_SERVICE_DB_PASS: ${FARM_SERVICE_DB_PASS:-}
      SENSOR_SERVICE_DB_PASS: ${SENSOR_SERVICE_DB_PASS:-}
      BILLING_SERVICE_DB_PASS: ${BILLING_SERVICE_DB_PASS:-}
      HR_SERVICE_DB_PASS: ${HR_SERVICE_DB_PASS:-}
      ALERT_SERVICE_DB_PASS: ${ALERT_SERVICE_DB_PASS:-}
      ADMIN_SERVICE_DB_PASS: ${ADMIN_SERVICE_DB_PASS:-}
      GATEWAY_SERVICE_DB_PASS: ${GATEWAY_SERVICE_DB_PASS:-}
      NOTIFICATION_SERVICE_DB_PASS: ${NOTIFICATION_SERVICE_DB_PASS:-}
      HYDROPONICS_SERVICE_DB_PASS: ${HYDROPONICS_SERVICE_DB_PASS:-}
    command: >
      postgres
      -c max_connections=300
      -c search_path=public,auth,admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquaculture}"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aqua-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required} --maxmemory 192mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      # SEC-014: Use REDISCLI_AUTH env var to avoid password in process list
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: aqua-nats
    restart: unless-stopped
    # ARCH-010/SEC-H01: Use config file for JetStream limits + authentication.
    # CLI flags replaced with nats.conf which includes authorization{} block.
    # NATS_USER and NATS_PASS are substituted by NATS from container environment.
    command: ["--config", "/etc/nats/nats.conf"]
    environment:
      # SEC-H01: NATS credentials for authenticated broker access.
      # Override via .env or deployment secrets. Defaults are for initial setup only.
      # NATS runs on internal Docker network (aqua-internal), not exposed to host.
      NATS_USER: ${NATS_USER:-nats_internal}
      NATS_PASS: ${NATS_PASS:-nats_s3cure_default_ch4nge_m3}
    volumes:
      - nats_data:/data
      - ./infrastructure/docker/nats/nats.conf:/etc/nats/nats.conf:ro
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.25'
    healthcheck:
      # SEC-H01: Use HTTP monitoring endpoint (enabled in nats.conf http_port: 8222)
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  mosquitto:
    build: ./infrastructure/mosquitto
    container_name: aqua-mosquitto
    restart: unless-stopped
    # Inject MQTT_AUTH_SECRET into mosquitto config at startup (replaces placeholder)
    entrypoint: ["/bin/sh", "-c", "sed -i \"s|__MQTT_AUTH_SECRET__|$MQTT_AUTH_SECRET|g\" /mosquitto/config/mosquitto.conf && exec mosquitto -c /mosquitto/config/mosquitto.conf"]
    environment:
      MQTT_AUTH_SECRET: ${MQTT_AUTH_SECRET:?MQTT_AUTH_SECRET required}
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.15'
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  minio:
    image: quay.io/minio/minio:latest
    container_name: aqua-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?MINIO_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
    volumes:
      - minio_data:/data
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Backend Services
  # ===========================================================================

  gateway-api:
    image: ghcr.io/okan-wqm/aquaculture_platform/gateway-api:latest
    container_name: aqua-gateway
    restart: unless-stopped
    environment:
      SERVICE_NAME: gateway-api
      NODE_ENV: production
      GATEWAY_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=384'
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-aquaculture}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NATS_URL: nats://${NATS_USER:-nats_internal}:${NATS_PASS:-nats_s3cure_default_ch4nge_m3}@nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      AUTH_SERVICE_URL: http://auth-service:3000/graphql
      FARM_SERVICE_URL: http://farm-service:3000/graphql
      SENSOR_SERVICE_URL: http://sensor-service:3000/graphql
      ALERT_SERVICE_URL: http://alert-engine:3000/graphql
      HR_SERVICE_URL: http://hr-service:3000/graphql
      BILLING_SERVICE_URL: http://billing-service:3000/graphql
      NOTIFICATION_SERVICE_URL: http://notification-service:3000/graphql
      HYDROPONICS_SERVICE_URL: http://hydroponics-service:3000/graphql
      ADMIN_SERVICE_URL: http://admin-api-service:3000/graphql
      CONFIG_SERVICE_URL: http://config-service:3000/graphql
      MESSAGING_SERVICE_URL: http://messaging-service:3000/graphql
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_USER:?MINIO_USER is required}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-aquaculture}
      MINIO_REGION: us-east-1
      TRUST_PROXY: "1"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      WS_CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      THROTTLE_DEFAULT_LIMIT: 500
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET required}
      DATABASE_SYNC: "false" # ARCH-DB-001: Production'da synchronize kapalı, migration kullanılmalı
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      # Subgraph services: wait for healthy (GraphQL endpoint ready) before gateway starts.
      # This prevents introspection failures caused by subgraphs still bootstrapping.
      auth-service:
        condition: service_healthy
      farm-service:
        condition: service_healthy
      sensor-service:
        condition: service_healthy
      alert-engine:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      hr-service:
        condition: service_healthy
      hydroponics-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      # ARCH-GW-001: notification-service and messaging-service are federated subgraphs
      # (listed in RetryableIntrospectAndCompose in app.module.ts). They MUST be healthy
      # before gateway starts, otherwise supergraph composition fails and blocks NestJS
      # startup entirely — preventing even /health/live from responding.
      notification-service:
        condition: service_healthy
      messaging-service:
        condition: service_healthy
      # Non-subgraph services: service_started is sufficient (gateway doesn't introspect them)
      admin-api-service:
        condition: service_started
      observability-service:
        condition: service_started
    networks:
      - aqua-network
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/live >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  auth-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/auth-service:latest
    container_name: aqua-auth
    restart: unless-stopped
    environment:
      SERVICE_NAME: auth-service
      NODE_ENV: production
      AUTH_SERVICE_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=384'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-aquaculture}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DATABASE_SYNC: "false"
      DATABASE_LOGGING: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: nats://${NATS_USER:-nats_internal}:${NATS_PASS:-nats_s3cure_default_ch4nge_m3}@nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@localhost.dev}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      # MFA & WebAuthn (optional -- MFA disabled if not set)
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-app.suderra.com}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-AquaCulture Platform}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  farm-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/farm-service:latest
    container_name: aqua-farm
    restart: unless-stopped
    environment:
      SERVICE_NAME: farm-service
      NODE_ENV: production
      FARM_SERVICE_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=256'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-aquaculture}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DATABASE_SYNC: "false" # ARCH-DB-001: Production'da synchronize kapalı, migration kullanılmalı
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: nats://${NATS_USER:-nats_internal}:${NATS_PASS:-nats_s3cure_default_ch4nge_m3}@nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      # ARCH-V11-008: Farm-service is the heaviest backend (71 entities, 25+ modules,
      # GraphQL federation schema, CQRS handler discovery). Under 256MB heap and 0.5 CPU,
      # NestJS bootstrap + TypeORM metadata loading + Apollo schema build can take 60-90s.
      # 120s start_period prevents premature unhealthy marking during cold start.
      start_period: 120s

  sensor-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/sensor-service:latest
    container_name: aqua-sensor
    restart: unless-stopped
    environment:
      SERVICE_NAME: sensor-service
      NODE_ENV: production
      SENSOR_SERVICE_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=256'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-aquaculture}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DATABASE_SYNC: "false" # ARCH-DB-001: Production'da synchronize kapalı, migration kullanılmalı
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NATS_URL: nats://${NATS_USER:-nats_internal}:${NATS_PASS:-nats_s3cure_default_ch4nge_m3}@nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MQTT_AUTH_MODE: http
      MQTT_AUTH_SECRET: ${MQTT_AUTH_SECRET:?MQTT_AUTH_SECRET required}
      MQTT_SENSOR_SERVICE_HASH: ${MQTT_SENSOR_SERVICE_HASH}
      MQTT_USERNAME: sensor_service
      MQTT_PASSWORD: ${MQTT_SENSOR_SERVICE_PASSWORD}
      # SEC-C02: No hardcoded default — credential encryption key must be provided externally
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      MQTT_BROKER_HOST: app.suderra.com
      MQTT_BROKER_PORT: 8883
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      EDGE_AGENT_GITHUB_REPO: Okan-wqm/aquaculture_platform
      PROVISIONING_API_BASE_URL: ${PROVISIONING_API_BASE_URL:-https://app.suderra.com}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  admin-api-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/admin-api-service:latest
    container_name: aqua-admin-api
    restart: unless-stopped
    environment:
      SERVICE_NAME: admin-api-service
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=256'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      ADMIN_CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-aquaculture}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DATABASE_SYNC: "false" # ARCH-DB-001: Production'da synchronize kapalı, migration kullanılmalı
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NATS_URL: nats://${NATS_USER:-nats_internal}:${NATS_PASS:-nats_s3cure_default_ch4nge_m3}@nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      FRONTEND_URL: ${FRONTEND_URL:-https://app.suderra.com}
      THROTTLE_DEFAULT_LIMIT: 500
      THROTTLE_DEFAULT_TTL: 60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aqua-internal
      - aqua-network  # needs internet for external SMTP email delivery
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  alert-engine:
    image: ghcr.io/okan-wqm/aquaculture_platform/alert-engine:latest
    container_name: aqua-alert
    restart: unless-stopped
    environment:
      SERVICE_NAME: alert-engine
      NODE_ENV: production
      ALERT_ENGINE_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=256'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-aquaculture}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DATABASE_SYNC: "false" # ARCH-DB-001: Production'da synchronize kapalı, migration kullanılmalı
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: nats://${NATS_USER:-nats_internal}:${NATS_PASS:-nats_s3cure_default_ch4nge_m3}@nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  billing-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/billing-service:latest
    container_name: aqua-billing
    restart: unless-stopped
    environment:
      SERVICE_NAME: billing-service
      NODE_ENV: production
      BILLING_SERVICE_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=256'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-aquaculture}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DATABASE_SYNC: "false" # ARCH-DB-001: Production'da synchronize kapalı, migration kullanılmalı
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: nats://${NATS_USER:-nats_internal}:${NATS_PASS:-nats_s3cure_default_ch4nge_m3}@nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  hr-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/hr-service:latest
    container_name: aqua-hr
    restart: unless-stopped
    environment:
      SERVICE_NAME: hr-service
      NODE_ENV: production
      HR_SERVICE_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=256'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-aquaculture}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DATABASE_SYNC: "false" # ARCH-DB-001: Production'da synchronize kapalı, migration kullanılmalı
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: nats://${NATS_USER:-nats_internal}:${NATS_PASS:-nats_s3cure_default_ch4nge_m3}@nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  hydroponics-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/hydroponics-service:latest
    container_name: aqua-hydroponics
    restart: unless-stopped
    environment:
      SERVICE_NAME: hydroponics-service
      NODE_ENV: production
      HYDROPONICS_SERVICE_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=256'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-aquaculture}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DATABASE_SYNC: "false" # ARCH-DB-001: Production'da synchronize kapalı, migration kullanılmalı
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: nats://${NATS_USER:-nats_internal}:${NATS_PASS:-nats_s3cure_default_ch4nge_m3}@nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  notification-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/notification-service:latest
    container_name: aqua-notification
    restart: unless-stopped
    environment:
      SERVICE_NAME: notification-service
      NODE_ENV: production
      NOTIFICATION_SERVICE_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=256'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-aquaculture}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DATABASE_SYNC: "false" # ARCH-DB-001: Production'da synchronize kapalı, migration kullanılmalı
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: nats://${NATS_USER:-nats_internal}:${NATS_PASS:-nats_s3cure_default_ch4nge_m3}@nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - aqua-internal
      - aqua-network  # needs internet for external SMTP email delivery
    deploy:
