# =============================================================================
# DigitalOcean Production Deployment - Optimized
#
# Features:
# - Parallel Docker builds with matrix strategy (9 backend + 7 frontend)
# - Registry cache (unlimited size, no 10GB GHA limit)
# - Pre-built images pulled on server (no rebuild!)
# - Nx Cloud remote caching for build artifacts
# - Zero-downtime deployment with health checks
# =============================================================================

name: Deploy to DigitalOcean (Optimized)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (comma-separated, or "all")'
        required: false
        default: 'all'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  TAG: ${{ github.sha }}

# Cancel in-progress deploys for the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Detect Changes - Only build what changed
  # ===========================================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend_services: ${{ steps.changes.outputs.backend_services }}
      frontend_modules: ${{ steps.changes.outputs.frontend_modules }}
      has_backend_changes: ${{ steps.changes.outputs.has_backend_changes }}
      has_frontend_changes: ${{ steps.changes.outputs.has_frontend_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          # Get changed files
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || echo "")

          # Backend services matrix
          BACKEND_SERVICES='["gateway-api","auth-service","farm-service","sensor-service","alert-engine","billing-service","hr-service","notification-service","admin-api-service"]'

          # Frontend modules matrix
          FRONTEND_MODULES='["shell","dashboard","farm-module","hr-module","sensor-module","admin-panel","tenant-admin"]'

          # Check for shared library changes (rebuild all if libs changed)
          if echo "$CHANGED_FILES" | grep -q "^libs/"; then
            echo "Shared libs changed - rebuilding all services"
            HAS_BACKEND=true
            HAS_FRONTEND=true
          else
            # Check backend changes
            HAS_BACKEND=$(echo "$CHANGED_FILES" | grep -q "^apps/.*-service\|^apps/gateway-api\|^apps/alert-engine" && echo true || echo false)
            # Check frontend changes
            HAS_FRONTEND=$(echo "$CHANGED_FILES" | grep -q "^web/\|^apps/.*-module\|^apps/.*-panel" && echo true || echo false)
          fi

          # For workflow_dispatch, build all
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.services }}" == "all" ]; then
              HAS_BACKEND=true
              HAS_FRONTEND=true
            fi
          fi

          echo "backend_services=$BACKEND_SERVICES" >> $GITHUB_OUTPUT
          echo "frontend_modules=$FRONTEND_MODULES" >> $GITHUB_OUTPUT
          echo "has_backend_changes=$HAS_BACKEND" >> $GITHUB_OUTPUT
          echo "has_frontend_changes=$HAS_FRONTEND" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Build & Test with Nx (Cached)
  # ===========================================================================
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            nx-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint & Test (affected)
        run: npx nx affected -t lint test --parallel=3
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: Build all services
        run: npx nx run-many -t build --all --parallel=4
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ===========================================================================
  # Build Backend Docker Images (Parallel Matrix)
  # ===========================================================================
  build-backend-images:
    needs: [detect-changes, build-and-test]
    if: needs.detect-changes.outputs.has_backend_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.backend_services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.backend.simple
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ env.TAG }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:buildcache,mode=max

  # ===========================================================================
  # Build Frontend Docker Images (Parallel Matrix)
  # ===========================================================================
  build-frontend-images:
    needs: [detect-changes, build-and-test]
    if: needs.detect-changes.outputs.has_frontend_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.frontend_modules) }}
        include:
          - module: shell
            dockerfile: infrastructure/docker/Dockerfile.shell
            module_path: web/shell
          - module: dashboard
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/dashboard
          - module: farm-module
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/farm-module
          - module: hr-module
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/hr-module
          - module: sensor-module
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/sensor-module
          - module: admin-panel
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/admin-panel
          - module: tenant-admin
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/tenant-admin
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.module }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:${{ env.TAG }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:latest
          build-args: |
            MODULE_PATH=${{ matrix.module_path }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:buildcache,mode=max

  # ===========================================================================
  # Deploy to DigitalOcean (Pull Pre-built Images)
  # ===========================================================================
  deploy:
    needs: [build-backend-images, build-frontend-images]
    if: always() && (needs.build-backend-images.result == 'success' || needs.build-backend-images.result == 'skipped') && (needs.build-frontend-images.result == 'success' || needs.build-frontend-images.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /var/aqua-saas

            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images (NO REBUILD!)
            echo "Pulling latest images..."
            docker compose -f docker-compose.prod.yml pull

            # Rolling update with zero downtime
            echo "Starting rolling update..."
            docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans

            # Wait for services to be healthy
            echo "Waiting for services to be healthy..."
            sleep 30

            # Health check
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Deployment successful!"
            else
              echo "Health check failed, but containers are running"
            fi

            # Cleanup old images
            docker image prune -f --filter "until=24h"

            echo "Deployment completed at $(date)"

      - name: Verify deployment
        run: |
          sleep 10
          # Add your production URL health check here
          # curl -sf https://your-domain.com/health || exit 1
          echo "Deployment verification passed"

  # ===========================================================================
  # Notify on Completion
  # ===========================================================================
  notify:
    needs: [deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.deploy.result }}
          channel: '#deployments'
          text: |
            DigitalOcean Deployment: ${{ needs.deploy.result }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Actor: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
