[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
# Workspace members carry `license = "Proprietary"` (publish = false, first-
# party). "Proprietary" is not a valid SPDX identifier, so cargo-deny would
# otherwise flag them as unlicensed. private.ignore tells cargo-deny to skip
# license enforcement for crates that are workspace-private — exactly the
# semantic we want. Third-party deps still go through the SPDX allow list above.
private = { ignore = true }

[[licenses.exceptions]]
allow = ["OpenSSL"]
name = "ring"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# OpenSSL banned platform-wide — rustls only (matches sens-api-gateway policy).
# In-process cert handling: use rustls + x509-parser + pem.
# Dependency bypasses go through ADR amendment, not deny.toml exceptions.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
