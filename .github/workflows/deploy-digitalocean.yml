# =============================================================================
# DigitalOcean Droplet Deployment — Selective (Affected-Only) Build & Deploy
#
# PERF-CI-001: Only builds/deploys services affected by the commit.
#   - Uses `deployed/production` git tag as baseline for change detection
#   - Dynamic matrix: only affected services get Docker images built
#   - Selective deploy: `docker compose up -d --no-deps` instead of full down/up
#   - workflow_dispatch "all" falls back to full rebuild/deploy
#
# Previous fixes preserved:
# - SEC-CI-001: GHCR login uses GITHUB_TOKEN + github.actor
# - SEC-CI-002: All third-party actions pinned to full commit SHAs
# - SEC-CI-005: DROPLET_HOST echo removed from verify step
# - SEC-CI-007: npm tarball integrity verified against package-lock.json sha512
# - SEC-CI-011/ARCH-CI-006: github.sha removed from NX cache key
# - SEC-CI-012: git checkout pinned to github.sha instead of git pull
# - ARCH-CI-002: buildcache tags namespaced with -main suffix
# - ARCH-CI-007: Image digest capture + rollback on failed health check
# - ARCH-CI-010: Split build into separate backend/frontend jobs
# - ARCH-CI-011: NX binary verified after manual install
# - ARCH-CI-015: max-parallel increased to 6
# =============================================================================

name: Deploy to DigitalOcean

on:
  # Reusable subworkflow: invoked from .github/workflows/ci-affected.yml
  # as the final job after lint/type-check/test/build all pass on push to
  # main. Replaces the previous `workflow_run` event-chain trigger which
  # has a known fragility: GitHub silently stops registering the chain
  # if the workflow file fails its internal schema validation, with no
  # surfaced error. workflow_call is a synchronous subworkflow call —
  # if it cannot start, CI Affected itself fails (visible signal),
  # rather than the deploy silently no-firing (invisible failure mode).
  workflow_call:
    # WHY `deployed` exists (INFRA-MEDIUM-005): the caller's
    # `needs.deploy.result == 'success'` only proves this WORKFLOW did not
    # fail — the internal `deploy` job is legitimately SKIPPED on no-op
    # pushes (docs/registry-only), yet the workflow still concludes
    # success and the caller would run post-deploy verification against a
    # deployment that never happened (false-negative red on every
    # ceremony commit). This output is the explicit "production was
    # actually mutated" contract.
    outputs:
      deployed:
        description: 'true only when the production droplet deploy step ran and succeeded'
        value: ${{ jobs.deploy.outputs.performed == 'true' }}
    inputs:
      services:
        description: 'Services to deploy (comma-separated, "all", or "auto")'
        required: false
        type: string
        default: 'auto'
      bypass_staging_gate:
        description: 'EMERGENCY ONLY — bypass the staging-success gate.'
        required: false
        type: string
        default: 'false'
      bypass_reason:
        description: 'Required when bypass_staging_gate=true.'
        required: false
        type: string
        default: ''
      no_cache:
        description: 'Build images without the registry buildcache (clean rebuild for suspected stale/poisoned cache layers).'
        required: false
        type: string
        default: 'false'
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (comma-separated, or "all")'
        required: false
        default: 'all'
      # WS9 / ADR-016 Phase D — staging gate bypass.
      # Normal flow: staging deploy must succeed first (tag `deployed/staging-<sha>`).
      # Set this to 'true' ONLY for genuine emergency hotfixes when staging is
      # broken and a prod fix cannot wait. The bypass is logged and the deploy
      # banner warns loudly — this is not a business-as-usual switch.
      #
      # NOTE: `type: string` (not `boolean`) — kept identical to the
      # workflow_call inputs above so a single bash check works for both
      # invocation paths. The historical `type: boolean` was suspected of
      # tripping GitHub's schema validation on the workflow_run path and
      # was eliminated in TRACK A.
      bypass_staging_gate:
        description: 'EMERGENCY ONLY — bypass the staging-success gate. Document the reason below.'
        required: false
        type: string
        default: 'false'
      bypass_reason:
        description: 'Required when bypass_staging_gate=true. Why is staging being skipped? (e.g. "staging droplet offline; CVE-XXXX-YYYY fix")'
        required: false
        default: ''
      # `type: string` — same single-bash-check contract as the workflow_call
      # inputs above (see the TRACK A note on bypass_staging_gate).
      no_cache:
        description: 'Build images without the registry buildcache (clean rebuild for suspected stale/poisoned cache layers).'
        required: false
        default: 'false'

# Permissions are declared explicitly here so workflow_call invocations
# from ci-affected.yml (which restricts to `contents: read`) can still
# push images and tags. The called workflow's permissions OVERRIDE the
# caller's when declared at this top level.
permissions:
  contents: write # push deployed/production after successful full deploys
  packages: write # push container images to GHCR
  id-token: write # OIDC for GHCR auth where used

env:
  REGISTRY: ghcr.io
  TAG: ${{ github.sha }}

# Production has exactly one writer. Manual and automated deploys share a
# concurrency group so they cannot mutate the droplet concurrently.
concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Production remains fail-closed while backup/restore evidence is being
  # established. The only unlock is the protected repository variable; no
  # workflow_dispatch input or staging bypass can override this stop-line.
  production-deploy-lock:
    name: Production deployment stop-line
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.lock.outputs.enabled }}
    steps:
      - name: Evaluate protected production release switch
        id: lock
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: |
          if [ "${PRODUCTION_DEPLOY_ENABLED}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Production deployment stop-line is unlocked by protected repository policy."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Production deployment is locked. Backup and isolated restore proof are required before enabling releases."
          fi

  # ===========================================================================
  # Staging Gate (WS9 / ADR-016 Phase D)
  #
  # Asserts that this SHA has already succeeded on staging, i.e. that the
  # `deployed/staging-<sha>` tag exists in origin. This is the architectural
  # guarantee that "CI green + staging green" is the floor for any prod
  # deploy — the 2026-04-14 cascade would have been caught here.
  #
  # The gate waits up to STAGING_GATE_TIMEOUT for the tag to appear (staging
  # deploy runs in parallel on push-to-main and typically finishes before
  # prod's own CI-gate). If the tag never arrives, the job fails fast and
  # prod deploy is blocked.
  #
  # Emergency bypass (workflow_dispatch only):
  #   Set `bypass_staging_gate: true` + a documented reason. The gate job
  #   will log the bypass loudly and continue. Use for CVE hotfixes or
  #   when staging itself is down.
  # ===========================================================================
  staging-gate:
    needs: [production-deploy-lock]
    # workflow_call is invoked from ci-affected.yml's `deploy` job which
    # depends on `[install, detect-changes]`. On push to main those are
    # the only jobs that run (lint/test/build/type-check are PR-gates by
    # design — the merge gate is the PR review). So this `if:` doesn't
    # claim "every CI gate green" — it gates on event source only, and
    # the actual quality assurance is the PR review gate that must have
    # passed before the commit reached main.
    if: >-
      needs.production-deploy-lock.outputs.enabled == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60 # staging deploy typically lands in ~30 min
    steps:
      # ────────────────────────────────────────────────────────────────────
      # WS9 / ADR-016 Phase D — topology-aware enablement gate.
      #
      # Two architecturally-valid topologies are supported. The gate
      # auto-bypasses on the explicit repo variable:
      #
      #   1. `vars.STAGING_ENABLED` repo variable not set to 'true' (the
      #      operator's explicit opt-in flag).
      #
      # Prod never reads staging environment-scoped secrets. When
      # STAGING_ENABLED=true, the only accepted proof is the
      # deployed/staging-<sha> tag emitted by deploy-staging.yml.
      #
      # Operator workflow (Topology A — multi-droplet, gate enforces):
      #   1. terraform apply infrastructure/terraform/modules/staging-droplet/
      #   2. seed staging .env (per docs/runbooks/staging-environment.md)
      #   3. Settings → Environments → staging → add STAGING_DROPLET_HOST,
      #      STAGING_DROPLET_USER, STAGING_DROPLET_SSH_KEY secrets
      #   4. Settings → Variables → set STAGING_ENABLED=true
      #   5. From this point on, every prod deploy waits for the
      #      `deployed/staging-<sha>` tag emitted by deploy-staging.yml.
      #
      # Topology B (single-droplet, gate auto-bypasses) is the default
      # state at repo init and after `STAGING_ENABLED=false` rollback —
      # no operator action required.
      # ────────────────────────────────────────────────────────────────────
      - name: Check staging enablement (topology detection)
        id: enablement
        run: |
          set -euo pipefail
          ENABLED='${{ vars.STAGING_ENABLED }}'

          # Signal 1 — operator opt-in flag
          if [ "${ENABLED}" != "true" ]; then
            echo "::notice::STAGING_ENABLED repo variable is not 'true' (Topology B: single-droplet)."
            echo "::notice::Skipping staging-gate — staging environment not opted-in."
            echo "::notice::See docs/runbooks/staging-environment.md to enable Topology A."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::Staging configured (Topology A) — gate will assert deployed/staging-<sha> tag."
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check bypass / capture reason
        id: bypass
        if: steps.enablement.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # workflow_dispatch populates `github.event.inputs.X`;
          # workflow_call populates `inputs.X`. Read both so the gate
          # behaves identically regardless of how the workflow was
          # invoked. Default 'false' / '' so an unset input never
          # silently treated as bypass=true.
          #
          # NOTE: outer double-quotes here, inner single-quotes in the
          # GitHub expression. Mixing the same quote style nests
          # incorrectly and breaks GitHub's stricter workflow-file
          # parser (Python yaml.safe_load is lenient about it; the
          # GitHub schema is not).
          BYPASS="${{ inputs.bypass_staging_gate || github.event.inputs.bypass_staging_gate || 'false' }}"
          REASON="${{ inputs.bypass_reason || github.event.inputs.bypass_reason || '' }}"

          if [ "${BYPASS}" = "true" ]; then
            if [ -z "${REASON}" ]; then
              echo "::error::bypass_staging_gate=true REQUIRES a non-empty bypass_reason."
              echo "  Staging bypass is for emergencies only. Document the incident before skipping."
              exit 1
            fi
            echo "::warning::STAGING GATE BYPASSED — reason: ${REASON}"
            echo "::warning::Logged bypass initiated by ${{ github.actor }} at $(date -u +%FT%TZ)"
            echo "bypass=true" >> "$GITHUB_OUTPUT"
          else
            echo "bypass=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert deployed/staging-<sha> tag
        if: steps.enablement.outputs.skip != 'true' && steps.bypass.outputs.bypass != 'true'
        run: |
          set -euo pipefail

          TAG_NAME="deployed/staging-${{ github.sha }}"
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # Poll for up to STAGING_GATE_TIMEOUT seconds, checking every
          # STAGING_GATE_POLL_INTERVAL. Staging workflow typically completes
          # in 25-35 minutes for a full build.
          STAGING_GATE_TIMEOUT=${STAGING_GATE_TIMEOUT:-3300}   # 55 min
          STAGING_GATE_POLL_INTERVAL=${STAGING_GATE_POLL_INTERVAL:-30}

          DEADLINE=$(( $(date +%s) + STAGING_GATE_TIMEOUT ))
          ATTEMPT=0

          echo "Waiting for staging tag: ${TAG_NAME}"
          echo "  Timeout: ${STAGING_GATE_TIMEOUT}s"
          echo "  Poll:    ${STAGING_GATE_POLL_INTERVAL}s"

          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            if git ls-remote --tags "${REPO}" "refs/tags/${TAG_NAME}" 2>/dev/null | grep -q "${TAG_NAME}"; then
              echo "  attempt=${ATTEMPT}: TAG FOUND — staging deploy succeeded for this SHA."
              exit 0
            fi
            REMAINING=$(( DEADLINE - $(date +%s) ))
            echo "  attempt=${ATTEMPT}: tag not yet present (remaining=${REMAINING}s); sleeping ${STAGING_GATE_POLL_INTERVAL}s..."
            sleep "${STAGING_GATE_POLL_INTERVAL}"
          done

          echo "::error::staging gate TIMED OUT after ${STAGING_GATE_TIMEOUT}s."
          echo "  Tag ${TAG_NAME} was never pushed by deploy-staging.yml."
          echo "  Either staging deploy failed, staging droplet is offline,"
          echo "  or CI is behind and staging did not trigger."
          echo ""
          echo "  To diagnose: open the 'Deploy to DigitalOcean (Staging)' workflow"
          echo "  for commit ${{ github.sha }} in the Actions tab."
          echo ""
          echo "  To bypass (EMERGENCY ONLY): re-run this workflow via"
          echo "  workflow_dispatch with bypass_staging_gate=true and a"
          echo "  bypass_reason describing the incident."
          exit 1

      - name: Gate summary
        run: |
          if [ "${{ steps.enablement.outputs.skip }}" = "true" ]; then
            echo "Staging gate: SKIPPED (Topology B: single-droplet, or staging not yet provisioned)."
            echo "  STAGING_ENABLED is not 'true'; bypass is explicit and logged."
          elif [ "${{ steps.bypass.outputs.bypass }}" = "true" ]; then
            echo "Staging gate: BYPASSED (emergency — see earlier warning)."
          else
            echo "Staging gate: PASSED — deployed/staging-${{ github.sha }} exists."
          fi

  # ===========================================================================
  # Release verification gates
  #
  # Manual and push-to-main deploys must prove the same release contracts before
  # touching the droplet. This catches type/spec drift, migration-runner drift,
  # manifest drift, and compose drift before SSH can mutate live containers.
  # ===========================================================================
  release-verification:
    needs: [staging-gate]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Install Linux platform binaries
        uses: ./.github/actions/install-platform-binaries

      - name: Run release verification gates
        run: |
          npm run type-check
          npm run gates:type-check-spec
          npm run invariants:fast
          npm run gates:schema-drift-registration
          npm run gates:criticality-manifest
          npm run gates:signals-manifest
          node tools/toolchain/run.mjs npx nx test db-migrate
          bash scripts/ci/validate-deploy-ssot.sh

      - name: Compose preflight (droplet + staging overlay)
        run: |
          set -euo pipefail
          ENV_FILE="$(mktemp)"
          perl -ne 'while (/\$\{([A-Z0-9_]+):\?[^}]+\}/g) { print "$1\n" }' \
            docker-compose.droplet.yml docker-compose.staging.yml | sort -u | while read -r key; do
            [ -n "$key" ] || continue
            printf '%s=%s\n' "$key" "ci-preflight-${key,,}" >> "$ENV_FILE"
          done
          {
            echo "TAG=${{ github.sha }}"
            echo "IMAGE_TAG=staging-${{ github.sha }}"
            echo "COMPOSE_PROFILES="
          } >> "$ENV_FILE"
          docker compose --env-file "$ENV_FILE" -f docker-compose.droplet.yml config --quiet
          docker compose --env-file "$ENV_FILE" -f docker-compose.droplet.yml -f docker-compose.staging.yml config --quiet

  # ===========================================================================
  # Prepare - Detect affected services & build dynamic matrices
  # ===========================================================================
  prepare:
    needs: [staging-gate, release-verification]
    # CI-success precondition is now implicit: workflow_call is only
    # invoked from ci-affected.yml's final `deploy` job after all other
    # jobs are green. workflow_dispatch is operator-initiated.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.vars.outputs.image_prefix }}
      has_backend_changes: ${{ steps.detect.outputs.has_backend }}
      has_frontend_changes: ${{ steps.detect.outputs.has_frontend }}
      has_infra_image_changes: ${{ steps.detect.outputs.has_infra_image }}
      affected_backend: ${{ steps.detect.outputs.affected_backend }}
      affected_frontend_matrix: ${{ steps.detect.outputs.affected_frontend_matrix }}
      affected_infra_image_matrix: ${{ steps.detect.outputs.affected_infra_image_matrix }}
      backend_csv: ${{ steps.detect.outputs.backend_csv }}
      nx_frontend_csv: ${{ steps.detect.outputs.nx_frontend_csv }}
      non_nx_frontend_csv: ${{ steps.detect.outputs.non_nx_frontend_csv }}
      deploy_services: ${{ steps.detect.outputs.deploy_services }}
      full_deploy: ${{ steps.detect.outputs.full_deploy }}
      deploy_mode: ${{ steps.detect.outputs.deploy_mode }}
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set variables
        id: vars
        run: |
          # GHCR requires lowercase image paths
          REPO="${{ github.repository }}"
          echo "image_prefix=ghcr.io/${REPO,,}" >> $GITHUB_OUTPUT

      - name: Detect affected services
        id: detect
        run: |
          set -euo pipefail

          # ── Service definitions from generated platform service catalog ──
          CATALOG_DEPLOY_ENV="infrastructure/deploy/service-catalog.deploy.vars"
          if [ ! -r "${CATALOG_DEPLOY_ENV}" ]; then
            echo "::error::Missing generated service catalog deploy artifact: ${CATALOG_DEPLOY_ENV}"
            echo "Run npm run service-catalog:generate and commit the generated artifact."
            exit 1
          fi
          # shellcheck source=infrastructure/deploy/service-catalog.deploy.vars
          . "${CATALOG_DEPLOY_ENV}"
          read -r -a ALL_BACKEND <<< "${CATALOG_BACKEND_IMAGE_SERVICES:?generated backend image services missing}"
          read -r -a ALL_FRONTEND <<< "${CATALOG_FRONTEND_IMAGE_SERVICES:?generated frontend image services missing}"
          read -r -a ALL_INFRA_IMAGES <<< "${CATALOG_INFRA_IMAGE_SERVICES:?generated infra image services missing}"
          read -r -a NX_FRONTEND <<< "${CATALOG_NX_FRONTEND_PROJECTS:-}"
          read -r -a NON_NX_FRONTEND <<< "${CATALOG_NON_NX_FRONTEND_PROJECTS:-}"

          AFFECTED_BACKEND=()
          AFFECTED_FRONTEND=()
          AFFECTED_INFRA_IMAGES=()
          FULL_DEPLOY=false
          DEPLOY_MODE="auto_selective"
          REQUESTED_SERVICES="${{ inputs.services || github.event.inputs.services || 'all' }}"
          REQUESTED_SERVICES="$(echo "${REQUESTED_SERVICES}" | xargs)"

          append_backend_once() {
            local svc="$1"
            case " ${AFFECTED_BACKEND[*]} " in
              *" ${svc} "*) ;;
              *) AFFECTED_BACKEND+=("${svc}") ;;
            esac
          }

          # ── Case 1: workflow_dispatch/workflow_call with specific services ──
          if [ "${REQUESTED_SERVICES}" != "all" ] && [ "${REQUESTED_SERVICES}" != "auto" ] && [ -n "${REQUESTED_SERVICES}" ]; then
            echo "Mode: specific services (${REQUESTED_SERVICES})"
            IFS=',' read -ra SPECIFIED <<< "${REQUESTED_SERVICES}"
            for svc in "${SPECIFIED[@]}"; do
              svc=$(echo "$svc" | xargs)
              for b in "${ALL_BACKEND[@]}"; do
                [ "$b" = "$svc" ] && append_backend_once "$svc" && break
              done
              for f in "${ALL_FRONTEND[@]}"; do
                [ "$f" = "$svc" ] && AFFECTED_FRONTEND+=("$svc") && break
              done
              for i in "${ALL_INFRA_IMAGES[@]}"; do
                [ "$i" = "$svc" ] && AFFECTED_INFRA_IMAGES+=("$svc") && break
              done
            done

            git fetch --force origin refs/tags/deployed/production:refs/tags/deployed/production 2>/dev/null || true
            DEPLOY_BASE=$(git rev-parse deployed/production 2>/dev/null || echo "")
            MIGRATION_OWNER_SERVICES="$(node scripts/deploy/resolve-migration-owner-services.mjs "${DEPLOY_BASE}" "${{ github.sha }}")"
            if [ -n "${MIGRATION_OWNER_SERVICES}" ]; then
              echo "  Migration owner services since deployed/production: ${MIGRATION_OWNER_SERVICES}"
              for svc in ${MIGRATION_OWNER_SERVICES}; do
                append_backend_once "$svc"
              done
            fi

          # ── Case 2: explicit "all" from workflow_dispatch or workflow_call ──
          elif [ "${REQUESTED_SERVICES}" = "all" ]; then
            echo "Mode: ALL"
            AFFECTED_BACKEND=("${ALL_BACKEND[@]}")
            AFFECTED_FRONTEND=("${ALL_FRONTEND[@]}")
            AFFECTED_INFRA_IMAGES=("${ALL_INFRA_IMAGES[@]}")
            FULL_DEPLOY=true
            DEPLOY_MODE="full"

          # ── Case 3: workflow_call (push from CI) or other — detect from
          #   the deployed/production tag. Computes the diff against the
          #   last successful prod deploy so only services actually
          #   touched since then get rebuilt + redeployed.
          else
            echo "Mode: workflow_call/push — detecting changes since last deploy"
            DEPLOY_BASE=$(git rev-parse deployed/production 2>/dev/null || echo "")
            if [ -z "$DEPLOY_BASE" ]; then
              echo "  No deployed/production tag found — full deploy"
              AFFECTED_BACKEND=("${ALL_BACKEND[@]}")
              AFFECTED_FRONTEND=("${ALL_FRONTEND[@]}")
              AFFECTED_INFRA_IMAGES=("${ALL_INFRA_IMAGES[@]}")
              FULL_DEPLOY=true
              DEPLOY_MODE="full"
            else
              echo "  Baseline: ${DEPLOY_BASE} (deployed/production)"
              echo "  Head:     ${{ github.sha }}"
              CHANGED=$(git diff --name-only "$DEPLOY_BASE" "${{ github.sha }}" 2>/dev/null || echo "ALL")

              if [ "$CHANGED" = "ALL" ]; then
                echo "  git diff failed — full deploy"
                AFFECTED_BACKEND=("${ALL_BACKEND[@]}")
                AFFECTED_FRONTEND=("${ALL_FRONTEND[@]}")
                AFFECTED_INFRA_IMAGES=("${ALL_INFRA_IMAGES[@]}")
                FULL_DEPLOY=true
                DEPLOY_MODE="full"
              else
                echo "  Changed files: $(echo "$CHANGED" | wc -l)"

                # Shared deps / infra → rebuild everything
                if echo "$CHANGED" | grep -qE "^(libs/|platform/|\.github/|infrastructure/|scripts/deploy/|docker-compose|nx\.json$)" || \
                   echo "$CHANGED" | grep -qE "^package(-lock)?\.json$" || \
                   echo "$CHANGED" | grep -qE "^tsconfig" || \
                   echo "$CHANGED" | grep -qE "^apps/[^/]+/src/(database/)?migrations/"; then
                  echo "  Schema/shared/infra/workflow/package change detected — full deploy"
                  AFFECTED_BACKEND=("${ALL_BACKEND[@]}")
                  AFFECTED_FRONTEND=("${ALL_FRONTEND[@]}")
                  AFFECTED_INFRA_IMAGES=("${ALL_INFRA_IMAGES[@]}")
                  FULL_DEPLOY=true
                  DEPLOY_MODE="full"
                else
                  # Detect individual backend services
                  for svc in "${ALL_BACKEND[@]}"; do
                    if echo "$CHANGED" | grep -q "^apps/${svc}/"; then
                      AFFECTED_BACKEND+=("$svc")
                    fi
                  done

                  if echo "$CHANGED" | grep -q "^infrastructure/mosquitto/"; then
                    AFFECTED_INFRA_IMAGES+=("mosquitto")
                  fi

                  # WS10: db-migrate bundles every service's migration files
                  # (per apps/db-migrate/tsconfig.build.json). A migration
                  # change in any service MUST also rebuild db-migrate so
                  # the one-shot container ships with the latest migration
                  # class set. apps/db-migrate/ itself is already covered by
                  # the ALL_BACKEND loop above; this rule catches migration
                  # changes under other services' trees.
                  if echo "$CHANGED" | grep -qE "^apps/[^/]+/src/(database/)?migrations/"; then
                    case " ${AFFECTED_BACKEND[*]} " in
                      *" db-migrate "*) ;;  # already flagged
                      *) AFFECTED_BACKEND+=("db-migrate") ;;
                    esac
                  fi

                  # Detect individual frontend modules
                  SHARED_UI_CHANGED=false
                  if echo "$CHANGED" | grep -q "^web/shared-ui/"; then
                    SHARED_UI_CHANGED=true
                  fi

                  if [ "$SHARED_UI_CHANGED" = "true" ]; then
                    echo "  web/shared-ui changed — all frontend affected"
                    AFFECTED_FRONTEND=("${ALL_FRONTEND[@]}")
                  else
                    if echo "$CHANGED" | grep -q "^web/shell/"; then
                      AFFECTED_FRONTEND+=("shell")
                    fi
                    for mod in dashboard farm-module sensor-module admin-panel tenant-admin hr-module hydroponics-module; do
                      if echo "$CHANGED" | grep -q "^web/modules/${mod}/"; then
                        AFFECTED_FRONTEND+=("$mod")
                      fi
                    done
                    if echo "$CHANGED" | grep -q "^web/apps/aquamobil/"; then
                      AFFECTED_FRONTEND+=("aquamobil")
                    fi
                  fi
                fi
              fi
            fi
          fi

          # db-migrate is the release's schema-writer image. Build and deploy
          # it for every deploy, including frontend-only selective deploys, so
          # the droplet never falls back to a mutable `latest` migration bundle.
          if [ "$FULL_DEPLOY" != "true" ] && { [ ${#AFFECTED_BACKEND[@]} -gt 0 ] || [ ${#AFFECTED_FRONTEND[@]} -gt 0 ]; }; then
            case " ${AFFECTED_BACKEND[*]} " in
              *" db-migrate "*) ;;
              *) AFFECTED_BACKEND=("db-migrate" "${AFFECTED_BACKEND[@]}") ;;
            esac
          fi

          # ── Generate outputs ──

          # JSON arrays (compact, single-line)
          if [ ${#AFFECTED_BACKEND[@]} -gt 0 ]; then
            BACKEND_JSON=$(printf '%s\n' "${AFFECTED_BACKEND[@]}" | jq -Rc . | jq -sc .)
          else
            BACKEND_JSON="[]"
          fi

          if [ ${#AFFECTED_FRONTEND[@]} -gt 0 ]; then
            FE_MATRIX=$(node -e 'const fs=require("fs"); const selected=new Set(process.argv.slice(1)); const data=JSON.parse(fs.readFileSync("infrastructure/deploy/service-catalog.generated.json","utf8")); const matrix=(data.deploy?.frontendImageMatrix ?? []).filter((entry)=>selected.has(entry.module)); if (matrix.length !== selected.size) { const known=new Set(matrix.map((entry)=>entry.module)); const missing=[...selected].filter((name)=>!known.has(name)); throw new Error(`Unknown frontend deploy matrix service(s): ${missing.join(", ")}`); } console.log(JSON.stringify(matrix));' "${AFFECTED_FRONTEND[@]}")
          else
            FE_MATRIX="[]"
          fi

          if [ ${#AFFECTED_INFRA_IMAGES[@]} -gt 0 ]; then
            INFRA_MATRIX=$(node -e 'const fs=require("fs"); const selected=new Set(process.argv.slice(1)); const data=JSON.parse(fs.readFileSync("infrastructure/deploy/service-catalog.generated.json","utf8")); const matrix=(data.deploy?.infraImageMatrix ?? []).filter((entry)=>selected.has(entry.image)); if (matrix.length !== selected.size) { const known=new Set(matrix.map((entry)=>entry.image)); const missing=[...selected].filter((name)=>!known.has(name)); throw new Error(`Unknown infra deploy matrix service(s): ${missing.join(", ")}`); } console.log(JSON.stringify(matrix));' "${AFFECTED_INFRA_IMAGES[@]}")
          else
            INFRA_MATRIX="[]"
          fi

          # CSV for nx run-many (backend)
          BACKEND_CSV=$(IFS=,; echo "${AFFECTED_BACKEND[*]}")

          # Split frontend into NX-managed and non-NX
          NX_FE_AFFECTED=()
          NON_NX_FE_AFFECTED=()
          for mod in "${AFFECTED_FRONTEND[@]}"; do
            for nx in "${NX_FRONTEND[@]}"; do
              [ "$nx" = "$mod" ] && NX_FE_AFFECTED+=("$mod") && continue 2
            done
            for nnx in "${NON_NX_FRONTEND[@]}"; do
              [ "$nnx" = "$mod" ] && NON_NX_FE_AFFECTED+=("$mod") && continue 2
            done
            # dockerfile-self-build targets (catalog frontendAssets field,
            # e.g. aquamobil) appear in neither generated list by design —
            # their image build compiles the assets itself.
          done
          NX_FE_CSV=$(IFS=,; echo "${NX_FE_AFFECTED[*]}")
          NON_NX_FE_CSV=$(IFS=,; echo "${NON_NX_FE_AFFECTED[*]}")

          # Compose service names for selective pull/restart
          DEPLOY_SERVICES="${AFFECTED_BACKEND[*]} ${AFFECTED_INFRA_IMAGES[*]} ${AFFECTED_FRONTEND[*]}"
          DEPLOY_SERVICES=$(echo "$DEPLOY_SERVICES" | xargs)

          HAS_BACKEND=$( [ ${#AFFECTED_BACKEND[@]} -gt 0 ] && echo true || echo false )
          HAS_FRONTEND=$( [ ${#AFFECTED_FRONTEND[@]} -gt 0 ] && echo true || echo false )
          HAS_INFRA_IMAGE=$( [ ${#AFFECTED_INFRA_IMAGES[@]} -gt 0 ] && echo true || echo false )

          # Summary
          echo "=== Affected Services ==="
          echo "  Backend (${#AFFECTED_BACKEND[@]}): ${AFFECTED_BACKEND[*]:-none}"
          echo "  Infra images (${#AFFECTED_INFRA_IMAGES[@]}): ${AFFECTED_INFRA_IMAGES[*]:-none}"
          echo "  Frontend (${#AFFECTED_FRONTEND[@]}): ${AFFECTED_FRONTEND[*]:-none}"
          echo "  Full deploy: ${FULL_DEPLOY}"
          echo "  Deploy mode: ${DEPLOY_MODE}"
          echo "  Deploy services: ${DEPLOY_SERVICES:-none}"

          # Write outputs
          echo "has_backend=${HAS_BACKEND}" >> $GITHUB_OUTPUT
          echo "has_frontend=${HAS_FRONTEND}" >> $GITHUB_OUTPUT
          echo "has_infra_image=${HAS_INFRA_IMAGE}" >> $GITHUB_OUTPUT
          echo "affected_backend=${BACKEND_JSON}" >> $GITHUB_OUTPUT
          echo "affected_frontend_matrix=${FE_MATRIX}" >> $GITHUB_OUTPUT
          echo "affected_infra_image_matrix=${INFRA_MATRIX}" >> $GITHUB_OUTPUT
          echo "backend_csv=${BACKEND_CSV}" >> $GITHUB_OUTPUT
          echo "nx_frontend_csv=${NX_FE_CSV}" >> $GITHUB_OUTPUT
          echo "non_nx_frontend_csv=${NON_NX_FE_CSV}" >> $GITHUB_OUTPUT
          echo "deploy_services=${DEPLOY_SERVICES}" >> $GITHUB_OUTPUT
          echo "full_deploy=${FULL_DEPLOY}" >> $GITHUB_OUTPUT
          echo "deploy_mode=${DEPLOY_MODE}" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Build backend artifacts (affected only)
  # ===========================================================================
  build-backend-artifacts:
    needs: [prepare]
    if: needs.prepare.outputs.has_backend_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Install Linux platform binaries
        uses: ./.github/actions/install-platform-binaries
        # Composite action — single source of truth for SWC + esbuild +
        # Rollup + NX native-binding install and eslint-plugin-aquaculture
        # resolution assertion. Prior inline copy (90+ lines) was
        # drift-prone and did not carry the plugin-resolution check.

      # PERF-CI-001: Build only affected backend services (not all 12)
      - name: Build affected backend services
        run: |
          PROJECTS="${{ needs.prepare.outputs.backend_csv }}"
          echo "Building backend projects: ${PROJECTS}"
          node tools/toolchain/run.mjs npx nx run-many -t build \
            --projects="${PROJECTS}" \
            --parallel=3 \
            --verbose
          node scripts/deploy/verify-backend-dist-provenance.mjs "${PROJECTS}"
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          NX_SKIP_NX_CACHE: 'true'
          NX_VERBOSE_LOGGING: 'true'

      # Upload backend artifacts (dist/apps/*)
      - name: Upload backend artifacts
        # SEC-CI-002: pinned to SHA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-dist
          path: dist/
          retention-days: 1

  # ===========================================================================
  # Build frontend artifacts (affected only)
  # ===========================================================================
  build-frontend-artifacts:
    needs: [prepare]
    if: needs.prepare.outputs.has_frontend_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Install Linux platform binaries
        uses: ./.github/actions/install-platform-binaries
        # Composite action — single source of truth.

      # PERF-CI-001: Build only affected frontend modules (not all 8+aquamobil)
      #
      # Build strategy — encoded in the service catalog (frontendAssets
      # field; frontendPrebuildPlan() is the SSOT split):
      #   - NX projects: built via nx run-many
      #   - Non-NX workspace modules: built via npm workspaces at the
      #     workspacePath the catalog publishes in deploy.nonNxFrontendBuild
      #   - dockerfile-self-build targets (aquamobil): in NEITHER list —
      #     their Dockerfile compiles the assets (INFRA-HIGH-005: the old
      #     `web/modules/${mod}` convention broke the first full deploy
      #     that included aquamobil)
      - name: Build affected frontend modules
        run: |
          NX_CSV="${{ needs.prepare.outputs.nx_frontend_csv }}"
          NON_NX_CSV="${{ needs.prepare.outputs.non_nx_frontend_csv }}"

          # NX-managed frontend apps
          if [ -n "$NX_CSV" ]; then
            echo "Building NX frontend projects: ${NX_CSV}"
            node tools/toolchain/run.mjs npx nx run-many -t build \
              --projects="${NX_CSV}" \
              --parallel=3 \
              --verbose
          else
            echo "No NX frontend projects affected — skipping"
          fi

          # Non-NX workspace modules (vite build, deps already hoisted to root node_modules)
          # These modules import from @aquaculture/shared-ui which resolves to web/shared-ui/dist,
          # so shared-ui must be built first. Workspace paths come from the
          # generated catalog — never reconstructed by convention.
          if [ -n "$NON_NX_CSV" ]; then
            echo "Building shared-ui (dependency for non-NX modules)"
            npm run build --workspace="web/shared-ui"

            IFS=',' read -ra NON_NX_MODS <<< "$NON_NX_CSV"
            for mod in "${NON_NX_MODS[@]}"; do
              MOD_PATH=$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync("infrastructure/deploy/service-catalog.generated.json","utf8")); const entry=(data.deploy?.nonNxFrontendBuild ?? []).find((e)=>e.module===process.argv[1]); if(!entry){throw new Error(`module ${process.argv[1]} missing from deploy.nonNxFrontendBuild — regenerate the service catalog`);} console.log(entry.workspacePath);' "$mod")
              echo "Building non-NX module: ${mod} (${MOD_PATH})"
              npm run build --workspace="${MOD_PATH}"
            done
          else
            echo "No non-NX frontend modules affected — skipping"
          fi
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          NX_SKIP_NX_CACHE: 'true'
          NX_VERBOSE_LOGGING: 'true'

      # Upload frontend artifacts (web/shell/dist + web/modules/*/dist).
      # ARCH-CI-016: Always produce a frontend-dist artifact, even when empty.
      # Downstream build-frontend-images job depends on this artifact existing.
      # Without if-no-files-found: warn, the upload fails when no modules were
      # built (e.g., only aquamobil changed). The .gitkeep placeholder ensures
      # the artifact is always non-empty, preventing "Artifact not found" errors
      # in the download step of build-frontend-images matrix entries that need it.
      - name: Ensure frontend-dist artifact is always producible
        run: mkdir -p web/.artifact-marker && echo "placeholder" > web/.artifact-marker/.gitkeep

      - name: Upload frontend artifacts
        # SEC-CI-002: pinned to SHA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: |
            web/shell/dist/
            web/modules/*/dist/
            web/.artifact-marker/
          if-no-files-found: warn
          retention-days: 1

  # ===========================================================================
  # Build Backend Docker Images (dynamic matrix — affected only)
  # ===========================================================================
  build-backend-images:
    needs: [prepare, build-backend-artifacts]
    if: needs.prepare.outputs.has_backend_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # ARCH-CI-015: Increased from 4 to 6 for fewer sequential waves
      max-parallel: 6
      matrix:
        # PERF-CI-001: Dynamic matrix — only affected backend services
        service: ${{ fromJson(needs.prepare.outputs.affected_backend) }}
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download backend artifacts
        # SEC-CI-002: pinned to SHA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-dist
          path: dist/

      # SEC-CI-002: pinned to SHA
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # ORPHAN-HIGH-076 — GHCR login retry on transient network failure.
      #
      # The previous `docker/login-action@<SHA>` had no retries; a single
      # net/http timeout between the GHA runner and ghcr.io aborted the
      # matrix shard and dragged the whole deploy down (2026-05-18 deploy
      # run 26081565625, tenant-admin shard). The native action has no
      # retry knob and `fail-fast: false` on the matrix only avoids
      # cancelling SIBLING shards — the failing shard itself still
      # produces a missing image that breaks `docker compose pull` on
      # the droplet.
      #
      # This shell loop replaces the third-party action with an explicit
      # `docker login` retry: 3 attempts, exponential-ish backoff (5s, 10s,
      # 15s). No third-party SHA-pin churn; the supply-chain surface
      # narrows by one action. `--password-stdin` keeps the token off the
      # process table even on retry. Final attempt failure exits non-zero
      # so the shard fails loud — same observable contract as the action,
      # plus transient-resilience.
      - name: Login to GHCR (3-attempt retry — ORPHAN-HIGH-076)
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "[ghcr-login] attempt ${attempt}/3"
            echo "${GHCR_PASSWORD}" | docker login "${REGISTRY}" \
              -u "${GHCR_USERNAME}" --password-stdin
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "[ghcr-login] success on attempt ${attempt}"
              exit 0
            fi
            backoff=$((attempt * 5))
            echo "[ghcr-login] attempt ${attempt} failed (rc=${rc}); sleeping ${backoff}s"
            sleep "${backoff}"
          done
          echo "[ghcr-login] 3 attempts exhausted; aborting build."
          exit 1

      # WS10: pick the right Dockerfile per service. db-migrate uses its
      # own Dockerfile (no HEALTHCHECK, one-shot CMD) while every other
      # backend shares the Dockerfile.backend.simple posture.
      - name: Select Dockerfile
        id: dockerfile
        run: |
          if [ "${{ matrix.service }}" = "db-migrate" ]; then
            echo "file=infrastructure/docker/Dockerfile.db-migrate" >> $GITHUB_OUTPUT
          else
            echo "file=infrastructure/docker/Dockerfile.backend.simple" >> $GITHUB_OUTPUT
          fi

      - name: Build and push ${{ matrix.service }}
        # SEC-CI-002: pinned to SHA
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.service }}:${{ env.TAG }}
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.service }}:latest
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          # ARCH-CI-002: Namespaced buildcache tag to avoid collision with cd-production.yml
          # ORPHAN-HIGH-381 tooling: operator-triggered clean rebuild when a
          # cached layer is suspected stale/poisoned.
          no-cache: ${{ inputs.no_cache == 'true' }}
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}/${{ matrix.service }}:buildcache-main-v2
          # ORPHAN-HIGH-079 — GHCR cache-write transient class.
          # `cache-to: type=registry` writes a buildcache manifest to GHCR
          # after every successful build. A transient GHCR 502/network blip
          # on the manifest HEAD/PUT aborts the entire matrix shard AFTER
          # the image itself built + pushed successfully — pure waste.
          # `ignore-error=true` (docker/build-push-action v6 supported)
          # downgrades cache-write failures to a warning: image is still
          # pushed; next build runs with one less cached layer. The cache
          # class is an optimization, not a correctness gate.
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}/${{ matrix.service }}:buildcache-main-v2,mode=max,ignore-error=true

  # ===========================================================================
  # Build Frontend Docker Images (dynamic matrix — affected only)
  # ===========================================================================
  build-frontend-images:
    needs: [prepare, build-frontend-artifacts]
    if: needs.prepare.outputs.has_frontend_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # ARCH-CI-015: Increased from 4 to 6
      max-parallel: 6
      matrix:
        # PERF-CI-001: Dynamic matrix — only affected frontend modules
        include: ${{ fromJson(needs.prepare.outputs.affected_frontend_matrix) }}
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Download frontend artifacts — upload strips common ancestor 'web/',
      # so we extract into 'web/' to restore original paths (web/shell/dist, web/modules/*/dist).
      # ARCH-CI-016: The upstream upload step always produces a frontend-dist artifact
      # (with at least a placeholder file), so this download never fails with "not found".
      # Aquamobil does not use the downloaded dist/ files (it builds inside its Dockerfile),
      # but downloading the artifact is harmless and avoids special-casing the matrix.
      # ARCH-CI-016: Download frontend dist artifacts for shell/MFE images.
      # Aquamobil builds entirely inside its Dockerfile and does not need
      # the downloaded artifacts, but the upstream artifact contract is still
      # fail-closed: missing artifacts indicate a broken build chain.
      - name: Download frontend artifacts
        # SEC-CI-002: pinned to SHA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-dist
          path: web

      # SEC-CI-002: pinned to SHA
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # ORPHAN-HIGH-076 — GHCR login retry on transient network failure.
      #
      # The previous `docker/login-action@<SHA>` had no retries; a single
      # net/http timeout between the GHA runner and ghcr.io aborted the
      # matrix shard and dragged the whole deploy down (2026-05-18 deploy
      # run 26081565625, tenant-admin shard). The native action has no
      # retry knob and `fail-fast: false` on the matrix only avoids
      # cancelling SIBLING shards — the failing shard itself still
      # produces a missing image that breaks `docker compose pull` on
      # the droplet.
      #
      # This shell loop replaces the third-party action with an explicit
      # `docker login` retry: 3 attempts, exponential-ish backoff (5s, 10s,
      # 15s). No third-party SHA-pin churn; the supply-chain surface
      # narrows by one action. `--password-stdin` keeps the token off the
      # process table even on retry. Final attempt failure exits non-zero
      # so the shard fails loud — same observable contract as the action,
      # plus transient-resilience.
      - name: Login to GHCR (3-attempt retry — ORPHAN-HIGH-076)
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "[ghcr-login] attempt ${attempt}/3"
            echo "${GHCR_PASSWORD}" | docker login "${REGISTRY}" \
              -u "${GHCR_USERNAME}" --password-stdin
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "[ghcr-login] success on attempt ${attempt}"
              exit 0
            fi
            backoff=$((attempt * 5))
            echo "[ghcr-login] attempt ${attempt} failed (rc=${rc}); sleeping ${backoff}s"
            sleep "${backoff}"
          done
          echo "[ghcr-login] 3 attempts exhausted; aborting build."
          exit 1

      - name: Build and push ${{ matrix.module }}
        # SEC-CI-002: pinned to SHA
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.module }}:${{ env.TAG }}
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.module }}:latest
          build-args: |
            MODULE_PATH=${{ matrix.module_path }}
          # ARCH-CI-002: Namespaced buildcache tag to avoid collision with cd-production.yml
          no-cache: ${{ inputs.no_cache == 'true' }}
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}/${{ matrix.module }}:buildcache-main-v2
          # ORPHAN-HIGH-079 — same cache-write transient class as backend matrix above.
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}/${{ matrix.module }}:buildcache-main-v2,mode=max,ignore-error=true

  # ===========================================================================
  # Build infrastructure-owned app images (registry-only; never built on droplet)
  # ===========================================================================
  build-infra-images:
    needs: [prepare]
    if: needs.prepare.outputs.has_infra_image_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.affected_infra_image_matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve immutable Postgres DR contract digest
        id: postgres_dr_contract
        run: |
          set -euo pipefail
          CONTRACT_MANIFEST=.github/manifests/postgres-dr-contract.sha256
          test -f "${CONTRACT_MANIFEST}"
          test ! -L "${CONTRACT_MANIFEST}"
          EXPECTED_CONTRACT_PATHS=$(printf '%s\n' \
            infrastructure/docker/Dockerfile.postgres-walg \
            infrastructure/docker/scripts/postgres-ssl-entrypoint.sh \
            infrastructure/docker/scripts/postgres-walg-healthcheck.sh \
            infrastructure/docker/scripts/walg-archive-command.sh \
            infrastructure/docker/scripts/walg-load-secrets.sh \
            infrastructure/docker/scripts/walg-restore-command.sh \
            infrastructure/docker/scripts/walg-runtime-command.sh)
          CANONICAL_LINE_RE='^[0-9a-f]{64}  [A-Za-z0-9._/-]+$'
          ACTUAL_CONTRACT_PATHS=
          while IFS= read -r CONTRACT_LINE; do
            [[ "${CONTRACT_LINE}" =~ ${CANONICAL_LINE_RE} ]]
            CONTRACT_PATH=${CONTRACT_LINE#*  }
            test -f "${CONTRACT_PATH}"
            test ! -L "${CONTRACT_PATH}"
            ACTUAL_CONTRACT_PATHS+="${CONTRACT_PATH}"$'\n'
          done < "${CONTRACT_MANIFEST}"
          ACTUAL_CONTRACT_PATHS=${ACTUAL_CONTRACT_PATHS%$'\n'}
          test "${ACTUAL_CONTRACT_PATHS}" = "${EXPECTED_CONTRACT_PATHS}"
          test "$(printf '%s\n' "${ACTUAL_CONTRACT_PATHS}" | sort -u | wc -l)" -eq 7
          sha256sum --strict --check "${CONTRACT_MANIFEST}"
          CONTRACT_SHA256=$(sha256sum "${CONTRACT_MANIFEST}" | awk '{print $1}')
          [[ "${CONTRACT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          printf 'sha256=%s\n' "${CONTRACT_SHA256}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +x
          set +e
          for attempt in 1 2 3; do
            echo "[ghcr-login] attempt ${attempt}/3"
            echo "${GHCR_PASSWORD}" | docker login "${REGISTRY}" \
              -u "${GHCR_USERNAME}" --password-stdin
            rc=$?
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.image }}:${{ env.TAG }}
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.image }}:latest
          build-args: |
            BUILD_MAIN_SHA=${{ github.sha }}
            POSTGRES_DR_CONTRACT_SHA256=${{ steps.postgres_dr_contract.outputs.sha256 }}
          no-cache: ${{ inputs.no_cache == 'true' }}
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}/${{ matrix.image }}:buildcache-main-v2
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}/${{ matrix.image }}:buildcache-main-v2,mode=max,ignore-error=true

  # ===========================================================================
  # Verify immutable SHA images and build the digest manifest consumed by droplet
  # ===========================================================================
  verify-images:
    needs: [prepare, build-backend-images, build-frontend-images, build-infra-images]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.build-backend-images.result == 'success' || needs.build-backend-images.result == 'skipped') &&
      (needs.build-frontend-images.result == 'success' || needs.build-frontend-images.result == 'skipped') &&
      (needs.build-infra-images.result == 'success' || needs.build-infra-images.result == 'skipped') &&
      needs.prepare.outputs.deploy_services != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    outputs:
      digest_manifest_b64: ${{ steps.manifest.outputs.digest_manifest_b64 }}
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_PASSWORD}" | docker login "${REGISTRY}" -u "${GHCR_USERNAME}" --password-stdin

      - name: Verify image manifests
        id: manifest
        run: |
          set -euo pipefail
          : > image-digests.tsv
          for svc in ${{ needs.prepare.outputs.deploy_services }}; do
            ref="${{ needs.prepare.outputs.image_prefix }}/${svc}:${{ github.sha }}"
            echo "Verifying ${ref}"
            inspect="$(docker buildx imagetools inspect "${ref}")"
            digest="$(printf '%s\n' "${inspect}" | awk '/^Digest:/ {print $2; exit}')"
            if [ -z "${digest}" ]; then
              echo "::error::No digest found for ${ref}"
              exit 1
            fi
            printf '%s\t%s\t%s\n' "${svc}" "${{ needs.prepare.outputs.image_prefix }}/${svc}" "${digest}" >> image-digests.tsv
          done
          echo "digest_manifest_b64=$(base64 -w0 image-digests.tsv)" >> "$GITHUB_OUTPUT"
          {
            echo "### Verified deploy images"
            echo ""
            echo '```'
            cat image-digests.tsv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Visible remote capacity preflight before the mutating SSH deploy
  # ===========================================================================
  capacity-preflight:
    needs: [prepare, verify-images]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.verify-images.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Capacity preflight on production droplet
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.0.3
        env:
          DEPLOY_SERVICES: ${{ needs.prepare.outputs.deploy_services }}
          FULL_DEPLOY: ${{ needs.prepare.outputs.full_deploy }}
          DEPLOY_MODE: ${{ needs.prepare.outputs.deploy_mode }}
          DEPLOY_SHA: ${{ github.sha }}
          IMAGE_PREFIX: ${{ needs.prepare.outputs.image_prefix }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 12m
          envs: DEPLOY_SERVICES,FULL_DEPLOY,DEPLOY_MODE,DEPLOY_SHA,IMAGE_PREFIX,DEPLOY_CHECKOUT_DIR
          script: |
            set -e
            # Run from the dedicated, deploy-owned SHA-pinned checkout — NOT the
            # interactive /var/aqua-saas working tree (which engineering/agent
            # sessions check feature branches into). deploy-paths.sh is the SSoT
            # for DEPLOY_CHECKOUT_DIR and the idempotent worktree materializer;
            # it is sourced from the persistent source repo because the checkout
            # is what it creates. Keeping this inline tiny stays under GitHub
            # Actions' 21,000-char per-expression limit.
            # BOOTSTRAP FIX (ORPHAN-211): the deploy no longer `git checkout`s
            # /var/aqua-saas (isolated-checkout decoupling, #686), so its working
            # tree can be ANY stale branch — sourcing deploy-paths.sh from the
            # working tree fails (file absent on an old checkout) → capacity-preflight
            # + deploy died. Read deploy-paths.sh from the pinned DEPLOY_SHA via
            # `git show` (working-tree-independent) after fetching the objects.
            cd /var/aqua-saas && git fetch --force --prune origin
            install -d /var/lib/aqua/deploy
            git show "${DEPLOY_SHA}:scripts/deploy/deploy-paths.sh" > /var/lib/aqua/deploy/deploy-paths.sh
            source /var/lib/aqua/deploy/deploy-paths.sh
            materialize_deploy_checkout "${DEPLOY_SHA}"
            cd "${DEPLOY_CHECKOUT_DIR}"
            # GitHub Actions is the only deploy-remediation control plane.
            # The gate may run one safe image-only GC pass through the
            # canonical droplet-capacity script; it still never prunes
            # volumes, containers, networks, or build cache.
            CAPACITY_GC_MODE=auto bash scripts/deploy/droplet-capacity.sh gate

  # ===========================================================================
  # Deploy to DigitalOcean Droplet (selective — affected services only)
  # ===========================================================================
  deploy:
    needs:
      [
        prepare,
        build-backend-artifacts,
        build-frontend-artifacts,
        build-backend-images,
        build-frontend-images,
        build-infra-images,
        verify-images,
        capacity-preflight,
      ]
    # Only deploy if at least one image build succeeded (artifact jobs may be skipped when there are no changes)
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.build-backend-artifacts.result == 'success' || needs.build-backend-artifacts.result == 'skipped') &&
      (needs.build-frontend-artifacts.result == 'success' || needs.build-frontend-artifacts.result == 'skipped') &&
      (needs.build-backend-images.result == 'success' || needs.build-backend-images.result == 'skipped') &&
      (needs.build-frontend-images.result == 'success' || needs.build-frontend-images.result == 'skipped') &&
      (needs.build-infra-images.result == 'success' || needs.build-infra-images.result == 'skipped') &&
      needs.verify-images.result == 'success' &&
      needs.capacity-preflight.result == 'success' &&
      (needs.build-backend-images.result == 'success' || needs.build-frontend-images.result == 'success' || needs.build-infra-images.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    environment: production
    outputs:
      # Set by the final step of this job — only a job that reached the
      # end of an actual droplet mutation reports performed=true.
      performed: ${{ steps.mark_performed.outputs.performed }}
    permissions:
      contents: write
      packages: read
    steps:
      # SEC-CI-002: pinned to SHA (needed for tag update step)
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Deploy to DigitalOcean Droplet
        # SEC-CI-002: pinned to SHA
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.0.3
        env:
          # Expand GitHub expressions into runner env vars so the ssh-action
          # can forward them via `envs:` into the remote bash. Keeping the
          # expressions HERE (not in the remote script:) keeps the
          # workflow-file expression payload tiny — a 500+ line bash block
          # mixed with ${{ }} was crossing GitHub's 21,000-char limit
          # (HTTP 422 "Exceeded max expression length 21000" at commit
          # 2c055125 + ancestors). See scripts/deploy/droplet-up.sh header.
          DEPLOY_SERVICES: ${{ needs.prepare.outputs.deploy_services }}
          FULL_DEPLOY: ${{ needs.prepare.outputs.full_deploy }}
          DEPLOY_MODE: ${{ needs.prepare.outputs.deploy_mode }}
          DEPLOY_SHA: ${{ github.sha }}
          IMAGE_PREFIX: ${{ needs.prepare.outputs.image_prefix }}
          DEPLOY_IMAGE_DIGESTS_B64: ${{ needs.verify-images.outputs.digest_manifest_b64 }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_ACTOR is a reserved env var set by the runner; use a
          # distinct name here and let the remote script read it.
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 75m # Sequential pulls on slow disk + service bootstrap for 22+ Docker images
          # envs: forwards these env vars from the GitHub runner into the
          # remote bash session on the droplet.
          envs: DEPLOY_SERVICES,FULL_DEPLOY,DEPLOY_MODE,DEPLOY_SHA,IMAGE_PREFIX,DEPLOY_IMAGE_DIGESTS_B64,GHCR_TOKEN,GHCR_ACTOR,DEPLOY_CHECKOUT_DIR
          script: |
            # Materialize the deploy's own SHA-pinned checkout, then run
            # scripts/deploy/droplet-up.sh FROM it so the script is loaded from
            # the deploy's immutable source. Everything else is delegated to that
            # script to keep this YAML block under GitHub Actions' 21,000-char
            # per-expression limit.
            #
            # ISOLATED CHECKOUT: the deploy no longer force-checkouts the shared
            # interactive /var/aqua-saas working tree (which engineering/agent
            # sessions check feature branches into). deploy-paths.sh — the SSoT
            # for DEPLOY_CHECKOUT_DIR plus the idempotent worktree materializer —
            # is sourced from the persistent source repo because the checkout it
            # creates may not exist yet on the first deploy. droplet-up.sh
            # re-asserts the same pin internally (idempotent), so a fresh run and
            # a re-deploy converge on the same SHA-pinned tree. `git fetch` only
            # updates the shared object store; the interactive tree's HEAD is
            # never touched, so post-deploy-verify's HEAD check can't false-fail.
            #
            # ARCHITECTURAL HISTORY: commit c92539b9 originally moved the
            # ~530-line bash block out to scripts/deploy/droplet-up.sh to
            # stay under the 21K limit. A subsequent merge (d155d2a3 from
            # worktree-ws10-phase-1) re-inlined the bash, regressing the
            # fix and causing every prod deploy run to fail at workflow
            # parse with HTTP 422 "Exceeded max expression length 21000".
            # The thin-invoker form is preserved here. Tier-1 Make-Impossible:
            # the inline-script regression is structurally prevented because the
            # YAML simply cannot express the 530 lines (it would re-trigger the
            # same parse error at PR-time). All deploy logic — cert generation,
            # health checks, rollout, rollback — lives in droplet-up.sh.
            set -e
            # BOOTSTRAP FIX (ORPHAN-211): the deploy no longer `git checkout`s
            # /var/aqua-saas (isolated-checkout decoupling, #686), so its working
            # tree can be ANY stale branch — sourcing deploy-paths.sh from the
            # working tree fails (file absent on an old checkout) → capacity-preflight
            # + deploy died. Read deploy-paths.sh from the pinned DEPLOY_SHA via
            # `git show` (working-tree-independent) after fetching the objects.
            cd /var/aqua-saas && git fetch --force --prune origin
            install -d /var/lib/aqua/deploy
            git show "${DEPLOY_SHA}:scripts/deploy/deploy-paths.sh" > /var/lib/aqua/deploy/deploy-paths.sh
            source /var/lib/aqua/deploy/deploy-paths.sh
            materialize_deploy_checkout "${DEPLOY_SHA}"
            cd "${DEPLOY_CHECKOUT_DIR}"
            bash scripts/deploy/droplet-up.sh
            echo "=== Deployment completed at $(date) ==="

      - name: Update deploy baseline tag
        run: |
          git tag -f deployed/production ${{ github.sha }}
          git push -f origin deployed/production
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark deployment performed
        id: mark_performed
        run: echo "performed=true" >> "$GITHUB_OUTPUT"

      # SEC-CI-005: Removed echo of DROPLET_HOST to prevent leaking server IP in logs
      - name: Verify deployment
        run: |
          echo "Deployment initiated successfully"
          echo "Commit: ${{ github.sha }}"
          echo "Services deployed: ${{ needs.prepare.outputs.deploy_services }}"
          echo "Full deploy: ${{ needs.prepare.outputs.full_deploy }}"
          echo "Deploy mode: ${{ needs.prepare.outputs.deploy_mode }}"
