# =============================================================================
# Aquaculture Platform - Production Values Overlay
# =============================================================================
# Apply with:
#   # Generate RS256 keypair once per environment (SECURITY CRITICAL-001):
#   infrastructure/docker/scripts/generate-jwt-keypair.sh
#   helm install aquaculture ./aquaculture \
#     -n aquaculture --create-namespace \
#     -f values-production.yaml \
#     --set-file secrets.jwtPrivateKey=./certs/jwt/private.pem \
#     --set-file secrets.jwtPublicKey=./certs/jwt/public.pem \
#     --set secrets.databaseUrl=$DATABASE_URL \
#     --set secrets.redisUrl=$REDIS_URL \
#     --set secrets.natsUrl=$NATS_URL \
#     --set postgresql.auth.password=$PG_PASSWORD \
#     --set redis.auth.password=$REDIS_PASSWORD
#
# When externalSecrets.enabled=true (the production default), the RS256 keypair
# is loaded from AWS Secrets Manager at paths:
#   aquaculture/production/jwt-private-key
#   aquaculture/production/jwt-public-key
#
# Credentials MUST be passed via --set-file or external-secrets, never committed.
# =============================================================================

global:
  nodeEnv: production
  imageRegistry: ghcr.io

namespace: aquaculture

# Pin image tags to the specific release being deployed.
# Override these per-service in your CI/CD pipeline.
gatewayApi:
  replicaCount: 3
  image:
    tag: "1.0.0"  # Override: --set gatewayApi.image.tag=<sha>

authService:
  replicaCount: 2
  image:
    tag: "1.0.0"

farmService:
  replicaCount: 2
  image:
    tag: "1.0.0"

sensorService:
  replicaCount: 3
  image:
    tag: "1.0.0"

alertEngine:
  replicaCount: 2
  image:
    tag: "1.0.0"

notificationService:
  replicaCount: 2
  image:
    tag: "1.0.0"

billingService:
  replicaCount: 2
  image:
    tag: "1.0.0"

hrService:
  replicaCount: 2
  image:
    tag: "1.0.0"

shell:
  replicaCount: 2
  image:
    tag: "1.0.0"

dashboard:
  replicaCount: 2
  image:
    tag: "1.0.0"

farmModule:
  replicaCount: 2
  image:
    tag: "1.0.0"

processEditor:
  enabled: false

adminPanel:
  replicaCount: 2
  image:
    tag: "1.0.0"

# Use external managed services in production (AWS RDS, ElastiCache)
postgresql:
  enabled: false  # Use RDS — set secrets.databaseUrl to RDS endpoint

redis:
  enabled: false  # Use ElastiCache — set secrets.redisUrl to ElastiCache endpoint

# INFRA-NATS-CLUSTER-001 / INFRA-CRITICAL-001: JetStream HA cluster.
# Single-node NATS is a SPOF on the droplet (event stream loss if the pod
# crashes). In production the subchart runs as a 3-replica cluster so
# JetStream streams can be provisioned with Replicas=3 and survive the
# loss of any single node. Per-node file storage is sized generously —
# streams retain 7 days of events at current ingest rate.
nats:
  enabled: true
  config:
    cluster:
      enabled: true
      replicas: 3
    jetstream:
      enabled: true
      fileStorage:
        enabled: true
        size: 10Gi
      memStorage:
        enabled: true
        size: 512Mi

# Enable external secrets integration in production
externalSecrets:
  enabled: true
  secretStore:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  pathPrefix: "aquaculture/production"
  refreshInterval: "1h"

# SECURITY (MEDIUM-002, V7): cert-manager internal PKI ON by default in
# production. Operators who run a cluster without cert-manager must
# explicitly opt out (`--set certManager.internal.enabled=false`) so the
# absence is a deliberate decision, not forgetfulness. This flips the base
# chart's default-off to a production-specific default-on — the Automatic
# tier of CLAUDE.md's architectural hierarchy.
certManager:
  internal:
    enabled: true

networkPolicy:
  enabled: true

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
