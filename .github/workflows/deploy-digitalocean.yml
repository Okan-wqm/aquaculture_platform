# =============================================================================
# DigitalOcean Droplet Deployment
#
# Fixes applied:
# - GHCR lowercase image paths (Docker registry requirement)
# - Frontend artifact upload (was missing web/*/dist)
# - Deploy condition: only deploys when build succeeds
# - Build timeout: 30 min max
# - Optimized for 2GB RAM droplet (uses docker-compose.droplet.yml)
# - SEC-CI-001: GHCR login uses GITHUB_TOKEN + github.actor (masked in logs, run-scoped)
# - SEC-CI-002: All third-party actions pinned to full commit SHAs
# - SEC-CI-005: DROPLET_HOST echo removed from verify step
# - SEC-CI-007: npm tarball integrity verified against package-lock.json sha512
# - SEC-CI-011/ARCH-CI-006: github.sha removed from NX cache key
# - SEC-CI-012: git checkout pinned to github.sha instead of git pull
# - ARCH-CI-002: buildcache tags namespaced with -main suffix
# - ARCH-CI-003: nx run-many --projects used to always build all services
#                (nx affected skips builds when only infra files changed)
# - ARCH-CI-007: Image digest capture + rollback on failed health check
# - ARCH-CI-010: Split build into separate backend/frontend jobs so a frontend
#                failure cannot block backend images from being built/deployed
# - ARCH-CI-011: NX binary verified after manual install
# - ARCH-CI-015: max-parallel increased to 6
# =============================================================================

name: Deploy to DigitalOcean

on:
  # Only deploy after CI passes (ci-affected workflow must succeed first)
  workflow_run:
    workflows: ["CI - Affected"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (comma-separated, or "all")'
        required: false
        default: 'all'

env:
  REGISTRY: ghcr.io
  TAG: ${{ github.sha }}

# Cancel in-progress deploys for the same branch+trigger combination.
# workflow_dispatch and workflow_run are in separate groups so a manual
# trigger is never cancelled by an automated CI-triggered deploy.
concurrency:
  group: deploy-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Prepare - Set lowercase image prefix & detect changes
  # ===========================================================================
  prepare:
    # Only deploy if CI workflow succeeded (skip if it failed or was cancelled)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.vars.outputs.image_prefix }}
      has_backend_changes: ${{ steps.changes.outputs.has_backend }}
      has_frontend_changes: ${{ steps.changes.outputs.has_frontend }}
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set variables
        id: vars
        run: |
          # GHCR requires lowercase image paths
          REPO="${{ github.repository }}"
          echo "image_prefix=ghcr.io/${REPO,,}" >> $GITHUB_OUTPUT

      - name: Detect changes
        id: changes
        run: |
          # workflow_run = automated CI→deploy: always rebuild everything so the
          # deploy reflects exactly what CI validated, regardless of which files changed.
          # (github.event.before is not set on workflow_run events, making git diff
          # unreliable — it silently returns empty output instead of falling back to ALL.)
          if [ "${{ github.event_name }}" = "workflow_run" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_backend=true" >> $GITHUB_OUTPUT
            echo "has_frontend=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # For any other trigger (push, etc.) detect changes precisely
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || echo "ALL")

          if [ "$CHANGED" = "ALL" ]; then
            echo "has_backend=true" >> $GITHUB_OUTPUT
            echo "has_frontend=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Shared libs or infra change = rebuild everything
          if echo "$CHANGED" | grep -q "^libs/\|^platform/\|^\.github/\|^docker-compose"; then
            echo "has_backend=true" >> $GITHUB_OUTPUT
            echo "has_frontend=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          HAS_BACKEND=$(echo "$CHANGED" | grep -q "^apps/" && echo true || echo false)
          HAS_FRONTEND=$(echo "$CHANGED" | grep -q "^web/" && echo true || echo false)
          echo "has_backend=$HAS_BACKEND" >> $GITHUB_OUTPUT
          echo "has_frontend=$HAS_FRONTEND" >> $GITHUB_OUTPUT

  # ===========================================================================
  # ARCH-CI-010: Build backend artifacts (separate job — 30 min timeout)
  # A frontend build failure will NOT block backend images from deploying.
  # ===========================================================================
  build-backend-artifacts:
    needs: [prepare]
    if: needs.prepare.outputs.has_backend_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      # ARCH-CI-006/SEC-CI-011: Removed github.sha from cache key so primary key can hit
      - name: Cache Nx
        # SEC-CI-002: pinned to SHA
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-deploy-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-deploy-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit

      - name: Install Linux platform binaries
        timeout-minutes: 3
        run: |
          # Lockfile generated on Windows only has win32 binaries.
          # Manually download Linux (x64-gnu) binaries from npm registry.
          #
          # SEC-CI-007: Each tarball is downloaded to a temp file and its SHA-512
          # digest is verified against the 'integrity' field recorded in package-lock.json
          # before extraction. This detects registry compromise or MitM even over HTTPS.
          install_pkg() {
            local name=$1
            local ver=$2
            local dest=${3:-"node_modules/${name}"}
            local tmpfile
            tmpfile=$(mktemp /tmp/npm-pkg-XXXXXX.tgz)
            echo "Installing ${name}@${ver} → ${dest}"
            mkdir -p "${dest}"

            # Download tarball to temp file (do not pipe directly into tar)
            curl -sfL --max-time 30 \
              "https://registry.npmjs.org/${name}/-/$(basename ${name})-${ver}.tgz" \
              -o "${tmpfile}"

            # SEC-CI-007: Verify integrity hash from package-lock.json
            # The integrity field is base64-encoded sha512: "sha512-<base64>"
            LOCK_INTEGRITY=$(node -p "
              try {
                const lock = require('./package-lock.json');
                const pkg = lock.packages && lock.packages['node_modules/${name}'];
                (pkg && pkg.integrity) || ''
              } catch(e) { '' }
            " 2>/dev/null || true)

            if [ -n "${LOCK_INTEGRITY}" ] && echo "${LOCK_INTEGRITY}" | grep -q '^sha512-'; then
              # Extract base64 hash and convert to hex for sha512sum comparison
              B64="${LOCK_INTEGRITY#sha512-}"
              EXPECTED_HEX=$(echo "${B64}" | base64 -d | xxd -p | tr -d '\n')
              ACTUAL_HEX=$(sha512sum "${tmpfile}" | cut -d ' ' -f 1)
              if [ "${EXPECTED_HEX}" != "${ACTUAL_HEX}" ]; then
                echo "::error::Integrity check FAILED for ${name}@${ver}"
                echo "  Expected (from lockfile): ${EXPECTED_HEX}"
                echo "  Actual (downloaded):      ${ACTUAL_HEX}"
                rm -f "${tmpfile}"
                exit 1
              fi
              echo "  Integrity verified (sha512 matches package-lock.json)"
            else
              echo "  ::warning::No lockfile integrity entry for ${name}@${ver} — skipping hash check"
            fi

            tar xz -C "${dest}" --strip-components=1 < "${tmpfile}"
            rm -f "${tmpfile}"
            if [ -f "${dest}/package.json" ]; then
              echo "  OK ($(node -p "require('./${dest}/package.json').name"))"
            else
              echo "  FAILED - no package.json found"
            fi
          }

          # SWC (needed by NX for fast TypeScript compilation)
          install_pkg "@swc/core-linux-x64-gnu" "$(node -p "require('./node_modules/@swc/core/package.json').version")"

          # esbuild linux-x64 for ALL esbuild installations (needed when nx affected
          # includes frontend/library projects that use Vite in the backend build job)
          for esbuild_pkg in $(find node_modules -name "package.json" -path "*/esbuild/package.json" -not -path "*/@esbuild/*" 2>/dev/null); do
            esbuild_dir=$(dirname "$esbuild_pkg")
            esbuild_ver=$(node -p "require('./${esbuild_pkg}').version")
            parent_dir=$(dirname "$esbuild_dir")
            target="${parent_dir}/@esbuild/linux-x64"
            if [ ! -d "$target" ]; then
              install_pkg "@esbuild/linux-x64" "$esbuild_ver" "$target"
            else
              echo "Skipping ${target} (already exists)"
            fi
          done

          # Rollup native binary (needed by Vite when frontend libs are in affected set)
          install_pkg "@rollup/rollup-linux-x64-gnu" "$(node -p "require('./node_modules/rollup/package.json').version")"

          # NX native binary (CRITICAL - without this NX hangs on Linux!)
          install_pkg "@nx/nx-linux-x64-gnu" "$(node -p "require('./node_modules/nx/package.json').version")"

          timeout 30 node node_modules/nx/bin/post-install || true

          # ARCH-CI-011: Verify NX binary is functional before proceeding
          node -e "require('@nx/nx-linux-x64-gnu')" || { echo "::error::NX linux binary missing or broken"; exit 1; }
          echo "All Linux platform binaries installed successfully"

      # ARCH-CI-003: Use nx run-many --projects to always build all services.
      # nx affected is NOT used here: when only infra/workflow files change,
      # nx affected finds no affected projects → no dist/ → artifact download fails.
      - name: Build all backend services
        run: |
          npx nx run-many -t build \
            --projects=gateway-api,auth-service,farm-service,sensor-service,admin-api-service,alert-engine,billing-service,hr-service,hydroponics-service,notification-service,observability-service,config-service \
            --parallel=3
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

      # Upload backend artifacts (dist/apps/*)
      - name: Upload backend artifacts
        # SEC-CI-002: pinned to SHA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: backend-dist
          path: dist/
          retention-days: 1

  # ===========================================================================
  # ARCH-CI-010: Build frontend artifacts (separate job — 30 min timeout)
  # A backend build failure will NOT block frontend images from deploying.
  # ===========================================================================
  build-frontend-artifacts:
    needs: [prepare]
    if: needs.prepare.outputs.has_frontend_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      # ARCH-CI-006/SEC-CI-011: Removed github.sha from cache key so primary key can hit
      - name: Cache Nx
        # SEC-CI-002: pinned to SHA
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-deploy-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-deploy-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit

      - name: Install Linux platform binaries
        timeout-minutes: 3
        run: |
          # Lockfile generated on Windows only has win32 binaries.
          # Manually download Linux (x64-gnu) binaries from npm registry.
          #
          # SEC-CI-007: Each tarball is downloaded to a temp file and its SHA-512
          # digest is verified against the 'integrity' field recorded in package-lock.json
          # before extraction. This detects registry compromise or MitM even over HTTPS.
          install_pkg() {
            local name=$1
            local ver=$2
            local dest=${3:-"node_modules/${name}"}
            local tmpfile
            tmpfile=$(mktemp /tmp/npm-pkg-XXXXXX.tgz)
            echo "Installing ${name}@${ver} → ${dest}"
            mkdir -p "${dest}"

            # Download tarball to temp file (do not pipe directly into tar)
            curl -sfL --max-time 30 \
              "https://registry.npmjs.org/${name}/-/$(basename ${name})-${ver}.tgz" \
              -o "${tmpfile}"

            # SEC-CI-007: Verify integrity hash from package-lock.json
            # The integrity field is base64-encoded sha512: "sha512-<base64>"
            LOCK_INTEGRITY=$(node -p "
              try {
                const lock = require('./package-lock.json');
                const pkg = lock.packages && lock.packages['node_modules/${name}'];
                (pkg && pkg.integrity) || ''
              } catch(e) { '' }
            " 2>/dev/null || true)

            if [ -n "${LOCK_INTEGRITY}" ] && echo "${LOCK_INTEGRITY}" | grep -q '^sha512-'; then
              # Extract base64 hash and convert to hex for sha512sum comparison
              B64="${LOCK_INTEGRITY#sha512-}"
              EXPECTED_HEX=$(echo "${B64}" | base64 -d | xxd -p | tr -d '\n')
              ACTUAL_HEX=$(sha512sum "${tmpfile}" | cut -d ' ' -f 1)
              if [ "${EXPECTED_HEX}" != "${ACTUAL_HEX}" ]; then
                echo "::error::Integrity check FAILED for ${name}@${ver}"
                echo "  Expected (from lockfile): ${EXPECTED_HEX}"
                echo "  Actual (downloaded):      ${ACTUAL_HEX}"
                rm -f "${tmpfile}"
                exit 1
              fi
              echo "  Integrity verified (sha512 matches package-lock.json)"
            else
              echo "  ::warning::No lockfile integrity entry for ${name}@${ver} — skipping hash check"
            fi

            tar xz -C "${dest}" --strip-components=1 < "${tmpfile}"
            rm -f "${tmpfile}"
            if [ -f "${dest}/package.json" ]; then
              echo "  OK ($(node -p "require('./${dest}/package.json').name"))"
            else
              echo "  FAILED - no package.json found"
            fi
          }

          # esbuild linux-x64 for ALL esbuild installations (root + nested in vite)
          for esbuild_pkg in $(find node_modules -name "package.json" -path "*/esbuild/package.json" -not -path "*/@esbuild/*" 2>/dev/null); do
            esbuild_dir=$(dirname "$esbuild_pkg")
            esbuild_ver=$(node -p "require('./${esbuild_pkg}').version")
            parent_dir=$(dirname "$esbuild_dir")
            target="${parent_dir}/@esbuild/linux-x64"
            if [ ! -d "$target" ]; then
              install_pkg "@esbuild/linux-x64" "$esbuild_ver" "$target"
            else
              echo "Skipping ${target} (already exists)"
            fi
          done

          # Rollup native binary (needed by Vite for frontend builds)
          install_pkg "@rollup/rollup-linux-x64-gnu" "$(node -p "require('./node_modules/rollup/package.json').version")"

          # NX native binary (CRITICAL - without this NX hangs on Linux!)
          install_pkg "@nx/nx-linux-x64-gnu" "$(node -p "require('./node_modules/nx/package.json').version")"

          timeout 30 node node_modules/nx/bin/post-install || true

          # ARCH-CI-011: Verify NX binary is functional before proceeding
          node -e "require('@nx/nx-linux-x64-gnu')" || { echo "::error::NX linux binary missing or broken"; exit 1; }
          echo "All Linux platform binaries installed successfully"

      # ARCH-CI-003: Use nx run-many --projects to always build all frontend apps.
      # nx affected is NOT used here: when only infra/workflow files change,
      # nx affected finds no affected projects → no dist/ → artifact download fails.
      #
      # Build strategy:
      #   - NX projects (have project.json): built via nx run-many
      #   - Non-NX workspace modules (sensor/hr/hydroponics): built via npm workspaces
      #   - aquamobil (web/apps/aquamobil): builds inside its own Dockerfile — skipped here
      - name: Build all frontend modules
        run: |
          # NX-managed frontend apps
          npx nx run-many -t build \
            --projects=shell,dashboard,farm-module,admin-panel,tenant-admin \
            --parallel=3

          # Non-NX workspace modules (vite build, deps already hoisted to root node_modules)
          npm run build --workspace=web/modules/sensor-module
          npm run build --workspace=web/modules/hr-module
          npm run build --workspace=web/modules/hydroponics-module
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

      # Upload frontend artifacts (web/shell/dist + web/modules/*/dist)
      # Note: aquamobil (web/apps/aquamobil) builds inside its own Dockerfile — not uploaded here.
      - name: Upload frontend artifacts
        # SEC-CI-002: pinned to SHA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: frontend-dist
          path: |
            web/shell/dist/
            web/modules/*/dist/
          retention-days: 1

  # ===========================================================================
  # Build Backend Docker Images
  # ===========================================================================
  build-backend-images:
    # ARCH-CI-010: Depends on build-backend-artifacts, not the merged build job
    needs: [prepare, build-backend-artifacts]
    if: needs.prepare.outputs.has_backend_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # ARCH-CI-015: Increased from 4 to 6 for fewer sequential waves
      max-parallel: 6
      matrix:
        service:
          - gateway-api
          - auth-service
          - farm-service
          - sensor-service
          - admin-api-service
          - alert-engine
          - billing-service
          - hr-service
          - hydroponics-service
          - notification-service
          - observability-service
          - config-service
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download backend artifacts
        # SEC-CI-002: pinned to SHA
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: backend-dist
          path: dist/

      # SEC-CI-002: pinned to SHA
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # SEC-CI-002: pinned to SHA
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        # SEC-CI-002: pinned to SHA
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile.backend.simple
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.service }}:${{ env.TAG }}
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.service }}:latest
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          # ARCH-CI-002: Namespaced buildcache tag to avoid collision with cd-production.yml
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}/${{ matrix.service }}:buildcache-main
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}/${{ matrix.service }}:buildcache-main,mode=max

  # ===========================================================================
  # Build Frontend Docker Images
  # ===========================================================================
  build-frontend-images:
    # ARCH-CI-010: Depends on build-frontend-artifacts, not the merged build job
    needs: [prepare, build-frontend-artifacts]
    if: needs.prepare.outputs.has_frontend_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # ARCH-CI-015: Increased from 4 to 6
      max-parallel: 6
      matrix:
        include:
          - module: shell
            dockerfile: infrastructure/docker/Dockerfile.shell
            module_path: web/shell
          - module: dashboard
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/dashboard
          - module: farm-module
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/farm-module
          - module: sensor-module
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/sensor-module
          - module: admin-panel
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/admin-panel
          - module: tenant-admin
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/tenant-admin
          - module: hr-module
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/hr-module
          - module: hydroponics-module
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/hydroponics-module
          - module: aquamobil
            dockerfile: infrastructure/docker/Dockerfile.aquamobil
            module_path: web/apps/aquamobil
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Download frontend artifacts - upload strips common ancestor 'web/',
      # so we extract into 'web/' to restore original paths (web/shell/dist, web/modules/*/dist)
      - name: Download frontend artifacts
        # SEC-CI-002: pinned to SHA
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: frontend-dist
          path: web

      # SEC-CI-002: pinned to SHA
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # SEC-CI-002: pinned to SHA
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.module }}
        # SEC-CI-002: pinned to SHA
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.module }}:${{ env.TAG }}
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.module }}:latest
          build-args: |
            MODULE_PATH=${{ matrix.module_path }}
          # ARCH-CI-002: Namespaced buildcache tag to avoid collision with cd-production.yml
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}/${{ matrix.module }}:buildcache-main
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}/${{ matrix.module }}:buildcache-main,mode=max

  # ===========================================================================
  # Deploy to DigitalOcean Droplet
  # ===========================================================================
  deploy:
    # ARCH-CI-010: needs now reference the split artifact jobs instead of the old merged build job
    needs: [prepare, build-backend-artifacts, build-frontend-artifacts, build-backend-images, build-frontend-images]
    # Only deploy if at least one image build succeeded (artifact jobs may be skipped when there are no changes)
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.build-backend-artifacts.result == 'success' || needs.build-backend-artifacts.result == 'skipped') &&
      (needs.build-frontend-artifacts.result == 'success' || needs.build-frontend-artifacts.result == 'skipped') &&
      (needs.build-backend-images.result == 'success' || needs.build-backend-images.result == 'skipped') &&
      (needs.build-frontend-images.result == 'success' || needs.build-frontend-images.result == 'skipped') &&
      (needs.build-backend-images.result == 'success' || needs.build-frontend-images.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to DigitalOcean Droplet
        # SEC-CI-002: pinned to SHA
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /var/aqua-saas

            # SEC-CI-012: Checkout to the specific SHA that triggered the workflow
            # instead of git pull (prevents TOCTOU race if another commit lands mid-deploy)
            echo "=== Checking out deploy SHA ==="
            git fetch --force --prune origin
            git checkout -f ${{ github.sha }}

            # SEC-CI-001: GITHUB_TOKEN (packages:read) is substituted at template time by the
            # GitHub Actions runner and masked as *** in all logs. Short-lived, run-scoped only.
            echo "=== Logging into GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # ARCH-CI-007: Capture current image digests for rollback before pulling new images
            echo "=== Capturing current image digests for rollback ==="
            PREV_GATEWAY=$(docker inspect --format='{{.Image}}' aqua-saas-gateway-api-1 2>/dev/null || echo "")
            echo "Previous gateway digest: ${PREV_GATEWAY:-none}"

            echo "=== Pulling latest images ==="
            docker compose -f docker-compose.droplet.yml pull --ignore-pull-failures

            echo "=== Stopping all services ==="
            docker compose -f docker-compose.droplet.yml down --remove-orphans --timeout 30 || true
            # Also remove any orphan containers not tracked by compose (e.g. from config changes)
            docker ps -a --format '{{.Names}}' | grep -E 'aqua-' | xargs -r docker rm -f 2>/dev/null || true
            sleep 5

            echo "=== Starting all services ==="
            docker compose -f docker-compose.droplet.yml up -d --no-build 2>&1 || true

            echo "=== Container health status ==="
            docker compose -f docker-compose.droplet.yml ps --format 'table {{.Name}}\t{{.Status}}' 2>/dev/null || true

            echo "=== Logs from non-healthy containers ==="
            for c in $(docker ps -a --format '{{.Names}}' --filter "label=com.docker.compose.project=aqua-saas"); do
              HEALTH=$(docker inspect --format='{{.State.Health.Status}}' "$c" 2>/dev/null || echo "none")
              RESTARTS=$(docker inspect --format='{{.RestartCount}}' "$c" 2>/dev/null || echo "0")
              if [ "$HEALTH" != "healthy" ] || [ "$RESTARTS" -gt 0 ] 2>/dev/null; then
                echo "--- $c (health=$HEALTH, restarts=$RESTARTS) last 80 lines ---"
                docker logs --tail 80 "$c" 2>&1 || true
              fi
            done

            echo "=== Waiting for services ==="
            HEALTHY=false
            for i in $(seq 1 30); do
              sleep 10
              GW_STATUS=$(docker inspect --format='{{.State.Status}} ({{.State.ExitCode}})' aqua-gateway 2>/dev/null || echo "not found")
              PORT_OPEN=$(nc -z localhost 3000 2>/dev/null && echo "open" || echo "closed")
              HTTP_CODE=$(curl -o /dev/null -w "%{http_code}" -s --max-time 5 http://localhost:3000/health/live 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "Gateway API: OK (attempt ${i})"
                HEALTHY=true
                break
              fi
              echo "Gateway API: not ready yet (attempt ${i}/30, container=${GW_STATUS}, port=${PORT_OPEN}, http=${HTTP_CODE})"
            done

            # ARCH-CI-007: Rollback if health check fails after all retries
            if [ "$HEALTHY" != "true" ]; then
              echo "::error::Health check failed after 5 minutes. Initiating rollback."
              if [ -n "$PREV_GATEWAY" ]; then
                echo "Rolling back to previous gateway image: ${PREV_GATEWAY}"
                docker tag "${PREV_GATEWAY}" $(docker compose -f docker-compose.droplet.yml config | grep 'image:.*gateway-api' | awk '{print $2}' | head -1) 2>/dev/null || true
                docker compose -f docker-compose.droplet.yml up -d --no-build --remove-orphans
                echo "Rollback complete. Please investigate the failed deploy."
              else
                echo "No previous image digest available; manual intervention required."
              fi
              exit 1
            fi

            echo "=== Cleanup old images ==="
            docker image prune -f --filter "dangling=true"
            docker image prune -f --filter "until=24h" --filter "label!=deployed=current"

            echo "=== Container status ==="
            docker compose -f docker-compose.droplet.yml ps

            echo "=== Deployment completed at $(date) ==="

      # SEC-CI-005: Removed echo of DROPLET_HOST to prevent leaking server IP in logs
      - name: Verify deployment
        run: |
          echo "Deployment initiated successfully"
          echo "Commit: ${{ github.sha }}"
