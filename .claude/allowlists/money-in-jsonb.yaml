# Money stored inside a jsonb column on the billing surface
# (BILLING-CRITICAL-002, ADR-0013).
#
# A `numeric` column read through a Decimal transformer is exact, constrainable
# and summable. The same value as a `number` field inside a jsonb blob is an
# IEEE-754 double: the database cannot CHECK it, cannot index it, and SUM over
# it loses cents. `tests/invariants/plan-catalog-ssot.spec.ts` requires every
# money-named `number` field inside a jsonb column of a billing-surface entity
# to appear here with an owner, a future expiry, the finding that owns its
# normalisation and a reason. `ceiling` only decreases; an entry whose site is
# gone or fixed fails the gate.
#
# The discount catalogue contributes NO entries: it is the first table set
# moved under ADR-0013, and it holds every amount in its own numeric column.
version: 1
ceiling: 22
entries:
