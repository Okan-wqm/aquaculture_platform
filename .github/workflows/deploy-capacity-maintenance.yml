name: Deploy Capacity Maintenance

on:
  schedule:
    # Periodic safe image GC. Each production deploy pulls a fresh image per
    # service (~1.85GB x 13), leaving the prior generation untagged; without a
    # regular sweep these accumulate until the deploy capacity-preflight gate
    # blocks (root cause of the #695 / 28332208818 / 28330781676 capacity
    # failures). The capacity gate targets exactly these untagged +
    # superseded-rollback generations (pull-only runtime, ADR-033 — every
    # removed image re-pulls from GHCR; volumes/containers/networks untouched);
    # it stops as soon as the initial warning/failure class is cleared. Every
    # 6h keeps the droplet under threshold between deploys without turning the
    # SSH budget into an unbounded full-history sweep.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Capacity operation to run on the production droplet.'
        required: true
        type: choice
        default: report
        options:
          - report
          - safe-image-gc
          - gate
      deploy_sha:
        description: 'Optional 40-character SHA to protect and evaluate. Blank uses origin/main.'
        required: false
        type: string
        default: ''
      full_deploy:
        description: 'Use full deploy capacity thresholds and pull estimate.'
        required: true
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'
      deploy_services:
        description: 'Space-separated service list for selective estimates; use all for full deploy.'
        required: false
        type: string
        default: 'all'
      image_prefix:
        description: 'Registry image prefix used by production deploy images.'
        required: true
        type: string
        default: 'ghcr.io/okan-wqm/aquaculture_platform'

permissions:
  contents: read

concurrency:
  group: deploy-capacity-maintenance-production
  cancel-in-progress: false

jobs:
  capacity-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Run capacity operation through production deploy control plane
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.0.3
        env:
          # schedule events carry no inputs → fall back to the periodic safe
          # image GC with full-deploy thresholds (workflow_dispatch still uses
          # its own input defaults, e.g. operation=report).
          OPERATION: ${{ inputs.operation || 'safe-image-gc' }}
          REQUESTED_DEPLOY_SHA: ${{ inputs.deploy_sha || '' }}
          FULL_DEPLOY: ${{ inputs.full_deploy || 'true' }}
          DEPLOY_SERVICES: ${{ inputs.deploy_services || 'all' }}
          IMAGE_PREFIX: ${{ inputs.image_prefix || 'ghcr.io/okan-wqm/aquaculture_platform' }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 12m
          envs: OPERATION,REQUESTED_DEPLOY_SHA,FULL_DEPLOY,DEPLOY_SERVICES,IMAGE_PREFIX
          script: |
            set -euo pipefail

            cd /var/aqua-saas
            git fetch --force --prune origin main

            if [ -n "${REQUESTED_DEPLOY_SHA}" ]; then
              case "${REQUESTED_DEPLOY_SHA}" in
                *[!0-9a-f]*)
                  echo "::error::deploy_sha must be lowercase hex."
                  exit 2
                  ;;
              esac
              if [ "${#REQUESTED_DEPLOY_SHA}" -ne 40 ]; then
                echo "::error::deploy_sha must be exactly 40 characters."
                exit 2
              fi
              TARGET_SHA="${REQUESTED_DEPLOY_SHA}"
            else
              TARGET_SHA="$(git rev-parse origin/main)"
            fi

            export DEPLOY_SHA="${TARGET_SHA}"

            # /var/aqua-saas is the persistent bare object store on the droplet,
            # not an executable working tree. Bootstrap the canonical deploy
            # checkout helper from the exact target commit, then run maintenance
            # from the immutable checkout used by the rest of the deploy control
            # plane. This keeps the source repo ref-only and makes scheduled and
            # manually requested SHAs follow the same path.
            install -d /var/lib/aqua/deploy
            deploy_paths_bootstrap="$(mktemp /tmp/aqua-deploy-paths.XXXXXXXX)"
            git show "${TARGET_SHA}:scripts/deploy/deploy-paths.sh" > "${deploy_paths_bootstrap}"
            source "${deploy_paths_bootstrap}"
            rm -- "${deploy_paths_bootstrap}"
            export DEPLOY_ATTEMPT="${{ github.run_id }}-${{ github.run_attempt }}"
            materialize_deploy_checkout "${TARGET_SHA}"
            cd "${DEPLOY_CHECKOUT_DIR}"

            case "${OPERATION}" in
              report)
                CAPACITY_DISK_USAGE_MODE=deep bash scripts/deploy/droplet-capacity.sh report
                ;;
              safe-image-gc | gate)
                CAPACITY_GC_MODE=auto CAPACITY_DISK_USAGE_MODE=deep bash scripts/deploy/droplet-capacity.sh gate
                ;;
              *)
                echo "::error::Unsupported operation: ${OPERATION}"
                exit 2
                ;;
            esac
