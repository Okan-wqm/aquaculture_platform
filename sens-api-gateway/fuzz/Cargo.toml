[package]
name = "suderra-agent-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[package.metadata]
cargo-fuzz = true

# Keep cargo-fuzz resolution independent from ancestor workspaces, including
# repositories whose isolated git worktrees live below the checkout root.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_yaml = "0.9"
serde_json = "1.0"
arbitrary = { version = "1.3", features = ["derive"] }
# Batch #327 D-8 fuzz_st_parser dependencies — the
# fuzz_targets/st_parser.rs target uses
# `#[path = "../../src/st_validator.rs"] mod st_validator;`
# which inherits st_validator.rs's transitive deps. Those
# are: serde (Serialize/Deserialize derive), HashMap (std),
# fmt (std), LazyLock (std). serde is needed here too.
serde = { version = "1.0", features = ["derive"] }

[dependencies.suderra-agent]
path = ".."

# The parent edge workspace patches rumqttc to remove vulnerable
# rustls-webpki/rustls-pemfile versions. This standalone fuzz workspace must
# repeat that root-level patch because Cargo patches are not inherited.
[patch.crates-io]
rumqttc = { path = "../../crates/local-rumqttc" }

# Fuzz targets
[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mqtt_payload"
path = "fuzz_targets/mqtt_payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "modbus_response"
path = "fuzz_targets/modbus_response.rs"
test = false
doc = false
bench = false

# Batch #327 D-8: IEC 61131-3 Structured Text parser fuzz
# target. Closes UM-008. Exercises parse_st (AST builder)
# + validate_st (full lex+parse+typecheck pipeline) on
# bounded UTF-8 input. The 24h nightly schedule lives in
# .github/workflows/fuzz-st-parser-nightly.yml.
[[bin]]
name = "st_parser"
path = "fuzz_targets/st_parser.rs"
test = false
doc = false
bench = false
