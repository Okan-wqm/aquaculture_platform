# =============================================================================
# cargo-audit policy — upstream-blocked advisory acceptance (tracked)
# =============================================================================
# Per plan §5 Faz 0 + CLAUDE.md architectural discipline:
#
#   Delay-tracked-with-IDs is permitted ONLY with explicit owner + deadline
#   + tracked finding ID. No silent acceptance, no indefinite postponement.
#
# Each ignore entry MUST carry owner + deadline + finding-ID + upstream
# blocker reference. When the upstream fix lands, the entry REMOVED (not
# renewed).
#
# ---------------------------------------------------------------------------
# Policy review cadence
# ---------------------------------------------------------------------------
# - Monthly review of this file. If an entry's deadline passes without
#   upstream fix, open a RESOLVED-BY-FORK-OR-REPLACE decision (fork the
#   upstream or replace with a different crate).
# - New ignore entries require an ADR-level architectural decision; never
#   add here without the 4-step hierarchy:
#     1. Try make-it-impossible (upgrade dep)
#     2. Try make-it-automatic (cargo update)
#     3. Try make-it-detectable (this file — tracked ignore)
#     4. Document as ADR amendment
# ---------------------------------------------------------------------------

[advisories]

# Advisories below are UPSTREAM-BLOCKED (the immediate dep-tree author
# has not yet released a version with the fix). Each must be tracked.
ignore = [
    # -----------------------------------------------------------------
    # EDGE-CI-001 RESOLVED 2026-06-11 (RUST-CVE-001): the rustls-webpki
    # 0.102.8 chain (RUSTSEC-2026-0098/0099/0049/0104) was removed —
    # rumqttc resolves to the vendored fork at ../crates/local-rumqttc
    # (decision path (a) from the original entry: suderra fork bumping
    # rustls-webpki to >= 0.103). Regression blocked by deny.toml [bans].
    # -----------------------------------------------------------------

    # -----------------------------------------------------------------
    # rsa 0.9.10 Marvin Attack (RUSTSEC-2023-0071) — NO UPSTREAM FIX
    # -----------------------------------------------------------------
    # Finding: EDGE-CI-002
    # Owner:   platform-team (okan@noras-wt.com)
    # Deadline: NO_FIX_AVAILABLE — re-evaluate quarterly.
    # Upstream: rustcrypto/RSA — the advisory notes fix requires a rewrite
    #   of the decryption path; maintainers have NOT published a fix. The
    #   crate is still recommended for non-decryption use (signing,
    #   verification). Our async-opcua usage is for OPC UA X.509 server
    #   cert VERIFICATION (not decryption); Marvin Attack requires timing-
    #   measurable decryption oracle, which our path does not expose.
    # Mitigation: OPC UA feature (`opc-ua-server`) is OFF by default. Only
    #   deployments explicitly enabling the feature ship the rsa crate.
    #   When enabled, the server only verifies client certs — no RSA-OAEP
    #   decryption is performed. Sprint 6.5 enforces this via the
    #   feature-flag discipline.
    "RUSTSEC-2023-0071",

    # -----------------------------------------------------------------
    # Unmaintained-but-still-safe advisories (Warning-level)
    # -----------------------------------------------------------------
    # These do not represent active vulnerabilities — they signal that
    # upstream is no longer actively maintained. Architectural decision:
    # accept until a replacement with behavioral parity ships.

    # Finding: EDGE-CI-003 / RUST-MEDIUM-004 — bincode 1.3.3 unmaintained
    # Owner: security-reviewer; Deadline: 2026-12-01 (quarterly review)
    # Why: Plan Batch 1 PINS bincode=1.3.3 for wire-format stability of
    #   audit HMAC chain + rbac manifest canonical bytes (Batches 6/5b/8).
    #   Bumping to bincode 2.x changes the on-wire byte representation
    #   breaking every historical audit entry + signature. Migration is
    #   a coordinated fleet event + ADR-level decision.
    "RUSTSEC-2025-0141",

    # Finding: EDGE-CI-005 RESOLVED 2026-06-11 (RUST-CVE-001) —
    #   RUSTSEC-2025-0134 removed; the local-rumqttc fork decodes PEM
    #   via rustls-pki-types, clearing rustls-pemfile from this
    #   workspace's graph. Regression blocked by deny.toml [bans].

    # Finding: EDGE-CI-006 / RUST-MEDIUM-004 — atomic-polyfill 1.0.3
    #   unmaintained
    # Owner: security-reviewer; Deadline: 2026-12-01 (quarterly review)
    # Why: Transitive via async-opcua -> postcard -> heapless. The latest
    #   async-opcua 0.19.0 lock still contains this graph. No active
    #   vulnerability; replacement remains upstream-blocked.
    "RUSTSEC-2023-0089",

    # Finding: EDGE-CI-007 — proc-macro-error2 2.0.1 unmaintained
    # Owner: platform-team; Deadline: 2026-10-01
    # Why: Build-time-only transitive (proc-macro-error2 <- defmt-macros <-
    #   defmt <- lorawan stack); never reaches the shipped binary. STILL
    #   RESOLVES in Cargo.lock; advisory live upstream. The 2026-07-11
    #   removal was reverted on 2026-07-12 (PR935-HIGH-001) — the crate had
    #   not left the tree. Mirrored in deny.toml + both workflow audit steps
    #   per the advisory-ignore-sync contract.
    "RUSTSEC-2026-0173",

    # Finding: EDGE-CI-008 — paste 1.0.15 unmaintained
    # Owner: platform-team; Deadline: 2026-12-01
    # Why: Build-time-only transitive via wasmi (wasmi_core) behind the
    #   wasm-codec LoRa custom-decoder feature (OFF by default). paste is
    #   an archived proc-macro helper; no wasmi release drops it yet —
    #   re-check on each wasmi bump. No active vulnerability — unmaintained
    #   signal only; the proc-macro never reaches the shipped binary.
    "RUSTSEC-2024-0436",
]
