# =============================================================================
# Nginx Configuration for DigitalOcean Droplet
# Reverse proxy for Aquaculture Platform
# HTTPS with Let's Encrypt
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 2048;

events {
    worker_connections 1024;
    multi_accept on;
}

# =============================================================================
# MQTT TLS Termination (stream proxy)
# Edge agents connect to port 8883 (TLS) → Nginx terminates TLS →
# forwards plain MQTT to mosquitto:1883 on internal Docker network.
# =============================================================================
stream {
    upstream mqtt_backend {
        server mosquitto:1883;
    }

    server {
        listen 8883 ssl;

        ssl_certificate /etc/letsencrypt/live/app.suderra.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.suderra.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        proxy_pass mqtt_backend;
        proxy_connect_timeout 10s;
        proxy_timeout 300s;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Security: Hide nginx version from response headers
    server_tokens off;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Request size limit (SEC-NM-016)
    client_max_body_size 10M;

    # SEC-NM-008: WebSocket upgrade map - avoids duplicate/conflicting Connection header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    # SEC-NM-010: CDN real IP extraction (uncomment and set CDN ranges if behind Cloudflare)
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # real_ip_header CF-Connecting-IP;

    # ARCH-017: Rate limiting zones — defined here (where they are used)
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=graphql:10m rate=60r/s;

    # Upstreams
    upstream gateway {
        server gateway-api:3000;
    }

    upstream shell {
        server shell:80;
    }

    upstream dashboard {
        server dashboard:80;
    }

    upstream farm-module {
        server farm-module:80;
    }

    upstream sensor-module {
        server sensor-module:80;
    }

    upstream admin-panel {
        server admin-panel:80;
    }

    upstream tenant-admin {
        server tenant-admin:80;
    }

    upstream hr-module {
        server hr-module:80;
    }

    upstream hydroponics-module {
        server hydroponics-module:80;
    }

    upstream admin-api {
        server admin-api-service:3000;
    }

    upstream sensor-api {
        server sensor-service:3000;
    }

    upstream aquamobil {
        server aquamobil:80;
    }

    # Block direct IP access (HTTP) + Docker health check
    server {
        listen 80 default_server;
        server_name _;

        # Health check for Docker (accessible via localhost)
        location = /nginx-health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Block everything else
        location / {
            return 444;
        }
    }

    # Block direct IP access (HTTPS)
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate /etc/letsencrypt/live/app.suderra.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.suderra.com/privkey.pem;
        return 444;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name app.suderra.com;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check (keep on HTTP for internal monitoring)
        location = /nginx-health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name app.suderra.com;

        # SSL certificates (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/app.suderra.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.suderra.com/privkey.pem;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; script-src-elem 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; worker-src 'self' blob:; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://server.arcgisonline.com https://*.basemaps.cartocdn.com https://wmts.marine.copernicus.eu https://sh.dataspace.copernicus.eu; connect-src 'self' ws: wss: https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; frame-src 'self';" always;

        # Block debug endpoints in production (H-3)
        location /api/debug {
            return 404;
        }

        # Block Swagger docs in production (C-1 defense-in-depth)
        location /api/docs {
            return 404;
        }

        # Edge device provisioning — installer script download
        # Called by: curl -sSL https://app.suderra.com/install/{deviceCode}?token=... | sudo bash
        location /install/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://sensor-api/install/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Edge device activation & self-registration REST endpoints
        location /api/devices/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://sensor-api/api/devices/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MQTT auth endpoints — internal only (Mosquitto go-auth plugin).
        # These endpoints MUST NOT be exposed to external traffic because an attacker
        # could brute-force MQTT credentials by calling /mqtt/auth directly.
        # Mosquitto reaches sensor-service via the aqua-internal Docker network,
        # so this Nginx location is not needed and is blocked.
        location /mqtt/ {
            deny all;
            return 403;
        }

        # robots.txt (L-1)
        location = /robots.txt {
            add_header Content-Type text/plain;
            return 200 "User-agent: *\nDisallow: /api/\nDisallow: /graphql\nDisallow: /health\nDisallow: /remotes/\nAllow: /\n";
        }

        # Block /metrics from public traffic (SEC-NM-005)
        location /metrics {
            deny all;
            return 403;
        }

        # Socket.io WebSocket proxy (ST Language Service, Sensor Readings)
        location /socket.io/ {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;

            # Prevent duplicate security headers
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Content-Security-Policy;
        }

        # GraphQL API
        location /graphql {
            # ARCH-017: Apply rate limiting to GraphQL endpoint
            limit_req zone=graphql burst=30 nodelay;

            proxy_pass http://gateway;
            proxy_http_version 1.1;
            # SEC-NM-008: map-based Connection header handles both WS upgrade and HTTP keep-alive
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;

            # Prevent duplicate security headers (M-2, L-4)
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Content-Security-Policy;
        }

        # Gateway health endpoint
        location /health {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
        }

        # Admin API REST endpoints
        location /api/ {
            # ARCH-017: Apply rate limiting to REST API endpoint
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://admin-api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Prevent duplicate security headers (M-2, L-4)
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Content-Security-Policy;
        }

        # Microfrontend remotes — no-cache for remoteEntry.js, cache for assets
        location /remotes/dashboard/ {
            proxy_pass http://dashboard/;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /remotes/farm-module/ {
            proxy_pass http://farm-module/;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /remotes/sensor-module/ {
            proxy_pass http://sensor-module/;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /remotes/admin-panel/ {
            proxy_pass http://admin-panel/;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /remotes/tenant-admin/ {
            proxy_pass http://tenant-admin/;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /remotes/hr-module/ {
            proxy_pass http://hr-module/;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /remotes/hydroponics-module/ {
            proxy_pass http://hydroponics-module/;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /mobile/ {
            proxy_pass http://aquamobil/;
            add_header Access-Control-Allow-Origin *;
        }

        # Shell (host application) - catch-all for SPA routing
        location / {
            proxy_pass http://shell;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }
}
