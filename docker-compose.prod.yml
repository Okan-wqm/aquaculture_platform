# =============================================================================
# Aquaculture Platform - Production Docker Compose
# DigitalOcean Droplet Deployment
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# =============================================================================

# =============================================================================
# Networks
# =============================================================================
networks:
  aqua-network:
    driver: bridge
  aqua-internal:
    driver: bridge
    internal: true

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
  redis_data:
  nats_data:
  backup_data:

# =============================================================================
# Services
# =============================================================================
services:
  # ===========================================================================
  # Infrastructure Services
  # ===========================================================================

  # PostgreSQL with TimescaleDB
  postgres:
    # Pinned 2026-04-05. To update: verify changelog at https://github.com/timescale/timescaledb/releases, test in staging first.
    image: timescale/timescaledb:2.17.2-pg16
    container_name: aqua-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquaculture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-aquaculture}
      POSTGRES_SSL: "on"
    command: >
      postgres
      -c ssl=on
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./certs/postgres:/var/lib/postgresql/ssl:ro
    networks:
      - aqua-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquaculture}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    # Pinned 2026-04-05. To update: verify changelog at https://github.com/redis/redis/releases, test in staging first.
    image: redis:7.2.7-alpine
    container_name: aqua-redis
    restart: unless-stopped
    # IP-1: TLS via redis-tls.conf
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data:/data
      - ./infrastructure/docker/redis/redis-tls.conf:/etc/redis/redis.conf:ro
      - ./certs/redis:/etc/redis/certs:ro
    networks:
      - aqua-internal
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli --tls --cacert /etc/redis/certs/ca-cert.pem ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NATS Message Broker
  nats:
    # Pinned 2026-04-05. To update: verify changelog at https://github.com/nats-io/nats-server/releases, test in staging first.
    image: nats:2.10.24-alpine
    container_name: aqua-nats
    restart: unless-stopped
    # ARCH-010/ARCH-018: Use config file for explicit JetStream limits + http_port
    # The config file enables http_port 8222 (required for /healthz endpoint below)
    command: ["--config", "/etc/nats/nats.conf"]
    environment:
      # SECURITY (HIGH-001, SEC-006): NATS credentials substituted into
      # nats.conf authorization{} block. Each service has its own user with
      # subject-level pub/sub ACLs. Without per-service creds provisioned
      # here, the ACL design in nats.conf has no runtime effect.
      # Legacy shared account (migration bridge — to be removed post-rollout).
      NATS_USER: ${NATS_USER:-nats_internal}
      NATS_PASS: "${NATS_PASS:?NATS_PASS is required}"
      # Per-service NATS accounts (mirror nats.conf $NATS_<SERVICE>_USER/PASS).
      NATS_AUTH_USER: ${NATS_AUTH_USER:-auth_service}
      NATS_AUTH_PASS: "${NATS_AUTH_PASS:?NATS_AUTH_PASS is required}"
      NATS_FARM_USER: ${NATS_FARM_USER:-farm_service}
      NATS_FARM_PASS: "${NATS_FARM_PASS:?NATS_FARM_PASS is required}"
      NATS_SENSOR_USER: ${NATS_SENSOR_USER:-sensor_service}
      NATS_SENSOR_PASS: "${NATS_SENSOR_PASS:?NATS_SENSOR_PASS is required}"
      NATS_GATEWAY_USER: ${NATS_GATEWAY_USER:-gateway_service}
      NATS_GATEWAY_PASS: "${NATS_GATEWAY_PASS:?NATS_GATEWAY_PASS is required}"
      NATS_NOTIFICATION_USER: ${NATS_NOTIFICATION_USER:-notification_service}
      NATS_NOTIFICATION_PASS: "${NATS_NOTIFICATION_PASS:?NATS_NOTIFICATION_PASS is required}"
      NATS_BILLING_USER: ${NATS_BILLING_USER:-billing_service}
      NATS_BILLING_PASS: "${NATS_BILLING_PASS:?NATS_BILLING_PASS is required}"
      NATS_ALERT_USER: ${NATS_ALERT_USER:-alert_engine}
      NATS_ALERT_PASS: "${NATS_ALERT_PASS:?NATS_ALERT_PASS is required}"
      NATS_HR_USER: ${NATS_HR_USER:-hr_service}
      NATS_HR_PASS: "${NATS_HR_PASS:?NATS_HR_PASS is required}"
      NATS_MESSAGING_USER: ${NATS_MESSAGING_USER:-messaging_service}
      NATS_MESSAGING_PASS: "${NATS_MESSAGING_PASS:?NATS_MESSAGING_PASS is required}"
      NATS_HYDROPONICS_USER: ${NATS_HYDROPONICS_USER:-hydroponics_service}
      NATS_HYDROPONICS_PASS: "${NATS_HYDROPONICS_PASS:?NATS_HYDROPONICS_PASS is required}"
    volumes:
      - nats_data:/data
      - ./infrastructure/docker/nats/nats.conf:/etc/nats/nats.conf:ro
      - ./infrastructure/docker/nats/nats-tls-enabled.conf:/etc/nats/nats-tls.conf:ro
      - ./certs/nats:/etc/nats/certs:ro
    networks:
      - aqua-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Backend Services (from GHCR)
  # ===========================================================================

  gateway-api:
    image: ghcr.io/okan-wqm/aquaculture_platform/gateway-api:${TAG:-latest}
    container_name: aqua-gateway
    restart: unless-stopped
    environment:
      SERVICE_NAME: gateway-api
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://gateway_service:${GATEWAY_SERVICE_DB_PASS:?GATEWAY_SERVICE_DB_PASS is required}@postgres:5432/${POSTGRES_DB:-aquaculture}?sslmode=require
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: tls://nats:4222
      # SECURITY (HIGH-001): gateway-api authenticates to NATS with its own account.
      # Subject ACLs in nats.conf restrict what gateway can publish/subscribe.
      NATS_AUTH_USER: ${NATS_GATEWAY_USER:?NATS_GATEWAY_USER is required}
      NATS_AUTH_PASS: "${NATS_GATEWAY_PASS:?NATS_GATEWAY_PASS is required}"
      # SECURITY (CRITICAL-001): consumer — verifies tokens with RS256 public key.
      # JWT_SECRET removed; auth-service holds the private key exclusively.
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      # Service URLs for federation
      AUTH_SERVICE_URL: http://auth-service:3000/graphql
      FARM_SERVICE_URL: http://farm-service:3000/graphql
      SENSOR_SERVICE_URL: http://sensor-service:3000/graphql
      HR_SERVICE_URL: http://hr-service:3000/graphql
      BILLING_SERVICE_URL: http://billing-service:3000/graphql
      ALERT_SERVICE_URL: http://alert-engine:3000/graphql
      HYDROPONICS_SERVICE_URL: http://hydroponics-service:3000/graphql
      CONFIG_SERVICE_URL: http://config-service:3000/graphql
      ADMIN_SERVICE_URL: http://admin-api-service:3000/graphql
    volumes:
      - ./certs/jwt/public.pem:/var/run/jwt/public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - aqua-network
      - aqua-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  auth-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/auth-service:${TAG:-latest}
    container_name: aqua-auth
    restart: unless-stopped
    environment:
      SERVICE_NAME: auth-service
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://auth_service:${AUTH_SERVICE_DB_PASS:?AUTH_SERVICE_DB_PASS is required}@postgres:5432/${POSTGRES_DB:-aquaculture}?sslmode=require
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: tls://nats:4222
      # SECURITY (HIGH-001): auth-service NATS account — matches nats.conf $NATS_AUTH_USER block.
      NATS_AUTH_USER: ${NATS_AUTH_USER:?NATS_AUTH_USER is required}
      NATS_AUTH_PASS: "${NATS_AUTH_PASS:?NATS_AUTH_PASS is required}"
      # SECURITY (CRITICAL-001): auth-service is the sole token issuer.
      # Private key for signing; public key also loaded so it can verify its own tokens.
      # JWT_SECRET removed — RS256 asymmetric signing replaces the shared HS256 secret.
      JWT_PRIVATE_KEY_PATH: /var/run/jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    volumes:
      - ./certs/jwt:/var/run/jwt:ro
    depends_on:
      - postgres
      - redis
    networks:
      - aqua-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  farm-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/farm-service:${TAG:-latest}
    container_name: aqua-farm
    restart: unless-stopped
    environment:
      SERVICE_NAME: farm-service
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://farm_service:${FARM_SERVICE_DB_PASS:?FARM_SERVICE_DB_PASS is required}@postgres:5432/${POSTGRES_DB:-aquaculture}?sslmode=require
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: tls://nats:4222
      # SECURITY (HIGH-001): farm-service NATS account with farm-scoped subject ACLs.
      NATS_AUTH_USER: ${NATS_FARM_USER:?NATS_FARM_USER is required}
      NATS_AUTH_PASS: "${NATS_FARM_PASS:?NATS_FARM_PASS is required}"
      # SECURITY (CRITICAL-001): RS256 public-key verification (consumer only).
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
    volumes:
      - ./certs/jwt/public.pem:/var/run/jwt/public.pem:ro
    depends_on:
      - postgres
      - redis
    networks:
      - aqua-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  sensor-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/sensor-service:${TAG:-latest}
    container_name: aqua-sensor
    restart: unless-stopped
    environment:
      SERVICE_NAME: sensor-service
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://sensor_service:${SENSOR_SERVICE_DB_PASS:?SENSOR_SERVICE_DB_PASS is required}@postgres:5432/${POSTGRES_DB:-aquaculture}?sslmode=require
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: tls://nats:4222
      # SECURITY (HIGH-001): sensor-service NATS account with sensor-scoped subject ACLs.
      NATS_AUTH_USER: ${NATS_SENSOR_USER:?NATS_SENSOR_USER is required}
      NATS_AUTH_PASS: "${NATS_SENSOR_PASS:?NATS_SENSOR_PASS is required}"
      # SECURITY (CRITICAL-001): RS256 public-key verification (consumer only).
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
    volumes:
      - ./certs/jwt/public.pem:/var/run/jwt/public.pem:ro
    depends_on:
      - postgres
      - redis
    networks:
      - aqua-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  hr-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/hr-service:${TAG:-latest}
    container_name: aqua-hr
    restart: unless-stopped
    environment:
      SERVICE_NAME: hr-service
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://hr_service:${HR_SERVICE_DB_PASS:?HR_SERVICE_DB_PASS is required}@postgres:5432/${POSTGRES_DB:-aquaculture}?sslmode=require
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: tls://nats:4222
      # SECURITY (HIGH-001): hr-service NATS account with HR-scoped subject ACLs.
      NATS_AUTH_USER: ${NATS_HR_USER:?NATS_HR_USER is required}
      NATS_AUTH_PASS: "${NATS_HR_PASS:?NATS_HR_PASS is required}"
      # SECURITY (CRITICAL-001): RS256 public-key verification (consumer only).
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
    volumes:
      - ./certs/jwt/public.pem:/var/run/jwt/public.pem:ro
    depends_on:
      - postgres
      - redis
    networks:
      - aqua-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  billing-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/billing-service:${TAG:-latest}
    container_name: aqua-billing
    restart: unless-stopped
    environment:
      SERVICE_NAME: billing-service
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://billing_service:${BILLING_SERVICE_DB_PASS:?BILLING_SERVICE_DB_PASS is required}@postgres:5432/${POSTGRES_DB:-aquaculture}?sslmode=require
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: tls://nats:4222
      # SECURITY (HIGH-001): billing-service NATS account with billing-scoped subject ACLs.
      NATS_AUTH_USER: ${NATS_BILLING_USER:?NATS_BILLING_USER is required}
      NATS_AUTH_PASS: "${NATS_BILLING_PASS:?NATS_BILLING_PASS is required}"
      # SECURITY (CRITICAL-001): RS256 public-key verification (consumer only).
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
    volumes:
      - ./certs/jwt/public.pem:/var/run/jwt/public.pem:ro
    depends_on:
      - postgres
      - redis
    networks:
      - aqua-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  alert-engine:
    image: ghcr.io/okan-wqm/aquaculture_platform/alert-engine:${TAG:-latest}
    container_name: aqua-alert
    restart: unless-stopped
    environment:
      SERVICE_NAME: alert-engine
      NODE_ENV: production
      PORT: 3000
      # ARCH-V11-011: CORS_ORIGINS required — alert-engine throws if wildcard in production
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      DATABASE_URL: postgres://alert_service:${ALERT_SERVICE_DB_PASS:?ALERT_SERVICE_DB_PASS is required}@postgres:5432/${POSTGRES_DB:-aquaculture}?sslmode=require
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: tls://nats:4222
      # SECURITY (HIGH-001): alert-engine NATS account with alert-scoped subject ACLs.
      NATS_AUTH_USER: ${NATS_ALERT_USER:?NATS_ALERT_USER is required}
      NATS_AUTH_PASS: "${NATS_ALERT_PASS:?NATS_ALERT_PASS is required}"
      # SECURITY (CRITICAL-001): RS256 public-key verification (consumer only).
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
    volumes:
      - ./certs/jwt/public.pem:/var/run/jwt/public.pem:ro
    depends_on:
      - postgres
      - redis
      - nats
    networks:
      - aqua-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  notification-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/notification-service:${TAG:-latest}
    container_name: aqua-notification
    restart: unless-stopped
    environment:
      SERVICE_NAME: notification-service
      NODE_ENV: production
      PORT: 3000
      # ARCH-V11-012: CORS_ORIGINS required — notification-service throws if wildcard in production
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      DATABASE_URL: postgres://notification_service:${NOTIFICATION_SERVICE_DB_PASS:?NOTIFICATION_SERVICE_DB_PASS is required}@postgres:5432/${POSTGRES_DB:-aquaculture}?sslmode=require
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: tls://nats:4222
      # SECURITY (HIGH-001): notification-service NATS account with notification-scoped ACLs.
      NATS_AUTH_USER: ${NATS_NOTIFICATION_USER:?NATS_NOTIFICATION_USER is required}
      NATS_AUTH_PASS: "${NATS_NOTIFICATION_PASS:?NATS_NOTIFICATION_PASS is required}"
      # SECURITY (CRITICAL-001): RS256 public-key verification (consumer only).
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
      # Email config (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - ./certs/jwt/public.pem:/var/run/jwt/public.pem:ro
    depends_on:
      - postgres
      - redis
      - nats
    networks:
      - aqua-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  admin-api-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/admin-api-service:${TAG:-latest}
    container_name: aqua-admin-api
    restart: unless-stopped
    environment:
      SERVICE_NAME: admin-api-service
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://admin_service:${ADMIN_SERVICE_DB_PASS:?ADMIN_SERVICE_DB_PASS is required}@postgres:5432/${POSTGRES_DB:-aquaculture}?sslmode=require
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: admin_service
      DATABASE_PASSWORD: ${ADMIN_SERVICE_DB_PASS:?ADMIN_SERVICE_DB_PASS is required}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: tls://nats:4222
      # SECURITY (HIGH-001): admin-api shares the gateway NATS account per
      # nats.conf comment — both publish tenant/admin lifecycle events on
      # AQUACULTURE_EVENTS.Tenant*/Admin*. Separate account would double the
      # ACL surface without adding isolation value.
      NATS_AUTH_USER: ${NATS_GATEWAY_USER:?NATS_GATEWAY_USER is required}
      NATS_AUTH_PASS: "${NATS_GATEWAY_PASS:?NATS_GATEWAY_PASS is required}"
      # SECURITY (CRITICAL-001): RS256 public-key verification (consumer only).
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
    volumes:
      - backup_data:/backups
      - ./certs/jwt/public.pem:/var/run/jwt/public.pem:ro
    depends_on:
      - postgres
      - redis
    networks:
      - aqua-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  observability-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/observability-service:${TAG:-latest}
    container_name: aqua-observability
    restart: unless-stopped
    environment:
      SERVICE_NAME: observability-service
      NODE_ENV: production
      PORT: 3009
      # INTERNAL_API_KEY must be set; guard rejects all requests in production without it
      INTERNAL_API_KEY: ${OBSERVABILITY_INTERNAL_API_KEY:?OBSERVABILITY_INTERNAL_API_KEY required}
      # observability-service reads DB_* env vars (not DATABASE_*)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-aquaculture}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: aquaculture
    depends_on:
      - postgres
    # Attached to aqua-internal only — no published ports, not reachable from aqua-network
    networks:
      - aqua-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3009/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Frontend Services (from GHCR)
  # ===========================================================================

  shell:
    image: ghcr.io/okan-wqm/aquaculture_platform/shell:${TAG:-latest}
    container_name: aqua-shell
    restart: unless-stopped
    networks:
      - aqua-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    image: ghcr.io/okan-wqm/aquaculture_platform/dashboard:${TAG:-latest}
    container_name: aqua-dashboard
    restart: unless-stopped
    networks:
      - aqua-network

  farm-module:
    image: ghcr.io/okan-wqm/aquaculture_platform/farm-module:${TAG:-latest}
    container_name: aqua-farm-module
    restart: unless-stopped
    networks:
      - aqua-network

  hr-module:
    image: ghcr.io/okan-wqm/aquaculture_platform/hr-module:${TAG:-latest}
    container_name: aqua-hr-module
    restart: unless-stopped
    networks:
      - aqua-network

  sensor-module:
    image: ghcr.io/okan-wqm/aquaculture_platform/sensor-module:${TAG:-latest}
    container_name: aqua-sensor-module
    restart: unless-stopped
    networks:
      - aqua-network

  admin-panel:
    image: ghcr.io/okan-wqm/aquaculture_platform/admin-panel:${TAG:-latest}
    container_name: aqua-admin-panel
    restart: unless-stopped
    networks:
      - aqua-network

  tenant-admin:
    image: ghcr.io/okan-wqm/aquaculture_platform/tenant-admin:${TAG:-latest}
    container_name: aqua-tenant-admin
    restart: unless-stopped
    networks:
      - aqua-network

  aquamobil:
    image: ghcr.io/okan-wqm/aquaculture_platform/aquamobil:${TAG:-latest}
    container_name: aqua-mobile
    restart: unless-stopped
    networks:
      - aqua-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Reverse Proxy (Nginx)
  # ===========================================================================
  nginx:
    # Pinned 2026-04-05. To update: verify changelog at https://nginx.org/en/CHANGES, test in staging first.
    image: nginx:1.27.5-alpine
    container_name: aqua-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot:/var/www/certbot:ro
    depends_on:
      - gateway-api
      - shell
      - aquamobil
    networks:
      - aqua-network
    healthcheck:
      # ARCH-012: Use /health (nginx-level endpoint) — nginx has no /health/live path
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
