name: Database Migration Check

# =============================================================================
# Database Migration Check — TypeORM Migration Validation
#
# PURPOSE
# -------
# Fast, hermetic validation of the TypeORM migration files that actually
# ship with this codebase, with no database, no NX build, and no docker.
# The previous revision of this workflow tried to:
#
#   1. Build gateway-api with `npx nx build gateway-api`, then run
#      `typeorm migration:run -d dist/apps/gateway-api/src/data-source.js`.
#      Neither gateway-api nor any other service owns a `data-source.ts`
#      file — migrations are registered as class references inside
#      `TypeOrmModule.forRoot({ migrations: [...] })` and executed at
#      service-boot time by `MigrationRunnerService`, not by the typeorm
#      CLI. The step has never worked in this codebase.
#
#   2. Run Flyway validate against `database/migrations/core/**` and
#      `database/migrations/modules/**`. The Flyway tree is a
#      vestigial scaffolding experiment that was never wired into
#      the runtime — nothing in the application code references
#      `database/migrations/**` (every service registers its own
#      TypeORM migration classes via TypeOrmModule.forRoot per the
#      WHAT THIS WORKFLOW CHECKS NOW section below). The Flyway
#      job was removed when this workflow was rewritten.
#
#      DATA-LOW-002 cure: a previous revision of this comment
#      claimed "9 of the 13 SQL files in that tree are empty (0
#      bytes)". Direct file-size check at 2026-04-29 showed every
#      `database/migrations/core/V*.sql` carried 281–2491 bytes
#      and every `database/migrations/modules/<svc>/V*.sql` carried
#      762–5598 bytes. None empty. The misclaim was a documentation-
#      rot artifact from a much earlier iteration of the tree —
#      kept here as a historical note in case future maintainers
#      grep for the old phrasing.
#
#      The Flyway tree itself is left in place so the git history
#      stays intact and anyone looking for the old Flyway design
#      can still find it. DATA-HIGH-001 (the agent's separate
#      tracking finding for the orphan tree) covers the eventual
#      removal — until that lands, this workflow neither validates
#      the tree nor relies on it.
#
# Beyond that, the `npx nx build` step hung silently for hours on every
# run because the Windows-generated `package-lock.json` has no
# `@nx/nx-linux-x64-gnu` binary; without it NX hangs until the 6-hour
# GitHub Actions runner timeout. Five zombie runs piled up at
# 09:36Z, 12:27Z, 13:37Z, 13:53Z, and 14:28Z on 2026-04-07 before this
# rewrite landed.
#
# WHAT THIS WORKFLOW CHECKS NOW
# -----------------------------
# The real migration path in this codebase is
# `apps/<service>/src/**/migrations/<timestamp>-<Name>.ts`, one class
# per file, registered in the service's AppModule. The checks below
# match that reality:
#
#   1. Filename convention — every migration file name must match
#      `<13-digit-timestamp>-<PascalCaseName>.ts`.
#   2. Class name consistency — the exported class inside must be
#      named `<PascalCaseName><timestamp>` and match the file name.
#   3. Global timestamp uniqueness — no two migrations anywhere in the
#      repo may share the same timestamp. Collisions would produce
#      undefined ordering under TypeORM's migration runner.
#   4. Syntax / type check — each migration file compiles under
#      `tsc --noEmit` against the service's `tsconfig.build.json` so
#      structural errors (missing imports, bad decorator usage, typos
#      in table names as SQL string literals — the latter caught only
#      at runtime but the former all caught here) surface at PR time
#      instead of at deploy time.
#
# The job finishes in well under a minute and has no external
# dependencies: no postgres, no docker, no native binaries, no NX.
# It cannot hang.
#
# Real integration-level migration validation — i.e. "does the
# migration actually run against a database" — happens at deploy time
# via `MigrationRunnerService.onApplicationBootstrap()` and the
# deploy workflow's `Verify deployment` health check. Two different
# quality gates at two different layers, neither duplicating the
# other's work.
#
# SEC-CI-002: All third-party actions pinned to full commit SHAs.
# =============================================================================

on:
  pull_request:
    paths:
      - 'apps/*/src/**/migrations/**'
      - 'apps/*/src/**/*.entity.ts'
      - 'infrastructure/docker/init-scripts/**'
      - 'apps/db-migrate/src/__tests__/bootstrap-from-scratch.spec.ts'
      - 'e2e/tests/integration/tenant-clone-parity.spec.ts'
      - 'e2e/tests/integration/schema-invariants.spec.ts'
      - '.github/workflows/db-migration-check.yml'
  push:
    branches: [main, develop]
    paths:
      - 'apps/*/src/**/migrations/**'
      - 'infrastructure/docker/init-scripts/**'
      - 'apps/db-migrate/src/__tests__/bootstrap-from-scratch.spec.ts'
      - 'e2e/tests/integration/tenant-clone-parity.spec.ts'
      - 'e2e/tests/integration/schema-invariants.spec.ts'
      - '.github/workflows/db-migration-check.yml'
  # Wave 4-A.2 Dalga 5 — nightly run catches drift that touched zero
  # path-filtered files but introduced runtime drift (e.g. an
  # init-script change merged through a different filename, or a
  # silent platform-image bump in docker-compose.infra.yml). 03:00
  # UTC chosen to follow the post-midnight infra-quiet window in
  # docs/runbooks/.
  schedule:
    - cron: '0 3 * * *'

# SEC-CI-021: Minimum token permissions.
permissions:
  contents: read

jobs:
  typeorm-migration-validation:
    runs-on: ubuntu-latest
    # Bounded budget — the checks take ~30 seconds on a cold runner.
    # 10 minutes is a generous ceiling that still guarantees no zombies.
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # -------------------------------------------------------------------
      # Check 1 + 2: filename convention and class name consistency.
      # Pure shell — no node_modules needed. Fails fast on the first bad
      # file with an inline GitHub annotation so the PR reviewer can
      # click straight to the offending line.
      # -------------------------------------------------------------------
      - name: Validate migration filename and class name conventions
        run: |
          set -euo pipefail
          INVALID=0
          while IFS= read -r file; do
            base=$(basename "$file")
            # Expected: <13-digit-timestamp>-<PascalCaseName>.ts
            if ! echo "$base" | grep -qE '^[0-9]{13}-[A-Z][A-Za-z0-9]*\.ts$'; then
              echo "::error file=$file::Invalid migration filename: '$base' (expected <13-digit-timestamp>-<PascalCaseName>.ts)"
              INVALID=1
              continue
            fi

            # Derive the expected class name from the file name:
            #   "1781900000000-ConvertAuditColumnsToTimestamptz.ts"
            # → class "ConvertAuditColumnsToTimestamptz1781900000000"
            ts=$(echo "$base" | cut -d- -f1)
            name_ts=$(echo "$base" | sed -E 's/\.ts$//')
            name=${name_ts#*-}
            expected_class="${name}${ts}"

            if ! grep -qE "^export class ${expected_class}\b" "$file"; then
              echo "::error file=$file::Class name mismatch — expected 'export class ${expected_class}' based on filename '$base'"
              INVALID=1
            fi
          done < <(find apps -type f -name '[0-9]*-*.ts' -not -name '*.spec.ts' -not -name '*.test.ts' -path '*/migrations/*' -not -path '*/.archive/*' 2>/dev/null | sort)

          if [ "$INVALID" -eq 1 ]; then
            exit 1
          fi
          echo "All migration filenames and class names match convention."

      # -------------------------------------------------------------------
      # Check 3: no two migrations WITHIN A SINGLE SERVICE share a
      # timestamp. Each service owns its own `migrations` tracking table
      # (TypeORM runs migrations per DataSource, and every service
      # instantiates its own), so collisions only matter inside a service's
      # migration lineage. Collisions ACROSS services are not only allowed
      # but actively useful — they let a cross-cutting fix (e.g. NEW-H1,
      # which ships `1781900000000-ConvertAuditColumnsToTimestamptz` to
      # 5 services simultaneously) advertise its relationship through a
      # shared timestamp that's easy to grep and correlate in incident
      # forensics. Within a single service, however, TypeORM orders the
      # migration list by this timestamp and a duplicate produces
      # non-deterministic ordering — the classic "silently marks both as
      # applied even though only one actually runs" production nightmare.
      #
      # Implementation note: we group by the service directory extracted
      # from the path (everything between `apps/` and `/src/...`), then
      # count duplicate timestamps inside each group independently.
      # -------------------------------------------------------------------
      - name: Check for duplicate migration timestamps within each service
        run: |
          set -euo pipefail
          FAILED=0
          # Derive the list of services that actually own migrations.
          # ADR-030 day-one reset archived the pre-baseline chain into
          # apps/<svc>/src/(database/)migrations/.archive/<timestamp>/.
          # Those files share the 1800000000000-Baseline.ts timestamp by
          # design (the consolidated baseline collapsed them into a
          # single id) but are NEVER loaded by any DataSource's
          # `migrations: [...]` array. Excluding `.archive/` from this
          # scan is the structurally correct shape: TypeORM duplicate-
          # timestamp ordering hazard only matters for files the runner
          # actually loads.
          services=$(
            find apps -type f -name '[0-9]*-*.ts' -not -name '*.spec.ts' -not -name '*.test.ts' -path '*/migrations/*' -not -path '*/.archive/*' \
              | sed -E 's|^apps/([^/]+)/.*|\1|' \
              | sort -u
          )
          for svc in $services; do
            dupes=$(
              find "apps/${svc}" -type f -name '[0-9]*-*.ts' -not -name '*.spec.ts' -not -name '*.test.ts' -path '*/migrations/*' -not -path '*/.archive/*' \
                -exec basename {} \; \
                | cut -d- -f1 \
                | sort \
                | uniq -d
            )
            if [ -n "$dupes" ]; then
              echo "::error::Duplicate migration timestamps detected within service '$svc':"
              for ts in $dupes; do
                echo "  $ts is used by:"
                find "apps/${svc}" -type f -name "${ts}-*.ts" -not -name '*.spec.ts' -not -name '*.test.ts' -path '*/migrations/*' -not -path '*/.archive/*' | sed 's/^/    /'
              done
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "All migration timestamps are unique within each service."

      # -------------------------------------------------------------------
      # Check 4 — REMOVED in TRACK C (scope realignment).
      #
      # The previous revision compiled EVERY service that owns
      # migrations with `tsc --noEmit`, regardless of whether the PR
      # touched migration code. That made this gate fail on pre-existing
      # TS strict-null errors in totally unrelated libraries (e.g.
      # `libs/aquaculture-engines/water-chemistry/reagents.ts`) every
      # time anyone touched any `.entity.ts` file.
      #
      # Type-checking belongs in `ci-affected.yml`'s dedicated
      # `type-check` job which uses `nx affected -t type-check` —
      # only the services actually affected by a change get checked,
      # and the same gate applies uniformly to the whole codebase
      # (not just services that happen to own migrations).
      #
      # This workflow now focuses strictly on its named purpose:
      # migration filename / class-name / timestamp-uniqueness
      # conventions. The whole-service compile is no longer this
      # workflow's concern.
      # -------------------------------------------------------------------

  # ===================================================================
  # bootstrap-from-scratch — fresh-volume integration check.
  #
  # Runs the apps/db-migrate/src/__tests__/bootstrap-from-scratch.spec.ts test,
  # which spins up an empty Postgres testcontainer with the production
  # init-scripts mounted, runs every service's TypeORM migration chain
  # against it, and asserts the resulting schema state is what the
  # current entity surface expects.
  #
  # Why a separate job: this one needs a Docker daemon and ~5 minutes;
  # the conventions checks above are pure-shell <30s. Splitting keeps
  # PR feedback fast for the 99% case (filename/class-name regressions)
  # while still gating the rarer-but-catastrophic squash regression.
  #
  # GHA runners have docker preinstalled and the testcontainers library
  # autoreaches it; no extra setup beyond `npm ci`.
  # ===================================================================
  bootstrap-from-scratch:
    runs-on: ubuntu-latest
    # Wave 4-A.2 Dalga 5 — bootstrap-from-scratch is now ~8 minutes
    # because the entity-surface coverage matrix runs per service AND
    # the SchemaDriftValidator runtime gate (Part A.4) iterates each
    # service's metadata. 12-minute ceiling gives ~50% headroom while
    # keeping the zombie-job blast radius bounded.
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --ignore-scripts --no-fund

      # Wave 4-A.2 Dalga 5 — testcontainers image cache extension.
      # The Postgres pull (~250 MB compressed) dominates cold-start
      # time; restoring the image tarball from a cache key shaves
      # 60-90 seconds off every CI run that touches a path-filtered
      # surface. Cache key bound to the pinned digest in the spec
      # so a digest bump invalidates the cache (correct behaviour).
      - name: Restore docker image cache
        id: docker-image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/docker-image-cache
          key: db-migration-check-pg16-timescaledb-${{ hashFiles('apps/db-migrate/src/__tests__/bootstrap-from-scratch.spec.ts') }}

      - name: Load cached image (if present)
        if: steps.docker-image-cache.outputs.cache-hit == 'true'
        run: |
          if [ -f /tmp/docker-image-cache/timescaledb-pg16.tar ]; then
            docker load -i /tmp/docker-image-cache/timescaledb-pg16.tar
          fi

      - name: Run bootstrap-from-scratch test
        run: npm run test:bootstrap
        env:
          # testcontainers reuse cuts seconds off subsequent runs and is
          # safe in single-job CI (we don't reuse across jobs).
          TESTCONTAINERS_REUSE_ENABLE: 'true'

      - name: Save docker image cache
        if: steps.docker-image-cache.outputs.cache-hit != 'true'
        run: |
          # Best-effort: save the timescaledb-ha image to the cache for
          # future runs. The grep|head pipeline can return empty if the
          # testcontainer cleaned up before this step runs (race), or
          # produce an `<none>:<none>` tag when an image is referenced
          # only by digest. Both yield `docker save` "invalid reference
          # format" and a non-zero exit code that fails the whole job.
          # The cache is an optimization, not a correctness gate — the
          # bootstrap test has already completed successfully by the
          # time this step runs. Guard the docker invocation so a cache
          # miss-save degrades to a no-op instead of failing CI.
          mkdir -p /tmp/docker-image-cache
          IMAGE_REF=$(docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep timescaledb-ha \
            | grep -v '<none>' \
            | head -1)
          if [ -z "$IMAGE_REF" ]; then
            echo "No timescaledb-ha image with a usable tag found; skipping cache save."
            exit 0
          fi
          docker save -o /tmp/docker-image-cache/timescaledb-pg16.tar "$IMAGE_REF" \
            || echo "docker save failed for $IMAGE_REF; cache will be regenerated on next run."

  # ===================================================================
  # tenant-clone-parity — Wave 4-A.2 Dalga 5 Part C.
  #
  # Asserts that per-tenant schema clones are a structurally faithful,
  # RLS-enabled mirror of every source-schema table. Runs against a
  # live Postgres service container (NOT testcontainers) after applying
  # the same aqua-db-migrate entrypoint used by production deploys.
  #
  # Why a separate job from bootstrap-from-scratch: the bootstrap spec
  # is hermetic (its own testcontainer); tenant-clone-parity targets
  # the running e2e Postgres so it can exercise the actual production
  # migration/provisioning path, not a hand-rolled mock. Splitting also lets
  # this job complete in ~3 minutes vs the bootstrap job's 8.
  # ===================================================================
  tenant-clone-parity:
    runs-on: ubuntu-latest
    # 15 -> 20: the job now also provisions a real tenant through the
    # production provisioner (DATA-CRITICAL-010), which replays every
    # tenant-aware service's migration set into a fresh schema.
    timeout-minutes: 20
    env:
      AQUA_TEST_DB_VALUE: aquaculture-test

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16@sha256:b3d038d0a0757df8a5ec0a94ba68d9ad57b0e16100a024cf4b370c77ad5645f7
        env:
          POSTGRES_DB: aquaculture
          POSTGRES_USER: aquaculture
          POSTGRES_PASSWORD: aquaculture-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquaculture"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --ignore-scripts --no-fund

      - name: Run aqua-db-migrate against test DB
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: '5432'
          DATABASE_USER: aquaculture
          DATABASE_PASSWORD: aquaculture-test
          DATABASE_NAME: aquaculture
          AUTH_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          FARM_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          SENSOR_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          BILLING_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          HR_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          ALERT_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          ADMIN_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          GATEWAY_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          NOTIFICATION_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          HYDROPONICS_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          AI_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          MESSAGING_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          OBSERVABILITY_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          EVENT_STORE_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          CONFIG_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
        run: |
          npx ts-node \
            --project apps/db-migrate/tsconfig.app.json \
            -r tsconfig-paths/register \
            apps/db-migrate/src/main.ts

      - name: Run tenant-clone-parity test
        run: npm run test:tenant-clone
        env:
          DATABASE_URL: postgresql://aquaculture:aquaculture-test@localhost:5432/aquaculture

      # DATA-CRITICAL-010: the gate the finding's own closure criterion asks
      # for. Until this step, NO spec in the repository entered the PROVISION
      # branch — so "a super admin creates a tenant", the first thing the pilot
      # does, was the one path CI never executed, and a Baseline corpus that
      # could not be replayed into any tenant schema stayed green for four
      # months. It runs here because the database above has just been migrated
      # by the real db-migrate entry point, which is the same binary the spec
      # then invokes in `tenant-schema-provisioner --once` mode. The tenant it
      # creates is left in place on purpose: schema-invariants B.5a asserts
      # every tenant-scoped schema has at least one clone, and with
      # tenant-clone-parity dropping its fixture in afterAll that assertion was
      # passing against zero tenants on every run.
      - name: Provision a real tenant through the production provisioner
        env:
          DATABASE_URL: postgresql://aquaculture:aquaculture-test@localhost:5432/aquaculture
          DATABASE_HOST: localhost
          DATABASE_PORT: '5432'
          DATABASE_USER: aquaculture
          DATABASE_PASSWORD: aquaculture-test
          DATABASE_NAME: aquaculture
          AUTH_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          FARM_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          SENSOR_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          BILLING_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          HR_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          ALERT_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          ADMIN_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          GATEWAY_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          NOTIFICATION_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          HYDROPONICS_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          AI_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          MESSAGING_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          OBSERVABILITY_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          EVENT_STORE_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          CONFIG_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
        run: npm run test:tenant-provisioning

      # SENSOR-MEDIUM-052: CLAUDE.md named this spec as the per-PR schema
      # invariant gate, but nothing invoked it — this workflow only listed it as
      # a path filter. It runs here because the database above has just been
      # migrated by the real db-migrate entry point, which is exactly the live
      # DDL the spec asserts against (public/shared layout, per-service
      # cross-tenant `schema:` placement).
      - name: Run schema invariants against the migrated database
        run: npm run test:schema-invariants
        env:
          DATABASE_URL: postgresql://aquaculture:aquaculture-test@localhost:5432/aquaculture

  # ===================================================================
  # schema-invariants — physical schema layout gate (FARM-MEDIUM-303).
  #
  # `e2e/tests/integration/schema-invariants.spec.ts` named this
  # workflow as its home since the 2026-04-14 public-schema teardown,
  # but only ever appeared in the `paths:` filters above — it triggered
  # the workflow and was then never executed by any step. A spec that
  # nothing runs is not a gate: the B.1/B.2 assertions (an @Entity that
  # forgets `schema:` lands in `public`; a declared schema that does not
  # match the physical one) were silently uncovered the whole time,
  # which is exactly the multi-tenant isolation regression the teardown
  # plan was built to prevent.
  #
  # Why its own job rather than a step on tenant-clone-parity: the two
  # specs assert different things and must attribute their failures
  # separately — "which invariant broke" is readable from the job name,
  # matching how every other gate in this workflow is structured.
  #
  # Preconditions the spec needs, and where they come from:
  #   - every service schema present + owned by `<svc>_service`
  #     (assertion B.4) — created by aqua-db-migrate's platform
  #     bootstrap stage 003, which the migrate step below runs;
  #   - `shared` holding exactly the canonical cross-service tables
  #     (B.3) — bootstrap stage 006.
  # B.5a (tenant clones exist) is vacuous here because a freshly
  # migrated DB has no tenants; that is by the spec's own design — the
  # non-vacuous version of that check is tenant-clone-parity above,
  # which provisions a tenant schema and asserts against it directly.
  # ===================================================================
  schema-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AQUA_TEST_DB_VALUE: aquaculture-test

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16@sha256:b3d038d0a0757df8a5ec0a94ba68d9ad57b0e16100a024cf4b370c77ad5645f7
        env:
          POSTGRES_DB: aquaculture
          POSTGRES_USER: aquaculture
          POSTGRES_PASSWORD: aquaculture-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquaculture"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --ignore-scripts --no-fund

      - name: Run aqua-db-migrate against test DB
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: '5432'
          DATABASE_USER: aquaculture
          DATABASE_PASSWORD: aquaculture-test
          DATABASE_NAME: aquaculture
          AUTH_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          FARM_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          SENSOR_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          BILLING_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          HR_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          ALERT_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          ADMIN_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          GATEWAY_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          NOTIFICATION_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          HYDROPONICS_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          AI_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          MESSAGING_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          OBSERVABILITY_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          EVENT_STORE_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
          CONFIG_SERVICE_DB_PASS: ${{ env.AQUA_TEST_DB_VALUE }}
        run: |
          npx ts-node \
            --project apps/db-migrate/tsconfig.app.json \
            -r tsconfig-paths/register \
            apps/db-migrate/src/main.ts

      - name: Run schema-invariants test
        run: npm run test:schema-invariants
        env:
          DATABASE_URL: postgresql://aquaculture:aquaculture-test@localhost:5432/aquaculture

  # ===================================================================
  # migration-deletion-witness — pre-merge gate.
  #
  # Catches the silent-regression class where a migration file (or
  # an init-script with table-creating SQL) is deleted without
  # either a sibling-service migration carrying the same CREATE
  # forward, an init-script equivalent, or an explicit
  # `DELETE-OK: <reason>` line in the PR body. See
  # tools/gates/migration-deletion-witness.ts docblock for the full
  # algorithm.
  # ===================================================================
  migration-deletion-witness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the merge-base for git diff name-status.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --ignore-scripts --no-fund

      - name: Run migration-deletion-witness gate
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run gates:migration-deletion-witness

  # ===================================================================
  # entity-diff-witness — Faz 1.3 of day-one baseline reset.
  #
  # Catches the silent-regression class where an `@Entity()` file is
  # edited (column add/drop, type change, nullability flip, FK add,
  # @Check change) WITHOUT a matching migration landing in the same PR.
  # This is the upstream gate that prevents the 2026-04 drift archaeology
  # (14 services' Align*EntitySurface / Heal*Drift / Replay* chains).
  #
  # The PR-body waiver `ENTITY-DIFF-OK: <service> — <reason>` is honoured
  # for genuine no-DDL-impact edits (typing fix, JSDoc, etc.) but the
  # waiver carries CODEOWNERS review from database-reviewer.
  # ===================================================================
  entity-diff-witness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the merge-base for git diff name-status.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --ignore-scripts --no-fund

      - name: Run entity-diff-witness gate
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run gates:entity-diff-witness -- --diff-base "$BASE_SHA"

  # ===================================================================
  # migration-immutability-witness — shipped-migration in-place-edit guard.
  #
  # Catches the silent-drift class where an ALREADY-SHIPPED timestamped
  # migration file is edited in place instead of being superseded by a new
  # forward migration. TypeORM records the ledger by migration NAME, so an
  # edit to an already-applied migration never re-runs — the 2026-06 tenant-
  # provisioning incident (1800400000000 hand-edited to add lease columns +
  # an auth.tenants REVOKE that silently never landed; every POST /api/v1/
  # tenants then 500'd with `column "leaseToken" does not exist`).
  #
  # The PR-body waiver `MIGRATION-IMMUTABLE-OK: <filename> — <reason>` is
  # honoured for genuinely content-neutral edits (comment/lint-only) and
  # carries CODEOWNERS review from database-reviewer.
  # ===================================================================
  migration-immutability-witness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the merge-base for git diff name-status.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --ignore-scripts --no-fund

      - name: Run migration-immutability-witness gate
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run gates:migration-immutability-witness -- --diff-base "$BASE_SHA"

  # ===================================================================
  # schema-drift-registration — AST gate.
  #
  # Asserts every canonical service's app.module.ts registers
  # SchemaDriftModule.forRoot({ serviceName: '<svc>' }). Without
  # registration, the runtime drift validator never instantiates and
  # silently disarms ADR-012's third defense layer. Static gate runs
  # in seconds; no DB needed.
  # ===================================================================
  schema-drift-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --ignore-scripts --no-fund

      - name: Run schema-drift-registration gate
        run: npm run gates:schema-drift-registration

  # ===================================================================
  # signals-manifest — boot invariant signal contract gate.
  #
  # Asserts required-signals.yaml stays aligned with the canonical
  # BOOT_INVARIANT_SIGNALS constants, compose services, SchemaDriftModule
  # registrations, and EventBusModule registrations.
  # ===================================================================
  signals-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --ignore-scripts --no-fund

      - name: Run signals manifest gate
        run: npm run gates:signals-manifest

  # ===================================================================
  # criticality-manifest — service criticality ↔ compose service gate.
  #
  # Runs beside signals-manifest so deploy health policy and boot-signal
  # expectations drift together instead of independently.
  # ===================================================================
  criticality-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --ignore-scripts --no-fund

      - name: Run criticality manifest gate
        run: npm run gates:criticality-manifest
