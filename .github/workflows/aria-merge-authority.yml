name: aria-merge-authority

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aria-merge-authority-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  aria-merge-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-aria-kernel

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline

      # ORPHAN-HIGH-763 — the lane is the PR-head evidence producer for the
      # readiness-claim chain, so its shape is governed by a full
      # WorkflowJobContract (workflow_contract_registry.py). The preflight
      # binds this run to that contract before any check mutates anything.
      - name: Persist enterprise workflow preflight
        env:
          PYTHONPATH: aria-kernel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          from aria_kernel.preflight import verify_workflow_preflight

          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          verdict = verify_workflow_preflight(
              workflow_id="aria-merge-authority",
              job_id="aria-merge-authority",
              profile="standard",
              workspace_root=os.environ["GITHUB_WORKSPACE"],
              allowed_write_roots=[str(runner_temp)],
              path_allowlist=[str(runner_temp)],
              # The lane reads the repo and uploads its proof artifact; it
              # pushes no state and opens no PR.
              network_policy=["github_artifact"],
              network_enforcement_evidence=(
                  "assert-only lane: repository checkout plus artifact upload; "
                  "no git push, no PR mutation"
              ),
              token_provenance="github_actions_artifact_token",
              require_github_app=False,
              dlp_mode="fail_closed",
              dlp_scan_clean=True,
              audit_reason="assert ARIA merge authority on a PR head",
              audit_artifact_path=runner_temp / "aria-merge-authority-preflight.json",
              external_root_allowlist=[str(runner_temp)],
          )
          if not verdict.valid:
              raise SystemExit(";".join(verdict.reasons))
          PY

      - name: Assert ARIA merge authority
        run: |
          npm run aria:compile
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel:. python3 -m unittest \
            aria-kernel/tests/test_merge_authority_invariants.py \
            aria-kernel/tests/test_enterprise_readiness_and_genesis_lifecycle.py \
            aria-kernel/tests/test_auto_merge.py
          npm run gates:required-status-checks
          npm run aria:docs:ssot

      # The evidence artifact the readiness claim cites by id + digest:
      # produced_by_workflow_run_id on the claim names THIS run.
      - name: Upload merge-authority preflight proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-merge-authority-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aria-merge-authority-preflight.json
          if-no-files-found: error
          retention-days: 7
