# Data-Flow Integrity Watchdog — hourly T1 probes (W-B slice 1).
#
# Shape follows scheduled-workflow-watchdog.yml (hourly cron, incident-on-
# failure). Runs on the droplet runner because the probes need docker truth
# and the local repo; every probe is read-only and credential-free by design
# (plan §F5 — write probes are staging-only until the canary-account
# decision). On a CRITICAL: dispatch an ARIA cycle that ingests the standing
# runtime signal `dataflow_integrity_critical` (stable text, kernel-owned) into
# its own store, so investigation starts NOW, not at the next nightly.
name: dataflow-integrity-watchdog
on:
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
# Z1 (ORPHAN-712) → ARIA-MEDIUM-277 — the self-hosted lanes share ONE
# workspace on a single-slot runner today; that serialization is now a
# REPO-enforced property of the host workspace lock
# (.github/actions/selfhosted-workspace-lock, taken by the lanes that check
# out the workspace root), not of a shared concurrency group, so adding a
# second runner service can never reopen the mid-run wipe window.
# WHY its own group (ORPHAN-713): a GitHub concurrency group holds ONE
# pending slot and a newly arriving run EVICTS the queued one — inside the
# shared workspace group this hourly probe cancelled the queued nightly
# executor three times on 2026-08-18. Path isolation (watchdog-checkout/)
# already removed its store-wipe vector, so the single-slot runner is the
# only serializer this read-only probe needs, and in its own group the only
# run its pending slot can evict is its own duplicate.
concurrency:
  group: dataflow-integrity-watchdog
  cancel-in-progress: false
jobs:
  # B8 (2026-09-12) — this hourly probe runs on the self-hosted runner: with
  # the runner offline each run queues in this group until the next hour's
  # run evicts it — cancelled, never red, every hour. This hosted job refuses
  # the run by name unless an ONLINE runner carries the labels the probe
  # runs on; the probe `needs` it. One definition for every self-hosted
  # lane: .github/actions/require-self-hosted-runner.
  runner-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/require-self-hosted-runner
        with:
          # Verbatim the self-hosted job's runs-on; the invariant test
          # compares the two so they cannot drift apart.
          required-labels: self-hosted,linux,claude
          app-id: ${{ secrets.ARIA_GH_APP_ID }}
          app-installation-id: ${{ secrets.ARIA_GH_APP_INSTALLATION_ID }}
          app-private-key: ${{ secrets.ARIA_GH_APP_PRIVATE_KEY }}

  probe:
    needs: runner-preflight
    runs-on: [self-hosted, linux, claude]
    timeout-minutes: 10
    steps:
      # Z1 (ORPHAN-712) — checkout into a SUBDIRECTORY. actions/checkout's
      # default clean (`git clean -ffdx`) previously ran at the workspace
      # root and swept the untracked, gitignored `.aria-state-store` — the
      # hourly job was deleting ARIA's memory between (and, with a second
      # runner, during) state-writing runs. Scoped to its own directory,
      # this job can never touch the store again.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: watchdog-checkout
      - name: Fetch aria/state for the freshness probe
        working-directory: watchdog-checkout
        run: git fetch origin '+refs/heads/aria/state:refs/remotes/origin/aria-state' || true
      - name: Run T1 probes
        id: probes
        working-directory: watchdog-checkout
        run: |
          # NO PIPE around the probe. `node ... | tee` made `$?` report tee's
          # status, so the exit 3 that means CRITICAL was swallowed and the
          # ARIA-signal step below could never fire - the detection existed and
          # the delivery did not. Redirect to the file, then echo it.
          set +e
          node tools/watchdog/probe-runner.mjs \
            --repo "$PWD" \
            --textfile "$RUNNER_TEMP/aqua_probes.prom" \
            > probe-evidence.json
          status=$?
          set -e
          cat probe-evidence.json
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      # ARIA-MEDIUM-277 — the gap half of the lane's rule: run at the
      # declared cadence OR report the gap. This probe may queue for hours
      # behind a multi-hour cycle on the single self-hosted runner
      # (measured: 3-7 runs/day, one wait of 11,853 s), and a run that
      # finally executes owes the on-call an account of every hourly slot
      # it skipped — not just a fresh green. The probes are credential-free
      # by design, so the run list (the one call that needs the API) is
      # fetched HERE and handed to the tool as a file; the tool appends
      # `probe_missed_slots` to the textfile the probes own and writes the
      # missed-slots.json uploaded with the evidence below. A gap is a
      # report, never a probe failure: exit 0 stands.
      - name: Report the hourly slots missed since the previous run
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: watchdog-checkout
        run: |
          set -euo pipefail
          gh run list --workflow dataflow-integrity-watchdog.yml --limit 10 \
            --json databaseId,createdAt,status,conclusion \
            > "$RUNNER_TEMP/missed-slots-runs.json"
          node tools/watchdog/missed_slots.mjs \
            --runs "$RUNNER_TEMP/missed-slots-runs.json" \
            --textfile "$RUNNER_TEMP/aqua_probes.prom" \
            --evidence missed-slots.json \
            --cron '40 * * * *' \
            --current-run-id "$GITHUB_RUN_ID"

      # The textfile is the only way these probe_* series reach Prometheus.
      # Publishing it as an artefact keeps the evidence auditable even on a
      # runner whose node_exporter textfile directory is not writable.
      - name: Upload probe metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dataflow-probe-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aqua_probes.prom
          if-no-files-found: error
          retention-days: 14
      - name: Upload evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dataflow-probe-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            watchdog-checkout/probe-evidence.json
            watchdog-checkout/missed-slots.json
          retention-days: 14
      # ARIA-MEDIUM-271 — this job used to ingest the signal into its own
      # checkout's aria-tools, thrown away with the job, and then dispatch a
      # cycle that could not see it. The signal now travels as the dispatch's
      # input: the cycle ingests it into the store it restores and publishes.
      - name: On CRITICAL — dispatch a cycle carrying the runtime signal
        if: steps.probes.outputs.exit_code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: watchdog-checkout
        run: |
          set -euo pipefail
          gh workflow run aria-auto-cycle.yml -f runtime_signal=dataflow_integrity_critical || true
      - name: Fail the run on CRITICAL
        if: steps.probes.outputs.exit_code == '3'
        run: |
          echo "::error::dataflow watchdog found a CRITICAL condition; see probe-evidence artifact"
          exit 1
