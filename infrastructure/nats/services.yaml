      - 'events.*.LoRaDeviceEvent'
      - 'events.*.ParentReadingRouted'
      - 'events.*.SensorDeleted'
      - 'events.*.SensorDeprovisioned'
      - 'events.*.SensorReading'
      - 'events.*.SensorRegistered'
      - 'events.*.SensorRegistrationCompleted'
      - 'events.*.SensorRegistrationStarted'
      - 'events.*.SensorServiceTenantDataErased'
      - 'events.*.SensorServiceTenantDataErasureFailed'
      - 'events.*.SensorServiceTenantErasureBlocked'
      # SENSOR-MEDIUM-070: channel-detection delegates to ai-service over NATS
      # (request-reply) under the sensor-service service principal — replaces the
      # forged x-user-payload HTTP call. sensor-service is the CALLER (publish).
      - 'request.ai.sensor.detectChannels'
      - 'st.language.>'
      - 'events.platform.schema-migration.>'
      - 'events.security.events.>'
      - '$JS.API.>'
      - '_INBOX.>'
    subscribe:
      - 'request.sensor.>'
      - 'sensor.lookup.by-topic'
      - 'st.language.>'
      - '$JS.API.>'
      - '_INBOX.>'

  # ---------------------------------------------------------------------------
  # sensor-ingestion: Rust sidecar (ADR-025 / ADR-027) — co-equal producer of
  # SensorReading events alongside sensor-service during the strangler-fig
  # rollout. Distinct CN so the broker can attribute every published event
  # to its actual producer (audit + per-tenant rollback granularity).
  # ---------------------------------------------------------------------------
  - name: sensor-ingestion
    application: sensor-ingestion
    description: Rust ingestion sidecar — MQTT subscribe → COPY → SensorReading event publish
    publish:
      - 'events.*.SensorReading'
      - 'sensor.lookup.by-topic'
      - '$JS.API.>'
      - '_INBOX.>'
    subscribe:
      - 'policy.ingest_backend.>'
      - '_INBOX.>'
      - '$JS.API.>'

