name: Rust CI

on:
  push:
    branches: [main, agentic]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - ".cargo/config.toml"
      - "crates/**"
      - "apps/sensor-ingestion/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    branches: [main, agentic]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - ".cargo/config.toml"
      - "crates/**"
      - "apps/sensor-ingestion/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch: {}

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: 1.88.0
          components: clippy
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/agentic' }}
      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: 1.88.0
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/agentic' }}
      - name: cargo test --workspace --all-features --no-fail-fast
        run: cargo test --workspace --all-features --no-fail-fast

  deny:
    name: cargo-deny check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: cargo-deny check (advisories, bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@91bf2b620e09e18d6eb78b92e7861937469acedb # v2.0.17
        with:
          command: check advisories bans licenses sources
          rust-version: "1.88.0"

  audit:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # rustsec/audit-check installs cargo-audit from source, which currently
      # requires rustc >= 1.89 (smol_str 0.3.6 transitive). taiki-e/install-action
      # ships precompiled binaries — no MSRV treadmill, no source build, ~5s.
      - name: Install cargo-audit (precompiled)
        uses: taiki-e/install-action@055f5df8c3f65ea01cd41e9dc855becd88953486 # v2.75.18
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit --deny warnings

  cross-build:
    name: cross-build (musl)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # aarch64-unknown-linux-musl is intentionally OUT of the matrix until
    # Faz 2: sensor-ingestion targets cloud x86_64 Docker images, and the
    # edge agent (sens-api-gateway) keeps its own ARM64 cross-compile
    # pipeline. Faz 2 will reintroduce aarch64 via the `cross` tool
    # (cross-rs/cross), which handles the musl-cross toolchain inside a
    # container — no fragile messense GitHub-release download.
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain (with target)
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - name: Install musl gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-cross-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/agentic' }}
      - name: cargo build --workspace --release --target ${{ matrix.target }}
        run: cargo build --workspace --release --target ${{ matrix.target }}

  summary:
    name: Rust CI summary
    if: always()
    needs: [fmt, clippy, test, deny, audit, cross-build]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ needs.fmt.result }}" != "success" ] \
             || [ "${{ needs.clippy.result }}" != "success" ] \
             || [ "${{ needs.test.result }}" != "success" ] \
             || [ "${{ needs.deny.result }}" != "success" ] \
             || [ "${{ needs.audit.result }}" != "success" ] \
             || [ "${{ needs.cross-build.result }}" != "success" ]; then
            echo "One or more required Rust CI jobs failed."
            exit 1
          fi
          echo "All Rust CI jobs succeeded."
