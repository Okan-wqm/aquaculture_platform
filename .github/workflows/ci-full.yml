name: CI - Full

# SEC-CI-002: All third-party actions pinned to full commit SHAs
# SEC-CI-009: Snyk action pinned to SHA (was @master), continue-on-error removed
# SEC-CI-020: Removed continue-on-error from security audit and license check
# ARCH-CI-006: Removed github.sha from NX cache key
# ARCH-CI-014: Added NX cache to build job (was missing)

on:
  schedule:
    # Run weekly instead of daily (saves runner minutes)
    - cron: '0 2 * * 0' # Sunday at 2 AM
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'release-*'

# SEC-CI-021: Minimum token permissions — prevents compromised actions from
# pushing commits, creating releases, or modifying repository settings.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

# PR updates supersede an older run for the same PR. Every non-PR run uses
# its immutable SHA as the group, so protected-main evidence is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    # 25, not 15 (ORPHAN-HIGH-501). This job makes four heavy serial passes —
    # lint all projects, tsc all, a SECOND full tsc pass in type-check-spec, then
    # the format check — and the merge of main added a workspace, which grew the
    # linter from 6m36s to 8m57s. Measured need is ~17.5m; at 15m the job was
    # cancelled mid-`type-check-spec` and step 10 reported `skipped`, so BOTH
    # tail gates stopped running while the job still looked configured. It failed
    # closed (build-status treats cancelled as not-success) but printed
    # "Lint/Typecheck failed", which sends the reader hunting a lint error that
    # does not exist. Consistent with this file's own budgets: test 45/35
    # (CI-TIMEOUT-BUDGET), build 30, deploy-ssot-gates 20.
    timeout-minutes: 25
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ARCH-CI-014: Added NX cache (was missing from lint-and-typecheck job)
      # ARCH-CI-006: No github.sha in key
      - name: Cache Nx
        # SEC-CI-002: pinned to SHA
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          # Unified cache namespace with ci-affected.yml — the weekly
          # `ci-full` `nx run-many --all` populates the same cache key
          # PR runs read from, so the warm cache from the priming run
          # actually accelerates subsequent affected-only PR runs
          # (previously `nx-full-` was an isolated namespace with zero
          # consumers).
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --prefer-offline

      # Nx runs every Rust-backed lint target in parallel. Install the pinned
      # toolchain once so cargo processes never race while mutating ~/.rustup.
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: ./.github/actions/setup-rust-workspace

      - name: Run linter (all projects)
        run: npm run lint:all -- --max-warnings=0

      - name: Run type check
        run: npm run type-check

      - name: Run type-check-spec gate (baseline-aware)
        # TYPE-CHECK-SPEC-RATCHET-001: blocks any PR that regresses spec
        # error counts above the per-project baseline at
        # tools/gates/type-check-spec-baseline.json. See PR #165 history.
        run: npm run gates:type-check-spec
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      # Main carries historical formatting debt. Ratchet the exact PR/push
      # delta so new drift fails closed without rewriting unrelated files.
      - name: Check formatting of changed files
        run: node tools/quality/quality.mjs format check-changed
        env:
          FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

  test:
    runs-on: ubuntu-latest
    # 45 job / 35 step, not a bare 30 (CI-TIMEOUT-BUDGET). A timeout is a hang
    # detector, not a performance budget: it must fire on a process that stopped
    # making progress and never on a slow runner. Measured over 14 completed runs
    # of this job — job wall clock median 23m29s, max 29m03s; the `Run all tests`
    # step itself max 25m54s; everything outside that step (service-container
    # pull, checkout, npm ci, Rust toolchain, coverage verify + upload) max 4m18s.
    # p90 sat at 86% of the old 30m budget and one run was killed at 30m23s, so
    # the detector had started sampling runner load instead of hangs.
    #
    # The failure mode is worse than the delay. A job killed by its own budget
    # reports `cancelled`, and build-status rendered that as "Tests failed" — a
    # DURATION problem reached the reader as a TEST problem and sent them hunting
    # a red test that does not exist. It failed closed, so nothing merged on it;
    # it failed MISLABELLED, which costs a round trip. (build-status no longer
    # names a cause it cannot know; see that job.)
    #
    # Two levels with distinct jobs. The step budget (35) bounds the only thing
    # that can hang here — 32 projects of Jest/Vitest/cargo against the postgres
    # and redis service containers. The job budget (45) is the outer backstop for
    # what the step budget cannot see. The gap is load-bearing and deliberately
    # generous: worst observed prologue 4m18s + the full 35m step = 39m18s, still
    # 5m42s under the job budget, so the STEP budget always fires first and the
    # failure names itself instead of arriving as an anonymous cancellation.
    #
    # Each number clears its OWN measured maximum by the smallest satisfying
    # margin: 35 >= 25m54s x 1.35, 45 >= 29m03s x 1.5 rounded to the next
    # 5-minute mark. Deriving the step budget from the job's maximum (which an
    # earlier draft did) inflates it to 40 and collapses the gap to 42 seconds —
    # the step budget becomes decorative and the cancellation misreport returns.
    # The distribution, both budgets and the relations between them are asserted
    # in tests/invariants/ci-timeout-budget-ssot.spec.ts. Re-measure THERE when
    # the suite grows: raising a budget without fresh evidence is the defect that
    # spec exists to stop.
    timeout-minutes: 45
    # The coverage control plane is repository-owned and needs no external
    # identity. Keep the job at the minimum permission needed by checkout.
    permissions:
      contents: read
    services:
      postgres:
        # INFRA-CRITICAL-010: HA edition includes pgvector (HNSW + vector_cosine_ops)
        # Single source of truth: same image used in CI + dev + droplet + prod compose files
        image: timescale/timescaledb-ha:pg16@sha256:b3d038d0a0757df8a5ec0a94ba68d9ad57b0e16100a024cf4b370c77ad5645f7
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aquaculture_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ARCH-CI-014 successor: the test job was the one job in ci-full
      # that never participated in the Nx cache (lint-and-typecheck +
      # build + generate-sri-hashes were all wired up). The omission
      # halved the priming run's coverage — a successful weekly
      # ci-full populated lint/typecheck/build hashes only, leaving
      # PR test runs uncached. Same shape as the other three caches,
      # same unified `nx-ci-` namespace.
      - name: Cache Nx
        # SEC-CI-002: pinned to SHA
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --prefer-offline

      # Nx runs every Rust-backed test target in parallel. Install the pinned
      # toolchain once so cargo processes never race while mutating ~/.rustup.
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: ./.github/actions/setup-rust-workspace

      - name: Run all tests
        run: npm run test:all -- --coverage
        # Hang detector for the fan-out itself; rationale in the job header.
        # Strictly below the job budget by more than the worst observed prologue,
        # so an overrun fails AS THIS STEP rather than as a cancelled job.
        timeout-minutes: 35
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aquaculture_test
          REDIS_URL: redis://localhost:6379

      - name: Verify coverage evidence
        run: node tools/quality/coverage-evidence.js

      - name: Upload coverage evidence
        # SEC-CI-002: pinned to SHA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage/coverage-evidence.json
            coverage/**/lcov.info
            libs/aquaculture-engines/coverage/lcov.info
            mcp/**/coverage/lcov.info
            web/**/coverage/lcov.info
          if-no-files-found: error
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ARCH-CI-014: Added NX cache to build job (was missing)
      # ARCH-CI-006: No github.sha in key
      - name: Cache Nx
        # SEC-CI-002: pinned to SHA
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          # Unified cache namespace with ci-affected.yml — the weekly
          # `ci-full` `nx run-many --all` populates the same cache key
          # PR runs read from, so the warm cache from the priming run
          # actually accelerates subsequent affected-only PR runs
          # (previously `nx-full-` was an isolated namespace with zero
          # consumers).
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --prefer-offline

      # Nx runs every Rust-backed build target in parallel. Install the pinned
      # toolchain once so cargo processes never race while mutating ~/.rustup.
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: ./.github/actions/setup-rust-workspace

      - name: Build all projects
        run: npm run build:all
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

  generate-sri-hashes:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ARCH-CI-006: No github.sha in key
      - name: Cache Nx
        # SEC-CI-002: pinned to SHA
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          # Unified cache namespace with ci-affected.yml — the weekly
          # `ci-full` `nx run-many --all` populates the same cache key
          # PR runs read from, so the warm cache from the priming run
          # actually accelerates subsequent affected-only PR runs
          # (previously `nx-full-` was an isolated namespace with zero
          # consumers).
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --prefer-offline

      - name: Build frontend modules
        run: node tools/toolchain/run.mjs npx nx run-many --target=build --projects=dashboard,farm-module,hr-module,sensor-module,hydroponics-module,admin-panel,tenant-admin --parallel=4
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

      - name: Generate SRI hash map
        run: bash scripts/generate-sri-hashes.sh --base-dir "$PWD"

      - name: Assert SRI hash map completeness
        run: |
          node -e "
          const fs = require('node:fs');
          const path = 'web/shell/src/generated/remoteHashes.json';
          const expected = [
            '/remotes/admin-panel/remoteEntry.js',
            '/remotes/dashboard/remoteEntry.js',
            '/remotes/farm-module/remoteEntry.js',
            '/remotes/hr-module/remoteEntry.js',
            '/remotes/hydroponics-module/remoteEntry.js',
            '/remotes/sensor-module/remoteEntry.js',
            '/remotes/tenant-admin/remoteEntry.js',
          ];
          const map = JSON.parse(fs.readFileSync(path, 'utf8'));
          const keys = Object.keys(map).sort();
          const missing = expected.filter((key) => !Object.prototype.hasOwnProperty.call(map, key));
          const extra = keys.filter((key) => !expected.includes(key));
          const invalid = expected.filter((key) => !/^sha384-[A-Za-z0-9+/=]+$/.test(map[key] ?? ''));
          if (missing.length || extra.length || invalid.length) {
            console.error(JSON.stringify({ missing, extra, invalid }, null, 2));
            process.exit(1);
          }
          console.log('SRI hash map complete for ' + expected.length + ' remotes.');
          "

      - name: Build shell with generated SRI hash map
        run: node tools/toolchain/run.mjs npx nx build shell
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

      - name: Upload hash map artifact
        # SEC-CI-002: pinned to SHA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-hash-pins-${{ github.run_number }}
          path: web/shell/src/generated/remoteHashes.json
          retention-days: 14

  deploy-ssot-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --prefer-offline --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Service catalog artifacts are fresh
        run: npm run service-catalog:check

      - name: GraphQL registry artifacts are fresh
        run: npm run graphql:generate-registry-artifacts -- --check

      - name: Run fast invariants
        # entity-diff-implies-migration.spec.ts (inside invariants:fast) honours
        # `ENTITY-DIFF-OK:` PR-body waivers via PR_BODY. Mirrors ci-affected.yml,
        # quality-gates.yml, and db-migration-check.yml. Empty on push (the spec
        # skips the gate when no PR base resolves), so it is a no-op off-PR.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: npm run invariants:fast

      - name: Run schema drift registration gate
        run: npm run gates:schema-drift-registration

      - name: Validate deploy manifests
        run: |
          npm run gates:criticality-manifest
          npm run gates:signals-manifest
          npm run validate:required-secrets
          bash scripts/ci/validate-deploy-ssot.sh

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --prefer-offline

      - name: Validate standalone npm locks
        run: |
          npm --prefix web/apps/aquamobil ci --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix e2e ci --package-lock-only --ignore-scripts --no-audit --no-fund

      # Audit both deployed dependency graphs plus standalone E2E at moderate,
      # then every complete graph at high. Capture every result before failing
      # so all source maps remain available from one run.
      - name: Run security audit
        run: |
          set +e
          npm audit --audit-level=moderate --omit=dev --json > npm-audit-root-production.json
          ROOT_PRODUCTION_AUDIT_STATUS=$?
          node scripts/ci/audit-source-map.mjs npm-audit-root-production.json npm-audit-root-production.md
          ROOT_PRODUCTION_MAP_STATUS=$?
          npm audit --audit-level=high --json > npm-audit-root-full.json
          ROOT_FULL_AUDIT_STATUS=$?
          node scripts/ci/audit-source-map.mjs npm-audit-root-full.json npm-audit-root-full.md
          ROOT_FULL_MAP_STATUS=$?
          npm --prefix web/apps/aquamobil audit --audit-level=moderate --omit=dev --json > npm-audit-aquamobil-production.json
          AQUAMOBIL_PRODUCTION_AUDIT_STATUS=$?
          node scripts/ci/audit-source-map.mjs npm-audit-aquamobil-production.json npm-audit-aquamobil-production.md
          AQUAMOBIL_PRODUCTION_MAP_STATUS=$?
          npm --prefix web/apps/aquamobil audit --audit-level=high --json > npm-audit-aquamobil-full.json
          AQUAMOBIL_FULL_AUDIT_STATUS=$?
          node scripts/ci/audit-source-map.mjs npm-audit-aquamobil-full.json npm-audit-aquamobil-full.md
          AQUAMOBIL_FULL_MAP_STATUS=$?
          npm --prefix e2e audit --audit-level=moderate --omit=dev --json > npm-audit-e2e-production.json
          E2E_PRODUCTION_AUDIT_STATUS=$?
          node scripts/ci/audit-source-map.mjs npm-audit-e2e-production.json npm-audit-e2e-production.md
          E2E_PRODUCTION_MAP_STATUS=$?
          npm --prefix e2e audit --audit-level=high --json > npm-audit-e2e-full.json
          E2E_FULL_AUDIT_STATUS=$?
          node scripts/ci/audit-source-map.mjs npm-audit-e2e-full.json npm-audit-e2e-full.md
          E2E_FULL_MAP_STATUS=$?
          set -e
          if [ "$ROOT_PRODUCTION_AUDIT_STATUS" -ne 0 ]; then
            exit "$ROOT_PRODUCTION_AUDIT_STATUS"
          fi
          if [ "$ROOT_PRODUCTION_MAP_STATUS" -ne 0 ]; then
            exit "$ROOT_PRODUCTION_MAP_STATUS"
          fi
          if [ "$ROOT_FULL_AUDIT_STATUS" -ne 0 ]; then
            exit "$ROOT_FULL_AUDIT_STATUS"
          fi
          if [ "$ROOT_FULL_MAP_STATUS" -ne 0 ]; then
            exit "$ROOT_FULL_MAP_STATUS"
          fi
          if [ "$AQUAMOBIL_PRODUCTION_AUDIT_STATUS" -ne 0 ]; then
            exit "$AQUAMOBIL_PRODUCTION_AUDIT_STATUS"
          fi
          if [ "$AQUAMOBIL_PRODUCTION_MAP_STATUS" -ne 0 ]; then
            exit "$AQUAMOBIL_PRODUCTION_MAP_STATUS"
          fi
          if [ "$AQUAMOBIL_FULL_AUDIT_STATUS" -ne 0 ]; then
            exit "$AQUAMOBIL_FULL_AUDIT_STATUS"
          fi
          if [ "$AQUAMOBIL_FULL_MAP_STATUS" -ne 0 ]; then
            exit "$AQUAMOBIL_FULL_MAP_STATUS"
          fi
          if [ "$E2E_PRODUCTION_AUDIT_STATUS" -ne 0 ]; then
            exit "$E2E_PRODUCTION_AUDIT_STATUS"
          fi
          if [ "$E2E_PRODUCTION_MAP_STATUS" -ne 0 ]; then
            exit "$E2E_PRODUCTION_MAP_STATUS"
          fi
          if [ "$E2E_FULL_AUDIT_STATUS" -ne 0 ]; then
            exit "$E2E_FULL_AUDIT_STATUS"
          fi
          if [ "$E2E_FULL_MAP_STATUS" -ne 0 ]; then
            exit "$E2E_FULL_MAP_STATUS"
          fi
      - name: Upload npm audit source map
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-source-map-full-${{ github.run_number }}
          path: |
            npm-audit-root-production.json
            npm-audit-root-production.md
            npm-audit-root-full.json
            npm-audit-root-full.md
            npm-audit-aquamobil-production.json
            npm-audit-aquamobil-production.md
            npm-audit-aquamobil-full.json
            npm-audit-aquamobil-full.md
            npm-audit-e2e-production.json
            npm-audit-e2e-production.md
            npm-audit-e2e-full.json
            npm-audit-e2e-full.md
          if-no-files-found: error
          retention-days: 14

  license-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --prefer-offline

      - name: Check production license contract
        run: npm run gates:production-licenses

  full-ci-status:
    name: full-ci-status
    needs:
      - lint-and-typecheck
      - test
      - build
      - generate-sri-hashes
      - deploy-ssot-gates
      - security-scan
      - license-check
    runs-on: ubuntu-latest
    # This job runs one loop over seven strings. It had no budget at all, so it
    # inherited GitHub's 360-minute default — and because build-status is a
    # REQUIRED context, a wedged aggregate would hold every PR behind it for six
    # hours. Same class as the test budget above, one severity worse.
    timeout-minutes: 5
    if: always()
    steps:
      # Reports the result it has instead of naming a cause it cannot know. The
      # old chain translated every non-success into a verdict about that job's
      # subject — `cancelled` became "Tests failed", which sent readers hunting a
      # red test that did not exist. It cannot know: `cancelled` is EITHER a
      # budget overrun OR a run superseded by `concurrency.cancel-in-progress`
      # (see the concurrency block at the top of this file), and `failure` now
      # includes a step that blew its own timeout-minutes.
      #
      # The loop also fixes a second defect: the chain exited at the first
      # non-success, so a lint failure hid a simultaneous test failure and the
      # next push discovered it one round trip later. This reports all of them.
      - name: Check build status
        run: |
          set -euo pipefail
          failed=0
          for entry in \
            "lint-and-typecheck:${{ needs.lint-and-typecheck.result }}" \
            "test:${{ needs.test.result }}" \
            "build:${{ needs.build.result }}" \
            "generate-sri-hashes:${{ needs.generate-sri-hashes.result }}" \
            "deploy-ssot-gates:${{ needs.deploy-ssot-gates.result }}" \
            "security-scan:${{ needs.security-scan.result }}" \
            "license-check:${{ needs.license-check.result }}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            if [ "${result}" != "success" ]; then
              echo "::error::${name} result=${result}"
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo 'A required job did not succeed. This reports the result, not a cause:'
            echo '  cancelled = the job hit its own budget, OR the run was superseded — not a verdict on its subject'
            echo '  failure   = the job failed, which includes a step that exceeded its own timeout-minutes'
            echo 'Open the named job and read its log.'
            exit 1
          fi
          echo "All critical checks passed"
