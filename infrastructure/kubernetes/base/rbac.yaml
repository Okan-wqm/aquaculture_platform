# =============================================================================
# Aquaculture Platform - RBAC Configuration
# SEC-003: Per-service service accounts with resourceNames restrictions
# SEC-016: ResourceQuota and LimitRange are in namespace.yaml
# =============================================================================

# ---------------------------------------------------------------------------
# Service Accounts — one per service (SEC-003)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-api-sa
  namespace: aquaculture
  annotations:
    # imagePullSecrets for GHCR (SEC-017)
    # Note: imagePullSecrets set at SA level apply to all pods using this SA
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service-sa
  namespace: aquaculture
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: farm-service-sa
  namespace: aquaculture
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sensor-service-sa
  namespace: aquaculture
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-engine-sa
  namespace: aquaculture
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service-sa
  namespace: aquaculture
automountServiceAccountToken: false

# ---------------------------------------------------------------------------
# Roles — per-service with resourceNames restriction (SEC-003)
# Only 'get' verb on secrets — no 'list' or 'watch' (prevents bulk secret read)
# ---------------------------------------------------------------------------

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-api-role
  namespace: aquaculture
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["aquaculture-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["aquaculture-secrets"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-service-role
  namespace: aquaculture
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["aquaculture-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["aquaculture-secrets"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: farm-service-role
  namespace: aquaculture
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["aquaculture-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["aquaculture-secrets"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sensor-service-role
  namespace: aquaculture
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["aquaculture-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["aquaculture-secrets"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alert-engine-role
  namespace: aquaculture
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["aquaculture-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["aquaculture-secrets"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: notification-service-role
  namespace: aquaculture
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["aquaculture-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["aquaculture-secrets", "smtp-credentials"]
    verbs: ["get"]

