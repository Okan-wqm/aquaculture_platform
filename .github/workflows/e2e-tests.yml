name: E2E Tests

on:
  workflow_run:
    workflows: ["CD - Production", "CD - Staging", "Deploy to DigitalOcean"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      project:
        description: 'Test project to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - security
          - workflow
          - integration
          - modules

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Tests on Server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Run E2E tests on DigitalOcean server via SSH
        uses: appleboy/ssh-action@v1
        env:
          PROJECT: ${{ github.event.inputs.project || 'all' }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          timeout: 600s
          envs: PROJECT
          script: |
            set -e
            cd /var/aqua-saas

            echo "=== Installing E2E dependencies ==="
            cd e2e
            npm ci --prefer-offline --ignore-scripts 2>/dev/null || npm install --ignore-scripts
            npx playwright install --with-deps chromium 2>/dev/null || true

            echo "=== Setting environment ==="
            export GATEWAY_URL=http://localhost:3000
            export DATABASE_URL=postgresql://aquaculture:$DB_PASSWORD@localhost:5432/aquaculture
            export JWT_SECRET=$(grep JWT_SECRET /var/aqua-saas/.env | cut -d= -f2)
            export DB_PASSWORD=$(grep DB_PASSWORD /var/aqua-saas/.env | cut -d= -f2)
            export NODE_ENV=test
            export CI=true

            echo "=== Checking gateway health ==="
            curl -sf http://localhost:3000/health || echo "Gateway health check failed, continuing..."

            echo "=== Running E2E tests ==="
            if [ "$PROJECT" = "all" ]; then
              npx playwright test --reporter=list 2>&1 || true
            else
              npx playwright test --project="$PROJECT" --reporter=list 2>&1 || true
            fi

            echo "=== Test run complete ==="

      - name: Copy test results from server
        if: always()
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "/var/aqua-saas/e2e/playwright-report/*,/var/aqua-saas/e2e/test-results/*"
          target: "."
          strip_components: 3
        continue-on-error: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report-${{ github.run_number }}
          path: e2e/playwright-report/
          retention-days: 14
        continue-on-error: true
