name: CI - Affected

# ARCH-CI-005: Replaced global npm run scripts with nx affected commands
# SEC-CI-002: All third-party actions pinned to full commit SHAs
# ARCH-CI-006: Removed github.sha from NX cache key
# ARCH-CI-007: Split lint/type-check/test into parallel jobs so build always runs
# ARCH-CI-008: Increased timeouts (cold cache), reduced parallel (memory), save Nx cache after build
# ARCH-CI-009: Skip lint/type-check/test on push to main (non-blocking, speeds deploy)

on:
  push:
    branches: [main, develop, 'feature/*', 'hotfix/*']
  pull_request:
    branches: [main, develop]

# SEC-CI-021: Minimum token permissions — prevents compromised actions from
# pushing commits, creating releases, or modifying repository settings.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      is_pr: ${{ github.event_name == 'pull_request' }}
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      # SEC-CI-002/SEC-CI-019: Migrated from unmaintained @v2 to @v3, pinned to SHA
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: changes
        with:
          filters: |
            apps:
              - 'apps/**'
            libs:
              - 'libs/**'
              - 'platform/libs/**'
            web:
              - 'web/**'
            # Deploy-pipeline infrastructure. Changes here affect how the
            # deploy runs even when no application source changed — e.g.
            # a droplet-up.sh tweak, a new criticality-manifest entry, a
            # change to the compose topology. Without including these,
            # deploy-workflow fixes cannot TEST THEMSELVES (recursive
            # chicken-egg: the fix lands but nothing triggers the chain
            # that would exercise it).
            deploy-config:
              - 'scripts/deploy/**'
              - '.github/workflows/deploy-digitalocean.yml'
              - '.github/workflows/deploy-staging.yml'
              - '.github/workflows/ci-affected.yml'
              - '.github/actions/**'
              - 'infrastructure/deploy/**'
              - 'docker-compose.droplet.yml'
              - 'docker-compose.prod.yml'
              # CI install-chain tooling — the Nx graph probe + ESLint
              # plugin loader resolve against these paths on every run.
              # A broken `tools/eslint-rules/` tsconfig or a miswired
              # `tools/gates/` script crashes the install job itself, so
              # changes here MUST trigger the full chain or the fix
              # cannot validate itself. Root cause: commit 5f3280c4
              # fixed the eslint-rules build but CI skipped validation
              # because the change only touched tools/, producing
              # has_changes=false. Architectural fix: treat CI-consumed
              # tooling as deploy-config for path-filter purposes.
              - 'tools/eslint-rules/**'
              - 'tools/gates/**'
              - 'tools/scripts/**'
              - '.eslintrc.json'
              - '.eslintrc.js'
              - 'tsconfig.base.json'
              # Root manifest + lockfile. Any change here rewires the
              # workspace graph OR the dependency tree — both invalidate
              # every downstream build. Missing these from the filter
              # was the a8320411 blind-spot: a workspaces-array change
              # (root cause of the @nx/eslint-plugin native-binding
              # red herring) landed and CI-Affected skipped the full
              # chain in 9s because has_changes=false.
              - 'package.json'
              - 'package-lock.json'
      - id: check
        run: |
          if [ "${{ steps.changes.outputs.apps }}" = "true" ] || \
             [ "${{ steps.changes.outputs.libs }}" = "true" ] || \
             [ "${{ steps.changes.outputs.web }}" = "true" ] || \
             [ "${{ steps.changes.outputs.deploy-config }}" = "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # Shared setup: install + cache (reusable via needs + cache restore)
  # ---------------------------------------------------------------------------
  install:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Nx
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit

      # Graph invariant (ARCH-CI-012): catch ProjectsWithNoNameError and
      # similar graph-drift failures in the install job (~30s) instead of
      # 8+ minutes downstream inside deploy/build-*-artifacts.
      - name: Install Linux platform binaries
        uses: ./.github/actions/install-platform-binaries
        # The composite action now also builds tools/eslint-rules → dist/
        # as part of its contract (see action.yml). Every consumer of
        # platform binaries — including the deploy-digitalocean build
        # jobs — gets a functional eslint-plugin-aquaculture before any
        # nx invocation.

      - name: Validate Nx project graph integrity
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
        run: |
          npx nx show projects --json > /tmp/nx-projects.json
          PROJECT_COUNT=$(node -p "require('/tmp/nx-projects.json').length")
          echo "Nx graph resolved ${PROJECT_COUNT} projects"
          # Anchor: 16 deployable services live under apps/. A resolved graph
          # with fewer projects signals a project.json was corrupted, a
          # package.json lost its `name` field, or a plugin stopped firing.
          if [ "${PROJECT_COUNT}" -lt 16 ]; then
            echo "::error::Nx graph resolved only ${PROJECT_COUNT} projects; expected >= 16 apps"
            exit 1
          fi

      # Schema-registry codegen drift check (MA4). Regenerates
      # 00-init-schemas.sh from SCHEMA_REGISTRY; fails the PR if the
      # committed init-schemas.sh differs from what codegen would produce.
      # Catches "PR author edited SCHEMA_REGISTRY without running the
      # generator" — the class of drift that sneaked `notification`,
      # `observability`, `event_store` past init-schemas and blocked
      # the 2026-04-16 deploy.
      - name: Schema-registry codegen drift check
        run: |
          npm run codegen:schema-registry
          if ! git diff --exit-code infrastructure/docker/init-scripts/00-init-schemas.sh; then
            echo "::error::SCHEMA_REGISTRY ↔ 00-init-schemas.sh drift detected."
            echo "::error::Run \`npm run codegen:schema-registry\` locally and commit the diff."
            exit 1
          fi

      # Persist node_modules for downstream jobs
      - name: Cache node_modules
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

  # ---------------------------------------------------------------------------
  # Lint, type-check, test: PR only (non-blocking, skip on push to main)
  # ---------------------------------------------------------------------------
  lint:
    needs: [install, detect-changes]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # continue-on-error removed: lint failures must block PR merge.
    # BEFORE: lint errors showed green in GitHub — no signal to reviewers or authors.
    # WHY: A CI gate that never fails provides false confidence and is worse than no gate.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit

      - name: Restore Nx cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Run linter (affected only)
        run: npx nx affected -t lint --base=origin/${{ github.base_ref || 'main' }} --head=HEAD --parallel=2
        timeout-minutes: 35
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

  type-check:
    needs: [install, detect-changes]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # continue-on-error removed: TypeScript errors must block PR merge.
    # BEFORE: type errors merged silently — caught only at runtime or in production.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit

      - name: Restore Nx cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Run type check (affected only)
        run: npx nx affected -t type-check --base=origin/${{ github.base_ref || 'main' }} --head=HEAD --parallel=2
        timeout-minutes: 35
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

  test:
    needs: [install, detect-changes]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # continue-on-error removed: failing tests must block PR merge.
    # BEFORE: broken unit tests were invisible to reviewers — PRs merged with red tests.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit

      - name: Restore Nx cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Run tests (affected only)
        run: npx nx affected -t test --base=origin/${{ github.base_ref || 'main' }} --head=HEAD --parallel=2
        timeout-minutes: 35
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

  # ---------------------------------------------------------------------------
  # Build: PR only (deploy workflow does its own build for push to main).
  # On PR this validates the code compiles before merge.
  # ---------------------------------------------------------------------------
  build:
    needs: [install, detect-changes]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit

      - name: Restore Nx cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Ensure Nx cache directory exists
        run: mkdir -p .nx/cache

      - name: Build (affected only)
        run: npx nx affected -t build --base=origin/${{ github.base_ref || 'main' }} --head=HEAD --parallel=2
        timeout-minutes: 45
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

      # Persist Nx cache so subsequent CI runs are fast
      - name: Save Nx cache
        if: always()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}

  schema-validation:
    needs: [install, detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit
      - name: Validate pagination schema types
        run: node scripts/validate-pagination-schema.js

      # ADR-015: SSoT invariant — services.yaml must stay in lockstep with
      # the generated nats.conf block and the cert CN list. Running the
      # generator and asserting no diff catches the most common drift
      # pattern (operator edits services.yaml but forgets to regenerate).
      - name: NATS SSoT drift check (services.yaml ↔ nats.conf)
        run: |
          python3 scripts/nats/generate-nats-conf.py
          if ! git diff --quiet infrastructure/docker/nats/nats.conf; then
            echo "::error::nats.conf drifted from services.yaml SSoT."
            echo "Run \`python3 scripts/nats/generate-nats-conf.py\` locally and commit the diff."
            git diff infrastructure/docker/nats/nats.conf
            exit 1
          fi
          echo "OK: nats.conf matches services.yaml"

      # ADR-016 Phase A2/A4 — mirror deploy-time pre-flight into CI so
      # drift is caught at PR-merge, not at deploy. Runs the same
      # `docker compose config --quiet` the deploy workflow runs on the
      # droplet (deploy-digitalocean.yml line 807), using a CI-generated
      # dummy env derived from the compose file itself (no hand-
      # maintained env needed — compose IS the SSoT for required vars).
      # Tier-1 Make-Impossible: breaking compose at PR-time fails CI
      # before the deploy pipeline runs.
      #
      # Helm chart rendering is covered by the dedicated
      # `.github/workflows/infra-helm-lint.yml` workflow (helm lint +
      # kubeconform on every values overlay). Duplicating it here would
      # only add redundant CI cost.
      - name: Compose interpolation pre-flight (droplet + prod)
        run: |
          node scripts/ci/preflight-validate.ts \
            docker-compose.droplet.yml \
            docker-compose.prod.yml

      # WS6 — service-criticality manifest ↔ compose services SSoT check.
      # Asserts every service declared in compose has a criticality
      # entry and vice versa. Drift is caught at PR merge, not deploy.
      - name: Service criticality manifest coverage (WS6)
        run: node scripts/ci/validate-criticality-manifest.ts

      # WS7 — required-signals manifest ↔ compose + signal_library
      # internal consistency. Undefined signal references, drift from
      # compose, or malformed window values fail the PR build.
      - name: Required boot signals manifest (WS7)
        run: node scripts/ci/validate-signals-manifest.ts

      # WS8 — required-secrets manifest ↔ `${VAR:?}` references in
      # every tracked compose file. Both directions: compose cannot
      # add a required var without a manifest entry; the manifest
      # cannot collect stale entries nobody uses. Schema-level checks
      # enforce that every `secret`-type entry declares a rotation
      # cadence + runbook — secrets without a rotation story are
      # forbidden by CLAUDE.md operational discipline.
      - name: Required secrets manifest (WS8)
        run: node scripts/ci/validate-secrets-manifest.ts

  # M-FE-03: npm audit on every PR — catches vulnerable dependencies before merge.
  # Only runs on PRs (not push to main) to avoid blocking deploys.
  security-audit:
    needs: [install, detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit
      - name: Run npm audit
        run: npm audit --audit-level=high --omit=dev || true

  docs-check:
    needs: detect-changes
    if: |
      always() &&
      contains(github.event.head_commit.modified, 'docs/') ||
      contains(github.event.head_commit.added, 'docs/')
    runs-on: ubuntu-latest
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Check markdown files
        run: markdownlint 'docs/**/*.md' --ignore node_modules || true

  # ---------------------------------------------------------------------------
  # TRACK A — Auto-deploy to DigitalOcean after CI passes (push to main only).
  #
  # Replaces the previous `workflow_run` event-chain trigger in
  # deploy-digitalocean.yml that silently stopped firing at commit
  # 607f9d9d. workflow_call is a synchronous subworkflow invocation:
  # if deploy-digitalocean.yml has any structural problem, this job
  # FAILS visibly here rather than the deploy silently never starting.
  #
  # Gating: only on push to main, only when detect-changes saw real
  # source changes (skips docs-only / .github-only commits).
  #
  # `secrets: inherit` propagates GITHUB_TOKEN + the deploy SSH secrets
  # (DROPLET_HOST, DROPLET_USER, DROPLET_SSH_KEY) from the repo / env.
  # ---------------------------------------------------------------------------
  deploy:
    needs: [install, detect-changes]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.has_changes == 'true'
    uses: ./.github/workflows/deploy-digitalocean.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      id-token: write
