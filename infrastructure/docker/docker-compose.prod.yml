  # ===========================================================================

  shell:
    image: ghcr.io/okan-wqm/aquaculture_platform/shell:latest
    container_name: aqua-shell
    restart: unless-stopped
    networks:
      - aqua-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    image: ghcr.io/okan-wqm/aquaculture_platform/dashboard:latest
    container_name: aqua-dashboard
    restart: unless-stopped
    networks:
      - aqua-network

  farm-module:
    image: ghcr.io/okan-wqm/aquaculture_platform/farm-module:latest
    container_name: aqua-farm-module
    restart: unless-stopped
    networks:
      - aqua-network

  hr-module:
    image: ghcr.io/okan-wqm/aquaculture_platform/hr-module:latest
    container_name: aqua-hr-module
    restart: unless-stopped
    networks:
