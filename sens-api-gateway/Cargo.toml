[build-dependencies]
# SX1302 HAL derleme araclari (sadece `sx1302-vendor-hal` feature ile aktif)
cc = { version = "1.0", optional = true }
bindgen = { version = "0.70", optional = true }
glob = { version = "0.3", optional = true }

[dev-dependencies]
# tempfile crate for test scratch directories (v1.2.4)
# Rephrased from pre-existing comment — see docs/reviews/orphan-findings.md#ORPHAN-004
tempfile = "3.10"

# =============================================================================
# Faz 9 test infrastructure — criterion benchmarks + property testing
# =============================================================================
# WHY: ADR-020 §8 performance bench gate (p99 append < 5ms eMMC; verify > 50k/sec);
#      ADR-017 §10 bytecode dispatch perf; ADR-021 §11 HSM sign roundtrip perf.
#      Criterion emits JSON + HTML; CI uses ±10% regression gate (Plan §9 Faz 9).
# WHAT: criterion = microbenchmark framework; proptest = property-based testing
#       precursor to cargo-fuzz targets (bytecode, envelope, policy, modbus parsers).
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"

# wat — assembles WebAssembly text fixtures inline for the wasm-codec decoder
# tests, so no pre-built binary blobs are committed for unit coverage.
wat = "1"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization
panic = "abort"     # Smaller binary
strip = true        # Strip symbols

# IoT-specific Clippy lints for safety and reliability
# IEC 62443 SL2 FR3: Input validation
# SECURITY: Safety-critical lints use "deny" (not "warn") to prevent panic-prone
# code from reaching production. An unwrap/expect in a hot path (e.g. LoRa crypto)
# panics the entire edge agent on malformed input.
[lints.clippy]
unwrap_used = "deny"         # SECURITY: panic on malformed input crashes the agent
expect_used = "deny"         # SECURITY: same as unwrap — use map_err + ? instead
indexing_slicing = "deny"    # SECURITY: OOB panic — use .get() for bounds safety
large_stack_arrays = "deny"  # Prevent stack overflow on embedded
todo = "deny"                # No incomplete code in production
unimplemented = "deny"       # No unimplemented panics in production
dbg_macro = "deny"           # No debug macros in release
print_stdout = "deny"        # Use tracing instead
print_stderr = "deny"        # Use tracing instead

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"  # SECURITY: require unsafe block inside unsafe fn

