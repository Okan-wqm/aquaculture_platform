name: Performance Benchmark

# ARCH-CI-013: Fixed path triggers from non-existent frontend/**,backend/** to web/**,apps/**
# SEC-CI-002: All third-party actions pinned to full commit SHAs
# SEC-CI-018: pull_request trigger restricted to non-fork PRs only to prevent
#             execution of malicious package.json scripts from fork contributors

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Base URL for the live API smoke benchmark, for example https://api.example.com (https URL only)'
        required: false
        type: string
  pull_request:
    branches: [main, develop]
    paths:
      # ARCH-CI-013: Was 'frontend/**' and 'backend/**' — project uses web/** and apps/**.
      # 2026-04-30: This PR workflow is a frontend Lighthouse benchmark only.
      # Backend API performance requires a live target URL and runs only via
      # workflow_dispatch (k6-api job below), so app-only PRs do not run here.
      # 2026-05-10: 'apps/**' was previously listed and was reintroduced by a
      # branch-divergence regression. It is intentionally absent — backend perf
      # has no path trigger because there is no live API target on PR runs.
      - 'web/**'
      - '.github/workflows/performance-benchmark.yml'
      - '.github/actions/setup-rust-workspace/**'
      - 'rust-toolchain.toml'
      - 'tools/quality/rust-toolchain-manifest.json'

jobs:
  lighthouse:
    name: Frontend Lighthouse CI
    runs-on: ubuntu-latest
    # SEC-CI-018: Skip on fork PRs to prevent execution of potentially malicious
    # package.json scripts contributed by fork authors (npm run preview runs project scripts)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node
        # SEC-CI-002: pinned to SHA (was @v3)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      # 2026-05-05: Lighthouse builds the affected Nx graph before serving
      # frontend assets. If Rust crates are affected, the pinned toolchain must
      # exist before Nx starts parallel cargo-backed targets.
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: ./.github/actions/setup-rust-workspace

      - name: Determine Nx affected refs
        id: nx-refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="$(git rev-parse HEAD~1)"
            fi
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          npm run build -- --base="${{ steps.nx-refs.outputs.base }}" --head="${{ steps.nx-refs.outputs.head }}"
          node tools/toolchain/run.mjs npx nx run shell:build
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

      - name: Start server
        run: |
          npm --workspace @aquaculture/shell run preview -- --host 127.0.0.1 --port 4173 > lighthouse-preview.log 2>&1 &
          echo $! > server.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi

            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo "::error::Shell preview server exited before becoming ready."
              cat lighthouse-preview.log
              exit 1
            fi

            sleep 1
          done

          echo "::error::Shell preview server did not become ready on 127.0.0.1:4173."
          cat lighthouse-preview.log
          exit 1

      - name: Run Lighthouse
        # SEC-CI-002: pinned to SHA (was @v11).
        # The prior pin 2f8dda0cf82e7b8f5b3e1e7d0dd88b9e35d5c2d4 did not
        # resolve — CI consistently errored "unable to find version".
        # Re-verified against upstream via `gh api repos/treosh/
        # lighthouse-ci-action/git/refs/tags/11.4.0` and resolved the
        # annotated tag to its underlying commit SHA. Same class as
        # PROC-MEDIUM-002 (unverified SHA).
        uses: treosh/lighthouse-ci-action@1b0e7c33270fbba31a18a0fbb1de7cc5256b6d39 # v11.4.0
        with:
          urls: |
            http://127.0.0.1:4173/
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

  k6-api:
    name: Backend k6 API benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 2026-04-30: API performance requires a live target. This job is manual
    # only and refuses to run unless the operator supplies api_base_url. The
    # if-guard subsumes the prior fork-PR concern: forks cannot trigger
    # workflow_dispatch on the upstream repo, so the structural gate is
    # fail-closed for both PR and fork scenarios (tier-1 of the project's
    # architectural-solution hierarchy: "make it impossible").
    # 2026-05-10: Re-applied after a branch-divergence regression that replayed
    # pre-fix workflow content from blob 6027231f over the architectural fix
    # in commit 0cb39ac2 (blob f8f99ca8). Without this guard the PR-event run
    # invokes k6 with no API_BASE_URL and the smoke script throws (exit 107).
    if: github.event_name == 'workflow_dispatch' && inputs.api_base_url != ''
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup k6
        # SEC-CI-002: pinned to SHA (was @v1)
        # SHA verified 2026-04-22 via `gh api repos/grafana/setup-k6-action/tags` —
        # real v1.2.1 commit SHA. The previous value was an invented SHA that
        # GitHub refuses to resolve (supply-chain hygiene memory rule).
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1

      - name: Run k6 tests
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          # 2026-05-10: Defence-in-depth assert (tier-3 detection behind the
          # tier-1 if-guard above). The api-smoke.js script also throws on a
          # missing API_BASE_URL, but emitting a CI annotation here gives a
          # cleaner failure signal if a future edit removes the env block.
          [ -n "$API_BASE_URL" ] || { echo "::error::API_BASE_URL was not propagated to the k6 step"; exit 1; }
          k6 run tests/performance/api-smoke.js --vus 10 --duration 30s

      - name: Upload k6 results
        if: always()
        # SEC-CI-002: pinned to SHA (was @v3)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-results
          path: ./k6-results/*

  summary:
    needs: [lighthouse, k6-api]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Compose summary
        run: |
          echo "# Performance Benchmark Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Lighthouse runs on web pull requests." >> $GITHUB_STEP_SUMMARY
          echo "- k6 API benchmark runs only on workflow_dispatch with api_base_url." >> $GITHUB_STEP_SUMMARY
          echo "- Review uploaded artifacts for detailed results." >> $GITHUB_STEP_SUMMARY
