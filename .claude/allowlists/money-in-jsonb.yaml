# Stripe identifier properties declared by more than one WRITABLE entity. A
# Stripe object has one owner; two writable homes means two services can mint
# a product, a price or a customer for the same thing and neither row can be
# trusted. billing is the authoritative half in every pair below, so each entry
# names the OTHER declaration — the one that goes away.
duplicateStripeIdentifiers:
  - site: 'apps/admin-api-service/src/tenant/entities/tenant-activity.entity.ts#TenantBillingInfo.stripeCustomerId'
    owner: okan
    expiry: 2026-12-31
    findingId: BILLING-CRITICAL-003
    reason: admin.tenant_billing_info duplicates billing.subscriptions' Stripe customer; the table is on the kill list and its writer is retired with the provisioning rework
  - site: 'apps/admin-api-service/src/tenant/entities/tenant-activity.entity.ts#TenantBillingInfo.stripeSubscriptionId'
    owner: okan
    expiry: 2026-12-31
    findingId: BILLING-CRITICAL-003
    reason: admin.tenant_billing_info duplicates billing.subscriptions' Stripe subscription; the table is on the kill list and its writer is retired with the provisioning rework
