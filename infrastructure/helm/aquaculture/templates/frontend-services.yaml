{{/*
=============================================================================
Aquaculture Platform - Frontend Services
=============================================================================
Frontend containers run as nginx (user 101). emptyDir volumes are provided
for nginx write paths that require filesystem access when readOnlyRootFilesystem
is enabled.
=============================================================================
*/}}

{{- /* Shell (Host Application) */}}
{{- if .Values.shell.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aquaculture.fullname" . }}-shell
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aquaculture.frontendLabels" . | nindent 4 }}
    app: shell
spec:
  replicas: {{ .Values.shell.replicaCount }}
  selector:
    matchLabels:
      app: shell
  template:
    metadata:
      labels:
        app: shell
        tier: frontend
    spec:
      serviceAccountName: {{ include "aquaculture.fullname" . }}-shell
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: shell
                topologyKey: kubernetes.io/hostname
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
      containers:
        - name: shell
          image: {{ include "aquaculture.image" (dict "global" .Values.global "image" .Values.shell.image) }}
          imagePullPolicy: {{ .Values.shell.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.shell.service.targetPort }}
          env:
            - name: DASHBOARD_URL
              value: "http://{{ include "aquaculture.fullname" . }}-dashboard"
            - name: FARM_MODULE_URL
              value: "http://{{ include "aquaculture.fullname" . }}-farm-module"
            {{- if .Values.processEditor.enabled }}
            - name: PROCESS_EDITOR_URL
              value: "http://{{ include "aquaculture.fullname" . }}-process-editor"
            {{- end }}
            - name: ADMIN_PANEL_URL
              value: "http://{{ include "aquaculture.fullname" . }}-admin-panel"
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.shell.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.shell.service.targetPort }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.shell.service.targetPort }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- include "aquaculture.frontendSecurityContext" . | nindent 10 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aquaculture.fullname" . }}-shell
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aquaculture.labels" . | nindent 4 }}
    app: shell
spec:
  type: {{ .Values.shell.service.type }}
  ports:
    - port: {{ .Values.shell.service.port }}
      targetPort: {{ .Values.shell.service.targetPort }}
      name: http
  selector:
    app: shell
{{- end }}

