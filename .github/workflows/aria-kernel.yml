name: aria-kernel

# Plan ARIA-V2 §3.7 (Phase 6) — workflow hygiene closures:
#   * paths: filter removed from push block (mainline re-push must
#     re-evaluate the kernel regardless of which files changed; the
#     paths gate caused the validation cycle to skip re-runs that
#     were architecturally meaningful — closes ARIA-V-007)
#   * workflow_dispatch added so operators can manually re-fire
#   * top-level permissions: contents: read (INFRA-HIGH-003)
#   * actions/checkout: persist-credentials: false (INFRA-HIGH-004)
#   * npm ci → npm ci --ignore-scripts --no-audit --no-fund with retry (INFRA-CRITICAL-001)
#   * concurrency key unified across workflows (INFRA-HIGH-001)
# Invariant lock: aria-kernel/tests/test_ci_workflow_invariants.py (I-25).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "aria-kernel/**"
      - "scripts/ci/aria-suite-run.sh"
      - "docs/aria/**"
      # ARIA-MEDIUM-135 — inherited from the retired aria-kernel-fast.yml: a
      # SPEC/ADR amendment fires the kernel lane on the PR, not first on the
      # push to main (I-V3-31c).
      - "docs/adr/**"
      - ".github/workflows/aria-kernel.yml"
      # Plan ARIA-V2 §3.6 — tools/aria-poc + tools/shared are now
      # kernel-quality-gate adjacent (I-19..I-22, I-39 land here).
      - "tools/aria-poc/**"
      - "tools/shared/**"
      # ARIA-HIGH-098 — the registry contract lives in the suite
      # (tests/test_adapter_fixture_evidence_contract.py: every shipped
      # manifest carries a fixture case expecting ok, and every case runs
      # ok through the evidence validator). Without this path the pin was
      # PR-time in name only: a manifest without a case, a case rewritten
      # to expect evidence_error, or a TS adapter that drops per-finding
      # evidence touched only tools/aria-adapters/**, ran neither kernel
      # lane, and was first checked on the push to main.
      - "tools/aria-adapters/**"
  push:
    branches:
      - main

# Plan ARIA-V2 §3.7 — top-level default-deny token surface.
permissions:
  contents: read

concurrency:
  # Plan ARIA-V2 INFRA-HIGH-001 — unified key so PR + push on the same
  # SHA share the group (no 2x CI minutes charge).
  group: aria-kernel-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ARIA-HIGH-136 — the suite outgrew one interpreter inside a lane budget:
  # 7,387 tests, and runs 36386654289 (PR) and 36358071953 (main) were
  # cancelled at the 110-minute cap with nothing red. Three jobs replace the
  # one that ran everything in sequence:
  #   suite       — the unittest half, split into measured, deterministic
  #                 shards that run in parallel
  #                 (aria-kernel/tests/_helpers/suite_shards.py);
  #   lane        — the pytest half whole, plus every non-suite step;
  #   state       — this change's kernel compacting and verifying the REAL
  #                 aria/state tip (ARIA-HIGH-240);
  #   aria-kernel — the check a reader looks for: green only when every shard,
  #                 the lane and the state gate are green AND the shard
  #                 reports prove the shards ran the whole suite exactly once.
  suite:
    name: suite (${{ matrix.shard }})
    # ARIA-MEDIUM-134/139 — the suite proves the REAL sandbox, and the
    # hosted 24.04 image cannot host it: bubblewrap installs cleanly there
    # and every invocation dies `loopback: Failed RTM_NEWADDR: Operation not
    # permitted` because `kernel.apparmor_restrict_unprivileged_userns=1`
    # hands an unconfined binary a user namespace without capabilities
    # (measured, run 34897063564). The 22.04 image ships unprivileged user
    # namespaces as the OS default — no sysctl is relaxed, the lane takes
    # the host as it is. Its bubblewrap (0.6.1) carries every flag the
    # wrapper uses; its git (2.34) carries ssh signing. The image is a
    # bridge: the durable answer is a runner that confines and is not
    # production (ARIA-MEDIUM-139), and `ensure-sandbox-backend` still
    # fails closed by name if this image stops confining.
    runs-on: ubuntu-22.04
    # 30 (ARIA-HIGH-136): a shard carries ~1/8 of the unittest half by measured
    # weight — aria-kernel/tests/_helpers/suite_shard_weights.json, 711 modules
    # summing to 124.1 min on the droplet (2026-09-28, four timers in
    # parallel). Hosted, the whole suite step took 83 min on run 36386654289
    # attempt 2 and passed 108 min on attempt 1 (cancelled green), so a shard's
    # share is ~10.4 min on the quick attempt and ~13.6 min on the slow one,
    # plus ~1.5 min of checkout and setup. 30 is twice the slow case because
    # the weights come from a contended host, not from this image; the shard
    # reports' seconds replace them (`suite_shards.py weights`) and the cap
    # comes down with that measurement, never ahead of it.
    timeout-minutes: 30
    strategy:
      # One red shard must not cancel the others: the aggregation job reports
      # every shard's result, and a cancelled shard hides the rest of the run.
      fail-fast: false
      matrix:
        # Labels only. The partition takes its index and its count from
        # strategy.job-index / strategy.job-total, so adding or removing a
        # label re-partitions the suite; it cannot drop a slice of it.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A kernel workspace is a whole clone: the kernel reads this
          # checkout's history (twin churn/co-change, anchor existence) and
          # refuses a shallow one by name. Pinned on every kernel lane by
          # aria-kernel/tests/invariants/test_kernel_lanes_check_out_full_history.py;
          # aria-auto-cycle.yml carries the full account.
          fetch-depth: 0
      - uses: ./.github/actions/setup-aria-kernel
      # ARIA-MEDIUM-134 — the suite proves the REAL sandbox: the managed
      # Claude/Codex lanes, the provider-admission lanes and the implementer
      # identity/containment pins each spawn through wrap_bash_in_sandbox and
      # refuse by name when no backend confines. The droplet provisions bwrap;
      # the hosted image does not, and fourteen tests were red on the
      # candidate's first hosted run (34853938794) for exactly that. The lane
      # provisions the backend the way the executor and nightly lanes do — one
      # definition — and the action fails closed, naming the host facts, when
      # the host still cannot confine.
      - uses: ./.github/actions/ensure-sandbox-backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      # Plan ARIA-V2 §Phase 1 CRITICAL-020 — aria-kernel declares
      # pyyaml>=6.0 in pyproject.toml (required by I-25 + I-26
      # invariants for YAML workflow + frontmatter parsing).
      # Architectural shape: pyproject.toml is the dependency SSoT;
      # source imports come from PYTHONPATH below. Installing the local
      # package directly writes aria_kernel.egg-info into the checkout,
      # which violates the post-run clean-worktree contract.
      - name: Run aria-kernel unit + invariant tests
        # The unittest half's shard of this matrix job. The report names what
        # the shard discovered and ran; the aria-kernel job verifies all of
        # them together.
        env:
          SHARD_INDEX: ${{ strategy.job-index }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: bash scripts/ci/aria-suite-run.sh --shard "$((SHARD_INDEX + 1))/${SHARD_TOTAL}" "${RUNNER_TEMP}/aria-suite-shards/shard-$((SHARD_INDEX + 1)).json"
      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-kernel-suite-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/aria-suite-shards/
          # A shard that died before writing its report is named by the
          # aria-kernel job's verify step, not by this upload.
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify post-run clean worktree
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

  lane:
    # Same image and sandbox backend as `suite` (ARIA-MEDIUM-134/139): the
    # pytest half and the discovery run spawn through the same wrapper.
    runs-on: ubuntu-22.04
    # 15 (ARIA-HIGH-136): everything the one kernel job ran besides the unittest
    # half — 1.4 min after the suite step on run 36386654289 attempt 2 — plus
    # the pytest half (91 tests, 43 s on the droplet) and ~1.5 min of setup:
    # ~4 min measured. The cap is a hang guard at ~4x that, not a squeeze.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A kernel workspace is a whole clone (see `suite`).
          fetch-depth: 0
      - uses: ./.github/actions/setup-aria-kernel
      - uses: ./.github/actions/ensure-sandbox-backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Run aria-kernel pytest-native tests
        # The pytest-owned half of the suite partition, whole (91 tests).
        run: bash scripts/ci/aria-suite-run.sh --pytest-native
      # Plan ARIA-V2 §3.6 + CRITICAL-013 — tests under tools/aria-poc/invariants
      # and tools/shared/invariants are first-class invariants (I-19..I-22, I-39).
      # Discovery must run them on every kernel-touching PR/push, otherwise
      # PoC dedup regressions ship undetected.
      - name: Run tools/aria-poc invariant tests (Plan ARIA-V2 §3.6)
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=.:aria-kernel python3 -m unittest discover tools/aria-poc/invariants -p '*test*.py'
      - name: Run tools/shared invariant tests (Plan ARIA-V2 §3.6)
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=.:aria-kernel python3 -m unittest discover tools/shared/invariants -p '*test*.py'
      # The acceptance lane audits ARIA from OUTSIDE the kernel, so its suite
      # sits outside aria-kernel/ — and `unittest discover aria-kernel` in
      # aria-suite-run.sh therefore never collected it. test_harness.py spent
      # three days un-importable (a dedented assertion raised NameError at
      # module scope) with nothing anywhere reporting it. These two steps are
      # what make the lane a gate instead of a file.
      - name: Run ARIA acceptance self-tests
        run: npm run test:aria-acceptance:unit
      - name: Run ARIA acceptance harness
        run: npm run test:aria-acceptance
      # Plan ARIA-V5 §3e Phase 2 — pedagogy lint over all agents in
      # --strict mode (allowlist IGNORED). All 84 agents carry their
      # V5 §3e narrative pairings and the grandfather allowlist is
      # empty, so this step is permanently enforcing: a new
      # un-narrated imperative reds the gate with no bypass.
      - name: Run pedagogy lint (Plan ARIA-V5 §3e)
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel python3 -m aria_kernel.pedagogy_lint --agents-dir .claude/agents --allowlist tests/invariants/agent-pedagogy.allowlist.json --strict --format text
      # Plan ARIA-V6 §3 V6.5 (C5) — specialist-review dry-run validates
      # the Lane-A inventory + role mapping. Warn-mode at C5; the --strict
      # flip is a tracked decision (ORPHAN-LOW-774: owner + criterion +
      # deadline).
      - name: Specialist-review dry-run (Plan ARIA-V6 §3 V6.5)
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel python3 -m aria_kernel specialist-review dry-run --agents-dir .claude/agents
      # ORPHAN-HIGH-573 (verify_workflow_registry) — the whole-inventory
      # workflow contract verdict. preflight's per-contract check only ever
      # visits workflows that already have a contract, so an ARIA workflow
      # added with neither a contract nor an audited exclusion was invisible
      # to every gate. Wiring it into verify_workflow_preflight was reverted
      # for cause (synthetic workspaces legitimately lack the YAMLs); this
      # lane step is the caller that always sees the real repo.
      - name: Verify workflow registry (whole inventory)
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel python3 -m aria_kernel workflow verify-registry --workspace-root .
      - name: Reset CI-local ARIA state
        run: |
          rm -rf ./.aria-ci/tools ./.aria-ci/workspaces
          mkdir -p ./.aria-ci
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel python3 -m aria_kernel integrity migrate-tools-bootstrap --tools-dir ./.aria-ci/tools --workspace-root . --acknowledge --reason "ci bootstrap (Plan ARIA-V2 §3.8 idempotent umbrella)"
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel python3 -m aria_kernel discovery run --workspace-root . --workspace-base ./.aria-ci/workspaces --tools-dir ./.aria-ci/tools --cycle-id ci-${{ github.run_id }} --snapshot-mode committed
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel python3 -m aria_kernel integrity verify --workspace-root . --workspace-base ./.aria-ci/workspaces --tools-dir ./.aria-ci/tools
      - name: Run ARIA docs/runtime SSoT invariant
        run: npm run aria:docs:ssot
      - name: Run ARIA runtime artifact smoke
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel python3 - <<'PY'
          import json
          import tempfile
          from pathlib import Path

          # The smoke writes governed surfaces ('runs'/'cycles' are
          # enterprise-required), so it MUST go through the declared-surface
          # API like every production writer (tool_health.py / cycle.py) —
          # the raw append_jsonl primitive is rejected by the ledger's
          # declared-surface guard for exactly this class of writer.
          from aria_kernel.ledger import append_declared_jsonl
          from aria_kernel.runtime_artifacts import ARTIFACT_BEARING, classify_cycle_evidence, write_run_artifact
          from aria_kernel.tool_registry import ensure_tools_binding

          repo = Path.cwd().resolve()
          watched_repo_outputs = [
              repo / "aria-tools" / "runs.jsonl",
              repo / "aria-tools" / "autonomy_state.jsonl",
              repo / "aria-tools" / "governance.jsonl",
              repo / "aria-tools" / "run-artifacts",
              repo / "aria-kernel" / "aria-tools",
              repo / "artifacts",
          ]
          before = {
              path: (path.exists(), path.stat().st_mtime_ns if path.exists() else None)
              for path in watched_repo_outputs
          }
          tools = Path(tempfile.mkdtemp(prefix="aria-tools-smoke-"))
          root = ensure_tools_binding(tools, workspace_root=repo)
          (root / "registry.json").write_text(
              json.dumps({"schema_version": 1, "tools": [{"tool_id": "smoke-tool", "status": "ACTIVE"}]}) + "\n",
              encoding="utf-8",
          )
          cycle_id = "ci-runtime-smoke"
          run_id = "run-1"
          artifact = write_run_artifact(
              base_dir=root,
              run_id=run_id,
              cycle_uid=cycle_id,
              tool_id="smoke-tool",
              kind="runtime_smoke",
              payload={"stdout": "ok", "stderr": "", "parsed_output": {"observations": [], "findings": []}},
              run_status="ok",
              repo_state_id="ci-smoke",
              owner="ci-runtime-smoke",
          )
          append_declared_jsonl(root / "runs.jsonl", {
              "schema_version": 2,
              "cycle_id": cycle_id,
              "run_id": run_id,
              "tool_id": "smoke-tool",
              "status": "ok",
              "artifact_ref": artifact["artifact_ref"],
              "artifact_hash": artifact["artifact_hash"],
              "artifact_status": artifact["artifact_status"],
              "runner": {"raw_findings_count": 0},
          }, expected_surface="runs")
          append_declared_jsonl(root / "cycles.jsonl", {"schema_version": 1, "cycle_id": cycle_id, "event": "completed"}, expected_surface="cycles")
          evidence = classify_cycle_evidence(base_dir=root, cycle_id=cycle_id)
          if evidence.get("cycle_evidence_class") != ARTIFACT_BEARING:
              raise SystemExit(json.dumps(evidence, indent=2, sort_keys=True))
          after = {
              path: (path.exists(), path.stat().st_mtime_ns if path.exists() else None)
              for path in watched_repo_outputs
          }
          changed = [path.relative_to(repo).as_posix() for path in watched_repo_outputs if before[path] != after[path]]
          if changed:
              raise SystemExit(f"repo-local runtime output touched by smoke: {changed}")
          PY
      - name: Verify post-run clean worktree
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

  state:
    # ARIA-HIGH-240 — no pre-merge lane ran the maintenance path on real
    # state. ARIA-HIGH-185's compaction change (8028bbb005) merged with this
    # lane green and made every compacted tree one the kernel's own verify
    # refuses (ARIA-HIGH-239): the first run to compact the real tree was
    # the next scheduled aria-state-maintenance, and that lane stayed red
    # from 2026-09-21 to 2026-09-29. This job runs that lane's compaction and
    # verify with THIS change's kernel on the live aria/state tip, and
    # publishes nothing: the tree is a throwaway copy.
    # Proven on tip d61dc79e5 (2026-09-29): the kernel before HIGH-239's fix
    # leaves 60 raw_pointer_missing after `state compact --retain-days 7`,
    # main's kernel 0.
    #
    # The two steps below are the maintenance lane's own steps, byte for
    # byte (name, id, env, run); tests/test_state_compaction_gate.py fails
    # the build when they differ, so the gate cannot drift from the path it
    # stands in for.
    runs-on: ubuntu-latest
    # 10: restore 4 s, compact 8 s, verify 6 s on the maintenance run
    # 36527583572 (2026-09-29), plus ~1 min of checkout and setup. A hang
    # guard, not a squeeze.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A kernel workspace is a whole clone (see `suite`).
          fetch-depth: 0
      - uses: ./.github/actions/setup-aria-kernel
      # Read-only: the job token is `contents: read`, no bootstrap-ack is
      # passed (a missing branch is refused, never created), and nothing
      # below publishes or pushes.
      - uses: ./.github/actions/restore-aria-state
        id: restore_state
      - name: Compact surfaces and strip old artifacts (canonical CLI)
        if: steps.restore_state.outputs.restored == 'true' || steps.restore_state.outputs.bootstrap == 'true'
        env:
          RETAIN_DAYS: ${{ github.event.inputs.retain_days || '7' }}
        run: |
          set -euo pipefail
          test -n "${ARIA_TOOLS_DIR:-}"
          test -f "${ARIA_TOOLS_DIR}/repo_identity.json"
          BEFORE=$(du -sb "${ARIA_TOOLS_DIR}/" | cut -f1)
          PYTHONPATH=aria-kernel python3 -m aria_kernel state compact \
            --tools-dir "${ARIA_TOOLS_DIR}" \
            --retain-days "$RETAIN_DAYS"
          AFTER=$(du -sb "${ARIA_TOOLS_DIR}/" | cut -f1)
          echo "compact_result: before=${BEFORE} after=${AFTER} saved=$((BEFORE - AFTER))"
      - name: Verify ARIA state integrity
        if: steps.restore_state.outputs.restored == 'true' || steps.restore_state.outputs.bootstrap == 'true'
        id: integrity
        run: |
          set -uo pipefail
          VERDICT="${RUNNER_TEMP}/aria-integrity-verdict.json"
          VERDICT_ERR="${RUNNER_TEMP}/aria-integrity-verdict.err"
          if PYTHONPATH=aria-kernel python3 -m aria_kernel integrity verify \
               --tools-dir "$ARIA_TOOLS_DIR" \
               --workspace-root "$GITHUB_WORKSPACE" > "$VERDICT" 2>"$VERDICT_ERR"; then
            echo "state_valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "state_valid=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo '### ARIA state integrity (after compaction)'
            echo '```json'
            head -c 4000 "$VERDICT" 2>/dev/null || echo '{}'
            echo '```'
            if [ -s "$VERDICT_ERR" ]; then
              echo '```'
              tail -20 "$VERDICT_ERR"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when this kernel's compaction does not verify
        if: always() && steps.integrity.outputs.state_valid != 'true'
        run: |
          set -euo pipefail
          echo "::error::this change's kernel compacted the live aria/state tip into a tree its own integrity verify refuses; the next aria-state-maintenance run on main would publish nothing (see the step summary)"
          exit 1

  aria-kernel:
    # The kernel lane's verdict. `!cancelled()` rather than `always()`: a
    # superseded run (concurrency cancel-in-progress) stays cancelled instead
    # of reporting a missing shard as a failure.
    needs: [suite, lane, state]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      # Runs no kernel code — the verifier reads shard reports with the
      # standard library — so a depth-1 checkout is the honest one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: aria-kernel-suite-shard-*
          path: ${{ runner.temp }}/aria-suite-shards
          merge-multiple: true
      - name: Verify the shards ran the whole suite once
        run: python3 aria-kernel/tests/_helpers/suite_shards.py verify --reports-dir "${RUNNER_TEMP}/aria-suite-shards"
      - name: Require every kernel job
        if: ${{ !cancelled() }}
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
          LANE_RESULT: ${{ needs.lane.result }}
          STATE_RESULT: ${{ needs.state.result }}
        run: |
          echo "suite=${SUITE_RESULT} lane=${LANE_RESULT} state=${STATE_RESULT}"
          test "${SUITE_RESULT}" = success
          test "${LANE_RESULT}" = success
          test "${STATE_RESULT}" = success
