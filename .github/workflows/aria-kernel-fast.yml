name: aria-kernel-fast

# Plan ARIA-V2 §3.7 (Phase 6) — fast pre-merge gate.
#   * push: trigger added so mainline commits get a green/red signal
#     without waiting for the full kernel cycle (covers I-25 clause 3).
#   * paths-ignore on docs/** + aria-tools/reports/daily/** so the
#     aria-bot daily commit does not re-fire the gate.
#   * Same hardening surface as aria-kernel.yml / aria-kernel-full.yml.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "aria-kernel/**"
      - "docs/aria/**"
      - "docs/adr/**"
      - ".github/workflows/aria-kernel*.yml"
      - "tools/aria-poc/**"
      - "tools/shared/**"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "aria-tools/reports/daily/**"
      # Plan ARIA-V3 §B3 + INFRA-HIGH-008 — SPEC + ADR edits MUST
      # retrigger kernel tests so a Plan ARIA-V3 SPEC §0.2 / §5.4 /
      # §8.1 amendment cannot drift from the kernel's invariant
      # suite. Negation patterns un-ignore ``docs/aria/**`` and
      # ``docs/adr/**`` from the broader ``docs/**`` exclusion.
      - "!docs/aria/**"
      - "!docs/adr/**"

permissions:
  contents: read

concurrency:
  group: aria-kernel-fast-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Plan ARIA-V2 §Phase 1 CRITICAL-020 — the kernel's pyyaml dep. The
      # install it used to do by hand here now lives in the composite action
      # above, so every kernel-running job provisions the same way.
      - uses: ./.github/actions/setup-aria-kernel
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel:. python3 -m unittest discover aria-kernel -p '*test*.py'
      # Plan ARIA-V5 §3e Phase 2 — pedagogy lint in --strict mode
      # (allowlist ignored; permanently enforcing). Fast PR feedback.
      - name: Run pedagogy lint (Plan ARIA-V5 §3e)
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel python3 -m aria_kernel.pedagogy_lint --agents-dir .claude/agents --allowlist tests/invariants/agent-pedagogy.allowlist.json --strict --format text
      # Plan ARIA-V6 §3 V6.5 (C5) — specialist-review dry-run validates
      # the Lane-A inventory + role mapping. Warn-mode at C5; flip to
      # --strict in a follow-up commit once the Lane-A inventory is
      # fully populated.
      - name: Specialist-review dry-run (Plan ARIA-V6 §3 V6.5)
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel python3 -m aria_kernel specialist-review dry-run --agents-dir .claude/agents
