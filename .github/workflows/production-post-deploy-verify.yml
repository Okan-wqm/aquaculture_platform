name: Production Post-Deploy Verify

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: '40-character SHA to verify. Blank uses origin/main.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      target_sha:
        description: '40-character SHA to verify.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-post-deploy-verify-${{ inputs.target_sha || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve target SHA and deployed tag
        id: target
        env:
          TARGET_SHA_INPUT: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch --force --prune origin main '+refs/tags/deployed/production:refs/tags/deployed/production'

          TARGET_SHA="${TARGET_SHA_INPUT:-}"
          if [ -z "${TARGET_SHA}" ]; then
            TARGET_SHA="$(git rev-parse origin/main)"
          fi

          case "${TARGET_SHA}" in
            *[!0-9a-f]*)
              echo "::error::target_sha must be lowercase hex."
              exit 2
              ;;
          esac
          if [ "${#TARGET_SHA}" -ne 40 ]; then
            echo "::error::target_sha must be exactly 40 characters."
            exit 2
          fi

          DEPLOYED_SHA="$(git rev-parse deployed/production)"
          if [ "${DEPLOYED_SHA}" != "${TARGET_SHA}" ]; then
            echo "::error::deployed/production does not match target_sha."
            echo "target_sha=${TARGET_SHA}"
            echo "deployed_production=${DEPLOYED_SHA}"
            exit 1
          fi

          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "deployed_sha=${DEPLOYED_SHA}" >> "$GITHUB_OUTPUT"

      - name: Assert production SSH secrets present
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in DROPLET_HOST DROPLET_USER DROPLET_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing production environment secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run release-ledger, digest, and health proof on droplet
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/ssh"
          key_file="$RUNNER_TEMP/ssh/production_key"
          printf '%s\n' "${DROPLET_SSH_KEY}" > "$key_file"
          chmod 600 "$key_file"

          evidence="$RUNNER_TEMP/production-post-deploy-evidence.json"
          ssh -i "$key_file" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "${DROPLET_USER}@${DROPLET_HOST}" \
            "TARGET_SHA=${TARGET_SHA} bash -s" \
            < scripts/deploy/post-deploy-verify.sh \
            > "$evidence"

          python3 -m json.tool "$evidence" > production-post-deploy-evidence.json
          {
            echo "### Production post-deploy verification"
            echo ""
            echo "- Target SHA: \`${TARGET_SHA}\`"
            echo "- deployed/production: \`${{ steps.target.outputs.deployed_sha }}\`"
            echo "- Evidence artifact: \`production-post-deploy-evidence\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-post-deploy-evidence-${{ steps.target.outputs.target_sha }}
          path: production-post-deploy-evidence.json
          retention-days: 30
