name: Security - Gitleaks

# SECURITY (MEDIUM-005): CI-side safety net for secret-leak prevention.
# The same .gitleaks.toml ruleset runs locally via the pre-commit hook; this
# workflow catches anything that bypasses the hook (e.g. emergency pushes,
# contributors without pre-commit installed).
#
# SEC-CI-002: all third-party actions pinned to full commit SHAs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan repository for committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        # Gitleaks needs full history on push to main so it can scan new commits.
        # SEC-CI-002: pinned to SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # SEC-CI-002: pinned to SHA (gitleaks-action v2.3.9)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # gitleaks-action v2.x BREAKING CHANGE (2024-05): GITHUB_TOKEN is
          # required for PR scans — the action uses it to list the commit
          # range via the GH API rather than a direct git walk. Omitting it
          # fails fast with "GITHUB_TOKEN is now required to scan pull
          # requests" (see the action's README). The automatically-provided
          # token ${{ secrets.GITHUB_TOKEN }} is sufficient; no PAT needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Config path is read automatically from .gitleaks.toml at repo root.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
          # License required for private repos only; public repos run without.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
