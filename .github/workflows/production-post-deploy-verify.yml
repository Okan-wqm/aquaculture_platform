name: Production Post-Deploy Verify

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact current-main SHA to verify. Blank uses deployed/production.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      target_sha:
        description: '40-character SHA to verify.'
        required: true
        type: string
      expected_prior_deployed_sha:
        description: 'Expected deployed/production value before release-baseline promotion.'
        required: true
        type: string
      caller_holds_production_lock:
        description: 'True only for the nested deploy workflow that owns global production serialization.'
        required: true
        type: boolean
permissions:
  contents: read

concurrency:
  # A nested call is already covered by its caller's global production lock;
  # a direct operator verification independently acquires that same lock.
  group: ${{ inputs.caller_holds_production_lock && format('production-postverify-nested-{0}', github.run_id) || github.ref == 'refs/heads/main' && 'production-release-authority' || format('rejected-production-postverify-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      contents: read
    steps:
      - name: Prove exact current main before checkout
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main'
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          REMOTE_MAIN_ROWS="$(git ls-remote --refs \
            "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main)"
          test "$(printf '%s\n' "${REMOTE_MAIN_ROWS}" | sed '/^$/d' | wc -l)" -eq 1
          test "${REMOTE_MAIN_ROWS%%$'\t'*}" = "${GITHUB_SHA}"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require checked-out current main before protected toolchain
        run: |
          set -euo pipefail
          git fetch --force --prune origin \
            '+refs/heads/main:refs/remotes/origin/main'
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${GITHUB_SHA}" = "$(git rev-parse refs/remotes/origin/main)"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install exact bundle toolchain
        run: npm ci --ignore-scripts --no-audit

      - name: Install Linux platform binaries
        uses: ./.github/actions/install-platform-binaries

      - name: Resolve target SHA and deployed tag
        id: target
        env:
          TARGET_SHA_INPUT: ${{ inputs.target_sha }}
          EXPECTED_PRIOR_DEPLOYED_SHA_INPUT: ${{ inputs.expected_prior_deployed_sha }}
          CALLER_HOLDS_PRODUCTION_LOCK_INPUT: ${{ inputs.caller_holds_production_lock || false }}
        run: |
          set -euo pipefail
          ZERO_SHA=0000000000000000000000000000000000000000

          DEPLOYED_ROWS="$(git ls-remote --refs origin refs/tags/deployed/production)"
          DEPLOYED_COUNT="$(printf '%s\n' "${DEPLOYED_ROWS}" | sed '/^$/d' | wc -l)"
          case "${DEPLOYED_COUNT}" in
            0) OBSERVED_DEPLOYED_SHA="${ZERO_SHA}" ;;
            1) OBSERVED_DEPLOYED_SHA="${DEPLOYED_ROWS%%$'\t'*}" ;;
            *) echo '::error::deployed/production resolved to multiple refs.'; exit 1 ;;
          esac

          TARGET_SHA="${TARGET_SHA_INPUT:-}"
          EXPECTED_PRIOR_DEPLOYED_SHA="${EXPECTED_PRIOR_DEPLOYED_SHA_INPUT:-}"
          case "${CALLER_HOLDS_PRODUCTION_LOCK_INPUT}" in
            true)
              [ -n "${EXPECTED_PRIOR_DEPLOYED_SHA}" ] || {
                echo '::error::nested lock mode requires an expected prior deployed SHA.'
                exit 2
              }
              ;;
            false)
              [ -z "${EXPECTED_PRIOR_DEPLOYED_SHA}" ] || {
                echo '::error::standalone lock mode cannot claim a nested prior baseline.'
                exit 2
              }
              ;;
            *) echo '::error::caller_holds_production_lock must be boolean.'; exit 2 ;;
          esac
          if [ -n "${EXPECTED_PRIOR_DEPLOYED_SHA}" ]; then
            [[ "${EXPECTED_PRIOR_DEPLOYED_SHA}" =~ ^[0-9a-f]{40}$ ]]
            [ -n "${TARGET_SHA}" ] || {
              echo '::error::nested pre-baseline verification requires target_sha.'
              exit 2
            }
            [ "${TARGET_SHA}" = "${GITHUB_SHA}" ] || {
              echo '::error::nested verification target must be exact current main.'
              exit 2
            }
            EXPECTED_DEPLOYED_SHA="${EXPECTED_PRIOR_DEPLOYED_SHA}"
          else
            [ "${OBSERVED_DEPLOYED_SHA}" != "${ZERO_SHA}" ] || {
              echo '::error::standalone verification requires deployed/production.'
              exit 2
            }
            TARGET_SHA="${TARGET_SHA:-${OBSERVED_DEPLOYED_SHA}}"
            EXPECTED_DEPLOYED_SHA="${TARGET_SHA}"
          fi
          case "${TARGET_SHA}" in
            *[!0-9a-f]*) echo '::error::target_sha must be lowercase hex.'; exit 2 ;;
          esac
          if [ "${#TARGET_SHA}" -ne 40 ] || \
            ! git cat-file -e "${TARGET_SHA}^{commit}" || \
            ! git merge-base --is-ancestor "${TARGET_SHA}" refs/remotes/origin/main; then
            echo '::error::target_sha must be an exact protected-main ancestor.'
            exit 2
          fi
          if [ "${TARGET_SHA}" != "${GITHUB_SHA}" ]; then
            echo '::error::production host verification may execute only exact current-main code.'
            exit 2
          fi

          if [ "${OBSERVED_DEPLOYED_SHA}" != "${EXPECTED_DEPLOYED_SHA}" ]; then
            echo '::error::deployed/production changed before host verification.'
            echo "expected_deployed_sha=${EXPECTED_DEPLOYED_SHA}"
            echo "observed_deployed_sha=${OBSERVED_DEPLOYED_SHA}"
            exit 1
          fi

          echo "target_sha=${TARGET_SHA}" >> "${GITHUB_OUTPUT}"
          echo "expected_deployed_sha=${EXPECTED_DEPLOYED_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build exact deployed-SHA production host runtime
        id: bundle
        env:
          SOURCE_SHA: ${{ steps.target.outputs.target_sha }}
          WORKFLOW_AUTHORITY_SHA: ${{ github.sha }}
          OUTPUT_PATH: ${{ runner.temp }}/production-host-runtime.tar.gz
        run: |
          set -euo pipefail
          NODE_BIN="$(/usr/bin/readlink -f -- "$(command -v node)")"
          case "${NODE_BIN}" in /*) ;; *) exit 1 ;; esac
          test -f "${NODE_BIN}"
          test ! -L "${NODE_BIN}"
          test -x "${NODE_BIN}"
          PRODUCER_PATH="$(mktemp -p "${RUNNER_TEMP}" production-host-runtime-producer.XXXXXXXX)"
          cleanup_producer() {
            status=$?
            trap - EXIT
            rm -f -- "${PRODUCER_PATH}"
            exit "${status}"
          }
          trap cleanup_producer EXIT
          /usr/bin/env -i \
            PATH=/usr/bin:/bin HOME=/nonexistent LC_ALL=C \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            /usr/bin/git --no-replace-objects \
              -c core.hooksPath=/dev/null -c protocol.allow=never \
              -C "${GITHUB_WORKSPACE}" show \
              "${WORKFLOW_AUTHORITY_SHA}:tools/scripts/ci/prepare-production-host-runtime-bundle.sh" \
              > "${PRODUCER_PATH}"
          chmod 0500 "${PRODUCER_PATH}"
          digest="$(/usr/bin/env -i \
            PATH=/usr/bin:/bin HOME=/nonexistent LC_ALL=C \
            SOURCE_SHA="${SOURCE_SHA}" \
            OUTPUT_PATH="${OUTPUT_PATH}" \
            PRODUCTION_HOST_REPO_ROOT="${GITHUB_WORKSPACE}" \
            NODE_BIN="${NODE_BIN}" \
              /bin/bash --noprofile --norc "${PRODUCER_PATH}")"
          [[ "${digest}" =~ ^[0-9a-f]{64}$ ]] || {
            echo '::error::runtime bundle producer returned an invalid digest.'
            exit 1
          }
          echo "sha256=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Assert protected SSH secret contract
        env:
          DROPLET_HOST: ${{ secrets.PRODUCTION_DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.PRODUCTION_DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.PRODUCTION_DROPLET_SSH_KEY }}
          DROPLET_SSH_FINGERPRINT: ${{ secrets.PRODUCTION_DROPLET_SSH_FINGERPRINT }}
        run: |
          set +x
          set -euo pipefail
          missing=()
          for name in DROPLET_HOST DROPLET_USER DROPLET_SSH_KEY DROPLET_SSH_FINGERPRINT; do
            [ -n "${!name:-}" ] || missing+=("${name}")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing production environment secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run release-ledger, digest, and health proof on droplet
        env:
          DROPLET_HOST: ${{ secrets.PRODUCTION_DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.PRODUCTION_DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.PRODUCTION_DROPLET_SSH_KEY }}
          DROPLET_SSH_FINGERPRINT: ${{ secrets.PRODUCTION_DROPLET_SSH_FINGERPRINT }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          EXPECTED_DEPLOYED_SHA: ${{ steps.target.outputs.expected_deployed_sha }}
          WORKFLOW_AUTHORITY_SHA: ${{ github.sha }}
          BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
          SSH_COMMAND_TIMEOUT_SECONDS: '1200'
        run: |
          set +x
          set -euo pipefail
          umask 077

          droplet_host_coordinate="${DROPLET_HOST}"
          droplet_user_coordinate="${DROPLET_USER}"
          ssh_private_key_material="${DROPLET_SSH_KEY}"
          ssh_fingerprint_material="${DROPLET_SSH_FINGERPRINT}"
          unset DROPLET_HOST DROPLET_USER DROPLET_SSH_KEY DROPLET_SSH_FINGERPRINT

          SSH_STEP_DIR="$(mktemp -d -p "${RUNNER_TEMP}" production-verify-ssh-XXXXXX)"
          cleanup() {
            status=$?
            trap - EXIT
            cleanup_status=0
            if [ -n "${SSH_PRIVATE_KEY_FD:-}" ]; then
              if [[ "${SSH_PRIVATE_KEY_FD}" =~ ^([3-9]|[1-9][0-9]{1,2})$ ]] && \
                [ -e "/proc/self/fd/${SSH_PRIVATE_KEY_FD}" ]; then
                exec {SSH_PRIVATE_KEY_FD}<&-
              else
                echo '::error::production verification SSH private-key descriptor cleanup failed.'
                cleanup_status=1
              fi
              SSH_PRIVATE_KEY_FD=
            fi
            if ! rm -rf -- "${SSH_STEP_DIR}" || [ -e "${SSH_STEP_DIR}" ]; then
              echo '::error::production verification SSH material cleanup failed.'
              cleanup_status=1
            fi
            if [ "${status}" -eq 0 ] && [ "${cleanup_status}" -ne 0 ]; then status=1; fi
            exit "${status}"
          }
          trap cleanup EXIT

          REMOTE_ENV_PATH="${SSH_STEP_DIR}/remote-env.tsv"
          REMOTE_ARGV_PATH="${SSH_STEP_DIR}/remote-argv.b64"
          REMOTE_PAYLOAD="${SSH_STEP_DIR}/payload.sh"
          REMOTE_STDOUT="${SSH_STEP_DIR}/stdout"
          PAYLOAD_PRODUCER="${SSH_STEP_DIR}/prepare-production-host-ssh-payload.sh"
          PROTECTED_SSH="${SSH_STEP_DIR}/run-protected-ssh.sh"

          assert_remote_release_authority() {
            local deployed_rows
            local remote_main_rows
            remote_main_rows="$(git ls-remote --refs origin refs/heads/main)"
            test "$(printf '%s\n' "${remote_main_rows}" | sed '/^$/d' | wc -l)" -eq 1
            test "${remote_main_rows%%$'\t'*}" = "${WORKFLOW_AUTHORITY_SHA}"
            deployed_rows="$(git ls-remote --refs origin refs/tags/deployed/production)"
            if [ "${EXPECTED_DEPLOYED_SHA}" = 0000000000000000000000000000000000000000 ]; then
              test -z "${deployed_rows}"
            else
              test "$(printf '%s\n' "${deployed_rows}" | sed '/^$/d' | wc -l)" -eq 1
              test "${deployed_rows%%$'\t'*}" = "${EXPECTED_DEPLOYED_SHA}"
            fi
          }
          assert_remote_release_authority

          materialize_exact_script() {
            local source_path="$1"
            local output_path="$2"
            /usr/bin/env -i \
              PATH=/usr/bin:/bin HOME=/nonexistent LC_ALL=C \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
              /usr/bin/git --no-replace-objects \
                -c core.hooksPath=/dev/null -c protocol.allow=never \
                -C "${GITHUB_WORKSPACE}" show \
                "${WORKFLOW_AUTHORITY_SHA}:${source_path}" > "${output_path}"
            chmod 0500 "${output_path}"
          }
          materialize_exact_script \
            tools/scripts/ci/prepare-production-host-ssh-payload.sh \
            "${PAYLOAD_PRODUCER}"
          materialize_exact_script \
            tools/scripts/ci/run-protected-ssh.sh \
            "${PROTECTED_SSH}"

          printf 'TARGET_SHA\t%s\n' "$(printf '%s' "${TARGET_SHA}" | base64 -w0)" > "${REMOTE_ENV_PATH}"
          : > "${REMOTE_ARGV_PATH}"

          /usr/bin/env -i \
            PATH=/usr/bin:/bin HOME=/nonexistent LC_ALL=C \
            PRODUCTION_HOST_BUNDLE_PATH="${RUNNER_TEMP}/production-host-runtime.tar.gz" \
            PRODUCTION_HOST_BUNDLE_SHA256="${BUNDLE_SHA256}" \
            PRODUCTION_HOST_MAIN_SHA="${TARGET_SHA}" \
            PRODUCTION_HOST_REMOTE_MODE=shared-exec \
            PRODUCTION_HOST_REMOTE_ENTRYPOINT=scripts/deploy/post-deploy-verify.sh \
            PRODUCTION_HOST_REMOTE_ENV_PATH="${REMOTE_ENV_PATH}" \
            PRODUCTION_HOST_REMOTE_ARGV_PATH="${REMOTE_ARGV_PATH}" \
            SSH_PAYLOAD_PATH="${REMOTE_PAYLOAD}" \
            PRODUCTION_HOST_REPO_ROOT="${GITHUB_WORKSPACE}" \
              /bin/bash --noprofile --norc "${PAYLOAD_PRODUCER}"

          # Close the ref-resolution gap at the last local edge before the
          # protected SSH helper can publish or execute production-host bytes.
          assert_remote_release_authority
          SSH_KEY_STAGE="${SSH_STEP_DIR}/private-key.input"
          set -o noclobber
          if ! builtin printf '%s\n' "${ssh_private_key_material}" > "${SSH_KEY_STAGE}"; then
            set +o noclobber
            exit 1
          fi
          set +o noclobber
          /usr/bin/chmod 0600 "${SSH_KEY_STAGE}"
          SSH_PRIVATE_KEY_FD=
          exec {SSH_PRIVATE_KEY_FD}< "${SSH_KEY_STAGE}"
          /usr/bin/rm -f -- "${SSH_KEY_STAGE}" {SSH_PRIVATE_KEY_FD}<&-
          [ ! -e "${SSH_KEY_STAGE}" ] && [ ! -L "${SSH_KEY_STAGE}" ]
          unset ssh_private_key_material
          /usr/bin/env -i \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME="${HOME}" \
            LC_ALL=C \
            DROPLET_HOST="${droplet_host_coordinate}" \
            DROPLET_USER="${droplet_user_coordinate}" \
            SSH_PRIVATE_KEY_FD="${SSH_PRIVATE_KEY_FD}" \
            DROPLET_SSH_FINGERPRINT="${ssh_fingerprint_material}" \
            SSH_PAYLOAD_PATH="${REMOTE_PAYLOAD}" \
            SSH_STDOUT_PATH="${REMOTE_STDOUT}" \
            SSH_COMMAND_TIMEOUT_SECONDS="${SSH_COMMAND_TIMEOUT_SECONDS}" \
              /bin/bash --noprofile --norc "${PROTECTED_SSH}"
          exec {SSH_PRIVATE_KEY_FD}<&-
          SSH_PRIVATE_KEY_FD=
          assert_remote_release_authority

          python3 -m json.tool "${REMOTE_STDOUT}" > production-post-deploy-evidence.json
          {
            echo '### Production post-deploy verification'
            echo ''
            echo "- Target SHA: \`${TARGET_SHA}\`"
            echo "- Pre-verification deployed/production: \`${EXPECTED_DEPLOYED_SHA}\`"
            echo '- Evidence artifact: `production-post-deploy-evidence`'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-post-deploy-evidence-${{ steps.target.outputs.target_sha }}
          path: production-post-deploy-evidence.json
          retention-days: 30
