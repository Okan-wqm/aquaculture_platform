[package]
name = "nats-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "async-nats factory wired for ADR-014/015 mTLS-only auth. Cert CN is the sole identity. user/pass auth is structurally absent (cannot be configured)."

[lib]
path = "src/lib.rs"

# [dependencies] intentionally empty during Faz 0 PR-A scaffold. async-nats
# 0.37 + rustls + rustls-pemfile land alongside the connection factory in
# Faz 2. (Pulling async-nats now drags rustls-webpki 0.102.8, which carries
# RUSTSEC-2026-0099 + GHSA-965h-392x-2mh5 — neither relevant until we use
# the client, but cargo-deny correctly flags any unused vulnerable dep.)

[lints]
workspace = true
