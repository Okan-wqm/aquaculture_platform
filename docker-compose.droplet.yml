# =============================================================================
# Aquaculture Platform - DigitalOcean Droplet (4 CPU / 8GB RAM)
#
# All services enabled. Total memory budget: ~7GB
#
# Usage:
#   docker compose -f docker-compose.droplet.yml pull
#   docker compose -f docker-compose.droplet.yml up -d
# =============================================================================

# SEC-013: Trust boundary — all inter-service traffic (AUTH headers, GraphQL queries,
# NATS messages) travels on the aqua-internal Docker bridge network in plain HTTP/TCP.
# aqua-internal is marked internal: true so it cannot route to the internet.
# If a container escape occurs, traffic on this network is readable by other containers.
# For stronger isolation, consider a service mesh (e.g., Traefik mTLS or Consul Connect).

# =============================================================================
# YAML anchors — shared configuration blocks
# =============================================================================
# IP-1: NATS TLS client wiring. Every backend service that connects to the
# NATS broker over tls:// must trust the self-signed "Aquaculture Internal
# CA" that signs the NATS server certificate. The CA PEM is generated by
# infrastructure/docker/scripts/generate-internal-certs.sh into
# ./certs/nats/ca-cert.pem on the host and mounted into each service at
# /etc/ssl/nats-ca.pem (read-only). The NATS_TLS_CA env var tells the
# backend-common nats-connection.factory where to find it — see the IP-1
# docblock in that file for the full incident history behind the
# hard-fail policy this wiring enforces.

# SEC-015 (CRITICAL-002): Per-service NATS credentials.
# Each service has its own NATS account with subject ACLs.
# The x-nats-env anchor is DEPRECATED — each service must set its own NATS_AUTH_USER/PASS.
# This anchor retains backward compatibility for services that haven't been migrated yet.
x-nats-env: &nats-env
  NATS_URL: tls://nats:4222
  NATS_AUTH_USER: ${NATS_AUTH_USER:-nats_internal}
  NATS_AUTH_PASS: "${NATS_AUTH_PASS:-changeme}"
  NATS_TLS_CA: /etc/ssl/nats-ca.pem
  NATS_TLS_ENABLED: "true"

# Per-service NATS credential anchors (CRITICAL-002)
x-nats-auth-env: &nats-auth-env
  NATS_URL: tls://nats:4222
  NATS_AUTH_USER: ${NATS_AUTH_SVC_USER:-${NATS_AUTH_USER:-nats_internal}}
  NATS_AUTH_PASS: "${NATS_AUTH_SVC_PASS:-${NATS_AUTH_PASS:-changeme}}"
  NATS_TLS_CA: /etc/ssl/nats-ca.pem
  NATS_TLS_ENABLED: "true"

x-nats-farm-env: &nats-farm-env
  NATS_URL: tls://nats:4222
  NATS_AUTH_USER: ${NATS_FARM_SVC_USER:-${NATS_AUTH_USER:-nats_internal}}
  NATS_AUTH_PASS: "${NATS_FARM_SVC_PASS:-${NATS_AUTH_PASS:-changeme}}"
  NATS_TLS_CA: /etc/ssl/nats-ca.pem
  NATS_TLS_ENABLED: "true"

x-nats-sensor-env: &nats-sensor-env
  NATS_URL: tls://nats:4222
  NATS_AUTH_USER: ${NATS_SENSOR_SVC_USER:-${NATS_AUTH_USER:-nats_internal}}
  NATS_AUTH_PASS: "${NATS_SENSOR_SVC_PASS:-${NATS_AUTH_PASS:-changeme}}"
  NATS_TLS_CA: /etc/ssl/nats-ca.pem
  NATS_TLS_ENABLED: "true"

x-nats-gateway-env: &nats-gateway-env
  NATS_URL: tls://nats:4222
  NATS_AUTH_USER: ${NATS_GATEWAY_SVC_USER:-${NATS_AUTH_USER:-nats_internal}}
  NATS_AUTH_PASS: "${NATS_GATEWAY_SVC_PASS:-${NATS_AUTH_PASS:-changeme}}"
  NATS_TLS_CA: /etc/ssl/nats-ca.pem
  NATS_TLS_ENABLED: "true"

x-nats-notification-env: &nats-notification-env
  NATS_URL: tls://nats:4222
  NATS_AUTH_USER: ${NATS_NOTIFICATION_SVC_USER:-${NATS_AUTH_USER:-nats_internal}}
  NATS_AUTH_PASS: "${NATS_NOTIFICATION_SVC_PASS:-${NATS_AUTH_PASS:-changeme}}"
  NATS_TLS_CA: /etc/ssl/nats-ca.pem
  NATS_TLS_ENABLED: "true"

x-nats-billing-env: &nats-billing-env
  NATS_URL: tls://nats:4222
  NATS_AUTH_USER: ${NATS_BILLING_SVC_USER:-${NATS_AUTH_USER:-nats_internal}}
  NATS_AUTH_PASS: "${NATS_BILLING_SVC_PASS:-${NATS_AUTH_PASS:-changeme}}"
  NATS_TLS_CA: /etc/ssl/nats-ca.pem
  NATS_TLS_ENABLED: "true"

x-nats-alert-env: &nats-alert-env
  NATS_URL: tls://nats:4222
  NATS_AUTH_USER: ${NATS_ALERT_SVC_USER:-${NATS_AUTH_USER:-nats_internal}}
  NATS_AUTH_PASS: "${NATS_ALERT_SVC_PASS:-${NATS_AUTH_PASS:-changeme}}"
  NATS_TLS_CA: /etc/ssl/nats-ca.pem
  NATS_TLS_ENABLED: "true"

x-nats-hr-env: &nats-hr-env
  NATS_URL: tls://nats:4222
  NATS_AUTH_USER: ${NATS_HR_SVC_USER:-${NATS_AUTH_USER:-nats_internal}}
  NATS_AUTH_PASS: "${NATS_HR_SVC_PASS:-${NATS_AUTH_PASS:-changeme}}"
  NATS_TLS_CA: /etc/ssl/nats-ca.pem
  NATS_TLS_ENABLED: "true"

x-nats-messaging-env: &nats-messaging-env
  NATS_URL: tls://nats:4222
  NATS_AUTH_USER: ${NATS_MESSAGING_SVC_USER:-${NATS_AUTH_USER:-nats_internal}}
  NATS_AUTH_PASS: "${NATS_MESSAGING_SVC_PASS:-${NATS_AUTH_PASS:-changeme}}"
  NATS_TLS_CA: /etc/ssl/nats-ca.pem
  NATS_TLS_ENABLED: "true"

x-nats-hydroponics-env: &nats-hydroponics-env
  NATS_URL: tls://nats:4222
  NATS_AUTH_USER: ${NATS_HYDROPONICS_SVC_USER:-${NATS_AUTH_USER:-nats_internal}}
  NATS_AUTH_PASS: "${NATS_HYDROPONICS_SVC_PASS:-${NATS_AUTH_PASS:-changeme}}"
  NATS_TLS_CA: /etc/ssl/nats-ca.pem
  NATS_TLS_ENABLED: "true"

x-nats-ca-mount: &nats-ca-mount ./certs/nats/ca-cert.pem:/etc/ssl/nats-ca.pem:ro
x-jwt-public-key-mount: &jwt-public-key-mount ./certs/jwt/public.pem:/etc/ssl/jwt/public.pem:ro
x-jwt-private-key-mount: &jwt-private-key-mount ./certs/jwt/private.pem:/etc/ssl/jwt/private.pem:ro

networks:
  aqua-network:
    driver: bridge
  aqua-internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:
  mosquitto_data:
  mosquitto_log:

services:
  # ===========================================================================
  # Infrastructure
  # ===========================================================================

  postgres:
    # Pinned to the exact version running on this droplet's data volume.
    # NEVER change this to a lower version — PostgreSQL will refuse to start
    # if the data was created with a newer TimescaleDB version.
    # To upgrade: pg_dump → destroy volume → start with new image → restore.
    image: timescale/timescaledb:2.25.1-pg16
    container_name: aqua-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquaculture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-aquaculture}
      POSTGRES_SHARED_BUFFERS: 512MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1536MB
      POSTGRES_WORK_MEM: 16MB
      POSTGRES_MAINTENANCE_WORK_MEM: 128MB
      # SEC-015: Per-service DB passwords (passed to 00-init-schemas.sh)
      # If not set, random passwords are generated at first init.
      AUTH_SERVICE_DB_PASS: ${AUTH_SERVICE_DB_PASS:-}
      FARM_SERVICE_DB_PASS: ${FARM_SERVICE_DB_PASS:-}
      SENSOR_SERVICE_DB_PASS: ${SENSOR_SERVICE_DB_PASS:-}
      BILLING_SERVICE_DB_PASS: ${BILLING_SERVICE_DB_PASS:-}
      HR_SERVICE_DB_PASS: ${HR_SERVICE_DB_PASS:-}
      ALERT_SERVICE_DB_PASS: ${ALERT_SERVICE_DB_PASS:-}
      ADMIN_SERVICE_DB_PASS: ${ADMIN_SERVICE_DB_PASS:-}
      GATEWAY_SERVICE_DB_PASS: ${GATEWAY_SERVICE_DB_PASS:-}
      NOTIFICATION_SERVICE_DB_PASS: ${NOTIFICATION_SERVICE_DB_PASS:-}
      HYDROPONICS_SERVICE_DB_PASS: ${HYDROPONICS_SERVICE_DB_PASS:-}
      MESSAGING_SERVICE_DB_PASS: ${MESSAGING_SERVICE_DB_PASS:-}
      # IP-1: PostgreSQL SSL — entrypoint wrapper copies certs to $PGDATA
      # with correct postgres:postgres ownership + chmod 600 on key.
      POSTGRES_SSL: "on"
    entrypoint: ["/usr/local/bin/postgres-ssl-entrypoint.sh"]
    command: >
      postgres
      -c max_connections=300
      -c search_path=public,auth,admin
      -c ssl=on
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-scripts:/docker-entrypoint-initdb.d:ro
      - ./certs/postgres:/var/lib/postgresql/ssl:ro
      - ./infrastructure/docker/scripts/postgres-ssl-entrypoint.sh:/usr/local/bin/postgres-ssl-entrypoint.sh:ro
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquaculture}"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # db-init: Idempotent role password sync (initContainer pattern)
  #
  # Runs ONCE after postgres is healthy, then exits.
  # Ensures per-service DB roles have the passwords from the current .env,
  # even when postgres was initialized with randomly-generated passwords.
  # restart: no — intentional, this is a one-shot init container.
  # ---------------------------------------------------------------------------
  db-init:
    image: timescale/timescaledb:2.25.1-pg16
    container_name: aqua-db-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-aquaculture}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-aquaculture}
      AUTH_SERVICE_DB_PASS: ${AUTH_SERVICE_DB_PASS:-}
      FARM_SERVICE_DB_PASS: ${FARM_SERVICE_DB_PASS:-}
      SENSOR_SERVICE_DB_PASS: ${SENSOR_SERVICE_DB_PASS:-}
      BILLING_SERVICE_DB_PASS: ${BILLING_SERVICE_DB_PASS:-}
      HR_SERVICE_DB_PASS: ${HR_SERVICE_DB_PASS:-}
      ALERT_SERVICE_DB_PASS: ${ALERT_SERVICE_DB_PASS:-}
      ADMIN_SERVICE_DB_PASS: ${ADMIN_SERVICE_DB_PASS:-}
      GATEWAY_SERVICE_DB_PASS: ${GATEWAY_SERVICE_DB_PASS:-}
      NOTIFICATION_SERVICE_DB_PASS: ${NOTIFICATION_SERVICE_DB_PASS:-}
      HYDROPONICS_SERVICE_DB_PASS: ${HYDROPONICS_SERVICE_DB_PASS:-}
      MESSAGING_SERVICE_DB_PASS: ${MESSAGING_SERVICE_DB_PASS:-}
    command: >
      bash -c "
        ensure_role() {
          local role=$$1 pass=$$2
          if [ -z \"$$pass\" ]; then return; fi
          if psql -tAc \"SELECT 1 FROM pg_roles WHERE rolname='$$role'\" | grep -q 1; then
            psql -c \"ALTER ROLE $$role WITH PASSWORD '$$pass'\" 2>/dev/null && echo \"[db-init] $$role password updated\"
          else
            psql -c \"CREATE ROLE $$role WITH LOGIN PASSWORD '$$pass'\" 2>/dev/null && echo \"[db-init] $$role role created\"
          fi
        }
        ensure_role auth_service      \"$$AUTH_SERVICE_DB_PASS\"
        ensure_role farm_service      \"$$FARM_SERVICE_DB_PASS\"
        ensure_role sensor_service    \"$$SENSOR_SERVICE_DB_PASS\"
        ensure_role billing_service   \"$$BILLING_SERVICE_DB_PASS\"
        ensure_role hr_service        \"$$HR_SERVICE_DB_PASS\"
        ensure_role alert_service     \"$$ALERT_SERVICE_DB_PASS\"
        ensure_role admin_service     \"$$ADMIN_SERVICE_DB_PASS\"
        ensure_role gateway_service   \"$$GATEWAY_SERVICE_DB_PASS\"
        ensure_role notification_service \"$$NOTIFICATION_SERVICE_DB_PASS\"
        ensure_role hydroponics_service  \"$$HYDROPONICS_SERVICE_DB_PASS\"
        ensure_role messaging_service    \"$$MESSAGING_SERVICE_DB_PASS\"

        echo '[db-init] Granting schema privileges to per-service roles'
        for ROLE in auth_service farm_service sensor_service billing_service hr_service alert_service admin_service gateway_service notification_service hydroponics_service messaging_service; do
          psql -c \"GRANT USAGE, CREATE ON SCHEMA public TO $$ROLE\" 2>/dev/null && echo \"  [db-init] GRANT public -> $$ROLE\" || true
        done

        echo '[db-init] Granting per-service schema privileges + ownership transfer'
        grant_service_schema() {
          local role=$$1 schema=$$2
          if psql -tAc \"SELECT 1 FROM information_schema.schemata WHERE schema_name='$$schema'\" | grep -q 1; then
            psql -c \"GRANT ALL ON SCHEMA $$schema TO $$role\" 2>/dev/null
            psql -c \"GRANT ALL ON ALL TABLES IN SCHEMA $$schema TO $$role\" 2>/dev/null
            psql -c \"GRANT ALL ON ALL SEQUENCES IN SCHEMA $$schema TO $$role\" 2>/dev/null
            psql -c \"ALTER DEFAULT PRIVILEGES IN SCHEMA $$schema GRANT ALL ON TABLES TO $$role\" 2>/dev/null
            psql -c \"ALTER DEFAULT PRIVILEGES IN SCHEMA $$schema GRANT ALL ON SEQUENCES TO $$role\" 2>/dev/null
            for TBL in $$(psql -tAc \"SELECT tablename FROM pg_tables WHERE schemaname='$$schema'\"); do
              psql -c \"ALTER TABLE $$schema.$$TBL OWNER TO $$role\" 2>/dev/null
            done
            for SEQ in $$(psql -tAc \"SELECT sequence_name FROM information_schema.sequences WHERE sequence_schema='$$schema'\"); do
              psql -c \"ALTER SEQUENCE $$schema.$$SEQ OWNER TO $$role\" 2>/dev/null
            done
            for FUNC in $$(psql -tAc \"SELECT p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')' FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid WHERE n.nspname='$$schema'\"); do
              psql -c \"ALTER FUNCTION $$schema.$$FUNC OWNER TO $$role\" 2>/dev/null
            done
            echo \"  [db-init] $$schema schema -> $$role (grants + ownership)\"
          fi
        }
        grant_service_schema auth_service      auth
        grant_service_schema farm_service      farm
        grant_service_schema sensor_service    sensor
        grant_service_schema billing_service   billing
        grant_service_schema hr_service        hr
        grant_service_schema alert_service     alert
        grant_service_schema admin_service     admin
        grant_service_schema gateway_service   gateway
        grant_service_schema notification_service notification
        grant_service_schema hydroponics_service  hydroponics
        grant_service_schema messaging_service    messaging

        echo '[db-init] Granting public schema privileges to all service roles'
        echo '[db-init] WHY: Services like notification, billing, config use public schema.'
        echo '[db-init] Shared tables (audit_logs, migrations) stay owned by superuser;'
        echo '[db-init] per-service roles get ALL PRIVILEGES for DDL+DML operations.'
        for ROLE in auth_service farm_service sensor_service billing_service hr_service alert_service admin_service gateway_service notification_service hydroponics_service messaging_service; do
          psql -c \"GRANT ALL ON ALL TABLES IN SCHEMA public TO $$ROLE\" 2>/dev/null
          psql -c \"GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO $$ROLE\" 2>/dev/null
          psql -c \"ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO $$ROLE\" 2>/dev/null
          psql -c \"ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO $$ROLE\" 2>/dev/null
        done
        echo '  [db-init] public schema -> all service roles (GRANT ALL)'

        echo '[db-init] Done'
      "
    networks:
      - aqua-internal

  redis:
    # Pinned 2026-04-05. To update: verify changelog at https://github.com/redis/redis/releases, test in staging first.
    image: redis:7-alpine
    container_name: aqua-redis
    restart: unless-stopped
    # IP-1: Redis TLS ready but disabled for phased rollout.
    # Phase 1 (current): plaintext — ensures deploy stability
    # Phase 2 (next deploy): enable TLS by mounting redis-tls.conf + certs, switching to rediss://
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required} --maxmemory 192mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  nats:
    # Pinned 2026-04-05. To update: verify changelog at https://github.com/nats-io/nats-server/releases, test in staging first.
    image: nats:2.10.24-alpine
    container_name: aqua-nats
    restart: unless-stopped
    # ARCH-010/SEC-H01: Use config file for JetStream limits + authentication.
    # CLI flags replaced with nats.conf which includes authorization{} block.
    # NATS_USER and NATS_PASS are substituted by NATS from container environment.
    command: ["--config", "/etc/nats/nats.conf"]
    environment:
      # SEC-H01/CRITICAL-002: Per-service NATS account credentials.
      # Each service has its own account with subject ACLs in nats.conf.
      # Generate with: openssl rand -base64 32
      # Fallback to shared NATS_USER/NATS_PASS for migration — legacy_shared account catches these.
      NATS_USER: ${NATS_USER:-nats_internal}
      NATS_PASS: "${NATS_PASS:-changeme}"
      # Per-service credentials (substituted into nats.conf accounts block)
      NATS_AUTH_USER: ${NATS_AUTH_SVC_USER:-${NATS_USER:-nats_internal}}
      NATS_AUTH_PASS: "${NATS_AUTH_SVC_PASS:-${NATS_PASS:-changeme}}"
      NATS_FARM_USER: ${NATS_FARM_SVC_USER:-${NATS_USER:-nats_internal}}
      NATS_FARM_PASS: "${NATS_FARM_SVC_PASS:-${NATS_PASS:-changeme}}"
      NATS_SENSOR_USER: ${NATS_SENSOR_SVC_USER:-${NATS_USER:-nats_internal}}
      NATS_SENSOR_PASS: "${NATS_SENSOR_SVC_PASS:-${NATS_PASS:-changeme}}"
      NATS_GATEWAY_USER: ${NATS_GATEWAY_SVC_USER:-${NATS_USER:-nats_internal}}
      NATS_GATEWAY_PASS: "${NATS_GATEWAY_SVC_PASS:-${NATS_PASS:-changeme}}"
      NATS_NOTIFICATION_USER: ${NATS_NOTIFICATION_SVC_USER:-${NATS_USER:-nats_internal}}
      NATS_NOTIFICATION_PASS: "${NATS_NOTIFICATION_SVC_PASS:-${NATS_PASS:-changeme}}"
      NATS_BILLING_USER: ${NATS_BILLING_SVC_USER:-${NATS_USER:-nats_internal}}
      NATS_BILLING_PASS: "${NATS_BILLING_SVC_PASS:-${NATS_PASS:-changeme}}"
      NATS_ALERT_USER: ${NATS_ALERT_SVC_USER:-${NATS_USER:-nats_internal}}
      NATS_ALERT_PASS: "${NATS_ALERT_SVC_PASS:-${NATS_PASS:-changeme}}"
      NATS_HR_USER: ${NATS_HR_SVC_USER:-${NATS_USER:-nats_internal}}
      NATS_HR_PASS: "${NATS_HR_SVC_PASS:-${NATS_PASS:-changeme}}"
      NATS_MESSAGING_USER: ${NATS_MESSAGING_SVC_USER:-${NATS_USER:-nats_internal}}
      NATS_MESSAGING_PASS: "${NATS_MESSAGING_SVC_PASS:-${NATS_PASS:-changeme}}"
      NATS_HYDROPONICS_USER: ${NATS_HYDROPONICS_SVC_USER:-${NATS_USER:-nats_internal}}
      NATS_HYDROPONICS_PASS: "${NATS_HYDROPONICS_SVC_PASS:-${NATS_PASS:-changeme}}"
    volumes:
      - nats_data:/data
      - ./infrastructure/docker/nats/nats.conf:/etc/nats/nats.conf:ro
      - ./infrastructure/docker/nats/nats-tls-enabled.conf:/etc/nats/nats-tls.conf:ro
      - ./certs/nats:/etc/nats/certs:ro
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.25'
    healthcheck:
      # SEC-H01: Use HTTP monitoring endpoint (enabled in nats.conf http_port: 8222)
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  mosquitto:
    build: ./infrastructure/mosquitto
    container_name: aqua-mosquitto
    restart: unless-stopped
    # Inject MQTT_AUTH_SECRET into mosquitto config at startup (replaces placeholder)
    entrypoint: ["/bin/sh", "-c", "sed -i \"s|__MQTT_AUTH_SECRET__|$MQTT_AUTH_SECRET|g\" /mosquitto/config/mosquitto.conf && exec mosquitto -c /mosquitto/config/mosquitto.conf"]
    environment:
      MQTT_AUTH_SECRET: ${MQTT_AUTH_SECRET:?MQTT_AUTH_SECRET required}
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.15'
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  minio:
    # Pinned 2026-04-05. To update: verify changelog at https://github.com/minio/minio/releases, test in staging first.
    image: quay.io/minio/minio:RELEASE.2025-04-03T14-56-28Z
    container_name: aqua-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?MINIO_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
    volumes:
      - minio_data:/data
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Backend Services
  # ===========================================================================

  gateway-api:
    image: ghcr.io/okan-wqm/aquaculture_platform/gateway-api:${TAG:-latest}
    container_name: aqua-gateway
    restart: unless-stopped
    environment:
      SERVICE_NAME: gateway-api
      NODE_ENV: production
      GATEWAY_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=384'
      # M-RL-01: Redis-backed rate limiting — prevents multi-replica bypass
      RATE_LIMIT_USE_REDIS: "true"
      DATABASE_HOST: postgres
      DATABASE_SSL: "true"
      DATABASE_SSL_REJECT_UNAUTHORIZED: "false"
      DATABASE_PORT: 5432
      # SEC-015 (CRITICAL-001): Per-service DB role — gateway_service can only access gateway schema
      DATABASE_USER: ${GATEWAY_SERVICE_DB_USER:-gateway_service}
      DATABASE_PASSWORD: ${GATEWAY_SERVICE_DB_PASS:-${POSTGRES_PASSWORD:-changeme}}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # SEC-015 (CRITICAL-002): Per-service NATS credentials
      <<: *nats-gateway-env
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_PUBLIC_KEY_PATH: /etc/ssl/jwt/public.pem
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      AUTH_SERVICE_URL: http://auth-service:3000/graphql
      FARM_SERVICE_URL: http://farm-service:3000/graphql
      SENSOR_SERVICE_URL: http://sensor-service:3000/graphql
      ALERT_SERVICE_URL: http://alert-engine:3000/graphql
      HR_SERVICE_URL: http://hr-service:3000/graphql
      BILLING_SERVICE_URL: http://billing-service:3000/graphql
      NOTIFICATION_SERVICE_URL: http://notification-service:3000/graphql
      HYDROPONICS_SERVICE_URL: http://hydroponics-service:3000/graphql
      ADMIN_SERVICE_URL: http://admin-api-service:3000/graphql
      CONFIG_SERVICE_URL: http://config-service:3000/graphql
      MESSAGING_SERVICE_URL: http://messaging-service:3000/graphql
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_USER:?MINIO_USER is required}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-aquaculture}
      MINIO_REGION: us-east-1
      TRUST_PROXY: "1"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      WS_CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      THROTTLE_DEFAULT_LIMIT: 500
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET required}
      DATABASE_SYNC: "false" # ARCH-DB-001: Production'da synchronize kapalı, migration kullanılmalı
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      # ARCH-GW-002: All subgraph dependencies use service_started (not service_healthy).
      #
      # WHY: Gateway has RetryableIntrospectAndCompose with 12 attempts and ~36s budget.
      # It already handles subgraphs that aren't ready yet by retrying composition.
      # Using service_healthy here creates a fragile dependency chain:
      #   messaging unhealthy → gateway can't start → nginx can't start → entire platform down
      # With service_started, gateway starts immediately and retries composition until
      # all subgraphs are available. If a subgraph never comes up, gateway logs the error
      # and the health check reports degraded — but nginx and other services stay up.
      auth-service:
        condition: service_started
      farm-service:
        condition: service_started
      sensor-service:
        condition: service_started
      alert-engine:
        condition: service_started
      billing-service:
        condition: service_started
      hr-service:
        condition: service_started
      hydroponics-service:
        condition: service_started
      config-service:
        condition: service_started
      notification-service:
        condition: service_started
      messaging-service:
        condition: service_started
      admin-api-service:
        condition: service_started
      observability-service:
        condition: service_started
    volumes:
      - *nats-ca-mount
      - *jwt-public-key-mount
    networks:
      - aqua-network
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

