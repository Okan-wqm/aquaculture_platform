# Finding-ID Aliases — historical trailer ids the ledger records under another id
#
# A `Closes:` trailer is immutable once merged: amending it means rewriting published
# history, which the force-push ban forbids. When an integration registers a branch's
# findings under different ids than its commits name, the trailer and the ledger
# disagree forever. This sidecar records the mapping so every id-resolving gate
# (commit-msg validator, close ceremony, closure derivation) reads the SAME answer.
#
# Not an exemption list: an alias resolves ONLY to a canonical id that exists in
# findings.jsonl, and tests/invariants/finding-id-aliases.spec.ts fails the build if
# it does not. An id with neither a ledger row nor an alias still fails, as before.
#
# Consumers: tools/gates/finding-id-aliases.ts

version: 1

aliases:
  - alias: PR935-HIGH-001
    canonical: EDGE-HIGH-029
    review_file: docs/reviews/edge-expert/2026-07-12-pr935-e2e-review.md
    commits:
      - 'eebc38460'
    effective_date: '2026-09-05'
    reason: >
      Raised as PR935-HIGH-001 in the PR #935 end-to-end review and fixed on that branch. The
      ledger schema admits no PR-numbered id prefix, so the integration registered the
      finding as EDGE-HIGH-029; the merged commits still name the review-document id.
