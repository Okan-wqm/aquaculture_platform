<!DOCTYPE html>
<html lang="tr">
<head>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com; connect-src 'self' ws: wss:; img-src 'self' data:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none';" />

  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    /* Kiosk fullscreen styles */
    .scada-container {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
    }
    .scada-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      height: 48px; min-height: 48px;
    }
    .scada-header-title {
      font-size: 16px; font-weight: 600; color: #f1f5f9;
    }
    .scada-header-status {
      display: flex; align-items: center; gap: 8px; font-size: 13px;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      display: inline-block;
    }
    .status-dot.connected { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .status-dot.connecting { background: #eab308; animation: pulse 1.5s infinite; }
    .status-dot.disconnected { background: #ef4444; }
    .scada-canvas {
      flex: 1; position: relative;
    }
    /* ReactFlow overrides for dark theme */
    .react-flow__background { background: #0f172a !important; }
    .react-flow__controls { box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .react-flow__controls-button { background: #1e293b; border-color: #475569; color: #e2e8f0; }
    .react-flow__controls-button:hover { background: #334155; }
    .react-flow__minimap { background: #1e293b; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    /* Node styles */
    .react-flow__node-scadaEquipment,
    .react-flow__node-equipment,
    .react-flow__node-blower,
    .react-flow__node-drumFilter,
    .react-flow__node-uvUnit,
    .react-flow__node-radialSettler,
    .react-flow__node-fishTank,
    .react-flow__node-connectionPoint,
    .react-flow__node-tankInlet {
      padding: 0; border-radius: 8px;
      background: #1e293b; border: 1px solid #334155;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      color: #e2e8f0;
    }
    .react-flow__node-algaeBagRed,
    .react-flow__node-algaeBagGreen,
    .react-flow__node-algaeBagYellow,
    .react-flow__node-demandFeeder,
    .react-flow__node-automaticFeeder {
      padding: 0; background: transparent; border: none; box-shadow: none;
    }
    .react-flow__node-connectionPoint { border-radius: 50%; }
    .react-flow__handle {
      width: 10px; height: 10px;
      background: #1e293b; border: 2px solid #60a5fa;
    }
    .react-flow__edge-path { stroke-width: 2; }
    .sensor-badge {
      display: inline-flex; align-items: center; gap: 2px;
      padding: 2px 6px; border-radius: 4px;
      font-size: 10px; font-weight: 600;
    }
    .sensor-badge.normal { background: #14532d; color: #86efac; border: 1px solid #22c55e; }
    .sensor-badge.warning { background: #713f12; color: #fde047; border: 1px solid #eab308; }
    .sensor-badge.critical { background: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; }
    .sensor-badge.offline { background: #1e293b; color: #64748b; border: 1px solid #475569; }
    .scada-node-wrapper { position: relative; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.15); }
    }
    .clock { font-size: 13px; color: #94a3b8; font-variant-numeric: tabular-nums; }

    /* Waiting screen styles */
    .waiting-screen {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0f172a; position: relative; overflow: hidden;
    }
    .waiting-screen::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 50%, rgba(59,130,246,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .waiting-content {
      display: flex; flex-direction: column; align-items: center;
      gap: 32px; z-index: 1; text-align: center; padding: 24px;
    }
    .waiting-icon {
      width: 80px; height: 80px; border-radius: 20px;
      background: linear-gradient(135deg, #1e3a5f 0%, #1e293b 100%);
      border: 1px solid #334155;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    .waiting-icon svg { width: 40px; height: 40px; color: #3b82f6; }
    .waiting-spinner {
      width: 48px; height: 48px; border-radius: 50%;
      border: 3px solid #1e293b;
      border-top-color: #3b82f6;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .waiting-title {
      font-size: 22px; font-weight: 600; color: #f1f5f9;
      letter-spacing: -0.01em;
    }
    .waiting-subtitle {
      font-size: 14px; color: #64748b; max-width: 380px;
      line-height: 1.5;
    }
    .waiting-device-info {
      display: flex; flex-wrap: wrap; gap: 12px;
      justify-content: center; margin-top: 8px;
    }
    .waiting-device-chip {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 8px;
      background: #1e293b; border: 1px solid #334155;
      font-size: 13px; color: #94a3b8;
    }
    .waiting-device-chip .chip-label { color: #64748b; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
    .waiting-device-chip .chip-value { color: #e2e8f0; font-weight: 500; }
    .ws-status-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: 8px;
      background: #1e293b; border: 1px solid #334155;
      font-size: 13px;
    }
    .ws-status-bar .status-dot { width: 8px; height: 8px; }
    .ws-status-bar.ws-connected { border-color: rgba(34,197,94,0.3); }
    .ws-status-bar.ws-connecting { border-color: rgba(234,179,8,0.3); }
    .ws-status-bar.ws-disconnected { border-color: rgba(239,68,68,0.3); }
    /* Portrait orientation warning overlay */
    @media (orientation: portrait) {
      .scada-container::after {
        content: 'Lutfen cihazi yatay konuma cevirin';
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #0f172a; color: #94a3b8;
        font-size: 18px; text-align: center; padding: 24px;
      }
    }
    /* Larger touch targets for ReactFlow controls */
    .react-flow__controls-button {
      width: 48px !important; height: 48px !important;
      font-size: 18px !important;
    }
    /* Responsive sensor badge font */
    .sensor-badge { font-size: 12px; }
    /* Hide MiniMap on small screens */
    @media (max-width: 600px) {
      .react-flow__minimap { display: none !important; }
    }
    /* iOS safe area insets */
    .scada-header {
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }
    .scada-container {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/javascript">
    const { createElement: h, useState, useCallback, useRef, useEffect, useMemo } = React;
    const { createRoot } = ReactDOM;
    const {
      ReactFlow, ReactFlowProvider, useNodesState, useEdgesState,
      Controls, Background, MiniMap, Handle, Position, MarkerType,
    } = window.ReactFlow;

    // ============================================
    // WebSocket Connection Manager
    // ============================================
    const MAX_RECONNECT_ATTEMPTS = 15;
    const BASE_RECONNECT_DELAY = 3000;

    function useScadaWebSocket(url) {
      const [status, setStatus] = useState('disconnected');
      const wsRef = useRef(null);
      const [lastMessage, setLastMessage] = useState(null);
      const reconnectTimer = useRef(null);
      const retryCount = useRef(0);

      const connect = useCallback(() => {
        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) return;

        if (retryCount.current >= MAX_RECONNECT_ATTEMPTS) {
          console.error('[scada-edge] Max reconnect attempts reached (' + MAX_RECONNECT_ATTEMPTS + ')');
          setStatus('failed');
          return;
        }

        setStatus('connecting');
        const ws = new WebSocket(url);
        wsRef.current = ws;

        ws.onopen = () => {
          console.log('[scada-edge] WebSocket connected');
          setStatus('connected');
          retryCount.current = 0;
        };

        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            setLastMessage(msg);
          } catch (e) {
            console.warn('[scada-edge] Invalid WS message:', e);
          }
        };

        ws.onclose = () => {
          setStatus('disconnected');
          wsRef.current = null;
          var delay = Math.min(BASE_RECONNECT_DELAY * Math.pow(1.5, retryCount.current), 30000);
          retryCount.current++;
          console.log('[scada-edge] WebSocket disconnected, retry ' + retryCount.current + '/' + MAX_RECONNECT_ATTEMPTS + ' in ' + Math.round(delay) + 'ms');
          reconnectTimer.current = setTimeout(connect, delay);
        };

        ws.onerror = (err) => {
          console.error('[scada-edge] WebSocket error:', err);
          ws.close();
        };
      }, [url]);

      const reconnect = useCallback(() => {
        retryCount.current = 0;
        if (reconnectTimer.current) clearTimeout(reconnectTimer.current);
        if (wsRef.current) wsRef.current.close();
        connect();
      }, [connect]);

      useEffect(() => {
        connect();
        return () => {
          if (reconnectTimer.current) clearTimeout(reconnectTimer.current);
          if (wsRef.current) wsRef.current.close();
        };
      }, [connect]);

      return { status, lastMessage, reconnect };
    }

    // ============================================
    // Sensor data store (mutable, shared)
    // ============================================
    let sensorDataStore = {};

    // Status helpers
    const getStatusColor = (status) => {
      if (status === 'operational' || status === 'active') return '#22c55e';
      if (status === 'maintenance') return '#eab308';
      if (status === 'out_of_service') return '#ef4444';
      return '#94a3b8';
    };
    const getSensorStatusColor = (status) => {
      if (status === 'normal') return 'normal';
      if (status === 'warning') return 'warning';
      if (status === 'critical') return 'critical';
      return 'offline';
    };

    // ============================================
    // Generic SCADA Equipment Node
    // ============================================
    function ScadaEquipmentNode({ data }) {
      const equipmentId = data?.equipmentId || data?.id;
      const sensors = equipmentId ? (sensorDataStore[equipmentId] || []) : [];
      const statusColor = getStatusColor(data?.status);

      return h('div', {
        style: {
          padding: '8px 12px', minWidth: 120, position: 'relative',
          background: '#1e293b', borderRadius: 8
        }
      }, [
        h(Handle, { key: 'target', type: 'target', position: Position.Left }),
        h(Handle, { key: 'source', type: 'source', position: Position.Right }),
        h('div', {
          key: 'header',
          style: { display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4 }
        }, [
          h('div', {
            key: 'status-dot',
            style: {
              width: 8, height: 8, borderRadius: '50%',
              background: statusColor, flexShrink: 0
            }
          }),
          h('div', {
            key: 'label',
            style: { fontSize: 12, fontWeight: 600, color: '#f1f5f9' }
          }, data?.label || 'Equipment'),
        ]),
        sensors.length > 0 && h('div', {
          key: 'sensors',
          style: { display: 'flex', flexDirection: 'column', gap: 2, marginTop: 4 }
        }, sensors.slice(0, 4).map((s, i) =>
          h('span', {
            key: i,
            className: 'sensor-badge ' + getSensorStatusColor(s.status),
          }, s.value.toFixed(1) + ' ' + s.unit)
        ))
      ]);
    }

    // ============================================
    // SCADA Node Wrapper — adds sensor overlay to any base node
    // ============================================
    function createScadaNode(BaseNodeComponent) {
      return function ScadaWrapper(props) {
        const { data } = props;
        const equipmentId = data?.equipmentId;
        const sensors = equipmentId ? (sensorDataStore[equipmentId] || []) : [];
        const hasAlerts = sensors.some(s => s.status === 'warning' || s.status === 'critical');
        const scadaProps = { ...props, data: { ...props.data, isScadaMode: true } };

        return h('div', { className: 'scada-node-wrapper', style: { position: 'relative' } }, [
          h(BaseNodeComponent, { ...scadaProps, key: 'base' }),
          sensors.length > 0 && h('div', {
            key: 'overlay',
            style: {
              position: 'absolute', top: -8, right: -8, zIndex: 20,
              display: 'flex', flexDirection: 'column', gap: 2, alignItems: 'flex-end'
            }
          }, sensors.slice(0, 3).map((s, i) =>
            h('span', { key: i, className: 'sensor-badge ' + getSensorStatusColor(s.status) },
              s.value.toFixed(1) + ' ' + s.unit
            )
          )),
          hasAlerts && h('div', {
            key: 'alert',
            style: {
              position: 'absolute', top: -4, left: -4, width: 12, height: 12,
              borderRadius: '50%',
              background: sensors.some(s => s.status === 'critical') ? '#ef4444' : '#eab308',
              animation: 'pulse 1.5s infinite', zIndex: 20
            }
          })
        ]);
      };
    }

    // ============================================
    // Node types — use UMD bundle if available, fallback to generic
    // ============================================
    const AQ = window.AquacultureNodes || {};
    const hasBundle = !!AQ.EquipmentNode;

    if (!hasBundle) {
      console.warn('[scada-edge] UMD bundle yuklenemedi. P&ID sembolizm devre disi, fallback generic node kullaniliyor.');
    }

    const nodeTypes = hasBundle ? {
      scadaEquipment: ScadaEquipmentNode,
      equipment: createScadaNode(AQ.EquipmentNode),
      blower: createScadaNode(AQ.BlowerNode),
      drumFilter: createScadaNode(AQ.DrumFilterNode),
      uvUnit: createScadaNode(AQ.UVUnitNode),
      radialSettler: createScadaNode(AQ.RadialSettlerNode),
      fishTank: createScadaNode(AQ.FishTankNode),
      connectionPoint: AQ.ConnectionPointNode,
      tankInlet: AQ.TankInletNode,
      sensor: AQ.SensorNode,
      chartWidget: AQ.ChartWidgetNode ? createScadaNode(AQ.ChartWidgetNode) : undefined,
      algaeBagRed: AQ.AlgaeBagNode,
      algaeBagGreen: AQ.AlgaeBagNode,
      algaeBagYellow: AQ.AlgaeBagNode,
      demandFeeder: createScadaNode(AQ.DemandFeederNode),
      automaticFeeder: createScadaNode(AQ.AutomaticFeederNode),
      pump: createScadaNode(AQ.PumpNode),
      valve: createScadaNode(AQ.ValveNode),
      heater: createScadaNode(AQ.HeaterNode),
      dosingPump: createScadaNode(AQ.DosingPumpNode),
      ultrafiltration: createScadaNode(AQ.UltrafiltrationNode),
      dualDrainTank: createScadaNode(AQ.DualDrainTankNode),
      cleanWaterTank: createScadaNode(AQ.CleanWaterTankNode),
      dirtyWaterTank: createScadaNode(AQ.DirtyWaterTankNode),
      waterSupply: createScadaNode(AQ.WaterSupplyNode),
      waterDischarge: createScadaNode(AQ.WaterDischargeNode),
      mbbr: createScadaNode(AQ.MBBRNode),
      hepaFilter: createScadaNode(AQ.HEPAFilterNode),
      shellAndTubeHeatExchanger: createScadaNode(AQ.ShellTubeHeatExchangerNode),
      plateHeatExchanger: createScadaNode(AQ.PlateHeatExchangerNode),
      chiller: createScadaNode(AQ.ChillerNode),
      gasGenerator: createScadaNode(AQ.GasGeneratorNode),
      dieselGenerator: createScadaNode(AQ.DieselGeneratorNode),
      ozoneGenerator: createScadaNode(AQ.OzoneGeneratorNode),
      oxygenGenerator: createScadaNode(AQ.OxygenGeneratorNode),
    } : {
      scadaEquipment: ScadaEquipmentNode,
    };

    // Proxy fallback for unknown node types
    const safeNodeTypes = typeof Proxy !== 'undefined' ? new Proxy(nodeTypes, {
      get: function(target, prop) {
        if (prop in target) return target[prop];
        if (typeof prop === 'string' && prop !== 'then' && prop !== 'toJSON' && !prop.startsWith('$$')) {
          console.warn('[scada-edge] Unknown node type: ' + prop + ', using fallback');
          return ScadaEquipmentNode;
        }
        return undefined;
      }
    }) : nodeTypes;

    const edgeTypes = AQ.edgeTypes || {};
    const getEdgeStyle = AQ.getEdgeStyle || (() => ({ stroke: '#475569', strokeWidth: 2 }));

    // ============================================
    // Clock Component
    // ============================================
    function Clock() {
      const [time, setTime] = useState(new Date());
      useEffect(() => {
        const id = setInterval(() => setTime(new Date()), 1000);
        return () => clearInterval(id);
      }, []);
      return h('span', { className: 'clock' }, time.toLocaleTimeString());
    }

    // ============================================
    // Waiting Screen Component
    // ============================================
    function WaitingScreen({ status, deviceInfo, reconnect }) {
      const statusLabel = status === 'connected' ? 'Bagli' : status === 'connecting' ? 'Baglaniyor...' : status === 'failed' ? 'Baglanti Basarisiz' : 'Bagli Degil';
      const wsClass = 'ws-' + status;

      const scadaIcon = h('svg', {
        viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.5,
        strokeLinecap: 'round', strokeLinejoin: 'round'
      }, [
        h('rect', { key: '1', x: 2, y: 3, width: 20, height: 14, rx: 2 }),
        h('line', { key: '2', x1: 8, y1: 21, x2: 16, y2: 21 }),
        h('line', { key: '3', x1: 12, y1: 17, x2: 12, y2: 21 }),
        h('path', { key: '4', d: 'M7 8h2v4H7zM11 9h2v3h-2zM15 7h2v5h-2z' }),
      ]);

      return h('div', { className: 'waiting-screen' }, [
        h('div', { key: 'content', className: 'waiting-content' }, [
          h('div', { key: 'icon', className: 'waiting-icon' }, scadaIcon),
          h('div', { key: 'spinner', className: 'waiting-spinner' }),
          h('div', { key: 'title', className: 'waiting-title' },
            status === 'failed' ? 'Baglanti kurulamadi' : status !== 'connected' ? 'Sunucuya baglaniliyor...' : 'Proses bekleniyor...'
          ),
          h('div', { key: 'subtitle', className: 'waiting-subtitle' },
            status === 'failed'
              ? 'Sunucu erisilemiyor. Lütfen baglantıyı kontrol edin.'
              : status !== 'connected'
                ? 'SCADA edge agent sunucusuna baglantiyi bekliyor.'
                : 'Cloud panelden bu cihaza proses deploy edin.'
          ),
          // Device info chips
          deviceInfo && h('div', { key: 'device', className: 'waiting-device-info' }, [
            deviceInfo.hostname && h('div', { key: 'host', className: 'waiting-device-chip' }, [
              h('span', { key: 'l', className: 'chip-label' }, 'Cihaz'),
              h('span', { key: 'v', className: 'chip-value' }, deviceInfo.hostname),
            ]),
            deviceInfo.ip && h('div', { key: 'ip', className: 'waiting-device-chip' }, [
              h('span', { key: 'l', className: 'chip-label' }, 'IP'),
              h('span', { key: 'v', className: 'chip-value' }, deviceInfo.ip),
            ]),
            deviceInfo.agentVersion && h('div', { key: 'ver', className: 'waiting-device-chip' }, [
              h('span', { key: 'l', className: 'chip-label' }, 'Agent'),
              h('span', { key: 'v', className: 'chip-value' }, 'v' + deviceInfo.agentVersion),
            ]),
          ]),
          // WebSocket status bar
          h('div', { key: 'ws', className: 'ws-status-bar ' + wsClass }, [
            h('span', { key: 'dot', className: 'status-dot ' + status }),
            h('span', { key: 'label', style: { color: status === 'connected' ? '#86efac' : status === 'connecting' ? '#fde047' : '#fca5a5' } }, statusLabel),
          ]),
          // Reconnect button when failed
          status === 'failed' && h('button', {
            key: 'retry',
            onClick: reconnect,
            style: {
              marginTop: 16, padding: '10px 24px', borderRadius: 8,
              background: '#3b82f6', color: '#fff', border: 'none',
              fontSize: 14, fontWeight: 600, cursor: 'pointer'
            }
          }, 'Yeniden Baglan')
        ]),
      ]);
    }

    // ============================================
    // Main App
    // ============================================
    function ScadaEdgeApp() {
      const wsUrl = 'ws://' + window.location.host + '/ws/scada';
      const { status, lastMessage, reconnect } = useScadaWebSocket(wsUrl);
      const [nodes, setNodes, onNodesChange] = useNodesState([]);
      const [edges, setEdges, onEdgesChange] = useEdgesState([]);
      const [processName, setProcessName] = useState('');
      const [hasProcess, setHasProcess] = useState(false);
      const [deviceInfo, setDeviceInfo] = useState(null);
      const [reactFlowInstance, setReactFlowInstance] = useState(null);
      const [, forceUpdate] = useState(0);

      // Handle incoming WebSocket messages
      useEffect(() => {
        if (!lastMessage) return;
        const { type, data } = lastMessage;

        if (type === 'deviceInfo' && data) {
          setDeviceInfo(data);
        }

        if (type === 'setProcess' && data) {
          sensorDataStore = {};
          setHasProcess(true);
          setProcessName(data.name || 'SCADA');
          const processedNodes = (data.nodes || [])
            .filter(n => n && n.id)
            .map(n => ({
              ...n,
              position: { x: n.position?.x ?? 0, y: n.position?.y ?? 0 },
              data: { ...n.data, isScadaMode: true }
            }));
          setNodes(processedNodes);

          const processedEdges = (data.edges || []).map(e => ({
            ...e,
            type: e.type || 'orthogonal',
            markerEnd: e.markerEnd || { type: MarkerType.ArrowClosed, width: 20, height: 20, color: '#64748b' },
            style: getEdgeStyle(e.data?.connectionType || 'process-pipe'),
            data: { connectionType: 'process-pipe', midX1: null, midY: null, midX2: null, ...(e.data || {}) }
          }));
          setEdges(processedEdges);

          setTimeout(() => {
            if (reactFlowInstance) {
              try { reactFlowInstance.fitView({ padding: 0.15 }); } catch(e) { console.warn('[scada-edge] fitView failed:', e); }
            }
          }, 150);
        }

        if (type === 'sensorData' && data && data.equipmentData) {
          // Update sensor data store
          Object.entries(data.equipmentData).forEach(([eqId, readings]) => {
            sensorDataStore[eqId] = readings;
          });
          forceUpdate(n => n + 1);
        }
      }, [lastMessage, reactFlowInstance, setNodes, setEdges]);

      // Fit view on init
      useEffect(() => {
        if (reactFlowInstance && nodes.length > 0) {
          setTimeout(() => {
            try { reactFlowInstance.fitView({ padding: 0.15 }); } catch(e) { console.warn('[scada-edge] fitView failed:', e); }
          }, 200);
        }
      }, [reactFlowInstance]);

      const statusLabel = status === 'connected' ? 'Bagli' : status === 'connecting' ? 'Baglaniyor...' : 'Bagli Degil';
      const showWaiting = !hasProcess;

      return h('div', { className: 'scada-container' }, [
        // Header bar
        h('div', { key: 'header', className: 'scada-header' }, [
          h('div', { key: 'title', className: 'scada-header-title' },
            processName || 'SCADA Edge Display'
          ),
          h('div', { key: 'status', className: 'scada-header-status' }, [
            h(Clock, { key: 'clock' }),
            h('span', { key: 'sep', style: { color: '#475569' } }, '|'),
            h('span', { key: 'dot', className: 'status-dot ' + status }),
            h('span', { key: 'label', style: { color: status === 'connected' ? '#86efac' : '#94a3b8' } }, statusLabel),
          ])
        ]),
        // Waiting screen or SCADA canvas
        showWaiting
          ? h(WaitingScreen, { key: 'waiting', status, deviceInfo, reconnect })
          : h('div', { key: 'canvas', className: 'scada-canvas' },
              h(ReactFlow, {
                nodes, edges,
                onNodesChange, onEdgesChange,
                onInit: setReactFlowInstance,
                nodeTypes: safeNodeTypes,
                edgeTypes,
                defaultEdgeOptions: { type: 'orthogonal', markerEnd: { type: MarkerType.ArrowClosed }, style: getEdgeStyle('process-pipe') },
                nodesDraggable: false, nodesConnectable: false,
                elementsSelectable: false,
                panOnDrag: true, zoomOnScroll: true, zoomOnPinch: true,
                fitView: true, fitViewOptions: { padding: 0.15 },
                minZoom: 0.1, maxZoom: 3,
              }, [
                h(Controls, { key: 'ctrl', position: 'bottom-left', showInteractive: false }),
                h(MiniMap, {
                  key: 'mm', position: 'bottom-right',
                  nodeColor: (n) => getStatusColor(n.data?.status),
                  maskColor: 'rgba(0,0,0,0.3)',
                  style: { width: 150, height: 100, background: '#1e293b' }
                }),
                h(Background, { key: 'bg', variant: 'dots', gap: 24, size: 1, color: '#1e293b' })
              ])
            )
      ]);
    }

    // Render
    const root = createRoot(document.getElementById('root'));
    root.render(h(ReactFlowProvider, null, h(ScadaEdgeApp)));

    // Register PWA service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function(err) {
        console.warn('[scada-edge] Service Worker registration failed:', err);
      });
    }
  </script>
</body>
</html>
