# =============================================================================
# Aquaculture Platform - ConfigMaps
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: aquaculture-config
  namespace: aquaculture
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  NATS_URL: "nats://nats:4222"
  # Farm monitoring remains disabled until the operator supplies the company
  # MET identity and explicitly enables it.
  FARM_ENVIRONMENT_MONITORING_ENABLED: "false"
  MET_NORWAY_APPLICATION_NAME: ""
  MET_NORWAY_CONTACT: ""
  MET_NORWAY_FROST_CLIENT_ID: ""

---
# ARCH-008: frontend-config uses externally reachable HTTPS URLs for module federation.
# These values are consumed by browser JavaScript (shell app runtime config).
# Internal cluster DNS names (http://dashboard, etc.) are NOT reachable from browsers.
# Override per environment in overlays (e.g., dev uses dev.aquaculture.example.com).
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: aquaculture
data:
  # Externally reachable module federation remote entry points
  # served via the aquaculture-mf-ingress over HTTPS
  DASHBOARD_URL: "https://mf.aquaculture.example.com/dashboard"
  FARM_MODULE_URL: "https://mf.aquaculture.example.com/farm-module"
  PROCESS_EDITOR_URL: "https://mf.aquaculture.example.com/process-editor"
  ADMIN_PANEL_URL: "https://mf.aquaculture.example.com/admin-panel"
