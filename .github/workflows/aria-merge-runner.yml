name: aria-merge-runner

# ARIA-HIGH-198 — the merge lane runs where it can attest what it is.
# verify_runner_attestation is mandatory at merge, and since the attestation
# measures the runner's identity from RUNNER_ENVIRONMENT, the persistent
# self-hosted host that ran merges inside aria-auto-cycle can never attest
# ephemeral: every merge it attempted was refused by construction. This lane
# runs the SAME auto-merge runner and merge authority
# (`aria_kernel merge-lane run`) on a GitHub-hosted runner, which is ephemeral
# and in the approved group by measurement, and which runs no model and no
# agent code (`lane: merge` ⇒ claude_auth not_required, no sandbox needed).
#
# It fires after aria-readiness-claim completes, so the claim it consumes was
# independently produced by another lane at another time.
#
# ARIA-HIGH-206 — it also re-evaluates when `CI - Affected` (ci-affected.yml)
# completes green for a pull request, and hourly. Three of the four required
# checks come from that heavier workflow and routinely finish AFTER the claim;
# the required-checks gate then saw them missing and nothing ran the lane
# again. Re-running is safe by construction: only a PR holding a readiness
# claim is considered, and the merge carries `--match-head-commit`, so a
# repeat evaluation merges at most the head that was claimed.
#
# THE MERGE CREDENTIAL IS THE GITHUB APP INSTALLATION TOKEN, never
# GITHUB_TOKEN: a merge made with GITHUB_TOKEN triggers no push workflows on
# main, which would blind the post-merge monitoring that attributes a red main
# to the merge that caused it. ARIA_REQUIRE_MODE_A makes the mint fail loudly
# instead of falling back to a PAT (docs/runbooks/aria-github-app-setup.md).

on:
  workflow_run:
    # 'CI - Affected' is ci-affected.yml's `name:` — workflow_run matches on
    # it (pinned against that file by test_readiness_claim_lane.py).
    workflows: ['aria-readiness-claim', 'CI - Affected']
    types: [completed]
  schedule:
    # Hourly backstop for a check that turns green with no workflow_run to
    # announce it (a re-run, an external status). Off the top of the hour.
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          Merge only this PR (it must hold a readiness claim). Empty: every
          PR holding a readiness claim.
        required: false
        default: ''

permissions:
  # Same transport as aria-readiness-claim: append-only FF push to aria/state.
  # The merge itself uses the App installation token, not this one.
  contents: write
  actions: read
  # ARIA-HIGH-220 — the job's OIDC token IS the lane's identity: the kernel
  # requests it, verifies it against GitHub's signing keys, and merges only
  # when it names this run and this workflow as it is on main
  # (runner_attestation.measure_merge_lane_identity). Without it the lane
  # evaluates and merges nothing.
  id-token: write

concurrency:
  group: aria-merge-runner
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A red or cancelled upstream run, and a CI run of a push to main or of
    # a merge-group build (no PR to merge), start no job.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.name == 'aria-readiness-claim' ||
        (github.event.workflow_run.name == 'CI - Affected' &&
         github.event.workflow_run.event == 'pull_request')))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          # A kernel workspace is a whole clone: the kernel reads this
          # checkout's history (twin churn/co-change, anchor existence) and
          # refuses a shallow one by name. Pinned on every kernel lane by
          # aria-kernel/tests/invariants/test_kernel_lanes_check_out_full_history.py;
          # aria-auto-cycle.yml carries the full account.
          fetch-depth: 0
      - uses: ./.github/actions/setup-aria-kernel

      # ARIA-HIGH-217 — the pre-merge perimeter is evaluated on the PR head:
      # a worktree of this checkout, with `main` moved to the implementation
      # base for the span of the evaluation and restored after it. Git will
      # not move a branch a worktree stands on, so the checkout lets go of
      # main (merge_lane_workspace.pr_head_workspace refuses by name
      # otherwise).
      - name: Detach the checkout from main
        run: git checkout --quiet --detach

      - name: Persist enterprise workflow preflight
        env:
          PYTHONPATH: aria-kernel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          from aria_kernel.preflight import verify_workflow_preflight

          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          allowed = [".aria-state-store"]
          verdict = verify_workflow_preflight(
              workflow_id="aria-merge-runner",
              job_id="merge",
              profile="standard",
              workspace_root=os.environ["GITHUB_WORKSPACE"],
              allowed_write_roots=allowed,
              path_allowlist=allowed,
              network_policy=["github_api", "github_artifact", "github_git"],
              network_enforcement_evidence=(
                  "PR/check/merge calls over the GitHub API with the App "
                  "installation token; aria/state fetch+push over the "
                  "repository remote"
              ),
              token_provenance="github_app:installation",
              require_github_app=True,
              dlp_mode="fail_closed",
              dlp_scan_clean=True,
              audit_reason="merge PRs holding a readiness claim from an attestable host",
              audit_artifact_path=runner_temp / "aria-merge-runner-preflight.json",
              external_root_allowlist=[str(runner_temp)],
          )
          if not verdict.valid:
              raise SystemExit(";".join(verdict.reasons))
          PY

      - name: Restore ARIA state from the aria/state branch
        id: restore_state
        uses: ./.github/actions/restore-aria-state
        with:
          bootstrap-ack: ${{ vars.ARIA_STATE_BOOTSTRAP_ACK }}
          # ARIA-HIGH-342 — this job writes aria/state: the writer lease is
          # taken before the checkout and held to the release step, so no
          # other lane publishes in between. Expiry = this job's
          # timeout-minutes plus the 80-minute leased-publish margin
          # (GSEC-MEDIUM-003); past the wait the run yields by name, before it
          # has restored anything.
          writer-lease-ttl-minutes: '95'
          writer-lease-wait-seconds: '240'

      # ARIA-HIGH-220 — no lane-start attestation step. It recorded a row
      # for every claim ever made, keyed by (PR, head, claim) alone, which any
      # later run on any host could present. `merge-lane run` attests each
      # candidate as it merges it, bound to this run, and the merge
      # authority re-measures the run's identity at the merge call.

      # ARIA-HIGH-222 — minted BEFORE the merge: every merge's intent is
      # published to aria/state before its merge call, so the merge step
      # carries the aria/state credential as well as the publish step. A
      # lane whose restore did not land has no credential, cannot publish an
      # intent, and so merges nothing.
      - name: Mint the aria/state push credential
        id: publish_credential
        if: steps.restore_state.outputs.restored == 'true' || steps.restore_state.outputs.bootstrap == 'true'
        env:
          PUBLISH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEADER="$(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 -w0)"
          echo "::add-mask::${HEADER}"
          echo "header=${HEADER}" >> "$GITHUB_OUTPUT"

      - name: Run the merge lane
        if: steps.restore_state.outputs.writer-lease == 'held'
        id: merge
        env:
          # The merge lane publishes its intents in-process (ARIA-HIGH-342).
          ARIA_STATE_WRITER_LEASE_TOKEN: ${{ steps.restore_state.outputs.writer-lease-token }}
          PYTHONPATH: aria-kernel
          # The merge credential is the App installation token; a PAT
          # fallback is a weaker isolation mode. Fail loudly until the
          # operator completes the GitHub App setup.
          ARIA_REQUIRE_MODE_A: 'true'
          ARIA_GH_APP_INSTALLATION_ID: ${{ secrets.ARIA_GH_APP_INSTALLATION_ID }}
          ARIA_GH_APP_ID: ${{ secrets.ARIA_GH_APP_ID }}
          ARIA_GH_APP_PRIVATE_KEY: ${{ secrets.ARIA_GH_APP_PRIVATE_KEY }}
          PR_NUMBER: ${{ inputs.pr_number }}
          # The aria/state credential, for the merge intents this step
          # publishes; git reads it for the store's push only.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: 'AUTHORIZATION: basic ${{ steps.publish_credential.outputs.header }}'
        run: |
          set -euo pipefail
          # ubuntu-latest has no operator home dir; materialize the PEM
          # content from the secret into an ephemeral 0600 file, and hold
          # the minted token in a private 0700 directory outside the
          # workspace (the factory refuses any other).
          KEY_FILE="$RUNNER_TEMP/gh-app-private-key.pem"
          TOKEN_DIR="$RUNNER_TEMP/aria-merge-token"
          umask 077
          printf '%s\n' "$ARIA_GH_APP_PRIVATE_KEY" > "$KEY_FILE"
          export ARIA_GH_APP_PRIVATE_KEY_PATH="$KEY_FILE"
          mkdir -m 700 "$TOKEN_DIR"
          MERGE_TOKEN=""
          cleanup() {
            # Revoke with the lease's own token; the provider expiry is the
            # backstop when the DELETE fails.
            if [ -n "$MERGE_TOKEN" ]; then
              GH_TOKEN="$MERGE_TOKEN" gh api -X DELETE /installation/token >/dev/null \
                || echo "::warning::installation token revoke failed; provider expiry applies"
            fi
            rm -f "$KEY_FILE"
            rm -rf "$TOKEN_DIR"
          }
          trap cleanup EXIT
          MERGE_TOKEN="$(TOKEN_DIR="$TOKEN_DIR" python3 -c "
          import os
          from pathlib import Path
          from aria_kernel.gh_token_factory import (
              MERGE_LANE_INSTALLATION_TOKEN_PERMISSIONS,
              mint_installation_token,
          )
          # ARIA-HIGH-208 — the merge gates also read issues, check runs
          # and commit statuses; the factory names that set.
          lease = mint_installation_token(
              cycle_id='merge-runner-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'],
              workspace_root=os.environ['GITHUB_WORKSPACE'],
              token_dir=os.environ['TOKEN_DIR'],
              permissions=MERGE_LANE_INSTALLATION_TOKEN_PERMISSIONS,
          )
          print(Path(lease.token_file).read_text(encoding='utf-8').strip())
          ")"
          echo "::add-mask::${MERGE_TOKEN}"
          # GH_TOKEN reaches the merge command only, never the job env.
          # Both invocations are spelled out so the CLI-contract invariant
          # (test_workflow_kernel_cli_contract) parses each one.
          # The verdict goes to a file so the candidate count can be read
          # from it; it is printed whatever the lane's exit status, and the
          # step then exits with that status.
          RESULT="$RUNNER_TEMP/aria-merge-lane-result.json"
          STATUS=0
          if [ -n "$PR_NUMBER" ]; then
            GH_TOKEN="$MERGE_TOKEN" python3 -m aria_kernel merge-lane run \
              --pr "$PR_NUMBER" \
              --tools-dir "$ARIA_TOOLS_DIR" \
              --workspace-root "$GITHUB_WORKSPACE" > "$RESULT" || STATUS=$?
          else
            GH_TOKEN="$MERGE_TOKEN" python3 -m aria_kernel merge-lane run \
              --tools-dir "$ARIA_TOOLS_DIR" \
              --workspace-root "$GITHUB_WORKSPACE" > "$RESULT" || STATUS=$?
          fi
          cat "$RESULT"
          # ARIA-HIGH-222 — a run with no candidate (no open PR whose head
          # holds a claim) is a no-op: it recorded nothing worth a publish.
          # ARIA-HIGH-221 — a merge-queue settlement (an enqueued PR the
          # queue merged or removed) is recorded work too.
          echo "candidates=$(jq -r '(.candidates_evaluated // 0) + ((.queue_settled // []) | length)' "$RESULT")" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Publish ARIA state to the aria/state branch
        if: (steps.restore_state.outputs.restored == 'true' || steps.restore_state.outputs.bootstrap == 'true') && steps.merge.outputs.candidates != '0'
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: 'AUTHORIZATION: basic ${{ steps.publish_credential.outputs.header }}'
          # ARIA-HIGH-342 — the writer-lease capability, as a masked step
          # output into this step only (GSEC-LOW-002).
          ARIA_STATE_WRITER_LEASE_TOKEN: ${{ steps.restore_state.outputs.writer-lease-token }}
        run: |
          set -euo pipefail
          PYTHONPATH=aria-kernel python3 -m aria_kernel state publish \
            --repo-root . \
            --snapshot-id "merge-runner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --cycle-id "merge-runner-${GITHUB_RUN_ID}"

      # ARIA-HIGH-342 — give back the aria/state writer lease the restore took.
      # Unconditional (GSEC-LOW-001): release is idempotent, a no-op when this
      # run yielded and holds none, and releases only by the token (kept on
      # disk before the acquire's push; there is no release by identity). A
      # runner that dies outright frees the branch at the expiry it set.
      - name: Release the aria/state writer lease
        if: always()
        uses: ./.github/actions/release-aria-state-lease
        with:
          lease-token: ${{ steps.restore_state.outputs.writer-lease-token }}

      - name: Upload merge-runner preflight proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-merge-runner-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aria-merge-runner-preflight.json
          if-no-files-found: error
          retention-days: 7
