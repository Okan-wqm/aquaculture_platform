name: Apollo Supergraph Validate

# R0 — kill runtime IntrospectAndCompose by composing the supergraph at BUILD
# time. This gate emits each subgraph's Federation v2 SDL from its code-first
# resolvers (no runtime — no DB/NATS/Redis, no @nestjs/apollo) and composes them
# with @apollo/composition. A subgraph schema change that breaks federation
# composition (an unresolvable @key, a type conflict, an invalid @requires) is a
# RED PR here, instead of a production gateway restart-loop discovered at deploy.

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/**/*.resolver.ts'
      - 'apps/**/*.entity.ts'
      - 'apps/**/*.model.ts'
      - 'apps/**/*.dto.ts'
      - 'apps/**/*.input.ts'
      - 'apps/**/*.type.ts'
      - 'apps/**/*.args.ts'
      - 'apps/**/*.object.ts'
      - 'apps/**/*.enum.ts'
      - 'infrastructure/apollo-router/subgraphs.json'
      - 'tools/scripts/emit-subgraph-sdl.ts'
      - 'scripts/apollo-router/build-supergraph.mjs'
      - '.github/workflows/apollo-supergraph-validate.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/**/*.resolver.ts'
      - 'apps/**/*.entity.ts'
      - 'apps/**/*.model.ts'
      - 'apps/**/*.dto.ts'
      - 'apps/**/*.input.ts'
      - 'apps/**/*.type.ts'
      - 'apps/**/*.args.ts'
      - 'apps/**/*.object.ts'
      - 'apps/**/*.enum.ts'
      - 'infrastructure/apollo-router/subgraphs.json'
      - 'tools/scripts/emit-subgraph-sdl.ts'
      - 'scripts/apollo-router/build-supergraph.mjs'
      - '.github/workflows/apollo-supergraph-validate.yml'

permissions:
  contents: read

concurrency:
  group: apollo-supergraph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Emit subgraph SDLs and compose the supergraph
        # Fails the build with the composition errors if any subgraph schema
        # cannot federate. Writes dist/graphql/supergraph.graphql on success.
        run: node scripts/apollo-router/build-supergraph.mjs

      - name: Upload composed supergraph artifact
        if: success()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: supergraph-sdl
          path: |
            dist/graphql/supergraph.graphql
            dist/graphql/subgraphs/*.graphql
          retention-days: 14
          if-no-files-found: error
