      # under the sensor-service service principal). ai-service HANDLES it (subscribe).
      - 'request.ai.sensor.detectChannels'
      - '$JS.API.>'
      - '_INBOX.>'

  # ---------------------------------------------------------------------------
  # billing-service: subscriptions, invoices, payments, Stripe webhooks
  # ---------------------------------------------------------------------------
  - name: billing_service
    application: billing-service
    description: Subscriptions, invoicing, Stripe payment processing
    publish:
      - 'events.*.InvoiceGenerated'
      - 'events.*.PaymentFailed'
      - 'events.*.PaymentReceived'
      - 'events.*.PaymentRefunded'
      - 'events.*.SubscriptionCancelled'
      - 'events.*.SubscriptionCreated'
      - 'events.*.SubscriptionExpired'
      - 'events.*.SubscriptionPastDue'
      - 'events.*.SubscriptionProvisioningFailed'
      - 'events.*.SubscriptionUpdated'
      - 'events.*.TenantSubscriptionChanged'
      - 'events.*.BillingServiceTenantDataErased'
      - 'events.*.BillingServiceTenantDataErasureFailed'
      - 'events.*.BillingServiceTenantErasureBlocked'
      - 'events.platform.schema-migration.>'
      - 'events.security.events.>'
      # Faz C (D6): billing is the ONLY CN allowed to PUBLISH the config-runtime
      # read subjects — the get_secret grant is the cert-CN half of the
      # defense-in-depth around the plaintext Stripe secret. Reply arrives on
      # billing's own _INBOX.> (already granted).
      - 'config.runtime.get'
      - 'config.runtime.get_secret'
      - '$JS.API.>'
      - '_INBOX.>'
    subscribe:
      - 'request.billing.admin.>'
      - 'request.billing.tenant.>'
      # Faz C (SEC-CRITICAL-001): SCOPED reply inbox for the config-runtime secret
      # read — billing is the ONLY CN that subscribes this token, so the decrypted
      # Stripe secret never returns on the platform-wide `_INBOX.>` every cert holds.
      - '_INBOXBILLINGCFG.>'
      - '$JS.API.>'
      - '_INBOX.>'

