[workspace]
resolver = "2"
members = [
    "crates/protocol-codec",
    "crates/alarm-core",
    "crates/tenant-context",
    "crates/event-contracts-rs",
    "crates/nats-client",
    "crates/observability",
    "crates/outbox-rs",
    "crates/router-coprocessor",
    "apps/sensor-ingestion",
]
exclude = [
    "sens-api-gateway",
    "sens-api-gateway/fuzz",
    # Each crate's fuzz/ directory has its own cargo-fuzz manifest
    # (libfuzzer-sys, requires nightly to run). Excluded from the
    # workspace so `cargo build --workspace` stays on stable.
    "crates/protocol-codec/fuzz",
    # wasm-bindgen binding crate — built standalone via `wasm-pack`
    # (`--target nodejs`) for the NestJS/browser consumers, not by the
    # native workspace build. Excluded so `cargo build --workspace`,
    # clippy, and tests stay on the native target.
    "crates/protocol-codec-wasm",
    # alarm-core wasm binding crate — built standalone via `wasm-pack`-style
    # cargo + wasm-bindgen for the NestJS SCADA runtime, same as protocol-codec-wasm.
    "crates/alarm-core-wasm",
    # Vendored upstream fork (RUST-CVE-001) — consumed only via
    # [patch.crates-io] at the bottom of this file. Excluded so upstream
    # code is not subject to our workspace lints/tests; provenance and
    # diff policy live in crates/local-rumqttc/UPSTREAM.md.
    "crates/local-rumqttc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Aquaculture Platform Team <platform@aquaculture.dev>"]
license = "Proprietary"
repository = "https://github.com/Okan-wqm/aquaculture_platform"
publish = false

[workspace.dependencies]
tokio = { version = "1.52", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

bytes = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

uuid = { version = "1.23", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

anyhow = "1.0"
thiserror = "2.0"
secrecy = { version = "0.10", features = ["serde"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }

metrics = "0.24"
metrics-exporter-prometheus = "0.16"

nom = "7.1"
hex = "0.4"

# R1 router-coprocessor: service-identity HMAC-v2 signing (byte-for-byte parity
# with the TS generateServiceIdentityHeadersV2).
sha2 = "0.10"
hmac = "0.13"

async-nats = "0.49"
rustls = "0.23"
# RUST-CVE-001: rustls-pemfile (unmaintained, RUSTSEC-2025-0134) replaced by
# rustls-pki-types' first-party PEM decoding ("std" gates the slice/reader API).
rustls-pki-types = { version = "1.7", features = ["std"] }
rustls-native-certs = "0.8"

proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }

# ArcSwap — lock-free atomic swap of `Arc<T>`. The hot-path read
# returns a `Guard` that deref's to `&T` with a ~5ns fast-path; the
# write (`.store(Arc::new(new))`) swaps under a seqlock. Used by
# sensor-ingestion's DynamicBackendPolicy so the drain's per-message
# `backend_for(tenant)` call never blocks on the policy update path.
arc-swap = "1.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[profile.bench]
opt-level = 3
lto = "thin"
debug = true

[profile.dev]
opt-level = 0
debug = true

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Crate prose includes proper nouns (SSoT, NestJS, FPort, etc.) that the
# doc_markdown lint mis-flags as missing-backtick code identifiers. Allowing
# globally keeps doc-comment ergonomics; we still get the rest of pedantic.
doc_markdown = "allow"
# too_long_first_doc_paragraph: opinion-based; protocol-codec docs lead
# with a wire-layout sentence which is long by design. Still get the rest
# of the nursery checks.
too_long_first_doc_paragraph = "allow"
# missing_const_for_fn: would mark functions as `const fn` which prevents
# future evolution that needs heap allocation or non-const ops. Keep
# ergonomic non-const signatures unless an explicit const need arises.
missing_const_for_fn = "allow"

# =============================================================================
# RUST-CVE-001: rumqttc 0.25.1 vendored fork (crates/local-rumqttc)
# =============================================================================
# WHY: upstream rumqttc 0.25.1 pins rustls-webpki = "0.102.8" (RUSTSEC-2026-
# 0098/0099/0049/0104) and the unmaintained rustls-pemfile (RUSTSEC-2025-0134).
# The fork bumps webpki to 0.103 and replaces pemfile with rustls-pki-types'
# first-party PEM decoding. WHAT: every `rumqttc = "0.25"` dependency in this
# workspace resolves to the patched path crate; member manifests stay
# untouched. Drop this patch when upstream cuts a release on webpki >= 0.103
# (provenance + diff policy: crates/local-rumqttc/UPSTREAM.md).
[patch.crates-io]
rumqttc = { path = "crates/local-rumqttc" }
