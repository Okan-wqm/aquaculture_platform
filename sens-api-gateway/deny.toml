# cargo-deny configuration for Suderra Edge Agent
# https://embarkstudios.github.io/cargo-deny/
#
# IEC 62443 SL2 Compliance: Dependency security and license management

[graph]
# Targets to check (edge devices are typically x86_64 or ARM Linux)
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "armv7-unknown-linux-gnueabihf",
]

[advisories]
# Vulnerability database check
# db-path removed: ~/.cargo resolves to user home which may not have a
# pre-populated advisory DB in CI. cargo-deny auto-fetches from db-urls
# when no local path is configured.
# db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# Deny known vulnerabilities
version = 2

# Ignore specific advisories — policy mirror of `.cargo/audit.toml`.
# cargo-deny reads THIS file; cargo-audit reads the other. Both tools
# run in CI so both allowlists MUST agree; otherwise CI fails on the
# same advisory through the other tool. When upstream fixes land,
# REMOVE entry from BOTH files in the same commit.
#
# Policy (plan discipline): delay with tracked-IDs permitted only with
# explicit owner + deadline + finding-ID + upstream blocker reference.
ignore = [
    # -----------------------------------------------------------------
    # EDGE-CI-001 RESOLVED 2026-06-11 (RUST-CVE-001): the four
    # rustls-webpki 0.102.8 advisories (RUSTSEC-2026-0098/0099/0049/
    # 0104) were removed — rumqttc resolves to the vendored fork at
    # ../crates/local-rumqttc (rustls-webpki >= 0.103). Reintroduction
    # is blocked by the [bans] table below.
    # -----------------------------------------------------------------

    # -----------------------------------------------------------------
    # EDGE-CI-002: rsa 0.9.10 Marvin Attack — NO UPSTREAM FIX.
    # Owner: platform-team. Deadline: RE-EVAL QUARTERLY.
    # Marvin Attack requires timing-measurable decryption oracle;
    # async-opcua X.509 VERIFICATION path does NOT expose one. OPC UA
    # feature `opc-ua-server` off-by-default; opt-in only.
    # -----------------------------------------------------------------
    "RUSTSEC-2023-0071",

    # -----------------------------------------------------------------
    # EDGE-CI-003 / RUST-MEDIUM-004: bincode 1.3.3 unmaintained
    # (RUSTSEC-2025-0141).
    # Owner: security-reviewer. Deadline: 2026-12-01 (quarterly review).
    # Plan Batch 1 PINS for wire-format stability of audit HMAC chain +
    # canonical bytes. Migration = breaking on-wire change; ADR-level
    # coordinated fleet event (re-sign every live audit record).
    # -----------------------------------------------------------------
    "RUSTSEC-2025-0141",

    # -----------------------------------------------------------------
    # EDGE-CI-005 RESOLVED 2026-06-11 (RUST-CVE-001): RUSTSEC-2025-0134
    # removed — the local-rumqttc fork decodes PEM via rustls-pki-types,
    # which cleared rustls-pemfile from this workspace's graph entirely.
    # Reintroduction is blocked by the [bans] table below.
    # -----------------------------------------------------------------

    # -----------------------------------------------------------------
    # EDGE-CI-006 / RUST-MEDIUM-004: atomic-polyfill 1.0.3 unmaintained
    # (RUSTSEC-2023-0089).
    # Owner: security-reviewer. Deadline: 2026-12-01 (quarterly review).
    # Transitive via async-opcua -> postcard -> heapless. The latest
    # async-opcua 0.19.0 lock still contains this graph. No active
    # vulnerability; replacement remains upstream-blocked.
    # -----------------------------------------------------------------
    "RUSTSEC-2023-0089",

    # -----------------------------------------------------------------
    # EDGE-CI-007: proc-macro-error2 2.0.1 unmaintained (RUSTSEC-2026-0173,
    # published 2026-06-07). Owner: platform-team. Deadline: 2026-10-01.
    # Build-time-only transitive: proc-macro-error2 <- defmt-macros <-
    # defmt <- lorawan stack. defmt-macros latest (1.1.0, 2026-05-12)
    # still depends on it, so no upstream upgrade path exists yet —
    # re-check on each defmt release. Unmaintained signal only, no
    # active vulnerability; the crate never reaches the shipped binary
    # (proc-macro host dependency).
    # -----------------------------------------------------------------
    "RUSTSEC-2026-0173",

    # -----------------------------------------------------------------
    # EDGE-CI-008: paste 1.0.15 unmaintained (RUSTSEC-2024-0436,
    # published 2024-10-07). Owner: platform-team. Deadline: 2026-12-01.
    # Build-time-only transitive: paste <- wasmi_core / wasmi <- the
    # wasm-codec LoRa custom-decoder feature (OFF by default, no wasmi in
    # the default fleet binary). paste is an archived proc-macro helper;
    # no wasmi release drops it yet — re-check on each wasmi bump.
    # Unmaintained signal only, no active vulnerability; proc-macro host
    # dependency that never reaches the shipped binary.
    # -----------------------------------------------------------------
    "RUSTSEC-2024-0436",
]

[licenses]
# Confidence threshold for license detection
confidence-threshold = 0.93

# Allowed licenses (OSI-approved, permissive)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "OpenSSL",  # Used by aws-lc-sys cryptography (permissive)
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",      # ICU/Unicode crates (OSI-approved)
    "Unlicense",
    "MPL-2.0",  # Weak copyleft, file-level
    "CDLA-Permissive-2.0",  # Community Data License (webpki-roots)
    "LicenseRef-Proprietary",  # Our own proprietary code
]

# Exceptions for crates with complex license situations
exceptions = [
    # ring uses a custom license combining ISC, MIT, and OpenSSL
    { allow = ["ISC", "MIT", "OpenSSL"], crate = "ring" },
]

# Private crates that use non-SPDX licenses
private = { ignore = true }

# Skip checking our own crate's license (it's proprietary)
[[licenses.clarify]]
crate = "suderra-agent"
expression = "LicenseRef-Proprietary"
license-files = []

# rodbus is licensed under BSD-3-Clause but manifest doesn't specify
# See: https://github.com/stepfunc/rodbus/blob/main/LICENSE.txt
[[licenses.clarify]]
crate = "rodbus"
expression = "BSD-3-Clause"
license-files = [
    { path = "LICENSE.txt", hash = 0x3754c5f8 }
]

[bans]
# Warn about multiple versions of the same crate (bloat)
multiple-versions = "warn"

# Deny wildcard dependencies (reproducibility)
wildcards = "deny"

# Deny specific problematic crates
deny = [
    # 2026-04-30: OpenSSL's high-level TLS crate remains denied so network TLS
    # cannot regress from rustls. We do not ban `openssl-sys` globally because
    # SQLCipher at-rest encryption intentionally reaches it through
    # `rusqlite -> libsqlite3-sys` with the vendored SQLCipher/OpenSSL feature.
    # Cargo-deny's `skip` is for duplicate-version traversal, not for overriding
    # an explicit ban, so the architectural boundary must live at the crate ban.
    { name = "openssl", reason = "Use rustls for cross-platform TLS" },
    # RUST-CVE-001 regression guards (EDGE-CI-001 + EDGE-CI-005): the
    # vulnerable rustls-webpki line and the unmaintained rustls-pemfile
    # must never re-enter the graph. Fix: ../crates/local-rumqttc fork.
    { name = "rustls-webpki", version = "<0.103", reason = "RUSTSEC-2026-0098/0099/0049/0104 — use >= 0.103" },
    { name = "rustls-pemfile", reason = "RUSTSEC-2025-0134 unmaintained — use rustls-pki-types pem API" },
]

# Skip checking tree for these crates
skip-tree = []

[sources]
# Deny crates from unknown registries
unknown-registry = "deny"

# Warn about crates from git (less reproducible)
unknown-git = "warn"

# Allow crates from crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# No allowed git sources by default
allow-git = []
