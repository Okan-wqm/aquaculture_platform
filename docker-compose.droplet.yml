      # INTERNAL_API_KEY must be set; guard rejects all requests in production without it
      INTERNAL_API_KEY: ${OBSERVABILITY_INTERNAL_API_KEY:?OBSERVABILITY_INTERNAL_API_KEY required}
      # INFRA-DB-ENV-001: previously DB_HOST/DB_PORT/DB_USERNAME/DB_PASSWORD/DB_NAME.
      # Standardised on the platform DATABASE_* contract enforced by the
      # createServiceTypeOrmConfig factory in libs/backend-common.
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${OBSERVABILITY_SERVICE_DB_USER:-observability_service}
      DATABASE_PASSWORD: ${OBSERVABILITY_SERVICE_DB_PASS:?OBSERVABILITY_SERVICE_DB_PASS required}
      # Observability reads cross-service metrics from the main aquaculture DB
      # (sensor, auth, alert, farm schemas). No own entities — schema-based isolation.
      DATABASE_NAME: aquaculture
      DB_MIGRATE_AUTHORITATIVE: 'true'
      DATABASE_MIGRATIONS_RUN: 'false'
      # Phase 6 Step 6 + SecurityEventsModule both import EventBusModule.forRoot();
      # NatsEventBus.onModuleInit connects to NATS at bootstrap. Under NODE_ENV=production
      # the nats-connection.factory hard-fails if no auth is configured — cert CN is the
      # NATS identity (ADR-015). Previously MISSING here, which aborted Nest bootstrap
      # before SchemaDriftValidator emitted its "Schema drift scan clean" signal and put
      # the container in a restart loop. Cert identity registered in
      # infrastructure/nats/services.yaml → observability_service.
      <<: *nats-observability-env
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      # WS10: ADR-016 Phase E Phase 1 — schema pre-applied by aqua-db-migrate.
      db-migrate:
        condition: service_completed_successfully
    # ORPHAN-CRITICAL-061: NATS cert mounts were missing here while the
    # *nats-observability-env merge above declared NATS_TLS_CA / NATS_TLS_CERT /
    # NATS_TLS_KEY paths inside the container. nats-connection.factory hard-fails
    # at bootstrap when NATS_TLS_CA is set but unreadable, crash-looping
    # observability-service on the production droplet. Every other NATS-using
    # service in this file mounts these four anchors; observability is now
    # aligned with the same pattern so the env paths actually resolve.
    volumes:
      - *nats-ca-mount
      - *nats-observability-cert-mount
      - *nats-observability-key-mount
    # Attached to aqua-internal only — no published ports, not reachable from external network
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3009/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  config-service:
    logging: *default-logging
    image: ghcr.io/okan-wqm/aquaculture_platform/config-service:${TAG:?TAG required}
    container_name: aqua-config
    restart: unless-stopped
    environment:
      SERVICE_NAME: config-service
      NODE_ENV: production
      PORT: 3000
      CONFIG_SERVICE_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=256'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      DATABASE_HOST: postgres
      # SSL off — Postgres is on the same Docker bridge (no MITM surface).
      DATABASE_SSL: 'false'
      DATABASE_PORT: 5432
      # SEC-015 (CRITICAL-001): Per-service DB role per ADR-011 schema-ownership.
      # config-service owns the `config` schema (provisioned by
      # `infrastructure/docker/init-scripts/00-init-schemas.sh` lines 138-141 +
      # 175 + 193 + 460-469). Connecting as `config_service` gives the runtime
      # service and its OnApplicationBootstrap MigrationRunnerService CREATE
      # privilege on `config` — required to maintain the migration ledger
      # (`config.migrations`) and apply any pending DDL. The
      # `gateway_service` role has no grants on `config` (only on `gateway`)
      # so the previous wiring crashed cold-boot with "permission denied
      # for database aquaculture" once the first config-schema migration
      # landed (ORPHAN-CRITICAL-069).
      DATABASE_USER: ${CONFIG_SERVICE_DB_USER:-config_service}
      DATABASE_PASSWORD: ${CONFIG_SERVICE_DB_PASS:?CONFIG_SERVICE_DB_PASS is required}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DB_MIGRATE_AUTHORITATIVE: 'true'
      DATABASE_MIGRATIONS_RUN: 'false'
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      # SEC-015 (CRITICAL-002): dedicated CN=config_service.
      <<: *nats-config-env
      JWT_PUBLIC_KEY_PATH: /etc/ssl/jwt/public.pem
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?CONFIG_ENCRYPTION_KEY is required}
      SERVICE_IDENTITY_KEYRING: ${SERVICE_IDENTITY_KEYRING:?SERVICE_IDENTITY_KEYRING required}
      SERVICE_IDENTITY_SIGNING_KID: ${SERVICE_IDENTITY_SIGNING_KID:?SERVICE_IDENTITY_SIGNING_KID required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      # WS10: ADR-016 Phase E Phase 1 — schema pre-applied by aqua-db-migrate.
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - *nats-ca-mount
      - *nats-config-cert-mount
      - *nats-config-key-mount
      - *jwt-public-key-mount
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  event-store-service:
    logging: *default-logging
    image: ghcr.io/okan-wqm/aquaculture_platform/event-store-service:${TAG:?TAG required}
    container_name: aqua-event-store
    restart: unless-stopped
    environment:
      SERVICE_NAME: event-store-service
      NODE_ENV: production
      PORT: 3000
      EVENT_STORE_SERVICE_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=384'
      DATABASE_HOST: postgres
      DATABASE_SSL: 'false'
      DATABASE_PORT: 5432
      DATABASE_USER: ${EVENT_STORE_SERVICE_DB_USER:-event_store_service}
      DATABASE_PASSWORD: ${EVENT_STORE_SERVICE_DB_PASS:?EVENT_STORE_SERVICE_DB_PASS is required}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DB_MIGRATE_AUTHORITATIVE: 'true'
      DATABASE_MIGRATIONS_RUN: 'false'
      SERVICE_IDENTITY_KEYRING: ${SERVICE_IDENTITY_KEYRING:?SERVICE_IDENTITY_KEYRING is required}
      SERVICE_IDENTITY_SIGNING_KID: ${SERVICE_IDENTITY_SIGNING_KID:?SERVICE_IDENTITY_SIGNING_KID required}
      # ORPHAN-MEDIUM-392: app.module registers RedisModule ('optional' mode);
      # without this URL the client fell back to localhost and retried forever
      # (ECONNREFUSED spam, Redis-backed paths silently degraded) — the second
      # under-provisioned-block gap after the NATS one (ORPHAN-HIGH-391).
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      <<: *nats-event-store-env
    volumes:
      - *nats-ca-mount
      - *nats-event-store-cert-mount
      - *nats-event-store-key-mount
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.35'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3000/health/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  messaging-service:
    logging: *default-logging
    image: ghcr.io/okan-wqm/aquaculture_platform/messaging-service:${TAG:?TAG required}
    container_name: aqua-messaging
    restart: unless-stopped
    environment:
      SERVICE_NAME: messaging-service
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=384'
      DATABASE_HOST: postgres
      # SSL off — Postgres is on the same Docker bridge (no MITM surface).
      DATABASE_SSL: 'false'
      DATABASE_PORT: 5432
      # SEC-015 (CRITICAL-001): Per-service DB role — messaging_service can only access messaging schema
      DATABASE_USER: ${MESSAGING_SERVICE_DB_USER:-messaging_service}
      DATABASE_PASSWORD: ${MESSAGING_SERVICE_DB_PASS:?MESSAGING_SERVICE_DB_PASS required}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DB_MIGRATE_AUTHORITATIVE: 'true'
      DATABASE_MIGRATIONS_RUN: 'false'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: '3'
      # SEC-015 (CRITICAL-002): Per-service NATS credentials
      <<: *nats-messaging-env
      JWT_PUBLIC_KEY_PATH: /etc/ssl/jwt/public.pem
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      # messaging-service is an active Apollo subgraph (infrastructure/apollo-router/
      # subgraphs.json): the gateway HMAC-signs every gateway→messaging call, so the
      # ServiceIdentityGuard MUST have the shared keyring to verify it — without it
      # the guard throws "SERVICE_IDENTITY_KEYRING is not set" in production and
      # every messaging query 403s. messaging was the ONLY backend subgraph missing
      # these two vars (the other 12 carry both); this closes that gap.
      SERVICE_IDENTITY_KEYRING: ${SERVICE_IDENTITY_KEYRING:?SERVICE_IDENTITY_KEYRING required}
      SERVICE_IDENTITY_SIGNING_KID: ${SERVICE_IDENTITY_SIGNING_KID:?SERVICE_IDENTITY_SIGNING_KID required}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      # SEC-NEW02: MinIO credentials must be provided — no default fallback for object storage access
      MINIO_ACCESS_KEY: ${MINIO_USER:?MINIO_USER is required}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
      TRUST_PROXY: 'true'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://aquamonitoring.net}
    volumes:
      - *nats-ca-mount
      - *nats-messaging-cert-mount
      - *nats-messaging-key-mount
      - *jwt-public-key-mount
    networks:
      - aqua-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      # WS10: ADR-016 Phase E Phase 1 — schema pre-applied by aqua-db-migrate.
      db-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      # ARCH-HC-001: Use /health/live for Docker healthcheck (consistent with all other services).
      # /health/ready checks DB+Redis+NATS and returns 503 on partial failure — too strict for
      # Docker liveness. The gateway only needs messaging's GraphQL endpoint reachable, which
      # /health/live confirms (NestJS HTTP listener is bound = supergraph introspection will work).
      # Uses curl (shipped in the Dockerfile.backend base) — every other backend healthcheck
      # in this file uses the same command. The previous `wget -q --spider` variant assumed
      # busybox/wget was present, but the image base only includes curl. That mismatch made
      # every healthcheck execution fail with
      #   OCI runtime exec failed: exec: "wget": executable file not found in $PATH
      # and marked the container `unhealthy` while the process itself was running fine.
      test: ['CMD', 'curl', '-sf', 'http://localhost:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # ai-service — AI assistant + BYOK (Faz 0 activation). REST service behind the
  # gateway's /api/v2/ai proxy (not an Apollo subgraph). Mirrors messaging's
  # backend shape; AI deltas: per-tenant BYOK key decryption + no MinIO.
  # ---------------------------------------------------------------------------
  ai-service:
    logging: *default-logging
    image: ghcr.io/okan-wqm/aquaculture_platform/ai-service:${TAG:?TAG required}
    container_name: aqua-ai
    restart: unless-stopped
    environment:
      SERVICE_NAME: ai-service
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=384'
      DATABASE_HOST: postgres
      DATABASE_SSL: 'false'
      DATABASE_PORT: 5432
      DATABASE_USER: ${AI_SERVICE_DB_USER:-ai_service}
      DATABASE_PASSWORD: ${AI_SERVICE_DB_PASS:?AI_SERVICE_DB_PASS required}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DB_MIGRATE_AUTHORITATIVE: 'true'
      DATABASE_MIGRATIONS_RUN: 'false'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: '9'
      <<: *nats-ai-env
      JWT_PUBLIC_KEY_PATH: /etc/ssl/jwt/public.pem
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      # The gateway HMAC-signs every gateway→ai-service REST call (SEC-HIGH-054):
      # the ServiceIdentityGuard needs the shared keyring or every AI request 403s.
      SERVICE_IDENTITY_KEYRING: ${SERVICE_IDENTITY_KEYRING:?SERVICE_IDENTITY_KEYRING required}
      SERVICE_IDENTITY_SIGNING_KID: ${SERVICE_IDENTITY_SIGNING_KID:?SERVICE_IDENTITY_SIGNING_KID required}
      # BYOK: AES-256-GCM decrypt of the per-tenant AI credentials at rest.
      AI_TENANT_SECRET_ENCRYPTION_KEY: ${AI_TENANT_SECRET_ENCRYPTION_KEY:?AI_TENANT_SECRET_ENCRYPTION_KEY required}
      TRUST_PROXY: 'true'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://aquamonitoring.net}
    volumes:
      - *nats-ca-mount
      - *nats-ai-cert-mount
      - *nats-ai-key-mount
      - *jwt-public-key-mount
    networks:
      - aqua-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

