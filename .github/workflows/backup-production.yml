name: Backup - Production Postgres

# SEC-CI-002: All third-party actions pinned to full commit SHAs.
# INFRA-BACKUP-001: Nightly pg_dump of the droplet's local PostgreSQL →
# DigitalOcean Spaces via SSH + the checked-in backup-databases.sh script.
# Retention is enforced by the bucket's lifecycle policy; this workflow
# does not delete remote objects.

on:
  schedule:
    # 03:00 UTC daily = 04:00 CET / 05:00 CEST (low-traffic window).
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (pg_dump + local integrity checks, skip upload)'
        type: boolean
        required: false
        default: false

concurrency:
  group: backup-production
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump → DO Spaces
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-backup
      deployment: false

    permissions:
      contents: read

    steps:
      # SEC-CI-002: pinned to SHA
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      # Fail fast on the runner if any required resolved Actions secret is
      # empty, before we open an SSH session to the droplet.
      - name: Preflight — assert backup secrets present
        id: backup_secret_preflight
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
          SPACES_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
          SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          BACKUP_POSTGRES_USER: ${{ secrets.BACKUP_POSTGRES_USER }}
          BACKUP_POSTGRES_DB: ${{ secrets.BACKUP_POSTGRES_DB }}
          BACKUP_POSTGRES_PASSWORD: ${{ secrets.BACKUP_POSTGRES_PASSWORD }}
        run: bash tools/scripts/database/assert-backup-secrets.sh

      # The droplet already has the backup script on disk (repo is checked out
      # under /var/aqua-saas). We SSH in and invoke it with the required env.
      #
      # SEC-CI-002: pinned to SHA (same version as deploy-digitalocean.yml)
      - name: Run backup-databases.sh on the droplet
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.0.3
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          POSTGRES_USER: ${{ secrets.BACKUP_POSTGRES_USER }}
          POSTGRES_DB: ${{ secrets.BACKUP_POSTGRES_DB }}
          SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
          SPACES_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          PGPASSWORD: ${{ secrets.BACKUP_POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 25m
          envs: DRY_RUN,POSTGRES_USER,POSTGRES_DB,SPACES_BUCKET,SPACES_ENDPOINT,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,PGPASSWORD
          script: |
            set -euo pipefail
            cd /var/aqua-saas

            # Sync the script from main AND verify its SHA-256 against the
            # committed manifest before execution. Without this guard, an
            # attacker who lands a malicious commit on main gains arbitrary
            # code execution on the droplet as the SSH user (INFRA-1).
            #
            # The manifest at .github/manifests/backup-script.sha256 is
            # CODEOWNERS-gated to @Okan-wqm (BLOCKER-9) so a malicious PR
            # cannot silently update the hash alongside the script.
            echo "=== Syncing repo + verifying script integrity ==="
            git fetch --force --prune origin main
            git checkout -f origin/main -- \
              tools/scripts/database/backup-databases.sh \
              .github/manifests/backup-script.sha256

            EXPECTED_SHA=$(awk '/backup-databases\.sh$/ && $1 !~ /^#/ {print $1; exit}' \
              .github/manifests/backup-script.sha256)
            ACTUAL_SHA=$(sha256sum tools/scripts/database/backup-databases.sh \
              | awk '{print $1}')

            if [ "$EXPECTED_SHA" = "__COMPUTE_ON_MERGE__" ]; then
              echo "FATAL: manifest placeholder unresolved — CI must seed the hash on merge."
              exit 1
            fi

            if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
              echo "FATAL: backup-databases.sh SHA-256 mismatch — refusing to execute."
              echo "  expected: $EXPECTED_SHA (from .github/manifests/backup-script.sha256)"
              echo "  actual:   $ACTUAL_SHA"
              echo "If this script was legitimately updated, submit a PR updating"
              echo "BOTH the script AND its manifest hash (CODEOWNERS review required)."
              exit 1
            fi

            echo "Script integrity verified: $ACTUAL_SHA"

            echo "=== Running backup ==="
            export POSTGRES_CONTAINER=aqua-postgres
            export BACKUP_PREFIX='pg-backups'

            if [ "${DRY_RUN}" = "true" ]; then
              echo "DRY_RUN=true — running pg_dump and local integrity checks without upload"
              export BACKUP_DUMP_ONLY=true
            else
              export BACKUP_DUMP_ONLY=false
            fi

            bash tools/scripts/database/backup-databases.sh

      - name: Notify on secret/config preflight failure
        if: failure() && steps.backup_secret_preflight.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setFailed('Production Postgres backup secret/config preflight failed — configure the production-backup environment secrets. Runbook: docs/runbooks/database-restore-drill.md');

      - name: Notify on runtime backup failure
        if: failure() && steps.backup_secret_preflight.outcome == 'success'
        # Surfaces through the existing notification channel used by
        # deploy-digitalocean.yml — keep the delivery mechanism consistent.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setFailed('Production Postgres backup runtime failed — backup object was not proven uploaded/restorable. Check the job log. Runbook: docs/runbooks/database-restore-drill.md');
