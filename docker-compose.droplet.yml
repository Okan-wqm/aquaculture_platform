      NOTIFICATION_SERVICE_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=256'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      DATABASE_HOST: postgres
      DATABASE_SSL: "true"
      DATABASE_SSL_REJECT_UNAUTHORIZED: "false"
      DATABASE_PORT: 5432
      # SEC-015 (CRITICAL-001): Per-service DB role — notification_service uses public schema
      DATABASE_USER: ${NOTIFICATION_SERVICE_DB_USER:-notification_service}
      DATABASE_PASSWORD: ${NOTIFICATION_SERVICE_DB_PASS:-${POSTGRES_PASSWORD:-changeme}}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DATABASE_SYNC: "false" # ARCH-DB-001: Production'da synchronize kapalı, migration kullanılmalı
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # SEC-015 (CRITICAL-002): Per-service NATS credentials
      <<: *nats-notification-env
      JWT_PUBLIC_KEY_PATH: /etc/ssl/jwt/public.pem
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET required}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?WEBHOOK_ENCRYPTION_KEY required (min 32 chars)}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      # WS10: ADR-016 Phase E Phase 1 — schema pre-applied by aqua-db-migrate.
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - *nats-ca-mount
      - *nats-clients-mount
      - *nats-client-cert-mount
      - *nats-client-key-mount
      - *jwt-public-key-mount
    networks:
      - aqua-internal
      - aqua-network  # needs internet for external SMTP email delivery
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  observability-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/observability-service:${TAG:-latest}
    container_name: aqua-observability
    restart: unless-stopped
    environment:
      SERVICE_NAME: observability-service
      NODE_ENV: production
      PORT: 3009
      NODE_OPTIONS: '--max-old-space-size=256'
      # INTERNAL_API_KEY must be set; guard rejects all requests in production without it
      INTERNAL_API_KEY: ${OBSERVABILITY_INTERNAL_API_KEY:?OBSERVABILITY_INTERNAL_API_KEY required}
      # INFRA-DB-ENV-001: previously DB_HOST/DB_PORT/DB_USERNAME/DB_PASSWORD/DB_NAME.
      # Standardised on the platform DATABASE_* contract enforced by the
      # createServiceTypeOrmConfig factory in libs/backend-common.
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-aquaculture}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Observability reads cross-service metrics from the main aquaculture DB
      # (sensor, auth, alert, farm schemas). No own entities — schema-based isolation.
      DATABASE_NAME: aquaculture
    depends_on:
      postgres:
        condition: service_healthy
      # WS10: ADR-016 Phase E Phase 1 — schema pre-applied by aqua-db-migrate.
      db-migrate:
        condition: service_completed_successfully
    # Attached to aqua-internal only — no published ports, not reachable from external network
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3009/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  config-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/config-service:${TAG:-latest}
    container_name: aqua-config
    restart: unless-stopped
    environment:
      SERVICE_NAME: config-service
      NODE_ENV: production
      PORT: 3000
      CONFIG_SERVICE_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=256'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      DATABASE_HOST: postgres
      DATABASE_SSL: "true"
      DATABASE_SSL_REJECT_UNAUTHORIZED: "false"
      DATABASE_PORT: 5432
      # SEC-015 (CRITICAL-001): Per-service DB role — config service uses its own schema
      # NOTE: config-service does not have a dedicated schema in 00-init-schemas.sh yet.
      # Until a config_service role is created, it uses the gateway_service role which
      # has access to the gateway schema where config data is stored.
      DATABASE_USER: ${GATEWAY_SERVICE_DB_USER:-gateway_service}
      DATABASE_PASSWORD: ${GATEWAY_SERVICE_DB_PASS:-${POSTGRES_PASSWORD:-changeme}}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DATABASE_SYNC: "false" # ARCH-DB-001: Production'da synchronize kapalı, migration kullanılmalı
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      # SEC-015 (CRITICAL-002): Per-service NATS credentials — config uses gateway account
      <<: *nats-gateway-env
      JWT_PUBLIC_KEY_PATH: /etc/ssl/jwt/public.pem
      CONFIG_ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # WS10: ADR-016 Phase E Phase 1 — schema pre-applied by aqua-db-migrate.
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - *nats-ca-mount
      - *nats-clients-mount
      - *nats-client-cert-mount
      - *nats-client-key-mount
      - *jwt-public-key-mount
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  messaging-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/messaging-service:${TAG:-latest}
    container_name: aqua-messaging
    restart: unless-stopped
    environment:
      SERVICE_NAME: messaging-service
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=384'
      DATABASE_HOST: postgres
      DATABASE_SSL: "true"
      DATABASE_SSL_REJECT_UNAUTHORIZED: "false"
      DATABASE_PORT: 5432
      # SEC-015 (CRITICAL-001): Per-service DB role — messaging_service can only access messaging schema
      DATABASE_USER: ${MESSAGING_SERVICE_DB_USER:-messaging_service}
      DATABASE_PASSWORD: ${MESSAGING_SERVICE_DB_PASS:-${POSTGRES_PASSWORD:-changeme}}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DATABASE_SYNC: 'false'
      DATABASE_MIGRATIONS_RUN: 'true'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: '3'
      # SEC-015 (CRITICAL-002): Per-service NATS credentials
      <<: *nats-messaging-env
      JWT_PUBLIC_KEY_PATH: /etc/ssl/jwt/public.pem
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      # SEC-NEW02: MinIO credentials must be provided — no default fallback for object storage access
      MINIO_ACCESS_KEY: ${MINIO_USER:?MINIO_USER is required}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
      TRUST_PROXY: 'true'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://aquamonitoring.net}
    volumes:
      - *nats-ca-mount
      - *nats-clients-mount
      - *nats-client-cert-mount
      - *nats-client-key-mount
      - *jwt-public-key-mount
    networks:
      - aqua-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      # WS10: ADR-016 Phase E Phase 1 — schema pre-applied by aqua-db-migrate.
      db-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      # ARCH-HC-001: Use /health/live for Docker healthcheck (consistent with all other services).
      # /health/ready checks DB+Redis+NATS and returns 503 on partial failure — too strict for
      # Docker liveness. The gateway only needs messaging's GraphQL endpoint reachable, which
      # /health/live confirms (NestJS HTTP listener is bound = supergraph introspection will work).
      # Uses curl (shipped in the Dockerfile.backend base) — every other backend healthcheck
      # in this file uses the same command. The previous `wget -q --spider` variant assumed
      # busybox/wget was present, but the image base only includes curl. That mismatch made
      # every healthcheck execution fail with
      #   OCI runtime exec failed: exec: "wget": executable file not found in $PATH
      # and marked the container `unhealthy` while the process itself was running fine.
      test: ['CMD', 'curl', '-sf', 'http://localhost:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

