# =============================================================================
# Aquaculture Platform - Helm Values
# =============================================================================
# REQUIRED values that have no safe default are documented with REQUIRED.
# Set them via --set or a sealed-secrets / external-secrets overlay.
# Example:
#   # Generate RS256 keypair once per environment
#   infrastructure/docker/scripts/generate-jwt-keypair.sh
#   helm install aquaculture ./aquaculture \
#     -f values-production.yaml \
#     --set-file secrets.jwtPrivateKey=./certs/jwt/private.pem \
#     --set-file secrets.jwtPublicKey=./certs/jwt/public.pem \
#     --set postgresql.auth.password=$PG_PASSWORD \
#     --set redis.auth.password=$REDIS_PASSWORD

# Global settings
global:
  imageRegistry: ghcr.io
  imagePullSecrets: []
  storageClass: ""
  # NODE_ENV shared across all backend services.
  # Override in environment overlays (values-production.yaml, etc.).
  nodeEnv: production

# Common labels
commonLabels:
  app.kubernetes.io/part-of: aquaculture-platform

# Namespace — created by templates/namespace.yaml.
# Pass -n <namespace> --create-namespace when running helm install.
namespace: aquaculture

# =============================================================================
# Backend Services
# =============================================================================
# Image tags MUST be pinned to immutable versions before production deploy.
# Default "1.0.0" is a placeholder — override in your CI/CD pipeline or
# values overlay with the actual built tag / digest.

gatewayApi:
  enabled: true
  replicaCount: 3
  image:
    repository: aquaculture/gateway-api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  env:
    PORT: "3000"

authService:
  enabled: true
  replicaCount: 2
  image:
    repository: aquaculture/auth-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    JWT_EXPIRES_IN: "1h"
    REFRESH_TOKEN_EXPIRES_IN: "7d"

farmService:
  enabled: true
  replicaCount: 2
  image:
    repository: aquaculture/farm-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    # Fail closed until an operator explicitly enables ingestion and supplies
    # the company-owned MET identity below.
    FARM_ENVIRONMENT_MONITORING_ENABLED: "false"
    MET_NORWAY_APPLICATION_NAME: ""
    MET_NORWAY_CONTACT: ""
    MET_NORWAY_FROST_CLIENT_ID: ""

sensorService:
  enabled: true
  replicaCount: 3
  image:
    repository: aquaculture/sensor-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 60
  env: {}

alertEngine:
  enabled: true
  replicaCount: 2
  image:
    repository: aquaculture/alert-engine
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
