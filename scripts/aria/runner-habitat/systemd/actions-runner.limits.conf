# ARIA self-hosted runner — resource limits (HB-1 habitat, ARIA-HIGH-034).
#
# Installed by scripts/aria/provision_runner.sh to
#   /etc/systemd/system/actions.runner.<slug>.<name>.service.d/limits.conf
# and drift-checked byte-for-byte on every run. Edit HERE, not on the host.
#
# WHY these numbers. The cap is the job's own budget, not a share of a
# host: one job runs at a time, and a cycle spawns a real Claude Code CLI
# session (CLAUDE_CLI_MOCK=false) — a 1-2 GiB node process — so the earlier
# 2 GiB cap was hit 8 996 times (memory.events:max) before the 2026-09-02
# review; MemoryHigh throttles first so the job slows instead of dying at the
# wall. The host it runs on (31959 MiB, 8 CPUs, measured 2026-09-29) also
# carries the production compose stack and the operator's interactive agent
# sessions; the budgets were first sized for a 7.8 GiB droplet, since
# retired. Those sessions carry no habitat memory cap (ARIA-HIGH-247): they
# held 10.9 GB on 2026-09-29, more than any fixed per-session cap that
# leaves them working.
#
# WHY OOMPolicy=continue: the GitHub runner marks every job process
# oom_score_adj=500 (ProcessInvokerWrapper), so under GLOBAL memory
# pressure the kernel picks the job first. With the default OOMPolicy=stop
# one killed job process took the whole runner service down (systemd
# "Failed with result 'oom-kill'"), which cancelled the job AND the next
# one queued behind the restart — the 16 "cancelled" producer runs between
# 2026-08-17 and 2026-09-01. `continue` lets the job fail on its own exit
# code while the listener stays connected.
#
# WHY CPUWeight=400 and no Nice: under cgroup v2 a nice value only orders
# tasks INSIDE one cgroup, and the runner's job is alone in its cgroup —
# the old Nice=10 did nothing between the runner and its neighbours. CPU
# is shared by weight among system.slice siblings (this service plus ~35
# docker-*.scope containers, each weight 100) and, one level up, between
# system.slice and user.slice. On 2026-09-03 the first post-fix cycle sat
# 40+ minutes in one step at 20 % CPU (cpu.pressure some=53 %) while two
# interactive test suites ran. Weight 400 gives one runner job the share
# of four containers when everything is busy; CPUQuota=200% stays as the
# hard ceiling so a job can never take the box. The interactive side is
# weighted down in user.slice.d/50-aria-cpu-discipline.conf.
[Service]
CPUQuota=200%
CPUWeight=400
MemoryHigh=2300M
MemoryMax=3G
OOMPolicy=continue
