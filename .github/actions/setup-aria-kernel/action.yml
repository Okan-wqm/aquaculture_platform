name: Set up aria-kernel
description: >-
  Provide a Python that can import aria_kernel — interpreter plus the kernel's
  declared dependencies — before any step runs kernel code.

# WHY THIS EXISTS: the kernel's dependencies were installed by hand, per job,
# in every workflow that runs kernel code. Hand-ordered coupling between "a
# step imports aria_kernel" and "a step installed its dependencies" is a
# correctness requirement that nothing enforced, and it silently broke:
#
#   * `aria-daily-report.yml` ran its preflight step — which imports
#     `aria_kernel.preflight` -> `workflow_contracts` -> `yaml` — twenty-seven
#     lines BEFORE the `pip install -e aria-kernel` step. Every scheduled run
#     since 2026-07-17 died on `ModuleNotFoundError: No module named 'yaml'`,
#     so the daily anchor (the committed audit record that replaces git
#     history) stopped being produced for seventeen days.
#   * `finding-state-sweep.yml`, `rule-health-report.yml`, `aria-agent-eval.yml`
#     and `aria-runner-capability-probe.yml` import the kernel with no install
#     step at all.
#
# Copying an install block into each workflow is how they drift; nothing makes
# the copies equal except the intention that they be. One definition removes
# the class, and `tests/invariants/aria-kernel-workflow-setup.spec.ts` fails
# any job that runs kernel code without having used this action first — so the
# ordering requirement is checked at PR time instead of discovered by a
# scheduled lane going quiet.
#
# DEPENDENCIES COME FROM pyproject.toml, never from a list kept here: a second
# list would be the same duplication one level down.
#
# THE PACKAGE ITSELF IS NOT INSTALLED, and that is a rule this repo already
# had — `tests/invariants/aria-doc-runtime-ssot.spec.ts` bans
# `pip install -e aria-kernel` in the kernel workflows. Every job imports the
# kernel from the checkout via `PYTHONPATH=aria-kernel`; installing the package
# would add a second place `import aria_kernel` can resolve from, and would
# make the explicit pyproject dependency read dead code (a package install
# pulls the same dependencies implicitly, so nothing would notice if the parse
# broke). One import source, one dependency source.

inputs:
  python-version:
    description: Python interpreter version to provision.
    required: false
    default: '3.12'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install the aria-kernel declared dependencies
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --upgrade pip
        python3 - <<'PY'
        import subprocess
        import sys
        import tomllib
        from pathlib import Path

        with Path("aria-kernel/pyproject.toml").open("rb") as fh:
            dependencies = tomllib.load(fh).get("project", {}).get("dependencies", [])
        if dependencies:
            subprocess.check_call([sys.executable, "-m", "pip", "install", *dependencies])
        PY

    - name: Verify the kernel imports before any job step needs it
      shell: bash
      env:
        PYTHONPATH: aria-kernel
      run: |
        set -euo pipefail
        # Fail HERE rather than inside the first step that happens to import
        # the kernel: a missing dependency must name itself at provisioning
        # time, not surface as a ModuleNotFoundError in unrelated business
        # logic seventeen days into a silent outage.
        python3 -c "import aria_kernel, yaml; print('aria-kernel importable')"
