      PORT: 3000
      DATABASE_URL: postgres://admin_service:${ADMIN_SERVICE_DB_PASS:?ADMIN_SERVICE_DB_PASS is required}@postgres:5432/${POSTGRES_DB:-aquaculture}?sslmode=require
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: admin_service
      DATABASE_PASSWORD: ${ADMIN_SERVICE_DB_PASS:?ADMIN_SERVICE_DB_PASS is required}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DB_MIGRATE_AUTHORITATIVE: 'true'
      DATABASE_MIGRATIONS_RUN: 'false'
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: tls://nats:4222
      # SECURITY (HIGH-002): mTLS required — NATS server runs with verify: true.
      NATS_TLS_ENABLED: 'true'
      NATS_TLS_CA: /etc/ssl/nats/ca-cert.pem
      # SECURITY (HIGH-002 / V4): dedicated CN=admin_api_service. The public
      # gateway cannot publish admin lifecycle or erasure-proof events.
      NATS_TLS_CERT: /etc/ssl/nats/clients/admin_api_service-cert.pem
      NATS_TLS_KEY: /etc/ssl/nats/clients/admin_api_service-key.pem
      # SECURITY (CRITICAL-001): RS256 public-key verification (consumer only).
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
