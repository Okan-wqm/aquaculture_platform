[package]
name = "event-contracts-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Rust binding for @platform/event-contracts. Mirrors the TS event interfaces (libs/event-contracts/src/) byte-for-byte on the JSON wire so the Rust ingestion sidecar publishes events indistinguishable from NestJS producers. Enforces ADR-006 flat event pattern and a branded EventId at compile time."

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
secrecy = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# `serde_json::Value` is reused in tests for hand-crafted JSON
# compatibility checks against the TypeScript SSoT.
serde_json = { workspace = true }

[lints]
workspace = true
