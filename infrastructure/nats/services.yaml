# ============================================================================
# NATS Per-Service Identity + ACL Registry — SINGLE SOURCE OF TRUTH (ADR-015)
# ============================================================================
#
# Every NATS client identity is the mTLS client cert CN (verify_and_map).
# `application` binds that certificate identity to exactly one runtime app.
# Sharing a certificate between runtimes is forbidden: the generator and CI
# validate this mapping and deployment consumes the same registry.
# This file drives BOTH:
#   - infrastructure/docker/nats/nats.conf authorization users[] block
#     (regenerate: scripts/nats/generate-nats-conf.py — same commit, always)
#   - infrastructure/docker/scripts/generate-internal-certs.sh CN list
#     (reads this file directly at runtime)
#
# # Subject-space conventions (ORPHAN-HIGH-317 — canonical scheme)
#
#   - events.{tenantId}.{EventType} / events.system.{EventType}
#       Domain events via @platform/event-bus (NatsEventBus.deriveSubject).
#       A publish grant is `events.*.{EventType}` — the single `*` token
#       matches every tenantId AND the literal `system` segment.
#   - events.platform.schema-migration.>   migration-runner audit sink
#   - events.security.events.>             SecurityEventService sink
#   - commands.{service}.{command}         cross-service command subjects
#   - request.{service}.{...}              NestJS request-reply RPC (core NATS)
#   - sensor.lookup.by-topic               Rust sidecar cache-miss RPC (ADR-029)
#   - st.language.>                        ST Language IDE bridge
#   - policy.ingest_backend.>              dynamic policy fan-out (ADR-027/031)
#   - $JS.API.> + _INBOX.>                 JetStream API + request-reply inboxes
#
# The legacy `AQUACULTURE_EVENTS.<Type>.>` grant scheme is BANNED (and
# structurally rejected by services.schema.json): AQUACULTURE_EVENTS is the
# JetStream STREAM NAME, never a subject prefix — no code ever published
# there, so every grant written in that scheme was dead weight that silently
# denied the real events.* publishes (ORPHAN-HIGH-317: every auth-service
# domain event was refused by the broker with Permissions Violation).
#
# # Consumption model (why subscribe lists are short)
#
#   Domain-event consumption goes through JetStream PULL consumers
#   (NatsEventBus.createSubscription): the client only needs $JS.API.> +
#   _INBOX.> — per-subject subscribe grants are NOT consulted for pull
#   consumers. Subject-level subscribe grants are therefore listed ONLY for
#   CORE NATS subscriptions: @MessagePattern/@EventPattern handlers
#   (request.*, events.> bridges), st.language.>, policy snapshots and the
#   sensor.lookup responder. CI invariant: e2e/tests/integration/
#   nats-invariants.spec.ts (publish-coverage + RPC-coverage + scheme ban).
#
version: 1

services:
  # ---------------------------------------------------------------------------
  # auth-service: tenant/user/JWT lifecycle
  # ---------------------------------------------------------------------------
  - name: auth_service
    application: auth-service
    description: Authentication — tenant and user lifecycle, JWT issuance, invitations, password reset
    publish:
      - 'events.*.AccessTokenInvalidationRequested'
      - 'events.*.InvitationAccepted'
      - 'events.*.PasswordResetCompleted'
      - 'events.*.PasswordResetRequested'
      - 'events.*.TenantStatusChanged'
      - 'events.*.UserAccountLocked'
      - 'events.*.UserAccessTokenInvalidationRequested'
      - 'events.*.UserDeleted'
      - 'events.*.UserInvited'
      - 'events.*.UserLoggedIn'
      - 'events.*.UserPasswordChanged'
      - 'events.*.UserProfileUpdated'
      - 'events.platform.schema-migration.>'
      - 'events.security.events.>'
      - 'request.farm.validateSiteAssignment'
      - '$JS.API.>'
      - '_INBOX.>'
    subscribe:
      - 'request.auth.user.validateTenantMembership'
      - 'request.auth.>'
      - '$JS.API.>'
      - '_INBOX.>'

