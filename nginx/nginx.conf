# =============================================================================
# Aquaculture Platform - Production Server Configuration
# Place this in /etc/nginx/conf.d/default.conf
#
# ARCH-NM-DNS: Uses Docker internal DNS resolver (127.0.0.11) with variable-
# based proxy_pass to re-resolve container hostnames dynamically. This prevents
# stale DNS cache when containers are recreated with new IPs.
# =============================================================================

# ARCH-NM-DNS: Docker internal DNS resolver with 10s TTL cache.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# WebSocket upgrade map (SEC-NM-008: fix Connection header conflict)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# MFE cache control map: remoteEntry.js = no-cache, /assets/ = immutable, rest = default
map $uri $mfe_cache_control {
    default                "";
    "~*remoteEntry\.js$"   "no-cache, no-store, must-revalidate";
    "~*/assets/"           "public, max-age=31536000, immutable";
}

# CORS origin allowlist map (SEC-NM-004: replace wildcard CORS)
map $http_origin $cors_origin {
    default                     "";
    "https://app.suderra.com"   "https://app.suderra.com";
    "https://m.suderra.com"     "https://m.suderra.com";
}

# ==========================================================================
# HTTP -> HTTPS Redirect (Port 80)
# ==========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Security: Hide nginx version
    server_tokens off;

    # Health check endpoint (keep on HTTP for internal monitoring)
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Block metrics from public traffic (SEC-NM-005)
    location /metrics {
        deny all;
        return 403;
    }

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================================================
# Main Application Server (HTTPS - Port 443)
# ==========================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # SSL certificates
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security: Hide nginx version
    server_tokens off;

    # Request body limit (SEC-NM-016)
    client_max_body_size 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # SEC-NM-014: X-XSS-Protection removed (deprecated); CSP provides equivalent protection
    # D14-SC-02: unsafe-inline and unsafe-eval removed from script-src; Vite production builds emit no inline scripts
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; script-src-elem 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; worker-src 'self' blob:; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://server.arcgisonline.com https://*.basemaps.cartocdn.com; connect-src 'self' wss: https://cdn.jsdelivr.net https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    # SEC-NM-015: Permissions-Policy added
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # BUG-17: Health probe endpoint for connectivity checks.
    # AquaMobil useNetworkStatus probes GET /health/live to detect server reachability.
    # This lightweight static response avoids proxying to the gateway for simple
    # connectivity detection. Prefix match covers /health, /health/live, /health/ready.
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Block /metrics from public traffic (SEC-NM-005)
    location /metrics {
        deny all;
        return 403;
    }

    # Socket.IO WebSocket proxy (all namespaces: /farms, /messaging, /sensors, /st-language)
    location /socket.io/ {
        set $backend_gw_ws gateway-api;
        proxy_pass http://$backend_gw_ws:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # GraphQL API (SEC-NM-008: use map-based Connection header)
    location /graphql {
        # ARCH-017: Apply rate limiting (zones defined in http block above)
        limit_req zone=api burst=50 nodelay;

        set $backend_gw_gql gateway-api;
        proxy_pass http://$backend_gw_gql:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for subscriptions (SEC-NM-008: fixed duplicate Connection header)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    # REST API (full path forwarded to gateway)
    location /api/ {
        # ARCH-017: Apply rate limiting (zones defined in http block above)
        limit_req zone=api burst=50 nodelay;

        set $backend_gw_api gateway-api;
        proxy_pass http://$backend_gw_api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Mobile PWA (AquaMobil) - /mobile path (path stripping: /mobile/foo → /foo)
    location /mobile/ {
        set $backend_mobile aquamobil;
        rewrite ^/mobile/(.*) /$1 break;
        proxy_pass http://$backend_mobile:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Microfrontend modules (path stripping: /mf/<module>/foo → /foo)
    location /mf/dashboard/ {
        set $backend_dashboard dashboard;
        rewrite ^/mf/dashboard/(.*) /$1 break;
        proxy_pass http://$backend_dashboard:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mf/farm/ {
        set $backend_farm farm-module;
        rewrite ^/mf/farm/(.*) /$1 break;
        proxy_pass http://$backend_farm:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mf/hr/ {
        set $backend_hr hr-module;
        rewrite ^/mf/hr/(.*) /$1 break;
        proxy_pass http://$backend_hr:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mf/sensor/ {
        set $backend_sensor sensor-module;
        rewrite ^/mf/sensor/(.*) /$1 break;
        proxy_pass http://$backend_sensor:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mf/admin/ {
        set $backend_admin admin-panel;
        rewrite ^/mf/admin/(.*) /$1 break;
        proxy_pass http://$backend_admin:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mf/tenant/ {
        set $backend_tenant tenant-admin;
        rewrite ^/mf/tenant/(.*) /$1 break;
        proxy_pass http://$backend_tenant:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mf/hydroponics/ {
        set $backend_hydro hydroponics-module;
        rewrite ^/mf/hydroponics/(.*) /$1 break;
        proxy_pass http://$backend_hydro:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================================================================
    # Production remotes - Shell build uses /remotes/ prefix for Module Federation
    # Cache policy via $mfe_cache_control map:
    #   remoteEntry.js  -> no-cache (always fetch latest)
    #   /assets/        -> immutable, 1 year (content-hashed filenames)
    # =========================================================================

    location /remotes/dashboard/ {
        set $backend_rem_dashboard dashboard;
        rewrite ^/remotes/dashboard/(.*) /$1 break;
        proxy_pass http://$backend_rem_dashboard:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control $mfe_cache_control;
    }

    location /remotes/farm-module/ {
        set $backend_rem_farm farm-module;
        rewrite ^/remotes/farm-module/(.*) /$1 break;
        proxy_pass http://$backend_rem_farm:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control $mfe_cache_control;
    }

    location /remotes/hr-module/ {
        set $backend_rem_hr hr-module;
        rewrite ^/remotes/hr-module/(.*) /$1 break;
        proxy_pass http://$backend_rem_hr:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control $mfe_cache_control;
    }

    location /remotes/sensor-module/ {
        set $backend_rem_sensor sensor-module;
        rewrite ^/remotes/sensor-module/(.*) /$1 break;
        proxy_pass http://$backend_rem_sensor:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control $mfe_cache_control;
    }

    location /remotes/hydroponics-module/ {
        set $backend_rem_hydro hydroponics-module;
        rewrite ^/remotes/hydroponics-module/(.*) /$1 break;
        proxy_pass http://$backend_rem_hydro:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control $mfe_cache_control;
    }

    location /remotes/admin-panel/ {
        set $backend_rem_admin admin-panel;
        rewrite ^/remotes/admin-panel/(.*) /$1 break;
        proxy_pass http://$backend_rem_admin:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control $mfe_cache_control;
    }

    location /remotes/tenant-admin/ {
        set $backend_rem_tenant tenant-admin;
        rewrite ^/remotes/tenant-admin/(.*) /$1 break;
        proxy_pass http://$backend_rem_tenant:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control $mfe_cache_control;
    }

    # Shell (main frontend) - catch all
    location / {
        set $backend_shell shell;
        proxy_pass http://$backend_shell:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ==========================================================================
# Mobile App Subdomain HTTP -> HTTPS Redirect
# ==========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name m.* mobile.*;

    # Security: Hide nginx version
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Block metrics from public traffic (SEC-NM-005)
    location /metrics {
        deny all;
        return 403;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================================================
# Mobile App Subdomain (m.domain.com or mobile.domain.com) - HTTPS
# ARCH-NM-011: Complete header set to match main server block
# ==========================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name m.* mobile.*;

    # SSL certificates
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security: Hide nginx version
    server_tokens off;

    # Request body limit (SEC-NM-016)
    client_max_body_size 10m;

    # Security Headers (ARCH-NM-011: aligned with main server block)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # SEC-NM-014: X-XSS-Protection removed (deprecated)
    # D14-SC-02: unsafe-inline and unsafe-eval removed from script-src; Vite production builds emit no inline scripts
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; script-src-elem 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; worker-src 'self' blob:; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://server.arcgisonline.com https://*.basemaps.cartocdn.com; connect-src 'self' wss: https://cdn.jsdelivr.net https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    # SEC-NM-015: Permissions-Policy added
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=()" always;

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Block /metrics from public traffic (SEC-NM-005)
    location /metrics {
        deny all;
        return 403;
    }

    # GraphQL API proxy
    # SEC-NM-009: rate limiting added; SEC-NM-008: fixed Connection header
    location /graphql {
        limit_req zone=api burst=50 nodelay;

        set $backend_mobile_gql gateway-api;
        proxy_pass http://$backend_mobile_gql:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for subscriptions
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    # Mobile PWA
    location / {
        set $backend_mobile_app aquamobil;
        proxy_pass http://$backend_mobile_app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
