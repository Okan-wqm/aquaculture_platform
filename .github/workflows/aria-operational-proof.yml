name: ARIA Operational Proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aria-operational-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    # Measured hosted suite time has exceeded 45 minutes, and the observe
    # burn-in adds about 19 minutes. Include setup and variance headroom.
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
          fetch-depth: '0'

      - name: Set up ARIA kernel
        uses: ./.github/actions/setup-aria-kernel

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Compile ARIA kernel
        run: npm run aria:compile

      - name: Run ARIA unit and invariant suite
        run: npm run aria:test:unit

      - name: Run ARIA docs/runtime SSoT invariant
        run: npm run aria:docs:ssot

      - name: Persist enterprise workflow preflight
        env:
          PROOF_DIR: ${{ runner.temp }}/aria-operational-proof
          PROOF_TOOLS_DIR: ${{ runner.temp }}/aria-operational-proof-tools
          PROOF_WORKSPACES_DIR: ${{ runner.temp }}/aria-operational-proof-workspaces
          PYTHONPATH: aria-kernel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          from aria_kernel.preflight import verify_workflow_preflight

          proof_dir = Path(os.environ["PROOF_DIR"])
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          verdict = verify_workflow_preflight(
              workflow_id="aria-operational-proof",
              job_id="proof",
              profile="strict",
              workspace_root=os.environ["GITHUB_WORKSPACE"],
              allowed_write_roots=[
                  str(workspace / ".aria-state-store"),
                  str(workspace / ".aria-state-store.writers.jsonl"),
                  str(runner_temp / "aria-state-checkout.json"),
                  str(runner_temp / "aria-state-checkout.json.err"),
                  str(proof_dir),
                  os.environ["PROOF_TOOLS_DIR"],
                  os.environ["PROOF_WORKSPACES_DIR"],
              ],
              path_allowlist=[
                  str(workspace / ".aria-state-store"),
                  str(workspace / ".aria-state-store.writers.jsonl"),
                  str(runner_temp / "aria-state-checkout.json"),
                  str(runner_temp / "aria-state-checkout.json.err"),
                  str(proof_dir),
                  os.environ["PROOF_TOOLS_DIR"],
                  os.environ["PROOF_WORKSPACES_DIR"],
              ],
              external_root_allowlist=[str(runner_temp.resolve())],
              network_policy=["github_artifact", "github_git"],
              network_enforcement_evidence="canonical aria/state restore and final artifact upload",
              token_provenance="github_actions_artifact_token",
              require_github_app=False,
              dlp_mode="fail_closed",
              dlp_scan_clean=True,
              audit_reason="persist ARIA observe burn-in proof artifact",
              audit_artifact_path=proof_dir / "workflow-preflight.json",
          )
          if not verdict.valid:
              raise SystemExit(";".join(verdict.reasons))
          PY

      - name: Restore ARIA state from the aria/state branch
        id: restore_state
        uses: ./.github/actions/restore-aria-state
        with:
          bind-tools-root: 'false'

      - name: Require published ARIA state restore
        env:
          RESTORED: ${{ steps.restore_state.outputs.restored }}
          BOOTSTRAP: ${{ steps.restore_state.outputs.bootstrap }}
        run: |
          set -euo pipefail
          if [ "$RESTORED" != "true" ] || [ -n "$BOOTSTRAP" ]; then
            echo "::error::Operational Proof requires an existing published aria/state tip." >&2
            exit 1
          fi

      - name: Verify restored ARIA state reference
        env:
          PYTHONPATH: 'aria-kernel:.'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m aria_kernel.operational_proof capture-state --stage initial \
            --repo-root "$GITHUB_WORKSPACE" \
            --proof-root "$RUNNER_TEMP/aria-operational-proof" \
            --target-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Run observe burn-in proof
        env:
          ARIA_DRY_RUN: 'true'
          CLAUDE_CODE_MOCK: 'true'
          # Step-wide so every burn, verification, and failure-summary CLI
          # resolves the checked-out aria_kernel package consistently.
          PYTHONPATH: 'aria-kernel:.'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail

          export PROOF_DIR="$RUNNER_TEMP/aria-operational-proof"
          export TOOLS_DIR="$RUNNER_TEMP/aria-operational-proof-tools"
          export WORKSPACE_BASE="$RUNNER_TEMP/aria-operational-proof-workspaces"
          export BURN_IN_OUTPUT_DIR="$TOOLS_DIR/burn-in/operational-proof"
          mkdir -p "$PROOF_DIR" "$TOOLS_DIR" "$WORKSPACE_BASE"

          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel:. python3 -m aria_kernel \
            integrity migrate-tools-bootstrap \
            --tools-dir "$TOOLS_DIR" \
            --workspace-root "$GITHUB_WORKSPACE" \
            --acknowledge \
            --reason "gha observe burn-in bootstrap"

          set +e
          BURN_STATUS=0
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel:. python3 -m aria_kernel \
            autonomy burn-in observe \
            --tools-dir "$TOOLS_DIR" \
            --workspace-root "$GITHUB_WORKSPACE" \
            --workspace-base "$WORKSPACE_BASE" \
            --target-ref "$GITHUB_SHA" \
            --cycles 30 \
            --min-valid-cycles 20 \
            --output-dir "$BURN_IN_OUTPUT_DIR" || BURN_STATUS=$?

          POSTPROCESS_STATUS=0
          if [ -d "$BURN_IN_OUTPUT_DIR" ]; then
            cp -R "$BURN_IN_OUTPUT_DIR"/. "$PROOF_DIR"/ || POSTPROCESS_STATUS=$?
          fi
          if [ -f "$PROOF_DIR/autonomy-burn-in-report.json" ] && \
             [ -f "$PROOF_DIR/evidence-bundle.json" ]; then
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel:. python3 -c \
              'from aria_kernel.burn_in import verify_burn_in_artifact_bundle; import os; verify_burn_in_artifact_bundle(os.environ["PROOF_DIR"])' \
              || POSTPROCESS_STATUS=$?
          else
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel:. \
              python3 -m aria_kernel.operational_proof write-failure-summary \
              --proof-root "$PROOF_DIR" \
              --phase burn_in \
              --exit-status "$BURN_STATUS" || POSTPROCESS_STATUS=$?
          fi
          if [ "$BURN_STATUS" -ne 0 ]; then
            exit "$BURN_STATUS"
          fi
          exit "$POSTPROCESS_STATUS"

      - name: Verify post-run source and state immutability
        if: always()
        env:
          PYTHONPATH: 'aria-kernel:.'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m aria_kernel.operational_proof capture-state --stage final \
            --repo-root "$GITHUB_WORKSPACE" \
            --proof-root "$RUNNER_TEMP/aria-operational-proof" \
            --target-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Write ARIA operational proof manifest
        if: always()
        env:
          PYTHONPATH: 'aria-kernel:.'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m aria_kernel.operational_proof write-manifest \
            --proof-root "$RUNNER_TEMP/aria-operational-proof" \
            --target-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Scan staged ARIA operational proof for secrets
        id: dlp
        if: always()
        env:
          PYTHONPATH: 'aria-kernel:.'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m aria_kernel.operational_proof scan-dlp \
            --proof-root "$RUNNER_TEMP/aria-operational-proof"

      - name: Verify complete ARIA operational proof
        if: always()
        env:
          PYTHONPATH: 'aria-kernel:.'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m aria_kernel.operational_proof verify \
            --proof-root "$RUNNER_TEMP/aria-operational-proof" \
            --expected-target-sha "$GITHUB_SHA" \
            --expected-workflow-run-id "$GITHUB_RUN_ID" \
            --expected-workflow-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload ARIA operational proof
        if: ${{ always() && steps.dlp.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-operational-proof-${{ github.sha }}
          path: ${{ runner.temp }}/aria-operational-proof/
          if-no-files-found: error
          retention-days: 365
