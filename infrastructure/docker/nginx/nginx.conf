# =============================================================================
# Aquaculture Platform - Nginx Main Configuration
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Security: Hide nginx version from response headers
    server_tokens off;

    # End-to-end correlation ID (Task #18).
    # Preserve an incoming X-Correlation-Id from the client; if absent, fall back
    # to nginx's per-request $request_id so EVERY request carries one id at the
    # edge. $correlation_id is then (a) logged in json_combined below and
    # (b) forwarded upstream as the X-Correlation-Id header (see conf.d server
    # blocks). The downstream gateway (CorrelationIdMiddleware) and every
    # subgraph (RequestContextMiddleware -> StructuredLoggerService) read the
    # `x-correlation-id` header to populate the `correlationId` field on their
    # JSON log lines, so the edge log line and the app log lines share one id.
    # Header name is x-correlation-id to match the platform SSoT — do NOT rename.
    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format json_combined escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"correlation_id":"$correlation_id",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';

    access_log /var/log/nginx/access.log json_combined;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/wasm;

    # Security headers (will be added per location)
    map $sent_http_content_type $cors_header {
        default "";
        "application/javascript" "*";
        "text/css" "*";
    }

    # SEC-NM-010: Extract real client IP from CDN/proxy X-Forwarded-For header.
    # If behind Cloudflare, add their published IP ranges here.
    # This ensures rate limiting zones use the actual client IP, not the CDN IP.
    # Uncomment and update with your CDN's IP ranges when behind a CDN:
    # set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 103.22.200.0/22;
    # set_real_ip_from 103.31.4.0/22;
    # set_real_ip_from 104.16.0.0/13;
    # set_real_ip_from 104.24.0.0/14;
    # set_real_ip_from 108.162.192.0/18;
    # set_real_ip_from 131.0.72.0/22;
    # set_real_ip_from 141.101.64.0/18;
    # set_real_ip_from 162.158.0.0/15;
    # set_real_ip_from 172.64.0.0/13;
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 188.114.96.0/20;
    # set_real_ip_from 190.93.240.0/20;
    # set_real_ip_from 197.234.240.0/22;
    # set_real_ip_from 198.41.128.0/17;
    # real_ip_header CF-Connecting-IP;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=static:10m rate=500r/s;

    # Request body size limit (SEC-NM-016: explicit policy)
    client_max_body_size 10m;

    # Include server configs
    include /etc/nginx/conf.d/*.conf;
}
