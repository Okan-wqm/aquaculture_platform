name: 'Mint automation GitHub App token'
description: 'Mints and verifies a least-privilege, current-repository-only automation token'

inputs:
  client-id:
    description: 'Expected automation GitHub App client ID'
    required: true
  private-key:
    description: 'Automation GitHub App private key'
    required: true
  expected-app-slug:
    description: 'Expected automation GitHub App slug'
    required: true
  expected-installation-id:
    description: 'Expected automation GitHub App installation ID'
    required: true

outputs:
  token:
    description: 'Verified current-repository-only installation access token'
    value: ${{ steps.mint.outputs.token }}
  app-slug:
    description: 'Verified GitHub App slug'
    value: ${{ steps.mint.outputs.app-slug }}
  installation-id:
    description: 'Verified GitHub App installation ID'
    value: ${{ steps.mint.outputs.installation-id }}

runs:
  using: 'composite'
  steps:
    - name: Verify immutable repository context
      shell: bash
      env:
        ACTUAL_REPOSITORY: ${{ github.repository }}
        ACTUAL_REPOSITORY_ID: ${{ github.repository_id }}
        ACTUAL_REPOSITORY_NAME: ${{ github.event.repository.name }}
        EXPECTED_APP_SLUG: ${{ inputs.expected-app-slug }}
        EXPECTED_INSTALLATION_ID: ${{ inputs.expected-installation-id }}
      run: |
        set -euo pipefail

        if [ "${ACTUAL_REPOSITORY}" != "Okan-wqm/aquaculture_platform" ] ||
          [ "${ACTUAL_REPOSITORY_ID}" != "1132698735" ] ||
          [ "${ACTUAL_REPOSITORY_NAME}" != "aquaculture_platform" ]; then
          echo "::error::Automation token authority is bound to Okan-wqm/aquaculture_platform (1132698735)." >&2
          exit 1
        fi
        if ! [[ "${EXPECTED_APP_SLUG}" =~ ^[a-z0-9][a-z0-9-]{0,99}$ ]]; then
          echo "::error::ARIA_GITHUB_APP_SLUG has an invalid canonical shape." >&2
          exit 1
        fi
        if ! [[ "${EXPECTED_INSTALLATION_ID}" =~ ^[1-9][0-9]{0,19}$ ]]; then
          echo "::error::ARIA_GITHUB_APP_INSTALLATION_ID must be a positive integer." >&2
          exit 1
        fi

    - name: Mint least-privilege installation token
      id: mint
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: Okan-wqm
        repositories: aquaculture_platform
        permission-actions: read
        permission-contents: write
        permission-pull-requests: write

    - name: Verify installation identity and repository scope
      shell: bash
      env:
        GH_TOKEN: ${{ steps.mint.outputs.token }}
        ACTUAL_APP_SLUG: ${{ steps.mint.outputs.app-slug }}
        ACTUAL_INSTALLATION_ID: ${{ steps.mint.outputs.installation-id }}
        EXPECTED_APP_SLUG: ${{ inputs.expected-app-slug }}
        EXPECTED_INSTALLATION_ID: ${{ inputs.expected-installation-id }}
      run: |
        set -euo pipefail

        if [ "${ACTUAL_APP_SLUG}" != "${EXPECTED_APP_SLUG}" ]; then
          echo "::error::Minted token app slug does not match ARIA_GITHUB_APP_SLUG." >&2
          exit 1
        fi
        if [ "${ACTUAL_INSTALLATION_ID}" != "${EXPECTED_INSTALLATION_ID}" ]; then
          echo "::error::Minted token installation does not match ARIA_GITHUB_APP_INSTALLATION_ID." >&2
          exit 1
        fi

        viewer_login="$(
          gh api graphql \
            -f query='{ viewer { login } }' \
            --jq '.data.viewer.login'
        )"
        if [ "${viewer_login}" != "${EXPECTED_APP_SLUG}[bot]" ]; then
          echo "::error::Minted token principal does not match ARIA_GITHUB_APP_SLUG." >&2
          exit 1
        fi

        scope_file="$(mktemp "${RUNNER_TEMP:?RUNNER_TEMP is required}/automation-app-scope.XXXXXX.json")"
        cleanup_scope_file() {
          rm -f -- "${scope_file}"
        }
        trap cleanup_scope_file EXIT

        gh api \
          --method GET \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "/installation/repositories?per_page=2" \
          > "${scope_file}"

        SCOPE_FILE="${scope_file}" node <<'NODE'
        const fs = require('node:fs');

        const scope = JSON.parse(fs.readFileSync(process.env.SCOPE_FILE, 'utf8'));
        const repositories = Array.isArray(scope.repositories) ? scope.repositories : [];
        const repository =
          repositories.length === 1 && typeof repositories[0] === 'object'
            ? repositories[0]
            : null;
        const valid =
          scope.total_count === 1 &&
          repositories.length === 1 &&
          repository !== null &&
          repository.id === 1132698735 &&
          repository.name === 'aquaculture_platform' &&
          repository.full_name === 'Okan-wqm/aquaculture_platform';

        if (!valid) {
          process.stderr.write(
            '::error::Minted GitHub App token is not scoped to exactly ' +
              'Okan-wqm/aquaculture_platform (1132698735).\n',
          );
          process.exit(1);
        }
        NODE
