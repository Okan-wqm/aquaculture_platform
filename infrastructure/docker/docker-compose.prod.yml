  admin-panel:
    image: ghcr.io/okan-wqm/aquaculture_platform/admin-panel:latest
    container_name: aqua-admin-panel
    restart: unless-stopped
    networks:
      - aqua-network

  tenant-admin:
    image: ghcr.io/okan-wqm/aquaculture_platform/tenant-admin:latest
    container_name: aqua-tenant-admin
    restart: unless-stopped
    networks:
      - aqua-network

  aquamobil:
    image: ghcr.io/okan-wqm/aquaculture_platform/aquamobil:latest
    container_name: aqua-mobile
    restart: unless-stopped
    networks:
      - aqua-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Reverse Proxy (Nginx)
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: aqua-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot:/var/www/certbot:ro
    depends_on:
      - gateway-api
      - shell
      - aquamobil
    networks:
      - aqua-network
    healthcheck:
      # ARCH-012: Use /health (nginx-level endpoint) — nginx has no /health/live path
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
