{{/*
=============================================================================
Aquaculture Platform - Backend Services
=============================================================================
*/}}

{{- /* Auth Service */}}
{{- if .Values.authService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aquaculture.fullname" . }}-auth-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aquaculture.backendLabels" . | nindent 4 }}
    app: auth-service
spec:
  replicas: {{ .Values.authService.replicaCount }}
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: backend
    spec:
      serviceAccountName: {{ include "aquaculture.fullname" . }}-auth-service
      automountServiceAccountToken: false
      {{- include "aquaculture.podSecurityContext" . | nindent 6 }}
      containers:
        - name: auth-service
          image: {{ include "aquaculture.image" (dict "global" .Values.global "image" .Values.authService.image) }}
          imagePullPolicy: {{ .Values.authService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.authService.service.targetPort }}
          env:
            {{- include "aquaculture.backendEnv" . | nindent 12 }}
            {{- include "aquaculture.natsServiceEnv" (list . "auth_service") | nindent 12 }}
            {{- /*
              SECURITY (CRITICAL-001): JWT_PRIVATE_KEY injected ONLY into auth-service.
              Auth-service is the sole RS256 token issuer. Every other backend service
              receives JWT_PUBLIC_KEY via backendEnv for verification only.
            */}}
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aquaculture.fullname" . }}-secrets
                  key: jwtPrivateKey
            # SECURITY (HIGH-006): password pepper for HMAC-layered bcrypt.
            - name: PASSWORD_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ include "aquaculture.fullname" . }}-secrets
                  key: passwordPepper
            - name: MFA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aquaculture.fullname" . }}-secrets
                  key: mfaEncryptionKey
            - name: JWT_EXPIRES_IN
              value: {{ .Values.authService.env.JWT_EXPIRES_IN | quote }}
            - name: REFRESH_TOKEN_EXPIRES_IN
              value: {{ .Values.authService.env.REFRESH_TOKEN_EXPIRES_IN | quote }}
          volumeMounts:
            {{- include "aquaculture.natsServiceVolumeMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.authService.resources | nindent 12 }}
          {{- include "aquaculture.livenessProbe" (dict "Values" .Values "port" .Values.authService.service.targetPort) | nindent 10 }}
          {{- include "aquaculture.readinessProbe" (dict "Values" .Values "port" .Values.authService.service.targetPort) | nindent 10 }}
          {{- include "aquaculture.securityContext" . | nindent 10 }}
      volumes:
        {{- include "aquaculture.natsServiceVolume" (list . "auth_service") | nindent 8 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aquaculture.fullname" . }}-auth-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aquaculture.labels" . | nindent 4 }}
    app: auth-service
spec:
  type: {{ .Values.authService.service.type }}
  ports:
    - port: {{ .Values.authService.service.port }}
      targetPort: {{ .Values.authService.service.targetPort }}
      name: http
  selector:
    app: auth-service

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aquaculture.fullname" . }}-auth-service-pdb
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aquaculture.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth-service
{{- end }}

