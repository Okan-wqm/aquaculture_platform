name: ARIA State Maintenance

# =============================================================================
# Why this exists: the aria/state branch accumulated 842MB of historical
# data (runs, raw-findings, hot artifacts). The nightly cycle OOMs on
# restore because cloning 842MB on a 7.8GB shared runner exceeds memory.
# The auto-compact at cycle-end never fires because the cycle can't
# complete — a catch-22.
#
# This lane breaks the loop: it runs INDEPENDENTLY of the cycle (on a
# GitHub-hosted runner with no memory constraint), compacts the state,
# and pushes the slim branch. The cycle then restores a small state.
#
# It also cleans hot artifacts — the single biggest contributor (529MB
# from old cycles' tool_run.json files) that the JSONL-only compact
# never touched.
#
# ONE PUBLISHER. This lane used to commit its result itself — `git add -A`,
# `git commit`, `git push origin HEAD:aria/state` — and that second publish
# path is what stalled the branch. A whole-tree add admits everything the
# store's writers leave on disk: the `*.lock` side-cars `file_lock` keeps
# by design, `repo_identity.json`, `integrity_index.json`. Tip 84032eda1
# (2026-09-11) carried sixteen of those side-cars, and the kernel's publish
# — which stages only the surfaces its snapshot attests and verifies the
# committed tree against that snapshot — inherited them through the index,
# was refused by its own verifier, and soft-reset. No kernel publish landed
# after 2026-09-04. The same commits also shipped a STALE snapshot.json:
# compaction rewrote the ledgers and nothing rebuilt the attestation, so
# the full verifier refused the tip as state_snapshot_surface_mismatch.
#
# The lane now publishes through `aria_kernel state publish`, the verb every
# other lane uses: a fresh snapshot.json built from the compacted tree, the
# bounded pathspec, the inherited-entry healing (state_tree_contract) and the
# immutable verification, then a fast-forward push of the verified commit.
# tests/invariants/aria-single-publish-path.spec.ts pins that no lane pushes
# aria/state any other way.
# =============================================================================

on:
  schedule:
    # 15:13 UTC daily — two hours before the 17:13 UTC cycle
    - cron: '13 15 * * *'
  workflow_dispatch:
    inputs:
      retain_days:
        description: 'Days of data to retain (default 7)'
        default: '7'
        required: false
      state_reduction_ack:
        # ONE-SHOT, OPERATOR-TYPED, PUBLISH-STEP ONLY. A scheduled run has no
        # input, so the continuity gate stays fail-closed: the only losses
        # it accepts are the ones this run's compaction attested. An
        # operator types the acknowledgement here for exactly one run when
        # the tip carries losses nothing attested — the 2026-09 tip's stale
        # manifest still claimed hot artifacts an earlier sweep had removed
        # — and the value reaches `state publish` alone, never the restore,
        # so it cannot create the branch (docs/runbooks/aria-state-branch-bootstrap.md).
        # The value must name THIS repository (`owner/repo`), exactly as the
        # bootstrap ack must; the publish refuses any other string by name,
        # and it records the acceptance — the surfaces and the ack — on the
        # governance ledger inside the commit it accepts
        # (state_publish_losses_accepted_by_ack), so the reduction is on the
        # branch's own audit trail, not only in this run's log.
        description: 'Acknowledge an unattested state reduction for THIS run only: the repository name (owner/repo); leave empty on every normal run'
        default: ''
        required: false

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: aria-state-maintenance
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-aria-kernel

      # ORPHAN-CRITICAL-807 — the store is materialised by the ONE restore
      # path every lane uses, not by a raw clone. A raw `git clone` of
      # aria/state yields a tools root full of covered state with no
      # identity: the branch does not carry repo_identity.json (declaring it
      # there is the tempting wrong fix, see state_manifest.py), and
      # ensure_tools_dir deliberately refuses to stamp one onto a directory
      # that already holds state — that guard is what stops /tmp/rogue from
      # resolving as canonical. Every declared-ledger read inside the clone
      # then failed with declared_jsonl_unknown_surface, which is exactly
      # what killed run 33946356386 one step after the routing fix.
      #
      # The restore action does the two things a clone cannot: `state
      # checkout` binds the branch as a worktree beside the repo, and
      # `integrity bind-tools-root` mints this host's identity. It reads the
      # credential from its own step environment, never .git/config, and
      # exports the tools root as ARIA_TOOLS_DIR. No bootstrap-ack is passed
      # on purpose: a missing branch must be REFUSED here, not created.
      # tests/invariants/aria-single-restore-path.spec.ts pins that there is
      # exactly one materialiser — a hand-copied checkout in this lane would
      # be the RC-6 drift shape the restore action was extracted to end.
      - uses: ./.github/actions/restore-aria-state

      - name: Compact surfaces and strip old artifacts (canonical CLI)
        # ARIA-AUDIT-001: this step used to carry an INLINE copy of the
        # compactor. It silently skipped malformed lines, rewrote ledgers
        # without re-chaining the hash chain, and pushed the result green —
        # a second implementation drifting from the kernel's. The lane now
        # runs the one canonical compactor (aria_kernel.state_compact via
        # the CLI), which fails on malformed rows, re-chains every rewrite,
        # archives pristine stripped rows, and records a governance event.
        # JSONL surfaces AND the hot-artifact/FATES cleanup live there.
        env:
          RETAIN_DAYS: ${{ github.event.inputs.retain_days || '7' }}
        run: |
          set -euo pipefail
          test -n "${ARIA_TOOLS_DIR:-}"
          test -f "${ARIA_TOOLS_DIR}/repo_identity.json"
          BEFORE=$(du -sb "${ARIA_TOOLS_DIR}/" | cut -f1)
          PYTHONPATH=aria-kernel python3 -m aria_kernel state compact \
            --tools-dir "${ARIA_TOOLS_DIR}" \
            --retain-days "$RETAIN_DAYS"
          AFTER=$(du -sb "${ARIA_TOOLS_DIR}/" | cut -f1)
          echo "compact_result: before=${BEFORE} after=${AFTER} saved=$((BEFORE - AFTER))"

      # The restore's credential lived only in its own step; the publish
      # mints its own the same way (extraheader in this step's environment).
      - name: Mint the aria/state push credential
        id: publish_credential
        env:
          PUBLISH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEADER="$(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 -w0)"
          echo "::add-mask::${HEADER}"
          echo "header=${HEADER}" >> "$GITHUB_OUTPUT"

      # THE KERNEL PUBLISHES, NOT THE SHELL. `state publish` opens the store
      # the restore action checked out, binds one exact base commit, drops
      # every inherited entry no snapshot can claim (recording each on the
      # governance ledger), builds a fresh snapshot.json from the compacted
      # tree, stages only the attested surfaces, verifies the committed tree
      # against that snapshot, and fast-forward-pushes the verified commit.
      # "Nothing to publish" is the kernel's own `no_changes` verdict (exit
      # 0) — no porcelain check here can know what the snapshot will attest.
      #
      # The surfaces compaction prunes (old hot-artifact cycles, discovery
      # FATES) are losses the continuity gate would refuse; compaction
      # records exactly what it pruned on its `state_compacted` row and the
      # publish accepts those losses on that attestation — `pruned_paths` on
      # the governance row IS the audit trail. No standing bootstrap ack is
      # exported here (the runbook forbids one in a workflow); the
      # acknowledgement below is empty on every scheduled run and carries
      # the operator's one-run input only on a manual dispatch.
      - name: Publish the compacted state through the kernel
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: 'AUTHORIZATION: basic ${{ steps.publish_credential.outputs.header }}'
          ARIA_STATE_BOOTSTRAP_ACK: ${{ github.event.inputs.state_reduction_ack || '' }}
        run: |
          set -euo pipefail
          PYTHONPATH=aria-kernel python3 -m aria_kernel state publish \
            --repo-root . \
            --snapshot-id "state-maintenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --cycle-id "state-maintenance-${GITHUB_RUN_ID}"

      - name: Report size
        if: always()
        run: |
          du -sh "${ARIA_TOOLS_DIR:-.aria-state-store/tools}/" 2>/dev/null || echo "N/A"
          echo "Branch size after compaction: $(du -sh "${ARIA_TOOLS_DIR:-.aria-state-store/tools}/" 2>/dev/null | cut -f1)"
