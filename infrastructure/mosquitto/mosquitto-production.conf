# ============================================
# Mosquitto MQTT Broker - Production
# HTTP Auth Backend (mosquitto-go-auth)
# ============================================
#
# Authentication is handled via HTTP callbacks to sensor-service.
# All external access goes through Nginx TLS termination (port 8883).
# Internal services connect via Docker DNS on port 1883.

# ============================================
# TCP Listener (internal Docker network only)
# ============================================
listener 1883

# ============================================
# Security Settings
# ============================================
allow_anonymous false

# ============================================
# HTTP Auth Plugin (mosquitto-go-auth)
# ============================================
auth_plugin /usr/lib/go-auth.so

# HTTP backend configuration
auth_opt_backends http

# Plugin cache OFF. go-auth 3.0.0 keys its auth cache on username+password only
# (cache/cache.go toAuthRecord: "auth-%s-%s"), never the client ID, so a cached
# grant would admit the same credentials under ANY client ID for the TTL and
# bypass sensor-service's client-ID binding (SENSOR-HIGH-144). There is one
# switch for auth and ACL, and auth_cache_seconds 0 does not disable it (a
# zero TTL falls back to the cache default). The ACL decision also depends on
# the device's lifecycle state, so it must not be cached either.
# libs/mqtt-test-harness boots its broker from THIS file.
auth_opt_cache false

# HTTP endpoint URLs (sensor-service internal network)
auth_opt_http_host sensor-service
auth_opt_http_port 3000
auth_opt_http_getuser_uri /mqtt/auth
auth_opt_http_superuser_uri /mqtt/superuser
auth_opt_http_aclcheck_uri /mqtt/acl

# HTTP settings (internal network, no TLS needed)
auth_opt_http_with_tls false
auth_opt_http_verify_peer false
auth_opt_http_response_mode status
auth_opt_http_timeout 5
auth_opt_http_params_mode form

# INERT: go-auth 3.0.0 (the latest release) parses no header option — its HTTP
# backend sets only Content-Type and User-Agent — so this line is ignored and
# the broker never sends X-Mosquitto-Auth. The /mqtt/* endpoints rest on
# network isolation. SENSOR-MEDIUM-174 tracks a transport the broker can carry.
# The secret is injected at container start (docker-compose.droplet.yml sed).
auth_opt_http_headers X-Mosquitto-Auth: __MQTT_AUTH_SECRET__

# ============================================
# Persistence Configuration
# ============================================
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# ============================================
# Logging Configuration
# ============================================
log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ============================================
# Connection Settings
# ============================================
max_connections 10000
max_queued_messages 1000
max_inflight_messages 20
max_keepalive 300
