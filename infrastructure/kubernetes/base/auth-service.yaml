# =============================================================================
# Aquaculture Platform - Auth Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: aquaculture
  labels:
    app: auth-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: backend
    spec:
      # SEC-003: per-service service account
      serviceAccountName: auth-service-sa
      # SEC-017: pull secret for GHCR private registry
      imagePullSecrets:
        - name: ghcr-pull-secret
      # ARCH-006: pod anti-affinity to spread replicas across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - auth-service
                topologyKey: kubernetes.io/hostname
      # ARCH-015: topology spread for AZ resilience
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: auth-service
      volumes:
        # SEC-004: emptyDir for /tmp since readOnlyRootFilesystem: true
        - name: tmp
          emptyDir: {}
      containers:
        - name: auth-service
          # ARCH-013: no tag here; tag set via Kustomize images transformer
          image: ghcr.io/aquaculture/auth-service
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: aquaculture-config
            - secretRef:
                name: aquaculture-secrets
          env:
            - name: JWT_EXPIRES_IN
              value: "1h"
            - name: REFRESH_TOKEN_EXPIRES_IN
              value: "7d"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # ARCH-010: startupProbe replaces long initialDelaySeconds blind window
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            # SEC-004: readOnlyRootFilesystem
            readOnlyRootFilesystem: true
            # SEC-006: seccompProfile and capabilities drop ALL
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: aquaculture
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      name: http
  selector:
    app: auth-service

---
# ARCH-001: PodDisruptionBudget for auth-service
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  namespace: aquaculture
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth-service
