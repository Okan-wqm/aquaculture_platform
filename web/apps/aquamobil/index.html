<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Theme + density pre-paint. EXTERNAL and same-origin ON PURPOSE:
         production nginx serves `script-src 'self'` with no 'unsafe-inline'
         (D14-SC-02), so an inline script here is blocked in production and the
         whole theme + touch-density layer silently never applies. Blocking
         <script src> keeps it ahead of first paint. Logic lives in
         public/theme-init.js; keep it in step with useTheme/useDensity. -->
    <script src="/mobile/theme-init.js"></script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0073e6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AquaMobil" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>AquaMobil - Field Data Entry</title>

    <!-- Prevent zoom on iOS -->
    <style>
      * {
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        touch-action: manipulation;
      }
      /* Safe area padding for iPhone notch */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
