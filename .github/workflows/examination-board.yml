name: Examination Board

# PLAN-v2 §1.9 / B0 (ARIA-MEDIUM-766) — the Examination Board judges ARIA from
# OUTSIDE ARIA's trust domain. Its secrets (signing key, vault deploy key,
# vault data key) live only in the GitHub environment `aria-board`, whose
# deployment branch policy admits `main` alone, and only a job declaring that
# environment can read them. Every such job (a "Board job") is one shape of
# the ALLOW-LIST pinned by aria-kernel/tests/invariants/test_board_job_guard.py;
# anything the list does not name is refused, since the steps of one job share
# the VM, the user and GITHUB_ENV/GITHUB_PATH, so a step without a key still
# decides what the key step runs:
#
#   - job keys: name, if, runs-on, timeout-minutes, environment, permissions,
#     concurrency, steps (no container, services or env); this workflow
#     declares no env;
#   - steps, each with only its own keys: actions/checkout and
#     actions/setup-python (python-version alone), each at a full commit SHA;
#     the hash-pinned `python3 -I -m pip install ... -r
#     .github/board/<name>-requirements.txt` (a bare `-m pip` would import a
#     `pip/` package from the checkout); and the key step, which runs
#     examination_board.py BY PATH in isolated mode (so the package __init__,
#     the whole ARIA-changeable kernel, never loads) with an env of Board
#     secrets alone;
#   - its `if:` requires `github.ref == 'refs/heads/main'` itself and the
#     operator's stop (`vars.ARIA_STOP == ''`, PLAN-v2 §2 'Durdurma'), in
#     every branch;
#   - it runs on a GitHub-hosted runner, never on ARIA's self-hosted runner,
#     whose uid is the population the Board must exclude;
#   - it checks out the Board version — this repository at the main commit
#     as triggered (no `ref:` an input or event could choose) — or the vault
#     repository by name, and keeps no credential in a checkout;
#   - it holds read-only permissions (B0 has no writer; B2 adds the one
#     signed-totals writer under this guard);
#   - a Board secret reaches only the key step's env and the vault checkout's
#     ssh-key, never by a dynamic `secrets[...]` or `toJSON(secrets)`;
#   - this workflow has no pull-request trigger, so it never runs PR code.
#
# B0 ships the custody check: the environment's data key seals and opens a
# fixed probe through aria_kernel/examination_board.py, the one owner of the
# vault cipher. B2 adds the exam runner and its signed totals as further
# Board jobs under the same guard.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: examination-board
  cancel-in-progress: false

jobs:
  vault-custody:
    if: vars.ARIA_STOP == '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: aria-board
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The key-holding step names the kernel's path, which makes this a
          # kernel lane, and a kernel lane is a whole clone
          # (tests/invariants/test_kernel_lanes_check_out_full_history.py).
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install the Board's cipher dependency by hash
        run: python3 -I -m pip install --require-hashes --only-binary ':all:' --no-deps -r .github/board/cipher-requirements.txt

      - name: Prove the vault data key seals and opens a probe
        env:
          ARIA_BOARD_VAULT_DATA_KEY: ${{ secrets.ARIA_BOARD_VAULT_DATA_KEY }}
        run: python3 -I aria-kernel/aria_kernel/examination_board.py vault-custody-check
