# Interactive-session CPU discipline on the ARIA runner host (ARIA-HIGH-034).
#
# Installed by scripts/aria/provision_runner.sh to
#   /etc/systemd/system/user.slice.d/50-aria-cpu-discipline.conf
# and drift-checked byte-for-byte on every run. Edit HERE, not on the host.
#
# WHY on user.slice (not the per-user user-.slice template): CPU is shared
# by weight between SIBLINGS. The split that matters is at the root —
# system.slice (production containers + the ARIA runner) against
# user.slice (every login session). Both default to weight 100, i.e. the
# operator's terminals are guaranteed half the machine under contention,
# and a pre-push test suite or a jest run in a terminal starves the
# producer lane: 2026-09-03 04:10 the first post-fix cycle spent 40+
# minutes in one step at 20 % CPU. The CPU share is one number for all
# sessions together. The sessions carry no habitat memory cap
# (ARIA-HIGH-247): on the 31 GiB host they held 10.9 GB on 2026-09-29,
# and the 3 GiB cap sized for the retired 7.8 GiB droplet would have
# killed them; the runner keeps its own cap (actions-runner.limits.conf).
#
# WHAT: weight 50 against system.slice's 100 — interactive sessions keep
# a third of the CPU when everything is busy and all of it when the
# platform and the runner are idle. Nothing is capped; this is a share,
# not a quota.
[Slice]
CPUWeight=50
