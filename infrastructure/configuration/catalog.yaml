schemaVersion: 1
settings:
  - id: PLATFORM_NAME
    service: platform
    key: platform.name
    category: general
    valueType: STRING
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: true
    requiresRestart: false
    description: Platform display name.
    default: Aquaculture Platform
    validation: { minLength: 1, maxLength: 100 }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Platform Name, order: 10, control: TEXT }
  - id: PLATFORM_VERSION
    service: platform
    key: platform.version
    category: general
    valueType: STRING
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: false
    requiresRestart: false
    description: Deployed platform release identifier.
    default: 1.0.0
    validation: { minLength: 1, maxLength: 50 }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Platform Version, order: 20, control: TEXT }
  - id: PLATFORM_ENVIRONMENT
    service: platform
    key: platform.environment
    category: general
    valueType: STRING
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: false
    requiresRestart: false
    description: Deployment environment represented by the active configuration cut.
    default: production
    validation: { choices: [development, staging, production] }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Environment, order: 30, control: SELECT }
  - id: PLATFORM_TIMEZONE
    service: platform
    key: platform.timezone
    category: general
    valueType: STRING
    scopePolicy: SYSTEM_WITH_TENANT_OVERRIDE
    required: true
    mutable: true
    requiresRestart: false
    description: IANA timezone used when no domain-specific timezone exists.
    default: UTC
    validation: { minLength: 1, maxLength: 100 }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Default Timezone, order: 40, control: TEXT }
  - id: PLATFORM_LOCALE
    service: platform
    key: platform.locale
    category: general
    valueType: STRING
    scopePolicy: SYSTEM_WITH_TENANT_OVERRIDE
    required: true
    mutable: true
    requiresRestart: false
    description: BCP 47 locale used when no user preference exists.
    default: en-US
    validation: { minLength: 2, maxLength: 35, pattern: '^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$' }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Default Locale, order: 50, control: TEXT }
  - id: SECURITY_SESSION_TIMEOUT_MINUTES
    service: platform
    key: security.session_timeout_minutes
    category: security
    valueType: NUMBER
    scopePolicy: SYSTEM_WITH_TENANT_OVERRIDE
    required: true
    mutable: true
    requiresRestart: false
    description: Maximum authenticated session idle time in minutes.
    default: 480
    validation: { min: 5, max: 1440, integer: true }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Session Timeout (minutes), order: 10, control: NUMBER }
  - id: SECURITY_MAX_LOGIN_ATTEMPTS
    service: platform
    key: security.max_login_attempts
    category: security
    valueType: NUMBER
    scopePolicy: SYSTEM_WITH_TENANT_OVERRIDE
    required: true
    mutable: true
    requiresRestart: false
    description: Failed login attempts permitted before account lockout.
    default: 5
    validation: { min: 1, max: 20, integer: true }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Maximum Login Attempts, order: 20, control: NUMBER }
  - id: SECURITY_LOCKOUT_DURATION_MINUTES
    service: platform
    key: security.lockout_duration_minutes
    category: security
    valueType: NUMBER
    scopePolicy: SYSTEM_WITH_TENANT_OVERRIDE
    required: true
    mutable: true
    requiresRestart: false
    description: Account lockout duration in minutes.
    default: 30
    validation: { min: 1, max: 1440, integer: true }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Lockout Duration (minutes), order: 30, control: NUMBER }
  - id: SECURITY_PASSWORD_MIN_LENGTH
    service: platform
    key: security.password_min_length
    category: security
    valueType: NUMBER
    scopePolicy: SYSTEM_WITH_TENANT_OVERRIDE
    required: true
    mutable: true
    requiresRestart: false
    description: Minimum password length.
    default: 8
    validation: { min: 8, max: 128, integer: true }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Minimum Password Length, order: 40, control: NUMBER }
  - id: SECURITY_PASSWORD_REQUIRE_UPPERCASE
    service: platform
    key: security.password_require_uppercase
    category: security
    valueType: BOOLEAN
    scopePolicy: SYSTEM_WITH_TENANT_OVERRIDE
    required: true
    mutable: true
    requiresRestart: false
    description: Require an uppercase character in passwords.
    default: true
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Require Uppercase, order: 50, control: TOGGLE }
  - id: SECURITY_PASSWORD_REQUIRE_NUMBERS
    service: platform
    key: security.password_require_numbers
    category: security
    valueType: BOOLEAN
    scopePolicy: SYSTEM_WITH_TENANT_OVERRIDE
    required: true
    mutable: true
    requiresRestart: false
    description: Require a number in passwords.
    default: true
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Require Numbers, order: 60, control: TOGGLE }
  - id: SECURITY_PASSWORD_REQUIRE_SYMBOLS
    service: platform
    key: security.password_require_symbols
    category: security
    valueType: BOOLEAN
    scopePolicy: SYSTEM_WITH_TENANT_OVERRIDE
    required: true
    mutable: true
    requiresRestart: false
    description: Require a symbol in passwords.
    default: false
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Require Symbols, order: 70, control: TOGGLE }
  - id: SECURITY_MFA_ENABLED
    service: platform
    key: security.mfa_enabled
    category: security
    valueType: BOOLEAN
    scopePolicy: SYSTEM_WITH_TENANT_OVERRIDE
    required: true
    mutable: true
    requiresRestart: false
    description: Require support for multi-factor authentication.
    default: true
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: MFA Enabled, order: 80, control: TOGGLE }
  - id: SECURITY_ENFORCE_HTTPS
    service: platform
    key: security.enforce_https
    category: security
    valueType: BOOLEAN
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: true
    requiresRestart: true
    description: Reject non-HTTPS external requests.
    default: true
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Enforce HTTPS, order: 90, control: TOGGLE }
  - id: EMAIL_SMTP_HOST
    service: platform
    key: email.smtp_host
    category: email
    valueType: STRING
    scopePolicy: SYSTEM_ONLY
    required: false
    mutable: true
    requiresRestart: false
    description: SMTP server hostname; unset means email delivery is disabled.
    validation: { minLength: 1, maxLength: 255, pattern: '^[A-Za-z0-9.-]+$' }
    consumers: [ADMIN_PANEL_CONFIGURATION, NOTIFICATION_SERVICE_SMTP]
    ui: { label: SMTP Host, order: 10, control: TEXT }
  - id: EMAIL_SMTP_PORT
    service: platform
    key: email.smtp_port
    category: email
    valueType: NUMBER
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: true
    requiresRestart: false
    description: SMTP server TCP port.
    default: 587
    validation: { min: 1, max: 65535, integer: true }
    consumers: [ADMIN_PANEL_CONFIGURATION, NOTIFICATION_SERVICE_SMTP]
    ui: { label: SMTP Port, order: 20, control: NUMBER }
  - id: EMAIL_SMTP_SECURE
    service: platform
    key: email.smtp_secure
    category: email
    valueType: BOOLEAN
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: true
    requiresRestart: false
    description: Use implicit TLS instead of STARTTLS.
    default: false
    consumers: [ADMIN_PANEL_CONFIGURATION, NOTIFICATION_SERVICE_SMTP]
    ui: { label: Implicit TLS, order: 30, control: TOGGLE }
  - id: EMAIL_SMTP_USERNAME
    service: platform
    key: email.smtp_username
    category: email
    valueType: STRING
    scopePolicy: SYSTEM_ONLY
    required: false
    mutable: true
    requiresRestart: false
    description: SMTP authentication username.
    validation: { minLength: 1, maxLength: 255 }
    consumers: [ADMIN_PANEL_CONFIGURATION, NOTIFICATION_SERVICE_SMTP]
    ui: { label: SMTP Username, order: 40, control: TEXT }
  - id: EMAIL_SMTP_PASSWORD
    service: platform
    key: email.smtp_password
    category: email
    valueType: SECRET
    scopePolicy: SYSTEM_ONLY
    required: false
    mutable: true
    requiresRestart: false
    description: SMTP authentication password encrypted by config-service.
    validation: { minLength: 1, maxLength: 4096 }
    consumers: [ADMIN_PANEL_CONFIGURATION, NOTIFICATION_SERVICE_SMTP]
    ui: { label: SMTP Password, order: 50, control: SECRET }
  - id: EMAIL_FROM_ADDRESS
    service: platform
    key: email.from_address
    category: email
    valueType: STRING
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: true
    requiresRestart: false
    description: Envelope and message From address.
    default: noreply@aquaculture.io
    validation: { minLength: 3, maxLength: 254, pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$" }
    consumers: [ADMIN_PANEL_CONFIGURATION, NOTIFICATION_SERVICE_SMTP]
    ui: { label: From Address, order: 60, control: TEXT }
  - id: EMAIL_FROM_NAME
    service: platform
    key: email.from_name
    category: email
    valueType: STRING
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: true
    requiresRestart: false
    description: Human-readable email sender name.
    default: Aquaculture Platform
    validation: { minLength: 1, maxLength: 100 }
    consumers: [ADMIN_PANEL_CONFIGURATION, NOTIFICATION_SERVICE_SMTP]
    ui: { label: From Name, order: 70, control: TEXT }
  - id: RATE_LIMIT_GLOBAL_RPM
    service: platform
    key: rate_limit.global_rpm
    category: rate_limit
    valueType: NUMBER
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: true
    requiresRestart: false
    description: Platform-wide requests per minute ceiling.
    default: 1000
    validation: { min: 10, max: 10000, integer: true }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Global Requests / Minute, order: 10, control: NUMBER }
  - id: RATE_LIMIT_PER_USER_RPM
    service: platform
    key: rate_limit.per_user_rpm
    category: rate_limit
    valueType: NUMBER
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: true
    requiresRestart: false
    description: Per-user requests per minute ceiling.
    default: 100
    validation: { min: 5, max: 5000, integer: true }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Per User Requests / Minute, order: 20, control: NUMBER }
  - id: RATE_LIMIT_PER_TENANT_RPM
    service: platform
    key: rate_limit.per_tenant_rpm
    category: rate_limit
    valueType: NUMBER
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: true
    requiresRestart: false
    description: Per-tenant requests per minute ceiling.
    default: 500
    validation: { min: 10, max: 10000, integer: true }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Per Tenant Requests / Minute, order: 30, control: NUMBER }
  - id: RATE_LIMIT_API_KEY_RPM
    service: platform
    key: rate_limit.api_key_rpm
    category: rate_limit
    valueType: NUMBER
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: true
    requiresRestart: false
    description: Per-API-key requests per minute ceiling.
    default: 60
    validation: { min: 5, max: 5000, integer: true }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: API Key Requests / Minute, order: 40, control: NUMBER }
  - id: STORAGE_PROVIDER
    service: platform
    key: storage.provider
    category: storage
    valueType: STRING
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: true
    requiresRestart: true
    description: Platform object-storage provider.
    default: minio
    validation: { choices: [minio, s3, azure] }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Storage Provider, order: 10, control: SELECT }
  - id: STORAGE_MAX_FILE_SIZE_MB
    service: platform
    key: storage.max_file_size_mb
    category: storage
    valueType: NUMBER
    scopePolicy: SYSTEM_WITH_TENANT_OVERRIDE
    required: true
    mutable: true
    requiresRestart: false
    description: Maximum accepted object upload size in megabytes.
    default: 100
    validation: { min: 1, max: 10240, integer: true }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Maximum File Size (MB), order: 20, control: NUMBER }
  - id: STORAGE_ALLOWED_EXTENSIONS
    service: platform
    key: storage.allowed_extensions
    category: storage
    valueType: JSON
    scopePolicy: SYSTEM_WITH_TENANT_OVERRIDE
    required: true
    mutable: true
    requiresRestart: false
    description: Exact lowercase file-extension allowlist.
    default: [pdf, doc, docx, xls, xlsx, csv, jpg, jpeg, png, gif, mp4]
    validation: { arrayItemType: STRING, maxItems: 100 }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Allowed Extensions, order: 30, control: JSON }
  - id: MAINTENANCE_MODE_ENABLED
    service: platform
    key: maintenance.mode_enabled
    category: maintenance
    valueType: BOOLEAN
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: true
    requiresRestart: false
    description: Put public traffic into maintenance mode.
    default: false
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Maintenance Mode, order: 10, control: TOGGLE }
  - id: MAINTENANCE_MESSAGE
    service: platform
    key: maintenance.message
    category: maintenance
    valueType: STRING
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: true
    requiresRestart: false
    description: Message shown while maintenance mode is active.
    default: System is under maintenance. Please try again later.
    validation: { minLength: 1, maxLength: 1000 }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Maintenance Message, order: 20, control: TEXT }
  - id: MAINTENANCE_ALLOWED_IPS
    service: platform
    key: maintenance.allowed_ips
    category: maintenance
    valueType: JSON
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: true
    requiresRestart: false
    description: IP addresses allowed through maintenance mode.
    default: []
    validation: { arrayItemType: STRING, maxItems: 100 }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Maintenance Allowed IPs, order: 30, control: JSON }
  - id: BILLING_STRIPE_ENABLED
    service: platform
    key: billing.stripe_enabled
    category: billing
    valueType: BOOLEAN
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: true
    requiresRestart: false
    description: Permit Stripe-backed payment operations.
    default: false
    consumers: [ADMIN_PANEL_CONFIGURATION, BILLING_SERVICE_STRIPE]
    ui: { label: Stripe Enabled, order: 10, control: TOGGLE }
  - id: BILLING_STRIPE_PUBLIC_KEY
    service: platform
    key: billing.stripe_public_key
    category: billing
    valueType: STRING
    scopePolicy: SYSTEM_ONLY
    required: false
    mutable: true
    requiresRestart: false
    description: Stripe publishable key.
    validation: { minLength: 1, maxLength: 255 }
    consumers: [ADMIN_PANEL_CONFIGURATION, BILLING_SERVICE_STRIPE]
    ui: { label: Stripe Publishable Key, order: 20, control: TEXT }
  - id: BILLING_STRIPE_SECRET_KEY
    service: platform
    key: billing.stripe_secret_key
    category: billing
    valueType: SECRET
    scopePolicy: SYSTEM_ONLY
    required: false
    mutable: true
    requiresRestart: false
    description: Stripe secret key encrypted by config-service.
    validation: { minLength: 1, maxLength: 4096 }
    consumers: [ADMIN_PANEL_CONFIGURATION, BILLING_SERVICE_STRIPE]
    ui: { label: Stripe Secret Key, order: 30, control: SECRET }
  - id: BILLING_DEFAULT_CURRENCY
    service: platform
    key: billing.default_currency
    category: billing
    valueType: STRING
    scopePolicy: SYSTEM_WITH_TENANT_OVERRIDE
    required: true
    mutable: true
    requiresRestart: false
    description: ISO 4217 billing currency.
    default: USD
    validation: { minLength: 3, maxLength: 3, pattern: '^[A-Z]{3}$' }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Default Currency, order: 40, control: TEXT }
  - id: BILLING_TAX_RATE
    service: platform
    key: billing.tax_rate
    category: billing
    valueType: NUMBER
    scopePolicy: SYSTEM_WITH_TENANT_OVERRIDE
    required: true
    mutable: true
    requiresRestart: false
    description: Default tax rate percentage.
    default: 0
    validation: { min: 0, max: 100 }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Tax Rate (%), order: 50, control: NUMBER }
  - id: BILLING_INVOICE_DUE_DAYS
    service: platform
    key: billing.invoice_due_days
    category: billing
    valueType: NUMBER
    scopePolicy: SYSTEM_WITH_TENANT_OVERRIDE
    required: true
    mutable: true
    requiresRestart: false
    description: Default number of days before an invoice is due.
    default: 30
    validation: { min: 1, max: 90, integer: true }
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Invoice Due Days, order: 60, control: NUMBER }
  - id: FEATURE_SWAGGER_ENABLED
    service: platform
    key: feature.swagger_enabled
    category: feature_flag
    valueType: BOOLEAN
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: true
    requiresRestart: true
    description: Expose supported API documentation surfaces.
    default: true
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: API Documentation Enabled, order: 10, control: TOGGLE }
  - id: FEATURE_GRAPHQL_PLAYGROUND
    service: platform
    key: feature.graphql_playground
    category: feature_flag
    valueType: BOOLEAN
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: false
    requiresRestart: true
    description: Deprecated GraphQL Playground remains disabled.
    default: false
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: GraphQL Playground, order: 20, control: TOGGLE }
  - id: FEATURE_REGISTRATION_ENABLED
    service: platform
    key: feature.registration_enabled
    category: feature_flag
    valueType: BOOLEAN
    scopePolicy: SYSTEM_ONLY
    required: true
    mutable: true
    requiresRestart: false
    description: Permit public tenant registration flows.
    default: true
    consumers: [ADMIN_PANEL_CONFIGURATION]
    ui: { label: Registration Enabled, order: 30, control: TOGGLE }
  - id: MARINE_CDSE_CREDENTIALS
    service: farm-service
    key: marine.cdse.credentials
    category: marine_provider
    valueType: SECRET
    scopePolicy: TENANT_WITH_SYSTEM_FALLBACK
    required: false
    mutable: true
    requiresRestart: false
    description: Atomic CDSE credential bundle encrypted by config-service.
    validation: { minLength: 1, maxLength: 8192 }
    consumers: [FARM_SERVICE_MARINE_PROVIDER]
    ui: { label: CDSE Credentials, order: 10, control: SECRET }
