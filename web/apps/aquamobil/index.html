<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Dark mode flash prevention: synchronously applies the stored theme
         preference before any CSS is parsed, preventing a visible flash of
         the wrong theme. This MUST be inline and synchronous -- external
         scripts load asynchronously and would cause FOUC (Flash of Unstyled Content). -->
    <script>
      (function() {
        var pref = localStorage.getItem('aquamobil_dark_mode') || 'system';
        var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute('content', themeMeta.getAttribute(isDark ? 'data-theme-color-dark' : 'data-theme-color-light'));
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

    <!-- PWA Meta Tags -->
    <!-- WHY placeholders and two data attributes: vite.config.ts fills them from
         the Tailwind palette (ocean-600, gray-950), and the pre-paint script above
         and useDarkMode read the light/dark chrome colours from this tag, so the
         brand is recorded once, in tailwind.config.js. -->
    <meta name="theme-color" content="%THEME_COLOR_LIGHT%" data-theme-color-light="%THEME_COLOR_LIGHT%" data-theme-color-dark="%THEME_COLOR_DARK%" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AquaMobil" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>AquaMobil - Field Data Entry</title>

    <!-- Prevent zoom on iOS -->
    <style>
      * {
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        touch-action: manipulation;
      }
      /* Safe area padding for iPhone notch */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
