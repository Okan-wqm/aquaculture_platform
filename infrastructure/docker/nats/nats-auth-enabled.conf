# =============================================================================
# NATS Authentication Configuration (enabled — production)
#
# Mount this file at /etc/nats/nats-auth.conf to enable authentication.
#
# NATS supports environment variable substitution in config files when using
# the --config flag. Set NATS_USER and NATS_PASS as environment variables
# on the NATS container.
# =============================================================================
authorization {
  user: $NATS_USER
  password: $NATS_PASS
  timeout: 5
}
