{{/* ---- Shared Role — minimal namespace permissions ---- */}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aquaculture.fullname" . }}-app-role
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aquaculture.labels" . | nindent 4 }}
rules:
  # Allow services to read their own ConfigMaps for hot-reload support.
  # No write access, no Secret access (secrets injected via env vars).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

{{/* ---- RoleBindings — bind each service SA to the shared role ---- */}}

{{- if .Values.gatewayApi.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aquaculture.fullname" . }}-gateway-api-rb
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aquaculture.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aquaculture.fullname" . }}-app-role
subjects:
  - kind: ServiceAccount
    name: {{ include "aquaculture.fullname" . }}-gateway-api
    namespace: {{ .Values.namespace }}
{{- end }}

