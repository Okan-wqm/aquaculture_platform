name: aria-kernel-full

# Plan ARIA-V2 §3.7 (Phase 6) — same hygiene as aria-kernel.yml plus
# paths-ignore on docs/** + aria-tools/reports/daily/** so the aria-bot
# daily-anchor commit does not retrigger the full workflow (INFRA-MED-001
# compute-fanout mitigation).

on:
  workflow_dispatch:
  push:
    branches:
      - snowball
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "aria-tools/reports/daily/**"
      # Plan ARIA-V3 §B3 + INFRA-HIGH-008 — SPEC + ADR edits MUST
      # retrigger kernel tests so a Plan ARIA-V3 SPEC §0.2 / §5.4 /
      # §8.1 amendment cannot drift from the kernel's invariant
      # suite. The bang-prefix entries are negation patterns
      # (un-ignore), so ``docs/aria/**`` and ``docs/adr/**`` paths
      # bypass the broader ``docs/**`` ignore.
      - "!docs/aria/**"
      - "!docs/adr/**"

permissions:
  contents: read

concurrency:
  group: aria-kernel-full-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      # Plan ARIA-V2 §Phase 1 CRITICAL-020 — install kernel deps
      # (pyyaml etc.) from pyproject.toml SSoT.
      - name: Install aria-kernel package
        run: python3 -m pip install --upgrade pip && python3 -m pip install -e aria-kernel
      - name: Run aria-kernel unit + invariant tests
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel:. python3 -m unittest discover aria-kernel -p '*test*.py'
      # Plan ARIA-V2 §3.6 + CRITICAL-013 — tools/aria-poc + tools/shared
      # invariants run under the same quality gate.
      - name: Run tools/aria-poc invariant tests (Plan ARIA-V2 §3.6)
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=.:aria-kernel python3 -m unittest discover tools/aria-poc/invariants -p '*test*.py'
      - name: Run tools/shared invariant tests (Plan ARIA-V2 §3.6)
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=.:aria-kernel python3 -m unittest discover tools/shared/invariants -p '*test*.py'
      - name: Reset CI-local ARIA state
        run: |
          rm -rf ./.aria-ci/tools ./.aria-ci/workspaces
          mkdir -p ./.aria-ci
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel python3 -m aria_kernel integrity migrate-tools-bootstrap --tools-dir ./.aria-ci/tools --workspace-root . --acknowledge --reason "ci bootstrap (Plan ARIA-V2 §3.8 idempotent umbrella)"
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel python3 -m aria_kernel discovery run --workspace-root . --workspace-base ./.aria-ci/workspaces --tools-dir ./.aria-ci/tools --cycle-id ci-${{ github.run_id }} --snapshot-mode committed
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel python3 -m aria_kernel integrity verify --workspace-root . --workspace-base ./.aria-ci/workspaces --tools-dir ./.aria-ci/tools
