# =============================================================================
# Redis Configuration - Aquaculture Platform
# =============================================================================
#
# This is the base Redis config. TLS is DISABLED by default (development).
#
# For PRODUCTION with TLS enabled:
#   1. Generate or obtain certificates:
#        - CA certificate:     ca-cert.pem
#        - Server certificate: redis-cert.pem
#        - Server private key: redis-key.pem
#
#   2. Mount certs into the container at /etc/redis/certs/
#
#   3. Use redis-tls.conf instead of this file (or set REDIS_TLS=true
#      and mount redis-tls.conf as the Redis config).
#
# =============================================================================

# --- General ---
# Password is set via command-line --requirepass flag in docker-compose
appendonly yes

# --- Network ---
# Listen on standard port (unencrypted)
port 6379
bind 0.0.0.0

# --- Memory ---
# maxmemory and maxmemory-policy are set via command-line in docker-compose
# for per-environment tuning (e.g., 192mb for droplet, unlimited for dev)

# --- Security ---
# Disable dangerous commands in production
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
# rename-command DEBUG ""
