  observability-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/observability-service:${TAG:-latest}
    container_name: aqua-observability
    restart: unless-stopped
    environment:
      SERVICE_NAME: observability-service
      NODE_ENV: production
      PORT: 3009
      # INTERNAL_API_KEY must be set; guard rejects all requests in production without it
      INTERNAL_API_KEY: ${OBSERVABILITY_INTERNAL_API_KEY:?OBSERVABILITY_INTERNAL_API_KEY required}
      # observability-service reads DB_* env vars (not DATABASE_*)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-aquaculture}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: aquaculture
      DB_MIGRATE_AUTHORITATIVE: 'true'
      DATABASE_MIGRATIONS_RUN: 'false'
      NATS_URL: tls://nats:4222
      NATS_TLS_ENABLED: 'true'
      NATS_TLS_CA: /etc/ssl/nats/ca-cert.pem
      NATS_TLS_CERT: /etc/ssl/nats/clients/observability_service-cert.pem
      NATS_TLS_KEY: /etc/ssl/nats/clients/observability_service-key.pem
    volumes:
      - ./certs/nats/ca-cert.pem:/etc/ssl/nats/ca-cert.pem:ro
      - ./certs/nats/clients/observability_service-cert.pem:/etc/ssl/nats/clients/observability_service-cert.pem:ro
      - ./certs/nats/clients/observability_service-key.pem:/etc/ssl/nats/clients/observability_service-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      # WS10: ADR-016 Phase E Phase 1 — schema pre-applied by aqua-db-migrate.
      db-migrate:
        condition: service_completed_successfully
    # Attached to aqua-internal only — no published ports, not reachable from aqua-network
    networks:
      - aqua-internal
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3009/health/live']
      interval: 30s
      timeout: 10s
      retries: 3

