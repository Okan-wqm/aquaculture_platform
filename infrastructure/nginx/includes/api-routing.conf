# =============================================================================
# Shared /api edge-routing contract (SSoT) — APA-252 / APA-253
#
# This fragment is the SINGLE source of truth for how the web origin's /api/*
# surface is routed to backend services. It is `include`d verbatim inside the
# HTTPS server block of EVERY nginx stack that fronts the web origin:
#   - infrastructure/nginx/droplet.conf            (droplet / staging)
#   - infrastructure/docker/nginx/nginx.prod.conf  (docker-compose.prod.yml)
#   - infrastructure/docker/nginx/edge.local.conf  (docker-compose.{yml,dev.yml})
#
# WHY this exists: the '/api' -> admin-api /api/v1 rewrite used to live ONLY in
# droplet.conf. nginx.prod.conf routed /api/ to the `gateway` upstream (which has
# no admin REST proxy), so the whole admin panel 404'd on the prod stack, and the
# local compose stacks had no /api route at all. Extracting the contract here
# makes a per-stack drift impossible without editing this one file.
#
# The frontend http-client base is '/api'
# (web/modules/admin-panel/src/services/http-client.ts). admin-api-service
# bootstraps with globalPrefix 'api/v1' + URI versioning (VERSION_NEUTRAL), and
# its HealthController is prefix-excluded (@Controller('health')).
#
# CONTEXT REQUIREMENTS of the including server/http block (deliberately NOT
# redeclared here so the fragment stays context-neutral across all three stacks):
#   - `resolver 127.0.0.11 ...;`  — Docker embedded DNS. Variable-based
#      proxy_pass re-resolves upstream container IPs after recreation (ARCH-NM-DNS).
#   - `limit_req_zone ... zone=api ...;`
#
# NB: no `$correlation_id` / `$connection_upgrade` references — those variables
# exist only in some stacks; keeping the fragment free of them is what lets a
# single file serve droplet.conf, nginx.prod.conf, and edge.local.conf alike.
# =============================================================================

# ── Admin health endpoints (VERSION_NEUTRAL, no /api/v1 prefix) ──────────────
# admin-api HealthController uses @Controller('health') WITHOUT a version prefix.
# Frontend calls /api/health/circuit-breakers which must map to
# /health/circuit-breakers on admin-api, NOT /api/v1/health/...
location /api/health/ {
    limit_req zone=api burst=20 nodelay;

    set $api_backend_health admin-api-service;
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://$api_backend_health:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── Gateway REST carve-outs (MUST precede the /api/ catch-all) ───────────────
# Upload routes are served by gateway-api, not admin-api-service.
# More specific location blocks take precedence in nginx regardless of order.
location /api/upload/ {
    limit_req zone=api burst=20 nodelay;

    set $api_backend_upload gateway-api;
    proxy_pass http://$api_backend_upload:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 50m;
}

# AI routes -> gateway-api
location /api/v2/ai/ {
    limit_req zone=api burst=20 nodelay;

    set $api_backend_ai gateway-api;
    proxy_pass http://$api_backend_ai:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# CSP violation reports -> gateway-api (exact match)
location = /api/csp-report {
    set $api_backend_csp gateway-api;
    proxy_pass http://$api_backend_csp:3000;
    proxy_set_header Host $host;
}

# ── Admin API REST endpoints (catch-all for /api/) ───────────────────────────
# Frontend calls /api/users, /api/system, /api/audit-logs, etc.
# admin-api-service routes are versioned: /api/v1/users, /api/v1/system, ...
# Rewrite prepends /api/v1/ to align frontend paths with backend routes
# (matches admin-api's globalPrefix 'api/v1' + VERSION_NEUTRAL bootstrap).
location /api/ {
    # ARCH-017: Apply rate limiting to REST API endpoint
    limit_req zone=api burst=50 nodelay;

    set $api_backend_admin admin-api-service;
    rewrite ^/api/(.*) /api/v1/$1 break;
    proxy_pass http://$api_backend_admin:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Prevent duplicate security headers (M-2, L-4)
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
}
