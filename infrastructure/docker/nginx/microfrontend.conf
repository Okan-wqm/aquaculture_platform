# D14-SC-03: Replace wildcard CORS with origin allowlist
# This map is included inside the http {} block via conf.d/
map $http_origin $mf_cors_origin {
    default                         "";
    "https://app.suderra.com"       "https://app.suderra.com";
    "https://m.suderra.com"         "https://m.suderra.com";
    "http://localhost:3000"         "http://localhost:3000";
    "http://localhost:8080"         "http://localhost:8080";
    "http://localhost:5173"         "http://localhost:5173";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Security: Hide nginx version (SEC-020)
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Block standalone index.html - microfrontends must only be accessed via Module Federation
    # Serving index.html would bypass the shell's authentication and routing
    location = /index.html {
        return 403;
    }
    location = / {
        return 403;
    }

    # Health check endpoint for Docker
    location = /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # RemoteEntry.js - no cache, CORS enabled (Module Federation entry point)
    location = /remoteEntry.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header 'Access-Control-Allow-Origin' $mf_cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    }

    # FE-MEDIUM-380: the build manifest names the build this remote serves
    # (web/shared-ui/src/federation/buildManifest.ts). An open console tab that
    # has loaded this remote reads it on focus, on navigation and on a GraphQL
    # validation failure, and reloads when it names another build than the one
    # its remoteEntry.js exported — so it MUST NOT be cached, and a missing file
    # answers 404 (the tab reads anything but a manifest as "unknown build" and
    # never reloads on it). Read same-origin through the edge, so no CORS header.
    # Pinned by tests/invariants/federation-build-manifest-contract.spec.ts.
    location = /build-manifest.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Cache control for assets (JS/CSS chunks loaded by Module Federation)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header 'Access-Control-Allow-Origin' $mf_cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    }

    # Libs directory (for modules that ship extra static files)
    location /libs/ {
        add_header 'Access-Control-Allow-Origin' $mf_cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    }

    # Specific HTML files (e.g. process-editor-canvas.html) - CORS for iframe embedding
    # Only serves files that actually exist, no fallback
    location ~* ^/.+\.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header 'Access-Control-Allow-Origin' $mf_cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'X-Frame-Options' 'SAMEORIGIN' always;
        try_files $uri =404;
    }

    # Default: return 404 for anything else (no SPA fallback)
    location / {
        try_files $uri =404;
    }
}
