# =============================================================================
# NATS TLS Configuration (enabled — production)
#
# Mount this file at /etc/nats/nats-tls.conf to enable TLS.
# Requires cert files mounted at /etc/nats/certs/.
#
# verify: false = server presents certificate but does not require client certs
# Set verify: true for mutual TLS (mTLS) where clients must also present certs.
# =============================================================================
tls {
  cert_file: "/etc/nats/certs/server-cert.pem"
  key_file: "/etc/nats/certs/server-key.pem"
  ca_file: "/etc/nats/certs/ca-cert.pem"
  verify: false
  timeout: 5
}
