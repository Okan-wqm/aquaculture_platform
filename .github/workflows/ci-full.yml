name: CI - Full

# SEC-CI-002: All third-party actions pinned to full commit SHAs
# SEC-CI-009: Snyk action pinned to SHA (was @master), continue-on-error removed
# SEC-CI-020: Removed continue-on-error from security audit and license check
# ARCH-CI-006: Removed github.sha from NX cache key
# ARCH-CI-014: Added NX cache to build job (was missing)

on:
  schedule:
    # Run weekly instead of daily (saves runner minutes)
    - cron: '0 2 * * 0'  # Sunday at 2 AM
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'release-*'

# SEC-CI-021: Minimum token permissions — prevents compromised actions from
# pushing commits, creating releases, or modifying repository settings.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

# Cancel in-progress runs for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ARCH-CI-014: Added NX cache (was missing from lint-and-typecheck job)
      # ARCH-CI-006: No github.sha in key
      - name: Cache Nx
        # SEC-CI-002: pinned to SHA
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-full-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-full-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit

      - name: Run linter (all projects)
        run: npm run lint:all -- --max-warnings=0

      - name: Run type check
        run: npm run type-check

      - name: Check formatting
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aquaculture_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit

      - name: Run all tests
        run: npm run test:all -- --coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aquaculture_test
          REDIS_URL: redis://localhost:6379

      - name: Upload coverage to Codecov
        # SEC-CI-002: pinned to SHA
        uses: codecov/codecov-action@1e68e06f1dbfde0e4cefc87efeba9e4643565303 # v5.1.2
        with:
          directory: ./coverage
          # fail_ci_if_error changed from false to true.
          # BEFORE: Codecov upload failure was silently ignored — coverage could drop to 0%
          # with no CI signal. WHY: Coverage enforcement only works if upload failures surface.
          fail_ci_if_error: true

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ARCH-CI-014: Added NX cache to build job (was missing)
      # ARCH-CI-006: No github.sha in key
      - name: Cache Nx
        # SEC-CI-002: pinned to SHA
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-full-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-full-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit

      - name: Build all projects
        run: npm run build:all
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

  generate-sri-hashes:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ARCH-CI-006: No github.sha in key
      - name: Cache Nx
        # SEC-CI-002: pinned to SHA
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-full-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-full-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit

      - name: Build frontend modules
        run: npx nx run-many --target=build --projects=dashboard,farm-module,hr-module,sensor-module,hydroponics-module,admin-panel,tenant-admin --parallel=4
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

      - name: Generate SRI hash map
        run: |
          mkdir -p web/shell/src/generated
          printf '{' > web/shell/src/generated/remoteHashes.json
          FIRST=true
          for module in dashboard farm-module hr-module sensor-module hydroponics-module admin-panel tenant-admin; do
            ENTRY="web/modules/$module/dist/assets/remoteEntry.js"
            if [ -f "$ENTRY" ]; then
              HASH=$(openssl dgst -sha256 -binary "$ENTRY" | openssl base64 -A)
              if [ "$FIRST" = "true" ]; then
                FIRST=false
              else
                printf ',' >> web/shell/src/generated/remoteHashes.json
              fi
              printf '\n  "/remotes/%s/assets/remoteEntry.js": "sha256-%s"' "$module" "$HASH" >> web/shell/src/generated/remoteHashes.json
            fi
          done
          printf '\n}\n' >> web/shell/src/generated/remoteHashes.json
          echo "Generated SRI hash map:"
          cat web/shell/src/generated/remoteHashes.json

      - name: Upload hash map artifact
        # SEC-CI-002: pinned to SHA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remote-hash-pins-${{ github.run_number }}
          path: web/shell/src/generated/remoteHashes.json
          retention-days: 14

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit

      # SEC-CI-020: Removed continue-on-error so audit failures block the build
      - name: Run security audit
        run: npm audit --audit-level=high

      # SEC-CI-009/SEC-CI-002: Snyk action pinned to SHA (was @master)
      # SEC-CI-020: continue-on-error removed so Snyk failures block the build
      - name: Run Snyk security scan
        uses: snyk/actions/node@b98d498629f1c5e001d9cbe42ee4bc08d6f48b4e # pinned
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  license-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit

      # SEC-CI-020: Removed continue-on-error so license violations block the build
      - name: Check licenses
        run: npx license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;Unlicense'

  build-status:
    needs: [lint-and-typecheck, test, build, security-scan, license-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.lint-and-typecheck.result }}" != "success" ]; then
            echo "Lint/Typecheck failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed"
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build failed"
            exit 1
          fi
          if [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "Security scan failed"
            exit 1
          fi
          if [ "${{ needs.license-check.result }}" != "success" ]; then
            echo "License check failed"
            exit 1
          fi
          echo "All critical checks passed"
