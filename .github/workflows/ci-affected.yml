name: CI - Affected

# ARCH-CI-005: Replaced global npm run scripts with nx affected commands
# SEC-CI-002: All third-party actions pinned to full commit SHAs
# ARCH-CI-006: Removed github.sha from NX cache key
# ARCH-CI-007: Split lint/type-check/test into parallel jobs so build always runs
# ARCH-CI-008: Increased timeouts (cold cache), reduced parallel (memory), save Nx cache after build
# ARCH-CI-009: Skip lint/type-check/test on push to main (non-blocking, speeds deploy)

on:
  push:
    branches: [main, develop, 'feature/*', 'hotfix/*']
  pull_request:
    branches: [main, develop]

# SEC-CI-021: Minimum token permissions — prevents compromised actions from
# pushing commits, creating releases, or modifying repository settings.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      is_pr: ${{ github.event_name == 'pull_request' }}
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      # SEC-CI-002/SEC-CI-019: Migrated from unmaintained @v2 to @v3, pinned to SHA
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: changes
        with:
          filters: |
            apps:
              - 'apps/**'
            libs:
              - 'libs/**'
              - 'platform/libs/**'
            web:
              - 'web/**'
      - id: check
        run: |
          if [ "${{ steps.changes.outputs.apps }}" = "true" ] || \
             [ "${{ steps.changes.outputs.libs }}" = "true" ] || \
             [ "${{ steps.changes.outputs.web }}" = "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # Shared setup: install + cache (reusable via needs + cache restore)
  # ---------------------------------------------------------------------------
  install:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Nx
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit

      # Persist node_modules for downstream jobs
      - name: Cache node_modules
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

  # ---------------------------------------------------------------------------
  # Lint, type-check, test: PR only (non-blocking, skip on push to main)
  # ---------------------------------------------------------------------------
  lint:
    needs: [install, detect-changes]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # continue-on-error removed: lint failures must block PR merge.
    # BEFORE: lint errors showed green in GitHub — no signal to reviewers or authors.
    # WHY: A CI gate that never fails provides false confidence and is worse than no gate.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit

      - name: Restore Nx cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Run linter (affected only)
        run: npx nx affected -t lint --base=origin/${{ github.base_ref || 'main' }} --head=HEAD --parallel=2
        timeout-minutes: 35
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

  type-check:
    needs: [install, detect-changes]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # continue-on-error removed: TypeScript errors must block PR merge.
    # BEFORE: type errors merged silently — caught only at runtime or in production.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit

      - name: Restore Nx cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Run type check (affected only)
        run: npx nx affected -t type-check --base=origin/${{ github.base_ref || 'main' }} --head=HEAD --parallel=2
        timeout-minutes: 35
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

  test:
    needs: [install, detect-changes]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # continue-on-error removed: failing tests must block PR merge.
    # BEFORE: broken unit tests were invisible to reviewers — PRs merged with red tests.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit

      - name: Restore Nx cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Run tests (affected only)
        run: npx nx affected -t test --base=origin/${{ github.base_ref || 'main' }} --head=HEAD --parallel=2
        timeout-minutes: 35
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

  # ---------------------------------------------------------------------------
  # Build: PR only (deploy workflow does its own build for push to main).
  # On PR this validates the code compiles before merge.
  # ---------------------------------------------------------------------------
  build:
    needs: [install, detect-changes]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit

      - name: Restore Nx cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Ensure Nx cache directory exists
        run: mkdir -p .nx/cache

      - name: Build (affected only)
        run: npx nx affected -t build --base=origin/${{ github.base_ref || 'main' }} --head=HEAD --parallel=2
        timeout-minutes: 45
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

      # Persist Nx cache so subsequent CI runs are fast
      - name: Save Nx cache
        if: always()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}

  schema-validation:
    needs: [install, detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit
      - name: Validate pagination schema types
        run: node scripts/validate-pagination-schema.js

      # NOTE: the NATS SSoT drift check previously lived here, gated behind
      # `has_changes == 'true'` (apps/libs/web). That gating caused a gap:
      # a PR touching ONLY infrastructure/nats/services.yaml would skip this
      # job entirely. The check has moved to the `pre-flight` job below,
      # which runs unconditionally on every PR + push. See ADR-016 Phase A3.

  # ---------------------------------------------------------------------------
  # Pre-flight validation — ADR-016 Phase A2-A4 at PR-time
  # ---------------------------------------------------------------------------
  #
  # Mirrors the pre-flight steps landed in deploy-digitalocean.yml (commit
  # 607f9d9d) so drift is caught at PR merge time, not at deploy time.
  # Rationale: a broken commit that reaches `main` will block the NEXT
  # deploy until it is reverted — moving the gate to PR-time keeps main
  # always-deployable.
  #
  # Runs unconditionally on every PR + every push to a watched branch.
  # Does NOT depend on `needs.detect-changes.outputs.has_changes` — infra
  # drift can land without touching apps/libs/web (e.g. PR edits only
  # `infrastructure/nats/services.yaml` or `docker-compose.droplet.yml`),
  # and the gate MUST still fire in that case.
  #
  # Tier-1 Make-Impossible guard (CLAUDE.md architectural hierarchy):
  # breaking any SSoT at PR time fails CI BEFORE the deploy pipeline
  # starts — `main` cannot carry a commit that the deploy workflow would
  # immediately reject.
  pre-flight:
    needs: detect-changes
    # No `has_changes` gate — infra/compose/NATS drift must always fire.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # persist-credentials:false — this job never pushes; default-true
          # leaks a write-scoped token into bash subshells for no benefit.
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python3 -m pip install --quiet 'pyyaml==6.0.2'

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: 'v3.16.3'

      # ── Phase A2 — compose interpolation validation ──────────────────────
      # `docker compose config --quiet` expands every `${VAR:?...}` in the
      # compose file. Missing required vars abort with a non-zero exit. We
      # feed it `infrastructure/deploy/ci-test.env` so the compose grammar
      # is validated without any real secret — it is the DECLARED shape we
      # are asserting, not the runtime value. Detects:
      #   - YAML syntax errors
      #   - `${VAR:?}` for a variable absent from ci-test.env (⇒ the
      #     manifest + ci-test.env have drifted)
      #   - service/volume/network references that don't resolve
      - name: Phase A2 — validate docker-compose.droplet.yml interpolation
        run: |
          docker compose \
            --env-file infrastructure/deploy/ci-test.env \
            -f docker-compose.droplet.yml \
            config --quiet

      - name: Phase A2 — validate docker-compose.prod.yml interpolation
        run: |
          docker compose \
            --env-file infrastructure/deploy/ci-test.env \
            -f docker-compose.prod.yml \
            config --quiet

      - name: Phase A2 — validate docker-compose.yml interpolation
        run: |
          docker compose \
            --env-file infrastructure/deploy/ci-test.env \
            -f docker-compose.yml \
            config --quiet

      # ── Phase A3 — NATS SSoT drift check (services.yaml ↔ nats.conf) ────
      # ADR-015: `infrastructure/nats/services.yaml` is the single source
      # of truth for NATS authorization. `scripts/nats/generate-nats-conf.py`
      # regenerates the `authorization.users[]` block in nats.conf between
      # `# BEGIN GENERATED` / `# END GENERATED` sentinels. Running the
      # generator and asserting `git diff --quiet` catches the most common
      # drift pattern (operator edits services.yaml but forgets to run the
      # generator, OR hand-edits the generated block).
      - name: Phase A3 — NATS SSoT drift (services.yaml to nats.conf)
        run: |
          python3 scripts/nats/generate-nats-conf.py
          if ! git diff --quiet infrastructure/docker/nats/nats.conf; then
            echo "::error::nats.conf drifted from infrastructure/nats/services.yaml"
            echo "Run 'python3 scripts/nats/generate-nats-conf.py' locally and commit the diff."
            git diff infrastructure/docker/nats/nats.conf | head -100
            exit 1
          fi
          echo "OK: nats.conf matches services.yaml"

      # ── Phase A3 — cert CN list structural SSoT check ────────────────────
      # WS1 landed 2026-04-14 (commit 0d249dd0): generate-internal-certs.sh
      # now DERIVES its per-service cert CN loop from services.yaml via
      # inline python3 + PyYAML (no hardcoded list). Structural SSoT — but
      # regressions happen: a well-meaning refactor could re-introduce a
      # hardcoded list ("just for now") and drift would compile silently.
      # This guard asserts the script STILL derives from services.yaml.
      - name: Phase A3 — cert script reads services.yaml (structural)
        run: |
          if ! grep -q 'SERVICES_YAML=.*infrastructure/nats/services.yaml' \
              infrastructure/docker/scripts/generate-internal-certs.sh; then
            echo "::error::generate-internal-certs.sh no longer reads services.yaml."
            echo "The cert CN list MUST derive from SSoT. See ADR-015 + WS1 (commit 0d249dd0)."
            exit 1
          fi
          if ! grep -q 'python3.*yaml\.safe_load' \
              infrastructure/docker/scripts/generate-internal-certs.sh; then
            echo "::error::generate-internal-certs.sh lost its YAML parsing step."
            echo "The cert CN list MUST be parsed from services.yaml at script-run time."
            exit 1
          fi
          echo "OK: generate-internal-certs.sh derives CN list from services.yaml"

      # ── Phase A4 — helm chart template validation ────────────────────────
      # `helm template` runs the chart through go-template rendering without
      # touching any cluster. Catches:
      #   - template syntax errors
      #   - missing required values
      #   - schema violations on values.yaml
      #   - struct/list type mismatches
      # Both staging and production values files are rendered so neither
      # environment's manifest shape can regress silently.
      # Helm template dummy values — these are rendering-stage placeholders
      # so `{{ required ... }}` template directives pass; real values live
      # in a Kubernetes Secret / ExternalSecret at install time. The values
      # here deliberately do NOT match any real credential and would fail at
      # container runtime — exactly as intended (same design contract as
      # infrastructure/deploy/ci-test.env).
      - name: Phase A4 — helm chart template (values-production.yaml)
        run: |
          helm template aquaculture \
            infrastructure/helm/aquaculture \
            --values infrastructure/helm/aquaculture/values.yaml \
            --values infrastructure/helm/aquaculture/values-production.yaml \
            --set-string secrets.databaseUrl=postgres://ci:dummy@localhost:5432/ci \
            --set-string secrets.redisUrl=redis://:dummy@localhost:6379 \
            --set-string secrets.natsUrl=tls://nats:4222 \
            --set-string secrets.jwtPrivateKey=ci-dummy-jwt-private-key \
            --set-string secrets.jwtPublicKey=ci-dummy-jwt-public-key \
            --set-string secrets.passwordPepper=ci-dummy-password-pepper \
            --set-string secrets.stripeWebhookSecret=ci-dummy-stripe-webhook \
            --set-string secrets.stripeApiKey=ci-dummy-stripe-api-key \
            --skip-tests \
            > /tmp/helm-prod.yaml
          echo "OK: helm template (production) rendered $(wc -l < /tmp/helm-prod.yaml) lines"

      - name: Phase A4 — helm chart template (values-staging.yaml)
        run: |
          helm template aquaculture \
            infrastructure/helm/aquaculture \
            --values infrastructure/helm/aquaculture/values.yaml \
            --values infrastructure/helm/aquaculture/values-staging.yaml \
            --set-string secrets.databaseUrl=postgres://ci:dummy@localhost:5432/ci \
            --set-string secrets.redisUrl=redis://:dummy@localhost:6379 \
            --set-string secrets.natsUrl=tls://nats:4222 \
            --set-string secrets.jwtPrivateKey=ci-dummy-jwt-private-key \
            --set-string secrets.jwtPublicKey=ci-dummy-jwt-public-key \
            --set-string secrets.passwordPepper=ci-dummy-password-pepper \
            --set-string secrets.stripeWebhookSecret=ci-dummy-stripe-webhook \
            --set-string secrets.stripeApiKey=ci-dummy-stripe-api-key \
            --skip-tests \
            > /tmp/helm-staging.yaml
          echo "OK: helm template (staging) rendered $(wc -l < /tmp/helm-staging.yaml) lines"

      # ── Phase A4 — required-secret manifest lint ─────────────────────────
      # `infrastructure/deploy/required-secrets.yaml` is the SSoT for which
      # env vars are mandatory at deploy time. `validate-required-secrets.py`
      # asserts the manifest, the compose files' `${VAR:?}` patterns, and
      # `infrastructure/deploy/ci-test.env` all agree. Any drift between the
      # three blocks fails CI with an explicit "missing: VAR_NAME" message
      # (not a generic YAML parse error).
      #
      # This closes the "operator adds ${STRIPE_SECRET_KEY:?} to compose but
      # forgets to update the deploy pre-flight manifest" failure mode that
      # crashed the 2026-04-14 deploy cascade.
      - name: Phase A4 — required-secret manifest SSoT
        run: python3 scripts/ci/validate-required-secrets.py

  # M-FE-03: npm audit on every PR — catches vulnerable dependencies before merge.
  # Only runs on PRs (not push to main) to avoid blocking deploys.
  security-audit:
    needs: [install, detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit
      - name: Run npm audit
        run: npm audit --audit-level=high --omit=dev || true

  docs-check:
    needs: detect-changes
    if: |
      always() &&
      contains(github.event.head_commit.modified, 'docs/') ||
      contains(github.event.head_commit.added, 'docs/')
    runs-on: ubuntu-latest
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Check markdown files
        run: markdownlint 'docs/**/*.md' --ignore node_modules || true
