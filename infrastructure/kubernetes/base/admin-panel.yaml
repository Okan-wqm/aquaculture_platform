# =============================================================================
# Aquaculture Platform - Admin Panel Microfrontend
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-panel
  namespace: aquaculture
  labels:
    app: admin-panel
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-panel
  template:
    metadata:
      labels:
        app: admin-panel
        tier: frontend
    spec:
      # SEC-011: frontend pods have no reason to call the K8s API
      automountServiceAccountToken: false
      # SEC-017: pull secret for GHCR private registry
      imagePullSecrets:
        - name: ghcr-pull-secret
      volumes:
        # SEC-005: emptyDir volumes required by nginx with readOnlyRootFilesystem
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      containers:
        - name: admin-panel
          # ARCH-013: no tag here; tag set via Kustomize images transformer
          image: ghcr.io/aquaculture/admin-panel
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          # ARCH-003: readinessProbe added — pods only receive traffic when ready
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            # SEC-005: allowPrivilegeEscalation and readOnlyRootFilesystem
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # SEC-006: seccompProfile and capabilities drop ALL
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: admin-panel
  namespace: aquaculture
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: admin-panel
