# =============================================================================
# Aquaculture Platform - Staging Values Overlay
# =============================================================================
# Apply with:
#   helm install aquaculture-staging ./aquaculture \
#     -n aquaculture-staging --create-namespace \
#     -f values-staging.yaml \
#     --set secrets.jwtSecret=$STAGING_JWT_SECRET \
#     --set secrets.databaseUrl=$STAGING_DATABASE_URL \
#     --set secrets.redisUrl=$STAGING_REDIS_URL \
#     --set secrets.natsUrl=$STAGING_NATS_URL \
#     --set postgresql.auth.password=$STAGING_PG_PASSWORD \
#     --set redis.auth.password=$STAGING_REDIS_PASSWORD
# =============================================================================

global:
  nodeEnv: staging
  imageRegistry: ghcr.io

namespace: aquaculture-staging

# Reduced replicas for staging to save costs
gatewayApi:
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    tag: "1.0.0"

authService:
  replicaCount: 1
  image:
    tag: "1.0.0"

farmService:
  replicaCount: 1
  image:
    tag: "1.0.0"

sensorService:
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    tag: "1.0.0"

alertEngine:
  replicaCount: 1
  image:
    tag: "1.0.0"

notificationService:
  replicaCount: 1
  image:
    tag: "1.0.0"

billingService:
  replicaCount: 1
  image:
    tag: "1.0.0"

hrService:
  replicaCount: 1
  image:
    tag: "1.0.0"

shell:
  replicaCount: 1
  image:
    tag: "1.0.0"

dashboard:
  replicaCount: 1
  image:
    tag: "1.0.0"

farmModule:
  replicaCount: 1
  image:
    tag: "1.0.0"

processEditor:
  enabled: false

adminPanel:
  replicaCount: 1
  image:
    tag: "1.0.0"

# Use in-cluster sub-charts for staging (not managed services)
postgresql:
  enabled: true
  primary:
    persistence:
      size: 5Gi

redis:
  enabled: true
  master:
    persistence:
      size: 1Gi

# Use separate path prefix to avoid cross-environment contamination
externalSecrets:
  enabled: false
  pathPrefix: "aquaculture/staging"
  refreshInterval: "30m"

networkPolicy:
  enabled: true

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
