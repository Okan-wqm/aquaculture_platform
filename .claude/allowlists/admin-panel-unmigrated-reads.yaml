# admin-panel pages that reach the network WITHOUT the data layer
# (ADMIN-HIGH-105).
#
# A page is UNMIGRATED when it imports an admin API client directly
# (`services/adminApi` or `services/api/*`) and names neither `useAdminQuery`
# nor `useAdminMutation`. That one criterion covers both shapes the pages use
# today — `useAsyncData(fetcher)` and a bare `useEffect(() => { void
# somethingApi.get() })` — because the property that matters is not which
# helper runs the fetch, it is that the result lands outside the shell's
# `QueryClient`:
#
#   * a write cannot invalidate the reads it affected, so lists go stale until
#     something else happens to refetch (the class `useAdminMutation` exists to
#     remove), and
#   * the data sits in a second cache that only the ADMIN-HIGH-105 logout
#     registration in `useAsyncData` keeps from outliving its session.
#
# Keyed by FILE and by IMPORT, never by line number or by call-site regex: a
# line-numbered ratchet breaks on any edit above a call and trains people to
# bump it rather than read it, and a regex ratchet quietly under-counts.
#
# tests/invariants/admin-panel-data-layer.spec.ts requires every unmigrated
# page to appear here with its batch, an owner, a future expiry, the finding
# that owns the migration and a reason — and requires every LISTED page to
# still be unmigrated, so a finished page cannot be left behind to hold the
# ceiling up. `ceiling` is the maximum number of entries and only decreases.
#
# 44 of 44 pages at W8a: the primitives shipped in an earlier release
# and were never exported from `hooks/index.ts`, so no page could reach them.
# W8b migrated AuditLogPage and ActivityLogPage: 42 remain.
# Batches: tenant 6, billing 11, security 3, system 13, messaging 9.
# The ceiling drops with each batch and this file is deleted at 0.
