# ============================================
# Mosquitto MQTT Broker - Production (Demo)
# ============================================
# Simplified config for DigitalOcean droplet demo.
# TODO: Switch to HTTP auth backend (mosquitto-go-auth)
# for proper tenant-isolated ACL enforcement.

# TCP Listener
listener 1883

# WebSocket Listener (for browser clients)
listener 9001
protocol websockets

# Authentication - anonymous for demo
# TODO: Switch to allow_anonymous false + HTTP auth plugin
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Connection limits
max_connections 100
max_queued_messages 1000
max_inflight_messages 20
max_keepalive 300
