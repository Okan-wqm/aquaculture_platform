services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aqua-mosquitto
    ports:
      - "1883:1883"
      - "9002:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - aqua-simulator
      # ARCH-019: Also join the main network so sensor-service can reach
      # Mosquitto via container name (aqua-mosquitto:1883) on all platforms
      - aqua-network
    restart: unless-stopped

  nodered:
    # ARCH-004: Pinned to specific version (not latest)
    image: nodered/node-red:4.0.9
    container_name: aqua-nodered
    # SEC-016: Bind editor port to localhost only — not accessible from LAN
    ports:
      - "127.0.0.1:1880:1880"
    volumes:
      - ./nodered/data:/data
      # Mount settings.js with adminAuth configured (SEC-016)
      - ./nodered/settings.js:/data/settings.js:ro
    environment:
      - TZ=Europe/Istanbul
    depends_on:
      - mosquitto
    networks:
      - aqua-simulator
    restart: unless-stopped

networks:
  aqua-simulator:
    driver: bridge
    name: aqua-simulator
  # ARCH-019: Join the main aqua-network so sensor-service can reach Mosquitto
  # via container name instead of host.docker.internal (Linux compatible).
  # The main stack must be started first: docker compose up -d
  aqua-network:
    external: true
    name: aqua-network
