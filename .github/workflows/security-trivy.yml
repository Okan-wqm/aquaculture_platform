name: Security - Trivy

# SEC-CI-002: All third-party actions pinned to full commit SHAs
# SEC-CI-008: exit-code already '1' (confirmed in current file); verified here

on:
  # Only run on main branch pushes (not every PR)
  push:
    branches: [ main ]
  # Weekly instead of daily (saves runner minutes)
  schedule:
    - cron: '0 3 * * 0'  # Sunday at 3 AM
  workflow_dispatch:

jobs:
  trivy-fs-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload
    steps:
      - name: Checkout repository
        # SEC-CI-002: pinned to SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # SEC-CI-008: exit-code '1' ensures CRITICAL/HIGH CVEs block the pipeline
      - name: Run Trivy filesystem scan
        # SEC-CI-002: pinned to SHA (was @master)
        uses: aquasecurity/trivy-action@18bd52d7b82b166b39e4e73c2a93e4f0a5be01d2 # v0.20.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Upload SARIF results
        # SEC-CI-002: pinned to SHA
        uses: github/codeql-action/upload-sarif@45775bd8235c68ba998cffa5171334d58593da47 # v3.28.1
        with:
          sarif_file: trivy-fs.sarif
        if: always()

  # Image scan only runs weekly (optional)
  trivy-image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        # SEC-CI-002: pinned to SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Pull pre-built image from GHCR
        run: |
          # Use pre-built images instead of building (MUCH faster!)
          docker pull ghcr.io/${{ github.repository }}/gateway-api:latest || echo "Image not found, skipping"
        continue-on-error: true

      # SEC-CI-008: exit-code '1' ensures CVEs block the pipeline
      - name: Run Trivy on pre-built image
        # SEC-CI-002: pinned to SHA (was @master)
        uses: aquasecurity/trivy-action@18bd52d7b82b166b39e4e73c2a93e4f0a5be01d2 # v0.20.0
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/gateway-api:latest'
          format: 'sarif'
          output: 'trivy-image.sarif'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Upload image scan SARIF results
        # SEC-CI-002: pinned to SHA
        uses: github/codeql-action/upload-sarif@45775bd8235c68ba998cffa5171334d58593da47 # v3.28.1
        with:
          sarif_file: trivy-image.sarif
        if: always()
