# =============================================================================
# Aquaculture Platform - Sensor Service
# High-throughput service for sensor data ingestion
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-service
  namespace: aquaculture
  labels:
    app: sensor-service
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sensor-service
  template:
    metadata:
      labels:
        app: sensor-service
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      # SEC-003: per-service service account
      serviceAccountName: sensor-service-sa
      # SEC-017: pull secret for GHCR private registry
      imagePullSecrets:
        - name: ghcr-pull-secret
      # ARCH-004: allow time to flush buffered sensor data before shutdown
      terminationGracePeriodSeconds: 60
      # ARCH-006: pod anti-affinity to spread replicas across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - sensor-service
                topologyKey: kubernetes.io/hostname
      # ARCH-015: topology spread for AZ resilience
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: sensor-service
      volumes:
        # SEC-004: emptyDir for /tmp since readOnlyRootFilesystem: true
        - name: tmp
          emptyDir: {}
      containers:
        - name: sensor-service
          # ARCH-013: no tag here; tag set via Kustomize images transformer
          image: ghcr.io/aquaculture/sensor-service
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: aquaculture-config
            - secretRef:
                name: aquaculture-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # ARCH-010: startupProbe replaces long initialDelaySeconds blind window
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            # SEC-004: readOnlyRootFilesystem
            readOnlyRootFilesystem: true
            # SEC-006: seccompProfile and capabilities drop ALL
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: sensor-service
  namespace: aquaculture
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      name: http
  selector:
    app: sensor-service

---
# ARCH-002: HPA with both CPU and memory metrics
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sensor-service-hpa
  namespace: aquaculture
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sensor-service
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    # ARCH-002: add memory metric — sensor ingestion is memory-bound
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
