# MQTT ingestion liveness rules (SENSOR-MEDIUM-123).
#
# The listener can be connected and "healthy" while subscribed to nothing
# (historically one denied filter failed the whole SUBSCRIBE batch). These
# rules watch the REAL counters registered by MqttClientService
# (apps/sensor-service/src/shared-mqtt/mqtt-client.service.ts) — the Grafana
# MQTT panels queried names that existed nowhere until those counters.
groups:
  - name: aquaculture.sensor.mqtt
    rules:
      - alert: MqttIngestionStalled
        expr: >
          increase(sensor_mqtt_messages_received_total{namespace="aquaculture",app="sensor-service"}[10m]) == 0
          and sensor_mqtt_connected{namespace="aquaculture",app="sensor-service"} == 1
          and sensor_mqtt_subscriptions_granted{namespace="aquaculture",app="sensor-service"} > 0
        for: 5m
        labels:
          severity: warning
          namespace: aquaculture
        annotations:
          summary: 'sensor-service MQTT listener connected but receiving nothing'
          description: >-
            The MQTT session is up and filters are subscribed, yet no messages
            arrived in 10 minutes. Either every publisher stopped or the
            listener is subscribed to the wrong/no filters — check the denied
            gauge and the boot signal log line before assuming quiet traffic.
          runbook_url: 'https://github.com/Okan-wqm/aquaculture_platform/blob/main/docs/runbooks/monitoring/mqtt-ingestion-stalled.md'

      - alert: MqttSubscriptionsDenied
        expr: sensor_mqtt_subscriptions_denied{namespace="aquaculture",app="sensor-service"} > 0
        for: 5m
        labels:
          severity: critical
          namespace: aquaculture
        annotations:
          summary: 'MQTT broker denied one or more listener subscription filters'
          description: >-
            SUBACK 0x80 on at least one filter — those topics receive NOTHING.
            The ACL grants must cover every entry of
            SENSOR_SERVICE_SUBSCRIPTION_FILTERS; the parameterized spec in
            mqtt-auth.service.spec.ts is the sync guard.
          runbook_url: 'https://github.com/Okan-wqm/aquaculture_platform/blob/main/docs/runbooks/monitoring/mqtt-ingestion-stalled.md'

      - alert: MqttListenerDisconnected
        expr: sensor_mqtt_connected{namespace="aquaculture",app="sensor-service"} == 0
        for: 2m
        labels:
          severity: critical
          namespace: aquaculture
        annotations:
          summary: 'sensor-service MQTT broker connection is down'
          description: >-
            The listener has no broker session; no MQTT ingestion is possible.
            Check broker health (aqua-mosquitto) and the go-auth HTTP backend
            (sensor-service /mqtt/auth) before restarting.
          runbook_url: 'https://github.com/Okan-wqm/aquaculture_platform/blob/main/docs/runbooks/monitoring/mqtt-ingestion-stalled.md'
