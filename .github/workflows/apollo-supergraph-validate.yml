name: Apollo Supergraph Validate

# R0 — kill runtime IntrospectAndCompose by composing the supergraph at BUILD
# time. This gate emits each subgraph's Federation v2 SDL from its code-first
# resolvers (no runtime — no DB/NATS/Redis, no @nestjs/apollo) and composes them
# with @apollo/composition. A subgraph schema change that breaks federation
# composition (an unresolvable @key, a type conflict, an invalid @requires) is a
# RED PR here, instead of a production gateway restart-loop discovered at deploy.

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/**/*.resolver.ts'
      - 'apps/**/*.entity.ts'
      - 'apps/**/*.model.ts'
      - 'apps/**/*.dto.ts'
      - 'apps/**/*.input.ts'
      - 'apps/**/*.type.ts'
      - 'apps/**/*.args.ts'
      - 'apps/**/*.object.ts'
      - 'apps/**/*.enum.ts'
      # Shared code-first types can alter emitted SDL without matching an app
      # filename convention (for example the canonical pagination types).
      - 'libs/backend-common/src/**/*.ts'
      - 'infrastructure/apollo-router/subgraphs.json'
      - 'tools/scripts/emit-subgraph-sdl.ts'
      - 'scripts/apollo-router/build-supergraph.mjs'
      - '.github/workflows/apollo-supergraph-validate.yml'
      # FE GraphQL operation sources — the contract-validation gate must run when
      # frontend queries change, not only when the backend schema changes.
      - 'web/**/*.ts'
      - 'web/**/*.tsx'
      - 'mcp/**/*.ts'
      - 'scripts/ci/validate-graphql-operations.mjs'
      - 'scripts/ci/graphql-fe-drift.baseline.json'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/**/*.resolver.ts'
      - 'apps/**/*.entity.ts'
      - 'apps/**/*.model.ts'
      - 'apps/**/*.dto.ts'
      - 'apps/**/*.input.ts'
      - 'apps/**/*.type.ts'
      - 'apps/**/*.args.ts'
      - 'apps/**/*.object.ts'
      - 'apps/**/*.enum.ts'
      - 'libs/backend-common/src/**/*.ts'
      - 'infrastructure/apollo-router/subgraphs.json'
      - 'tools/scripts/emit-subgraph-sdl.ts'
      - 'scripts/apollo-router/build-supergraph.mjs'
      - '.github/workflows/apollo-supergraph-validate.yml'
      # FE GraphQL operation sources — the contract-validation gate must run when
      # frontend queries change, not only when the backend schema changes.
      - 'web/**/*.ts'
      - 'web/**/*.tsx'
      - 'mcp/**/*.ts'
      - 'scripts/ci/validate-graphql-operations.mjs'
      - 'scripts/ci/graphql-fe-drift.baseline.json'

permissions:
  contents: read

concurrency:
  group: apollo-supergraph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Emit subgraph SDLs and compose the supergraph
        # Fails the build with the composition errors if any subgraph schema
        # cannot federate. Writes dist/graphql/supergraph.graphql on success.
        run: node scripts/apollo-router/build-supergraph.mjs

      - name: Validate every frontend GraphQL operation against the composed supergraph
        # SSoT enforcement (zero-new-drift ratchet): mirrors the gateway's
        # runtime graphql.validate() at build time over EVERY FE operation, so a
        # drifted field/argument/type fails CI instead of producing a runtime
        # 400. The pre-existing drifts are a visible, monotonic-shrink baseline
        # (scripts/ci/graphql-fe-drift.baseline.json); any NEW drift fails the
        # wall. Reads the supergraph just composed above.
        run: node scripts/ci/validate-graphql-operations.mjs

      - name: Upload composed supergraph artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supergraph-sdl
          path: |
            dist/graphql/supergraph.graphql
            dist/graphql/subgraphs/*.graphql
          retention-days: 14
          if-no-files-found: error
