name: Infrastructure - Terraform Drift Detection

# ARCH-CI-019: Scheduled workflow to detect drift between Terraform state and
# actual cloud resources. Creates a GitHub issue and Slack notification if
# drift is detected. Runs daily.
# SEC-CI-002: All third-party actions pinned to full commit SHAs

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  drift-detection:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, production]
    permissions:
      id-token: write   # Required for OIDC token request
      contents: read
      issues: write     # Required to create drift detection issues

    steps:
      - name: Checkout repository
        # SEC-CI-002: pinned to SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        # SEC-CI-002: pinned to SHA
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      # SEC-CI-004: OIDC credentials (no static AWS keys)
      - name: Configure AWS credentials (OIDC)
        # SEC-CI-002: pinned to SHA
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Terraform Init
        working-directory: ./infrastructure/terraform/environments/${{ matrix.environment }}
        run: terraform init -input=false

      - name: Terraform Plan (drift check)
        id: plan
        working-directory: ./infrastructure/terraform/environments/${{ matrix.environment }}
        # Exit code: 0=no changes, 2=changes/drift, 1=error
        run: |
          set +e
          terraform plan \
            -input=false \
            -detailed-exitcode \
            -no-color \
            -out=drift-check.plan > /tmp/plan-output.txt 2>&1
          PLAN_EXIT=$?
          echo "exit_code=${PLAN_EXIT}" >> $GITHUB_OUTPUT
          cat /tmp/plan-output.txt
          exit 0
        env:
          TF_VAR_allowed_cidrs: ${{ secrets[format('EKS_ALLOWED_CIDRS_{0}', matrix.environment)] }}

      - name: Report drift to GitHub Step Summary
        run: |
          EXIT_CODE="${{ steps.plan.outputs.exit_code }}"
          echo "## Terraform Drift Detection: ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          if [ "$EXIT_CODE" = "0" ]; then
            echo "No drift detected. Infrastructure matches Terraform state." >> $GITHUB_STEP_SUMMARY
          elif [ "$EXIT_CODE" = "2" ]; then
            echo "**DRIFT DETECTED**: Infrastructure has diverged from Terraform state." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See workflow run for full plan output." >> $GITHUB_STEP_SUMMARY
          else
            echo "Terraform plan failed with exit code $EXIT_CODE." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create GitHub Issue on drift
        if: steps.plan.outputs.exit_code == '2'
        # SEC-CI-002: pinned to SHA
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.existsSync('/tmp/plan-output.txt')
              ? fs.readFileSync('/tmp/plan-output.txt', 'utf8').slice(0, 4000)
              : 'Plan output not available';
            const env = '${{ matrix.environment }}';
            const today = new Date().toISOString().split('T')[0];
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const title = `Infrastructure Drift Detected: ${env} (${today})`;
            const body = [
              '## Terraform Drift Detected',
              '',
              `**Environment:** ${env}`,
              `**Detected at:** ${new Date().toISOString()}`,
              `**Workflow run:** ${runUrl}`,
              '',
              'Infrastructure has diverged from the Terraform state. Review the plan',
              'output and apply changes or update Terraform to resolve the drift.',
              '',
              '<details><summary>Terraform Plan Output</summary>',
              '',
              '```',
              planOutput,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['infrastructure', 'drift', 'automated'],
            });

      - name: Notify Slack on drift
        if: steps.plan.outputs.exit_code == '2'
        # SEC-CI-002: pinned to SHA
        uses: 8398a7/action-slack@1eb2f4ead5f2a36c3119f7bd2b99f7c15bfee1ee # v3.18.0
        with:
          status: failure
          channel: '#devops'
          text: >
            Infrastructure drift detected in ${{ matrix.environment }}!
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
