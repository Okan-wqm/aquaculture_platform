[package]
name = "sensor-ingestion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Rust sidecar for the sensor-service ingestion hot path. MQTT subscribe -> protocol-codec parse -> tenant-scoped validate -> TimescaleDB COPY -> NATS event publish. Per-tenant feature-flag rollout per ADR-025."

[[bin]]
name = "sensor-ingestion"
path = "src/main.rs"

[dependencies]
# Workspace crates the binary wires together.
protocol-codec = { path = "../../crates/protocol-codec" }
tenant-context = { path = "../../crates/tenant-context" }
nats-client = { path = "../../crates/nats-client" }
observability = { path = "../../crates/observability" }

# Async runtime + IO.
tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }
bytes = { workspace = true }

# Config + serde.
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

# Identity + time.
uuid = { workspace = true }
chrono = { workspace = true }

# MQTT — same crate the edge agent uses (rumqttc 0.25 = pure Rust + rustls).
rumqttc = { version = "0.25", features = ["use-rustls"] }

# Tenant/sensor topic-cache (Faz 2 stage 8):
#   moka — bounded TinyLFU+LRU cache with native max_capacity, eviction
#     listener, and per-key invalidate. The cache is the storage layer.
#     Picked over a hand-rolled `RwLock<HashMap>` because the global cap
#     and per-tenant cap both require eviction (not rejection); writing a
#     correct LRU by hand is busywork that moka already ships, audited.
#     Same crate the edge agent uses (sens-api-gateway/Cargo.toml `moka =
#     "0.12"`), so the supply-chain footprint is unchanged platform-wide.
#   papaya — read-heavy lock-free concurrent map for the per-tenant entry
#     counter (`papaya::HashMap<TenantId, AtomicUsize>`). Per the plan
#     (`docs/plans/sensor-rust-migration/PLAN.md` § Faz 2 — Multi-Tenant
#     Cache) papaya is the chosen primitive for read-99:1 lookups. The
#     counter is hit on every cache insert/evict (write) and on every
#     per-tenant cap probe (read); papaya's seqlock-based reads keep the
#     hot read path lock-free.
moka = { version = "0.12", features = ["sync"] }
papaya = "0.2"

# Persistence (Faz 2 stage 9):
#   tokio-postgres — async pure-Rust postgres client. Picked because
#     (a) it ships native binary COPY IN via `BinaryCopyInWriter` —
#     text COPY is YASAK on the hot path per plan § Faz 2 (the binary
#     framing is ~3-5x faster + zero string allocation per tuple);
#     (b) it composes natively with rustls (NO openssl per workspace
#     deny.toml ban); (c) it is the upstream that `deadpool-postgres`
#     wraps, so the pool primitive and the driver primitive share a
#     version pin transparently.
#   tokio-postgres-rustls — TLS bridge crate from the tokio-postgres
#     authors. Required because `tokio-postgres` itself is TLS-agnostic
#     (`NoTls` by default). The rustls bridge gives us SCRAM channel
#     binding (`tls-server-end-point`) — the postgres-side auth check
#     that `sslmode=verify-full` alone does NOT enforce. Without
#     channel binding, an MITM with a forged-but-trusted cert can still
#     phish a SCRAM exchange; with it, the SCRAM client-final message
#     binds to the server cert hash and the swap fails.
#   deadpool-postgres — connection pool sitting on top of
#     `tokio-postgres`. Plan named deadpool explicitly (PLAN.md § Faz 2
#     Crate Seçimleri). Picked over hand-rolled round-robin because
#     it ships health-checks, recycle hooks, and a typed `Manager` —
#     re-implementing those would be a strict downgrade in correctness.
#   rustls + rustls-pemfile — workspace-pinned TLS primitive + PEM
#     loader for the rustls ClientConfig builder. Same crates the
#     workspace nats-client crate already uses; supply-chain footprint
#     unchanged. webpki-roots is intentionally NOT pulled — the
#     deployment runs against an internal CA and the rustls
#     ClientConfig loads the platform CA explicitly via the PEM the
#     operator supplies in PostgresConfig.ca_cert_pem.
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4"] }
tokio-postgres-rustls = "0.13"
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }

# Error + tracing.
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
