# =============================================================================
# Nginx Configuration for DigitalOcean Droplet
# Reverse proxy for Aquaculture Platform
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 2048;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Request size limit
    client_max_body_size 10M;

    # Upstreams
    upstream gateway {
        server gateway-api:3000;
    }

    upstream shell {
        server shell:80;
    }

    upstream dashboard {
        server dashboard:80;
    }

    upstream farm-module {
        server farm-module:80;
    }

    upstream sensor-module {
        server sensor-module:80;
    }

    upstream admin-panel {
        server admin-panel:80;
    }

    # Main server
    server {
        listen 80;
        server_name _;

        # Health check for nginx itself
        location = /nginx-health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # GraphQL API
        location /graphql {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # Gateway health endpoint
        location /health {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
        }

        # Microfrontend remotes
        location /remotes/dashboard/ {
            proxy_pass http://dashboard/;
            add_header Access-Control-Allow-Origin *;
        }

        location /remotes/farm-module/ {
            proxy_pass http://farm-module/;
            add_header Access-Control-Allow-Origin *;
        }

        location /remotes/sensor-module/ {
            proxy_pass http://sensor-module/;
            add_header Access-Control-Allow-Origin *;
        }

        location /remotes/admin-panel/ {
            proxy_pass http://admin-panel/;
            add_header Access-Control-Allow-Origin *;
        }

        # Shell (host application) - catch-all for SPA routing
        location / {
            proxy_pass http://shell;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }
}
