name: new-aria-legal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'new-aria/arias/legal/**'
      - 'new-aria/packs/legal/**'
      - 'new-aria/scripts/ci/aria-adapters-test.sh'
      - 'new-aria/tools/aria-adapters/**'
      - 'new-aria/ui/**'
      - 'new-aria/package.json'
      - 'new-aria/Dockerfile'
      - 'new-aria/.dockerignore'
      - 'new-aria/docker-compose.yml'
      - 'new-aria/ui/package-lock.json'
      - '.github/workflows/new-aria-legal.yml'
  push:
    branches:
      - main
      - 'feat/new-aria-*'
    paths:
      - 'new-aria/arias/legal/**'
      - 'new-aria/packs/legal/**'
      - 'new-aria/scripts/ci/aria-adapters-test.sh'
      - 'new-aria/tools/aria-adapters/**'
      - 'new-aria/ui/**'
      - 'new-aria/package.json'
      - 'new-aria/Dockerfile'
      - 'new-aria/.dockerignore'
      - 'new-aria/docker-compose.yml'
      - 'new-aria/ui/package-lock.json'
      - '.github/workflows/new-aria-legal.yml'

permissions:
  contents: read

concurrency:
  group: new-aria-legal-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  legal-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            new-aria/ui/package-lock.json
      - name: Install monorepo dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Install standalone adapter dependencies
        working-directory: new-aria
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Install legal console dependencies
        working-directory: new-aria/ui
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Prepare the legal process isolation profile on the ephemeral runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apparmor-utils util-linux bubblewrap python3-venv
          # Match the image layout exposed by the worker's immutable runtime mounts.
          sudo python3 -m venv /opt/venv
          sudo /opt/venv/bin/python - <<'PY'
          import subprocess, sys, tomllib
          from pathlib import Path
          with Path('new-aria/aria-kernel/pyproject.toml').open('rb') as source:
              dependencies = tomllib.load(source)['project']['dependencies']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *dependencies])
          PY
          sudo apparmor_parser --skip-kernel-load --skip-cache new-aria/arias/legal/docker/apparmor.profile
          python3 -m json.tool new-aria/arias/legal/docker/seccomp.json > /dev/null
          sudo apparmor_parser --add new-aria/arias/legal/docker/apparmor.profile
      - name: Check the complete legal surface
        working-directory: new-aria
        run: aa-exec --profile=aria-legal -- npm run legal:check
      - name: Build the standalone runtime and console
        run: |
          docker build --tag new-aria:legal-check new-aria
          docker build --build-arg BASE_IMAGE=new-aria:legal-check --tag new-aria-ui:legal-check --file new-aria/ui/Dockerfile new-aria
      - name: Verify writer lifetime and legal worker isolation in the non-root application container
        run: |
          status=0
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges \
            --security-opt apparmor=aria-legal \
            --security-opt seccomp=new-aria/arias/legal/docker/seccomp.json \
            --workdir /opt/new-aria/ui --entrypoint /bin/sh new-aria-ui:legal-check -ec '
              id
              bwrap --version
              unshare --version
              cat /proc/self/attr/current
              grep -E "^(NoNewPrivs|Seccomp|CapEff|CapPrm|CapBnd):" /proc/self/status
              findmnt --submounts --target /proc --output TARGET,FSTYPE,VFS-OPTIONS
              exec node --test server/test/actions-lease.test.ts server/test/installation-lock.test.ts server/test/legal-worker.test.ts
            ' || status=$?
          if [ "$status" -ne 0 ]; then
            # Only policy diagnostic fields: no environment, document paths or content.
            sudo journalctl --kernel --since '-10 minutes' --no-pager | python3 -c '
          import re, sys
          for line in sys.stdin:
              if "apparmor=\"DENIED\"" in line and "profile=\"aria-legal\"" in line:
                  fields = re.findall(r"\b(operation|profile|comm|requested_mask|denied_mask|error|flags)=(\"[^\"]*\"|\S+)", line)
                  print(" ".join(key + "=" + value for key, value in fields))
          ' || true
          fi
          exit "$status"
