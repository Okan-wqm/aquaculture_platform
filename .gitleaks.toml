# Gitleaks configuration — aquaculture platform
# https://github.com/gitleaks/gitleaks
#
# SECURITY (MEDIUM-005): enforce secret-leak prevention at pre-commit and CI.
# Without this, accidental commits of .env files, PEM keys, tokens, or other
# secrets would only be caught (if at all) by manual review.

title = "aquaculture-gitleaks"

[extend]
# Inherit gitleaks' curated rule pack (AWS, GCP, Azure, Stripe, GitHub PATs,
# Slack tokens, JWT, private keys, and ~100 other patterns). Our custom rules
# below add platform-specific patterns.
useDefault = true

# ──────────────────────────────────────────────────────────────────────
# Custom rules
# ──────────────────────────────────────────────────────────────────────

[[rules]]
id = "aquaculture-env-secret-assignment"
description = "High-entropy LITERAL assignment to a suspicious env var"
# Architecture note: gitleaks runs on Go's RE2 engine which does NOT support
# lookaheads. Instead of a negative lookahead to exclude `${…}` interpolations,
# we scope the rule by PATH — only real source files can hold committed
# secrets. Compose/Helm values and `.env.example` files use env references,
# not literals, so they are path-allowlisted below.
regex = '''(?i)(JWT_SECRET|INTERNAL_SERVICE_SECRET|ENCRYPTION_KEY|MFA_ENCRYPTION_KEY|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|SMTP_PASS|NATS_.*_PASS|SUPER_ADMIN_PASSWORD|REDIS_PASSWORD|POSTGRES_PASSWORD|ADMIN_SERVICE_DB_PASS|AUTH_SERVICE_DB_PASS|PASSWORD_PEPPER)\s*[=:]\s*['\"]?([A-Za-z0-9+\/=_\-]{12,})['\"]?'''
# The rule has two capture groups: name and value. Gitleaks must report the
# value, otherwise value-oriented allowlists below are structurally unreachable.
secretGroup = 2
tags = ["secret", "env"]
[rules.allowlist]
# Files where matches are false-positives by definition — compose/Helm/env
# templates reference secrets, never contain them literally.
paths = [
  '''(?i)docker-compose[^/]*\.ya?ml$''',
  '''(?i)^infrastructure/helm/.*\.ya?ml$''',
  '''(?i)^infrastructure/kubernetes/.*\.ya?ml$''',
  '''(?i)\.env\.example$''',
  '''(?i)\.env\.[^.]+\.example$''',
  '''(?i)\.env\.sample$''',
]
# Placeholder / dev-default values that should never trip the rule even when
# they happen to live in a real source file.
regexes = [
  '''(?i)(change-?me|replace-?me|your-?secret|example|placeholder|<[a-z0-9_-]+>|dummy|fake|testonly|<[^>]+>|\$\{[^}]+\}|dev-?password|dev-?secret|devpassword)''',
  '''aquaculture-test''',
  # `const X = 'EMPLOYEE_PII_*_KEY'` holds the NAME of an env var (read at
  # runtime via configService.getOrThrow), never a secret value — the PII
  # encryption keys live only in the deploy secret store. Not a leak.
  '''EMPLOYEE_PII_[A-Z_]+_KEY''',
]

# ──────────────────────────────────────────────────────────────────────
# Global allowlist
# ──────────────────────────────────────────────────────────────────────

[allowlist]
description = "Paths and patterns that gitleaks should skip"
paths = [
  # Template and example files — these are documentation, not secrets.
  '''\.env\.example$''',
  '''\.env\.[^.]+\.example$''',
  '''\.env\.sample$''',
  # Lockfiles and build artefacts
  '''package-lock\.json$''',
  '''yarn\.lock$''',
  '''pnpm-lock\.yaml$''',
  '''dist/''',
  '''build/''',
  '''\.nx/''',
  '''node_modules/''',
  # Generated cert directory (gitignored but kept out of scan as defense in depth)
  '''^certs/''',
  # Our own plan / review docs quote finding IDs verbatim and sometimes
  # reference the relevant env var names.
  '''^docs/plans/''',
  '''^docs/reviews/''',
  '''^docs/security/''',
  '''^docs/audits/''',
  # sens-api-gateway customer-facing documentation tree carries protocol-spec
  # examples (LoRaWAN AppKey/NwkSKey, MQTT cred placeholders, OPC UA
  # UserIdentityToken samples, HMAC seeds in audit-log examples) that are
  # pedagogical, not committed secrets. Defense-in-depth: every example also
  # uses obviously-fake placeholder syntax (`<16-byte-hex-...>`, `EXAMPLE-...`)
  # so a future config drift cannot accidentally introduce real material.
  '''^sens-api-gateway/docs/''',
  # Test fixtures frequently contain deliberately insecure values.
  '''__tests__/.*fixture''',
  '''__mocks__/''',
  '''\.spec\.ts$''',
  '''\.test\.ts$''',
]

regexes = [
  # Example / dummy placeholders that look like entropy but aren't.
  '''(?i)(changeme|replace-?me|your-?secret|example|placeholder|<[a-z0-9_-]+>|dummy|fake|testonly|\$\{[^}]+\})''',
  # Docker env-var default syntax: ${VAR:-default} / ${VAR:?required}
  '''\$\{[A-Z_][A-Z0-9_]*:[:\-?][^}]*\}''',
  # Pre-generated Ed25519 / ECDSA fingerprints in unit test fixtures
  '''SHA256:[A-Za-z0-9+\/=]{32,}''',
]
