name: Rust CI

on:
  push:
    branches: [main, agentic]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - ".cargo/config.toml"
      - "crates/**"
      - "apps/sensor-ingestion/**"
      - "tools/scripts/check-codec-drift.ts"
      - ".github/workflows/rust-ci.yml"
      # SUPPLY-HIGH-002: the advisory-ignore-sync gate polices files OUTSIDE
      # the original Rust paths. Every policed surface must trigger the
      # workflow that runs the gate, or a single-file drift PR bypasses it.
      - ".cargo/audit.toml"
      - "sens-api-gateway/deny.toml"
      - "sens-api-gateway/.cargo/audit.toml"
      - "sens-api-gateway/Cargo.toml"
      - "sens-api-gateway/Cargo.lock"
      - "scripts/ci/check-advisory-ignore-sync.ts"
      - "tools/gates/local-rumqttc-fork-hygiene.spec.ts"
      - ".github/workflows/dependency-review.yml"
      - ".github/workflows/sens-api-gateway-ci.yml"
      - ".github/workflows/edge-agent-release.yml"
  pull_request:
    branches: [main, agentic]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - ".cargo/config.toml"
      - "crates/**"
      - "apps/sensor-ingestion/**"
      - "tools/scripts/check-codec-drift.ts"
      - ".github/workflows/rust-ci.yml"
      # SUPPLY-HIGH-002 mirror of the push path list above.
      - ".cargo/audit.toml"
      - "sens-api-gateway/deny.toml"
      - "sens-api-gateway/.cargo/audit.toml"
      - "sens-api-gateway/Cargo.toml"
      - "sens-api-gateway/Cargo.lock"
      - "scripts/ci/check-advisory-ignore-sync.ts"
      - "tools/gates/local-rumqttc-fork-hygiene.spec.ts"
      - ".github/workflows/dependency-review.yml"
      - ".github/workflows/sens-api-gateway-ci.yml"
      - ".github/workflows/edge-agent-release.yml"
  workflow_dispatch: {}

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  # RUST-CVE-001 make-it-detectable gate: the advisory ignore lists live in
  # 8 surfaces (2 deny.toml, 2 .cargo/audit.toml, `--ignore` flags in 3
  # workflow audit steps, dependency-review allow-ghsas). This job fails on
  # lock-step drift, missing owner/deadline/finding-id metadata, expired
  # deadlines, and re-ignoring of tombstoned (fork-resolved) advisories.
  advisory-ignore-sync:
    name: advisory ignore lock-step
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: check-advisory-ignore-sync
        run: node scripts/ci/check-advisory-ignore-sync.ts
      # EDGE-HIGH-001 / SUPPLY-HIGH-001: the fork-hygiene gate must be
      # CI-enforced, not pre-commit-only (hooks are bypassable; web-UI and
      # bot commits never run husky). The spec uses node builtins only, so
      # it runs without npm install.
      - name: local-rumqttc fork hygiene
        run: node --experimental-strip-types tools/gates/local-rumqttc-fork-hygiene.spec.ts
      # SUPPLY-MEDIUM-001: prove the vendored tree equals the PUBLISHED
      # crates.io artifact, not merely its own manifest. Fetch the .crate,
      # pin its sha256 to the pre-fork lockfile checksum, extract, and
      # compare every non-divergent manifest entry byte-for-byte.
      - name: fork provenance vs crates.io artifact
        run: |
          set -euo pipefail
          CRATE_SHA="0feff8d882bff0b2fddaf99355a10336d43dd3ed44204f85ece28cf9626ab519"
          curl -sfL --retry 3 https://static.crates.io/crates/rumqttc/rumqttc-0.25.1.crate -o /tmp/rumqttc.crate
          echo "${CRATE_SHA}  /tmp/rumqttc.crate" | sha256sum -c -
          mkdir -p /tmp/rumqttc-upstream && tar xzf /tmp/rumqttc.crate -C /tmp/rumqttc-upstream
          FAIL=0
          while read -r hash file; do
            case "$file" in
              ./Cargo.toml|./src/tls.rs) continue ;; # allowed-divergent (pinned by FORK-EDITS.sha256)
            esac
            UP="/tmp/rumqttc-upstream/rumqttc-0.25.1/${file#./}"
            if [ ! -f "$UP" ]; then echo "MISSING in published artifact: $file"; FAIL=1; continue; fi
            UPHASH=$(sha256sum "$UP" | cut -d' ' -f1)
            if [ "$UPHASH" != "$hash" ]; then echo "MANIFEST MISMATCH vs published artifact: $file"; FAIL=1; fi
          done < crates/local-rumqttc/UPSTREAM-MANIFEST.sha256
          [ "$FAIL" -eq 0 ] && echo "vendored tree == published crates.io artifact (minus the 2 pinned fork edits)"
          exit "$FAIL"

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.88.0
          components: clippy
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/agentic' }}
      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.88.0
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/agentic' }}
      - name: cargo test --workspace --all-features --no-fail-fast
        run: cargo test --workspace --all-features --no-fail-fast

  deny:
    name: cargo-deny check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: cargo-deny check (advisories, bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check advisories bans licenses sources
          rust-version: "1.88.0"

  audit:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # rustsec/audit-check installs cargo-audit from source, which currently
      # requires rustc >= 1.89 (smol_str 0.3.6 transitive). taiki-e/install-action
      # ships precompiled binaries — no MSRV treadmill, no source build, ~5s.
      - name: Install cargo-audit (precompiled)
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-audit
      # Advisory ignores live in .cargo/audit.toml (mirrors deny.toml
      # [advisories]); any future `--ignore` flag added here MUST appear in
      # both files too — scripts/ci/check-advisory-ignore-sync.ts enforces
      # the lock-step and rejects entries with missing metadata or past
      # deadlines. 2026-06-11: the RUST-CVE-001 rumqttc-chain ignores were
      # removed (vendored fork crates/local-rumqttc, see UPSTREAM.md).
      - name: cargo audit
        run: |
          cargo audit --deny warnings

  drift:
    name: codec-drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.88.0
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/agentic' }}
      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: codec-drift script (validates fixtures + runs Rust golden test)
        run: node --experimental-strip-types tools/scripts/check-codec-drift.ts
      - name: sensor deploy-contract parity (TS AJV schemas ↔ Rust serde structs)
        run: node --experimental-strip-types tools/scripts/check-sensor-contract-parity.ts

  doc:
    # cargo doc with RUSTDOCFLAGS=-D warnings turns any broken intra-doc
    # link or missing-docs violation into a CI failure. Without this job
    # the Rust workspace's rustdoc output can silently rot — identifiers
    # rename, links 404, private-item summaries drift away from code.
    # `--document-private-items` enforces the internal API surface too
    # (sensor-ingestion publishes public-API rustdoc via separate job
    # when Faz 4 ships). ADR-032 supply-chain hardening references this
    # job as the "documentation attestation" anchor.
    name: cargo doc -D warnings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # -D warnings promotes every rustdoc lint (broken link, missing
      # section, untracked feature gate) to a hard fail. Note this is
      # a per-job override — the top-level RUSTFLAGS stays -D warnings
      # for compiler lints, RUSTDOCFLAGS is the rustdoc equivalent.
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.88.0
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ci
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/agentic' }}
      - name: cargo doc --no-deps --workspace --document-private-items
        run: cargo doc --no-deps --workspace --document-private-items

  cross-build:
    name: cross-build (musl)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Both x86_64 and aarch64 musl targets build on every push. Both go
    # through `cross` (cross-rs/cross) — cross runs the compiler inside a
    # target-specific Docker image that ships the musl-cross toolchain,
    # so the workflow does not depend on apt-get musl packages or
    # per-arch linker downloads. Uniform tooling for every target =
    # one code path to reason about. ADR-032 supply-chain hardening
    # pins the primitive; aarch64 is mandatory from Faz 0 per the
    # Rust migration delta plan (Kör Nokta 15 — enterprise-grade
    # cross-compile discipline even while sensor-ingestion targets
    # cloud x86_64, so edge-adoption in Faz 4 inherits a green ARM
    # build that has always been built and tested).
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain (with target)
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - name: Install cross (precompiled)
        # taiki-e/install-action installs cross as a prebuilt binary —
        # no cargo install from source, no MSRV surprises, ~5s. The
        # pinned SHA matches the one the audit job uses so every binary
        # we pull is from the same verified release chain.
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cross
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-cross-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/agentic' }}
      - name: cross build --workspace --release --target ${{ matrix.target }}
        # cross wraps cargo, running the compiler inside a target-specific
        # Docker image. Same invocation for both x86_64 and aarch64 —
        # the image per target handles the musl toolchain and linker
        # automatically. Docker pull is cached by GHA runner's Docker
        # layer cache on warm runners.
        run: cross build --workspace --release --target ${{ matrix.target }}

  summary:
    name: Rust CI summary
    if: always()
    # SUPPLY-HIGH-002: advisory-ignore-sync is part of the aggregate gate —
    # a job outside `needs` cannot fail the rollup check.
    needs: [advisory-ignore-sync, fmt, clippy, test, deny, audit, drift, doc, cross-build]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ needs.advisory-ignore-sync.result }}" != "success" ] \
             || [ "${{ needs.fmt.result }}" != "success" ] \
             || [ "${{ needs.clippy.result }}" != "success" ] \
             || [ "${{ needs.test.result }}" != "success" ] \
             || [ "${{ needs.deny.result }}" != "success" ] \
             || [ "${{ needs.audit.result }}" != "success" ] \
             || [ "${{ needs.drift.result }}" != "success" ] \
             || [ "${{ needs.doc.result }}" != "success" ] \
             || [ "${{ needs.cross-build.result }}" != "success" ]; then
            echo "One or more required Rust CI jobs failed."
            exit 1
          fi
          echo "All Rust CI jobs succeeded."
