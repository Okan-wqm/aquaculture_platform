# =============================================================================
# Ingress
# =============================================================================

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Rate limiting — protects backend services in addition to application-level limits
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # Security response headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "X-XSS-Protection: 1; mode=block";
  hosts:
    - host: app.aquaculture.io
      paths:
        - path: /
          pathType: Prefix
          service: shell
    - host: api.aquaculture.io
      paths:
        - path: /
          pathType: Prefix
          service: gateway-api
  tls:
    - secretName: aquaculture-tls
      hosts:
        - app.aquaculture.io
        - api.aquaculture.io

# =============================================================================
# Security
# =============================================================================

serviceAccount:
  create: true
  name: aquaculture-sa
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# SECURITY (MEDIUM-006): Kubernetes Pod Security Standards (PSS).
# Namespace-level admission controller labels — see templates/namespace.yaml.
# The restricted profile enforces runAsNonRoot, capabilities drop ALL,
# readOnlyRootFilesystem, seccompProfile=RuntimeDefault — all of which the
# platform's securityContext helper already satisfies, so no workload needs
# changes. If a specific deployment requires relaxed policy (e.g. a legacy
# sidecar), override to `baseline` here and restrict with a NetworkPolicy.
podSecurityStandards:
  enforce: "restricted"
  enforceVersion: "latest"
  audit: "restricted"
  auditVersion: "latest"
  warn: "restricted"
  warnVersion: "latest"

networkPolicy:
  enabled: true

# =============================================================================
# Secrets
# =============================================================================
# All credential fields are REQUIRED and have no default.
# Supply them via --set, a sealed-secrets overlay, or externalSecrets.

secrets:
  # REQUIRED: full PostgreSQL connection URL
  # e.g. postgres://aquaculture:<password>@postgresql:5432/aquaculture
  databaseUrl: ""
  # REQUIRED: full Redis connection URL
  # e.g. redis://:<password>@redis-master:6379
  redisUrl: ""
  # REQUIRED: RS256 private key PEM (auth-service only — sole token issuer).
  # Generate with: infrastructure/docker/scripts/generate-jwt-keypair.sh
  jwtPrivateKey: ""
  # REQUIRED: RS256 public key PEM (distributed to every backend service for verification).
  jwtPublicKey: ""
  # DEPRECATED: HS256 shared secret. Retained as a legacy sentinel for dev fallback
  # (ALLOW_DEV_JWT_SECRET=true). Not used in production RS256 verification path.
  jwtSecret: ""
  # REQUIRED: NATS connection URL (no credentials — each service authenticates with its per-service account below).
  # e.g. tls://nats:4222
  natsUrl: ""
  # SECURITY (HIGH-001): per-service NATS credentials. Each service has its own
  # account with subject-level ACLs in nats.conf. Injected into each backend
  # deployment as NATS_AUTH_USER / NATS_AUTH_PASS (client side) and into the
  # nats container as $NATS_<SERVICE>_USER / $NATS_<SERVICE>_PASS (server side).
  # Generate passwords with: openssl rand -base64 32
  natsAuth:
    authUser: auth_service
    authPass: ""
    farmUser: farm_service
    farmPass: ""
    sensorUser: sensor_service
    sensorPass: ""
    gatewayUser: gateway_service
    gatewayPass: ""
    notificationUser: notification_service
    notificationPass: ""
    billingUser: billing_service
    billingPass: ""
    alertUser: alert_engine
    alertPass: ""
    hrUser: hr_service
    hrPass: ""
    messagingUser: messaging_service
    messagingPass: ""
    hydroponicsUser: hydroponics_service
    hydroponicsPass: ""

# External secrets (e.g., from AWS Secrets Manager, Vault)
externalSecrets:
  enabled: false
  secretStore:
    name: ""
    kind: ClusterSecretStore
  # Path prefix for remote secret store keys.
  # Set per environment: "aquaculture/production" or "aquaculture/staging"
  pathPrefix: "aquaculture/production"
  # Refresh interval — lower during incident credential rotation (e.g., "5m")
  refreshInterval: "1h"

# =============================================================================
# Infrastructure Dependencies
# =============================================================================

postgresql:
  enabled: true
  auth:
    username: aquaculture
    # REQUIRED — set via --set postgresql.auth.password=<value>
    # An empty string disables PostgreSQL authentication. Never ship empty.
    password: ""
    database: aquaculture
  primary:
    persistence:
      size: 20Gi

redis:
  enabled: true
  auth:
    # REQUIRED — set via --set redis.auth.password=<value>
    # An empty string disables Redis authentication. Never ship empty.
    password: ""
  master:
    persistence:
      size: 5Gi

nats:
  enabled: true
  config:
    # Enable token-based authentication for NATS
    authorization:
      timeout: 5
    jetstream:
      enabled: true
      memStorage:
        size: 1Gi
      fileStorage:
        enabled: true
        size: 5Gi

# =============================================================================
# Monitoring
# =============================================================================

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s

# =============================================================================
# Probes
# =============================================================================

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
