  # ===========================================================================
  # Reverse Proxy (Nginx)
  # ===========================================================================
  nginx:
    # Pinned 2026-04-05. To update: verify changelog at https://nginx.org/en/CHANGES, test in staging first.
    image: nginx:1.27.5-alpine
    container_name: aqua-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8883:8883"
    volumes:
      - ./infrastructure/nginx/droplet.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - gateway-api
      - shell
      - mosquitto
    networks:
      - aqua-network
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
