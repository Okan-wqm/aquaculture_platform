# Alertmanager config for the DROPLET monitoring stack (B2 / OBS-HIGH-002).
#
# DELIVERY IS EMAIL. Every value below that touches a real mailbox or a real
# credential is a `.invalid` PLACEHOLDER — that TLD is reserved by RFC 2606 and
# can never resolve, so a config that reached production unrendered would fail
# loudly instead of quietly mailing a stranger. `amtool check-config` accepts
# the file as committed, which is what the monitoring-stack CI validates.
#
# scripts/monitoring/render-configs.sh substitutes the real SMTP settings,
# recipients and external deadman endpoint at activation. Nothing here is
# committed with a real address, endpoint or password.
#
# WHY EMAIL AND NOT A WEBHOOK: the original design routed to three external
# paging endpoints that were never procured, and render-configs.sh hard-failed
# on their absence — which is why no deploy path called it and why every alert
# this platform has ever raised went nowhere. The droplet already has working
# SMTP credentials (notification-service uses them), so email is the delivery
# that exists.
#
# ROLE ROUTING LATER: `page` and `digest` take SEPARATE recipient variables
# even though both default to the same operator address today. When alerts are
# split by role, the seam is already here — a new route gets its own receiver
# and its own variable, and nothing else moves.
#
# Routing is by the `severity` label, which is the single source of truth:
#   critical -> page     (immediate)
#   warning  -> digest   (batched)
#   none     -> heartbeat (the Watchdog deadman; see 50-monitoring-self.yml)
#   else     -> null     (swallowed; info-level noise never pages)
global:
  # Substituted by render-configs.sh. `.invalid` cannot resolve, so an
  # unrendered config cannot silently deliver anywhere.
  smtp_smarthost: 'smtp.invalid:587'
  smtp_from: 'alerts@example.invalid'
  smtp_auth_username: 'REPLACE_SMTP_USER'
  smtp_auth_password: 'REPLACE_SMTP_PASSWORD'
  smtp_require_tls: true

route:
  receiver: 'null'
  group_by: ['alertname', 'app']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = none
      receiver: heartbeat
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
      continue: false
    - matchers:
        - severity = critical
      receiver: page
      group_wait: 10s
      repeat_interval: 1h
      continue: false
    - matchers:
        - severity = warning
      receiver: digest
      repeat_interval: 12h
      continue: false

receivers:
  - name: 'null'

  - name: heartbeat
    webhook_configs:
      - url: 'http://127.0.0.1:9099/heartbeat'
        send_resolved: false

  - name: page
    email_configs:
      - to: 'page@example.invalid'
        send_resolved: true
        headers:
          Subject: '[AQUA CRITICAL] {{ .CommonLabels.alertname }} ({{ .Alerts.Firing | len }} firing)'
        # The runbook is the first thing an operator needs at 03:00, so it goes
        # in the body rather than three clicks away.
        html: |
          {{ range .Alerts }}<p><b>{{ .Annotations.summary }}</b></p>
          <p>{{ .Annotations.description }}</p>
          <p>Runbook: <a href="{{ .Annotations.runbook_url }}">{{ .Annotations.runbook_url }}</a></p>
          <hr>{{ end }}

  - name: digest
    email_configs:
      - to: 'digest@example.invalid'
        send_resolved: true
        headers:
          Subject: '[AQUA warning] {{ .CommonLabels.alertname }} ({{ .Alerts.Firing | len }} firing)'
        html: |
          {{ range .Alerts }}<p><b>{{ .Annotations.summary }}</b></p>
          <p>{{ .Annotations.description }}</p>
          <p>Runbook: <a href="{{ .Annotations.runbook_url }}">{{ .Annotations.runbook_url }}</a></p>
          <hr>{{ end }}

inhibit_rules:
  # A critical error/latency alert mutes the warning-level twin for the same app.
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ['alertname', 'app']
