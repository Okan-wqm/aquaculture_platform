{{/*
=============================================================================
Aquaculture Platform - ServiceMonitor
=============================================================================
Creates Prometheus Operator ServiceMonitor resources for Prometheus service
discovery. Requires prometheus-operator CRDs to be installed in the cluster.
=============================================================================
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}

{{- if .Values.gatewayApi.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "aquaculture.fullname" . }}-gateway-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aquaculture.labels" . | nindent 4 }}
    app: gateway-api
spec:
  selector:
    matchLabels:
      app: gateway-api
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}

