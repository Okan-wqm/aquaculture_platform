# cargo-audit configuration — mirrors the [advisories] section of deny.toml.
#
# Why two configs? cargo-audit and cargo-deny run as separate jobs in CI
# (rust-ci.yml: `audit` and `deny`). cargo-deny honours the ignore list
# in deny.toml; cargo-audit honours its own audit.toml. Both jobs scan
# the same advisory DB and would otherwise double-report every known
# ignored advisory. Keeping the two ignore lists in lock-step is a
# hand-maintained invariant — the per-entry comments below cross-
# reference deny.toml so drift between the two files is visible at review.
#
# Every ignored advisory MUST satisfy the same four conditions the
# deny.toml rubric enforces: (a) a tracking finding id, (b) an explicit
# owner, (c) a deadline, (d) the threat-model justification. Canonical
# rationale lives in deny.toml; this file only carries the pointer.

# 2026-06-11 — RUST-CVE-001 RESOLVED: the rumqttc-chain ignores
# (RUSTSEC-2026-0098/0099/0049/0104, RUSTSEC-2025-0134) were removed.
# rumqttc resolves to the vendored fork at crates/local-rumqttc
# (rustls-webpki >= 0.103, PEM decoding via rustls-pki-types) and
# testcontainers 0.27 cleared the last rustls-pemfile consumer.
# Regression is blocked structurally by deny.toml [bans], not by
# this list.
[advisories]
ignore = []
