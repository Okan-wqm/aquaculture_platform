name: Dependency Review

# SEC-CI-002: All third-party actions pinned to full commit SHAs

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        # SEC-CI-002: pinned to SHA (was @v4)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review
        # SEC-CI-002: pinned to SHA (was @v3)
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          # Allowlisted advisories — every entry MUST have a matching tracked
          # finding in docs/reviews/_registry/findings.jsonl and mirror the
          # ignore entries in deny.toml [advisories] + .cargo/audit.toml. Drift
          # between these three lists is a review-blocker. Full rationale +
          # threat-model justification lives in deny.toml.
          # allow-ghsas expects a COMMA-separated list. Prior `|` multi-line form
          # produced a single blob string that the action could not parse.
          #
          # Inventory:
          #   GHSA-xgp8-3hg3-c2mh  rustls-webpki wildcard name-constraint     (RUST-CVE-001 / RUSTSEC-2026-0098)
          #   GHSA-965h-392x-2mh5  rustls-webpki URI name-constraint          (RUST-CVE-001 / RUSTSEC-2026-0099)
          #   GHSA-pwjx-qhcg-rvj4  rustls-webpki CRL DP matching              (RUST-CVE-001 / RUSTSEC-2026-0049)
          #   GHSA-h395-gr6q-cpjc  jsonwebtoken < 10.3.0 Type Confusion       (RUST-CVE-002)
          # All four advisories live under edge-agent's parallel supply chain
          # (sens-api-gateway is owned by the edge agent; cross-crate bump
          # blocked upstream). Full rationale in deny.toml + .cargo/audit.toml.
          allow-ghsas: GHSA-xgp8-3hg3-c2mh,GHSA-965h-392x-2mh5,GHSA-pwjx-qhcg-rvj4,GHSA-h395-gr6q-cpjc
