# =============================================================================
# NATS Server Configuration - Aquaculture Platform
# ARCH-010: Explicit JetStream stream limits to prevent silent message drops
# =============================================================================

# JetStream configuration
jetstream {
  store_dir: /data
  max_memory_store: 96MB
  max_file_store: 2GB
}

# HTTP monitoring endpoint (internal only)
http_port: 8222

# Logging
logtime: true

# =============================================================================
# SEC-006/SEC-019/CRITICAL-002: Per-Service NATS Authorization
#
# Each service has its own user with subject-level publish/subscribe ACLs.
# A compromised service can only access the subjects its user permits.
# Credentials injected via environment variables on NATS container.
# =============================================================================
