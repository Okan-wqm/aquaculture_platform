# The semantic corpus nginx: a level that drops the inherited security headers, a level that
# re-declares them, a level that inherits them, and a comment decoy.
server {
  listen 80;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'" always;
  # DECOY: a commented add_header is not a directive.
  # add_header X-Debug yes;

  # UNSAFE TWIN: its own add_header drops both inherited headers.
  location /health {
    add_header Content-Type application/json;
    return 200 '{"ok":true}';
  }

  # SAFE TWIN: sets its own headers and re-declares both.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000";
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'" always;
  }

  # SAFE TWIN: sets nothing, so it inherits both.
  location / {
    try_files $uri /index.html;
  }
}
