# Prometheus config for the DROPLET monitoring stack (B2 / OBS-HIGH-002).
# Single-node Docker, NOT Kubernetes. The application scrape targets are NOT
# discovered by annotations — they are read from the file_sd generated from the
# service catalog SSoT (D3): infrastructure/monitoring/droplet/file_sd/
# aqua-services.json, mounted at /etc/prometheus/file_sd. A new backend appears
# as a scrape target the moment the catalog is regenerated; nothing is
# hand-maintained here.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: droplet
    cluster: aquaculture-droplet

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['aqua-alertmanager:9093']

scrape_configs:
  # Prometheus scraping itself (drives the MonitoringTargetDown self rule).
  - job_name: prometheus-self
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['aqua-alertmanager:9093']

  # Application /metrics — catalog-generated file_sd. The target labels (app,
  # namespace=aquaculture, criticality) are baked into the file_sd, so the
  # alert rules' `by (app)` + namespace selectors resolve. B1 (OBS-HIGH-001)
  # made every backend's GET /metrics @Public, so no per-target auth is needed.
  - job_name: aqua-services
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/aqua-services.json
        refresh_interval: 60s

  # Host + container metrics for the resource rules (cAdvisor labels containers
  # by `name`; node-exporter for host-level capacity).
  - job_name: cadvisor
    static_configs:
      - targets: ['aqua-cadvisor:8080']

  - job_name: node-exporter
    static_configs:
      - targets: ['aqua-node-exporter:9100']

  # NATS server/JetStream metrics (100-tenant readiness Task 0, SENSOR-HIGH-091).
  # Server-level collector; per-consumer ack-pending needs nats-surveyor (Task 2).
  - job_name: nats-exporter
    static_configs:
      - targets: ['aqua-nats-exporter:7777']
