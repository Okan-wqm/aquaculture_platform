name: Finding State Sweep

# =============================================================================
# Phase 6 deliverable per
# docs/plans/2026-04-17-agentic-post-audit-consolidation-plan.md#Phase-6.
#
# Daily cron that runs tools/gates/finding-registry.ts sweep:
#   - OPEN / IN-PROGRESS finding older than 30 days → STALE.
#   - Any non-RESOLVED finding with `deadline` < today → BLOCKED (stronger
#     signal, applied before the staleness check).
#
# Why a PR, not a direct push:
#   Auto-commits to main are a tampering surface. The sweep opens a PR that
#   CODEOWNERS review before merge — the state transitions are visible and
#   the hash-chain recomputation is deterministic, so the review is fast.
#
# Why daily (not hourly / weekly):
#   30-day staleness drifts slowly; daily granularity catches it within
#   1 day of the threshold without spamming the registry with identical
#   no-op runs.
# =============================================================================

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily (08:00 / 09:00 Oslo depending on DST)
  workflow_dispatch:
    inputs:
      stale_after:
        description: 'Days before OPEN → STALE (default 30)'
        default: '30'
        required: false
      dry_run:
        description: 'If true, print the sweep plan without mutating'
        default: 'false'
        required: false

permissions:
  actions: read
  contents: read
  id-token: write # short-lived signed authority for registry mutation

# A global concurrency group would silently replace older pending mutations.
# Command-identity-derived, create-only branches and typed expected-head
# compare-and-swap isolate collisions without discarding either request.

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: automation-publication
    steps:
      # SEC-CI-002: pinned SHA per infra-expert rule.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-aria-kernel

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies (ts-node only)
        # Dependency resolution must be peer-clean; do not hide package graph
        # conflicts in reporting jobs.
        run: npm ci --ignore-scripts --no-audit --prefer-offline

      - name: Resolve immutable Actions run clock
        id: run-clock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run automation:resolve-run-clock

      - name: Bind sweep to exact protected-main snapshot
        id: authority
        env:
          RUN_CREATED_AT: ${{ steps.run-clock.outputs.created_at }}
          STALE_AFTER_INPUT: ${{ github.event.inputs.stale_after || '30' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_REF_PROTECTED}" = "true"
          EFFECTIVE_AT="${RUN_CREATED_AT}"
          INPUT_SHA256="$(
            FINDING_EFFECTIVE_AT="${EFFECTIVE_AT}" \
              npx ts-node --project tools/gates/tsconfig.json \
              tools/gates/finding-registry.ts request-digest sweep \
              --stale-after="${STALE_AFTER_INPUT}"
          )"
          {
            echo "command_id=finding-sweep:${GITHUB_RUN_ID}"
            echo "effective_at=${EFFECTIVE_AT}"
            echo "input_sha256=${INPUT_SHA256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Compute sweep plan (dry run)
        id: plan
        env:
          STALE_AFTER_INPUT: ${{ github.event.inputs.stale_after || '30' }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run || 'false' }}
          FINDING_EFFECTIVE_AT: ${{ steps.authority.outputs.effective_at }}
        run: |
          set -euo pipefail
          STALE_AFTER="${STALE_AFTER_INPUT}"
          DRY_RUN="${DRY_RUN_INPUT}"
          if ! [[ "$STALE_AFTER" =~ ^[0-9]{1,3}$ ]]; then
            echo "::error::stale_after must be a positive integer day count: $STALE_AFTER" >&2
            exit 1
          fi
          if [ "$STALE_AFTER" -lt 1 ] || [ "$STALE_AFTER" -gt 365 ]; then
            echo "::error::stale_after must be between 1 and 365: $STALE_AFTER" >&2
            exit 1
          fi
          case "$DRY_RUN" in
            true|false) ;;
            *)
              echo "::error::dry_run must be true or false: $DRY_RUN" >&2
              exit 1
              ;;
          esac
          echo "stale_after=${STALE_AFTER}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          npx ts-node --project tools/gates/tsconfig.json \
            tools/gates/finding-registry.ts sweep \
            --dry-run --stale-after=${STALE_AFTER} |
            tee "${RUNNER_TEMP}/finding-state-sweep-plan.txt"
          # Exit early if nothing to do.
          if grep -q "^Sweep clean:" "${RUNNER_TEMP}/finding-state-sweep-plan.txt"; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist enterprise workflow preflight
        if: steps.plan.outputs.has_changes == 'true' && steps.plan.outputs.dry_run != 'true'
        env:
          PYTHONPATH: aria-kernel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          from aria_kernel.preflight import verify_workflow_preflight

          registry = "docs/reviews/_registry/findings.jsonl"
          verdict = verify_workflow_preflight(
              workflow_id="finding-state-sweep",
              job_id="sweep",
              profile="standard",
              workspace_root=os.environ["GITHUB_WORKSPACE"],
              allowed_write_roots=[registry],
              path_allowlist=[registry],
              network_policy=["github_oidc", "github_api"],
              network_enforcement_evidence="signed GitHub OIDC mutation authority plus repository-scoped GitHub App PR API",
              token_provenance="github_actions:actions_read+oidc+github_app:installation",
              dlp_mode="fail_closed",
              dlp_scan_clean=True,
              audit_reason="publish deterministic finding state sweep through automation PR",
              audit_artifact_path=Path(os.environ["RUNNER_TEMP"]) / "finding-state-sweep-preflight.json",
              external_root_allowlist=[str(Path(os.environ["RUNNER_TEMP"]).resolve())],
          )
          if not verdict.valid:
              raise SystemExit(";".join(verdict.reasons))
          PY

      - name: Apply sweep
        if: steps.plan.outputs.has_changes == 'true' && steps.plan.outputs.dry_run != 'true'
        env:
          STALE_AFTER: ${{ steps.plan.outputs.stale_after }}
          FINDING_COMMAND_ID: ${{ steps.authority.outputs.command_id }}
          FINDING_INPUT_SHA256: ${{ steps.authority.outputs.input_sha256 }}
          FINDING_EFFECTIVE_AT: ${{ steps.authority.outputs.effective_at }}
        run: |
          set -euo pipefail
          npm run findings:sweep -- --stale-after=${STALE_AFTER}

      - name: Verify post-sweep chain integrity
        if: steps.plan.outputs.has_changes == 'true' && steps.plan.outputs.dry_run != 'true'
        run: |
          npx ts-node --project tools/gates/tsconfig.json \
            tools/gates/finding-registry.ts verify

      - name: Upload immutable sweep input evidence
        if: steps.plan.outputs.has_changes == 'true' && steps.plan.outputs.dry_run != 'true'
        id: mutation-evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finding-state-sweep-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/finding-state-sweep-preflight.json
            ${{ runner.temp }}/finding-state-sweep-plan.txt
          if-no-files-found: error
          retention-days: 90

      - name: Mint repository-scoped GitHub App token
        if: steps.plan.outputs.has_changes == 'true' && steps.plan.outputs.dry_run != 'true'
        id: app-token
        uses: ./.github/actions/mint-automation-app-token
        with:
          client-id: ${{ vars.ARIA_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARIA_GITHUB_APP_PRIVATE_KEY }}
          expected-app-slug: ${{ vars.ARIA_GITHUB_APP_SLUG }}
          expected-installation-id: ${{ vars.ARIA_GITHUB_APP_INSTALLATION_ID }}

      - name: Publish idempotent sweep PR
        if: steps.plan.outputs.has_changes == 'true' && steps.plan.outputs.dry_run != 'true'
        id: publication
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          COMMAND_ID: ${{ steps.authority.outputs.command_id }}
          INPUT_SHA256: ${{ steps.authority.outputs.input_sha256 }}
        run: |
          set -euo pipefail
          BODY_FILE="$RUNNER_TEMP/finding-state-sweep-pr-body.md"
          {
            echo "Daily sweep output (30-day staleness + deadline-past escalation)."
            echo ""
            echo '```'
            cat "${RUNNER_TEMP}/finding-state-sweep-plan.txt"
            echo '```'
            echo ""
            echo "CODEOWNERS review is required before merge. Reject this PR if a listed transition should not apply."
          } > "$BODY_FILE"

          export PR_BRANCH="automation/finding-registry-active"
          export PR_TITLE="chore(findings): daily state sweep - OPEN to STALE, past-deadline to BLOCKED"
          export PR_BODY_FILE="$BODY_FILE"
          export COMMIT_MESSAGE="chore(findings): automated state sweep"
          export CHANGED_PATHS="docs/reviews/_registry/findings.jsonl"
          export EXPECTED_BASE_SHA="${GITHUB_SHA}"
          export AUTOMATION_COMMAND_ID="${COMMAND_ID}"
          export AUTOMATION_OPERATION="sweep"
          export AUTOMATION_INPUT_SHA256="${INPUT_SHA256}"
          export AUTOMATION_EVIDENCE_ARTIFACT_ID="${{ steps.mutation-evidence.outputs.artifact-id }}"
          export AUTOMATION_EVIDENCE_ARTIFACT="finding-state-sweep-input-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export AUTOMATION_EVIDENCE_SHA256="${{ steps.mutation-evidence.outputs.artifact-digest }}"
          export AUTOMATION_RESULT_PATH="${RUNNER_TEMP}/finding-state-sweep-publication.json"
          npm run automation:publish

      - name: Upload immutable sweep publication result
        if: always() && steps.publication.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automation-publication-result-${{ steps.publication.outputs.commit }}
          path: ${{ runner.temp }}/finding-state-sweep-publication.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload durable sweep publication failure
        if: always() && steps.publication.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automation-publication-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/finding-state-sweep-publication.json
          if-no-files-found: error
          retention-days: 90
