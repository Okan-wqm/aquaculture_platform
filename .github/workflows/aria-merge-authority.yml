name: aria-merge-authority

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aria-merge-authority-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  aria-merge-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline

      - name: Install aria-kernel dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          with Path("aria-kernel/pyproject.toml").open("rb") as fh:
              dependencies = tomllib.load(fh).get("project", {}).get("dependencies", [])
          if dependencies:
              subprocess.check_call([sys.executable, "-m", "pip", "install", *dependencies])
          PY

      - name: Assert ARIA merge authority
        run: |
          npm run aria:compile
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel:. python3 -m unittest \
            aria-kernel/tests/test_merge_authority_invariants.py \
            aria-kernel/tests/test_enterprise_readiness_and_genesis_lifecycle.py \
            aria-kernel/tests/test_auto_merge.py
          npm run gates:required-status-checks
          npm run aria:docs:ssot
