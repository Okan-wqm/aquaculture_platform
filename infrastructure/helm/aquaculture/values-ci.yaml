# =============================================================================
# Aquaculture Platform — CI-Validation Values Overlay (TRACK D / WS9)
# =============================================================================
#
# Purpose: provide DUMMY values for every secret the chart's
# `templates/secrets.yaml` marks `{{ required ... }}`, ONLY so the
# CI workflow can `helm template` the chart without operator-supplied
# credentials. The dummy values are NEVER applied to a real cluster.
#
# Why this file lives in the chart, not the workflow:
#   The chart's secret structure is owned by the chart authors. If
#   they add a new `{{ required }}` guard, the corresponding dummy
#   must land in the SAME pull request — keeping CI green and
#   chart-templates correct in lockstep. With `--set` flags in the
#   workflow, a chart change requires a parallel workflow change in
#   a separate file, which silently drifts.
#
# Consumed by every Aquaculture chart validation command in:
#   - .github/workflows/infra-helm-lint.yml
#   - .github/workflows/ci-affected.yml
#
# DO NOT use this file with `helm install` against a real cluster.
# DO NOT add real secret values here.
# =============================================================================

# NOTE: do NOT force `externalSecrets.enabled` here. The chart matrix
# tests three overlays:
#   - values.yaml             externalSecrets.enabled defaults to false
#                             → renders inline Secret block → needs the
#                               dummy values below to satisfy the
#                               `{{ required }}` guards in secrets.yaml.
#   - values-staging.yaml     same default; same path; same dummies.
#   - values-production.yaml  externalSecrets.enabled=true → renders the
#                             ExternalSecret CRD instead of the inline
#                             Secret. The `{{ required }}` guards on
#                             `.Values.secrets.*` are inside an
#                             `{{- if not .Values.externalSecrets.enabled }}`
#                             branch, so the dummies below are unused on
#                             this overlay — but are harmlessly accepted.
#
# The previous version of this file forced `externalSecrets.enabled: false`
# globally, which silently swapped values-production.yaml's render path
# from the ExternalSecret CRD (its real production shape) to the inline
# Secret block — making the production-overlay test misleading.
secrets:
  databaseUrl: 'postgres://ci-dummy:ci-dummy@localhost:5432/ci-dummy'
  redisUrl: 'redis://localhost:6379'
  natsUrl: 'tls://nats:4222'
  passwordPepper: 'ci-dummy-pepper-not-for-real-use'
  mfaEncryptionKey: 'ci-dummy-mfa-encryption-key-not-for-runtime'
  sentinelHubEncryptionKey: 'ci-dummy-sentinel-hub-key-not-for-runtime'

  # PEM-shape values are only validated for non-empty by the chart's
  # `required` guard; their content is not consumed at template time.
  jwtPrivateKey: |
    -----BEGIN PRIVATE KEY-----
    ci-dummy-private-key-content-not-for-real-use
    -----END PRIVATE KEY-----
  jwtPublicKey: |
    -----BEGIN PUBLIC KEY-----
    ci-dummy-public-key-content-not-for-real-use
    -----END PUBLIC KEY-----

  stripeWebhookSecret: 'whsec_ci_dummy_not_for_real_use'
  stripeApiKey: 'sk_test_ci_dummy_not_for_real_use'

postgresql:
  auth:
    password: 'ci-dummy-postgresql-password-not-for-runtime'

redis:
  auth:
    password: 'ci-dummy-redis-password-not-for-runtime'
