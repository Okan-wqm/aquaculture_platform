name: aria-agent-executor

# Plan ARIA-V3 §B1 — scheduled CI executor for ARIA's bound-agent
# pipeline. Runs once per off-hours window OR on manual dispatch; pulls
# the next pending agent request from the kernel's queue, invokes the
# Claude Code CLI via a managed login session, submits the result.
#
# Argv contract status (DEBT-2026-05-08-001 retired by V3 §B1): the
# kernel-side argv shape is now PROVEN — see
# tools/aria-poc/ci_executor_contract_proven.md (locked by invariant
# I-V3-21). The workflow ships with CLAUDE_CLI_MOCK default flipped
# to 'false' (production); `vars.ARIA_MOCK_KILL_SWITCH` is read
# AHEAD of the default so operators can keep mock active without
# editing this file (INFRA-MEDIUM-011). The operator's single
# supervised live invocation populates the verified_at_commit /
# claude_cli_version_minimum fields in the proven-contract doc.
#
# Lease-token redaction:
#   - LEASE token flows ONLY through ARIA_LEASE_TOKEN env var.
#   - artifact upload limited to expected_output_path only.
#   - the GHA log ::add-mask:: directive masks any accidental leak.

on:
  schedule:
    # 02:00 UTC daily (off-hours for most ARIA contributors)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Specific request ID to process (overrides next-pending lookup)'
        required: false
        type: string
      mock:
        description: 'Run in mock mode (no real Claude Code CLI invocation)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: aria-agent-executor-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  executor:
    runs-on: [self-hosted, linux, claude]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      # Plan ARIA-V3 §B1 INFRA-CRITICAL-003 — verify the pinned Claude
      # Code CLI floor BEFORE the executor step. The proven-contract doc
      # (tools/aria-poc/ci_executor_contract_proven.md) is the SSoT
      # for the argv shape; this step ensures the binary that
      # interprets that argv is present and version-pinned. The
      # --ignore-scripts flag satisfies V2 I-25 clause 4
      # (INFRA-CRITICAL-001 supply chain).
      - name: Pre-flight - Claude Code CLI present
        run: |
          set -euo pipefail
          REQUIRED_CLAUDE_VERSION="2.1.197"
          CLAUDE_VERSION="$(claude --version | awk '{print $1}')"
          python3 - "$REQUIRED_CLAUDE_VERSION" "$CLAUDE_VERSION" <<'PY'
          import sys
          def parse(value):
              return tuple(int(part) for part in value.split('.'))
          required = parse(sys.argv[1])
          current = parse(sys.argv[2])
          if current < required:
              raise SystemExit(f"claude-code {sys.argv[2]} is below required {sys.argv[1]}")
          print(f"claude-code {sys.argv[2]} satisfies required {sys.argv[1]}")
          PY

      # Plan ARIA-V3 §B2 + §2n + INFRA-HIGH-004 — cross-host lease
      # check. If a local daemon currently holds the autonomous-loop
      # lease (e.g. operator is running ``aria-kernel autonomy run``
      # on their laptop), this GHA cron MUST refuse to enter the
      # autonomous path to prevent double-claim / double-materialize
      # races. The lease state is read from the mainline
      # ``aria-tools/locks/autonomous-host.lock`` file; a fresh lease
      # (< 5 min old) belonging to a different host blocks the cron.
      # The cron exits cleanly with reason ``autonomous_host_lease_blocked``
      # rather than failing — no retry storm.
      - name: Pre-flight — cross-host autonomous-loop lease check
        id: lease_check
        run: |
          set -euo pipefail
          PYTHONPATH=aria-kernel python3 - <<'PY' 2>&1 | head -20
          import json
          import os
          import sys

          from aria_kernel.autonomous_host_lease import lease_state

          state = lease_state('aria-tools')
          print(json.dumps(state))
          if state['state'] == 'fresh':
              host = state.get('host_id', '')
              # If the fresh lease is held by a local (non-GHA) host
              # we refuse. GHA-runner-held leases come from prior
              # cron runs and should be allowed to renew through the
              # acquire_lease path below.
              if not host.startswith('gha-runner:'):
                  print(f'::warning::autonomous_host_lease_blocked: held by {host}', file=sys.stderr)
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
                      f.write('blocked=true\n')
                      f.write(f'blocked_host={host}\n')
                  sys.exit(0)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('blocked=false\n')
          PY

      - name: Skip autonomous loop when local lease is fresh
        if: steps.lease_check.outputs.blocked == 'true'
        run: |
          echo "Local host holds autonomous-loop lease; exiting cleanly per Plan ARIA-V3 §2n."
          exit 0

      # Plan ARIA-V3 §B1 INFRA-CRITICAL-002 — refuse to start when
      # the workflow is in live mode but managed Claude Code auth is
      # absent. The kill switch (vars.ARIA_MOCK_KILL_SWITCH) is read
      # AHEAD of the workflow default — operator opt-out path (Plan
      # ARIA-V3 §B1 INFRA-MEDIUM-011). The mock_source value flows
      # into the ci_executor via CLAUDE_CLI_MOCK_SOURCE so the
      # claude_mock_mode_resolved audit event (AUDITTRAIL-HIGH-009)
      # records exactly which layer decided the mock state.
      - name: Pre-flight - Claude Code auth + mock-mode kill-switch resolution
        id: preflight
        env:
          KILL_SWITCH: ${{ vars.ARIA_MOCK_KILL_SWITCH }}
          INPUT_MOCK: ${{ github.event.inputs.mock }}
        run: |
          set -euo pipefail
          if [ -n "${KILL_SWITCH:-}" ]; then
            EFFECTIVE_MOCK="${KILL_SWITCH}"
            MOCK_SOURCE="kill_switch"
          elif [ -n "${INPUT_MOCK:-}" ]; then
            EFFECTIVE_MOCK="${INPUT_MOCK}"
            MOCK_SOURCE="workflow_dispatch_input"
          else
            EFFECTIVE_MOCK="false"
            MOCK_SOURCE="workflow_default_claude"
          fi
          echo "effective_mock=${EFFECTIVE_MOCK}" >> "$GITHUB_OUTPUT"
          echo "mock_source=${MOCK_SOURCE}" >> "$GITHUB_OUTPUT"
          if [ "${EFFECTIVE_MOCK}" = "false" ]; then
            if env | grep -E '^(ANTHROPIC_API_KEY|CLAUDE_API_KEY|ANTHROPIC_AUTH_TOKEN)=' >/dev/null; then
              echo "::error::API-key Claude mode is disallowed for ARIA; use a managed Claude Code login on the trusted runner." >&2
              exit 1
            fi
            claude --version >/tmp/aria-claude-auth.txt 2>/tmp/aria-claude-auth.err \
              || { echo "::error::Claude Code CLI preflight failed" >&2; cat /tmp/aria-claude-auth.err >&2; exit 1; }
            CLAUDE_AUTH_DIR="${CLAUDE_CONFIG_DIR:-$HOME/.claude}"
            if [ ! -f "${CLAUDE_AUTH_DIR}/.credentials.json" ] && [ ! -f "${CLAUDE_AUTH_DIR}/config.json" ]; then
              echo "::error::Claude Code managed-auth session not found on the trusted runner" >&2
              exit 1
            fi
          fi

      - name: Find next pending request
        id: pending
        env:
          # Plan 024 v3 §B-3 — env-only interpolation; raw shell access
          # to ${{ github.event.inputs.request_id }} is closed because
          # GHA expands the substitution into the script source where
          # an attacker-controlled value can escape quoting.
          REQUEST_ID_INPUT: ${{ github.event.inputs.request_id }}
        run: |
          set -euo pipefail
          if [ -n "${REQUEST_ID_INPUT:-}" ]; then
            # Plan 024 v3 §B-3 — request_id regex matches the kernel's
            # AIR-* request_id schema (alphanumeric + - + _, ≤ 64 chars).
            if ! [[ "$REQUEST_ID_INPUT" =~ ^[A-Za-z0-9_-]{1,64}$ ]]; then
              echo "::error::invalid request_id format: $REQUEST_ID_INPUT" >&2
              exit 1
            fi
            echo "request_id=${REQUEST_ID_INPUT}" >> "$GITHUB_OUTPUT"
          else
            REQ_ID=$(PYTHONPATH=aria-kernel python3 -m aria_kernel agent next-pending \
              --tools-dir aria-tools | jq -r '.request_id // empty')
            echo "request_id=${REQ_ID}" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist enterprise workflow preflight
        env:
          REQUEST_ID: ${{ steps.pending.outputs.request_id }}
          PYTHONPATH: aria-kernel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          from aria_kernel.preflight import verify_workflow_preflight

          allowed = [
              "aria-tools/governance.jsonl",
              "aria-tools/handoffs.jsonl",
              "aria-tools/agent-invocations/claims.jsonl",
              "aria-tools/agent-invocations/results.jsonl",
          ]
          request_id = os.environ.get("REQUEST_ID", "").strip()
          if request_id:
              allowed.extend([
                  f"aria-tools/agent-invocations/outputs/{request_id}.json",
                  f"aria-tools/agent-invocations/outputs/{request_id}.transcript.jsonl",
                  f"aria-tools/agent-invocations/prompts/{request_id}.md",
              ])
          verdict = verify_workflow_preflight(
              workflow_id="aria-agent-executor",
              job_id="executor",
              profile="autonomous",
              workspace_root=os.environ["GITHUB_WORKSPACE"],
              allowed_write_roots=allowed,
              path_allowlist=allowed,
              network_policy=["github_artifact"],
              network_enforcement_evidence="actions/upload-artifact limited to exact response envelope path",
              token_provenance="github_actions_artifact_token",
              require_github_app=False,
              dlp_mode="fail_closed",
              dlp_scan_clean=True,
              audit_reason="persist handoff ledger and bounded agent response envelope",
              audit_artifact_path=Path(os.environ["RUNNER_TEMP"]) / "aria-agent-executor-preflight.json",
              external_root_allowlist=[str(Path(os.environ["RUNNER_TEMP"]).resolve())],
          )
          if not verdict.valid:
              raise SystemExit(";".join(verdict.reasons))
          PY

      # Plan 020 Phase 3.C — session_start handoff snapshot.
      # WHY here: every CI executor run is a discrete session boundary.
      # Snapshotting at start captures "what was open before we touched
      # anything" — the operator-readable diff against session_stop is
      # how an audit reviewer reconstructs what the run actually changed
      # without having to grep governance.jsonl by timestamp.
      - name: Handoff snapshot — session_start
        id: handoff_start
        run: |
          set -euo pipefail
          SESSION_ID="gha-aria-agent-executor-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "session_id=${SESSION_ID}" >> "$GITHUB_OUTPUT"
          PYTHONPATH=aria-kernel python3 -m aria_kernel handoff snapshot \
            --session-id "${SESSION_ID}" \
            --trigger session_start \
            --tools-dir aria-tools \
            --repo-root .

      - name: Skip if no pending request
        if: steps.pending.outputs.request_id == ''
        run: echo "no pending requests; exiting cleanly"

      - name: Run CI executor
        if: steps.pending.outputs.request_id != ''
        env:
          CLAUDE_CLI_MOCK: ${{ steps.preflight.outputs.effective_mock }}
          CLAUDE_CLI_MOCK_SOURCE: ${{ steps.preflight.outputs.mock_source }}
          ARIA_CLAUDE_REQUIRE_USAGE: '1'
          MAX_TURNS_PER_RUN: '12'
          MAX_REQUESTS_PER_RUN: '30'
          MAX_TIMEOUT_SECONDS: '1800'
        run: |
          PYTHONPATH=aria-kernel python3 tools/aria-poc/ci_executor.py \
            "${{ steps.pending.outputs.request_id }}"

      - name: Upload response envelope (artefact)
        if: steps.pending.outputs.request_id != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Limited scope — response envelope plus its transcript anchor. claims.jsonl +
          # runs.jsonl deliberately excluded (lease token / over-disclosure
          # protection per spike doc artefact policy).
          name: aria-response-${{ steps.pending.outputs.request_id }}
          path: |
            aria-tools/agent-invocations/outputs/${{ steps.pending.outputs.request_id }}.json
            aria-tools/agent-invocations/outputs/${{ steps.pending.outputs.request_id }}.transcript.jsonl
          if-no-files-found: error
          retention-days: 7

      # Plan 020 Phase 3.C — session_stop handoff snapshot.
      # WHY here (post-upload, always): runs even when the executor
      # short-circuits the request lookup ("no pending requests; exiting
      # cleanly") so the audit trail still captures session boundary
      # state. The if: always() pairs with handoff_start so an audit
      # reviewer can diff session_start vs session_stop snapshots and
      # see exactly what the run touched (or did not touch).
      - name: Handoff snapshot — session_stop
        if: always() && steps.handoff_start.outputs.session_id != ''
        run: |
          set -euo pipefail
          PYTHONPATH=aria-kernel python3 -m aria_kernel handoff snapshot \
            --session-id "${{ steps.handoff_start.outputs.session_id }}" \
            --trigger session_stop \
            --tools-dir aria-tools \
            --repo-root .
