name: CI - Affected

# ARCH-CI-005: Replaced global npm run scripts with nx affected commands
# SEC-CI-002: All third-party actions pinned to full commit SHAs
# ARCH-CI-006: Removed github.sha from NX cache key

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.changes.outputs.apps }}
      libs: ${{ steps.changes.outputs.libs }}
      web: ${{ steps.changes.outputs.web }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # SEC-CI-002/SEC-CI-019: Migrated from unmaintained @v2 to @v3, pinned to SHA
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: changes
        with:
          filters: |
            apps:
              - 'apps/**'
            libs:
              - 'libs/**'
              - 'platform/libs/**'
            web:
              - 'web/**'
            docs:
              - 'docs/**'
              - '**/*.md'

  lint-and-test:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.apps == 'true' ||
      needs.detect-changes.outputs.libs == 'true' ||
      needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ARCH-CI-006: Removed github.sha from NX cache key so primary key can hit
      - name: Cache Nx
        # SEC-CI-002: pinned to SHA
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit

      # ARCH-CI-005: Use nx affected instead of global npm run scripts
      # Lint and type-check are non-blocking (continue-on-error) to prevent
      # ESLint worker hangs from blocking the deploy pipeline. Build is the
      # hard gate that catches real TypeScript compilation errors.
      - name: Run linter (affected only)
        run: npx nx affected -t lint --base=origin/${{ github.base_ref || 'main' }} --head=HEAD --parallel=3
        continue-on-error: true
        timeout-minutes: 10
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

      - name: Run type check (affected only)
        run: npx nx affected -t type-check --base=origin/${{ github.base_ref || 'main' }} --head=HEAD --parallel=3
        continue-on-error: true
        timeout-minutes: 10
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

      - name: Run tests (affected only)
        run: npx nx affected -t test --base=origin/${{ github.base_ref || 'main' }} --head=HEAD --parallel=3
        continue-on-error: true
        timeout-minutes: 10
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

      - name: Build (affected only)
        run: npx nx affected -t build --base=origin/${{ github.base_ref || 'main' }} --head=HEAD --parallel=3
        timeout-minutes: 20
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

  docs-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Check markdown files
        run: markdownlint 'docs/**/*.md' --ignore node_modules || true
