# =============================================================================
# Aquaculture Platform - DigitalOcean Droplet (4 CPU / 8GB RAM)
#
# All services enabled. Total memory budget: ~7GB
#
# Production usage:
#   GitHub Actions "Deploy to DigitalOcean" invokes scripts/deploy/droplet-up.sh.
#   Raw pull/up bypasses rollback capture, db-migrate ordering, health gates,
#   boot-signal assertions, and the release ledger (ADR-033).
# =============================================================================

# SEC-013: Trust boundary — all inter-service traffic (AUTH headers, GraphQL queries,
# NATS messages) travels on the aqua-internal Docker bridge network in plain HTTP/TCP.
# aqua-internal is marked internal: true so it cannot route to the internet.
# If a container escape occurs, traffic on this network is readable by other containers.
# For stronger isolation, consider a service mesh (e.g., Traefik mTLS or Consul Connect).

# =============================================================================
# YAML anchors — shared configuration blocks
# =============================================================================
# IP-1: NATS TLS client wiring. Every backend service that connects to the
# NATS broker over tls:// must trust the self-signed "Aquaculture Internal
# CA" that signs the NATS server certificate. The CA PEM is generated by
# infrastructure/docker/scripts/generate-internal-certs.sh into
# ./certs/nats/ca-cert.pem on the host and mounted into each service at
# /etc/ssl/nats-ca.pem (read-only). The NATS_TLS_CA env var tells the
# backend-common nats-connection.factory where to find it — see the IP-1
# docblock in that file for the full incident history behind the
# hard-fail policy this wiring enforces.

# SECURITY (HIGH-001, SEC-015, CRITICAL-002): Per-service NATS credentials.
# Each service authenticates to NATS with its own account; subject-level ACLs
# in nats.conf enforce what that account may publish/subscribe. Env var names
# on this side (client) match the names nats.conf expects server-side — one
# source of truth per service. No silent fallback to a shared credential: a
# missing per-service env var fails fast with a clear error.
#
# REMOVED 2026-04-14: legacy shared `x-nats-env` anchor.
# Verified via grep that no service in this file ever merged it
# (`<<: *nats-env` had ZERO callers), and no application code references
# bare NATS_USER/NATS_PASS env vars (only per-service variants like
# NATS_AUTH_USER, NATS_FARM_USER, etc.). Removing the anchor closes the
# `:?` strict-requirement that was blocking the deploy with a misleading
# "legacy shared account is required" error for an account no service
# actually used.

x-nats-auth-env: &nats-auth-env
  NATS_URL: tls://nats:4222
  NATS_TLS_CA: /etc/ssl/nats-ca.pem
  # SECURITY (HIGH-002 / V4): per-service mTLS — CN=auth_service maps to NATS user auth_service.
  NATS_TLS_CERT: /etc/ssl/nats-clients/auth_service-cert.pem
  NATS_TLS_KEY: /etc/ssl/nats-clients/auth_service-key.pem
  NATS_TLS_ENABLED: 'true'

x-nats-farm-env: &nats-farm-env
  NATS_URL: tls://nats:4222
  NATS_TLS_CA: /etc/ssl/nats-ca.pem
  NATS_TLS_CERT: /etc/ssl/nats-clients/farm_service-cert.pem
  NATS_TLS_KEY: /etc/ssl/nats-clients/farm_service-key.pem
  NATS_TLS_ENABLED: 'true'

x-nats-sensor-env: &nats-sensor-env
  NATS_URL: tls://nats:4222
  NATS_TLS_CA: /etc/ssl/nats-ca.pem
  NATS_TLS_CERT: /etc/ssl/nats-clients/sensor_service-cert.pem
  NATS_TLS_KEY: /etc/ssl/nats-clients/sensor_service-key.pem
  NATS_TLS_ENABLED: 'true'

x-nats-gateway-env: &nats-gateway-env
