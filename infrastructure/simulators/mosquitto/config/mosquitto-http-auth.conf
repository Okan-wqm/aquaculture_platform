# ============================================
# Mosquitto MQTT Broker Configuration
# HTTP Auth Backend (Production Mode)
# ============================================
#
# This configuration uses mosquitto-go-auth plugin to authenticate
# devices via HTTP callbacks to the sensor-service API.
#
# Advantages over file-based auth (mosquitto.conf):
# - Credentials verified directly from database (no file sync)
# - Cross-tenant ACL enforcement (topic isolation by tenant_id)
# - No file locking, atomic writes, or SIGHUP reloads needed
# - Credentials participate in DB transactions naturally
#
# Prerequisites:
# - Mosquitto image with mosquitto-go-auth plugin installed
# - Sensor-service running and accessible at SENSOR_SERVICE_URL
#
# To switch between modes:
#   File-based: use mosquitto.conf (MQTT_AUTH_MODE=file)
#   HTTP-based: use this file (MQTT_AUTH_MODE=http)
# ============================================

# ============================================
# TCP Listener (standard MQTT port 1883)
# ============================================
listener 1883

# ============================================
# WebSocket Listener (port 9001)
# ============================================
listener 9001
protocol websockets

# ============================================
# Security Settings
# ============================================
allow_anonymous false

# ============================================
# HTTP Auth Plugin (mosquitto-go-auth)
# ============================================
auth_plugin /mosquitto/go-auth.so

# HTTP backend configuration
auth_opt_backends http
auth_opt_cache true
auth_opt_cache_type go-cache
auth_opt_cache_reset true
auth_opt_auth_cache_seconds 5
auth_opt_acl_cache_seconds 5

# HTTP endpoint URLs (sensor-service)
auth_opt_http_host sensor-service
auth_opt_http_port 3000
auth_opt_http_getuser_uri /mqtt/auth
auth_opt_http_superuser_uri /mqtt/superuser
auth_opt_http_aclcheck_uri /mqtt/acl

# HTTP settings
auth_opt_http_with_tls false
auth_opt_http_verify_peer false
auth_opt_http_response_mode status
auth_opt_http_timeout 5

# Shared secret for authenticating requests from Mosquitto to sensor-service
# Set MQTT_AUTH_SECRET env var in both Mosquitto and sensor-service
auth_opt_http_params_mode form

# NOTE: For production, enable TLS between Mosquitto and sensor-service:
#   auth_opt_http_with_tls true
#   auth_opt_http_verify_peer true

# Request parameters sent to the HTTP backend:
# - username: MQTT username
# - password: MQTT password (only for auth)
# - clientid: MQTT client ID
# - topic: MQTT topic (only for ACL)
# - acc: Access type: 1=subscribe, 2=publish (only for ACL)

# ============================================
# Persistence Configuration
# ============================================
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# ============================================
# Logging Configuration
# ============================================
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ============================================
# Connection Settings
# ============================================
max_connections 10000
max_queued_messages 100
max_inflight_messages 20
max_keepalive 300
