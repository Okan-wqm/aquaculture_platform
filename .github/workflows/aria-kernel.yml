name: aria-kernel

on:
  pull_request:
    paths:
      - "aria-kernel/**"
      - "docs/aria/**"
      - ".github/workflows/aria-kernel.yml"
  push:
    branches:
      - snowball
    paths:
      - "aria-kernel/**"
      - "docs/aria/**"
      - ".github/workflows/aria-kernel.yml"

concurrency:
  group: aria-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aria-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel python3 -m unittest discover aria-kernel -p '*test*.py'
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel python3 -m aria_kernel integrity migrate-tools-v1-to-v2 --tools-dir ./.aria-ci/tools --workspace-root . --acknowledge --reason "ci bootstrap"
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel python3 -m aria_kernel discovery run --workspace-root . --workspace-base ./.aria-ci/workspaces --tools-dir ./.aria-ci/tools --cycle-id ci-${{ github.run_id }} --snapshot-mode committed
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel python3 -m aria_kernel integrity verify --workspace-root . --workspace-base ./.aria-ci/workspaces --tools-dir ./.aria-ci/tools
