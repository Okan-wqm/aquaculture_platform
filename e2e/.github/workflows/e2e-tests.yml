name: E2E Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      project:
        description: 'Test project to run (security, workflow, integration, or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - security
          - workflow
          - integration

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aquaculture
          POSTGRES_PASSWORD: aquaculture
          POSTGRES_DB: aquaculture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquaculture"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222

    env:
      DATABASE_URL: postgresql://aquaculture:aquaculture@localhost:5432/aquaculture
      GATEWAY_URL: http://localhost:4000
      JWT_SECRET: test-secret-that-is-at-least-32-characters-long!!
      REDIS_URL: redis://localhost:6379
      NATS_URL: nats://localhost:4222
      NODE_ENV: test
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Initialize database schemas
        run: |
          PGPASSWORD=aquaculture psql -h localhost -U aquaculture -d aquaculture -c "
            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE SCHEMA IF NOT EXISTS admin;
            CREATE SCHEMA IF NOT EXISTS billing;
            CREATE SCHEMA IF NOT EXISTS sensor;
            CREATE SCHEMA IF NOT EXISTS farm;
            CREATE SCHEMA IF NOT EXISTS hr;
            CREATE SCHEMA IF NOT EXISTS hydroponics;
          "

      - name: Run E2E tests
        working-directory: e2e
        run: |
          if [ "${{ github.event.inputs.project }}" = "all" ] || [ -z "${{ github.event.inputs.project }}" ]; then
            npm test
          else
            npm run test:${{ github.event.inputs.project }}
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results/
          retention-days: 7
