name: Closes Footer Check

# =============================================================================
# Closes: Footer Traceability Gate — Phase 6 of abstract-brewing-mochi plan
#
# Enforces CLAUDE.md "Review Finding Traceability" rule:
#   Every fix(), security(), or refactor(agentic,phase-*) commit MUST carry
#   a `Closes: docs/reviews/<agent>/<date>-<topic>.md#<FINDING-ID>` trailer,
#   AND the referenced review file must exist, AND the FINDING-ID must be
#   present in docs/reviews/_registry/findings.jsonl.
#
# Missing / unresolvable trailers fail the PR, preventing agent review
# findings from silently rotting without resolution.
#
# Reference: docs/plans/2026-04-17-agentic-post-audit-consolidation-plan.md#Phase-6
# =============================================================================

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-closes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # SEC-CI-002: pinned to full SHA per infra-expert rule
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # need full history to walk PR commit range

      - name: Determine PR commit range
        id: range
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Validating range: $BASE_SHA..$HEAD_SHA"

      # SEC-CI-002: pinned to full SHA per infra-expert rule.
      # SHA matches every other workflow in the repo (ci-affected.yml etc.)
      # so SHA rotation via dependabot stays a single operation.
      # Node 22 matches repo-wide NODE_VERSION env in ci-affected.yml and
      # ci-full.yml. .nvmrc still carries 20.11.0 but is not read by CI;
      # bumping the dotfile is tracked separately.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install ts-node + deps
        # --ignore-scripts is MANDATORY per infra-expert supply-chain rule
        # (ua-parser-js / coa / rc preinstall-hook exfiltration vector class).
        # Dependency resolution must be peer-clean. This gate must fail if the
        # workspace graph needs legacy peer fallback.
        run: npm ci --ignore-scripts --no-audit

      # The gate's own unit tests. They existed but ran in no workflow and
      # in no hook, so the resolver could disagree with the ID allocator
      # about which finding IDs exist and nothing said so. A gate whose
      # tests never execute is a gate whose behaviour is unpinned.
      - name: 'Gate self-tests (resolver + ID allocator)'
        run: |
          npm run gates:test

      - name: 'Validate Closes trailers'
        run: npx ts-node --project tools/gates/tsconfig.json tools/gates/commit-msg-validator.ts --mode=range "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"

      - name: Validate registry integrity (hash chain)
        run: |
          # Re-compute the hash chain to detect mid-chain tampering.
          # Uses the canonical registry verifier's JSON + sha256hex contract.
          # This is read-only verification; all mutations remain owned by the
          # Finding Registry Authority and Finding State Sweep workflows.
          node -e "
          const { createHash } = require('crypto');
          const { readFileSync, existsSync } = require('fs');
          const registry = 'docs/reviews/_registry/findings.jsonl';
          if (!existsSync(registry)) { console.log('No registry file; skipping.'); process.exit(0); }
          const lines = readFileSync(registry, 'utf8').trim().split('\n').filter(Boolean);
          function canon(v){if(v===null||typeof v!=='object')return JSON.stringify(v);if(Array.isArray(v))return '['+v.map(canon).join(',')+']';const k=Object.keys(v).sort();return '{'+k.map(x=>JSON.stringify(x)+':'+canon(v[x])).join(',')+'}';}
          let prev = '0'.repeat(64);
          for (let i = 0; i < lines.length; i++) {
            const e = JSON.parse(lines[i]);
            if (e.prev_hash !== prev) { console.error('Chain break at entry', i, e.id); process.exit(1); }
            const { content_hash, ...rest } = e;
            const recomp = createHash('sha256').update(canon(rest), 'utf8').digest('hex');
            if (recomp !== content_hash) { console.error('Hash mismatch at entry', i, e.id); process.exit(1); }
            prev = content_hash;
          }
          console.log('Registry chain valid (' + lines.length + ' entries).');
          "
