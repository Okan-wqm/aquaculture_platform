# =============================================================================
# NATS Per-Service Identity + Subject ACL — Single Source of Truth
# =============================================================================
#
# This file is the authoritative registry for NATS per-service authorization.
# Every downstream artifact derives from this file:
#
#   1. `infrastructure/docker/nats/nats.conf` authorization{} block
#      (generated by scripts/nats/generate-nats-conf.py; block bounded by
#       BEGIN/END GENERATED sentinels; hand-edits fail CI invariant test)
#
#   2. `infrastructure/docker/scripts/generate-internal-certs.sh` cert CN list
#      (currently hand-written in lockstep; future work tracked as
#       BACKLOG-NATS-002 to make it read services.yaml directly)
#
#   3. `e2e/tests/integration/nats-invariants.spec.ts` CI validation
#      (asserts services.yaml ↔ nats.conf ↔ cert list agree)
#
#   4. `infrastructure/helm/aquaculture/values.yaml` natsAuth usernames
#      (hand-written in lockstep; future work unifies via chart template
#       reading services.yaml at render time)
#
# # MAINTENANCE CONTRACT
#
# Adding a new service:
#   1. Add a `services:` entry here with `name`, `publish`, `subscribe`
#   2. Add the same CN to generate-internal-certs.sh line 97-101
#   3. Run `scripts/nats/generate-nats-conf.py` to regenerate nats.conf
#   4. Commit all three file changes together (CI invariant enforces)
#
# Changing a service's ACL:
#   1. Edit the `publish` / `subscribe` list here
#   2. Run the generator
#   3. Commit yaml + generated nats.conf together
#
# REMOVING a service is a security-sensitive operation: ensure no live
# production client uses the cert AND no in-flight events target the
# removed subjects. Open a tracked finding before removal.
#
# # AUTH MODEL
#
# Authentication is mTLS-only with `verify_and_map: true` in nats.conf TLS
# block. The client cert's CN is automatically mapped to the `user` value
# in the NATS authorization block. There are NO passwords — the cert IS
# the identity. See ADR-014 (legacy shared user removed) and ADR-015
# (cert-is-identity SSoT) for the full architectural rationale.
#
# # SUBJECT CONVENTIONS
#
# - `AQUACULTURE_EVENTS.<Aggregate>*.>` = domain events the service publishes
# - `$JS.API.>` + `_INBOX.>` = NATS JetStream + request-reply (every service
#   needs these; generator does NOT dedupe — explicit for auditability)
# - `request.<target>.>` = NestJS microservice transport subjects
# - `events.<filter>.>` = cross-service @EventPattern bridges
# - `st.language.>` = ST Language WebSocket-to-NATS bridge (sensor + gateway)
#
# =============================================================================

version: 1

services:
  # ---------------------------------------------------------------------------
  # auth-service: tenant/user/JWT lifecycle
  # ---------------------------------------------------------------------------
  - name: auth_service
    description: Authentication — tenant and user lifecycle, JWT issuance, invitations, password reset
    publish:
      # ORPHAN-MEDIUM-320: owner-facing lockout notification event
      # (canonical events.* scheme — see ORPHAN-HIGH-317 for the full
      # migration of the remaining grants).
      - "events.*.UserAccountLocked"
      - "AQUACULTURE_EVENTS.UserRegistered.>"
      - "AQUACULTURE_EVENTS.UserLoggedIn.>"
      - "AQUACULTURE_EVENTS.InvitationAccepted.>"
      - "AQUACULTURE_EVENTS.PasswordResetRequested.>"
      - "AQUACULTURE_EVENTS.PasswordResetCompleted.>"
      - "AQUACULTURE_EVENTS.TenantCreated.>"
      - "AQUACULTURE_EVENTS.TenantUpdated.>"
      - "AQUACULTURE_EVENTS.TenantSuspended.>"
      - "AQUACULTURE_EVENTS.TenantActivated.>"
      - "AQUACULTURE_EVENTS.TenantStatusChanged.>"
      - "AQUACULTURE_EVENTS.TenantModulesAssigned.>"
      - "AQUACULTURE_EVENTS.UserInvited.>"
      - "$JS.API.>"
      - "_INBOX.>"
    subscribe:
      - "AQUACULTURE_EVENTS.>"
      # NestJS microservice transport — admin-api → auth-service RPC.
      # AuthAdminNatsHandler handles `request.auth.admin.createUser` and
      # `request.auth.admin.resetUserPassword`. This replaces the
      # admin-api raw-SQL writes against `auth.users` that CRITICAL-001
      # flagged (docs/reviews/code-reviewer/2026-04-21-raw-sql-audit.md).
      # AuthUserQueryNatsHandler (DİLİM-2) handles
      # `request.auth.user.validateTenantMembership` — covered by the
      # wildcard below; listed explicitly for audit visibility.
      - "request.auth.user.validateTenantMembership"
      - "request.auth.>"
      - "$JS.API.>"
      - "_INBOX.>"

  # ---------------------------------------------------------------------------
  # farm-service: batch / pond / feeding / equipment / water quality
  # ---------------------------------------------------------------------------
  - name: farm_service
    description: Farm domain — batches, feedings, water quality, mortality/cull, ponds, equipment, feed inventory
    publish:
      - "events.*.TenantOnboardingAck"
      - "events.*.TenantOnboardingFailed"
      - "events.*.WaterQualityCritical"
      # Harvest / mortality follow-up events emitted by the farm event
      # listeners on the canonical `events.{tenantId}.{eventType}` subject
      # (NatsEventBus.deriveSubject). dead-listeners produce-side cure.
      - "events.*.MortalityAlertRaised"
      - "events.*.HarvestRegulatoryRecorded"
      - "events.*.TankCleared"
      - "events.*.BatchProductionCompleted"
      # Immediate Mattilsynet "varsling" reports (welfare / escape / disease)
      # consumed by notification-service for urgent email dispatch.
      - "events.*.WelfareEventReported"
      - "events.*.EscapeReported"
      - "events.*.DiseaseOutbreakReported"
      - "AQUACULTURE_EVENTS.Farm*.>"
      - "AQUACULTURE_EVENTS.Batch*.>"
      - "AQUACULTURE_EVENTS.Feeding*.>"
      - "AQUACULTURE_EVENTS.WaterQuality*.>"
      - "AQUACULTURE_EVENTS.Mortality*.>"
      - "AQUACULTURE_EVENTS.Cull*.>"
      - "AQUACULTURE_EVENTS.Pond*.>"
      - "AQUACULTURE_EVENTS.Task*.>"
      - "AQUACULTURE_EVENTS.Equipment*.>"
      - "AQUACULTURE_EVENTS.FeedInventory*.>"
      - "$JS.API.>"
      - "_INBOX.>"
    subscribe:
      - "events.*.TenantOnboardingRequested"
      - "AQUACULTURE_EVENTS.>"
      - "$JS.API.>"
      - "_INBOX.>"

  # ---------------------------------------------------------------------------
  # sensor-service: IoT/edge device readings, VFDs, LoRa, automation
  # ---------------------------------------------------------------------------
  - name: sensor_service
    description: Sensor/edge devices, VFD readings, LoRa, automation, ST Language runtime
    publish:
      - "events.*.SensorReading"
      - "events.*.SensorDeleted"
      - "events.*.SensorDeprovisioned"
      - "AQUACULTURE_EVENTS.Sensor*.>"
      - "AQUACULTURE_EVENTS.Device*.>"
      - "AQUACULTURE_EVENTS.Edge*.>"
      - "AQUACULTURE_EVENTS.IoConfig*.>"
      - "AQUACULTURE_EVENTS.LoRa*.>"
      - "AQUACULTURE_EVENTS.WaterQuality*.>"
      - "AQUACULTURE_EVENTS.Automation*.>"
      # ST Language response subjects (IDE bridge)
      - "st.language.>"
      - "$JS.API.>"
      - "_INBOX.>"
    subscribe:
      - "events.*.SensorDeleted"
      - "events.*.SensorDeprovisioned"
      - "AQUACULTURE_EVENTS.>"
      # NestJS microservice transport: request-reply to sensor-service
      - "request.sensor.>"
      # ST Language server: WebSocket-to-NATS bridge for IDE features
      - "st.language.>"
      - "$JS.API.>"
      - "_INBOX.>"

  # ---------------------------------------------------------------------------
  # sensor-ingestion: Rust sidecar (ADR-025 / ADR-027) — co-equal producer of
  # SensorReading events alongside sensor-service during the strangler-fig
  # rollout. Distinct CN so the broker can attribute every published event
  # to its actual producer (audit + per-tenant rollback granularity).
  # ---------------------------------------------------------------------------
  - name: sensor-ingestion
    description: Rust ingestion sidecar — MQTT subscribe → COPY → SensorReading event publish
    publish:
      # Matches platform/libs/event-bus/src/nats/nats-event-bus.ts:310-312
      # deriveSubject `events.{tenantId}.{eventType}` — same JetStream
      # `events.>` stream the NestJS publisher targets, byte-equivalent.
      - "events.>"
      # Legacy pattern kept for downstream consumers that still subscribe
      # to the AQUACULTURE_EVENTS namespace. Remove once every consumer
      # has migrated to the `events.>` stream.
      - "AQUACULTURE_EVENTS.SensorReading.>"
      # Cache-miss lookup — request-reply from sidecar to sensor-service.
      # sensor-service subscribes `request.sensor.>`, the sidecar sends
      # `request.sensor.lookup.by-topic` with a reply-to inbox. Lands
      # alongside the singleflight cache work (ADR-029 ingestion plan).
      - "request.sensor.>"
      - "$JS.API.>"
      - "_INBOX.>"
    subscribe:
      # Dynamic IngestBackend policy — admin-api publishes policy change
      # events on this subject hierarchy; the sidecar hot-swaps the
      # ArcSwap<IngestBackendPolicy> on every message (ADR-027 + ADR-031).
      # Boot-time authoritative snapshot is fetched via request-reply on
      # `policy.ingest_backend.snapshot` (replies arrive on `_INBOX.>`).
      - "policy.ingest_backend.>"
      - "_INBOX.>"
      - "$JS.API.>"

  # ---------------------------------------------------------------------------
  # gateway-api + admin-api-service (shared account)
  # ---------------------------------------------------------------------------
  - name: gateway_service
    description: |
      Gateway API + admin-api-service (shared account). admin-api publishes
      tenant lifecycle events; gateway publishes its own events + forwards
      ST Language IDE requests.
    publish:
      - "events.*.TenantReserved"
      - "events.*.TenantCreated"
      - "events.*.TenantOnboardingRequested"
      - "events.*.TenantProvisioned"
      - "events.*.TenantProvisioningFailed"
      - "AQUACULTURE_EVENTS.Gateway*.>"
      - "AQUACULTURE_EVENTS.Tenant*.>"
      - "AQUACULTURE_EVENTS.Admin*.>"
      # ST Language bridge: forward IDE requests to sensor-service
      - "st.language.>"
      # Request-reply for cross-service queries. Explicit subjects only:
      # broad request.> publish is forbidden by the messaging enterprise gate.
      - "request.messaging.verifyMembership"
      - "request.messaging.resolveNotificationRef"
      - "request.sensor.verifyDeviceOwnership"
      - "request.messaging.admin.complianceStats"
      - "request.messaging.admin.getLegalHolds"
      - "request.messaging.admin.createLegalHold"
      - "request.messaging.admin.releaseLegalHold"
      - "request.messaging.admin.getRetentionPolicies"
      - "request.messaging.admin.updateRetentionPolicy"
      - "request.messaging.admin.getAuditLog"
      - "request.messaging.admin.triggerExport"
      - "request.messaging.admin.getPersonas"
      - "request.billing.admin.createInvoice"
      - "request.billing.admin.markInvoicePaid"
      - "request.billing.admin.voidInvoice"
      - "request.billing.admin.recordPayment"
      - "request.billing.admin.refundPayment"
      - "request.billing.admin.changeSubscriptionPlan"
      - "request.billing.admin.cancelSubscription"
      - "request.billing.admin.reactivateSubscription"
      - "request.billing.admin.extendSubscriptionTrial"
      - "request.auth.admin.createUser"
      - "request.auth.admin.resetUserPassword"
      - "request.auth.admin.updateUser"
      - "request.auth.admin.deactivateUser"
      - "request.auth.admin.forceLogoutUser"
      - "request.auth.admin.inviteUser"
      - "request.auth.admin.checkUserLimit"
      - "request.auth.tenant.ReserveTenant"
      - "request.auth.tenant.SetupRoles"
      - "request.auth.tenant.AssignModules"
      - "request.auth.tenant.CreateFirstAdminInvite"
      - "request.auth.tenant.ActivateTenant"
      - "request.auth.tenant.FailProvisioning"
      - "request.auth.tenant.DeprovisionTenant"
      - "request.auth.tenant.SuspendTenant"
      - "request.auth.tenant.ArchiveTenant"
      - "request.auth.tenant.RemoveModule"
      - "request.auth.tenant.RollbackProvisioning"
      # Dynamic IngestBackend policy change events — admin-api is the
      # authoritative publisher; sensor-ingestion + sensor-service
      # subscribe. ADR-027 (per-tenant toggle) + ADR-031 (request-reply
      # bootstrap snapshot via `policy.ingest_backend.snapshot`).
      - "policy.ingest_backend.>"
      - "$JS.API.>"
      - "_INBOX.>"
    subscribe:
      - "AQUACULTURE_EVENTS.>"
      # WebSocket real-time bridges
      - "events.>"
      # IngestBackend snapshot responder — admin-api answers the Rust
      # sidecar's cold-start request on `policy.ingest_backend.snapshot`
      # (request-reply per ADR-031). Responses land on requester's
      # `_INBOX.>` automatically; the subscribe here lets admin-api
      # receive the request side of the pair.
      - "policy.ingest_backend.snapshot"
      # ST Language responses
      - "st.language.>"
      # Request-reply inbox
      - "_INBOX.>"
      - "$JS.API.>"

  # ---------------------------------------------------------------------------
  # notification-service: outbound push/email command handling
  # ---------------------------------------------------------------------------
  - name: notification_service
    description: Outbound push / email notification commands, delivery tracking
    publish:
      - "AQUACULTURE_EVENTS.NotificationSent.>"
      - "AQUACULTURE_EVENTS.NotificationDelivered.>"
      - "AQUACULTURE_EVENTS.NotificationFailed.>"
      - "$JS.API.>"
      - "_INBOX.>"
    subscribe:
      - "AQUACULTURE_EVENTS.PasswordResetRequested.>"
      - "AQUACULTURE_EVENTS.UserInvited.>"
      - "AQUACULTURE_EVENTS.Notification*.>"
      - "commands.notification.sendEmail"
      - "commands.notification.sendPush"
      - "events.*.PasswordResetRequested"
      - "events.*.UserInvited"
      - "events.*.UserDeleted"
      - "events.*.AlertTriggered"
      - "events.*.AlertResolved"
      - "events.*.WaterQualityCritical"
      # Harvest traceability record → notification-service traceability log
      # (dead-listeners produce-side cure, blocker 4).
      - "events.*.HarvestRegulatoryRecorded"
      # Immediate Mattilsynet "varsling" reports → urgent email dispatch.
      - "events.*.WelfareEventReported"
      - "events.*.EscapeReported"
      - "events.*.DiseaseOutbreakReported"
      - "$JS.API.>"
      - "_INBOX.>"

  # ---------------------------------------------------------------------------
  # ai-service: AI chat, tool execution, conversations
  # ---------------------------------------------------------------------------
  - name: ai_service
    description: AI domain — model/tool execution and agent conversations
    publish:
      - "$JS.API.>"
      - "_INBOX.>"
    subscribe:
      - "request.ai.chat"
      - "request.ai.executeAction"
      - "request.ai.generateEmbeddings"
      - "request.ai.analyzeSentiment"
      - "events.*.UserDeleted"
      - "events.*.GdprAnonymizeRequested"
      - "$JS.API.>"
      - "_INBOX.>"

  # ---------------------------------------------------------------------------
  # billing-service: subscriptions, invoices, payments, Stripe webhooks
  # ---------------------------------------------------------------------------
  - name: billing_service
    description: Subscriptions, invoicing, Stripe payment processing
    publish:
      - "AQUACULTURE_EVENTS.Subscription*.>"
      - "AQUACULTURE_EVENTS.Invoice*.>"
      - "AQUACULTURE_EVENTS.Payment*.>"
      # DATA-LOW-001: billing is the SSoT for subscription state and emits this
      # tenant-facing projection event so auth.tenants can mirror plan / trial /
      # subscription-end (auth subscribes via its AQUACULTURE_EVENTS.> wildcard).
      - "AQUACULTURE_EVENTS.TenantSubscriptionChanged.>"
      - "$JS.API.>"
      - "_INBOX.>"
    subscribe:
      - "AQUACULTURE_EVENTS.TenantCreated.>"
      - "AQUACULTURE_EVENTS.TenantStatusChanged.>"
      - "AQUACULTURE_EVENTS.Subscription*.>"
      - "AQUACULTURE_EVENTS.Invoice*.>"
      - "AQUACULTURE_EVENTS.Payment*.>"
      # Platform-admin billing mutations are owned by billing-service.
      # admin-api may expose REST facade routes, but writes must enter
      # billing through these audited command subjects.
      - "request.billing.admin.>"
      - "$JS.API.>"
      - "_INBOX.>"

  # ---------------------------------------------------------------------------
  # alert-engine: rule-based alerting from sensor readings
  # ---------------------------------------------------------------------------
  # Naming note: user is `alert_engine` (NOT `alert_service`). Historical;
  # preserved to avoid churn. See ADR-014.
  - name: alert_engine
    description: Sensor-reading → alert-rule evaluation, alert lifecycle events
    publish:
      - "events.*.AlertTriggered"
      - "events.*.AlertResolved"
      - "AQUACULTURE_EVENTS.Alert*.>"
      - "$JS.API.>"
      - "_INBOX.>"
    subscribe:
      - "events.*.SensorReading"
      - "events.*.WaterQualityCritical"
      # Farm-raised high-mortality signal → alert-engine converts it into a
      # real AlertIncident (dead-listeners produce-side cure, blocker 4).
      - "events.*.MortalityAlertRaised"
      - "AQUACULTURE_EVENTS.SensorReading.>"
      - "AQUACULTURE_EVENTS.Alert*.>"
      - "$JS.API.>"
      - "_INBOX.>"

  # ---------------------------------------------------------------------------
  # hr-service: employees, leave, attendance, certifications, payroll
  # ---------------------------------------------------------------------------
  - name: hr_service
    description: HR domain — employees, leave, attendance, certifications, payroll, scheduling
    publish:
      - "AQUACULTURE_EVENTS.Employee*.>"
      - "AQUACULTURE_EVENTS.Leave*.>"
      - "AQUACULTURE_EVENTS.Attendance*.>"
      - "AQUACULTURE_EVENTS.Certification*.>"
      - "AQUACULTURE_EVENTS.Payroll*.>"
      - "AQUACULTURE_EVENTS.Schedule*.>"
      - "commands.notification.sendEmail"
      - "$JS.API.>"
      - "_INBOX.>"
    subscribe:
      - "AQUACULTURE_EVENTS.>"
      - "$JS.API.>"
      - "_INBOX.>"

  # ---------------------------------------------------------------------------
  # messaging-service: channels, messages, retention, compliance
  # ---------------------------------------------------------------------------
  - name: messaging_service
    description: Messaging domain — channels, messages, retention policies, compliance audit
    publish:
      # Canonical event-bus subjects: events.{tenantId}.{eventType}.
      - "events.*.ThreadCreated"
      - "events.*.ThreadStatusChanged"
      - "events.*.MessageSent"
      - "events.*.MessageRead"
      - "events.*.BulkThreadsCreated"
      - "events.*.AnnouncementPublished"
      - "events.*.AnnouncementExpired"
      - "events.*.AnnouncementAcknowledged"
      - "events.*.ChannelCreated"
      - "events.*.ChannelUpdated"
      - "events.*.ChannelArchived"
      - "events.*.ChannelMemberAdded"
      - "events.*.ChannelMemberRemoved"
      - "events.*.MessageUpdated"
      - "events.*.MessageDeleted"
      - "events.*.MessagePinned"
      - "events.*.MessageUnpinned"
      - "events.*.MessageForwarded"
      - "events.*.ReactionAdded"
      - "events.*.ReactionRemoved"
      - "events.*.RetentionPolicyChanged"
      - "events.*.LegalHoldToggled"
      - "events.*.SentimentAlert"
      - "events.*.StorageWarning"
      - "events.*.UserDataAnonymized"
      - "events.*.GdprAnonymizeRequested"
      # Legacy AQUACULTURE_EVENTS subjects remain as an explicit exception
      # until 2026-08-31 while remaining consumers migrate to events.*.
      - "AQUACULTURE_EVENTS.Message*.>"
      - "AQUACULTURE_EVENTS.Channel*.>"
      - "AQUACULTURE_EVENTS.RetentionPolicy*.>"
      - "commands.notification.sendPush"
      # Channel-admission gate (DİLİM-2): request-reply to auth-service to
      # validate that invited userIds belong to this tenant. Exactly one
      # subject — NOT broad request.auth.> (least privilege).
      - "request.auth.user.validateTenantMembership"
      - "$JS.API.>"
      - "_INBOX.>"
    subscribe:
      # Legacy event subjects remain as an explicit exception until
      # 2026-08-31 while consumers migrate to canonical events.*.
      - "AQUACULTURE_EVENTS.>"
      # NestJS microservice transport: explicit request-reply subjects only.
      - "request.messaging.verifyMembership"
      - "request.messaging.getChannelMembers"
      - "request.messaging.getMessageBatch"
      - "request.messaging.resolveNotificationRef"
      - "request.messaging.admin.complianceStats"
      - "request.messaging.admin.getLegalHolds"
      - "request.messaging.admin.createLegalHold"
      - "request.messaging.admin.releaseLegalHold"
      - "request.messaging.admin.getRetentionPolicies"
      - "request.messaging.admin.updateRetentionPolicy"
      - "request.messaging.admin.getAuditLog"
      - "request.messaging.admin.triggerExport"
      - "request.messaging.admin.getPersonas"
      # @EventPattern subscriptions from auth/admin
      - "events.>"
      - "$JS.API.>"
      - "_INBOX.>"

  # ---------------------------------------------------------------------------
  # hydroponics-service: grow cycles, hydroponics operations
  # ---------------------------------------------------------------------------
  - name: hydroponics_service
    description: Hydroponics domain — grow cycles, nutrient dosing, climate control
    publish:
      - "AQUACULTURE_EVENTS.Hydroponics*.>"
      - "AQUACULTURE_EVENTS.GrowCycle*.>"
      - "$JS.API.>"
      - "_INBOX.>"
    subscribe:
      - "AQUACULTURE_EVENTS.>"
      - "$JS.API.>"
      - "_INBOX.>"

  # ---------------------------------------------------------------------------
  # observability-service: migration audit sink + security events sink
  # ---------------------------------------------------------------------------
  # WHAT — observability is a consumer-only service. It subscribes to two
  #   cross-service event bridges:
  #     1. events.platform.schema-migration.> — SchemaMigrationEventsConsumer
  #        translates each started/applied/failed/skipped event into a
  #        RecordMigrationEventCommand → observability.migration_events +
  #        observability.migration_backfill_progress (ADR-022, plan v3 R6).
  #     2. events.security.events.> — SecurityEventsConsumerService counts
  #        security events for Prometheus + structured log sink.
  #
  # WHY — Phase 6 added the NATS consumer path to observability-service but
  #   the SSoT entry was missed. Without an entry here:
  #     - generate-nats-conf.py never emits a `CN=observability_service` user
  #       in nats.conf authorization{} → server rejects the TLS handshake
  #       with `Authorization Violation` + container restart loop.
  #     - generate-internal-certs.sh never mints the mTLS client cert, so
  #       the compose mount path is empty → `ENOENT` on boot.
  #   Both failure modes surfaced as the "observability restart loop" in
  #   the 2026-04-21 deploy where the boot-signal assertion
  #   ("Schema drift scan clean") never emitted because the Nest bootstrap
  #   aborted at NatsEventBus.onModuleInit before SchemaDriftValidator ran.
  #
  # PUBLISH — minimal $JS.API + _INBOX only; observability does not emit
  #   domain events. Generator requires publish to be non-empty.
  #
  # SUBSCRIBE — scoped to the two consumer subjects + JetStream/_INBOX. No
  #   AQUACULTURE_EVENTS.> blanket subscribe; observability does not consume
  #   domain events (R26: NATS subject ACL narrowing — least privilege).
  - name: observability_service
    description: Observability — migration audit sink, security events sink, Prometheus/OTEL exporter
    publish:
      - "$JS.API.>"
      - "_INBOX.>"
    subscribe:
      - "events.platform.schema-migration.>"
      - "events.security.events.>"
      - "$JS.API.>"
      - "_INBOX.>"
