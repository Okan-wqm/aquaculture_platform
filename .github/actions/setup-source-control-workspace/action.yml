name: Setup source-control workspace
description: >-
  Install the pinned Node toolchain and immutable dependency graph for the
  source-control authority jobs running on ephemeral GitHub-hosted runners.

inputs:
  node-version:
    description: Node.js version declared by the calling workflow authority.
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install immutable workspace dependencies
      shell: bash
      run: >-
        npm ci --ignore-scripts --no-audit --prefer-offline
        --fetch-retries=5 --fetch-retry-mintimeout=20000
        --fetch-retry-maxtimeout=120000
