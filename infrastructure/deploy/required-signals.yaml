schema_version: 2
# window_seconds is the MAX time a service has to emit each required boot signal
# before the deploy gate declares it missing. assert-service-signals.ts polls and
# passes the instant every signal appears, so a wide window is free for fast
# services — it only prevents FALSE failures for healthy-but-slow boots. On a
# contended single-droplet cold-start (all ~25 containers booting at once +
# gateway supergraph composition retrying while auth-service warms up), the
# heaviest backend's schema_drift_clean scan (77 entities × per-tenant schemas)
# legitimately emitted ~220s in — past the former 120s default, false-failing the
# gate into a rollback even though every container was healthy. 300s (the value
# db-migrate already used) gives margin; a genuinely dead service still fails,
# just later.
defaults:
  window_seconds: 300
signal_library:
  schema_drift_clean:
    pattern: "Schema drift scan clean"
    description: "SchemaDriftValidator found zero error-severity violations."
    canonicalSource: "libs/backend-common/src/constants/boot-invariant-signals.ts"
    emitterSources:
      - libs/backend-common/src/database/schema-drift-validator.service.ts
  nats_auth_mode_mtls:
    pattern: "NATS auth mode: mtls-cert"
    description: "NATS client connected successfully with mTLS cert auth."
    canonicalSource: "libs/backend-common/src/constants/boot-invariant-signals.ts"
    emitterSources:
      - platform/libs/event-bus/src/nats/nats-event-bus.ts
  db_migrate_complete:
    pattern: "aqua-db-migrate complete"
    description: "Centralized db-migrate runner reached its success exit."
    canonicalSource: "libs/backend-common/src/constants/boot-invariant-signals.ts"
    emitterSources:
      - apps/db-migrate/src/main.ts
  feeding_scheduler_ready:
    pattern: "Feeding scheduler durable heartbeat ready"
    description: "Farm feeding scheduler completed an initial sweep and durably recorded its heartbeat."
    canonicalSource: "libs/backend-common/src/constants/boot-invariant-signals.ts"
    emitterSources:
      - apps/farm-feeding-scheduler/src/feeding-schedule-ingress.service.ts
services:
  - name: db-migrate
    signals:
      - db_migrate_complete
  - name: auth-service
    signals:
      - nats_auth_mode_mtls
      - schema_drift_clean
  - name: farm-service
