openapi: 3.0.3
info:
  title: Farm Service Internal REST API
  version: 1.0.0
  description: Internal REST surface retained for probes, metrics, and Sentinel Hub proxying. Business operations are GraphQL-first.
servers:
  - url: http://farm-service:3000
    description: Internal service network
security:
  - serviceIdentityV2: []
paths:
  /health/live:
    get:
      summary: Process liveness probe
      security: []
      responses:
        '200':
          description: Process is alive
  /health/ready:
    get:
      summary: Readiness probe
      security: []
      responses:
        '200':
          description: Critical dependencies are ready
        '503':
          description: One or more critical dependencies are unavailable
  /metrics:
    get:
      summary: Prometheus metrics
      security: []
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
  /api/sentinel-hub/wms/{layerId}:
    get:
      summary: Proxy Sentinel Hub WMS image data
      parameters:
        - name: layerId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]+$'
        - name: bbox
          in: query
          required: false
          schema:
            type: string
        - name: width
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2048
        - name: height
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2048
      responses:
        '200':
          description: Image response from Sentinel Hub
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/sentinel-hub/process:
    get:
      summary: Proxy Sentinel Hub Processing API
      parameters:
        - name: bbox
          in: query
          required: true
          schema:
            type: string
        - name: fromDate
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: toDate
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: width
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2048
        - name: height
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2048
        - name: evalscript
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Processed image response
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/sentinel-hub/catalog/search:
    get:
      summary: Proxy Sentinel Hub STAC catalog search
      parameters:
        - name: bbox
          in: query
          required: true
          schema:
            type: string
        - name: fromDate
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: toDate
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: collections
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: STAC search response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    serviceIdentityV2:
      type: apiKey
      in: header
      name: x-service-signature
      description: HMAC v2 service identity headers are required for internal service calls.
  responses:
    BadRequest:
      description: Invalid request or missing tenant context
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Safe internal error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - userMessage
        - correlationId
      properties:
        code:
          type: string
        userMessage:
          type: string
        fieldPath:
          type: string
          nullable: true
        retryable:
          type: boolean
        statusCode:
          type: integer
        correlationId:
          type: string
