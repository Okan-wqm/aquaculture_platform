# SENSOR-MEDIUM-122 fixture: the sensor subgraph types referenced by the
# module's hand-written GraphQL documents, pinned to the backend DTOs
# (apps/sensor-service/src/registration/dto/*.ts — RegisteredSensorType,
# SensorConnectionStatusType, DataChannelType, AlertThresholdsType) and to
# the readings types of the live gateway (verified 2026-09-16 by posting the
# documents to the gateway and reading GRAPHQL_VALIDATION_FAILED output —
# introspection is disabled in production).
#
# When sensor-service DTOs change, refresh this excerpt from those classes
# (or a freshly composed subgraph SDL) — the contract spec below is only as
# honest as this fixture.
type SensorConnectionStatusType {
  isConnected: Boolean!
  lastTestedAt: DateTime
  lastError: String
  latency: Float
}

type AlertThresholdValueType {
  low: Float
  high: Float
}

type AlertThresholdsType {
  warning: AlertThresholdValueType
  critical: AlertThresholdValueType
  hysteresis: Float
}

type ChannelSensorInfoType {
  id: ID!
  name: String!
  type: String
}

type DataChannelType {
  id: ID!
  sensorId: ID!
  sensor: ChannelSensorInfoType
  tenantId: ID!
  channelKey: String!
  displayLabel: String!
  description: String
  dataType: ChannelDataType!
  unit: String
  dataPath: String
  minValue: Float
  maxValue: Float
  calibrationEnabled: Boolean!
  calibrationMultiplier: Float!
  calibrationOffset: Float!
  lastCalibratedAt: DateTime
  nextCalibrationDue: DateTime
  calibrationIntervalDays: Int
  alertThresholds: AlertThresholdsType
  displaySettings: ChannelDisplaySettingsType
  discoveredAt: DateTime
  discoverySource: DiscoverySource
  sampleValue: JSON
  isEnabled: Boolean!
  displayOrder: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum ChannelDataType {
  number
  boolean
  string
  enum
}

enum DiscoverySource {
  auto
  manual
  template
}

type ChannelDisplaySettingsType {
  color: String
  icon: String
  widgetType: String
  precision: Int
  showOnDashboard: Boolean
  chartConfig: JSON
}

# Copied from the emitted sensor SDL: GraphQL enum members are the NAMES.
enum SensorType {
  TEMPERATURE
  PH
  DISSOLVED_OXYGEN
  SALINITY
  AMMONIA
  NITRITE
  NITRATE
  TURBIDITY
  WATER_LEVEL
  MULTI_PARAMETER
  FLOW_RATE
  CONDUCTIVITY
  ORP
  CHLORINE
  CO2
}

enum SensorRegistrationStatus {
  draft
  pending_test
  testing
  test_failed
  active
  suspended
}

enum SensorRole {
  parent
  child
}

type RegisteredSensorType {
  id: ID!
  name: String!
  type: SensorType!
  typeDefinitionId: ID
  protocolCode: String!
  protocolConfiguration: JSON
  connectionStatus: SensorConnectionStatusType
  registrationStatus: SensorRegistrationStatus!
  manufacturer: String
  model: String
  serialNumber: String
  description: String
  farmId: ID
  pondId: ID
  tankId: ID
  siteId: ID
  departmentId: ID
  systemId: ID
  equipmentId: ID
  location: String
  metadata: JSON
  tenantId: ID
  parentId: ID
  isParentDevice: Boolean!
  dataPath: String
  unit: String
  sensorRole: SensorRole
  firmwareVersion: String
  lastCalibratedAt: DateTime
  dataChannels: [DataChannelType!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Registration inputs (SENSOR-HIGH-140), copied from the emitted sensor SDL.
input RegisterParentWithChildrenInput {
  parent: RegisterParentDeviceInput!
  children: [RegisterChildSensorInput!]!
  skipConnectionTest: Boolean = false
}

input RegisterParentDeviceInput {
  name: String!
  protocolCode: String!
  protocolConfiguration: JSON!
  manufacturer: String
  model: String
  serialNumber: String
  description: String
  farmId: ID
  pondId: ID
  tankId: ID
  siteId: ID
  departmentId: ID
  systemId: ID
  equipmentId: ID
  location: String
  metadata: JSON
}

input RegisterChildSensorInput {
  name: String!
  type: SensorType!
  typeDefinitionId: ID
  dataPath: String!
  unit: String
  minValue: Float
  maxValue: Float
  calibrationEnabled: Boolean = false
  calibrationMultiplier: Float = 1
  calibrationOffset: Float = 0
  alertThresholds: SensorAlertThresholdsInput
  displaySettings: DisplaySettingsInput
}

input SensorAlertThresholdsInput {
  warning: AlertThresholdRangeInput
  critical: AlertThresholdRangeInput
}

input AlertThresholdRangeInput {
  low: Float
  high: Float
}

input DisplaySettingsInput {
  showOnDashboard: Boolean = true
  widgetType: String
  color: String
  sortOrder: Float
  decimalPlaces: Float
}

# Channel-generic reads (SENSOR-HIGH-138), copied from the emitted sensor SDL
# (dist/graphql/subgraphs/sensor.graphql, 2026-10-07).
enum ChannelAlertLevel {
  NORMAL
  WARNING
  CRITICAL
}

type ChannelLatestValue {
  sensorId: ID!
  channelId: ID!
  channelKey: String!
  displayLabel: String!
  unit: String
  unitSymbol: String
  displayOrder: Int!
  precision: Int
  value: Float
  time: DateTime
  qualityCode: Int
  alertLevel: ChannelAlertLevel
}

type ChannelSeriesPoint {
  bucket: DateTime!
  avg: Float!
  min: Float
  max: Float
  count: Int!
  badCount: Int!
}

type TimeWindow {
  start: DateTime!
  end: DateTime!
}

type ChannelSeries {
  channelId: ID!
  channelKey: String!
  displayLabel: String!
  unit: String
  unitSymbol: String
  precision: Int
  enabled: Boolean!
  points: [ChannelSeriesPoint!]!
  gaps: [TimeWindow!]!
}

enum MetricSourceTier {
  RAW
  MINUTE
  HOUR
  DAY
}

enum SeriesTimeZoneSource {
  SITE
  TENANT
  UNAVAILABLE
}

type ChannelSeriesResponse {
  sensorId: ID!
  interval: String! @deprecated(reason: "Use resolution")
  resolution: AggregationInterval!
  sourceTier: MetricSourceTier!
  bucketTimeZone: String!
  displayTimeZone: String!
  displayTimeZoneSource: SeriesTimeZoneSource!
  maxRangeSeconds: Int!
  startTime: DateTime!
  endTime: DateTime!
  channels: [ChannelSeries!]!
}

type ChannelDataBounds {
  sensorId: ID!
  channelId: ID!
  firstSampleAt: DateTime
  lastSampleAt: DateTime
}

type SeriesDisplayTimeZone {
  displayTimeZone: String!
  source: SeriesTimeZoneSource!
}

enum AggregationInterval {
  ONE_MINUTE
  FIVE_MINUTES
  FIFTEEN_MINUTES
  ONE_HOUR
  FOUR_HOURS
  ONE_DAY
  ONE_WEEK
}

type Query {
  sensor(id: ID!): RegisteredSensorType
  dataChannelsBySensor(sensorId: ID!): [DataChannelType!]!
  channelLatestValues(sensorIds: [ID!]!): [ChannelLatestValue!]!
  channelSeries(
    sensorId: ID!
    startTime: DateTime!
    endTime: DateTime!
    interval: AggregationInterval
  ): ChannelSeriesResponse!
  seriesDisplayTimeZone(sensorIds: [ID!]!): SeriesDisplayTimeZone!
  channelDataBounds(sensorIds: [ID!]!): [ChannelDataBounds!]!
}

scalar DateTime
scalar JSON
