# WARNING: FILE-BASED ACL - DEVELOPMENT ONLY
# This ACL file does NOT enforce tenant isolation for sensor/#, sensors/#,
# test/#, or debug/# topics. Any authenticated client can access these topics
# across all tenants. For production, use HTTP-based auth (MQTT_AUTH_MODE=http)
# which enforces per-tenant ACL checks via the sensor-service API.
#
# ============================================
# Mosquitto ACL Configuration
# Aquaculture Platform - Topic Access Control
# ============================================
#
# Topic Patterns:
#   %u = username (mqtt_client_id for edge devices)
#   %c = client ID
#
# Access Types:
#   read, write, readwrite, deny
#
# Pattern Matching:
#   + = single level wildcard
#   # = multi-level wildcard
# ============================================

# ============================================
# Backend Services - Full Access
# ============================================
# Backend services use the 'backend_service' user
# with full read/write access to all topics
user backend_service
topic readwrite #

# Sensor service for data ingestion
user sensor_service
topic readwrite #

# Alert engine for monitoring
user alert_service
topic read sensor/#
topic read edge/#
topic write alerts/#

# ============================================
# Edge Device Access Rules (v1.1)
# ============================================
# Each edge device has its own mqtt_client_id as username
# Format: edge-{tenantId:8}-{deviceCode}
# Example: edge-4b529829-RPI-A1B2C3D4
#
# Topic Format (v1.1): tenants/{tenant_id}/devices/{device_id}/*
# %u = device mqtt_client_id (used as device identifier in topics)

# Pattern-based rules for edge devices - tenant-prefixed topics
#
# SECURITY NOTE (tenant isolation):
# The '+' wildcard for the tenant segment means a device can technically
# access topics under any tenant's namespace (as long as %u matches).
# This is partially mitigated because %u (mqtt_client_id) is unique per device
# and assigned server-side, so a device can only access its own device topics.
#
# However, the ideal fix is to enforce tenant isolation by matching the tenant
# segment against the client identity. Mosquitto's built-in ACL patterns cannot
# do this because:
#   - Topic tenant segment = full UUID (e.g., tenants/4b529829-1234-5678-9abc-def012345678/...)
#   - Client ID format = edge-{first8chars}-{deviceCode} (e.g., edge-4b529829-RPI-A1B2C3D4)
#   - %c substitution would require exact match, which won't work with truncated IDs
#
# TODO: For production, implement a dynamic security plugin (mosquitto_auth_plugin
# or mosquitto-go-auth) that extracts the tenant_id from the device record and
# validates it against the topic's tenant segment. This would fully prevent
# cross-tenant topic access even if mqtt_client_id were somehow compromised.
#
pattern readwrite tenants/+/devices/%u/#

# Devices can publish status/telemetry to their namespace
pattern write tenants/+/devices/%u/status
pattern write tenants/+/devices/%u/telemetry
pattern write tenants/+/devices/%u/responses

# Devices can read commands and config from their namespace
pattern read tenants/+/devices/%u/commands
pattern read tenants/+/devices/%u/config

# Legacy support (deprecated - will be removed)
pattern readwrite edge/%u/#

# ============================================
# Sensor Data Topics (Legacy Support)
# ============================================
# WARNING: These topics are NOT tenant-isolated in file-based ACL mode.
# Any authenticated client can read/write to any sensor topic.
# For production, use HTTP auth mode which validates tenant ownership.
topic readwrite sensor/#
topic readwrite sensors/#

# ============================================
# System Topics
# ============================================
# $SYS topics are read-only for monitoring
topic read $SYS/#

# ============================================
# Development/Debug Topics
# ============================================
# WARNING: test/# and debug/# are open to all authenticated clients.
# Do NOT use these topics for sensitive data. Remove in production.
topic readwrite test/#
topic readwrite debug/#

