name: Production Post-Deploy Verify

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: '40-character SHA to verify. Blank uses origin/main.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      target_sha:
        description: '40-character SHA to verify.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-post-deploy-verify-${{ inputs.target_sha || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Persist enterprise workflow preflight
        env:
          PYTHONPATH: aria-kernel
          PROOF_DIR: ${{ runner.temp }}/production-post-deploy
          SSH_DIR: ${{ runner.temp }}/ssh
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          from aria_kernel.preflight import verify_workflow_preflight

          proof_dir = Path(os.environ["PROOF_DIR"])
          ssh_dir = Path(os.environ["SSH_DIR"])
          proof_dir.mkdir(parents=True, exist_ok=True)
          ssh_dir.mkdir(parents=True, exist_ok=True)
          verdict = verify_workflow_preflight(
              workflow_id="production-post-deploy-verify",
              job_id="verify",
              profile="strict",
              workspace_root=os.environ["GITHUB_WORKSPACE"],
              allowed_write_roots=[str(proof_dir), str(ssh_dir)],
              path_allowlist=[
                  "runner-temp/production-post-deploy",
                  "runner-temp/ssh",
              ],
              external_root_allowlist=[str(Path(os.environ["RUNNER_TEMP"]).resolve())],
              network_policy=[
                  "actions_runtime",
                  "github_artifact",
                  "github_git",
                  "production_ssh",
              ],
              network_enforcement_evidence="pinned SSH known_hosts plus read-only artifact upload",
              token_provenance="github_actions_artifact_token",
              require_github_app=False,
              dlp_mode="fail_closed",
              dlp_scan_clean=True,
              audit_reason="verify production deploy release ledger, digest manifest, and health",
              audit_artifact_path=proof_dir / "workflow-preflight.json",
          )
          if not verdict.valid:
              raise SystemExit(";".join(verdict.reasons))
          PY

      - name: Resolve target SHA and deployed tag
        id: target
        env:
          TARGET_SHA_INPUT: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch --force --prune origin main '+refs/tags/deployed/production:refs/tags/deployed/production'

          TARGET_SHA="${TARGET_SHA_INPUT:-}"
          if [ -z "${TARGET_SHA}" ]; then
            TARGET_SHA="$(git rev-parse origin/main)"
          fi

          case "${TARGET_SHA}" in
            *[!0-9a-f]*)
              echo "::error::target_sha must be lowercase hex."
              exit 2
              ;;
          esac
          if [ "${#TARGET_SHA}" -ne 40 ]; then
            echo "::error::target_sha must be exactly 40 characters."
            exit 2
          fi

          DEPLOYED_SHA="$(git rev-parse deployed/production)"
          if [ "${DEPLOYED_SHA}" != "${TARGET_SHA}" ]; then
            echo "::error::deployed/production does not match target_sha."
            echo "target_sha=${TARGET_SHA}"
            echo "deployed_production=${DEPLOYED_SHA}"
            exit 1
          fi

          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "deployed_sha=${DEPLOYED_SHA}" >> "$GITHUB_OUTPUT"

      - name: Assert production SSH secrets present
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_SSH_KNOWN_HOSTS: ${{ secrets.DROPLET_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=()
          for name in DROPLET_HOST DROPLET_USER DROPLET_SSH_KEY DROPLET_SSH_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing production environment secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run release-ledger, digest, and health proof on droplet
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_SSH_KNOWN_HOSTS: ${{ secrets.DROPLET_SSH_KNOWN_HOSTS }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/ssh"
          key_file="$RUNNER_TEMP/ssh/production_key"
          printf '%s\n' "${DROPLET_SSH_KEY}" > "$key_file"
          chmod 600 "$key_file"
          known_hosts_file="$RUNNER_TEMP/ssh/known_hosts"
          printf '%s\n' "${DROPLET_SSH_KNOWN_HOSTS}" > "$known_hosts_file"
          chmod 600 "$known_hosts_file"

          proof_dir="$RUNNER_TEMP/production-post-deploy"
          evidence="$proof_dir/production-post-deploy-evidence.raw.json"
          ssh -i "$key_file" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            "${DROPLET_USER}@${DROPLET_HOST}" \
            "TARGET_SHA=${TARGET_SHA} bash -s" \
            < scripts/deploy/post-deploy-verify.sh \
            > "$evidence"

          python3 -m json.tool "$evidence" > "$proof_dir/production-post-deploy-evidence.json"
          {
            echo "### Production post-deploy verification"
            echo ""
            echo "- Target SHA: \`${TARGET_SHA}\`"
            echo "- deployed/production: \`${{ steps.target.outputs.deployed_sha }}\`"
            echo "- Evidence artifact: \`production-post-deploy-evidence\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: production-post-deploy-evidence-${{ steps.target.outputs.target_sha }}
          path: |
            ${{ runner.temp }}/production-post-deploy/production-post-deploy-evidence.json
            ${{ runner.temp }}/production-post-deploy/workflow-preflight.json
          if-no-files-found: error
          retention-days: 30
