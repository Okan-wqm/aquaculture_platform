# ============================================================================
# E2E Tests — Messaging Service
#
# Runs the messaging-service E2E test suite against real PostgreSQL + Redis.
# Tests cover: channel CRUD, messaging core, tenant isolation, AI chat,
# compliance, presence, offline sync, rate limiting, GDPR, and more.
#
# SEC-CI-002: All third-party actions pinned to full commit SHAs
# SEC-CI-021: Minimum token permissions
#
# This workflow is designed to be reused as a template for other services.
# To add E2E tests for another service:
#   1. Copy this file as e2e-{service-name}.yml
#   2. Update SERVICE_NAME, jest config path, and test directory
#   3. Add service-specific init SQL if needed
# ============================================================================

name: E2E - Messaging Service

on:
  push:
    branches: [main, develop, 'feature/*', 'hotfix/*']
    paths:
      - 'apps/messaging-service/**'
      - 'libs/backend-common/**'
      - 'libs/event-contracts/**'
      - 'platform/libs/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/messaging-service/**'
      - 'libs/backend-common/**'
      - 'libs/event-contracts/**'
      - 'platform/libs/**'
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Test file filter (e.g. tenant-isolation, messaging-core)'
        required: false
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  SERVICE_NAME: messaging-service

concurrency:
  group: e2e-messaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-messaging:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ── Infrastructure Services ──────────────────────────────────────────
    # Real PostgreSQL (TimescaleDB) + Real Redis — same images as production.
    # NATS is not needed: E2E tests mock the NATS client at the NestJS level.

    services:
      postgres:
        # INFRA-CRITICAL-010: HA edition includes pgvector (HNSW + vector_cosine_ops)
        # Single source of truth: same image used in CI + dev + droplet + prod compose files
        image: timescale/timescaledb-ha:pg16@sha256:b3d038d0a0757df8a5ec0a94ba68d9ad57b0e16100a024cf4b370c77ad5645f7
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aquaculture_e2e
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      # ── Checkout ─────────────────────────────────────────────────────
      # SEC-CI-002: pinned to SHA
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # ── Node.js Setup ────────────────────────────────────────────────
      # SEC-CI-002: pinned to SHA
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ── NX Cache ─────────────────────────────────────────────────────
      # SEC-CI-002: pinned to SHA
      - name: Cache NX
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-e2e-messaging-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-e2e-messaging-${{ runner.os }}-

      # ── Install Dependencies ─────────────────────────────────────────
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      # ── Database Setup ───────────────────────────────────────────────
      # Create the messaging source schema and grant permissions.
      # This replicates what 00-init-schemas.sh does in docker-compose.
      - name: Initialize database schemas
        run: |
          psql -h localhost -U postgres -d aquaculture_e2e <<'SQL'
            -- Create messaging source schema (template for tenant schemas)
            CREATE SCHEMA IF NOT EXISTS messaging;

            -- Grant permissions to postgres user (in CI we use the superuser directly)
            GRANT ALL PRIVILEGES ON SCHEMA messaging TO postgres;
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA messaging TO postgres;
            ALTER DEFAULT PRIVILEGES IN SCHEMA messaging GRANT ALL ON TABLES TO postgres;
            ALTER DEFAULT PRIVILEGES IN SCHEMA messaging GRANT ALL ON SEQUENCES TO postgres;

            -- Enable extensions required by messaging-service
            CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
            CREATE EXTENSION IF NOT EXISTS "pgcrypto";
            -- INFRA-CRITICAL-010: pre-enable pgvector explicitly so the migration
            -- 1800700000000-AddMessagesEmbeddingColumn can find vector_cosine_ops at HNSW
            -- index creation time. The HA edition ships pgvector preinstalled,
            -- but CREATE EXTENSION must run once to register it in the database.
            CREATE EXTENSION IF NOT EXISTS "vector";
          SQL
        env:
          PGPASSWORD: postgres

      # ── Run E2E Tests ────────────────────────────────────────────────
      # Tests bootstrap the full NestJS application via Test.createTestingModule().
      # In CI the TypeORM DataSource runner stays disabled; the platform
      # MessagingMigrationRunnerService applies the bundled baseline before
      # SourceSchemaBootstrapService verifies the populated source schema.
      # Tenant schemas are created dynamically by the test setup.
      - name: Run E2E tests
        run: |
          TEST_FILTER="${{ github.event.inputs.test_filter || '' }}"
          if [ -n "$TEST_FILTER" ]; then
            npx jest \
              --config apps/messaging-service/test/jest-e2e.config.ts \
              --runInBand \
              --verbose \
              --forceExit \
              --testPathPatterns="$TEST_FILTER"
          else
            npx jest \
              --config apps/messaging-service/test/jest-e2e.config.ts \
              --runInBand \
              --verbose \
              --forceExit
          fi
        env:
          # ── Database ──
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_NAME: aquaculture_e2e
          # Keep TypeORM's built-in DataSource runner disabled. E2E explicitly
          # enables the platform migration runner below so it owns migration
          # execution with the same transaction semantics production gates
          # require.
          DATABASE_MIGRATIONS_RUN: 'false'
          MIGRATION_RUNNER_ENABLED: 'true'
          DB_MIGRATE_AUTHORITATIVE: 'false'
          # ── Redis ──
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 3
          # ── Rate Limiting ──
          THROTTLE_ENABLED: 'false'
          # ── Security ──
          # INTERNAL_SERVICE_SECRET intentionally NOT set —
          # ServiceIdentityGuard auto-disables in non-production mode.
          NODE_ENV: test
          # ── NX ──
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

      # ── Test Results ─────────────────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-messaging-results-${{ github.run_number }}
          path: |
            apps/messaging-service/test/**/*.xml
            apps/messaging-service/test/**/*.json
          retention-days: 14
          if-no-files-found: ignore
