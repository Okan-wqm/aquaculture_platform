union AriaCommandResult =
  | AriaCommandAccepted
  | AriaCommandConflict
  | AriaCommandDenied
  | AriaCommandStale
  | AriaCommandInvalid
  | AriaCommandUnavailable

type AriaCommandAccepted {
  commandId: ID!
  aggregateId: ID!
  version: Long!
}

type AriaCommandConflict {
  currentVersion: Long!
  safeRefreshCursor: Cursor!
}

type AriaCommandDenied {
  reasonCode: String!
}

type AriaCommandStale {
  requiredAuthorityVersion: String!
}

type AriaFieldError {
  field: String!
  code: String!
}

type AriaCommandInvalid {
  fieldErrors: [AriaFieldError!]!
}

type AriaCommandUnavailable {
  retryAfter: DateTime
  requestStatusLookupId: ID
}
