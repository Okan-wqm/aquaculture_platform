server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Block standalone index.html - microfrontends must only be accessed via Module Federation
    # Serving index.html would bypass the shell's authentication and routing
    location = /index.html {
        return 403;
    }
    location = / {
        return 403;
    }

    # Health check endpoint for Docker
    location = /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # RemoteEntry.js - no cache, CORS enabled (Module Federation entry point)
    location = /assets/remoteEntry.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    }

    # Cache control for assets (JS/CSS chunks loaded by Module Federation)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    }

    # Libs directory (for modules that ship extra static files)
    location /libs/ {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    }

    # Specific HTML files (e.g. process-editor-canvas.html) - CORS for iframe embedding
    # Only serves files that actually exist, no fallback
    location ~* ^/.+\.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'X-Frame-Options' 'SAMEORIGIN' always;
        try_files $uri =404;
    }

    # Default: return 404 for anything else (no SPA fallback)
    location / {
        try_files $uri =404;
    }
}
