# Dependabot configuration.
#
# Purpose: keep 20+ SHA-pinned GitHub Actions workflows from silent rot.
# Every `uses: org/action@<40-char-sha>` in .github/workflows/** is pinned
# for supply-chain integrity; without dependabot tracking, pins age out and
# eventually reference unmaintained or vulnerable versions.
#
# See /root/.claude/plans/declarative-riding-shamir.md INFRA-3 (Round 3).

version: 2

updates:
  # ── GitHub Actions ────────────────────────────────────────────────
  # Weekly PRs bumping pinned SHAs to latest verified release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    labels:
      - dependencies
      - github-actions
    reviewers:
      - Okan-wqm
    # Group minor + patch bumps into one PR per action to reduce noise;
    # major bumps stay individual so review can assess breaking changes.
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # ── Rust / Cargo (workspace) ──────────────────────────────────────
  # Weekly PRs for the Rust workspace Cargo.toml + every crate/**
  # Cargo.toml in the monorepo. sensor-ingestion + the shared crates
  # under crates/** inherit this automation; the sens-api-gateway
  # edge tree keeps its own deny.toml allowlist and manages its own
  # cadence, so directory: / (monorepo root Cargo.toml virtual
  # workspace) is the single entry here. Rust advisories (RUSTSEC)
  # are handled by cargo-audit in rust-ci.yml + .cargo/audit.toml;
  # dependabot handles non-advisory version bumps to keep Cargo.lock
  # from drifting into unsupported releases.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    labels:
      - dependencies
      - rust
    reviewers:
      - Okan-wqm
    # Same grouping discipline as actions: minor+patch together,
    # major isolated. Cargo semver carries the same breaking-change
    # risk, so review can triage per-major.
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # ── npm (root workspace) ──────────────────────────────────────────
  # Added 2026-08-06 (ORPHAN-HIGH-574). Until now this file covered only
  # github-actions and cargo, so the entire JavaScript surface — the root
  # package.json plus every member of the `workspaces` globs (apps/*, libs/*,
  # platform/libs/*, web/apps/*, web/shared-ui, web/shell, web/modules/*,
  # mcp/*, tools/executors/cargo) — received no version-update PR ever. The
  # dependency tree that carries almost all of this repository's open
  # advisories was the one tree Dependabot was not watching.
  #
  # `directory: /` is the whole workspace, not just the root manifest: npm
  # workspaces resolve into the single root package-lock.json, and Dependabot
  # follows that lockfile into every member. Two lockfiles sit outside it —
  # e2e/package-lock.json and web/apps/aquamobil/package-lock.json — and are
  # deliberately NOT added here; each needs its own entry and its own decision
  # about review load, and widening coverage and raising volume in one change
  # would make neither reviewable.
  #
  # Limit and grouping are deliberately conservative. This ecosystem is far
  # larger than the other two, and the first run after enabling always lands
  # the accumulated backlog at once: minor+patch collapse into one PR, majors
  # stay individual so their blast radius is visible, and 5 open PRs caps what
  # can be in flight. Raise it once the steady-state rate is known, not before.
  #
  # Note for review: the root package.json carries 25 `overrides`. Dependabot
  # does not read them as constraints, so a bump it proposes may be neutralised
  # by an override or conflict with one. `npm audit --omit=dev
  # --audit-level=high` in ci-full's security-scan remains the gate that
  # decides whether the tree is acceptable, not the presence of a PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    labels:
      - dependencies
    reviewers:
      - Okan-wqm
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
