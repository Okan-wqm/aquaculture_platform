      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  observability-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/observability-service:latest
    container_name: aqua-observability
    restart: unless-stopped
    environment:
      SERVICE_NAME: observability-service
      NODE_ENV: production
      PORT: 3009
      NODE_OPTIONS: '--max-old-space-size=256'
      # INTERNAL_API_KEY must be set; guard rejects all requests in production without it
      INTERNAL_API_KEY: ${OBSERVABILITY_INTERNAL_API_KEY:?OBSERVABILITY_INTERNAL_API_KEY required}
      # observability-service reads DB_* env vars (not DATABASE_*) — see app.module.ts
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-aquaculture}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Observability reads cross-service metrics from the main aquaculture DB
      # (sensor, auth, alert, farm schemas). No own entities — schema-based isolation.
      DB_NAME: aquaculture
    depends_on:
      postgres:
        condition: service_healthy
    # Attached to aqua-internal only — no published ports, not reachable from external network
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3009/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  config-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/config-service:latest
    container_name: aqua-config
    restart: unless-stopped
    environment:
      SERVICE_NAME: config-service
      NODE_ENV: production
      PORT: 3000
      CONFIG_SERVICE_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=256'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-aquaculture}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DATABASE_SYNC: "false" # ARCH-DB-001: Production'da synchronize kapalı, migration kullanılmalı
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: nats://${NATS_USER:-nats_internal}:${NATS_PASS:-nats_s3cure_default_ch4nge_m3}@nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CONFIG_ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  messaging-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/messaging-service:latest
    container_name: aqua-messaging
    restart: unless-stopped
    environment:
      SERVICE_NAME: messaging-service
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=384'
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-aquaculture}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DATABASE_SYNC: 'false'
      DATABASE_MIGRATIONS_RUN: 'true'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: '3'
      NATS_URL: nats://${NATS_USER:-nats_internal}:${NATS_PASS:-nats_s3cure_default_ch4nge_m3}@nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      TRUST_PROXY: 'true'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://aquamonitoring.net}
    networks:
      - aqua-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      # ARCH-HC-001: Use /health/live for Docker healthcheck (consistent with all other services).
      # /health/ready checks DB+Redis+NATS and returns 503 on partial failure — too strict for
      # Docker liveness. The gateway only needs messaging's GraphQL endpoint reachable, which
      # /health/live confirms (NestJS HTTP listener is bound = supergraph introspection will work).
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

