# ARIA self-hosted runner — the T2 identity boundary (ADR-0023, INFRA-MEDIUM-197).
#
# Installed by scripts/aria/provision_runner.sh to
#   /etc/systemd/system/actions.runner.<slug>.<name>.service.d/identity.conf
# and drift-checked byte-for-byte on every run. Edit HERE, not on the host.
#
# WHY. ARIA's runner (T2) must never sign or approve as the operator. The
# operator key lives under /root (mode 700) as root 0600, and the runner
# reaches GitHub only as an App. That holds while the runner uid stays what
# it was measured as on 2026-10-02: gharunner, uid 1000, no supplementary
# group (docker would be root by another name), no sudo, no /root. svc.sh
# writes User= into the unit it generates; this drop-in states the identity
# in the repository, so the boundary is reviewed with the code and pinned
# by aria-kernel/tests/test_trust_anchor_boundary.py:
#   * User/Group pin the uid every job runs as;
#   * SupplementaryGroups= (empty) drops every extra group, docker included;
#   * NoNewPrivileges=yes makes sudo and every setuid binary inert for the
#     job's whole process tree, whatever sudoers says later;
#   * InaccessiblePaths=/root hides the operator key's directory even if its
#     mode is ever loosened.
# Measured 2026-10-02 with these exact properties on a transient unit as
# gharunner: the bwrap probe (implementation_safety._bwrap_probe_argv)
# still builds its sandbox, /root is denied, sudo refuses under
# no-new-privileges, and the docker socket refuses the uid.
# These are start-time properties: after installing, restart the runner
# service between jobs.
[Service]
User=gharunner
Group=gharunner
SupplementaryGroups=
NoNewPrivileges=yes
InaccessiblePaths=/root
