name: Security - Trivy

# SEC-CI-002: All third-party actions pinned to full commit SHAs
# SEC-CI-008: exit-code already '1' (confirmed in current file); verified here

on:
  # Only run on main branch pushes (not every PR)
  push:
    branches: [ main ]
  # Weekly instead of daily (saves runner minutes)
  schedule:
    - cron: '0 3 * * 0'  # Sunday at 3 AM
  workflow_dispatch:

jobs:
  trivy-fs-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload
    steps:
      - name: Checkout repository
        # SEC-CI-002: pinned to SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # SEC-CI-008: fs scan is informational (exit-code 0) — it covers dev dependencies
      # in package-lock.json/Cargo.lock that are NOT present in production Docker images.
      # Production CVEs are caught by the weekly image scan (exit-code 1 there).
      # Results are still uploaded to GitHub Security → Code Scanning for review.
      - name: Run Trivy filesystem scan
        # SEC-CI-002: pinned to SHA (was @master)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Upload SARIF results
        # SEC-CI-002: pinned to SHA
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: trivy-fs.sarif
        if: always()

  # Image scan only runs weekly (optional)
  trivy-image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      # OCI distribution-spec requires lowercase image references
      # (https://github.com/opencontainers/distribution-spec/blob/main/spec.md#pulling-manifests).
      # `${{ github.repository }}` resolves to `Okan-wqm/aquaculture_platform` —
      # the uppercase `O` makes Trivy 0.69+ reject the ref with
      # "could not parse reference". Compute the namespace once here.
      IMAGE_NAMESPACE: ghcr.io/okan-wqm/aquaculture_platform
    steps:
      - name: Checkout repository
        # SEC-CI-002: pinned to SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Pull pre-built image from GHCR
        run: |
          # Use pre-built images instead of building; a missing image is a
          # supply-chain failure and must block the scan.
          docker pull "${IMAGE_NAMESPACE}/gateway-api:latest"

      # SEC-CI-008: exit-code '1' ensures CVEs block the pipeline
      - name: Run Trivy on pre-built image
        # SEC-CI-002: pinned to SHA (was @master)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAMESPACE }}/gateway-api:latest'
          format: 'sarif'
          output: 'trivy-image.sarif'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Upload image scan SARIF results
        # SEC-CI-002: pinned to SHA
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: trivy-image.sarif
        if: always()
