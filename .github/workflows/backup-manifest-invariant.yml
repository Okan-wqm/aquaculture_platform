# Backup manifest invariant — companion gate to INFRA-1
#
# Enforces that any PR touching the backup runtime bundle or its pinned hash
# manifest keeps every consumed file in lockstep. Without this gate, a change can land
# without a matching hash update, which would cause the nightly backup to
# ABORT on the droplet (good — fail-closed is the correct posture) but
# would also create a silent backup outage until someone notices. This
# check fails the PR BEFORE merge so drift never ships.
#
# Symmetric threat:
# - Attacker tries to slip a script change without manifest update → fails here
# - Attacker tries to update manifest to a malicious hash without script
#   update → still requires @Okan-wqm CODEOWNERS approval on .github/manifests/**
#   AND .github/workflows/** per BLOCKER-9, so the same-PR-two-edit pattern is
#   the only path AND both edits are reviewed together.
#
# See /root/.claude/plans/declarative-riding-shamir.md INFRA-1
# See .github/workflows/backup-production.yml (the runtime verifier)

name: backup-manifest-invariant

on:
  pull_request:
    paths:
      - 'tools/scripts/database/backup-databases.sh'
      - 'tools/scripts/database/database-verification.sql'
      - 'tools/scripts/database/evaluate-walg-evidence.mjs'
      - 'tools/scripts/database/generate-database-verification-sql.ts'
      - 'tools/scripts/database/materialize-walg-secrets.sh'
      - 'tools/scripts/database/pitr-source-verification-locks.sql'
      - 'tools/scripts/database/read-bounded-line.mjs'
      - 'tools/scripts/database/walg-base-backup.sh'
      - 'tools/scripts/database/walg-pitr-ceremony.sh'
      - 'tools/scripts/database/walg-pitr-restore.sh'
      - 'scripts/deploy/production-host-control-plane.sh'
      - 'tools/scripts/ci/prepare-protected-runtime-bundle.sh'
      - '.github/manifests/backup-script.sha256'
      - '.github/manifests/postgres-dr-contract.sha256'
      - '.dockerignore'
      - 'infrastructure/docker/Dockerfile.postgres-walg'
      - 'infrastructure/docker/scripts/postgres-ssl-entrypoint.sh'
      - 'infrastructure/docker/scripts/postgres-walg-healthcheck.sh'
      - 'infrastructure/docker/scripts/walg-archive-command.sh'
      - 'infrastructure/docker/scripts/walg-load-secrets.sh'
      - 'infrastructure/docker/scripts/walg-restore-command.sh'
      - 'infrastructure/docker/scripts/walg-runtime-command.sh'
      - '.github/workflows/backup-manifest-invariant.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-hash:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify manifest placeholder is resolved
        run: |
          set -euo pipefail
          MANIFEST=.github/manifests/backup-script.sha256
          if [ ! -f "$MANIFEST" ]; then
            echo "FATAL: $MANIFEST does not exist."
            echo "INFRA-1 protection is bypassed without it. Restore the file."
            exit 1
          fi

          if grep -q "__COMPUTE_ON_MERGE__" "$MANIFEST"; then
            echo "FATAL: manifest still carries the __COMPUTE_ON_MERGE__ placeholder."
            echo "The PR that introduced this placeholder should have computed the"
            echo "real SHA-256 in the same commit via:"
            echo "    sha256sum <all paths declared in ${MANIFEST}>"
            exit 1
          fi

      - name: Compute actual hash and compare to manifest
        run: |
          set -euo pipefail
          MANIFEST=.github/manifests/backup-script.sha256
          EXPECTED_PATHS=$(printf '%s\n' \
            .github/manifests/postgres-dr-contract.sha256 \
            scripts/deploy/production-host-control-plane.sh \
            tools/scripts/database/backup-databases.sh \
            tools/scripts/database/database-verification.sql \
            tools/scripts/database/evaluate-walg-evidence.mjs \
            tools/scripts/database/materialize-walg-secrets.sh \
            tools/scripts/database/pitr-source-verification-locks.sql \
            tools/scripts/database/read-bounded-line.mjs \
            tools/scripts/database/walg-base-backup.sh \
            tools/scripts/database/walg-pitr-ceremony.sh \
            tools/scripts/database/walg-pitr-restore.sh)
          ACTUAL_PATHS=$(awk '$1 !~ /^#/ && NF == 2 {print $2}' "$MANIFEST" | sort)

          if [ "$ACTUAL_PATHS" != "$EXPECTED_PATHS" ]; then
            echo "FATAL: manifest path set differs from the trusted backup runtime bundle."
            echo "Expected:"
            echo "$EXPECTED_PATHS"
            echo "Actual:"
            echo "$ACTUAL_PATHS"
            exit 1
          fi

          while IFS= read -r TRUSTED_PATH; do
            if [ ! -f "$TRUSTED_PATH" ] || [ -L "$TRUSTED_PATH" ]; then
              echo "FATAL: trusted backup runtime path is not a regular non-symlink file: $TRUSTED_PATH"
              exit 1
            fi
          done <<< "$ACTUAL_PATHS"

          sha256sum --check "$MANIFEST"
          DR_CONTRACT_MANIFEST=.github/manifests/postgres-dr-contract.sha256
          EXPECTED_DR_CONTRACT_PATHS=$(printf '%s\n' \
            infrastructure/docker/Dockerfile.postgres-walg \
            infrastructure/docker/scripts/postgres-ssl-entrypoint.sh \
            infrastructure/docker/scripts/postgres-walg-healthcheck.sh \
            infrastructure/docker/scripts/walg-archive-command.sh \
            infrastructure/docker/scripts/walg-load-secrets.sh \
            infrastructure/docker/scripts/walg-restore-command.sh \
            infrastructure/docker/scripts/walg-runtime-command.sh)
          ACTUAL_DR_CONTRACT_PATHS=$(awk 'NF == 2 {print $2}' \
            "${DR_CONTRACT_MANIFEST}")
          if [ "${ACTUAL_DR_CONTRACT_PATHS}" != "${EXPECTED_DR_CONTRACT_PATHS}" ]; then
            echo 'FATAL: PostgreSQL DR contract path set or canonical order is invalid.'
            exit 1
          fi
          while IFS= read -r TRUSTED_PATH; do
            if [ ! -f "${TRUSTED_PATH}" ] || [ -L "${TRUSTED_PATH}" ]; then
              echo "FATAL: DR contract input is not a regular non-symlink file: ${TRUSTED_PATH}"
              exit 1
            fi
          done <<< "${ACTUAL_DR_CONTRACT_PATHS}"
          sha256sum --strict --check "${DR_CONTRACT_MANIFEST}"
          echo "Manifest and backup runtime bundle are in lockstep. OK."
