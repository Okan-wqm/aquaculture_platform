# Required Secrets & Config Manifest (WS8 / ADR-016 Phase A4)
#
# SSoT for every `${VAR:?...}` reference in docker-compose files. Each
# entry declares what the variable is FOR, whether it holds a secret
# or a plain config value, the rotation cadence for secrets, the
# owning runbook, and (where applicable) the Helm secret key it maps
# to when the platform migrates to Kubernetes.
#
# Why this manifest exists:
#   Before WS8 the only source of truth for "what production needs" was
#   `grep ${VAR:?} docker-compose*.yml`. That works until an operator
#   silently adds a new `:?` reference to a compose file without
#   updating the generate-random-secrets setup, at which point deploys
#   start failing at interpolation time with a cryptic
#   "VAR required" error.
#
#   The CI invariant behind this manifest
#   (`scripts/ci/validate-secrets-manifest.ts`) asserts both directions:
#     (a) every `${VAR:?}` in compose has an entry here;
#     (b) every entry here actually shows up in at least one compose file
#         (so stale entries do not linger forever).
#
# Tier-1 Make-Impossible: adding a new required secret to compose
# without documenting its purpose, owner, rotation schedule, and helm
# mapping now fails the PR build.
#
# Relationship to existing material:
#   - `docs/runbooks/secret-rotation.md` is the operational playbook.
#     Each entry's `rotation_runbook` field anchors back to the section
#     that walks through the actual rotation.
#   - `docs/security/` tracks incident history per secret class.
#   - Helm secret keys map to the sealed-secret / external-secret
#     definitions under `infrastructure/helm/aquaculture/templates/` so
#     the k8s migration path is declarative, not tribal.
#
# Types:
#   secret    — sensitive; must rotate; never commit a real value.
#   config    — non-sensitive (URLs, flags, feature toggles).
#
# Rotation cadences mirror the cadence table in
# `docs/runbooks/secret-rotation.md#rotation-cadence`.

schema_version: 1

secrets:
  # ─────────────────────────────────────────────────────────────────────
  # Database credentials (shared superuser + per-service roles)
  # ─────────────────────────────────────────────────────────────────────
  POSTGRES_PASSWORD:
    type: secret
    purpose: "Postgres superuser password (bootstrap + admin tools)."
    rotation_cadence: "90d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#postgres-credentials"
    helm_secret_key: "postgres.password"

  ADMIN_SERVICE_DB_PASS:
    type: secret
    purpose: "Per-service Postgres role password — admin-api."
    rotation_cadence: "90d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#per-service-db-credentials"
    helm_secret_key: "postgres.roles.admin"

  ALERT_SERVICE_DB_PASS:
    type: secret
    purpose: "Per-service Postgres role password — alert-engine."
    rotation_cadence: "90d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#per-service-db-credentials"
    helm_secret_key: "postgres.roles.alert"

  AUTH_SERVICE_DB_PASS:
    type: secret
    purpose: "Per-service Postgres role password — auth-service."
    rotation_cadence: "90d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#per-service-db-credentials"
    helm_secret_key: "postgres.roles.auth"

  BILLING_SERVICE_DB_PASS:
    type: secret
    purpose: "Per-service Postgres role password — billing-service."
    rotation_cadence: "90d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#per-service-db-credentials"
    helm_secret_key: "postgres.roles.billing"

  FARM_SERVICE_DB_PASS:
    type: secret
    purpose: "Per-service Postgres role password — farm-service."
    rotation_cadence: "90d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#per-service-db-credentials"
    helm_secret_key: "postgres.roles.farm"

  GATEWAY_SERVICE_DB_PASS:
    type: secret
    purpose: "Per-service Postgres role password — gateway-api (read-only)."
    rotation_cadence: "90d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#per-service-db-credentials"
    helm_secret_key: "postgres.roles.gateway"

  HR_SERVICE_DB_PASS:
    type: secret
    purpose: "Per-service Postgres role password — hr-service."
    rotation_cadence: "90d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#per-service-db-credentials"
    helm_secret_key: "postgres.roles.hr"

  NOTIFICATION_SERVICE_DB_PASS:
    type: secret
    purpose: "Per-service Postgres role password — notification-service."
    rotation_cadence: "90d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#per-service-db-credentials"
    helm_secret_key: "postgres.roles.notification"

  SENSOR_SERVICE_DB_PASS:
    type: secret
    purpose: "Per-service Postgres role password — sensor-service."
    rotation_cadence: "90d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#per-service-db-credentials"
    helm_secret_key: "postgres.roles.sensor"

  # ─────────────────────────────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────────────────────────────
  REDIS_PASSWORD:
    type: secret
    purpose: "Redis AUTH password; consumed by every backend for session / rate-limit / outbox."
    rotation_cadence: "90d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#redis-password"
    helm_secret_key: "redis.password"

  # ─────────────────────────────────────────────────────────────────────
  # Application-layer encryption keys (at-rest / in-transit)
  # ─────────────────────────────────────────────────────────────────────
  ENCRYPTION_KEY:
    type: secret
    purpose: "Platform-wide symmetric at-rest encryption key (AES-GCM)."
    rotation_cadence: "180d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#platform-encryption-key"
    helm_secret_key: "encryption.platformKey"

  CREDENTIAL_ENCRYPTION_KEY:
    type: secret
    purpose: "Encrypts stored third-party credentials (integrations)."
    rotation_cadence: "180d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#credential-encryption-key"
    helm_secret_key: "encryption.credentialKey"

  WEBHOOK_ENCRYPTION_KEY:
    type: secret
    purpose: "Encrypts outbound webhook signing secrets at rest."
    rotation_cadence: "180d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#webhook-encryption-key"
    helm_secret_key: "encryption.webhookKey"

  PASSWORD_PEPPER:
    type: secret
    purpose: "HMAC pepper applied before bcrypt on user passwords."
    rotation_cadence: "never"
    rotation_runbook: "docs/runbooks/secret-rotation.md#password-pepper"
    helm_secret_key: "security.passwordPepper"
    notes: >-
      Rotating the pepper invalidates every stored password hash — a
      platform-wide forced reset is the only path. Reserved for
      compromise response, not scheduled rotation.

  # ─────────────────────────────────────────────────────────────────────
  # Service identity / NATS-adjacent secrets
  # ─────────────────────────────────────────────────────────────────────
  INTERNAL_SERVICE_SECRET:
    type: secret
    purpose: "HMAC key for signed inter-service HTTP (service-identity headers)."
    rotation_cadence: "90d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#internal-service-secret"
    helm_secret_key: "security.internalServiceSecret"

  # ─────────────────────────────────────────────────────────────────────
  # Object storage (dev droplet MinIO)
  # ─────────────────────────────────────────────────────────────────────
  MINIO_USER:
    type: secret
    purpose: "MinIO root user (droplet-only; prod uses DO Spaces / S3)."
    rotation_cadence: "90d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#minio-credentials"

  MINIO_PASSWORD:
    type: secret
    purpose: "MinIO root password (droplet-only)."
    rotation_cadence: "90d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#minio-credentials"

  # ─────────────────────────────────────────────────────────────────────
  # MQTT (sensor ingestion)
  # ─────────────────────────────────────────────────────────────────────
  MQTT_AUTH_SECRET:
    type: secret
    purpose: "mosquitto auth-plugin shared secret for sensor-service."
    rotation_cadence: "180d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#mqtt-auth-secret"

  MQTT_SENSOR_SERVICE_PASSWORD:
    type: secret
    purpose: "Password sensor-service presents to mosquitto."
    rotation_cadence: "180d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#mqtt-sensor-service"

  MQTT_SENSOR_SERVICE_HASH:
    type: secret
    purpose: "Pre-computed mosquitto PBKDF2 hash of MQTT_SENSOR_SERVICE_PASSWORD."
    rotation_cadence: "180d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#mqtt-sensor-service"
    notes: >-
      Must be rotated in lockstep with MQTT_SENSOR_SERVICE_PASSWORD —
      the plaintext never sits alongside its hash on the same server.

  # ─────────────────────────────────────────────────────────────────────
  # Observability / admin bootstrap
  # ─────────────────────────────────────────────────────────────────────
  OBSERVABILITY_INTERNAL_API_KEY:
    type: secret
    purpose: "Bearer token for /internal/* routes on observability-service."
    rotation_cadence: "90d"
    rotation_runbook: "docs/runbooks/secret-rotation.md#observability-internal-api-key"
    helm_secret_key: "security.observabilityInternalApiKey"

  SUPER_ADMIN_PASSWORD:
    type: secret
    purpose: "Bootstrap SUPER_ADMIN password used by auth-service first-run seeder."
    rotation_cadence: "on-first-login"
    rotation_runbook: "docs/runbooks/secret-rotation.md#super-admin-bootstrap"
    notes: >-
      The first-run seeder creates the SUPER_ADMIN account only if
      none exists. Once the admin logs in and changes the password,
      this value is ignored.
