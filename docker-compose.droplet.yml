# Container logs are the third unbounded disk consumer on this droplet, after
# the two ORPHAN-HIGH-417 named. Docker's default json-file driver performs no
# rotation whatsoever, and no daemon.json ever set one: measured 2026-08-06,
# the running stack held 2.0 GB of *-json.log with aqua-auth alone at 658 MB
# and still growing, on a host at 94% with 11 GB free and a capacity gate that
# wants 37.6 GB. Nothing would ever have stopped that except the disk filling.
#
# One anchor bounds every service, so the ceiling is a property of the file
# rather than of whoever remembered: 20 MB x 3 files = 60 MB per container, so
# all 37 services together can hold at most ~2.2 GB no matter how long they
# run. The value that matters here is not the number, it is that a number
# exists at all; tests/invariants/container-log-rotation.spec.ts refuses a
# service that declares none.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '3'

networks:
  aqua-network:
    driver: bridge
  aqua-internal:
    driver: bridge
    internal: true
  # INFRA-HIGH-042 remains OPEN: this dedicated bridge removes PostgreSQL
  # from the application egress path and disables peer-to-peer traffic, but
  # host firewall allowlisting is still required to constrain destinations.
  aqua-backup-egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: 'false'

volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:
  mosquitto_data:
  mosquitto_log:
  # ORPHAN-090: persistence for the monitoring stack (sizes are the operator's call).
  prometheus_data:
  alertmanager_data:

services:
  # ===========================================================================
  # Infrastructure
  # ===========================================================================

  postgres:
    logging: *default-logging
    # Pinned to the exact version running on this droplet's data volume.
    # NEVER change this to a lower version — PostgreSQL will refuse to start
    # if the data was created with a newer TimescaleDB version.
    # To upgrade: pg_dump → destroy volume → start with new image → restore.
    #
    # INFRA-CRITICAL-010: switched 2026-04-19 from timescale/timescaledb:2.25.1-pg16
    # (no pgvector) to timescale/timescaledb-ha:pg16 (TimescaleDB + pgvector + Toolkit).
    # Required for messaging-service AI tables migration that creates HNSW index using
    # vector_cosine_ops (apps/messaging-service/src/migrations/1800700000000-AddMessagesEmbeddingColumn.ts:38).
    # Single source of truth — same digest across CI workflows + every compose file.
    # Operator action: docker compose pull && docker compose up -d after this lands.
    image: ghcr.io/okan-wqm/aquaculture_platform/postgres:${TAG:?TAG required}
    container_name: aqua-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquaculture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-aquaculture}
      POSTGRES_SHARED_BUFFERS: 512MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1536MB
      POSTGRES_WORK_MEM: 16MB
      POSTGRES_MAINTENANCE_WORK_MEM: 128MB
      # SEC-015: Per-service DB passwords (passed to 00-init-schemas.sh)
      # If not set, random passwords are generated at first init.
      AUTH_SERVICE_DB_PASS: ${AUTH_SERVICE_DB_PASS:-}
      FARM_SERVICE_DB_PASS: ${FARM_SERVICE_DB_PASS:-}
      SENSOR_SERVICE_DB_PASS: ${SENSOR_SERVICE_DB_PASS:-}
      BILLING_SERVICE_DB_PASS: ${BILLING_SERVICE_DB_PASS:-}
      HR_SERVICE_DB_PASS: ${HR_SERVICE_DB_PASS:-}
      ALERT_SERVICE_DB_PASS: ${ALERT_SERVICE_DB_PASS:-}
      ADMIN_SERVICE_DB_PASS: ${ADMIN_SERVICE_DB_PASS:-}
      GATEWAY_SERVICE_DB_PASS: ${GATEWAY_SERVICE_DB_PASS:-}
      NOTIFICATION_SERVICE_DB_PASS: ${NOTIFICATION_SERVICE_DB_PASS:-}
      HYDROPONICS_SERVICE_DB_PASS: ${HYDROPONICS_SERVICE_DB_PASS:-}
      MESSAGING_SERVICE_DB_PASS: ${MESSAGING_SERVICE_DB_PASS:-}
      # IP-1 / INFRA-MEDIUM-054: PostgreSQL identity material is staged in
      # container-lifetime tmpfs, never inside the physically backed-up PGDATA.
      POSTGRES_SSL: 'on'
      POSTGRES_SSL_RUNTIME_DIR: /run/aqua-postgres-tls
      # INFRA-HIGH-039/040/056/061: only non-secret WAL-G coordinates are
      # present in Compose. Credential files live in a dedicated host tree
      # outside the PostgreSQL TLS parent and are installed atomically from
      # their one exact bind directly into tmpfs; there is no PGDATA symlink.
      WALG_ENABLED: 'on'
      WALG_BACKUP_EPOCH: ${WALG_BACKUP_EPOCH:?WALG_BACKUP_EPOCH required}
      WALG_S3_PREFIX: s3://${WALG_SPACES_BUCKET:?WALG_SPACES_BUCKET required}/postgres/wal-g/${WALG_BACKUP_EPOCH:?WALG_BACKUP_EPOCH required}
      WALG_S3_ENDPOINT: ${SPACES_ENDPOINT:?SPACES_ENDPOINT required}
      WALG_S3_REGION: ${SPACES_REGION:?SPACES_REGION required}
      AWS_S3_FORCE_PATH_STYLE: 'true'
      # INFRA-HIGH-059: one five-minute RPO budget covers the forced WAL
      # switch, bounded upload, and Docker failure-detection windows. The
      # runtime healthcheck rejects allocations that do not add up exactly or
      # that exceed 300 seconds.
      WALG_RPO_BUDGET_SECONDS: ${WALG_RPO_BUDGET_SECONDS:-300}
      WALG_ARCHIVE_SWITCH_BUDGET_SECONDS: ${WALG_ARCHIVE_SWITCH_BUDGET_SECONDS:-225}
      WALG_WAL_PUSH_BUDGET_SECONDS: ${WALG_WAL_PUSH_BUDGET_SECONDS:-45}
      WALG_HEALTH_DETECTION_BUDGET_SECONDS: ${WALG_HEALTH_DETECTION_BUDGET_SECONDS:-30}
      WALG_SECRET_SOURCE_DIR: /var/lib/postgresql/wal-g-secrets-source
      WALG_SECRET_RUNTIME_DIR: /run/aqua-walg-secrets
      WALG_SECRET_DIR: /run/aqua-walg-secrets
      # INFRA-CRITICAL-018: image-family default-PGDATA divergence.
      # Old image (timescale/timescaledb:Alpine): PGDATA=/var/lib/postgresql/data
      # HA image (timescale/timescaledb-ha:Ubuntu): PGDATA=/home/postgres/pgdata/data
      # Existing data volume `postgres_data` was created at the legacy path —
      # we must explicitly pin PGDATA to /var/lib/postgresql/data so the HA
      # image reads the existing cluster instead of trying to initdb a
      # different (mostly-empty image-baked) directory and failing.
      # Single source of truth: this is the canonical PGDATA across every
      # compose file regardless of which image variant is in use.
      PGDATA: /var/lib/postgresql/data
    entrypoint: ['/usr/local/bin/postgres-ssl-entrypoint.sh']
    command: >
      postgres
      -c max_connections=300
      -c search_path=public,auth,admin
      -c ssl=on
      -c ssl_cert_file=/run/aqua-postgres-tls/server.crt
      -c ssl_key_file=/run/aqua-postgres-tls/server.key
      -c ssl_ca_file=/run/aqua-postgres-tls/root.crt
      -c archive_mode=on
      -c "archive_command=/usr/local/bin/walg-archive-command.sh %p %f"
      -c archive_timeout=${WALG_ARCHIVE_SWITCH_BUDGET_SECONDS:-225}s
    tmpfs:
      - /run/aqua-postgres-tls:rw,noexec,nosuid,nodev,size=1m,mode=0700
      - /run/aqua-walg-secrets:rw,noexec,nosuid,nodev,size=1m,mode=0700
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-scripts:/docker-entrypoint-initdb.d:ro
      # INFRA-HIGH-064: TLS inputs are exact-file mounts. Only the private-key
      # mount is writable so the root entrypoint can force root:root/0600 on
      # the source inode before staging a postgres-owned copy in tmpfs.
      - ./certs/postgres/postgres-cert.pem:/var/lib/postgresql/ssl/server.crt:ro
      - ./certs/postgres/postgres-key.pem:/var/lib/postgresql/ssl/server.key:rw
      - ./certs/postgres/ca-cert.pem:/var/lib/postgresql/ssl/root.crt:ro
      - ./certs/wal-g/postgres:/var/lib/postgresql/wal-g-secrets-source:ro
    networks:
      - aqua-internal
      - aqua-backup-egress
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.0'
    healthcheck:
      test: ['CMD', '/usr/local/bin/postgres-walg-healthcheck.sh']
      interval: 15s
      timeout: 5s
      retries: 1

  # ---------------------------------------------------------------------------
  # db-init: REMOVED 2026-05-18 by ADR-031 (Platform Bootstrap Atom).
  #
  # Role create + password sync + schema grant + ownership transfer — every
  # responsibility this container previously owned is now atomically owned
  # by aqua-db-migrate Phase 0 (apps/db-migrate/src/platform-bootstrap.service.ts).
  # Single SSoT, single boot signal (platform.bootstrap_signal), restart-survive.
  #
  # Forensic archive of the previous bash-based init flow lives at
  # docs/runbooks/platform-bootstrap.md + git history.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # aqua-db-migrate: One-shot schema migration runner.
  # WS10 / ADR-016 Phase E — Phase 1 (backward-compatible).
  #
  # Runs all pending schema migrations in deterministic order BEFORE any
  # backend service container starts. Uses the same search_path pinning +
  # per-migration transaction invariants as createMigrationRunnerService
  # (libs/backend-common/src/database/migration-runner/migration-runner.service.ts)
  # so its behavior is identical to the per-service runners.
  #
  # Phase 1 is backward-compatible: per-service runners remain in place.
  # If this container fails, services still boot via their own
  # createMigrationRunnerService (idempotent — they observe "all
  # migrations applied" and proceed). Phase 2 (TRACKED-DEPLOY-003)
  # removes the per-service runners; requires WS9 (staging) first.
  #
  # Critical invariants:
  #   - restart: "no" — one-shot; compose tracks exit code.
  #   - service_completed_successfully on every backend service's
  #     depends_on below — backend containers MUST NOT start until
  #     this exits 0.
  #   - Shares the aqua-internal network with postgres; no external
  #     ports. Connects over plaintext from db-migrate -> postgres
  #     inside the internal bridge (same trust boundary as every
  #     other backend service).
  # ---------------------------------------------------------------------------
  db-migrate:
    logging: *default-logging
    image: ghcr.io/okan-wqm/aquaculture_platform/db-migrate:${TAG:?TAG required}
    container_name: aqua-db-migrate
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      # Uses the postgres superuser so the runner can operate across
      # every service's schema in a single pass. Per-service roles
      # cannot grant themselves privileges on other services' schemas,
      # which would fragment the migration ordering guarantee.
      DATABASE_USER: ${POSTGRES_USER:-aquaculture}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      # db-migrate is the only production schema writer.
      DATABASE_MIGRATIONS_RUN: 'true'
      # SSL off on the internal bridge (services live on the same trust
      # boundary as postgres — TLS is enforced at the host firewall).
      DATABASE_SSL: 'false'
      # Optional bootstrap version label written to platform.bootstrap_signal.
      # Operator deploys set this to the GHA SHA / image tag for forensics.
      DB_MIGRATE_VERSION: ${TAG:?TAG required}
      DEPLOY_SHA: ${DEPLOY_SHA:-}
      DEPLOY_RELEASE_ID: ${DEPLOY_RELEASE_ID:-}
      # ─── ADR-031: per-service role passwords are owned by the
      # platform-bootstrap atom (apps/db-migrate/src/platform-bootstrap.service.ts).
      # The atom CREATE-or-ALTER ROLE ... PASSWORD on every Phase-0 run so
      # restart and DROP ROLE cycles are non-destructive to login credentials.
      # Service containers consume the same env vars below — single SSoT.
      AUTH_SERVICE_DB_PASS: ${AUTH_SERVICE_DB_PASS:-}
      FARM_SERVICE_DB_PASS: ${FARM_SERVICE_DB_PASS:-}
      SENSOR_SERVICE_DB_PASS: ${SENSOR_SERVICE_DB_PASS:-}
      BILLING_SERVICE_DB_PASS: ${BILLING_SERVICE_DB_PASS:-}
      HR_SERVICE_DB_PASS: ${HR_SERVICE_DB_PASS:-}
      ALERT_SERVICE_DB_PASS: ${ALERT_SERVICE_DB_PASS:-}
      ADMIN_SERVICE_DB_PASS: ${ADMIN_SERVICE_DB_PASS:-}
      GATEWAY_SERVICE_DB_PASS: ${GATEWAY_SERVICE_DB_PASS:-}
      NOTIFICATION_SERVICE_DB_PASS: ${NOTIFICATION_SERVICE_DB_PASS:-}
      HYDROPONICS_SERVICE_DB_PASS: ${HYDROPONICS_SERVICE_DB_PASS:-}
      AI_SERVICE_DB_PASS: ${AI_SERVICE_DB_PASS:-}
      MESSAGING_SERVICE_DB_PASS: ${MESSAGING_SERVICE_DB_PASS:-}
      OBSERVABILITY_SERVICE_DB_PASS: ${OBSERVABILITY_SERVICE_DB_PASS:-}
      EVENT_STORE_SERVICE_DB_PASS: ${EVENT_STORE_SERVICE_DB_PASS:-}
      CONFIG_SERVICE_DB_PASS: ${CONFIG_SERVICE_DB_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  tenant-schema-provisioner:
    logging: *default-logging
    image: ghcr.io/okan-wqm/aquaculture_platform/db-migrate:${TAG:?TAG required}
    container_name: aqua-tenant-schema-provisioner
    restart: unless-stopped
    command: ['node', 'dist/main.js', 'tenant-schema-provisioner', '--loop']
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-aquaculture}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DATABASE_MIGRATIONS_RUN: 'true'
      DATABASE_SSL: 'false'
      DB_MIGRATE_VERSION: ${TAG:?TAG required}
      TENANT_SCHEMA_PROVISIONER_ID: droplet-tenant-schema-provisioner
      TENANT_SCHEMA_PROVISIONER_POLL_INTERVAL_MS: ${TENANT_SCHEMA_PROVISIONER_POLL_INTERVAL_MS:-5000}
      TENANT_SCHEMA_PROVISIONER_LEASE_SECONDS: ${TENANT_SCHEMA_PROVISIONER_LEASE_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  redis:
    logging: *default-logging
    # Pinned 2026-04-05. To update: verify changelog at https://github.com/redis/redis/releases, test in staging first.
    image: redis:7-alpine
    container_name: aqua-redis
    restart: unless-stopped
    # IP-1: Redis TLS ready but disabled for phased rollout.
    # Phase 1 (current): plaintext — ensures deploy stability
    # Phase 2 (next deploy): enable TLS by mounting redis-tls.conf + certs, switching to rediss://
    #
    # INFRA-REDIS-001: Durable persistence — hybrid AOF + RDB.
    # AOF captures every write (fsync every second — ≤1s data loss window),
    # RDB snapshots let restart replay start from a recent checkpoint instead
    # of scanning the entire AOF. auto-aof-rewrite-* caps the AOF size.
    # Without these flags a Redis restart wipes session tokens, rate-limit
    # counters, outbox offsets, and refresh-token allowlists — all of which
    # the platform writes under the assumption Redis survives a bounce.
    #
    # SCOPE: this is restart-durability for the running container only —
    # NOT a backup. The backup-production.yml workflow only captures
    # Postgres. If the host disk is lost, the redis_data volume is gone
    # with no restore path. If that ever becomes load-bearing (e.g.
    # migrating session storage from JWT to server-side session), add
    # a `redis-cli --rdb -` step to the nightly backup workflow and
    # document the restore procedure. Tracked as INFRA-REDIS-BACKUP-001
    # in the hardening review.
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      --maxmemory 192mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli ping']
      interval: 15s
      timeout: 5s
      retries: 5

  nats:
    logging: *default-logging
    # Pinned 2026-04-05. To update: verify changelog at https://github.com/nats-io/nats-server/releases, test in staging first.
    image: nats:2.10.24-alpine
    container_name: aqua-nats
    restart: unless-stopped
    # ARCH-010/SEC-H01: Use config file for JetStream limits + authentication.
    # CLI flags replaced with nats.conf which includes authorization{} block.
    # Per-service NATS_<SERVICE>_USER/PASS are substituted by NATS from
    # container environment via $-interpolation in nats.conf.
    command: ['--config', '/etc/nats/nats.conf']
    # ADR-015: NATS container has NO per-service user/password env vars.
    # The authorization{} block in nats.conf now uses LITERAL user names
    # (generated from infrastructure/nats/services.yaml) — no $-interpolation
    # — and no password fields at all. Identity comes from the client cert
    # CN via verify_and_map: true (nats-tls-enabled.conf). This eliminates
    # the 3-way drift surface (env var → nats.conf interpolation → client
    # CONNECT frame) that caused the Authorization Violation outage on
    # 2026-04-14. Certs are the single source of truth for identity.
    volumes:
      - nats_data:/data
      - ./infrastructure/docker/nats/nats.conf:/etc/nats/nats.conf:ro
      - ./infrastructure/docker/nats/nats-tls-enabled.conf:/etc/nats/nats-tls.conf:ro
      - ./certs/nats:/etc/nats/certs:ro
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.25'
    healthcheck:
      # SEC-H01: Use HTTP monitoring endpoint (enabled in nats.conf http_port: 8222)
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8222/healthz']
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  mosquitto:
    logging: *default-logging
    image: ghcr.io/okan-wqm/aquaculture_platform/mosquitto:${TAG:?TAG required}
    container_name: aqua-mosquitto
    restart: unless-stopped
    # Inject MQTT_AUTH_SECRET into mosquitto config at startup (replaces placeholder)
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'sed -i "s|__MQTT_AUTH_SECRET__|$MQTT_AUTH_SECRET|g" /mosquitto/config/mosquitto.conf && exec mosquitto -c /mosquitto/config/mosquitto.conf',
      ]
    environment:
      MQTT_AUTH_SECRET: ${MQTT_AUTH_SECRET:?MQTT_AUTH_SECRET required}
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.15'
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 1883 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  minio:
    logging: *default-logging
    # Pinned 2026-04-05. To update: verify changelog at https://github.com/minio/minio/releases, test in staging first.
    image: quay.io/minio/minio:RELEASE.2025-04-03T14-56-28Z
    container_name: aqua-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?MINIO_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
    volumes:
      - minio_data:/data
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Backend Services
  # ===========================================================================

  gateway-api:
    logging: *default-logging
    image: ghcr.io/okan-wqm/aquaculture_platform/gateway-api:${TAG:?TAG required}
    container_name: aqua-gateway
    restart: unless-stopped
    environment:
      SERVICE_NAME: gateway-api
      NODE_ENV: production
      GATEWAY_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=384'
      # M-RL-01: Redis-backed rate limiting — prevents multi-replica bypass
      RATE_LIMIT_USE_REDIS: 'true'
      DATABASE_HOST: postgres
      # SSL off — Postgres is on the same Docker bridge (no MITM surface).
      DATABASE_SSL: 'false'
      DATABASE_PORT: 5432
      # SEC-015 (CRITICAL-001): Per-service DB role — gateway_service can only access gateway schema
      DATABASE_USER: ${GATEWAY_SERVICE_DB_USER:-gateway_service}
      DATABASE_PASSWORD: ${GATEWAY_SERVICE_DB_PASS:?GATEWAY_SERVICE_DB_PASS required}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      # SEC-015 (CRITICAL-002): Per-service NATS credentials
      <<: *nats-gateway-env
      JWT_PUBLIC_KEY_PATH: /etc/ssl/jwt/public.pem
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      AUTH_SERVICE_URL: http://auth-service:3000/graphql
      FARM_SERVICE_URL: http://farm-service:3000/graphql
      SENSOR_SERVICE_URL: http://sensor-service:3000/graphql
      ALERT_SERVICE_URL: http://alert-engine:3000/graphql
      HR_SERVICE_URL: http://hr-service:3000/graphql
      BILLING_SERVICE_URL: http://billing-service:3000/graphql
      NOTIFICATION_SERVICE_URL: http://notification-service:3000/graphql
      HYDROPONICS_SERVICE_URL: http://hydroponics-service:3000/graphql
      ADMIN_SERVICE_URL: http://admin-api-service:3000/graphql
      CONFIG_SERVICE_URL: http://config-service:3000/graphql
      MESSAGING_SERVICE_URL: http://messaging-service:3000/graphql
      # ai-service is a REST surface (not an Apollo subgraph) — base URL, no /graphql.
      # The /api/v2/ai proxy (routes/v2/ai.routes.ts) forwards the original path here.
      AI_SERVICE_URL: http://ai-service:3000/graphql
      GATEWAY_COMPOSITION_MAX_RETRIES: ${GATEWAY_COMPOSITION_MAX_RETRIES:-24}
      GATEWAY_COMPOSITION_RETRY_DELAY_MS: ${GATEWAY_COMPOSITION_RETRY_DELAY_MS:-3000}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_USER:?MINIO_USER is required}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-aquaculture}
      MINIO_REGION: us-east-1
      TRUST_PROXY: '1'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      WS_CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      THROTTLE_DEFAULT_LIMIT: 500
      SERVICE_IDENTITY_KEYRING: ${SERVICE_IDENTITY_KEYRING:?SERVICE_IDENTITY_KEYRING required}
      SERVICE_IDENTITY_SIGNING_KID: ${SERVICE_IDENTITY_SIGNING_KID:?SERVICE_IDENTITY_SIGNING_KID required}
      DB_MIGRATE_AUTHORITATIVE: 'true'
      DATABASE_MIGRATIONS_RUN: 'false'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      # WS10: schema state must be at the current version before gateway-api
      # starts. If the migration container fails, the deploy workflow
      # aborts BEFORE this service ever runs.
      db-migrate:
        condition: service_completed_successfully
      # ARCH-GW-002: Subgraph dependencies use service_started because the
      # gateway owns readiness through RetryableIntrospectAndCompose.
      #
      # Composition is fail-closed: if any subgraph never becomes reachable,
      # NestFactory.create() fails before listen(), /health/live never starts
      # responding, and Docker restarts the gateway. There is no degraded
      # supergraph after composition exhaustion.
      auth-service:
        condition: service_started
      farm-service:
        condition: service_started
      sensor-service:
        condition: service_started
      alert-engine:
        condition: service_started
      billing-service:
        condition: service_started
      hr-service:
        condition: service_started
      hydroponics-service:
        condition: service_started
      config-service:
        condition: service_started
      notification-service:
        condition: service_started
      messaging-service:
        condition: service_started
      admin-api-service:
        condition: service_started
      observability-service:
        condition: service_started
    volumes:
      - *nats-ca-mount
      - *nats-gateway-cert-mount
      - *nats-gateway-key-mount
      - *jwt-public-key-mount
    networks:
      - aqua-network
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      # /health/live is pure process liveness (composition is BACKGROUND via
      # BackgroundCompositionManager, reported on /health/ready). It normally
      # answers in <10ms, BUT during the simultaneous cold-boot of ~14 services on
      # the 4-CPU droplet the gateway is CPU-starved and a probe can exceed 10s
      # wall-clock (observed: a probe timed out at ~+70s; the container only went
      # healthy at ~+100s). timeout 30s tolerates that transient starvation; the 60s
      # start_period stops early storm-probes from counting toward `retries` so the
      # container flips healthy on the first real success. Aligned with the gateway's
      # startupBudgetSeconds (120) in the service-catalog SSoT.
      test: ['CMD', 'curl', '-sf', 'http://localhost:3000/health/live']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s

  auth-service:
    logging: *default-logging
    image: ghcr.io/okan-wqm/aquaculture_platform/auth-service:${TAG:?TAG required}
    container_name: aqua-auth
    restart: unless-stopped
    environment:
      SERVICE_NAME: auth-service
      NODE_ENV: production
      AUTH_SERVICE_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=384'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      DATABASE_HOST: postgres
      # SSL off — Postgres is on the same Docker bridge (no MITM surface).
      DATABASE_SSL: 'false'
      DATABASE_PORT: 5432
      # SEC-015 (CRITICAL-001): Per-service DB role — auth_service can only access auth schema
      DATABASE_USER: ${AUTH_SERVICE_DB_USER:-auth_service}
      DATABASE_PASSWORD: ${AUTH_SERVICE_DB_PASS:?AUTH_SERVICE_DB_PASS required}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DB_MIGRATE_AUTHORITATIVE: 'true'
      DATABASE_MIGRATIONS_RUN: 'false'
      DATABASE_LOGGING: 'true'
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      # SEC-015 (CRITICAL-002): Per-service NATS credentials
      <<: *nats-auth-env
      JWT_PRIVATE_KEY_PATH: /etc/ssl/jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /etc/ssl/jwt/public.pem
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@localhost.dev}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD is required}
      # SECURITY (HIGH-006): HMAC password pepper.
      # Defense-in-depth against offline attack on a stolen password DB —
      # even with the full hash set, the attacker must ALSO compromise the
      # droplet filesystem (where .env lives at mode 600, separate blast
      # radius from PostgreSQL) before attempting any of the bcrypt hashes.
      # Generate on a new environment with: `openssl rand -base64 48` and
      # persist to .env on the droplet (NEVER commit .env — deny-listed in
      # .claude/settings.json and .gitignore).
      # Full architectural rationale + lazy-migration flow from legacy
      # unpeppered hashes: libs/backend-common/src/auth/password.util.ts.
      PASSWORD_PEPPER: '${PASSWORD_PEPPER:?PASSWORD_PEPPER is required in production — generate with openssl rand -base64 48 and store in .env on droplet}'
      # MFA encryption key is production-required; auth-service fails closed without it.
      MFA_ENCRYPTION_KEY: '${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required in production — generate with openssl rand -hex 32}'
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-app.suderra.com}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-AquaCulture Platform}
      SERVICE_IDENTITY_KEYRING: ${SERVICE_IDENTITY_KEYRING:?SERVICE_IDENTITY_KEYRING required}
      SERVICE_IDENTITY_SIGNING_KID: ${SERVICE_IDENTITY_SIGNING_KID:?SERVICE_IDENTITY_SIGNING_KID required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      # WS10: ADR-016 Phase E Phase 1 — schema pre-applied by the
      # aqua-db-migrate container; per-service createMigrationRunnerService
      # stays as a safety-net fallback (Phase 1 backward-compat).
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - *nats-ca-mount
      - *nats-auth-cert-mount
      - *nats-auth-key-mount
      - *jwt-private-key-mount
      - *jwt-public-key-mount
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  farm-service:
    logging: *default-logging
    image: ghcr.io/okan-wqm/aquaculture_platform/farm-service:${TAG:?TAG required}
    container_name: aqua-farm
    restart: unless-stopped
    environment:
      SERVICE_NAME: farm-service
      NODE_ENV: production
      FARM_SERVICE_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=256'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      DATABASE_HOST: postgres
      # SSL off — Postgres is on the same Docker bridge (no MITM surface).
      DATABASE_SSL: 'false'
      DATABASE_PORT: 5432
      # SEC-015 (CRITICAL-001): Per-service DB role — farm_service can only access farm schema
      DATABASE_USER: ${FARM_SERVICE_DB_USER:-farm_service}
      DATABASE_PASSWORD: ${FARM_SERVICE_DB_PASS:?FARM_SERVICE_DB_PASS required}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DB_MIGRATE_AUTHORITATIVE: 'true'
      DATABASE_MIGRATIONS_RUN: 'false'
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      # ORPHAN-CRITICAL-065: farm-service uses MinIO for file uploads via
      # FileUploadSecurityService (treatment photos, certificates). Without
      # explicit MINIO_ACCESS_KEY / MINIO_SECRET_KEY the service refuses to
      # start to prevent default-credential security drift.
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_USER:?MINIO_USER is required}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-aquaculture}
      MINIO_REGION: us-east-1
      # SEC-015 (CRITICAL-002): Per-service NATS credentials
      <<: *nats-farm-env
      JWT_PUBLIC_KEY_PATH: /etc/ssl/jwt/public.pem
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      # Legacy provider credentials are decrypted during the blocking startup
      # cutover; all ongoing provider reads come from config-service.
      SENTINEL_HUB_ENCRYPTION_KEY: ${SENTINEL_HUB_ENCRYPTION_KEY:?SENTINEL_HUB_ENCRYPTION_KEY is required during credential cutover}
      FARM_ENVIRONMENT_MONITORING_ENABLED: ${FARM_ENVIRONMENT_MONITORING_ENABLED:-false}
      MET_NORWAY_APPLICATION_NAME: ${MET_NORWAY_APPLICATION_NAME:-}
      MET_NORWAY_CONTACT: ${MET_NORWAY_CONTACT:-}
      MET_NORWAY_FROST_CLIENT_ID: ${MET_NORWAY_FROST_CLIENT_ID:-}
