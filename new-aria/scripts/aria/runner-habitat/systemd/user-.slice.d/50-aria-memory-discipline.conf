# Interactive-session memory discipline on the ARIA runner host (ARIA-HIGH-034).
#
# Installed by scripts/aria/provision_runner.sh to
#   /etc/systemd/system/user-.slice.d/50-aria-memory-discipline.conf
# (a template drop-in: applies to every user-<uid>.slice) and drift-checked
# byte-for-byte on every run. Edit HERE, not on the host.
#
# WHY: the droplet hosts the production stack, the ARIA runner and the
# operator's interactive agent CLIs (claude / codex / zcode sessions, plus
# the nx daemons they leave behind in worktrees). On 2026-09-01/02 those
# sessions held ~3.2 GiB with 223 MiB free system-wide; the kernel's global
# OOM killer then chose the runner's 22 MB cycle process (oom_score_adj=500,
# set by the runner itself) — ARIA died for memory it was not using.
#
# WHAT: interactive sessions get their own budget. Past MemoryHigh the
# slice is throttled and reclaimed (swapped) before anything else suffers;
# at MemoryMax the cgroup OOM killer acts INSIDE the slice — on the largest
# session process — so a runaway agent CLI can no longer push the whole
# machine into a global OOM. The budget is deliberately below the runner's
# 3 GiB cap: the platform and the producer lane outrank a terminal.
[Slice]
MemoryHigh=2816M
MemoryMax=3G
