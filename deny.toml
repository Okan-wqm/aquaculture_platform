[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Each ignored advisory MUST carry: (a) a tracking finding id, (b) an
# explicit owner, (c) a deadline, (d) the threat-model justification.
# Anything that cannot satisfy all four belongs in the build, not in
# this list. Ignores are reviewed at every quarterly security audit.
#
# RUSTSEC-2026-0098 / RUSTSEC-2026-0099 — rustls-webpki 0.102.8 wildcard
#   cert name-constraint validation bugs.
#   Reachable via: rumqttc 0.25.1 -> rustls-webpki 0.102.8.
#   Upstream blocker: rumqttc master (commit 2167da05a66) still pins
#     rustls-webpki = "0.102.8" — bumping it requires an upstream PR
#     (https://github.com/bytebeamio/rumqtt) and a release. async-nats
#     0.47 is already on rustls-webpki 0.103.12, so the workspace
#     resolves both versions side-by-side; only the rumqttc-fed
#     instance is vulnerable.
#   Threat model justification: the CVEs allow a misissued certificate
#     with permitted-subtree name constraints to validate when it
#     should not. Our MQTT connection trusts the platform's internal
#     PKI (we issue every cert), not a public CA. An attacker would
#     have to compromise the platform CA to mint such a cert — at
#     which point this CVE is the least of our problems.
#   Tracking: docs/reviews/_registry/findings.jsonl  RUST-CVE-001 (HIGH)
#   Owner: Okan-Wqm
#   Deadline: 2026-06-30 (re-evaluate when rumqttc cuts a release with
#     bumped webpki, OR fork rumqttc to crates/local-rumqttc, OR move
#     to mqtt-async-client / paho-mqtt-rs alternative).
ignore = [
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    # RUSTSEC-2026-0049 — rustls-webpki CRL Distribution Point matching
    #   bug. Same upstream blocker (rumqttc 0.25.1 -> webpki 0.102.8).
    #   Same threat model justification: we trust the platform PKI, we
    #   do not consume third-party CRLs in the MQTT path. Covered by
    #   the same finding RUST-CVE-001.
    "RUSTSEC-2026-0049",
    # RUSTSEC-2025-0134 — rustls-pemfile unmaintained advisory.
    #   Same upstream chain: rumqttc 0.25.1 pins
    #   rustls-pemfile = "2.2.0", reported unmaintained. Not a
    #   vulnerability, just an unmaintained notice. Same finding
    #   RUST-CVE-001 covers the replacement strategy.
    "RUSTSEC-2025-0134",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
# Workspace members carry `license = "Proprietary"` (publish = false, first-
# party). "Proprietary" is not a valid SPDX identifier, so cargo-deny would
# otherwise flag them as unlicensed. private.ignore tells cargo-deny to skip
# license enforcement for crates that are workspace-private — exactly the
# semantic we want. Third-party deps still go through the SPDX allow list above.
private = { ignore = true }

[[licenses.exceptions]]
allow = ["OpenSSL"]
name = "ring"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# OpenSSL banned platform-wide — rustls only (matches sens-api-gateway policy).
# In-process cert handling: use rustls + x509-parser + pem.
# Dependency bypasses go through ADR amendment, not deny.toml exceptions.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
