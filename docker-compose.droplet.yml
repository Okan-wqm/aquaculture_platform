      SERVICE_IDENTITY_SIGNING_KID: ${SERVICE_IDENTITY_SIGNING_KID:?SERVICE_IDENTITY_SIGNING_KID required}
      # ADR-022 control / data plane separation. Default `legacy`
      # keeps the existing NestJS MQTT subscriber + per-sensor data
      # collection running. Set to `control-plane` once the Rust
      # ingestion sidecar (ADR-025) is live for every tenant — at
      # which point this service becomes pure control plane and the
      # operator can tighten the resource limits below to the budget
      # in ADR-022 § Bütçe (192 MB / 0.2 vCPU).
      SENSOR_SERVICE_PROFILE: ${SENSOR_SERVICE_PROFILE:-legacy}
