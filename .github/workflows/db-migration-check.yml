name: Database Migration Check

# SEC-CI-015: Replaced entirely. Previous workflow used Alembic/Python/SQLAlchemy/Flask
# which do not exist in this TypeScript/TypeORM project. This workflow now validates
# TypeORM migrations and Flyway SQL migration files that actually exist in the repo.
# SEC-CI-002: All third-party actions pinned to full commit SHAs

on:
  pull_request:
    paths:
      - 'apps/*/src/database/migrations/**'
      - 'database/migrations/**'
      - 'apps/*/src/**/*.entity.ts'
      - '.github/workflows/db-migration-check.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/*/src/database/migrations/**'
      - 'database/migrations/**'

jobs:
  typeorm-migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aquaculture_migration_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        # SEC-CI-002: pinned to SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit

      - name: Build gateway-api (needed for data-source)
        run: npx nx build gateway-api
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Run TypeORM migrations
        run: |
          npx typeorm migration:run -d dist/apps/gateway-api/src/data-source.js
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aquaculture_migration_test
          NODE_ENV: test

      - name: Validate TypeORM schema
        run: |
          npx typeorm schema:validate -d dist/apps/gateway-api/src/data-source.js
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aquaculture_migration_test
          NODE_ENV: test

      - name: Check for pending migrations (diff between entity models and DB schema)
        run: |
          # Check if there are entity changes not covered by a migration
          PENDING=$(npx typeorm migration:generate /tmp/check-migration -d dist/apps/gateway-api/src/data-source.js --check 2>&1 || true)
          if echo "$PENDING" | grep -q "No changes in database schema"; then
            echo "Schema is in sync with migrations."
          else
            echo "::warning::Possible un-migrated entity changes detected. Run 'typeorm migration:generate' to create a migration."
            echo "$PENDING"
          fi
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aquaculture_migration_test
          NODE_ENV: test

  flyway-sql-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aquaculture_flyway_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        # SEC-CI-002: pinned to SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check if SQL migration files exist
        id: check-sql
        run: |
          if [ -d "database/migrations" ] && find database/migrations -name "*.sql" | grep -q .; then
            echo "has_sql=true" >> $GITHUB_OUTPUT
          else
            echo "has_sql=false" >> $GITHUB_OUTPUT
            echo "No SQL migration files found in database/migrations/ — skipping Flyway check."
          fi

      - name: Validate SQL migration files (naming convention)
        if: steps.check-sql.outputs.has_sql == 'true'
        run: |
          INVALID=0
          for f in database/migrations/**/*.sql; do
            basename=$(basename "$f")
            # Flyway naming convention: V<version>__<description>.sql
            if ! echo "$basename" | grep -qE '^V[0-9]+__[a-zA-Z0-9_]+\.sql$'; then
              echo "::error::Invalid migration filename: $f (expected V<version>__<description>.sql)"
              INVALID=1
            fi
          done
          if [ "$INVALID" -eq 1 ]; then
            exit 1
          fi
          echo "All SQL migration files follow Flyway naming convention."

      - name: Run Flyway validate
        if: steps.check-sql.outputs.has_sql == 'true'
        run: |
          docker run --rm --network host \
            -v "$PWD/database/migrations:/flyway/sql" \
            flyway/flyway:10 \
            -url="jdbc:postgresql://localhost:5432/aquaculture_flyway_test" \
            -user=postgres \
            -password=postgres \
            validate
