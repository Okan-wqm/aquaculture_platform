  # Dedicated CN: admin erasure proofs and tenant lifecycle operations cannot
  # be forged by the public gateway runtime.
  NATS_TLS_CERT: /etc/ssl/nats-clients/admin_api_service-cert.pem
  NATS_TLS_KEY: /etc/ssl/nats-clients/admin_api_service-key.pem
  NATS_TLS_ENABLED: 'true'

x-nats-notification-env: &nats-notification-env
