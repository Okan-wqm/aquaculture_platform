# =============================================================================
# CronJob — pg-backup
# =============================================================================
#
# INFRA-BACKUP-003: Kubernetes-native equivalent of the GitHub Actions
# workflow .github/workflows/backup-production.yml. Shelf-ready; takes
# effect only once the droplet's local Postgres is retired and the
# platform runs against managed Postgres (RDS) on the EKS cluster.
#
# Why a dedicated ServiceAccount:
#   - Binds the CronJob to the IRSA role that grants write access to the
#     DigitalOcean Spaces / S3 backup bucket and (via the same
#     secrets-manager IAM policy) pulls the Postgres credentials.
#   - Without IRSA we would embed AWS access keys in a Secret — exactly
#     the anti-pattern INFRA-SECRETS-002 eliminates elsewhere in this
#     initiative.
#
# Why a ConfigMap for the script:
#   - The same backup-databases.sh is run by the GHA workflow (droplet
#     path). Duplicating it inline in this manifest creates two drift
#     surfaces. The ConfigMap is generated by the Kustomize overlay from
#     the checked-in script file (see kustomization note below).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pg-backup
  namespace: aquaculture
  annotations:
    # SHELF-READY: replace with the actual IRSA role ARN during the K8s
    # migration. Keep the key — ArgoCD's selfHeal will reconcile a literal
    # placeholder back onto the cluster, which is the desired behaviour
    # until the real ARN is wired.
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/aquaculture-pg-backup"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: aquaculture
  labels:
    app.kubernetes.io/name: pg-backup
    app.kubernetes.io/part-of: aquaculture-platform
spec:
  # 03:00 UTC daily. Matches the GHA schedule so operators see the same
  # cadence regardless of which path is active.
  schedule: "0 3 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 600

  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800  # 30 min — an overrunning backup is a problem, not something to keep retrying
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pg-backup
            app.kubernetes.io/part-of: aquaculture-platform
        spec:
          serviceAccountName: pg-backup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              # Vendor-pinned image: contains psql client + aws CLI v2 + gpg.
              # Replace with a platform-owned image during migration — the
              # public image is fine for the drill phase.
              image: ghcr.io/aquaculture-platform/pg-backup:1.0.0
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command: ["/bin/bash", "/scripts/backup-databases.sh"]
              env:
                # Postgres endpoint (RDS in the K8s path)
                - name: POSTGRES_HOST
                  valueFrom:
                    secretKeyRef:
                      name: pg-backup-credentials
                      key: host
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: pg-backup-credentials
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: pg-backup-credentials
                      key: password
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: pg-backup-credentials
                      key: database
                # Object storage — Spaces today, S3 after migration. No
                # AWS access keys (IRSA). Spaces path keeps keys in a
                # Secret populated by ExternalSecret.
                - name: SPACES_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: pg-backup-config
                      key: bucket
                - name: SPACES_ENDPOINT
                  valueFrom:
                    configMapKeyRef:
                      name: pg-backup-config
                      key: endpoint
                - name: BACKUP_PREFIX
                  value: "pg-backups"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: pg-backup-scripts
                defaultMode: 0555
            - name: tmp
              emptyDir:
                sizeLimit: 4Gi
---
# The CronJob consumes backup-databases.sh through this ConfigMap.
# Generate the ConfigMap from the actual script file via a kustomize
# configMapGenerator entry so there is a single source of truth and the
# script never diverges between the droplet (A1 / GHA) path and this
# CronJob path. Example addition for the relevant kustomization overlay:
#
#   configMapGenerator:
#     - name: pg-backup-scripts
#       files:
#         - tools/scripts/database/backup-databases.sh
#
# The body below is an empty-data safety net so kubectl apply of this
# single manifest does not fail before the overlay is wired.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-backup-config
  namespace: aquaculture
data:
  bucket: "REPLACE_ME_BUCKET_NAME"
  endpoint: "https://fra1.digitaloceanspaces.com"
