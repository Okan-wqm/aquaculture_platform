  billing-service:
    logging: *default-logging
    image: ghcr.io/okan-wqm/aquaculture_platform/billing-service:${TAG:?TAG required}
    container_name: aqua-billing
    restart: unless-stopped
    environment:
      SERVICE_NAME: billing-service
      NODE_ENV: production
      BILLING_SERVICE_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=256'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      DATABASE_HOST: postgres
      # SSL off — Postgres is on the same Docker bridge (no MITM surface).
      DATABASE_SSL: 'false'
      DATABASE_PORT: 5432
      # SEC-015 (CRITICAL-001): Per-service DB role — billing_service can only access billing schema
      DATABASE_USER: ${BILLING_SERVICE_DB_USER:-billing_service}
      DATABASE_PASSWORD: ${BILLING_SERVICE_DB_PASS:?BILLING_SERVICE_DB_PASS required}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      # ADR-016/031: production schema DDL belongs to aqua-db-migrate.
      # Keep this as a real container env var, not only a .env value, because
      # AppModule import-time wiring decides whether runtime DDL providers are registered.
      DB_MIGRATE_AUTHORITATIVE: 'true'
      DATABASE_MIGRATIONS_RUN: 'false'
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      # SEC-015 (CRITICAL-002): Per-service NATS credentials
      <<: *nats-billing-env
      JWT_PUBLIC_KEY_PATH: /etc/ssl/jwt/public.pem
      SERVICE_IDENTITY_KEYRING: ${SERVICE_IDENTITY_KEYRING:?SERVICE_IDENTITY_KEYRING required}
      SERVICE_IDENTITY_SIGNING_KID: ${SERVICE_IDENTITY_SIGNING_KID:?SERVICE_IDENTITY_SIGNING_KID required}
      # Stripe — gated by the STRIPE_BILLING_ENABLED SSoT flag
      # (libs/backend-common/src/billing/stripe-client.factory.ts). ONE switch
      # reconciles two historically conflicting contracts:
      #   - 2026-04-14 graceful-boot: billing MUST boot on a droplet with no
      #     Stripe credential (the webhook controller independently fails closed —
      #     rejects every webhook 400 when STRIPE_WEBHOOK_SECRET is missing).
      #   - PR #640 fail-closed: a deployment that CLAIMS to bill must not start
      #     mis-wired.
      # The flag separates intent ("is Stripe on here?") from config ("is the key
      # present?"):
      #   STRIPE_BILLING_ENABLED unset/false (DEFAULT) → the factory binds a
      #     disabled client; the service BOOTS; outbound Stripe calls fail closed
      #     at REQUEST time (StripeNotConfiguredError). This is the droplet today.
      #   STRIPE_BILLING_ENABLED=true + STRIPE_SECRET_KEY present → real client.
      #   STRIPE_BILLING_ENABLED=true + STRIPE_SECRET_KEY missing → boot fails
      #     closed by design.
      # To turn billing on: set STRIPE_BILLING_ENABLED=true AND STRIPE_SECRET_KEY
      # together (see docs/runbooks/secret-rotation.md). STRIPE_SECRET_KEY is the
      # canonical name read by the factory + PLATFORM_SECRET_ENV_VARS (was wrongly
      # injected as STRIPE_API_KEY here, which the factory never reads → the boot
      # crash this fixes). STRIPE_BILLING_ENABLED is a non-secret intent flag.
      # BILLING_PROVIDER is the explicit provider switch (factory SSoT):
      #   mock (DEFAULT here) → a functional local MockBillingProvider: no outbound
      #     Stripe, no key, local subscriptions/receipts. Correct for the
      #     test/demo tenants on this droplet — billing WORKS instead of throwing.
      #   stripe → the real adapter; a paying deployment MUST set this explicitly
      #     AND provide STRIPE_SECRET_KEY (missing key then fails closed at boot).
      # Defaulting to mock keeps a demo droplet self-healing and NEVER makes a real
      # charge; flipping to stripe is a deliberate, key-bearing act.
      BILLING_PROVIDER: ${BILLING_PROVIDER:-mock}
      STRIPE_BILLING_ENABLED: ${STRIPE_BILLING_ENABLED:-false}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      # WS10: ADR-016 Phase E Phase 1 — schema pre-applied by aqua-db-migrate.
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - *nats-ca-mount
      - *nats-billing-cert-mount
      - *nats-billing-key-mount
      - *jwt-public-key-mount
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
