# =============================================================================
# NATS Server Configuration - Aquaculture Platform
# ARCH-010: Explicit JetStream stream limits to prevent silent message drops
# =============================================================================

# JetStream configuration
jetstream {
  store_dir: /data
  max_memory_store: 96MB
  max_file_store: 2GB
}

# HTTP monitoring endpoint (internal only)
http_port: 8222

# Logging
logtime: true

# =============================================================================
# SEC-006/SEC-019/CRITICAL-002: Per-Service NATS Authorization
#
# Each service has its own user with subject-level publish/subscribe ACLs.
# A compromised service can only access the subjects its user permits.
# Credentials injected via environment variables on NATS container.
# =============================================================================
authorization {
  timeout: 5
  users: [
    # ── auth-service ──
    {
      user: $NATS_AUTH_USER, password: $NATS_AUTH_PASS,
      permissions: {
        publish: {
          allow: [
            "AQUACULTURE_EVENTS.UserRegistered.>",
            "AQUACULTURE_EVENTS.UserLoggedIn.>",
            "AQUACULTURE_EVENTS.InvitationAccepted.>",
            "AQUACULTURE_EVENTS.PasswordResetRequested.>",
            "AQUACULTURE_EVENTS.PasswordResetCompleted.>",
            "AQUACULTURE_EVENTS.TenantCreated.>",
            "AQUACULTURE_EVENTS.TenantUpdated.>",
            "AQUACULTURE_EVENTS.TenantSuspended.>",
            "AQUACULTURE_EVENTS.TenantActivated.>",
            "AQUACULTURE_EVENTS.TenantStatusChanged.>",
            "AQUACULTURE_EVENTS.TenantModulesAssigned.>",
            "AQUACULTURE_EVENTS.UserInvited.>",
            "$JS.API.>", "_INBOX.>"
          ]
        }
        subscribe: { allow: ["AQUACULTURE_EVENTS.>", "$JS.API.>", "_INBOX.>"] }
      }
    },
    # ── farm-service ──
    {
      user: $NATS_FARM_USER, password: $NATS_FARM_PASS,
      permissions: {
        publish: {
          allow: [
            "AQUACULTURE_EVENTS.BatchCreated.>", "AQUACULTURE_EVENTS.BatchUpdated.>",
            "AQUACULTURE_EVENTS.BatchHarvested.>", "AQUACULTURE_EVENTS.FeedingCompleted.>",
            "AQUACULTURE_EVENTS.WaterQualityRecorded.>", "AQUACULTURE_EVENTS.Farm*.>",
            "$JS.API.>", "_INBOX.>"
          ]
        }
        subscribe: { allow: ["AQUACULTURE_EVENTS.>", "$JS.API.>", "_INBOX.>"] }
      }
    },
    # ── sensor-service ──
    {
      user: $NATS_SENSOR_USER, password: $NATS_SENSOR_PASS,
      permissions: {
        publish: {
          allow: [
            "AQUACULTURE_EVENTS.SensorReading.>", "AQUACULTURE_EVENTS.Sensor*.>",
            "AQUACULTURE_EVENTS.DeviceProvisioned.>",
            "$JS.API.>", "_INBOX.>"
          ]
        }
        subscribe: { allow: ["AQUACULTURE_EVENTS.>", "$JS.API.>", "_INBOX.>"] }
      }
    },
    # ── gateway-api ──
    {
      user: $NATS_GATEWAY_USER, password: $NATS_GATEWAY_PASS,
      permissions: {
        publish: { allow: ["AQUACULTURE_EVENTS.Gateway*.>", "$JS.API.>", "_INBOX.>"] }
        subscribe: { allow: ["AQUACULTURE_EVENTS.>", "$JS.API.>", "_INBOX.>"] }
      }
    },
    # ── notification-service ──
    {
      user: $NATS_NOTIFICATION_USER, password: $NATS_NOTIFICATION_PASS,
      permissions: {
        publish: {
          allow: [
            "AQUACULTURE_EVENTS.NotificationSent.>", "AQUACULTURE_EVENTS.NotificationDelivered.>",
            "AQUACULTURE_EVENTS.NotificationFailed.>",
            "$JS.API.>", "_INBOX.>"
          ]
        }
        subscribe: {
          allow: [
            "AQUACULTURE_EVENTS.PasswordResetRequested.>", "AQUACULTURE_EVENTS.UserInvited.>",
            "AQUACULTURE_EVENTS.Notification*.>",
            "$JS.API.>", "_INBOX.>"
          ]
        }
      }
    },
    # ── billing-service ──
    {
      user: $NATS_BILLING_USER, password: $NATS_BILLING_PASS,
      permissions: {
        publish: {
          allow: [
            "AQUACULTURE_EVENTS.Subscription*.>", "AQUACULTURE_EVENTS.Invoice*.>",
            "AQUACULTURE_EVENTS.Payment*.>",
            "$JS.API.>", "_INBOX.>"
          ]
        }
        subscribe: {
          allow: [
            "AQUACULTURE_EVENTS.TenantCreated.>", "AQUACULTURE_EVENTS.TenantStatusChanged.>",
            "AQUACULTURE_EVENTS.Subscription*.>", "AQUACULTURE_EVENTS.Invoice*.>",
            "AQUACULTURE_EVENTS.Payment*.>",
            "$JS.API.>", "_INBOX.>"
          ]
        }
      }
    },
    # ── alert-engine ──
    {
      user: $NATS_ALERT_USER, password: $NATS_ALERT_PASS,
      permissions: {
        publish: { allow: ["AQUACULTURE_EVENTS.Alert*.>", "$JS.API.>", "_INBOX.>"] }
        subscribe: {
          allow: ["AQUACULTURE_EVENTS.SensorReading.>", "AQUACULTURE_EVENTS.Alert*.>", "$JS.API.>", "_INBOX.>"]
        }
      }
    },
    # ── hr-service ──
    {
      user: $NATS_HR_USER, password: $NATS_HR_PASS,
      permissions: {
        publish: {
          allow: [
            "AQUACULTURE_EVENTS.Employee*.>", "AQUACULTURE_EVENTS.Leave*.>",
            "AQUACULTURE_EVENTS.Attendance*.>",
            "$JS.API.>", "_INBOX.>"
          ]
        }
        subscribe: { allow: ["AQUACULTURE_EVENTS.>", "$JS.API.>", "_INBOX.>"] }
      }
    },
    # ── messaging-service ──
    {
      user: $NATS_MESSAGING_USER, password: $NATS_MESSAGING_PASS,
      permissions: {
        publish: {
          allow: ["AQUACULTURE_EVENTS.Message*.>", "AQUACULTURE_EVENTS.Channel*.>", "$JS.API.>", "_INBOX.>"]
        }
        subscribe: { allow: ["AQUACULTURE_EVENTS.>", "$JS.API.>", "_INBOX.>"] }
      }
    },
    # ── hydroponics-service ──
    {
      user: $NATS_HYDROPONICS_USER, password: $NATS_HYDROPONICS_PASS,
      permissions: {
        publish: {
          allow: ["AQUACULTURE_EVENTS.Hydroponics*.>", "AQUACULTURE_EVENTS.GrowCycle*.>", "$JS.API.>", "_INBOX.>"]
        }
        subscribe: { allow: ["AQUACULTURE_EVENTS.>", "$JS.API.>", "_INBOX.>"] }
      }
    },
    # ── legacy/shared fallback (migration period) ──
    {
      user: $NATS_USER, password: $NATS_PASS,
      permissions: {
        publish: { allow: ["AQUACULTURE_EVENTS.>", "$JS.API.>", "_INBOX.>"] }
        subscribe: { allow: ["AQUACULTURE_EVENTS.>", "$JS.API.>", "_INBOX.>"] }
      }
    }
  ]
}

# IP-1: TLS configuration — included from a separate file so it can be
# conditionally mounted (dev: no file, prod: nats-tls-enabled.conf mounted).
# WHY relative path: NATS resolves `include` paths relative to the config
# file's directory (/etc/nats/), so absolute paths get double-prefixed
# (e.g. /etc/nats/ + /etc/nats/nats-tls.conf → /etc/nats/etc/nats/...).
include nats-tls.conf
