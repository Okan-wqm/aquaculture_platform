# =============================================================================
# ClusterSecretStore — aws-secrets-manager
# =============================================================================
#
# INFRA-SECRETS-002: binds the External Secrets Operator controller to AWS
# Secrets Manager for the whole cluster. Referenced by every ExternalSecret
# rendered from the Helm chart's templates/secrets.yaml — specifically
# `spec.secretStoreRef.name: aws-secrets-manager` in
# infrastructure/helm/aquaculture/values-production.yaml:108.
#
# Authentication: IRSA only. The ESO controller's service account
# (external-secrets-operator in the external-secrets namespace) must carry
# an AWS IAM role ARN annotation that grants:
#   - secretsmanager:GetSecretValue
#   - secretsmanager:DescribeSecret
# on every ARN emitted by the Terraform module at
# infrastructure/terraform/modules/secrets-manager/outputs.tf:secret_arns.
#
# No static AWS access keys. A compromised ESO pod has the role's scope,
# not a long-lived credential.
#
# This CRD lives outside any Helm chart so the manifest is unambiguous in
# the Kustomize base — templating it inside the aquaculture chart would
# make it tenant-scoped, which ClusterSecretStore cannot be.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/part-of: aquaculture-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-operator
            namespace: external-secrets
  # The default refresh interval on ExternalSecret resources is 1h
  # (values-production.yaml:111). Individual ExternalSecret resources can
  # lower this during an incident (Helm value: externalSecrets.refreshInterval).
  retrySettings:
    maxRetries: 5
    retryInterval: 30s
