      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
          - 8222:8222
        options: >-
          --health-cmd "nats-server --version"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      # The restored .npm-cache can carry a torn _cacache tmp entry, and npm's
      # extraction then dies with EEXIST/ENOENT rename races (observed twice on
      # 2026-08-11: runs 31493430731, 31499733901). One purge of the cache's
      # tmp area + a single retry converts that recurring red into a footnote;
      # a second failure is a real problem and still fails the job.
      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if ! npm ci --ignore-scripts --no-audit; then
            echo "npm ci failed once; purging torn cacache tmp entries and retrying" >&2
            rm -rf .npm-cache/_cacache/tmp
            npm cache verify --cache .npm-cache >/dev/null 2>&1 || true
            npm ci --ignore-scripts --no-audit
          fi
      - name: Run sensor enterprise gate fixtures
        run: >
          npx jest --config apps/sensor-service/jest.config.ts --runInBand
          --forceExit
          apps/sensor-service/src/edge-device/__tests__/agent-io-config-v2.spec.ts
          apps/sensor-service/src/edge-device/__tests__/edge-device.resolver.permissions.spec.ts
          apps/sensor-service/src/ingestion/__tests__/mqtt-listener.service.spec.ts

  sens-api-gateway-rust:
    needs: [install, detect-changes]
    if: needs.detect-changes.outputs.rust_checks_required == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
          - 8222:8222
        options: >-
          --health-cmd "nats-server --version"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.88.0
      - name: Install cargo-audit (precompiled)
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-audit
      - name: Audit root lockfile
        run: cargo audit --deny warnings
      - name: Audit gateway lockfile
        working-directory: sens-api-gateway
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2023-0089 \
            --ignore RUSTSEC-2026-0173 \
            --ignore RUSTSEC-2024-0436
      - name: Audit fuzz lockfile
        working-directory: sens-api-gateway
        run: cargo audit --file fuzz/Cargo.lock
      - name: Audit alarm-core WASM lockfile
        run: cargo audit --file crates/alarm-core-wasm/Cargo.lock --deny warnings
      - name: Audit protocol-codec WASM lockfile
        run: cargo audit --file crates/protocol-codec-wasm/Cargo.lock --deny warnings
      - name: Install TPM build dependencies
        uses: ./.github/actions/install-tpm-build-dependencies
      - name: Cargo check locked curated CI features
        working-directory: sens-api-gateway
        run: cargo check --locked --release --all-targets --features "$SENS_API_GATEWAY_CI_FEATURES"

  sens-enterprise-validation:
    needs: [install, detect-changes]
    if: needs.detect-changes.outputs.sensor_checks_required == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
          - 8222:8222
        options: >-
          --health-cmd "nats-server --version"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      # The restored .npm-cache can carry a torn _cacache tmp entry, and npm's
      # extraction then dies with EEXIST/ENOENT rename races (observed twice on
      # 2026-08-11: runs 31493430731, 31499733901). One purge of the cache's
      # tmp area + a single retry converts that recurring red into a footnote;
      # a second failure is a real problem and still fails the job.
      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if ! npm ci --ignore-scripts --no-audit; then
            echo "npm ci failed once; purging torn cacache tmp entries and retrying" >&2
            rm -rf .npm-cache/_cacache/tmp
            npm cache verify --cache .npm-cache >/dev/null 2>&1 || true
            npm ci --ignore-scripts --no-audit
          fi
      - name: Run Sens enterprise validation
        run: npm run gates:sens-enterprise-validation
      - name: Upload Sens enterprise validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sens-enterprise-validation-${{ github.run_number }}
          path: artifacts/sens-enterprise-validation/**
          if-no-files-found: error
          retention-days: 14

  sens-enterprise-summary:
    needs:
      - detect-changes
      - install
      - lint
      - type-check
      - test
      - sensor-service-gates
      - sens-api-gateway-rust
      - sens-enterprise-validation
      - build
    if: always()
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
          - 8222:8222
        options: >-
          --health-cmd "nats-server --version"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    timeout-minutes: 5
    steps:
      - name: Fail on skipped, cancelled or failed Sens dependencies
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            exit 0
          fi
          if [ "${{ needs.detect-changes.outputs.has_changes }}" != "true" ]; then
            exit 0
          fi
          for result in \
            "${{ needs.install.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.type-check.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.build.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Core Sens dependency did not succeed: $result"
              exit 1
            fi
          done
          for result in \
            "${{ needs.sensor-service-gates.result }}" \
            "${{ needs.sens-api-gateway-rust.result }}" \
            "${{ needs.sens-enterprise-validation.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Specialist Sens dependency failed: $result"
              exit 1
            fi
          done

  merge-gate:
    needs:
      - detect-changes
      - install
      - lint
      - type-check
      - test
      - build
      - pre-flight
      - infra-image-build-check
      - security-audit
      - farm-water-chemistry-e2e
      - sensor-service-gates
      - sens-api-gateway-rust
      - sens-enterprise-validation
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
          - 8222:8222
        options: >-
          --health-cmd "nats-server --version"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    timeout-minutes: 2
    steps:
      - name: Assert required PR checks
        run: |
          set -euo pipefail
          if [ "${{ needs.detect-changes.result }}" != "success" ]; then
            echo "::error::detect-changes did not succeed"
            exit 1
          fi
          if [ "${{ needs.detect-changes.outputs.has_changes }}" != "true" ]; then
            echo "No affected code/deploy changes; merge gate passes."
            exit 0
          fi
          for entry in \
            "install:${{ needs.install.result }}" \
            "lint:${{ needs.lint.result }}" \
            "type-check:${{ needs.type-check.result }}" \
            "test:${{ needs.test.result }}" \
            "build:${{ needs.build.result }}" \
            "pre-flight:${{ needs.pre-flight.result }}" \
            "infra-image-build-check:${{ needs.infra-image-build-check.result }}" \
            "security-audit:${{ needs.security-audit.result }}" \
            "farm-water-chemistry-e2e:${{ needs.farm-water-chemistry-e2e.result }}" \
            "sensor-service-gates:${{ needs.sensor-service-gates.result }}" \
            "sens-api-gateway-rust:${{ needs.sens-api-gateway-rust.result }}" \
            "sens-enterprise-validation:${{ needs.sens-enterprise-validation.result }}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              echo "::error::${name} result=${result}"
              exit 1
            fi
          done
          echo "Merge gate passed."

  build-status:
    name: build-status
    needs:
      - detect-changes
      - install
      - lint
      - type-check
      - test
      - build
      - schema-validation
      - pre-flight
      - infra-image-build-check
      - security-audit
      - docs-check
      - farm-water-chemistry-e2e
      - sensor-service-gates
      - sens-api-gateway-rust
      - sens-enterprise-validation
      - sens-enterprise-summary
      - merge-gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert affected validation status
        run: |
          set -euo pipefail
          if [ "${{ needs.detect-changes.result }}" != "success" ]; then
            echo "::error::Affected range resolution failed."
            exit 1
          fi

          for entry in \
            "schema-validation:${{ needs.schema-validation.result }}" \
            "pre-flight:${{ needs.pre-flight.result }}" \
            "infra-image-build-check:${{ needs.infra-image-build-check.result }}" \
            "security-audit:${{ needs.security-audit.result }}" \
            "docs-check:${{ needs.docs-check.result }}" \
            "farm-water-chemistry-e2e:${{ needs.farm-water-chemistry-e2e.result }}" \
            "sensor-service-gates:${{ needs.sensor-service-gates.result }}" \
            "sens-api-gateway-rust:${{ needs.sens-api-gateway-rust.result }}" \
            "sens-enterprise-validation:${{ needs.sens-enterprise-validation.result }}" \
            "sens-enterprise-summary:${{ needs.sens-enterprise-summary.result }}" \
            "merge-gate:${{ needs.merge-gate.result }}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::${name} result=${result}"
              exit 1
            fi
          done

          if [ "${{ needs.detect-changes.outputs.has_changes }}" = "true" ]; then
            for entry in \
              "install:${{ needs.install.result }}" \
              "lint:${{ needs.lint.result }}" \
              "type-check:${{ needs.type-check.result }}" \
              "test:${{ needs.test.result }}" \
              "build:${{ needs.build.result }}"; do
              name="${entry%%:*}"
              result="${entry##*:}"
              if [ "$result" != "success" ]; then
                echo "::error::${name} result=${result}"
                exit 1
              fi
            done
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            [ "${{ needs.merge-gate.result }}" = "success" ]
            [ "${{ needs.sens-enterprise-summary.result }}" = "success" ]
            if [ "${{ needs.detect-changes.outputs.has_changes }}" = "true" ]; then
              [ "${{ needs.schema-validation.result }}" = "success" ]
            fi
          fi
          echo "Affected validation passed for ${{ needs.detect-changes.outputs.base_sha }}..${{ needs.detect-changes.outputs.head_sha }}"
