# =============================================================================
# Aquaculture Platform - Helm Chart
# =============================================================================
apiVersion: v2
name: aquaculture
description: A Helm chart for Aquaculture Platform - Multi-tenant aquaculture management system
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - aquaculture
  - microservices
  - multi-tenant
  - iot
  - sensors

home: https://github.com/aquaculture-platform/aquaculture-platform
sources:
  - https://github.com/aquaculture-platform/aquaculture-platform

maintainers:
  - name: Aquaculture Team
    email: team@aquaculture.io

dependencies:
  # Pin to exact versions — do not use ranges for stateful dependencies.
  # Update deliberately via `helm dependency update` after integration testing.
  - name: postgresql
    version: "13.4.2"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "18.6.2"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: nats
    version: "1.2.5"
    repository: "https://nats-io.github.io/k8s/helm/charts/"
    condition: nats.enabled
