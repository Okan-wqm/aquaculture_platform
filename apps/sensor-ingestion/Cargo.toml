[package]
name = "sensor-ingestion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Rust sidecar for the sensor-service ingestion hot path. MQTT subscribe -> protocol-codec parse -> tenant-scoped validate -> TimescaleDB COPY -> NATS event publish. Per-tenant feature-flag rollout per ADR-025."

[[bin]]
name = "sensor-ingestion"
path = "src/main.rs"

[dependencies]
# Workspace crates the binary wires together. Dual-spec (path + version) so:
#   - local builds resolve via path (fast edit-compile loop)
#   - cargo-deny's `wildcards = "deny"` gate passes (version constraint present)
#   - `publish = false` keeps these workspace-internal (version is a cargo-deny
#     satisfaction requirement, never a registry pin).
protocol-codec = { path = "../../crates/protocol-codec", version = "0.1.0" }
tenant-context = { path = "../../crates/tenant-context", version = "0.1.0" }
nats-client = { path = "../../crates/nats-client", version = "0.1.0" }
observability = { path = "../../crates/observability", version = "0.1.0" }
event-contracts-rs = { path = "../../crates/event-contracts-rs", version = "0.1.0" }
# ADR-029 Transactional Outbox — integrates at the write_tenant_batch
# transaction boundary so every SensorReading COPY writes its
# corresponding SensorMetricIngested event atomically. A separate
# OutboxDispatcher task claims pending rows + publishes to NATS.
outbox-rs = { path = "../../crates/outbox-rs", version = "0.1.0" }

# Async runtime + IO.
tokio = { workspace = true, features = ["full"] }
tokio-util = "0.7"
futures = { workspace = true }
bytes = { workspace = true }

# Config + serde.
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

# Identity + time.
uuid = { workspace = true }
chrono = { workspace = true }

# MQTT — same crate the edge agent uses (rumqttc 0.25 = pure Rust + rustls).
rumqttc = { version = "0.25", features = ["use-rustls"] }

# Tenant/sensor topic-cache (Faz 2 stage 8):
#   moka — bounded TinyLFU+LRU cache with native max_capacity, eviction
#     listener, and per-key invalidate. The cache is the storage layer.
#     Picked over a hand-rolled `RwLock<HashMap>` because the global cap
#     and per-tenant cap both require eviction (not rejection); writing a
#     correct LRU by hand is busywork that moka already ships, audited.
#     Same crate the edge agent uses (sens-api-gateway/Cargo.toml `moka =
#     "0.12"`), so the supply-chain footprint is unchanged platform-wide.
#   papaya — read-heavy lock-free concurrent map for the per-tenant entry
#     counter (`papaya::HashMap<TenantId, AtomicUsize>`). Per the plan
#     (`docs/plans/sensor-rust-migration/PLAN.md` § Faz 2 — Multi-Tenant
#     Cache) papaya is the chosen primitive for read-99:1 lookups. The
#     counter is hit on every cache insert/evict (write) and on every
#     per-tenant cap probe (read); papaya's seqlock-based reads keep the
#     hot read path lock-free.
moka = { version = "0.12", features = ["sync"] }
papaya = "0.2"

# ADR-031 DynamicBackendPolicy — atomic swap of the current
# IngestBackend snapshot so the drain's per-message hot path stays
# lock-free while the NATS subscriber hot-swaps the state on every
# `policy.ingest_backend.changed` message.
arc-swap = { workspace = true }

# Persistence (Faz 2 stage 11): live TimescaleDB COPY pipeline.
#   tokio-postgres — async pure-Rust postgres client with native
#     binary COPY IN via `BinaryCopyInWriter` (text COPY is YASAK
#     on the hot path; binary framing is ~3-5x faster).
#   tokio-postgres-rustls — TLS bridge from the tokio-postgres authors.
#     tokio-postgres itself is TLS-agnostic (`NoTls` by default); the
#     rustls bridge gives us SCRAM channel binding (tls-server-end-point)
#     so an MITM with a forged-but-trusted cert cannot phish the SCRAM
#     exchange even if `sslmode=verify-full` alone passed.
#   deadpool-postgres — async connection pool. Plan-named explicitly
#     (PLAN.md § Faz 2). Health-checks + recycle hooks ship in the
#     crate; re-implementing those would be a strict downgrade.
#   rustls-pemfile — workspace-pinned PEM loader for the rustls
#     ClientConfig builder. Same crate the workspace nats-client
#     already uses.
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4"] }
tokio-postgres-rustls = "0.13"
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }

# Error + tracing.
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }

# Metrics facade (emitter side only — PR-A finding #5). The exporter
# wiring (metrics-exporter-prometheus, HTTP endpoint, cardinality guard
# per ADR-028 Kör Nokta 4) lands in PR-C; counter emissions are no-ops
# until the recorder is installed, by design. Emitting early decouples
# the observability rollout from the hot-path code — the metric-name
# contract is stable from this commit forward.
metrics = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# DebuggingRecorder installs a programmable metrics recorder so unit
# tests can assert counter increments without a Prometheus exporter —
# proves the emitter actually fires on every flush, not just compiles.
metrics-util = { version = "0.19", features = ["debugging"] }

[lints]
workspace = true
