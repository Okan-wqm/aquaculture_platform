name: 'Install Linux platform binaries'
description: >
  Installs the linux-x64-gnu native binaries required by SWC, esbuild, rollup,
  and NX when the workspace lockfile was generated on a non-Linux host. Every
  tarball is verified against its package-lock.json sha512 integrity entry
  (SEC-CI-007) before extraction.

  Safe to re-run: each binary is skipped if already present on disk.

  Consumers: ci-affected.yml#install (graph-invariant precondition),
  deploy-digitalocean.yml#build-backend-artifacts and #build-frontend-artifacts
  (migrated out of inline shell blocks — see WP follow-up).

runs:
  using: 'composite'
  steps:
    - name: Install Linux platform binaries
      shell: bash
      # Outer timeout is enforced by the consuming job's `timeout-minutes`;
      # composite-action steps do not support `timeout-minutes` directly.
      # Each network call below is independently bounded by `curl --max-time`.
      run: |
        # Lockfile generated on Windows/macOS only carries those platforms'
        # native binaries. The linux-x64-gnu tarballs must be fetched
        # out-of-band so NX (native graph walker), SWC (TS compile), esbuild
        # (Vite bundler), and rollup (Vite bundler) can run on the CI runner.
        #
        # SEC-CI-007: Each tarball is downloaded to a temp file and its
        # SHA-512 digest is verified against the 'integrity' field recorded
        # in package-lock.json before extraction. This detects registry
        # compromise or MitM even over HTTPS.
        install_pkg() {
          local name=$1
          local ver=$2
          local dest=${3:-"node_modules/${name}"}
          local temp_root="${RUNNER_TEMP:-/tmp}"
          local tmpfile
          tmpfile=$(mktemp "${temp_root}/npm-pkg-XXXXXX.tgz")
          trap 'rm -f "${tmpfile:-}"' RETURN
          echo "Installing ${name}@${ver} → ${dest}"
          mkdir -p "${dest}"

          # Download tarball to temp file (do not pipe directly into tar)
          curl -sfL --max-time 30 \
            "https://registry.npmjs.org/${name}/-/$(basename "${name}")-${ver}.tgz" \
            -o "${tmpfile}"

          # SEC-CI-007: Verify integrity hash from package-lock.json
          # The integrity field is base64-encoded sha512: "sha512-<base64>"
          LOCK_INTEGRITY=$(node -p "
            try {
              const lock = require('./package-lock.json');
              const pkg = lock.packages && lock.packages['node_modules/${name}'];
              (pkg && pkg.integrity) || ''
            } catch(e) { '' }
          " 2>/dev/null || true)

          # SEC-CI-007: Platform binaries are executable supply-chain inputs.
          # Missing or mismatched lockfile integrity is fatal; extracting a
          # tarball whose digest is not committed would make CI non-reproducible.
          if [ -n "${LOCK_INTEGRITY}" ] && echo "${LOCK_INTEGRITY}" | grep -q '^sha512-'; then
            B64="${LOCK_INTEGRITY#sha512-}"
            EXPECTED_HEX=$(echo "${B64}" | base64 -d | xxd -p | tr -d '\n')
            ACTUAL_HEX=$(sha512sum "${tmpfile}" | cut -d ' ' -f 1)
            if [ "${EXPECTED_HEX}" != "${ACTUAL_HEX}" ]; then
              echo "::error::Integrity mismatch for ${name}@${ver}"
              exit 1
            else
              echo "  Integrity verified (sha512 matches package-lock.json)"
            fi
          else
            echo "::error::No lockfile integrity entry for ${name}@${ver}"
            exit 1
          fi

          if tar tzf "${tmpfile}" | grep -E '(^/|(^|/)\.\.(/|$))' >/dev/null; then
            echo "::error::Unsafe tar entry in ${name}@${ver}"
            exit 1
          fi
          tar xz -C "${dest}" --strip-components=1 < "${tmpfile}"
          rm -f "${tmpfile}"
          if [ -f "${dest}/package.json" ]; then
            echo "  OK ($(node -p "require('./${dest}/package.json').name"))"
          else
            echo "  FAILED - no package.json found"
          fi
        }

        # SWC (needed by NX for fast TypeScript compilation)
        install_pkg "@swc/core-linux-x64-gnu" "$(node -p "require('./node_modules/@swc/core/package.json').version")"

        # esbuild linux-x64 for ALL esbuild installations (needed when nx affected
        # includes frontend/library projects that use Vite in the backend build job)
        for esbuild_pkg in $(find node_modules -name "package.json" -path "*/esbuild/package.json" -not -path "*/@esbuild/*" 2>/dev/null); do
          esbuild_dir=$(dirname "$esbuild_pkg")
          esbuild_ver=$(node -p "require('./${esbuild_pkg}').version")
          parent_dir=$(dirname "$esbuild_dir")
          target="${parent_dir}/@esbuild/linux-x64"
          if [ ! -d "$target" ]; then
            install_pkg "@esbuild/linux-x64" "$esbuild_ver" "$target"
          else
            echo "Skipping ${target} (already exists)"
          fi
        done

        # Rollup native binary (needed by Vite when frontend libs are in affected set)
        install_pkg "@rollup/rollup-linux-x64-gnu" "$(node -p "require('./node_modules/rollup/package.json').version")"

        # NX native binary (CRITICAL - without this NX hangs on Linux!)
        install_pkg "@nx/nx-linux-x64-gnu" "$(node -p "require('./node_modules/nx/package.json').version")"

        timeout 30 node node_modules/nx/bin/post-install || true

        # ARCH-CI-011: Verify NX binary is functional before proceeding
        node -e "require('@nx/nx-linux-x64-gnu')" || { echo "::error::NX linux binary missing or broken"; exit 1; }

        # Workspace-local ESLint plugin (tools/eslint-rules/, resolved
        # as eslint-plugin-aquaculture via npm workspaces symlink).
        # Its dist/ is COMMITTED (see .gitignore exception) so no
        # runtime build is needed. We only assert the package resolves
        # — fast belt-and-braces check that the workspaces symlink
        # survived `npm install --ignore-scripts`.
        node -e "require('eslint-plugin-aquaculture')" || {
          echo "::error::eslint-plugin-aquaculture not resolvable — tools/eslint-rules may be missing from workspaces array, or dist/ was not committed"
          exit 1
        }

        echo "All Linux platform binaries installed successfully"
