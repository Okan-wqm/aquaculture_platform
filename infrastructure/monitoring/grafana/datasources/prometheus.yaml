# =============================================================================
# Grafana Datasource Provisioning
# ARCH-NM-009: Explicit datasource UIDs to match hardcoded panel references
#              in aquaculture-overview.json (uid: "prometheus", uid: "loki")
# =============================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # uid must match the hardcoded "uid": "prometheus" in dashboard JSON panels
    uid: prometheus
    url: http://prometheus-kube-prometheus-prometheus:9090
    access: proxy
    isDefault: true
    jsonData:
      timeInterval: 30s
      httpMethod: POST

  - name: Loki
    type: loki
    # uid must match any Loki panel references
    uid: loki
    url: http://loki-gateway:3100
    access: proxy
    jsonData:
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: "traceId=(\\w+)"
          name: TraceID
          url: "${__value.raw}"
