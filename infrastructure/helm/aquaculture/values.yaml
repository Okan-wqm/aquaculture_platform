# =============================================================================
# Ingress
# =============================================================================

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Rate limiting — protects backend services in addition to application-level limits
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # Security response headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "X-XSS-Protection: 1; mode=block";
  hosts:
    - host: app.aquaculture.io
      paths:
        - path: /
          pathType: Prefix
          service: shell
    - host: api.aquaculture.io
      paths:
        - path: /
          pathType: Prefix
          service: gateway-api
  tls:
    - secretName: aquaculture-tls
      hosts:
        - app.aquaculture.io
        - api.aquaculture.io

# =============================================================================
# Security
# =============================================================================

serviceAccount:
  create: true
  name: aquaculture-sa
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# SECURITY (MEDIUM-006): Kubernetes Pod Security Standards (PSS).
# Namespace-level admission controller labels — see templates/namespace.yaml.
# The restricted profile enforces runAsNonRoot, capabilities drop ALL,
# readOnlyRootFilesystem, seccompProfile=RuntimeDefault — all of which the
# platform's securityContext helper already satisfies, so no workload needs
# changes. If a specific deployment requires relaxed policy (e.g. a legacy
# sidecar), override to `baseline` here and restrict with a NetworkPolicy.
podSecurityStandards:
  enforce: "restricted"
  enforceVersion: "latest"
  audit: "restricted"
  auditVersion: "latest"
  warn: "restricted"
  warnVersion: "latest"

networkPolicy:
  enabled: true

# =============================================================================
# cert-manager integration
# =============================================================================
# SECURITY (MEDIUM-002): automate internal PKI lifecycle via cert-manager.
# Replaces the manual infrastructure/docker/scripts/generate-internal-certs.sh
# flow with CRD-based issuance + renewal. Requires cert-manager installed in
# the cluster. Defaults to disabled so clusters without cert-manager are not
# forced to install it before this chart renders.
certManager:
  internal:
    enabled: false
    # Root CA duration: 10 years. Renew trigger: 3 months before expiry.
    caDuration: "87600h"
    caRenewBefore: "2160h"
    # Leaf cert duration: 1 year. Renew trigger: 30 days before expiry.
    leafDuration: "8760h"
    leafRenewBefore: "720h"

# =============================================================================
# Secrets
# =============================================================================
# All credential fields are REQUIRED and have no default.
# Supply them via --set, a sealed-secrets overlay, or externalSecrets.

secrets:
  # REQUIRED: full PostgreSQL connection URL
  # e.g. postgres://aquaculture:<password>@postgresql:5432/aquaculture
  databaseUrl: ""
  # REQUIRED: full Redis connection URL
  # e.g. redis://:<password>@redis-master:6379
  redisUrl: ""
  # REQUIRED: RS256 private key PEM (auth-service only — sole token issuer).
  # Generate with: infrastructure/docker/scripts/generate-jwt-keypair.sh
  jwtPrivateKey: ""
  # REQUIRED: RS256 public key PEM (distributed to every backend service for verification).
  jwtPublicKey: ""
  # REQUIRED: HMAC pepper applied to user passwords before bcrypt (auth-service only).
  # Generate with: openssl rand -base64 48
  passwordPepper: ""
  # REQUIRED: AES-256-GCM root key for MFA TOTP secrets (auth-service only).
  # Generate with: openssl rand -hex 32
  mfaEncryptionKey: ""
  # REQUIRED: dedicated AES key for legacy Sentinel credential cutover.
  # Keep separate from CONFIG_ENCRYPTION_KEY so the credential domains can be
  # rotated independently.
  sentinelHubEncryptionKey: ""
  # REQUIRED: NATS connection URL. Must start with tls:// in production
  # (mTLS is enforced by nats-tls-enabled.conf `verify: true`).
  # e.g. tls://nats:4222
  natsUrl: ""
  # ADR-015 (cert-is-identity): per-service NATS identity comes from the
  # mTLS client cert CN via `verify_and_map: true`. No user/password auth
  # is configured — the CONNECT-frame user/pass fields are IGNORED by the
  # server. cert-manager issues one Secret per identity generated from
  # infrastructure/nats/services.yaml; each backend mounts only its own
  # Secret at /etc/ssl/nats-client/{ca.crt,tls.crt,tls.key}.
  #
  # The previous natsAuth.*User / .*Pass block was removed in the NATS
  # SSoT refactor — keeping empty string passwords and redundant usernames
  # would have preserved a drift surface (values.yaml ↔ nats.conf ↔ cert
  # CN list) that ADR-015's single-source-of-truth explicitly eliminates.
  # REQUIRED: Stripe webhook signing key for billing-service's
  # stripe-webhook.controller.ts — verifies HMAC on every inbound Stripe
  # event. Obtain from Stripe Dashboard → Developers → Webhooks → your
  # endpoint → Signing secret. Format: `whsec_...`
  # Rotation: docs/runbooks/secret-rotation.md
  stripeWebhookSecret: ""
  # REQUIRED: Stripe server-side API key for outbound API calls
  # (checkout sessions, subscription state queries, refunds).
  # Obtain from Stripe Dashboard → Developers → API keys.
  # Use restricted keys in production (no customer-data read). Format: `sk_live_...` / `rk_live_...`
  stripeApiKey: ""

# External secrets (e.g., from AWS Secrets Manager, Vault)
externalSecrets:
  enabled: false
  secretStore:
    name: ""
    kind: ClusterSecretStore
  # Path prefix for remote secret store keys.
  # Set per environment: "aquaculture/production" or "aquaculture/staging"
  pathPrefix: "aquaculture/production"
  # Refresh interval — lower during incident credential rotation (e.g., "5m")
  refreshInterval: "1h"

# =============================================================================
# Infrastructure Dependencies
# =============================================================================

postgresql:
  enabled: true
  auth:
    username: aquaculture
    # REQUIRED — set via --set postgresql.auth.password=<value>
    # An empty string disables PostgreSQL authentication. Never ship empty.
    password: ""
    database: aquaculture
  primary:
    persistence:
      size: 20Gi

redis:
  enabled: true
  auth:
    # REQUIRED — set via --set redis.auth.password=<value>
    # An empty string disables Redis authentication. Never ship empty.
    password: ""
  master:
    persistence:
      size: 5Gi

nats:
  enabled: true
  config:
    # Enable token-based authentication for NATS
    authorization:
      timeout: 5
    jetstream:
      enabled: true
      memStorage:
        size: 1Gi
      fileStorage:
        enabled: true
        size: 5Gi

# =============================================================================
# Monitoring
# =============================================================================

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s

# =============================================================================
# Probes
# =============================================================================

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
