{{/*
=============================================================================
Aquaculture Platform - NetworkPolicy
=============================================================================
Requires a CNI that supports NetworkPolicy (Calico, Cilium, Weave).
AWS VPC CNI does not support NetworkPolicy natively — use Calico or Cilium
as a secondary CNI on EKS if NetworkPolicy enforcement is required.

Policy design:
  - Default-deny all ingress within the namespace.
  - Gateway-api: accepts ingress from outside the namespace (ingress controller).
  - Backend services: accept ingress only from gateway-api.
  - All pods: allow egress to DNS (port 53), PostgreSQL, Redis, NATS.
=============================================================================
*/}}
{{- if .Values.networkPolicy.enabled }}

{{- /* Default-deny all ingress in the namespace */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aquaculture.fullname" . }}-default-deny-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aquaculture.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress

{{- /* Gateway API — allow ingress from anywhere (nginx ingress controller) */}}
{{- if .Values.gatewayApi.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aquaculture.fullname" . }}-gateway-api-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aquaculture.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: gateway-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.gatewayApi.service.targetPort }}
          protocol: TCP
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Backend services
    - to:
        - podSelector:
            matchLabels:
              tier: backend
      ports:
        - port: 3000
          protocol: TCP
    # PostgreSQL
    - ports:
        - port: 5432
          protocol: TCP
    # Redis
    - ports:
        - port: 6379
          protocol: TCP
    # NATS
    - ports:
        - port: 4222
          protocol: TCP
{{- end }}

