# =============================================================================
# CD - Staging (Optimized)
#
# Features:
# - Parallel Docker builds with matrix strategy
# - Registry cache (unlimited size, no 10GB GHA limit)
# - Nx Cloud remote caching for build artifacts
# - Affected-only builds via path filtering
# =============================================================================

name: CD - Staging

on:
  push:
    branches:
      - develop
      - 'feature/*'
      - 'hotfix/*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  IMAGE_TAG: staging-${{ github.sha }}

jobs:
  # ===========================================================================
  # Build & Test with Nx
  # ===========================================================================
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            nx-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint & Test
        run: npx nx affected -t lint test --parallel=3
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: Build all
        run: npx nx run-many -t build --all --parallel=4
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Check if deploy needed
        id: check
        run: echo "should_deploy=true" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Build Backend Docker Images (Parallel)
  # ===========================================================================
  build-backend:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service:
          - gateway-api
          - auth-service
          - farm-service
          - sensor-service
          - alert-engine
          - billing-service
          - hr-service
          - notification-service
          - admin-api-service
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.backend.simple
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:staging
          build-args: SERVICE_NAME=${{ matrix.service }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:buildcache,mode=max

  # ===========================================================================
  # Build Frontend Docker Images (Parallel)
  # ===========================================================================
  build-frontend:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - module: shell
            dockerfile: infrastructure/docker/Dockerfile.shell
            module_path: web/shell
          - module: dashboard
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/dashboard
          - module: farm-module
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/farm-module
          - module: hr-module
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/hr-module
          - module: sensor-module
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/sensor-module
          - module: admin-panel
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/admin-panel
          - module: tenant-admin
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/tenant-admin
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.module }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:staging
          build-args: MODULE_PATH=${{ matrix.module_path }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:buildcache,mode=max

  # ===========================================================================
  # Deploy to Staging
  # ===========================================================================
  deploy-staging:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig

      - name: Deploy to staging
        run: |
          export KUBECONFIG=$PWD/kubeconfig

          # Update image tags in deployment manifests
          for service in gateway-api auth-service farm-service sensor-service alert-engine billing-service hr-service notification-service admin-api-service; do
            if [ -f "deploy/staging/${service}-deployment.yaml" ]; then
              sed -i "s|${{ env.IMAGE_PREFIX }}/${service}:.*|${{ env.IMAGE_PREFIX }}/${service}:${{ env.IMAGE_TAG }}|g" deploy/staging/${service}-deployment.yaml
            fi
          done

          # Apply Kubernetes manifests
          kubectl apply -f deploy/staging/ --recursive

          # Wait for rollouts
          kubectl rollout status deployment -n aquaculture-staging --timeout=5m || true

  # ===========================================================================
  # Smoke Tests
  # ===========================================================================
  smoke-tests:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for deployment
        run: sleep 30

      - name: Run smoke tests
        run: |
          # Health check
          curl -sf https://staging.aquaculture-platform.example.com/health || echo "Health check endpoint not available"

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#ci-cd'
          text: 'Staging deployment smoke tests failed!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
