[package]
name = "suderra-agent"
version = "2.0.0-rc.4"
edition = "2024"
rust-version = "1.85"
authors = ["Suderra <info@suderra.com>"]
description = "Suderra Edge Agent for Industrial IoT"
license = "Proprietary"
repository = "https://github.com/suderra/edge-agent"

# Exclude fuzz directory from workspace (cargo-fuzz manages its own)
[workspace]
exclude = ["fuzz"]

[dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }
futures = "0.3"

# Drift-zero alarm decision core — the SAME condition / deadband / delay math the
# NestJS SCADA runtime evaluates (via the alarm-core wasm build). See
# crates/alarm-core.
alarm-core = { path = "../crates/alarm-core", version = "0.1.0" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
# serde_big_array: serde Serialize/Deserialize for fixed-width byte arrays
# larger than 32 bytes (serde auto-impl caps at [T; 32]). Used by Batch 5a
# Ed25519SignatureBytes([u8; 64]). Added as BATCH-001-CI-FIX-006.
serde-big-array = "0.5"

# HTTP client for provisioning API
# Use rustls for cross-compilation support (no OpenSSL dependency)
# M-EDGE-03: rustls-tls-manual-roots avoids pulling h2 crate transitively.
# The edge agent only makes outbound HTTPS/1.1 calls to the cloud API;
# HTTP/2 is unnecessary attack surface (RST flood vectors via h2 crate).
reqwest = { version = "0.12", features = ["json", "rustls-tls-manual-roots"], default-features = false }

# MQTT client — uses rustls by default (no OpenSSL dependency)
rumqttc = "0.25"

# Direct rustls dep (Batch 136 Sprint 6.6/6.8 wire). Version
# MUST match what rumqttc pulls in (0.23 series) so the
# SuderraServerCertVerifier interoperates with the same
# ServerCertVerifier trait that rumqttc's tokio-rustls
# expects. Consumed via `rustls::client::danger::ServerCertVerifier`
# + related types in `src/mtls/rustls_verifier.rs`.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }

# System CA store for TLS (Let's Encrypt certs are pre-installed on most Linux systems)
rustls-native-certs = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Secure secret handling (zeroize on drop) - v1.2.2 security hardening
secrecy = { version = "0.8", features = ["serde"] }

# System info for telemetry
sysinfo = "0.33"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Async trait support for PLC programming interfaces
async-trait = "0.1"

# Regex for script variable interpolation
regex = "1.10"

# Modbus TCP/RTU for PLC communication (v1.2.0: rodbus with TLS support)
# rodbus provides native TLS support for IEC 62443 SL2 FR4 compliance
#
# BUG-005 (version pin, HISTORICAL — see BATCH-001-CI-FIX-004 below):
# rodbus 1.4.0 required a Path::new("") workaround in modbus.rs for
# TlsClientConfig::full_pki() server-only path (no mTLS client cert).
#
# BATCH-001-CI-FIX-004: Bumped to 1.5.0-RC1 to pull in sfio-rustls-config
# 0.4.0 which uses rustls-webpki 0.103.12 (patches RUSTSEC-2026-0049/
# 0098/0099). The rodbus 1.5 API MAY break the empty-Path workaround —
# Batch 22 ARC-007: exact-pin to a single rodbus RC version.
# Plan §5 Faz 1 Step 7 requires patch-level pinning to block
# untracked minor upgrades. Caret-default `"1.5.0-RC1"` (used
# pre-Batch-22) semantically meant `>=1.5.0-RC1, <2.0.0` so
# Cargo could silently bump through 1.6.x / 1.7.x on every
# cargo update. `"=1.5.0-RC1"` is the EXACT-pin operator — any
# version change must be explicit + reviewed. Future bump path:
# `~1.5.0` (patch-allowing) when rodbus 1.5.0 stable releases;
# `~1.5` when 1.5.x stabilizes across patches.
#
# ARC-007 Tier 1 counterpart: TlsMode enum in config.rs encodes
# the Full/ServerOnly/Disabled states at the Rust type level so
# the modbus.rs consumer path cannot observe a half-configured
# TLS combination (client cert without client key etc).
rodbus = "=1.5.0-RC1"
# Keep tokio-serial for RTU serial port support
tokio-serial = "5.4"

# GPIO support (for Raspberry Pi / Revolution Pi)
# rppal = { version = "0.17", optional = true }

# Signal handling
ctrlc = "3.4"

# Machine ID / fingerprint
machine-uid = "0.5"

# MAC address
mac_address = "1.1"

# Hostname
hostname = "0.3"

# SQLite for RETAIN variable persistence (IEC 61131-3 compliance)
# "bundled-sqlcipher" enables AES-256-CBC encryption at rest (IEC 62443 FR4).
# "vendored-openssl" statically links OpenSSL crypto into the binary so the target
# device does not need a matching libcrypto.so at runtime.
# The database key is derived from the device machine-id at runtime via init_schema().
rusqlite = { version = "0.34", features = ["bundled-sqlcipher-vendored-openssl"] }

# Bounded cache for memory management (prevents unbounded growth)
moka = { version = "0.12", features = ["sync"] }
# Note: moka 0.12 is the last version with sync feature, newer versions use different API

# Systemd integration (watchdog, ready notification)
sd-notify = "0.4"

# String interning for memory efficiency (device IDs, topic names)
lasso = { version = "0.7", features = ["multi-threaded"] }

# Bounded stack-allocated collections (IEC 62443 FR3: memory safety)
heapless = "0.8"

# Compression for backup files (v1.2.4)
flate2 = "1.0"

# Cryptographically secure random number generation (OPC UA nonces)
getrandom = "0.2"

# HMAC-SHA256 for database encryption key derivation (IEC 62443 FR4)
hmac = "0.12"
rand = "0.9"

# UUID generation for unique MQTT client IDs (IEC 62443 FR1 - client impersonation prevention)
uuid = { version = "1.0", features = ["v4"] }

# Base64 encoding for credential obfuscation in config file (IEC 62443 FR4)
base64 = "0.22"

# In-process X.509 certificate parsing — replaces openssl subprocess (IEC 62443 FR3)
x509-parser = "0.16"
pem = "3.0"

# SHA-256 hashing for GDPR-compliant MAC address pseudonymisation in DeviceFingerprint (LOW-45)
sha2 = "0.10"

# =============================================================================
# Asymmetric crypto foundation — ADR-018/019/020/021 cross-cutting
# =============================================================================
# WHY: All signed artifacts (firmware manifests, RBAC manifests, command envelopes,
#      bytecode, audit attestations, revocation statements) use ed25519 per
#      ADR-021 §1 canonical 9-slot HSM map (slots 1-9 all Ed25519).
# WHAT: Pure-Rust Ed25519 impl. Edge DOES sign locally (device_audit_attestation_keypair
#       per ADR-020 §2 HKDF-derived from master; signs per-epoch attestations).
#       Ed25519 signing is deterministic per RFC 8032 — no RNG feature needed.
#       default-features=false drops std/alloc pulls; `zeroize` keeps SigningKey
#       zeroize-on-drop. BATCH-001-FINDING-001 closure.
# INVARIANT: This crate + sha2 (already present) are the only asymmetric primitives
#            allowed in edge src/; no openssl, no custom curve code.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "zeroize"] }

# =============================================================================
# Key Derivation Function (HKDF) — ADR-019 §7 master key hierarchy
# =============================================================================
# WHY: ADR-019 §2 master-derived child keys (sqlcipher_db_key, audit_hmac_chain_key,
#      replay_cache_key, local_state_encryption, device_audit_attestation_keypair).
#      ADR-020 §2 derive_audit_hmac_key + derive_device_audit_attestation_keypair.
#      HKDF-SHA256 extract-expand per RFC 5869.
# WHAT: Stateless derivation; each purpose uses distinct salt + info per ADR-020 §2
#       (salt "audit-hmac-chain-v2", info "epoch-{N}", etc.).
# INVARIANT: Master key NEVER used directly; child keys ALWAYS via HKDF with bound
#            purpose context string (prevents cross-purpose misuse).
hkdf = "0.12"

# =============================================================================
# Argon2id — ADR-019 §7 Tier 3 file-backed keystore passphrase derivation
# =============================================================================
# WHY: ADR-019 §7 Tier 3 operator-passphrase path (last-resort, TPM + systemd-creds
#      unavailable). Plain HKDF from passphrase = brute-forceable on extracted SD
#      (device_id public). Argon2id memory-hard m=256MiB/t=3/p=4 = GPU-resistant
#      per ADR-020 FINDING-007 closure.
# WHAT: Salt = HKDF(device_id, provisioning_nonce, "keystore-salt-v2");
#       passphrase entropy floor 128-bit enforced at provisioning time.
# INVARIANT: Tier 3 requires explicit operator acceptance (i_accept_file_backed_
#            keystore_risk + expires_at); expiry → emergency mode (not silent renew).
argon2 = "0.5"

# =============================================================================
# unicode-normalization (PINNED) — Batch #242 A-3a homoglyph defense
# =============================================================================
# WHY: OPC UA UserName/Password tokens (ADR-017 §4.2) accept raw UTF-8
#      usernames from external HMI clients. Unicode canonical composition
#      (NFKC) + lowercase normalization closes the homoglyph attack class
#      where "admin" vs "аdmin" (Cyrillic a U+0430) would otherwise resolve
#      to two distinct lookup keys — letting an attacker enroll a
#      look-alike user with an unrelated password.
# INVARIANT: All usernames cross the NFKC normalization gate before any
#            manifest lookup; raw bytes never touch the enrollment map.
unicode-normalization = "0.1"

# =============================================================================
# bincode (PINNED) — ADR-020 FINDING-019 + ADR-017 §6 bytecode serialization
# =============================================================================
# WHY: Audit chain entries (ADR-020 §1 AuditEntry) + ST bytecode artifacts
#      (ADR-017 §6 StBytecode) + CommandEnvelope (ADR-018 §7) serialized via
#      bincode for compact binary form. bincode 1.x wire format is stable;
#      bincode 2.x breaks compatibility. Pin to 1.3.3 for long-term archival
#      readability (7-year audit retention per ADR-020 §10a).
# WHAT: Deterministic little-endian encoding; every struct derives Serialize +
#       Deserialize; no dynamic dispatch.
# INVARIANT: (A) CommandEnvelope + StBytecode deserialization (attacker-controlled
#            MQTT input) MUST use `bincode::options().with_limit(MAX_ENVELOPE_BYTES)`
#            where MAX = 64KB (envelope) / 256KB (bytecode per ADR-017 §6
#            EDGE_HARD_MAX_BYTECODE_BYTES). Unbounded deserialize on attacker input
#            = OOM DoS (bincode 1.x allocates length-prefix Vec eagerly).
#            (B) Audit-entry deserialize is trusted writer; no limit required.
#            (C) Future migration to postcard/CBOR tracked as ADR amendment;
#            no silent version bump (ADR-020 §8). BATCH-001-FINDING-004 closure.
# ENFORCE: tests/invariants/bincode_limit_on_external_input.rs — AST grep for
#          bincode::deserialize callers; require .with_limit() on CommandEnvelope +
#          StBytecode paths; audit paths exempt.
bincode = "=1.3.3"

# =============================================================================
# libc — ADR-019 §5 in-process hardening (prctl, mlock, memfd_secret)
# =============================================================================
# WHY: systemd unit hardening (LimitCORE=0 + SystemCallFilter) is process-level;
#      in-process complements with prctl(PR_SET_DUMPABLE, 0) post-TPM-unsealing +
#      mlock(master_key_bytes) swap prevention + memfd_secret(2) attempt
#      (kernel 5.14+ Linux).
# WHAT: Low-level FFI into libc; wrapped in safe Rust abstractions in
#       src/keystore/hardening.rs (Faz 2 Sprint 6.3).
# INVARIANT: All unsafe blocks in hardening.rs carry SAFETY: comments citing
#            the libc manpage + pre-conditions; forbid(unsafe_op_in_unsafe_fn).
libc = "0.2"

# =============================================================================
# nix — ADR-020 §3a fcntl advisory lock + capability drop
# =============================================================================
# WHY: ADR-020 §3a audit log append-only enforcement requires fcntl(F_SETLK)
#      advisory lock during logrotate + CAP_LINUX_IMMUTABLE capability drop on
#      suderra-agent process; ADR-018 §5 emergency mode process capability
#      manipulation.
# WHAT: Safe Rust wrappers around POSIX syscalls; fs feature for fcntl; process
#       feature for capability ops; signal feature for panic-hook signal delivery.
# INVARIANT: Capability drops are irreversible within process lifetime; tests/
#            invariants/cap_drop_persistent.rs fuzzes regain attempts → EPERM.
nix = { version = "0.29", features = ["fs", "process", "signal", "user"] }

# =============================================================================
# tracing-journald — ADR-019 §5 systemd integration (native tracing layer)
# =============================================================================
# WHY: Structured logging to systemd-journald instead of stdout; tamper-evident
#      (journald supports FSS — Forward Secure Sealing for log tampering detection);
#      integrates with edge telemetry without parser layer.
# WHAT: Native tracing-subscriber Layer (NOT a `log` crate backend — that was
#       systemd-journal-logger, incorrect earlier draft). Maps tracing events
#       to journald priority levels; preserves span context; no bridge hop.
#       BATCH-001-FINDING-007 closure.
# INVARIANT: ALL tracing::* events flow through this in production builds;
#            println!/eprintln! banned (clippy print_stdout=deny enforces).
tracing-journald = "0.3"

# =============================================================================
# jsonwebtoken — ADR-018 §2 license JWT verification (optional, Faz 7)
# =============================================================================
# WHY: Edge licenses arrive as JWT signed by platform slot 6 (program_signing_key
#      reused per ADR-018 §2 slot allocation). Edge verifies claims (tier, limits,
#      expiry) but never signs. Feature-gated because license enforcement is
#      opt-in per deployment tier (ADR-018 license tier runtime enforcement).
# WHAT: Supports EdDSA (Ed25519) via ring backend; matches ADR-021 slot 6.
# INVARIANT: (A) Verify-only — no signing key ever loaded into edge.
#            (B) ALGORITHM CONFUSION DEFENSE: Validation MUST construct
#            `Validation::new(Algorithm::EdDSA)` explicitly; `Validation::default()`
#            (HS256) is FORBIDDEN — caller-controlled `alg=none` / `alg=HS256`
#            using pubkey as secret is the classic JWT library CVE class.
#            BATCH-001-FINDING-005 closure.
# ENFORCE: tests/invariants/jwt_alg_pinning.rs — AST grep for Validation::default()
#          callers in src/license/; any match = CI fail.
jsonwebtoken = { version = "9", optional = true }

# =============================================================================
# async-opcua — Faz 5 OPC UA Server (optional)
# =============================================================================
# WHY: ADR-018 §3 OPC UA Server for 3rd-party HMI integration (Ignition / Wonderware
#      / UaExpert read + controlled write). ADR-019 §3.6 STRIDE per-component.
# WHAT: Pure-Rust async OPC UA 1.04 server via `async-opcua` — the
#       maintained successor fork of locka99/opcua. Optional because
#       opc-ua-server feature off by default (not all deployments need HMI).
#
#       BATCH-001-CI-FIX-005: Switched from `opcua 0.12` → `async-opcua
#       0.18` because opcua 0.12.0 pulls ancient `url 1.7.2` + `idna 0.1.5`
#       which carries RUSTSEC-2024-0421 (punycode label acceptance bypass).
#       async-opcua uses modern `url 2.5` + `idna 1.1`. API is rewritten
#       for tokio async — Sprint 6.1/6.5 wiring consumes the new API.
#
# INVARIANT: Feature OFF → binary MUST NOT contain OPC UA symbols; CI gate
#            `tests/invariants/feature_off_no_symbols.sh` runs `nm` over release
#            binary and fails on any `opcua` symbol match when feature disabled.
async-opcua = { version = "0.18", optional = true, features = ["server"] }
rcgen = "0.13"

# =============================================================================
# TPM 2.0 via tss-esapi — ADR-019 §7 Tier 1 master key sealing (optional)
# =============================================================================
# WHY: RPi 5 + TPM2 / external TPM (SLB 9670, Optiga SLM) supports NV counter
#      + PCR-sealed key unsealing. Best-available anti-rollback (ADR-018 §4) +
#      master key protection. RPi 4 without TPM → Tier 2/3 fallback (ADR-019 §7).
# WHAT: Rust bindings to tpm2-tss C library; build-time dependency on libtss2-esys
#       (>=4.0) on target platform. Version 7.x is the current STABLE major
#       (BATCH-001-CI-FIX-001: Batch 1 originally pinned "8" but 8.x only
#       ships alpha.2 — Cargo `^8` semver excludes pre-release, so resolver
#       could not pick a version. Reverted to stable 7.6.x. Alpha 8.x is
#       tracked for future migration when it ships stable.).
# INVARIANT: (A) Feature gate tpm; missing TPM at runtime → Tier fallback per
#            ADR-019 §7 hierarchy (systemd-creds Tier 2 → file Tier 3 operator-gated).
#            (B) Cross-compile gate: CI matrix MUST run `cross build --target
#            aarch64-unknown-linux-gnu --features tpm` (sysroot needs libtss2-esys).
#            (C) No silent TPM disable: operator must explicitly accept fallback
#            via config + audit event (ADR-019 §7 i_accept_file_backed_keystore_risk).
# ENFORCE: tests/invariants/tpm_feature_cross_compile.rs — CI job entry required.
tss-esapi = { version = "7", optional = true }

# =============================================================================
# aws-lc-sys — transitive dep via rustls/rumqttc/reqwest/hyper-rustls
# =============================================================================
# WHY (BATCH-001-CI-FIX-002 / RUSTSEC-2026-0044/0045/0047/0048): aws-lc-sys
# 0.36.0 carries 4 RUSTSEC advisories (2 HIGH: PKCS7_verify bypass, CRL
# distribution point logic error; 2 medium: X.509 Name Constraints bypass,
# AES-CCM timing side-channel). All fixed in >=0.39. Advisory drop date
# 2026-03-02 / 2026-03-19 — post-dates last green Edge Agent Release on
# 2026-03-05 (agent-v1.8.2).
# WHAT: Explicit direct dep forces resolver to pick 0.40.x (current latest
# stable) even though we don't use aws-lc-sys directly. Transitive deps
# (rustls, aws-lc-rs, rumqttc, reqwest, rodbus) accept any compatible
# 0.x via their own dependency specifiers so the upgrade is transparent.
# INVARIANT: cargo audit on Cargo.lock must report 0 RUSTSEC-2026-* advisories
#            for aws-lc-sys family.
#
# BATCH-001-CI-FIX-009: `features = ["bindgen"]` uses the `bindgen` library
# crate to generate bindings at compile time instead of requiring the
# external `bindgen-cli` binary in the sysroot. Without this, cross-compile
# to armv7/aarch64 via `cross` fails with:
#   "Failure invoking external bindgen! External bindgen command failed."
# Using the library feature adds ~15s to the first cold build but keeps
# the CI stack self-contained (no apt install bindgen-cli needed).
aws-lc-sys = { version = "0.40", features = ["bindgen"] }

# LoRaWAN cryptography and packet encoding (optional, activated by `lorawan` feature)
aes = { version = "0.8", optional = true }
cmac = { version = "0.7", optional = true }
lorawan = { version = "0.9", optional = true }

# wasmi — sandboxed interpreter for custom LoRaWAN payload decoders (optional,
# activated by the `wasm-codec` feature). Pure-Rust, no JIT — the right fit for
# the memory-constrained aarch64 edge target. Pinned exact per deny.toml wildcard
# policy. Apache-2.0/MIT (allow-listed).
wasmi = { version = "=0.36.5", optional = true }
# Constant-time comparison for MIC verification + PIN verification (timing side-channel protection)
subtle = "2"
# EDGE-MEDIUM-003: Promoted from optional (lorawan-only) to required dependency.
# Cryptographic key material in security.rs must be zeroized on drop (IEC 62443 FR4).
# Keeping it optional meant key structs were only zeroized when the lorawan feature
# was enabled — a silent security gap on non-LoRa deployments.
zeroize = { version = "1", features = ["derive"] }

# HTTP server for health check endpoint (ws feature needed for scada-display)
axum = { version = "0.8", features = ["ws"], optional = true }
# CORS middleware for SCADA display server (security hardening)
tower-http = { version = "0.6", features = ["cors"], optional = true }

# OpenTelemetry for distributed tracing (optional)
opentelemetry = { version = "0.27", optional = true }
opentelemetry-otlp = { version = "0.27", features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }

# Prometheus metrics (optional)
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.16", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-specific GPIO support
rppal = { version = "0.17", optional = true }

[features]
# WHY: default build must include gpio + health for physical I/O + liveness endpoint.
#      Security features (signed-deploy, tpm) are OPT-IN per deployment tier to
#      preserve HC-1 backward-compat with v1.6.0 existing fleet (ADR-018 HC-1 §9).
# WHAT: Each feature maps 1:1 to an ADR implementation phase; feature gate lets
#       rollout be staged per-tenant without new binary variants.
# INVARIANT: tests/invariants/default_build_no_security_escape.rs — default build
#            must NOT enable any feature that changes security posture silently.
# BATCH-001-CI-FIX-016 (Batch 14 ARC-003): `health` added to default
# features per plan §5 Faz 1 Step 1.4. The HTTP health server is needed
# by every deployment running under docker / k8s / systemd liveness
# probes. Server itself only binds when `config.health.enabled=true`
# (serde default false), so enabling the feature in the binary is
# zero-cost for operators who leave the config disabled — ~200KB
# axum+tower link-cost paid once per binary. `gpio` is NOT added to
# defaults because not every target has RPi hardware; operators
# explicitly enable via `--features gpio` in per-deployment build.
default = ["health"]
gpio = ["rppal"]
# HTTP health check endpoint (uses axum)
health = ["axum"]
# OpenTelemetry distributed tracing
telemetry = ["opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "tracing-opentelemetry"]
# Prometheus metrics export
# NOTE: currently unused — retained for future observability integration
metrics = ["dep:metrics", "metrics-exporter-prometheus"]
# v1.2.4: Strict security mode - enables additional security checks in production
# NOTE: currently unused — retained for future production hardening
strict-security = []
# SCADA display server (embedded web UI for local HMI/kiosk)
scada-display = ["axum", "tower-http"]

# Release compatibility aliases. The release workflow names the concrete
# `scada-display` tier directly so enterprise validation can distinguish
# release binaries from broader CI/HIL feature gates. Keep hardware and
# preview surfaces out of these aliases unless a dedicated release contract owns them.
edge-rc2 = ["scada-display"]
edge-rc3 = ["scada-display"]
edge-rc4 = ["scada-display"]
# LoRaWAN protocol support. This intentionally excludes the Semtech SX1302
# vendor HAL so CI can compile protocol/security paths without hardware C
# sources. Real concentrator builds must enable `sx1302-vendor-hal` explicitly.
# EDGE-MEDIUM-003: dep:zeroize removed — zeroize is now a required dependency
lorawan = ["dep:aes", "dep:cmac", "dep:lorawan"]

# WHY: Custom LoRaWAN payload decoders (ADR-026 follow-on) — per-vendor formats
#      run as sandboxed wasm instead of native code on the edge device.
# WHAT: Fills the `CodecType::Custom` arm in src/lora/codec.rs via a wasmi engine
#       (src/lora/wasm_decoder.rs) with a per-invocation fuel + memory bound.
#       Implies `lorawan` (the whole lora module is lorawan-gated).
# INVARIANT: Feature OFF → no wasmi symbols in binary; custom codecs stay a
#            warn+empty no-op (feature-off symbol-absence test).
wasm-codec = ["lorawan", "dep:wasmi"]

# 2026-04-30: Enterprise feature split for Semtech SX1302 hardware builds.
# WHAT: enables bindgen/cc against vendor/sx1302_hal C sources.
# WHY: keeps protocol-level LoRaWAN CI deterministic while preserving a
# fail-closed hardware build when real concentrator support is requested.
sx1302-vendor-hal = ["lorawan", "dep:cc", "dep:bindgen", "dep:glob"]

# =============================================================================
# ADR phase feature gates — Faz 2-11 staged rollout
# =============================================================================
# Each feature corresponds to an ADR-defined phase; off by default to preserve
# HC-1 backward-compat during fleet rollout. Flip on per-tenant via signed config.
# =============================================================================

# WHY: Faz 2 SignatureMode::Enforcing per ADR-018 §7 — rejects unsigned mutating
#      commands (UpdateFirmware, DeployProgram, SafeStateTrigger, ForceValue, etc.).
# WHAT: Runtime gate; code compiled in always (signature verification path), but
#       strict rejection mode only active with this flag.
# INVARIANT: Disabled → permissive mode (log warning on unsigned); enabled → reject.
signed-deploy = []

# WHY: Faz 2 TPM 2.0 keystore Tier 1 (ADR-019 §7 master key hierarchy).
# WHAT: Enables tss-esapi dep + runtime TPM NV counter usage for anti-rollback
#       (ADR-018 §4 + ADR-019 §11 AntiRollbackCounter::Tier1).
# INVARIANT: TPM absent at runtime → graceful fallback Tier 2/3, NOT boot failure.
tpm = ["dep:tss-esapi"]

# WHY: Faz 3 ST Bytecode Compiler + Stack VM (ADR-017).
# WHAT: Compiles src/st_compiler.rs + src/st_vm.rs into binary; enables
#       deploy_program wire format "stbc" discriminator (ADR-017 §9).
# INVARIANT: Feature OFF → only JSON script runtime Phase 5a active; HC-1 preserved.
st-bytecode = []

# WHY: Faz 4 Multi-task scheduler (ADR-017 R-3; Plan §5 Faz 4).
# WHAT: Enables src/scripting/task_scheduler.rs + tokio::sync::watch ProcessImage
#       subscription + per-task jitter metrics.
# INVARIANT: OFF → legacy single-scan-cycle loop (HC-1 preserve).
