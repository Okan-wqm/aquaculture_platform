name: Security - Snyk

# SEC-CI-002: All third-party actions pinned to full commit SHAs
# SEC-CI-009: Snyk actions pinned to SHA (were @master)
# SEC-CI-014: Removed snyk-backend Python job (scanned non-existent requirements.txt)
#             Replaced with Node.js scan for the actual TypeScript/Node monorepo

on:
  workflow_dispatch:  # Manual only — no SNYK_TOKEN configured yet

jobs:
  # SEC-CI-014: Removed Python snyk-backend job entirely.
  # This project is a TypeScript/Node.js monorepo with no Python services.
  # The snyk-frontend job below covers Node.js dependency scanning.

  snyk-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # SEC-CI-002: pinned to SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA (was @v3)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Cache node modules
        # SEC-CI-002: pinned to SHA (was @v3)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit

      # SEC-CI-009/SEC-CI-002: Pinned to SHA (was @master)
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --org=aquaculture-platform

      # SEC-CI-009/SEC-CI-002: Pinned to SHA (was @master)
      - name: Upload Snyk results for PR comment
        if: github.event_name == 'pull_request'
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --org=aquaculture-platform --report

  snyk-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # SEC-CI-002: pinned to SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # SEC-CI-009/SEC-CI-002: Pinned to SHA (was @master)
      - name: Run Snyk to check for IaC vulnerabilities
        uses: snyk/actions/iac@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: infrastructure/
          args: --severity-threshold=high --org=aquaculture-platform

      - name: Upload Snyk results to GitHub Security tab
        # SEC-CI-002: pinned to SHA (was @v2)
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: snyk.sarif
        if: always()
