# =============================================================================
# NATS Server Configuration - Aquaculture Platform
# ARCH-010: Explicit JetStream stream limits to prevent silent message drops
# =============================================================================

# JetStream configuration
jetstream {
  # Storage directory (must match --store_dir in compose command)
  store_dir: /data

  # Max memory for JetStream (aligns with droplet container limit of 128MB)
  max_memory_store: 96MB

  # ARCH-031: Max disk storage for JetStream persistence.
  # All stream max_bytes values must be < this limit to prevent
  # "insufficient storage resources available" (error 10047) on restore.
  # See also: nats-event-bus.ts getStreamConfig() for stream-level limits.
  max_file_store: 2GB
}

# HTTP monitoring endpoint (internal only — port exposed to 127.0.0.1 in compose)
http_port: 8222

# Logging — use 'logtime' (no underscore) for NATS server compatibility
logtime: true

# =============================================================================
# SEC-006/SEC-019/CRITICAL-002: Per-Service NATS Accounts with Subject ACLs
#
# SECURITY (CRITICAL-002): Previously all services shared a single NATS
# user/password, allowing any compromised service to impersonate others on
# the message bus and publish to arbitrary subjects.
#
# NOW: Each service has its own account with explicit publish/subscribe ACLs.
# A compromised service can only access the subjects its account permits.
#
# Subject naming convention: AQUACULTURE_EVENTS.{eventType}.{tenantId}
# Each service can only publish events it owns and subscribe to events it needs.
#
# Credentials are injected via environment variables on the NATS container.
# Services connect using their service-specific credentials in NATS_URL.
# =============================================================================
accounts {
  # ── auth-service account ──
  auth_svc {
    users: [
      { user: $NATS_AUTH_USER, password: $NATS_AUTH_PASS }
    ]
    # auth-service publishes auth/tenant events, subscribes to its own
    publish {
      allow: [
        "AQUACULTURE_EVENTS.UserRegistered.>",
        "AQUACULTURE_EVENTS.UserLoggedIn.>",
        "AQUACULTURE_EVENTS.InvitationAccepted.>",
        "AQUACULTURE_EVENTS.PasswordResetRequested.>",
        "AQUACULTURE_EVENTS.PasswordResetCompleted.>",
        "AQUACULTURE_EVENTS.TenantCreated.>",
        "AQUACULTURE_EVENTS.TenantUpdated.>",
        "AQUACULTURE_EVENTS.TenantSuspended.>",
        "AQUACULTURE_EVENTS.TenantActivated.>",
        "AQUACULTURE_EVENTS.TenantStatusChanged.>",
        "AQUACULTURE_EVENTS.TenantModulesAssigned.>",
        "AQUACULTURE_EVENTS.UserInvited.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
    subscribe {
      allow: [
        "AQUACULTURE_EVENTS.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
  }

  # ── farm-service account ──
  farm_svc {
    users: [
      { user: $NATS_FARM_USER, password: $NATS_FARM_PASS }
    ]
    publish {
      allow: [
        "AQUACULTURE_EVENTS.BatchCreated.>",
        "AQUACULTURE_EVENTS.BatchUpdated.>",
        "AQUACULTURE_EVENTS.BatchHarvested.>",
        "AQUACULTURE_EVENTS.FeedingCompleted.>",
        "AQUACULTURE_EVENTS.WaterQualityRecorded.>",
        "AQUACULTURE_EVENTS.Farm*.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
    subscribe {
      allow: [
        "AQUACULTURE_EVENTS.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
  }

  # ── sensor-service account ──
  sensor_svc {
    users: [
      { user: $NATS_SENSOR_USER, password: $NATS_SENSOR_PASS }
    ]
    publish {
      allow: [
        "AQUACULTURE_EVENTS.SensorReading.>",
        "AQUACULTURE_EVENTS.Sensor*.>",
        "AQUACULTURE_EVENTS.DeviceProvisioned.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
    subscribe {
      allow: [
        "AQUACULTURE_EVENTS.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
  }

  # ── gateway-api account ──
  gateway_svc {
    users: [
      { user: $NATS_GATEWAY_USER, password: $NATS_GATEWAY_PASS }
    ]
    # Gateway mostly subscribes; limited publishing for audit events
    publish {
      allow: [
        "AQUACULTURE_EVENTS.Gateway*.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
    subscribe {
      allow: [
        "AQUACULTURE_EVENTS.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
  }

  # ── notification-service account ──
  notification_svc {
    users: [
      { user: $NATS_NOTIFICATION_USER, password: $NATS_NOTIFICATION_PASS }
    ]
    publish {
      allow: [
        "AQUACULTURE_EVENTS.NotificationSent.>",
        "AQUACULTURE_EVENTS.NotificationDelivered.>",
        "AQUACULTURE_EVENTS.NotificationFailed.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
    subscribe {
      allow: [
        "AQUACULTURE_EVENTS.PasswordResetRequested.>",
        "AQUACULTURE_EVENTS.UserInvited.>",
        "AQUACULTURE_EVENTS.Notification*.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
  }

  # ── billing-service account ──
  billing_svc {
    users: [
      { user: $NATS_BILLING_USER, password: $NATS_BILLING_PASS }
    ]
    publish {
      allow: [
        "AQUACULTURE_EVENTS.Subscription*.>",
        "AQUACULTURE_EVENTS.Invoice*.>",
        "AQUACULTURE_EVENTS.Payment*.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
    subscribe {
      allow: [
        "AQUACULTURE_EVENTS.TenantCreated.>",
        "AQUACULTURE_EVENTS.TenantStatusChanged.>",
        "AQUACULTURE_EVENTS.Subscription*.>",
        "AQUACULTURE_EVENTS.Invoice*.>",
        "AQUACULTURE_EVENTS.Payment*.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
  }

  # ── alert-engine account ──
  alert_svc {
    users: [
      { user: $NATS_ALERT_USER, password: $NATS_ALERT_PASS }
    ]
    publish {
      allow: [
        "AQUACULTURE_EVENTS.Alert*.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
    subscribe {
      allow: [
        "AQUACULTURE_EVENTS.SensorReading.>",
        "AQUACULTURE_EVENTS.Alert*.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
  }

  # ── hr-service account ──
  hr_svc {
    users: [
      { user: $NATS_HR_USER, password: $NATS_HR_PASS }
    ]
    publish {
      allow: [
        "AQUACULTURE_EVENTS.Employee*.>",
        "AQUACULTURE_EVENTS.Leave*.>",
        "AQUACULTURE_EVENTS.Attendance*.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
    subscribe {
      allow: [
        "AQUACULTURE_EVENTS.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
  }

  # ── messaging-service account ──
  messaging_svc {
    users: [
      { user: $NATS_MESSAGING_USER, password: $NATS_MESSAGING_PASS }
    ]
    publish {
      allow: [
        "AQUACULTURE_EVENTS.Message*.>",
        "AQUACULTURE_EVENTS.Channel*.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
    subscribe {
      allow: [
        "AQUACULTURE_EVENTS.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
  }

  # ── hydroponics-service account ──
  hydroponics_svc {
    users: [
      { user: $NATS_HYDROPONICS_USER, password: $NATS_HYDROPONICS_PASS }
    ]
    publish {
      allow: [
        "AQUACULTURE_EVENTS.Hydroponics*.>",
        "AQUACULTURE_EVENTS.GrowCycle*.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
    subscribe {
      allow: [
        "AQUACULTURE_EVENTS.>",
        "$JS.API.>",
        "_INBOX.>"
      ]
    }
  }
}

# Connection timeout for all accounts
authorization {
  timeout: 5
}

# IP-1: TLS — relative include resolves from this file's directory.
# nats-tls.conf is mounted by docker-compose at the same path as this file.
include nats-tls.conf
