# =============================================================================
# Aquaculture Platform - Secrets (Schema Template Only)
# =============================================================================
# WARNING: This file contains NO real credentials. It is a schema template only.
# All stringData blocks have been removed to prevent accidental secret commits.
#
# In production, use External Secrets Operator backed by AWS Secrets Manager or
# HashiCorp Vault. Never commit real credentials to this file.
#
# Required secrets schema:
#   aquaculture-secrets:
#     DATABASE_URL: "postgres://user:password@host:5432/db"
#     REDIS_URL: "redis://:password@host:6379"
#     JWT_PRIVATE_KEY: "<RS256 private key PEM — auth-service only>"
#     JWT_PUBLIC_KEY:  "<RS256 public key PEM — distributed to every service>"
#     PASSWORD_PEPPER: "<auth-service password pepper>"
#     MFA_ENCRYPTION_KEY: "<64 hex chars — auth-service MFA TOTP encryption>"
#
#   farm-environment-secrets:
#     SENTINEL_HUB_ENCRYPTION_KEY: "<dedicated legacy Sentinel cutover key>"
#
#   smtp-credentials:
#     SMTP_HOST: "<smtp relay hostname>"
#     SMTP_PORT: "<smtp port, e.g. 587>"
#     SMTP_USER: "<smtp username>"
#     SMTP_PASSWORD: "<smtp password>"
#
# Generate the RS256 keypair with:
#   infrastructure/docker/scripts/generate-jwt-keypair.sh
#
# To create secrets manually for development (do not commit real values):
#   kubectl create secret generic aquaculture-secrets \
#     --namespace aquaculture \
#     --from-literal=DATABASE_URL='...' \
#     --from-literal=REDIS_URL='...' \
#     --from-file=JWT_PRIVATE_KEY=./certs/jwt/private.pem \
#     --from-file=JWT_PUBLIC_KEY=./certs/jwt/public.pem
#
#   kubectl create secret generic smtp-credentials \
#     --namespace aquaculture \
#     --from-literal=SMTP_HOST='...' \
#     --from-literal=SMTP_PORT='587' \
#     --from-literal=SMTP_USER='...' \
#     --from-literal=SMTP_PASSWORD='...'
#
# Schema-only placeholder (no stringData — data must be provided externally):
apiVersion: v1
kind: Secret
metadata:
  name: aquaculture-secrets
  namespace: aquaculture
  annotations:
    # Managed by External Secrets Operator in production
    # Source: AWS Secrets Manager / HashiCorp Vault
    secrets.aquaculture.io/schema-version: "1"
type: Opaque
# data: must be provided via CI/CD, External Secrets Operator, or kubectl
# Required keys: DATABASE_URL, REDIS_URL, JWT_PRIVATE_KEY, JWT_PUBLIC_KEY
# plus PASSWORD_PEPPER and MFA_ENCRYPTION_KEY for auth-service

---
# Farm-only credential domain. Provision this Secret through the same external
# secret controller or CI bootstrap as aquaculture-secrets; no value is stored
# in Git and no other workload imports it.
apiVersion: v1
kind: Secret
metadata:
  name: farm-environment-secrets
  namespace: aquaculture
  annotations:
    secrets.aquaculture.io/schema-version: "1"
type: Opaque
# data: must be provided externally
# Required key: SENTINEL_HUB_ENCRYPTION_KEY

---
# SMTP credentials for notification-service
# Required keys: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD
apiVersion: v1
kind: Secret
metadata:
  name: smtp-credentials
  namespace: aquaculture
  annotations:
    secrets.aquaculture.io/schema-version: "1"
type: Opaque
# data: must be provided via CI/CD, External Secrets Operator, or kubectl

---
# imagePullSecret for GHCR private registry
# Create via: kubectl create secret docker-registry ghcr-pull-secret \
#   --namespace aquaculture \
#   --docker-server=ghcr.io \
#   --docker-username=<github-username> \
#   --docker-password=<github-pat>
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: aquaculture
  annotations:
    secrets.aquaculture.io/schema-version: "1"
type: kubernetes.io/dockerconfigjson
# data: must be provided at cluster bootstrap time
# .dockerconfigjson: <base64 encoded docker config JSON>
