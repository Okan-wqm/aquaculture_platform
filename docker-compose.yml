# =============================================================================
# Aquaculture Platform - Docker Compose (Development)
# Local development environment with all services
# =============================================================================

services:
  # ===========================================================================
  # Infrastructure Services
  # ===========================================================================

  postgres:
    # INFRA-CRITICAL-010: HA edition with pgvector (uniform across CI + dev + droplet + prod)
    image: timescale/timescaledb-ha:pg16@sha256:b3d038d0a0757df8a5ec0a94ba68d9ad57b0e16100a024cf4b370c77ad5645f7
    container_name: aqua-postgres
    environment:
      POSTGRES_USER: aquaculture
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      POSTGRES_DB: aquaculture
      # INFRA-CRITICAL-018: pin PGDATA to legacy path so the HA image
      # (which defaults to /home/postgres/pgdata/data) reads existing
      # volume data at /var/lib/postgresql/data uniformly across env.
      PGDATA: /var/lib/postgresql/data
      # SEC-015: Per-service DB passwords (passed to 00-init-schemas.sh)
      AUTH_SERVICE_DB_PASS: ${AUTH_SERVICE_DB_PASS:-}
      FARM_SERVICE_DB_PASS: ${FARM_SERVICE_DB_PASS:-}
      SENSOR_SERVICE_DB_PASS: ${SENSOR_SERVICE_DB_PASS:-}
      BILLING_SERVICE_DB_PASS: ${BILLING_SERVICE_DB_PASS:-}
      HR_SERVICE_DB_PASS: ${HR_SERVICE_DB_PASS:-}
      ALERT_SERVICE_DB_PASS: ${ALERT_SERVICE_DB_PASS:-}
      ADMIN_SERVICE_DB_PASS: ${ADMIN_SERVICE_DB_PASS:-}
      GATEWAY_SERVICE_DB_PASS: ${GATEWAY_SERVICE_DB_PASS:-}
      NOTIFICATION_SERVICE_DB_PASS: ${NOTIFICATION_SERVICE_DB_PASS:-}
      HYDROPONICS_SERVICE_DB_PASS: ${HYDROPONICS_SERVICE_DB_PASS:-}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aquaculture']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aqua-network

  redis:
    image: redis:7-alpine
    container_name: aqua-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-devpassword}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      # SEC-014: Use REDISCLI_AUTH env var to avoid password in process list
      test: ['CMD-SHELL', 'REDISCLI_AUTH=${REDIS_PASSWORD:-devpassword} redis-cli ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aqua-network

  nats:
    image: nats:2.10-alpine
    container_name: aqua-nats
    # Local development deliberately runs without broker identity. Production
    # uses docker-compose.droplet.yml, mTLS, and the generated cert-CN ACL
    # config. Mounting that production ACL here is invalid: anonymous local
    # clients cannot map to a cert identity.
    command: ['-js', '--store_dir', '/data', '--http_port', '8222']
    ports:
      - '4222:4222'
      # Monitoring port bound to localhost only — not accessible from LAN (SEC-009)
      - '127.0.0.1:8222:8222'
    volumes:
      - nats_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 4222 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aqua-network

  minio:
    image: minio/minio:RELEASE.2025-01-20T15-46-22Z
    container_name: aqua-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - aqua-network

  # ===========================================================================
  # Backend Microservices
  # ===========================================================================

  gateway-api:
    image: aqua-gateway:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend.simple
      args:
        SERVICE_NAME: gateway-api
    container_name: aqua-gateway
    environment:
      SERVICE_NAME: gateway-api
      NODE_ENV: development
      PORT: 3000
      GATEWAY_PORT: 3000
      # SECURITY (MEDIUM-003): per-service DB role, no shared aquaculture user.
      DATABASE_URL: postgres://gateway_service:${GATEWAY_SERVICE_DB_PASS:-devpassword}@postgres:5432/aquaculture
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379
      NATS_URL: nats://nats:4222
      # SECURITY (CRITICAL-001): RS256 public-key verification (consumer only).
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
      AUTH_SERVICE_URL: http://auth-service:3000/graphql
      FARM_SERVICE_URL: http://farm-service:3000/graphql
      SENSOR_SERVICE_URL: http://sensor-service:3000/graphql
      ALERT_SERVICE_URL: http://alert-engine:3000/graphql
      HR_SERVICE_URL: http://hr-service:3000/graphql
      BILLING_SERVICE_URL: http://billing-service:3000/graphql
      NOTIFICATION_SERVICE_URL: http://notification-service:3000/graphql
      HYDROPONICS_SERVICE_URL: http://hydroponics-service:3000/graphql
      CONFIG_SERVICE_URL: http://config-service:3000/graphql
      MESSAGING_SERVICE_URL: http://messaging-service:3000/graphql
      # MinIO Storage Configuration
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-aquaculture}
      MINIO_REGION: us-east-1
      # OpenTelemetry Tracing
      ENABLE_TRACING: ${ENABLE_TRACING:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Backend services: use service_started so a slow/unhealthy service
      # does not deadlock the entire stack. The gateway's federation layer
      # handles service unavailability at request time.
      auth-service:
        condition: service_started
      farm-service:
        condition: service_started
      sensor-service:
        condition: service_started
      alert-engine:
        condition: service_started
      hr-service:
        condition: service_started
      hydroponics-service:
        condition: service_started
      billing-service:
        condition: service_started
      config-service:
        condition: service_started
    networks:
      - aqua-network
    restart: unless-stopped
    # ARCH-007: Resource limits prevent a runaway service from OOM-ing the host
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  auth-service:
    image: aqua-auth:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend.simple
      args:
        SERVICE_NAME: auth-service
    container_name: aqua-auth
    environment:
      SERVICE_NAME: auth-service
      NODE_ENV: development
      PORT: 3000
      AUTH_SERVICE_PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      # SECURITY (MEDIUM-003): per-service DB role, no shared aquaculture user.
      DATABASE_USER: auth_service
      DATABASE_PASSWORD: ${AUTH_SERVICE_DB_PASS:-devpassword}
      DATABASE_NAME: aquaculture
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379
      NATS_URL: nats://nats:4222
      # SECURITY (CRITICAL-001): auth-service is the sole token issuer.
      # In dev, ALLOW_DEV_JWT_SECRET=true permits HS256 with DEV_JWT_SECRET
      # when RS256 keys are not mounted; production paths require RS256.
      JWT_PRIVATE_KEY_PATH: /var/run/jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
      ALLOW_DEV_JWT_SECRET: 'true'
      DEV_JWT_SECRET: '${DEV_JWT_SECRET:-dev-secret-change-me-at-least-32-chars-long}'
      JWT_EXPIRES_IN: 1h
      REFRESH_TOKEN_EXPIRES_IN: 7d
      # OpenTelemetry Tracing
      ENABLE_TRACING: ${ENABLE_TRACING:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - '3001:3000'
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - aqua-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  config-service:
    image: aqua-config:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend.simple
      args:
        SERVICE_NAME: config-service
    container_name: aqua-config
    environment:
      SERVICE_NAME: config-service
      NODE_ENV: development
      PORT: 3000
      CONFIG_SERVICE_PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: aquaculture
      DATABASE_PASSWORD: ${DB_PASSWORD:-devpassword}
      DATABASE_NAME: aquaculture
      DATABASE_SCHEMA: config
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379
      NATS_URL: nats://nats:4222
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
      CONFIG_ENCRYPTION_KEY: '${CONFIG_ENCRYPTION_KEY:?CONFIG_ENCRYPTION_KEY is required}'
      SERVICE_IDENTITY_SIGNING_SECRET: '${SERVICE_IDENTITY_SIGNING_SECRET:-local-dev-only-change-me}'
    ports:
      - '3007:3000'
    volumes:
      - ./certs/jwt/public.pem:/var/run/jwt/public.pem:ro
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - aqua-network
    restart: unless-stopped

  farm-service:
    image: aqua-farm:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend.simple
      args:
        SERVICE_NAME: farm-service
    container_name: aqua-farm
    environment:
      SERVICE_NAME: farm-service
      NODE_ENV: development
      PORT: 3000
      FARM_SERVICE_PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      # SECURITY (MEDIUM-003): per-service DB role.
      DATABASE_USER: farm_service
      DATABASE_PASSWORD: ${FARM_SERVICE_DB_PASS:-devpassword}
      DATABASE_NAME: aquaculture
      DATABASE_SCHEMA: farm
      DATABASE_LOGGING: 'true'
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379
      NATS_URL: nats://nats:4222
      # SEC-NEW08: Encryption key must be unique per environment — generate with: openssl rand -base64 32
      ENCRYPTION_KEY: '${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}'
      # Legacy tenant credential cutover decrypts existing rows before config-service becomes the only SSoT.
      SENTINEL_HUB_ENCRYPTION_KEY: '${SENTINEL_HUB_ENCRYPTION_KEY:?SENTINEL_HUB_ENCRYPTION_KEY is required during credential cutover}'
      FARM_ENVIRONMENT_MONITORING_ENABLED: '${FARM_ENVIRONMENT_MONITORING_ENABLED:-false}'
      MET_NORWAY_APPLICATION_NAME: '${MET_NORWAY_APPLICATION_NAME:-}'
      MET_NORWAY_CONTACT: '${MET_NORWAY_CONTACT:-}'
      MET_NORWAY_FROST_CLIENT_ID: '${MET_NORWAY_FROST_CLIENT_ID:-}'
      SERVICE_IDENTITY_SIGNING_SECRET: '${SERVICE_IDENTITY_SIGNING_SECRET:-local-dev-only-change-me}'
      FARM_SEED_ENABLED: 'false'
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      config-service:
        condition: service_healthy
    networks:
      - aqua-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  sensor-service:
    image: aqua-sensor:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend.simple
      args:
        SERVICE_NAME: sensor-service
    container_name: aqua-sensor
    environment:
      SERVICE_NAME: sensor-service
      NODE_ENV: development
      PORT: 3000
      SENSOR_SERVICE_PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      # SECURITY (MEDIUM-003): per-service DB role.
      DATABASE_USER: sensor_service
      DATABASE_PASSWORD: ${SENSOR_SERVICE_DB_PASS:-devpassword}
      DATABASE_NAME: aquaculture
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379
      NATS_URL: nats://nats:4222
      MQTT_ENABLED: 'true'
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-aqua-sensor-service-ingress}
      MQTT_DURABLE_INGRESS_ENABLED: 'true'
      # ARCH-019: Use container name (aqua-mosquitto) not host.docker.internal
      # Requires simulator stack to be on the same Docker network (aqua-network)
      # Start simulators: docker compose -f infrastructure/simulators/docker-compose.simulators.yml up -d
      MQTT_BROKER_URL: mqtt://aqua-mosquitto:1883
      # OpenTelemetry Tracing
      ENABLE_TRACING: ${ENABLE_TRACING:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - aqua-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  alert-engine:
    image: aqua-alert:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend.simple
      args:
        SERVICE_NAME: alert-engine
    container_name: aqua-alert
    environment:
      SERVICE_NAME: alert-engine
      NODE_ENV: development
      PORT: 3000
      ALERT_ENGINE_PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      # SECURITY (MEDIUM-003): per-service DB role.
      DATABASE_USER: alert_service
      DATABASE_PASSWORD: ${ALERT_SERVICE_DB_PASS:-devpassword}
      DATABASE_NAME: aquaculture
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379
      NATS_URL: nats://nats:4222
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - aqua-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  billing-service:
    image: aqua-billing:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend.simple
      args:
        SERVICE_NAME: billing-service
    container_name: aqua-billing
    environment:
      SERVICE_NAME: billing-service
      NODE_ENV: development
      PORT: 3000
      BILLING_SERVICE_PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      # SECURITY (MEDIUM-003): per-service DB role.
      DATABASE_USER: billing_service
      DATABASE_PASSWORD: ${BILLING_SERVICE_DB_PASS:-devpassword}
      DATABASE_NAME: aquaculture
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379
      NATS_URL: nats://nats:4222
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - aqua-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  hr-service:
    image: aqua-hr:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend.simple
      args:
        SERVICE_NAME: hr-service
    container_name: aqua-hr
    environment:
      SERVICE_NAME: hr-service
      NODE_ENV: development
      PORT: 3000
      HR_SERVICE_PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      # SECURITY (MEDIUM-003): per-service DB role.
      DATABASE_USER: hr_service
      DATABASE_PASSWORD: ${HR_SERVICE_DB_PASS:-devpassword}
      DATABASE_NAME: aquaculture
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379
      NATS_URL: nats://nats:4222
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - aqua-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  hydroponics-service:
    image: aqua-hydroponics:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend.simple
      args:
        SERVICE_NAME: hydroponics-service
    container_name: aqua-hydroponics
    environment:
      SERVICE_NAME: hydroponics-service
      NODE_ENV: development
      PORT: 3000
      HYDROPONICS_SERVICE_PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      # SECURITY (MEDIUM-003): per-service DB role.
      DATABASE_USER: hydroponics_service
      DATABASE_PASSWORD: ${HYDROPONICS_SERVICE_DB_PASS:-devpassword}
      DATABASE_NAME: aquaculture
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379
      NATS_URL: nats://nats:4222
      # SECURITY (CRITICAL-001): RS256 public-key verification.
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - aqua-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  notification-service:
    image: aqua-notification:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend.simple
      args:
        SERVICE_NAME: notification-service
    container_name: aqua-notification
    environment:
      SERVICE_NAME: notification-service
      NODE_ENV: development
      PORT: 3000
      NOTIFICATION_SERVICE_PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      # SECURITY (MEDIUM-003): per-service DB role.
      DATABASE_USER: notification_service
      DATABASE_PASSWORD: ${NOTIFICATION_SERVICE_DB_PASS:-devpassword}
      DATABASE_NAME: aquaculture
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379
      NATS_URL: nats://nats:4222
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - aqua-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  messaging-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/messaging-service:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend.simple
      args:
        SERVICE_NAME: messaging-service
    container_name: aqua-messaging
    environment:
      SERVICE_NAME: messaging-service
      NODE_ENV: development
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      # SECURITY (MEDIUM-003): per-service DB role.
      DATABASE_USER: messaging_service
      DATABASE_PASSWORD: ${MESSAGING_SERVICE_DB_PASS:-devpassword}
      DATABASE_NAME: aquaculture
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devpassword}
      REDIS_DB: '3'
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      # SEC-NEW07: JWT secret must be unique per environment — generate with: openssl rand -base64 48
      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET is required}'
      NODE_OPTIONS: '--max-old-space-size=384'
    healthcheck:
      # ARCH-HC-001: Use /health/live for Docker liveness (consistent with all other services)
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - aqua-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  admin-api-service:
    image: aqua-admin-api:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend.simple
      args:
        SERVICE_NAME: admin-api-service
    container_name: aqua-admin-api
    environment:
      SERVICE_NAME: admin-api-service
      NODE_ENV: development
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      # SECURITY (MEDIUM-003): per-service DB role.
      DATABASE_USER: admin_service
      DATABASE_PASSWORD: ${ADMIN_SERVICE_DB_PASS:-devpassword}
      DATABASE_NAME: aquaculture
      DATABASE_SCHEMA: admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379
      NATS_URL: nats://nats:4222
      # Admin report artifacts use shared object storage; keep the endpoint
      # explicit so containerized deploys never fall back to localhost.
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-aquaculture}
      MINIO_REGION: us-east-1
      # SEC-NEW07: JWT secret must be unique per environment — generate with: openssl rand -base64 48
      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET is required}'
    ports:
      - '3008:3000'
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - aqua-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # ===========================================================================
  # Frontend Services (Module Federation)
  # ===========================================================================

  shell:
    image: aqua-shell:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.shell
    container_name: aqua-shell
    environment:
      DASHBOARD_URL: http://dashboard:80
      FARM_MODULE_URL: http://farm-module:80
      HR_MODULE_URL: http://hr-module:80
      SENSOR_MODULE_URL: http://sensor-module:80
      HYDROPONICS_MODULE_URL: http://hydroponics-module:80
      ADMIN_PANEL_URL: http://admin-panel:80
      TENANT_ADMIN_URL: http://tenant-admin:80
    ports:
      - '8080:80'
    # ARCH-016: Use service_healthy so shell waits for MFE nginx to be ready
    depends_on:
      dashboard:
        condition: service_healthy
      farm-module:
        condition: service_healthy
      hr-module:
        condition: service_healthy
      sensor-module:
        condition: service_healthy
      hydroponics-module:
        condition: service_healthy
      admin-panel:
        condition: service_healthy
      tenant-admin:
        condition: service_healthy
    networks:
      - aqua-network
    restart: unless-stopped

  dashboard:
    image: aqua-dashboard:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
      args:
        MODULE_PATH: web/modules/dashboard
    container_name: aqua-dashboard
    networks:
      - aqua-network
    restart: unless-stopped

  farm-module:
    image: aqua-farm-module:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
      args:
        MODULE_PATH: web/modules/farm-module
    container_name: aqua-farm-module
    networks:
      - aqua-network
    restart: unless-stopped

  admin-panel:
    image: aqua-admin-panel:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
      args:
        MODULE_PATH: web/modules/admin-panel
    container_name: aqua-admin-panel
    networks:
      - aqua-network
    restart: unless-stopped

  tenant-admin:
    image: aqua-tenant-admin:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
      args:
        MODULE_PATH: web/modules/tenant-admin
    container_name: aqua-tenant-admin
    networks:
      - aqua-network
    restart: unless-stopped

  hr-module:
    image: aqua-hr-module:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
      args:
        MODULE_PATH: web/modules/hr-module
    container_name: aqua-hr-module
    networks:
      - aqua-network
    restart: unless-stopped

  hydroponics-module:
    image: aqua-hydroponics-module:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
      args:
        MODULE_PATH: web/modules/hydroponics-module
    container_name: aqua-hydroponics-module
    networks:
      - aqua-network
    restart: unless-stopped

  sensor-module:
    image: aqua-sensor-module:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
      args:
        MODULE_PATH: web/modules/sensor-module
    container_name: aqua-sensor-module
    networks:
      - aqua-network
    restart: unless-stopped

  # ===========================================================================
  # Observability
  # ===========================================================================

  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: aqua-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      # Jaeger UI
      - '16686:16686'
      # OTLP HTTP receiver (used by OpenTelemetry SDK in services)
      - '4318:4318'
    networks:
      - aqua-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ===========================================================================
  # Development Tools
  # ===========================================================================

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: aqua-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - aqua-network

  adminer:
    image: adminer:4.8.1
    container_name: aqua-adminer
    # SEC-024: Bind to localhost only — not accessible from LAN
    ports:
      - '127.0.0.1:8081:8080'
    depends_on:
      - postgres
    networks:
      - aqua-network

  # ===========================================================================
  # Mobile App (AquaMobil PWA)
  # ===========================================================================

  aquamobil:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.aquamobil
    container_name: aqua-mobile
    ports:
      - '8090:80'
    depends_on:
      gateway-api:
        condition: service_healthy
    networks:
      - aqua-network
    restart: unless-stopped

# =============================================================================
# Networks
# =============================================================================
networks:
  aqua-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:
