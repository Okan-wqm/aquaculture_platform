# =============================================================================
# Aquaculture Platform - Production Docker Compose
# DigitalOcean Droplet Deployment
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# =============================================================================

# =============================================================================
# Networks
# =============================================================================
networks:
  aqua-network:
    driver: bridge
  aqua-internal:
    driver: bridge
    internal: true

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
  redis_data:
  nats_data:
  backup_data:

# =============================================================================
# Services
# =============================================================================
services:
  # ===========================================================================
  # Infrastructure Services
  # ===========================================================================

  # PostgreSQL with TimescaleDB
  postgres:
    # INFRA-CRITICAL-010: HA edition with pgvector (uniform across CI + dev + droplet + prod).
    # Pinned 2026-04-19. To update: verify changelog at https://github.com/timescale/timescaledb/releases AND
    # https://hub.docker.com/r/timescale/timescaledb-ha for the new digest, test in staging first.
    image: timescale/timescaledb-ha:pg16@sha256:b3d038d0a0757df8a5ec0a94ba68d9ad57b0e16100a024cf4b370c77ad5645f7
    container_name: aqua-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquaculture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-aquaculture}
      # INFRA-CRITICAL-018: pin PGDATA to legacy path so the HA image
      # (which defaults to /home/postgres/pgdata/data) reads existing
      # volume data at /var/lib/postgresql/data uniformly across env.
      PGDATA: /var/lib/postgresql/data
      POSTGRES_SSL: 'on'
    command: >
      postgres
      -c ssl=on
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./certs/postgres:/var/lib/postgresql/ssl:ro
    networks:
      - aqua-internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aquaculture}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    # Pinned 2026-04-05. To update: verify changelog at https://github.com/redis/redis/releases, test in staging first.
    image: redis:7.2.7-alpine
    container_name: aqua-redis
    restart: unless-stopped
    # IP-1: TLS via redis-tls.conf
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data:/data
      - ./infrastructure/docker/redis/redis-tls.conf:/etc/redis/redis.conf:ro
      - ./certs/redis:/etc/redis/certs:ro
    networks:
      - aqua-internal
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli --tls --cacert /etc/redis/certs/ca-cert.pem ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # NATS Message Broker
  nats:
    # Pinned 2026-04-05. To update: verify changelog at https://github.com/nats-io/nats-server/releases, test in staging first.
    image: nats:2.10.24-alpine
    container_name: aqua-nats
    restart: unless-stopped
    # ARCH-010/ARCH-018: Use config file for explicit JetStream limits + http_port
    # The config file enables http_port 8222 (required for /healthz endpoint below)
    command: ['--config', '/etc/nats/nats.conf']
    # ADR-015: NATS container has NO per-service user/password env vars.
    # The authorization{} block in nats.conf uses LITERAL user names
    # (generated from infrastructure/nats/services.yaml) with no
    # $-interpolation and no password fields. Identity comes from the
    # client cert CN via verify_and_map: true in nats-tls-enabled.conf.
    # This file kept in lockstep with docker-compose.droplet.yml — the
    # authoritative production compose — to prevent drift between the
    # two entry points (scripts/deploy-do.sh still references prod.yml).
    volumes:
      - nats_data:/data
      - ./infrastructure/docker/nats/nats.conf:/etc/nats/nats.conf:ro
      - ./infrastructure/docker/nats/nats-tls-enabled.conf:/etc/nats/nats-tls.conf:ro
      - ./certs/nats:/etc/nats/certs:ro
    networks:
      - aqua-internal
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8222/healthz']
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # aqua-db-migrate: One-shot schema migration runner.
  # WS10 / ADR-016 Phase E — Phase 1 (backward-compatible).
  #
  # Runs all pending schema migrations in deterministic order BEFORE any
  # backend service container starts. Uses the same search_path pinning +
  # per-migration transaction invariants as createMigrationRunnerService
  # so its behavior is identical to per-service runners.
  #
  # Phase 1 is backward-compatible: per-service runners stay in place. If
  # this container fails, services still boot via their own runners
  # (idempotent — they observe "all migrations applied" and proceed).
  # Phase 2 (TRACKED-DEPLOY-003) removes per-service runners after
  # WS9 staging validation.
  # ===========================================================================
  db-migrate:
    image: ghcr.io/okan-wqm/aquaculture_platform/db-migrate:${TAG:-latest}
    container_name: aqua-db-migrate
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-aquaculture}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DATABASE_MIGRATIONS_RUN: 'true'
      DATABASE_SSL: 'false'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aqua-internal

  # ===========================================================================
  # Backend Services (from GHCR)
  # ===========================================================================

  gateway-api:
    image: ghcr.io/okan-wqm/aquaculture_platform/gateway-api:${TAG:-latest}
    container_name: aqua-gateway
    restart: unless-stopped
    environment:
      SERVICE_NAME: gateway-api
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://gateway_service:${GATEWAY_SERVICE_DB_PASS:?GATEWAY_SERVICE_DB_PASS is required}@postgres:5432/${POSTGRES_DB:-aquaculture}?sslmode=require
      DB_MIGRATE_AUTHORITATIVE: 'true'
      DATABASE_MIGRATIONS_RUN: 'false'
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: tls://nats:4222
      # SECURITY (HIGH-002): mTLS required — NATS server runs with verify: true.
      NATS_TLS_ENABLED: 'true'
      NATS_TLS_CA: /etc/ssl/nats/ca-cert.pem
      # SECURITY (HIGH-002 / V4): per-service mTLS — CN=gateway_service maps to NATS user.
      NATS_TLS_CERT: /etc/ssl/nats/clients/gateway_service-cert.pem
      NATS_TLS_KEY: /etc/ssl/nats/clients/gateway_service-key.pem
      # SECURITY (HIGH-001): gateway-api authenticates to NATS with its own account.
      # Subject ACLs in nats.conf restrict what gateway can publish/subscribe.
      # SECURITY (CRITICAL-001): consumer — verifies tokens with RS256 public key.
      # JWT_SECRET removed; auth-service holds the private key exclusively.
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      # Service URLs for federation
      AUTH_SERVICE_URL: http://auth-service:3000/graphql
      FARM_SERVICE_URL: http://farm-service:3000/graphql
      SENSOR_SERVICE_URL: http://sensor-service:3000/graphql
      HR_SERVICE_URL: http://hr-service:3000/graphql
      BILLING_SERVICE_URL: http://billing-service:3000/graphql
      ALERT_SERVICE_URL: http://alert-engine:3000/graphql
      HYDROPONICS_SERVICE_URL: http://hydroponics-service:3000/graphql
      CONFIG_SERVICE_URL: http://config-service:3000/graphql
      ADMIN_SERVICE_URL: http://admin-api-service:3000/graphql
    volumes:
      - ./certs/jwt/public.pem:/var/run/jwt/public.pem:ro
      # SECURITY (HIGH-002): NATS mTLS — CA plus this service's dedicated cert/key only.
      - ./certs/nats/ca-cert.pem:/etc/ssl/nats/ca-cert.pem:ro
      - ./certs/nats/clients/gateway_service-cert.pem:/etc/ssl/nats/clients/gateway_service-cert.pem:ro
      - ./certs/nats/clients/gateway_service-key.pem:/etc/ssl/nats/clients/gateway_service-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      # WS10: ADR-016 Phase E Phase 1 — schema pre-applied by aqua-db-migrate.
      db-migrate:
        condition: service_completed_successfully
    networks:
      - aqua-network
      - aqua-internal
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3

  auth-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/auth-service:${TAG:-latest}
    container_name: aqua-auth
    restart: unless-stopped
    environment:
      SERVICE_NAME: auth-service
      NODE_ENV: production
      # DEPLOY-HIGH-016: origin of every e-mailed invitation / reset link.
      FRONTEND_URL: ${FRONTEND_URL:-https://app.suderra.com}
      PORT: 3000
      DATABASE_URL: postgres://auth_service:${AUTH_SERVICE_DB_PASS:?AUTH_SERVICE_DB_PASS is required}@postgres:5432/${POSTGRES_DB:-aquaculture}?sslmode=require
      DB_MIGRATE_AUTHORITATIVE: 'true'
      DATABASE_MIGRATIONS_RUN: 'false'
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: tls://nats:4222
      # SECURITY (HIGH-002): mTLS required — NATS server runs with verify: true.
      NATS_TLS_ENABLED: 'true'
      NATS_TLS_CA: /etc/ssl/nats/ca-cert.pem
      # SECURITY (HIGH-002 / V4): per-service mTLS — CN=auth_service maps to NATS user.
      NATS_TLS_CERT: /etc/ssl/nats/clients/auth_service-cert.pem
      NATS_TLS_KEY: /etc/ssl/nats/clients/auth_service-key.pem
      # SECURITY (HIGH-001): auth-service NATS account — matches nats.conf $NATS_AUTH_USER block.
      # SECURITY (CRITICAL-001): auth-service is the sole token issuer.
      # Private key for signing; public key also loaded so it can verify its own tokens.
      # JWT_SECRET removed — RS256 asymmetric signing replaces the shared HS256 secret.
      JWT_PRIVATE_KEY_PATH: /var/run/jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      # SECURITY (HIGH-006): server-side password pepper, kept out of the DB.
      # Generate with: openssl rand -base64 48
      PASSWORD_PEPPER: '${PASSWORD_PEPPER:?PASSWORD_PEPPER is required}'
      # MFA encryption key for TOTP secrets. Generate with: openssl rand -hex 32
      MFA_ENCRYPTION_KEY: '${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}'
    volumes:
      - ./certs/jwt:/var/run/jwt:ro
      # SECURITY (HIGH-002): NATS mTLS — CA plus auth-service's dedicated cert/key only.
      - ./certs/nats/ca-cert.pem:/etc/ssl/nats/ca-cert.pem:ro
      - ./certs/nats/clients/auth_service-cert.pem:/etc/ssl/nats/clients/auth_service-cert.pem:ro
      - ./certs/nats/clients/auth_service-key.pem:/etc/ssl/nats/clients/auth_service-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # WS10: ADR-016 Phase E Phase 1 — schema pre-applied by aqua-db-migrate.
      db-migrate:
        condition: service_completed_successfully
    networks:
      - aqua-internal
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3

  farm-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/farm-service:${TAG:-latest}
    container_name: aqua-farm
    restart: unless-stopped
    environment:
      SERVICE_NAME: farm-service
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://farm_service:${FARM_SERVICE_DB_PASS:?FARM_SERVICE_DB_PASS is required}@postgres:5432/${POSTGRES_DB:-aquaculture}?sslmode=require
      DB_MIGRATE_AUTHORITATIVE: 'true'
      DATABASE_MIGRATIONS_RUN: 'false'
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: tls://nats:4222
      # SECURITY (HIGH-002): mTLS required — NATS server runs with verify: true.
      NATS_TLS_ENABLED: 'true'
      NATS_TLS_CA: /etc/ssl/nats/ca-cert.pem
      # SECURITY (HIGH-002 / V4): per-service mTLS — CN=farm_service maps to NATS user.
      NATS_TLS_CERT: /etc/ssl/nats/clients/farm_service-cert.pem
      NATS_TLS_KEY: /etc/ssl/nats/clients/farm_service-key.pem
      # SECURITY (HIGH-001): farm-service NATS account with farm-scoped subject ACLs.
      # SECURITY (CRITICAL-001): RS256 public-key verification (consumer only).
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      # The legacy encrypted tenant rows are decrypted once during the
      # blocking credential cutover before config-service becomes the only
      # provider-credential authority.
      SENTINEL_HUB_ENCRYPTION_KEY: ${SENTINEL_HUB_ENCRYPTION_KEY:?SENTINEL_HUB_ENCRYPTION_KEY is required during credential cutover}
      FARM_ENVIRONMENT_MONITORING_ENABLED: ${FARM_ENVIRONMENT_MONITORING_ENABLED:-false}
      MET_NORWAY_APPLICATION_NAME: ${MET_NORWAY_APPLICATION_NAME:-}
      MET_NORWAY_CONTACT: ${MET_NORWAY_CONTACT:-}
      MET_NORWAY_FROST_CLIENT_ID: ${MET_NORWAY_FROST_CLIENT_ID:-}
      SERVICE_IDENTITY_KEYRING: ${SERVICE_IDENTITY_KEYRING:?SERVICE_IDENTITY_KEYRING required}
      SERVICE_IDENTITY_SIGNING_KID: ${SERVICE_IDENTITY_SIGNING_KID:?SERVICE_IDENTITY_SIGNING_KID required}
    volumes:
      - ./certs/jwt/public.pem:/var/run/jwt/public.pem:ro
      # SECURITY (HIGH-002): NATS mTLS — CA plus this service's dedicated cert/key only.
      - ./certs/nats/ca-cert.pem:/etc/ssl/nats/ca-cert.pem:ro
      - ./certs/nats/clients/farm_service-cert.pem:/etc/ssl/nats/clients/farm_service-cert.pem:ro
      - ./certs/nats/clients/farm_service-key.pem:/etc/ssl/nats/clients/farm_service-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      config-service:
        condition: service_healthy
      # WS10: ADR-016 Phase E Phase 1 — schema pre-applied by aqua-db-migrate.
      db-migrate:
        condition: service_completed_successfully
    networks:
      - aqua-internal
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3

  # Company-owned runtime configuration and encrypted provider-credential
  # SSoT. farm-service deliberately waits for this health boundary before its
  # blocking legacy credential cutover and environmental scheduler bootstrap.
  config-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/config-service:${TAG:-latest}
    container_name: aqua-config
    restart: unless-stopped
    environment:
      SERVICE_NAME: config-service
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${CONFIG_SERVICE_DB_USER:-config_service}
      DATABASE_PASSWORD: ${CONFIG_SERVICE_DB_PASS:?CONFIG_SERVICE_DB_PASS is required}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DB_MIGRATE_AUTHORITATIVE: 'true'
      DATABASE_MIGRATIONS_RUN: 'false'
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: tls://nats:4222
      NATS_TLS_ENABLED: 'true'
      NATS_TLS_CA: /etc/ssl/nats/ca-cert.pem
      NATS_TLS_CERT: /etc/ssl/nats/clients/config_service-cert.pem
      NATS_TLS_KEY: /etc/ssl/nats/clients/config_service-key.pem
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?CONFIG_ENCRYPTION_KEY is required}
      SERVICE_IDENTITY_KEYRING: ${SERVICE_IDENTITY_KEYRING:?SERVICE_IDENTITY_KEYRING required}
      SERVICE_IDENTITY_SIGNING_KID: ${SERVICE_IDENTITY_SIGNING_KID:?SERVICE_IDENTITY_SIGNING_KID required}
    volumes:
      - ./certs/jwt/public.pem:/var/run/jwt/public.pem:ro
      - ./certs/nats/ca-cert.pem:/etc/ssl/nats/ca-cert.pem:ro
      - ./certs/nats/clients/config_service-cert.pem:/etc/ssl/nats/clients/config_service-cert.pem:ro
      - ./certs/nats/clients/config_service-key.pem:/etc/ssl/nats/clients/config_service-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - aqua-internal
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3

  sensor-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/sensor-service:${TAG:-latest}
    container_name: aqua-sensor
    restart: unless-stopped
    environment:
      SERVICE_NAME: sensor-service
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://sensor_service:${SENSOR_SERVICE_DB_PASS:?SENSOR_SERVICE_DB_PASS is required}@postgres:5432/${POSTGRES_DB:-aquaculture}?sslmode=require
      DB_MIGRATE_AUTHORITATIVE: 'true'
      DATABASE_MIGRATIONS_RUN: 'false'
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: tls://nats:4222
      # SECURITY (HIGH-002): mTLS required — NATS server runs with verify: true.
      NATS_TLS_ENABLED: 'true'
      NATS_TLS_CA: /etc/ssl/nats/ca-cert.pem
      # SECURITY (HIGH-002 / V4): per-service mTLS — CN=sensor_service maps to NATS user.
      NATS_TLS_CERT: /etc/ssl/nats/clients/sensor_service-cert.pem
      NATS_TLS_KEY: /etc/ssl/nats/clients/sensor_service-key.pem
      # SECURITY (HIGH-001): sensor-service NATS account with sensor-scoped subject ACLs.
      # SECURITY (CRITICAL-001): RS256 public-key verification (consumer only).
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
      # ADR-022 — production stays on `legacy` until the staging soak
      # (24h) on control-plane is green. Flip to `control-plane` via
      # the prod .env once the equivalence test passes for every
      # tenant in the per-tenant IngestBackend rollout (ADR-027).
      SENSOR_SERVICE_PROFILE: ${SENSOR_SERVICE_PROFILE:-legacy}
    volumes:
      - ./certs/jwt/public.pem:/var/run/jwt/public.pem:ro
      # SECURITY (HIGH-002): NATS mTLS — CA plus this service's dedicated cert/key only.
      - ./certs/nats/ca-cert.pem:/etc/ssl/nats/ca-cert.pem:ro
      - ./certs/nats/clients/sensor_service-cert.pem:/etc/ssl/nats/clients/sensor_service-cert.pem:ro
      - ./certs/nats/clients/sensor_service-key.pem:/etc/ssl/nats/clients/sensor_service-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # WS10: ADR-016 Phase E Phase 1 — schema pre-applied by aqua-db-migrate.
      db-migrate:
        condition: service_completed_successfully
    networks:
      - aqua-internal
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/health/live']
      interval: 30s
      timeout: 10s
      retries: 3

  # Rust ingestion sidecar — ADR-025 / ADR-027 — INTENTIONALLY NOT DEPLOYED IN PROD.
  #
  # HONESTY GATE (sensor-ingestion-honest-deployment invariant): the Faz-3
  # orchestrator wiring did NOT survive the train merge — `apps/sensor-ingestion/
  # src/main.rs` `drain_mqtt_stream` is still a `tracing::trace!("mqtt msg (stub
  # drain)")` no-op with no PostgresSink / publisher loop, so the binary compiles
  # and per-module unit tests pass while the deployed sidecar would DROP every MQTT
  # message. Advertising it here as a "co-equal producer of
  # events.{tenantId}.SensorReading" was false redundancy.
  #
  # This service is therefore commented out of prod until the drain is wired
  # (drain → topic::parse → cache → payload::validate → batch → PostgresSink::copy
  # → NatsEventPublisher). Owned by the sensor-rust-migration initiative; see
  # docs/plans/sensor-rust-migration/PROGRESS.md (Faz-3 row reopened). Re-enabling
  # before the stub is replaced is blocked by the invariant.
  #
  # sensor-ingestion:
  #   image: ghcr.io/okan-wqm/aquaculture_platform/sensor-ingestion:${TAG:-latest}
  #   container_name: aqua-sensor-ingestion
  #   restart: unless-stopped
  #   user: '65532:65532'
  #   environment:
  #     RUST_LOG: ${SENSOR_INGESTION_LOG:-info}
  #     SENSOR_INGESTION_CONFIG: /etc/sensor-ingestion/config.toml
  #   volumes:
  #     - ./infrastructure/sensor-ingestion/config.toml:/etc/sensor-ingestion/config.toml:ro
  #     - ./certs/sensor-ingestion:/etc/sensor-ingestion/certs:ro
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - aqua-internal
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 256M
  #         cpus: '0.35'
  #       reservations:
  #         memory: 192M
  #         cpus: '0.25'

  hr-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/hr-service:${TAG:-latest}
    container_name: aqua-hr
    restart: unless-stopped
    environment:
      SERVICE_NAME: hr-service
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://hr_service:${HR_SERVICE_DB_PASS:?HR_SERVICE_DB_PASS is required}@postgres:5432/${POSTGRES_DB:-aquaculture}?sslmode=require
      DB_MIGRATE_AUTHORITATIVE: 'true'
      DATABASE_MIGRATIONS_RUN: 'false'
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: tls://nats:4222
      # SECURITY (HIGH-002): mTLS required — NATS server runs with verify: true.
      NATS_TLS_ENABLED: 'true'
      NATS_TLS_CA: /etc/ssl/nats/ca-cert.pem
      # SECURITY (HIGH-002 / V4): per-service mTLS — CN=hr_service maps to NATS user.
      NATS_TLS_CERT: /etc/ssl/nats/clients/hr_service-cert.pem
      NATS_TLS_KEY: /etc/ssl/nats/clients/hr_service-key.pem
      # SECURITY (HIGH-001): hr-service NATS account with HR-scoped subject ACLs.
      # SECURITY (CRITICAL-001): RS256 public-key verification (consumer only).
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
    volumes:
      - ./certs/jwt/public.pem:/var/run/jwt/public.pem:ro
      # SECURITY (HIGH-002): NATS mTLS — CA plus this service's dedicated cert/key only.
      - ./certs/nats/ca-cert.pem:/etc/ssl/nats/ca-cert.pem:ro
      - ./certs/nats/clients/hr_service-cert.pem:/etc/ssl/nats/clients/hr_service-cert.pem:ro
