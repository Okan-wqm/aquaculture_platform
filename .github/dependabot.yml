# Dependabot configuration.
#
# Purpose: keep 20+ SHA-pinned GitHub Actions workflows from silent rot.
# Every `uses: org/action@<40-char-sha>` in .github/workflows/** is pinned
# for supply-chain integrity; without dependabot tracking, pins age out and
# eventually reference unmaintained or vulnerable versions.
#
# See /root/.claude/plans/declarative-riding-shamir.md INFRA-3 (Round 3).

version: 2

updates:
  # ── GitHub Actions ────────────────────────────────────────────────
  # Weekly PRs bumping pinned SHAs to latest verified release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels:
      - dependencies
      - github-actions
    reviewers:
      - Okan-wqm
    # Group minor + patch bumps into one PR per action to reduce noise;
    # major bumps stay individual so review can assess breaking changes.
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # ── Rust / Cargo (workspace) ──────────────────────────────────────
  # Weekly PRs for the Rust workspace Cargo.toml + every crate/**
  # Cargo.toml in the monorepo. sensor-ingestion + the shared crates
  # under crates/** inherit this automation; the sens-api-gateway
  # edge tree keeps its own deny.toml allowlist and manages its own
  # cadence, so directory: / (monorepo root Cargo.toml virtual
  # workspace) is the single entry here. Rust advisories (RUSTSEC)
  # are handled by cargo-audit in rust-ci.yml + .cargo/audit.toml;
  # dependabot handles non-advisory version bumps to keep Cargo.lock
  # from drifting into unsupported releases.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels:
      - dependencies
      - rust
    reviewers:
      - Okan-wqm
    # Same grouping discipline as actions: minor+patch together,
    # major isolated. Cargo semver carries the same breaking-change
    # risk, so review can triage per-major.
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
