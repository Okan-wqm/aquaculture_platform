# =============================================================================
# Aquaculture Platform - Helm Chart
# =============================================================================
apiVersion: v2
name: aquaculture
description: A Helm chart for Aquaculture Platform - Multi-tenant aquaculture management system
type: application
# Chart 3.0.0 — BREAKING: 2026-04-14 NATS cert-is-identity refactor (ADR-015).
# - secrets.natsAuth block REMOVED entirely. NATS identity comes from
#   the mTLS client cert CN via `verify_and_map: true`. Per-service
#   passwords are not configurable (server would ignore them anyway).
# - `aquaculture.natsServiceEnv` helper signature changed from PascalCase
#   ("Farm") to lowercase snake_case ("farm_service") matching cert CN.
# - Cert distribution is one cert-manager Secret per generated service
#   identity; each pod mounts only its own certificate.
#
# Chart 2.0.0 — 2026-04-14 earlier security hardening (historical).
# - secrets.jwtSecret REMOVED (superseded by jwtPrivateKey + jwtPublicKey).
# - secrets.passwordPepper, stripeWebhookSecret, stripeApiKey REQUIRED.
# - Pod Security Standards enforced at namespace level.
# - cert-manager internal PKI enabled by default in production overlay.
# Upgrade path documented in docs/runbooks/chart-v2-upgrade.md.
version: 3.0.0
appVersion: "3.0.0"

keywords:
  - aquaculture
  - microservices
  - multi-tenant
  - iot
  - sensors

home: https://github.com/aquaculture-platform/aquaculture-platform
sources:
  - https://github.com/aquaculture-platform/aquaculture-platform

maintainers:
  - name: Aquaculture Team
    email: team@aquaculture.io

dependencies:
  # Pin to exact versions — do not use ranges for stateful dependencies.
  # Update deliberately via `helm dependency update` after integration testing.
  - name: postgresql
    version: "13.4.2"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "18.6.2"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: nats
    version: "1.2.5"
    repository: "https://nats-io.github.io/k8s/helm/charts/"
    condition: nats.enabled
