[package]
name = "protocol-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Pure parser/codec for industrial sensor protocols (Modbus, LoRaWAN, OPC-UA, S7, EtherNet/IP). Single source of truth shared between sens-api-gateway (edge) and sensor-ingestion (cloud)."

[lib]
path = "src/lib.rs"

# [dependencies] intentionally empty during Faz 0 PR-A scaffold.
# Concrete protocol crates (nom, bytes, hex, serde, thiserror, proptest)
# land alongside the first protocol module in Faz 1; pulling them in now
# would force a Cargo.lock containing transitive dependencies that the
# workspace does not yet exercise (and surfaces unrelated CVEs).

[lints]
workspace = true
