# =============================================================================
# AquaMobil PWA - Nginx Configuration
# Optimized for Progressive Web App with offline support
#
# ARCH-NM-016: GraphQL and API proxy locations removed. All API traffic
# must be routed through the outer nginx reverse proxy. This container
# serves only static PWA assets. WebSocket subscriptions are handled by
# the outer nginx /graphql location.
# =============================================================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security: Hide nginx version
    server_tokens off;

    # DNS resolver for Docker internal networking
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # SEC-NM-014: X-XSS-Protection removed (deprecated; CSP provides equivalent protection)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=()" always;
    # D14-SC-02: unsafe-inline removed from script-src; Vite production builds emit no inline scripts
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self'; manifest-src 'self';" always;

    # Health check
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"aquamobil"}';
        add_header Content-Type application/json;
    }

    # Service Worker - MUST NOT be cached
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # Workbox generated service worker
    location ~* ^/workbox-.*\.js$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Manifest - short cache for updates
    location = /manifest.webmanifest {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        types { } default_type "application/manifest+json";
    }

    # Static assets - aggressive caching (versioned by Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # Icons and images
    location /icons/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # SPA fallback - all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;

        # index.html should not be cached (for PWA updates)
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
