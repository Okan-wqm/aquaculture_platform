name: CI - Edge Agent (sens-api-gateway)

# ADR-048 DEC-8.5 / DEC-20 / DEC-28 — every release build of the edge agent,
# compiled and tested at PR time with exactly its release feature set.
#
# `scripts/edge/edge_release.py plan` derives the rows from
# contracts/suderra-edge/v1 (boards.json, artifact-naming.json) and
# sens-api-gateway/release/edge-release.toml — the same plan the release
# workflow builds from. For every distinct feature set (gpio for rpi4-cm4,
# suderra-os, the generic channel's tier) the host runs clippy and the whole
# test suite; every row is cross-built with that feature set and packaged
# through the same ELF machine/interpreter/NEEDED/glibc check the release
# runs. A feature set or target that does not lint, build and test here cannot
# be released, because the release workflow calls this workflow on the tag's
# commit (workflow_call) before it builds (INFRA-HIGH-237, INFRA-CRITICAL-236).
#
# profile-clippy runs the gateway CI's clippy gate (sens-api-gateway-ci.yml
# `clippy`) on each planned feature set, with the same lint arguments
# (tests/invariants/edge-release-pipeline.spec.ts keeps them identical): the
# gateway's curated CI feature set holds neither suderra-os nor gpio, so their
# cfg code is linted only here. The -A list is INFRA-HIGH-237's open debt.

on:
  push:
    branches: [main, develop, agentic, 'feature/*', 'hotfix/*']
    paths:
      - 'sens-api-gateway/**'
      - 'contracts/suderra-edge/**'
      - 'scripts/edge/**'
      - '.github/workflows/ci-edge.yml'
      - '.github/workflows/edge-agent-release.yml'
      - '.github/workflows/sens-api-gateway-ci.yml'
  pull_request:
    branches: [main, develop, agentic]
    paths:
      - 'sens-api-gateway/**'
      - 'contracts/suderra-edge/**'
      - 'scripts/edge/**'
      - '.github/workflows/ci-edge.yml'
      - '.github/workflows/edge-agent-release.yml'
      - '.github/workflows/sens-api-gateway-ci.yml'
  workflow_dispatch:
  workflow_call:

# SEC-CI-021: minimum token permissions.
permissions:
  contents: read

# Not `${{ github.workflow }}-…`: called from the release workflow, the
# caller's name would make this group equal the caller's own and the call
# would wait on, or cancel, its caller.
concurrency:
  group: ci-edge-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: '1.88.0'
  CROSS_VERSION: '0.2.5'

jobs:
  plan:
    name: Release profiles (contracts/suderra-edge/v1)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plan every release row from the contract
        id: plan
        run: python3 -I scripts/edge/edge_release.py plan --github-output "${GITHUB_OUTPUT}"

  profile-test:
    name: cargo test (${{ matrix.used_by }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
    env:
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: sens-api-gateway -> target
          shared-key: ci-edge-test-${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/agentic' }}

      - name: Run the suite with exactly the release feature set
        working-directory: sens-api-gateway
        run: cargo test --locked --all-targets --no-default-features --features "$FEATURES" --no-fail-fast -- --test-threads=1

  profile-clippy:
    name: cargo clippy (${{ matrix.used_by }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
    env:
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: sens-api-gateway -> target
          shared-key: ci-edge-clippy-${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/agentic' }}

      - name: Lint exactly the release feature set
        working-directory: sens-api-gateway
        run: >
          cargo clippy --locked --all-targets --no-default-features --features "$FEATURES" --
          -D clippy::correctness
          -D clippy::suspicious
          -D clippy::perf
          -A clippy::await_holding_lock
          -A clippy::cmp_owned
          -A clippy::dbg_macro
          -A clippy::expect_fun_call
          -A clippy::expect_used
          -A clippy::indexing_slicing
          -A clippy::large_stack_arrays
          -A clippy::print_stderr
          -A clippy::print_stdout
          -A clippy::todo
          -A clippy::unimplemented
          -A clippy::unnecessary_to_owned
          -A clippy::unwrap_used
          -A clippy::vec_init_then_push

  profile-build:
    name: cross build (${{ matrix.artifact }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    env:
      CHANNEL: ${{ matrix.channel }}
      BUILD_ID: ${{ matrix.id }}
      RUST_TARGET: ${{ matrix.rust_target }}
      FEATURES: ${{ matrix.features }}
      CARGO_BIN: ${{ matrix.cargo_bin }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/sens-api-gateway/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: sens-api-gateway -> target
          shared-key: ci-edge-cross-${{ matrix.rust_target }}-${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/agentic' }}

      - name: Install cross
        run: cargo install cross --version "${CROSS_VERSION}" --locked

      - name: Cross-build the release binary
        working-directory: sens-api-gateway
        # Cross.toml's pre-build installs LLVM 12 for aws-lc-sys's bindgen;
        # cross passes LIBCLANG_PATH into the container.
        env:
          LIBCLANG_PATH: /usr/lib/llvm-12/lib
        run: cross build --locked --release --target-dir "$CARGO_TARGET_DIR" --target "$RUST_TARGET" --no-default-features --features "$FEATURES"

      - name: Package through the release ELF, glibc and archive checks
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python3 -I scripts/edge/edge_release.py package \
            --channel "$CHANNEL" --id "$BUILD_ID" \
            --binary "${CARGO_TARGET_DIR}/${RUST_TARGET}/release/${CARGO_BIN}" \
            --out-dir "${RUNNER_TEMP}/dist"

  ci-edge-summary:
    name: CI - Edge Agent summary
    needs:
      - plan
      - profile-clippy
      - profile-test
      - profile-build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail on skipped, cancelled or failed profile jobs
        env:
          RESULTS: ${{ needs.plan.result }} ${{ needs.profile-clippy.result }} ${{ needs.profile-test.result }} ${{ needs.profile-build.result }}
        run: |
          for result in ${RESULTS}; do
            if [ "$result" != "success" ]; then
              echo "An edge release profile job did not succeed: $result"
              exit 1
            fi
          done
