    spec:
      serviceAccountName: {{ include "aquaculture.fullname" . }}-sensor-service
      automountServiceAccountToken: false
      {{- include "aquaculture.podSecurityContext" . | nindent 6 }}
      containers:
        - name: sensor-service
          image: {{ include "aquaculture.image" (dict "global" .Values.global "image" .Values.sensorService.image) }}
          imagePullPolicy: {{ .Values.sensorService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.sensorService.service.targetPort }}
          env:
            {{- include "aquaculture.backendEnv" . | nindent 12 }}
            {{- include "aquaculture.natsServiceEnv" (list . "sensor_service") | nindent 12 }}
          volumeMounts:
            {{- include "aquaculture.natsServiceVolumeMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.sensorService.resources | nindent 12 }}
          {{- include "aquaculture.livenessProbe" (dict "Values" .Values "port" .Values.sensorService.service.targetPort) | nindent 10 }}
          {{- include "aquaculture.readinessProbe" (dict "Values" .Values "port" .Values.sensorService.service.targetPort) | nindent 10 }}
          {{- include "aquaculture.securityContext" . | nindent 10 }}
      volumes:
