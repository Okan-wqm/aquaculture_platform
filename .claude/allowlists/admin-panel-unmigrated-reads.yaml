# admin-panel pages that reach the network WITHOUT the data layer
# (ADMIN-HIGH-121).
#
# Split out of ADMIN-HIGH-105 when W8a closed that finding's stated subject —
# the missing shared primitive. The primitive now exists, fits the REST
# transport its pages actually use, is exported, and is gated. ADOPTION is a
# separate and much larger piece of work, so it carries its own id rather than
# holding the primitive's finding open until every page has moved.
#
# ADMIN-HIGH-121 reads RESOLVED in the registry, and THIS FILE is why. The
# registry derives state from merged history — a merged `Closes:` trailer means
# closed — so a finding referenced by every wave of a long migration cannot
# stay open across them. What answers the finding architecturally is not "every
# page has moved" but the pair that makes moving them inevitable: the primitive
# exists, and every page that has not moved is named here with an owner, an
# expiry and a ceiling that only decreases. The same shape closed
# ADMIN-HIGH-108 while 31 cron sites were still listed in
# `unleased-scheduled-jobs.yaml`. The entries below, not the finding's state,
# are the record of what is left.
#
# A page is UNMIGRATED when it imports an admin API client directly
# (`services/adminApi` or `services/api/*`) and names neither `useAdminQuery`
# nor `useAdminMutation`. That one criterion covers both shapes the pages use
# today — `useAsyncData(fetcher)` and a bare `useEffect(() => { void
# somethingApi.get() })` — because the property that matters is not which
# helper runs the fetch, it is that the result lands outside the shell's
# `QueryClient`:
#
#   * a write cannot invalidate the reads it affected, so lists go stale until
#     something else happens to refetch (the class `useAdminMutation` exists to
#     remove), and
#   * the data sits in a second cache that only the ADMIN-HIGH-121 logout
#     registration in `useAsyncData` keeps from outliving its session.
#
# Keyed by FILE and by IMPORT, never by line number or by call-site regex: a
# line-numbered ratchet breaks on any edit above a call and trains people to
# bump it rather than read it, and a regex ratchet quietly under-counts.
#
# tests/invariants/admin-panel-data-layer.spec.ts requires every unmigrated
# page to appear here with its batch, an owner, a future expiry, the finding
# that owns the migration and a reason — and requires every LISTED page to
# still be unmigrated, so a finished page cannot be left behind to hold the
# ceiling up. `ceiling` is the maximum number of entries and only decreases.
#
# 44 of 44 pages at W8a: the primitives shipped in an earlier release
# and were never exported from `hooks/index.ts`, so no page could reach them.
# W8b migrated AuditLogPage and ActivityLogPage; W8c AuditTrailPage and
# SecurityDashboardPage; W8d CompliancePage, which finishes the SECURITY batch
# and is the first page to use the write primitive; W8e ModulesPage: 38 remain.
# Batches at W8e: tenant 6, billing 11, system 12, messaging 9. The SYSTEM
# batch is finished at W8q; tenant 6, billing 11 and messaging 9 remain.
# The ceiling drops with each batch and this file is deleted at 0.
