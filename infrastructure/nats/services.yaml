  # ---------------------------------------------------------------------------
  # alert-engine: rule-based alerting from sensor readings
  # ---------------------------------------------------------------------------
  # Naming note: user is `alert_engine` (NOT `alert_service`). Historical;
  # preserved to avoid cert churn. See ADR-014.
  - name: alert_engine
    description: Sensor-reading → alert-rule evaluation, alert lifecycle events
    publish:
      - "events.*.AlertEscalated"
      - "events.*.AlertResolved"
      - "events.*.AlertTriggered"
      - "events.*.SensorReading"
      - "events.platform.schema-migration.>"
      - "events.security.events.>"
      - "$JS.API.>"
      - "_INBOX.>"
    subscribe:
      - "$JS.API.>"
      - "_INBOX.>"

