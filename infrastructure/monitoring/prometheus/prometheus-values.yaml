# =============================================================================
# Aquaculture Platform - Prometheus Stack Values
# For kube-prometheus-stack Helm chart
# =============================================================================

# ARCH-NM-013: Top-level global.scrape_interval is silently ignored by kube-prometheus-stack.
# Correct path is prometheus.prometheusSpec.scrapeInterval (set below in prometheusSpec).

# Prometheus configuration
prometheus:
  enabled: true

  prometheusSpec:
    replicas: 2
    retention: 30d
    retentionSize: 50GB

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 100Gi

    # Service discovery
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    # ARCH-NM-005: Watch PrometheusRule resources in both monitoring and aquaculture namespaces
    ruleNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - monitoring
            - aquaculture

    # ARCH-NM-013: scrape/evaluation intervals at the correct Helm path
    scrapeInterval: 30s
    evaluationInterval: 30s

    # SEC-NM-018: Annotation-based pod scraping is a security risk — any pod that can
    # set its own annotations can inject itself as a scrape target (metric poisoning).
    # Prefer ServiceMonitor resources with label selectors per service.
    # The annotation-based config below is retained for legacy compatibility only.
    # Migrate each service to a dedicated ServiceMonitor CRD with:
    #   selector.matchLabels targeting specific service labels
    #   namespaceSelector scoped to the aquaculture namespace
    additionalScrapeConfigs:
      - job_name: 'aquaculture-services'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - aquaculture
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app

# Alertmanager configuration
alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 2

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

  config:
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'severity', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default'
      routes:
        - match:
            severity: critical
          receiver: 'critical-alerts'
          # continue: true sends critical alerts to 'default' as well (e.g. ticket system)
          continue: true
        - match:
            severity: warning
          receiver: 'warning-alerts'
          # ARCH-NM-006: continue: true added so warning alerts also reach 'default' receiver
          continue: true

    receivers:
      # SEC-NM-007: Real receiver configurations. Credentials must be injected via
      # Kubernetes secrets and referenced here. Never hardcode credentials in this file.
      - name: 'default'
        # Catch-all: ticket creation or audit log webhook
        webhook_configs:
          - url: "${ALERTMANAGER_WEBHOOK_URL}"
            send_resolved: true
      - name: 'critical-alerts'
        # PagerDuty for on-call paging on critical severity alerts
        pagerduty_configs:
          - routing_key: "${PAGERDUTY_ROUTING_KEY}"
            send_resolved: true
        # Slack for immediate team visibility
        slack_configs:
          - api_url: "${SLACK_WEBHOOK_URL_CRITICAL}"
            channel: '#alerts-critical'
            send_resolved: true
            title: '{{ .CommonAnnotations.summary }}'
            text: '{{ .CommonAnnotations.description }}'
      - name: 'warning-alerts'
        # Slack for warning-level alerts
        slack_configs:
          - api_url: "${SLACK_WEBHOOK_URL_WARNINGS}"
            channel: '#alerts-warnings'
            send_resolved: true
            title: '{{ .CommonAnnotations.summary }}'
            text: '{{ .CommonAnnotations.description }}'

# Grafana configuration
grafana:
  enabled: true

  replicas: 2

  # SECURITY: Admin password must be set via existingSecret or environment variable
  # DO NOT use hardcoded passwords in production!
  # Option 1: Use existing Kubernetes secret
  admin:
    existingSecret: "grafana-admin-credentials"
    userKey: admin-user
    passwordKey: admin-password
  # Option 2: If not using existingSecret, set via --set grafana.adminPassword=xxx during helm install

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi

  grafana.ini:
    server:
      # ARCH-NM-015: updated to match actual production domain
      root_url: "https://grafana.app.suderra.com"
    auth.anonymous:
      enabled: false
    security:
      # SEC-NM-012: admin_password removed; credentials come from existingSecret only
      # Setting admin_password here conflicts with existingSecret and may set the
      # literal string "${GRAFANA_ADMIN_PASSWORD}" if the env var is not injected.

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          # SEC-NM-011: lock provisioned dashboards against UI modification and deletion
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/default
        - name: 'aquaculture'
          orgId: 1
          folder: 'Aquaculture'
          type: file
          # SEC-NM-011: lock provisioned dashboards against UI modification and deletion
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/aquaculture

  # ARCH-NM-009: Provision Prometheus datasource with explicit UID to match dashboard panels
  additionalDataSources:
    - name: Prometheus
      type: prometheus
      uid: prometheus
      url: http://prometheus-kube-prometheus-prometheus:9090
      access: proxy
      isDefault: true
      jsonData:
        timeInterval: 30s
    - name: Loki
      type: loki
      uid: loki
      url: http://loki-gateway:3100
      access: proxy
      jsonData:
        derivedFields:
          - datasourceUid: prometheus
            matcherRegex: "traceId=(\\w+)"
            name: TraceID
            url: '$${__value.raw}'

# Node exporter
nodeExporter:
  enabled: true

# Kube state metrics
kubeStateMetrics:
  enabled: true

# Prometheus operator
prometheusOperator:
  enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Default rules
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
