# =============================================================================
# Nginx Configuration for DigitalOcean Droplet
# Reverse proxy for Aquaculture Platform
# HTTPS with Let's Encrypt
#
# ARCH-NM-DNS: Uses Docker internal DNS resolver (127.0.0.11) with variable-
# based proxy_pass to re-resolve container hostnames dynamically. This prevents
# stale DNS cache when containers are recreated with new IPs during selective
# deploys. Without this, nginx caches upstream IPs at startup and never
# re-resolves, causing 403/502 errors when container IPs change.
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 2048;

events {
    worker_connections 1024;
    multi_accept on;
}

# =============================================================================
# MQTT TLS Termination (stream proxy)
# Edge agents connect to port 8883 (TLS) → Nginx terminates TLS →
# forwards plain MQTT to mosquitto:1883 on internal Docker network.
# =============================================================================
stream {
    # Mosquitto is an infrastructure service (never recreated during selective
    # deploys), so a static upstream block is safe here.
    upstream mqtt_backend {
        server mosquitto:1883;
    }

    server {
        listen 8883 ssl;

        ssl_certificate /etc/letsencrypt/live/app.suderra.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.suderra.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        proxy_pass mqtt_backend;
        proxy_connect_timeout 10s;
        proxy_timeout 300s;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Security: Hide nginx version from response headers
    server_tokens off;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Request size limit (SEC-NM-016)
    client_max_body_size 10M;

    # SEC-NM-008: WebSocket upgrade map - avoids duplicate/conflicting Connection header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    # H-02: CORS origin allowlist map — only the shell app domain is permitted.
    # Wildcard Access-Control-Allow-Origin is forbidden in production; the map
    # validates $http_origin against an explicit allowlist and returns the
    # matched origin (or empty string to suppress the header).
    map $http_origin $cors_origin {
        default                     "";
        "https://app.suderra.com"   "https://app.suderra.com";
    }

    # SEC-NM-010: CDN real IP extraction (uncomment and set CDN ranges if behind Cloudflare)
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # real_ip_header CF-Connecting-IP;

    # ARCH-017: Rate limiting zones — defined here (where they are used)
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=graphql:10m rate=60r/s;
    # Plan 032 Faz 032f — ARIA webhook ingress (GitHub / Alertmanager / operator).
    limit_req_zone $binary_remote_addr zone=aria_webhook:1m rate=10r/s;

    # ARCH-NM-DNS: Docker internal DNS resolver with 10s TTL cache.
    # Ensures nginx re-resolves container hostnames when IPs change
    # (e.g., after container recreation during selective deploys or crashes).
    # Without this + variable proxy_pass, nginx caches IPs at startup forever.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Block direct IP access (HTTP) + Docker health check
    server {
        listen 80 default_server;
        server_name _;

        # Health check for Docker (accessible via localhost)
        location = /nginx-health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Block everything else
        location / {
            return 444;
        }
    }

    # Block direct IP access (HTTPS)
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate /etc/letsencrypt/live/app.suderra.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.suderra.com/privkey.pem;
        return 444;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name app.suderra.com;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check (keep on HTTP for internal monitoring)
        location = /nginx-health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name app.suderra.com;

        # SSL certificates (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/app.suderra.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.suderra.com/privkey.pem;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # SEC-TLS-001: Certificate revocation strategy
        #
        # Let's Encrypt E8 (ECDSA) chain no longer includes an OCSP responder URL.
        # LE deprecated OCSP in favor of CRL-based revocation (http://e8.c.lencr.org/).
        # Browsers (Chrome 2023+, Firefox 2024+) already ship CRLSets / CRLite that
        # cover LE certificates, making OCSP stapling unnecessary for this CA.
        #
        # ssl_stapling is intentionally disabled to avoid the startup warning:
        #   "ssl_stapling ignored, no OCSP responder URL in the certificate"
        #
        # If the certificate is later reissued by a CA that supports OCSP, re-enable:
        #   ssl_stapling on;
        #   ssl_stapling_verify on;
        #   ssl_trusted_certificate /etc/letsencrypt/live/app.suderra.com/chain.pem;
        ssl_stapling off;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # D14-SC-02: unsafe-inline and unsafe-eval removed from script-src
        # M-07: Unencrypted ws: removed from connect-src; only wss: is permitted in production
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; script-src-elem 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; worker-src 'self' blob:; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://server.arcgisonline.com https://*.basemaps.cartocdn.com; connect-src 'self' wss: https://cdn.jsdelivr.net https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

        # Plan 032 Faz 032f — ARIA event gateway. The daemon binds 127.0.0.1:8787
        # (infrastructure/aria/aria-gateway.service); nginx only rate-limits,
        # caps the body and forwards. Signatures/bearers are verified by the
        # daemon itself (aria_kernel/gateway/server.py), never here.
        location /aria/webhook/ {
            limit_req zone=aria_webhook burst=20 nodelay;
            client_max_body_size 1m;
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }
        location = /aria/status {
            limit_req zone=aria_webhook burst=5 nodelay;
            proxy_pass http://127.0.0.1:8787/aria/status;
            proxy_set_header Host $host;
            proxy_read_timeout 5s;
        }

        # Block debug endpoints in production (H-3)
        location /api/debug {
            return 404;
        }

        # Block Swagger docs in production (C-1 defense-in-depth)
        location /api/docs {
            return 404;
        }

        # Edge device provisioning — installer script download
        # Called by: curl -sSL https://app.suderra.com/install/{deviceCode}?token=... | sudo bash
        location /install/ {
            limit_req zone=api burst=10 nodelay;

            set $backend_sensor sensor-service;
            proxy_pass http://$backend_sensor:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Edge device activation & self-registration REST endpoints
        location /api/devices/ {
            limit_req zone=api burst=10 nodelay;

            set $backend_sensor_devices sensor-service;
            proxy_pass http://$backend_sensor_devices:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MQTT auth endpoints — internal only (Mosquitto go-auth plugin).
        # These endpoints MUST NOT be exposed to external traffic because an attacker
        # could brute-force MQTT credentials by calling /mqtt/auth directly.
        # Mosquitto reaches sensor-service via the aqua-internal Docker network,
        # so this Nginx location is not needed and is blocked.
        location /mqtt/ {
            deny all;
            return 403;
        }

        # robots.txt (L-1)
        location = /robots.txt {
            add_header Content-Type text/plain;
            return 200 "User-agent: *\nDisallow: /api/\nDisallow: /graphql\nDisallow: /health\nDisallow: /remotes/\nAllow: /\n";
        }

        # Block /metrics from public traffic (SEC-NM-005)
        location /metrics {
            deny all;
            return 403;
        }

        # Socket.io WebSocket proxy (ST Language Service, Sensor Readings)
        location /socket.io/ {
            set $backend_gw_ws gateway-api;
            proxy_pass http://$backend_gw_ws:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;

            # Prevent duplicate security headers
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Content-Security-Policy;
        }

        # GraphQL API
        location /graphql {
            # ARCH-017: Apply rate limiting to GraphQL endpoint
            limit_req zone=graphql burst=30 nodelay;

            set $backend_gw_gql gateway-api;
            proxy_pass http://$backend_gw_gql:3000;
            proxy_http_version 1.1;
            # SEC-NM-008: map-based Connection header handles both WS upgrade and HTTP keep-alive
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;

            # Prevent duplicate security headers (M-2, L-4)
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Content-Security-Policy;
        }

        # Gateway health endpoint
        location /health {
            set $backend_gw_health gateway-api;
            proxy_pass http://$backend_gw_health:3000;
            proxy_set_header Host $host;
        }

        # ── Admin health endpoints (VERSION_NEUTRAL, no /api/v1 prefix) ──
        # admin-api HealthController uses @Controller('health') without version
        # prefix. Frontend calls /api/health/circuit-breakers which must map to
        # /health/circuit-breakers on admin-api, NOT /api/v1/health/...
        location /api/health/ {
            limit_req zone=api burst=20 nodelay;

            set $backend_admin_health admin-api-service;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://$backend_admin_health:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Gateway REST endpoints (must be BEFORE /api/ catch-all) ──────
        # Upload routes are handled by gateway-api, not admin-api-service.
        # More specific location blocks take precedence in nginx.
        location /api/upload/ {
            limit_req zone=api burst=20 nodelay;

            set $backend_gw_upload gateway-api;
            proxy_pass http://$backend_gw_upload:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 50m;
        }

        # AI routes → gateway-api
        location /api/v2/ai/ {
            limit_req zone=api burst=20 nodelay;

            set $backend_gw_ai gateway-api;
            proxy_pass http://$backend_gw_ai:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Tenant-authenticated environmental imagery is owned by gateway-api.
        # Keep this route before the admin-api /api/ catch-all below.
        location /api/marine/ {
            limit_req zone=api burst=20 nodelay;

            set $backend_gw_marine gateway-api;
            proxy_pass http://$backend_gw_marine:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $request_id;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 10s;
            # farm CDSE per-request budget (30s) < gateway aggregate render
            # budget (210s) < edge budget (220s).
            proxy_send_timeout 220s;
            proxy_read_timeout 220s;
        }

        # ── Stripe webhook (Faz C / D7) → billing-service ────────────────
        # Exact match: Stripe POSTs signed events to /webhooks/stripe. nginx
        # streams the RAW request body verbatim (no body rewriting), so the
        # Stripe-Signature HMAC — computed over the exact bytes — survives.
        # The Stripe-Signature header is forwarded automatically. The billing
        # webhook controller (@Public, own signature verification) mounts here
        # because billing main.ts excludes 'webhooks' from the /api/v1 prefix.
        location = /webhooks/stripe {
            limit_req zone=api burst=20 nodelay;

            set $backend_billing billing-service;
            proxy_pass http://$backend_billing:3000/webhooks/stripe;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # CSP violation reports → gateway-api
        location = /api/csp-report {
            set $backend_gw_csp gateway-api;
            proxy_pass http://$backend_gw_csp:3000;
            proxy_set_header Host $host;
        }

        # ── Admin API REST endpoints (catch-all for /api/) ───────────────
        # Frontend calls /api/users, /api/system, /api/audit-logs, etc.
        # Admin-api-service routes are versioned: /api/v1/users, /api/v1/system, etc.
        # Rewrite prepends /api/v1/ to align frontend paths with backend routes.
        location /api/ {
            # ARCH-017: Apply rate limiting to REST API endpoint
            limit_req zone=api burst=50 nodelay;

            set $backend_admin admin-api-service;
            rewrite ^/api/(.*) /api/v1/$1 break;
            proxy_pass http://$backend_admin:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Prevent duplicate security headers (M-2, L-4)
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Content-Security-Policy;
        }

        # Microfrontend remotes — no-cache for remoteEntry.js, cache for assets
        # Path stripping: /remotes/<module>/foo → /foo on upstream
        # H-02: Wildcard CORS replaced with $cors_origin map-based allowlist
        location /remotes/dashboard/ {
            set $backend_dashboard dashboard;
            rewrite ^/remotes/dashboard/(.*) /$1 break;
            proxy_pass http://$backend_dashboard:80;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /remotes/farm-module/ {
            set $backend_farm farm-module;
            rewrite ^/remotes/farm-module/(.*) /$1 break;
            proxy_pass http://$backend_farm:80;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /remotes/sensor-module/ {
            set $backend_sensor_mod sensor-module;
            rewrite ^/remotes/sensor-module/(.*) /$1 break;
            proxy_pass http://$backend_sensor_mod:80;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /remotes/admin-panel/ {
            set $backend_admin_panel admin-panel;
            rewrite ^/remotes/admin-panel/(.*) /$1 break;
            proxy_pass http://$backend_admin_panel:80;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /remotes/tenant-admin/ {
            set $backend_tenant tenant-admin;
            rewrite ^/remotes/tenant-admin/(.*) /$1 break;
            proxy_pass http://$backend_tenant:80;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /remotes/hr-module/ {
            set $backend_hr hr-module;
            rewrite ^/remotes/hr-module/(.*) /$1 break;
            proxy_pass http://$backend_hr:80;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /remotes/hydroponics-module/ {
            set $backend_hydro hydroponics-module;
            rewrite ^/remotes/hydroponics-module/(.*) /$1 break;
            proxy_pass http://$backend_hydro:80;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location /remotes/messaging-module/ {
            set $backend_messaging_module messaging-module;
            rewrite ^/remotes/messaging-module/(.*) /$1 break;
            proxy_pass http://$backend_messaging_module:80;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # Mobile PWA (path stripping: /mobile/foo → /foo)
        # H-02: Wildcard CORS replaced with $cors_origin map-based allowlist
        location /mobile/ {
            set $backend_mobile aquamobil;
            rewrite ^/mobile/(.*) /$1 break;
            proxy_pass http://$backend_mobile:80;
            add_header Access-Control-Allow-Origin $cors_origin always;
            # SEC-MEDIUM-052: this add_header drops the server-level security set
            # for /mobile/. The CSP + X-Frame/X-Content-Type/Referrer/Permissions
            # come from the upstream aquamobil container (passed through — no
            # proxy_hide_header here), but HSTS is set only at this edge, so
            # re-apply it or the PWA document ships without HSTS.
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        }

        # Shell (host application) - catch-all for SPA routing
        location / {
            set $backend_shell shell;
            proxy_pass http://$backend_shell:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }
}
