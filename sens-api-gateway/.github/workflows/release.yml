name: Release

# SEC-CI-002: All third-party actions pinned to full commit SHAs (was @v4, @master, @v1)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      # SEC-CI-002: pinned to SHA (was @v4)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # v1.2.4: Rust 2024 edition requires Rust 1.85+
      # SEC-CI-002: pinned to SHA (was @master)
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e18c1f174353f47 # stable
        with:
          toolchain: "1.85"
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        # SEC-CI-002: Pin to a specific version to avoid supply-chain risk from installing
        # an unpinned git HEAD. Version 0.2.5 is the same pin used in edge-agent-release.yml.
        run: cargo install cross --version 0.2.5 --locked

      - name: Build (native)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --release --features gpio --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: cross build --release --features gpio --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/suderra-agent dist/suderra-agent-${{ matrix.target }}
          chmod +x dist/suderra-agent-${{ matrix.target }}

      # SEC-CI-002: pinned to SHA (was @v4)
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: suderra-agent-${{ matrix.target }}
          path: dist/suderra-agent-${{ matrix.target }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # SEC-CI-002: pinned to SHA (was @v4)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # SEC-CI-002: pinned to SHA (was @v4)
      - name: Download all artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          path: artifacts

      # SEC-CI-002: pinned to SHA (was softprops/action-gh-release@v1)
      - name: Create Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.1
        with:
          files: artifacts/**/*
          generate_release_notes: true
