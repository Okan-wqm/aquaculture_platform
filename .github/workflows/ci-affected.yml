name: CI - Affected

# ARCH-CI-005: Replaced global npm run scripts with nx affected commands
# SEC-CI-002: All third-party actions pinned to full commit SHAs
# ARCH-CI-006: Removed github.sha from NX cache key
# ARCH-CI-007: Split lint/type-check/test into parallel jobs so build always runs
# ARCH-CI-008: Increased timeouts (cold cache), reduced parallel (memory), save Nx cache after build
# ARCH-CI-009: Push-to-main deploy waits for affected lint/type-check/test/build.

on:
  push:
    branches: [main, develop, 'feature/*', 'hotfix/*']
  pull_request:
    branches: [main, develop]

# SEC-CI-021: Minimum token permissions — prevents compromised actions from
# pushing commits, creating releases, or modifying repository settings.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  SENS_API_GATEWAY_CI_FEATURES: health,telemetry,metrics,strict-security,scada-display,lorawan,signed-deploy,tpm,st-bytecode,multi-task-scheduler,opc-ua-server,live-debug,license-enforce

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      infra_image_changed: ${{ steps.changes.outputs.infra_image }}
      is_pr: ${{ github.event_name == 'pull_request' }}
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # SEC-CI-002/SEC-CI-019: Migrated from unmaintained @v2 to @v3, pinned to SHA
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: changes
        with:
          filters: |
            apps:
              - 'apps/**'
            libs:
              - 'libs/**'
              - 'platform/libs/**'
            web:
              - 'web/**'
            infra_image:
              - 'infrastructure/mosquitto/**'
            # Deploy-pipeline infrastructure. Changes here affect how the
            # deploy runs even when no application source changed — e.g.
            # a droplet-up.sh tweak, a new criticality-manifest entry, a
            # change to the compose topology. Without including these,
            # deploy-workflow fixes cannot TEST THEMSELVES (recursive
            # chicken-egg: the fix lands but nothing triggers the chain
            # that would exercise it).
            deploy-config:
              - 'sens-api-gateway/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'tools/executors/cargo/**'
              - 'scripts/deploy/**'
              - 'scripts/ci/**'
              - 'scripts/graphql/**'
              - 'scripts/apollo-router/**'
              - '.github/workflows/deploy-digitalocean.yml'
              - '.github/workflows/deploy-staging.yml'
              - '.github/workflows/ci-affected.yml'
              - '.github/actions/**'
              - 'infrastructure/deploy/**'
              - 'infrastructure/apollo-router/**'
              - 'docker-compose.droplet.yml'
              - 'docker-compose.prod.yml'
              - '.gitignore'
              - '.nxignore'
              - 'codegen.ts'
              - 'web/shared-ui/src/generated/**'
              # CI install-chain tooling — the Nx graph probe + ESLint
              # plugin loader resolve against these paths on every run.
              # A broken `tools/eslint-rules/` tsconfig or a miswired
              # `tools/gates/` script crashes the install job itself, so
              # changes here MUST trigger the full chain or the fix
              # cannot validate itself. Root cause: commit 5f3280c4
              # fixed the eslint-rules build but CI skipped validation
              # because the change only touched tools/, producing
              # has_changes=false. Architectural fix: treat CI-consumed
              # tooling as deploy-config for path-filter purposes.
              - 'tools/eslint-rules/**'
              - 'tools/gates/**'
              - 'tools/scripts/**'
              - '.eslintrc.json'
              - '.eslintrc.js'
              - 'tsconfig.base.json'
              # Root manifest + lockfile. Any change here rewires the
              # workspace graph OR the dependency tree — both invalidate
              # every downstream build. Missing these from the filter
              # was the a8320411 blind-spot: a workspaces-array change
              # (root cause of the @nx/eslint-plugin native-binding
              # red herring) landed and CI-Affected skipped the full
              # chain in 9s because has_changes=false.
              - '.npmrc'
              - 'package.json'
              - 'package-lock.json'
      - id: check
        run: |
          if [ "${{ steps.changes.outputs.apps }}" = "true" ] || \
             [ "${{ steps.changes.outputs.libs }}" = "true" ] || \
             [ "${{ steps.changes.outputs.web }}" = "true" ] || \
             [ "${{ steps.changes.outputs.infra_image }}" = "true" ] || \
             [ "${{ steps.changes.outputs.deploy-config }}" = "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  release-decision:
    needs: detect-changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      deploy_required: ${{ steps.decide.outputs.deploy_required }}
      obsolete: ${{ steps.decide.outputs.obsolete }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - id: decide
        run: |
          set -euo pipefail
          git fetch --force --prune origin main '+refs/tags/deployed/production:refs/tags/deployed/production' || true
          remote_main="$(git rev-parse origin/main)"
          if [ "${GITHUB_SHA}" != "${remote_main}" ]; then
            echo "::notice::This run is obsolete; origin/main is ${remote_main}."
            echo "deploy_required=false" >> "$GITHUB_OUTPUT"
            echo "obsolete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          baseline="$(git rev-parse deployed/production 2>/dev/null || true)"
          if [ -z "${baseline}" ]; then
            echo "::notice::No deployed/production tag found; deploy required."
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
            echo "obsolete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "${baseline}" "${GITHUB_SHA}"; then
            echo "::notice::No diff since deployed/production; deploy not required."
            echo "deploy_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Diff exists since deployed/production; deploy required."
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
          fi
          echo "obsolete=false" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Shared setup: install + cache (reusable via needs + cache restore)
  # ---------------------------------------------------------------------------
  install:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Nx
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      # Persist node_modules for downstream jobs
      - name: Cache node_modules
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

  # ---------------------------------------------------------------------------
  # Lint, type-check, test: PR + push-to-main deploy gate
  # ---------------------------------------------------------------------------
  lint:
    needs: [install, detect-changes]
    if: >-
      needs.detect-changes.outputs.has_changes == 'true' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # continue-on-error removed: lint failures must block PR merge.
    # BEFORE: lint errors showed green in GitHub — no signal to reviewers or authors.
    # WHY: A CI gate that never fails provides false confidence and is worse than no gate.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit

      # 2026-05-05: Nx builds Rust crates in parallel. Installing the pinned
      # toolchain once before Nx starts prevents competing cargo/rustup
      # processes from mutating ~/.rustup concurrently.
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy,rust-src
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Restore Nx cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Run linter (affected only)
        run: |
          BASE_REF="origin/${{ github.base_ref || 'main' }}"
          bash scripts/ci/lint-changed-files.sh --base "$BASE_REF" --head HEAD
          bash scripts/ci/affected-target-policy.sh --target lint --base "$BASE_REF" --parallel 2
        timeout-minutes: 35
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

  type-check:
    needs: [install, detect-changes]
    if: >-
      needs.detect-changes.outputs.has_changes == 'true' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # continue-on-error removed: TypeScript errors must block PR merge.
    # BEFORE: type errors merged silently — caught only at runtime or in production.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit

      # 2026-05-05: Type-check targets can include Rust-backed crates. Prepare the exact
      # pinned toolchain before Nx starts parallel cargo-backed tasks.
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy,rust-src
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Restore Nx cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Run type check (affected plus changed TypeScript guard)
        run: |
          BASE_REF="origin/${{ github.base_ref || 'main' }}"
          npx nx affected -t type-check --base="$BASE_REF" --head=HEAD --parallel=2
          node scripts/ci/type-check-changed-files.mjs --base "$BASE_REF" --head HEAD
        timeout-minutes: 35
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

  test:
    needs: [install, detect-changes]
    if: >-
      needs.detect-changes.outputs.has_changes == 'true' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # continue-on-error removed: failing tests must block PR merge.
    # BEFORE: broken unit tests were invisible to reviewers — PRs merged with red tests.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit

      # 2026-05-05: Test targets include Rust crates. Prepare the exact
      # pinned toolchain before Nx starts parallel cargo-backed tasks.
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy,rust-src
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Restore Nx cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Run migration harness tests (affected, isolated)
        run: |
          BASE_REF="origin/${{ github.base_ref || 'main' }}"
          AFFECTED_FILES="$(git diff --name-only "$BASE_REF"...HEAD | grep -Ev '^(\.npmrc|package(-lock)?\.json)$' || true)"

          if [ -z "$AFFECTED_FILES" ]; then
            echo "No source files affected beyond root package metadata; skipping isolated Testcontainers gate."
            exit 0
          fi

          FILES_ARG="$(printf '%s\n' "$AFFECTED_FILES" | paste -sd, -)"
          AFFECTED_TEST_PROJECTS="$(npx nx show projects --affected --files="$FILES_ARG" --with-target=test)"

          if printf '%s\n' "$AFFECTED_TEST_PROJECTS" | grep -Fxq 'migration-harness'; then
            # 2026-05-06: Pull the harness-owned pinned PG image before Jest
            # starts. Otherwise a cold GitHub runner can spend the 90s
            # beforeAll budget downloading the image, then continue async boot
            # after Jest has torn the environment down.
            MIGRATION_HARNESS_POSTGRES_IMAGE="$(node scripts/ci/print-migration-harness-postgres-image.mjs)"
            echo "Prewarming migration-harness PostgreSQL image from canonical setup.ts"
            docker pull "$MIGRATION_HARNESS_POSTGRES_IMAGE"
            npx nx run migration-harness:test
          else
            echo "migration-harness is not affected; skipping isolated Testcontainers gate."
          fi
        timeout-minutes: 20
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Run tests (affected only)
        run: |
          BASE_REF="origin/${{ github.base_ref || 'main' }}"
          bash scripts/ci/affected-target-policy.sh --target test --base "$BASE_REF" --parallel 2 --exclude migration-harness
        timeout-minutes: 35
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

  # ---------------------------------------------------------------------------
  # Build: PR + push-to-main deploy gate.
  # On PR this validates the code compiles before merge; on main it prevents
  # deploy from starting until the affected workspace graph is buildable.
  # ---------------------------------------------------------------------------
  build:
    needs: [install, detect-changes]
    if: >-
      needs.detect-changes.outputs.has_changes == 'true' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit

      # 2026-05-05: Build targets include Rust crates. Prepare the exact
      # pinned toolchain before Nx starts parallel cargo-backed tasks.
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy,rust-src
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Restore Nx cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-ci-${{ runner.os }}-

      - name: Ensure Nx cache directory exists
        run: mkdir -p .nx/cache

      - name: Build (affected only)
        run: npx nx affected -t build --base=origin/${{ github.base_ref || 'main' }} --head=HEAD --parallel=2
        timeout-minutes: 45
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

      # Persist Nx cache so subsequent CI runs are fast
      - name: Save Nx cache
        if: always()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-ci-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}

  schema-validation:
    needs: [install, detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit
      - name: Validate pagination schema types
        run: node scripts/validate-pagination-schema.js

      # NOTE: the NATS SSoT drift check previously lived here, gated behind
      # `has_changes == 'true'` (apps/libs/web). That gating caused a gap:
      # a PR touching ONLY infrastructure/nats/services.yaml would skip this
      # job entirely. The check has moved to the `pre-flight` job below,
      # which runs unconditionally on every PR + push. See ADR-016 Phase A3.

  # ---------------------------------------------------------------------------
  # Pre-flight validation — ADR-016 Phase A2-A4 at PR-time
  # ---------------------------------------------------------------------------
  #
  # Mirrors the pre-flight steps landed in deploy-digitalocean.yml (commit
  # 607f9d9d) so drift is caught at PR merge time, not at deploy time.
  # Rationale: a broken commit that reaches `main` will block the NEXT
  # deploy until it is reverted — moving the gate to PR-time keeps main
  # always-deployable.
  #
  # Runs unconditionally on every PR + every push to a watched branch.
  # Does NOT depend on `needs.detect-changes.outputs.has_changes` — infra
  # drift can land without touching apps/libs/web (e.g. PR edits only
  # `infrastructure/nats/services.yaml` or `docker-compose.droplet.yml`),
  # and the gate MUST still fire in that case.
  #
  # Tier-1 Make-Impossible guard (CLAUDE.md architectural hierarchy):
  # breaking any SSoT at PR time fails CI BEFORE the deploy pipeline
  # starts — `main` cannot carry a commit that the deploy workflow would
  # immediately reject.
  pre-flight:
    needs: detect-changes
    # No `has_changes` gate — infra/compose/NATS drift must always fire.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # persist-credentials:false — this job never pushes; default-true
          # leaks a write-scoped token into bash subshells for no benefit.
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python3 -m pip install --quiet 'pyyaml==6.0.2'

      - name: Setup Node
        # Node 22 is required for built-in TypeScript type-stripping (the
        # validator runs as `node scripts/ci/preflight-validate.ts` with no
        # transpile step). Same SHA pin as every other setup-node call in
        # this workflow.
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Phase A1 — GraphQL registry generated artifacts
        run: |
          node scripts/graphql/validate-registry.mjs
          node scripts/graphql/generate-registry-artifacts.mjs
          git diff --exit-code \
            apps/gateway-api/src/config/federated-subgraphs.generated.ts \
            infrastructure/apollo-router/supergraph-config.generated.yaml \
            infrastructure/apollo-router/codegen-schema.generated.json

      - name: Phase A1 — GraphQL contract drift report
        run: node scripts/ci/check-graphql-contract-drift.mjs

      - name: Phase A1 — auth schema write ownership
        run: node scripts/ci/check-auth-db-ownership.mjs

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: 'v3.16.3'

      # ── Phase A2 — compose interpolation validation ──────────────────────
      # `docker compose config --quiet` expands every `${VAR:?...}` in the
      # compose file. Missing required vars abort with a non-zero exit. The
      # validator scans each compose file for `${VAR:?...}` references and
      # generates a throwaway dummy .env on the fly — Tier-2 Make-Automatic:
      # the compose file IS the SSoT for "what prod needs at interpolation
      # time", so deriving the dummy at CI time keeps both in lockstep
      # without a hand-maintained ci-test.env that drifts on every new
      # ${VAR:?}. Helper: scripts/ci/lib/compose-dummy-env.ts. Detects:
      #   - YAML syntax errors
      #   - service/volume/network references that don't resolve
      #   - `${VAR:?}` shapes the regex doesn't yet recognise (surfaces as
      #     compose's own interpolation error)
      - name: Phase A2 — validate compose interpolation (droplet/prod/dev)
        run: |
          node scripts/ci/preflight-validate.ts \
            docker-compose.droplet.yml \
            docker-compose.prod.yml \
            docker-compose.yml

      # ── Phase A3 — NATS SSoT drift check (services.yaml ↔ nats.conf) ────
      # ADR-015: `infrastructure/nats/services.yaml` is the single source
      # of truth for NATS authorization. `scripts/nats/generate-nats-conf.py`
      # regenerates the `authorization.users[]` block in nats.conf between
      # `# BEGIN GENERATED` / `# END GENERATED` sentinels. Running the
      # generator and asserting `git diff --quiet` catches the most common
      # drift pattern (operator edits services.yaml but forgets to run the
      # generator, OR hand-edits the generated block).
      - name: Phase A3 — NATS SSoT drift (services.yaml to nats.conf)
        run: |
          python3 scripts/nats/generate-nats-conf.py
          if ! git diff --quiet infrastructure/docker/nats/nats.conf; then
            echo "::error::nats.conf drifted from infrastructure/nats/services.yaml"
            echo "Run 'python3 scripts/nats/generate-nats-conf.py' locally and commit the diff."
            git diff infrastructure/docker/nats/nats.conf | head -100
            exit 1
          fi
          echo "OK: nats.conf matches services.yaml"

      # ── Phase A3 — cert CN list structural SSoT check ────────────────────
      # WS1 landed 2026-04-14 (commit 0d249dd0): generate-internal-certs.sh
      # now DERIVES its per-service cert CN loop from services.yaml via
      # inline python3 + PyYAML (no hardcoded list). Structural SSoT — but
      # regressions happen: a well-meaning refactor could re-introduce a
      # hardcoded list ("just for now") and drift would compile silently.
      # This guard asserts the script STILL derives from services.yaml.
      - name: Phase A3 — cert script reads services.yaml (structural)
        run: |
          if ! grep -q 'SERVICES_YAML=.*infrastructure/nats/services.yaml' \
              infrastructure/docker/scripts/generate-internal-certs.sh; then
            echo "::error::generate-internal-certs.sh no longer reads services.yaml."
            echo "The cert CN list MUST derive from SSoT. See ADR-015 + WS1 (commit 0d249dd0)."
            exit 1
          fi
          if ! grep -q 'python3.*yaml\.safe_load' \
              infrastructure/docker/scripts/generate-internal-certs.sh; then
            echo "::error::generate-internal-certs.sh lost its YAML parsing step."
            echo "The cert CN list MUST be parsed from services.yaml at script-run time."
            exit 1
          fi
          echo "OK: generate-internal-certs.sh derives CN list from services.yaml"

      # ── Phase A4 — helm chart template validation ────────────────────────
      # `helm template` runs the chart through go-template rendering without
      # touching any cluster. Catches:
      #   - template syntax errors
      #   - missing required values
      #   - schema violations on values.yaml
      #   - struct/list type mismatches
      # Both staging and production values files are rendered so neither
      # environment's manifest shape can regress silently.
      # Helm template dummy values — these are rendering-stage placeholders
      # so `{{ required ... }}` template directives pass; real values live
      # in a Kubernetes Secret / ExternalSecret at install time. The values
      # here deliberately do NOT match any real credential and would fail at
      # container runtime — exactly as intended (same design contract as the
      # auto-derived dummy env in Phase A2 above).

      # Tier-2 Make-Automatic: the chart's `dependencies:` block in Chart.yaml
      # is the SSoT for postgresql / redis / nats subchart versions and source
      # repos. `helm dependency update` populates `infrastructure/helm/aquaculture/charts/`
      # from that SSoT at CI time, so the .tgz archives never need to be
      # committed (Helm convention: `charts/` is build output, not source).
      # Without this step, `helm template` aborts with:
      #   Error: An error occurred while checking for chart dependencies.
      #   You may need to run `helm dependency build` to fetch missing
      #   dependencies: found in Chart.yaml, but missing in charts/ directory:
      #   postgresql, redis, nats
      # Mirrors the equivalent step in infra-helm-lint.yml. Why `update` and
      # not `build`: `build` reads Chart.lock and fetches exactly those
      # versions but requires the dependency repos to be pre-registered via
      # `helm repo add`; `update` reads Chart.yaml directly and resolves the
      # declared repository URLs without prior local registration. Chart.lock
      # is not committed in this repo (the SSoT lives in Chart.yaml's pinned
      # version strings), so on a fresh CI checkout `update` is the form
      # that works without an extra `helm repo add` per declared subchart.
      - name: Phase A4 — helm dependency update (Chart.yaml SSoT to charts/)
        run: helm dependency update infrastructure/helm/aquaculture

      - name: Phase A4 — helm chart template (values-production.yaml)
        run: |
          helm template aquaculture \
            infrastructure/helm/aquaculture \
            --values infrastructure/helm/aquaculture/values.yaml \
            --values infrastructure/helm/aquaculture/values-production.yaml \
            --set-string secrets.databaseUrl=postgres://ci:dummy@localhost:5432/ci \
            --set-string secrets.redisUrl=redis://:dummy@localhost:6379 \
            --set-string secrets.natsUrl=tls://nats:4222 \
            --set-string secrets.jwtPrivateKey=ci-dummy-jwt-private-key \
            --set-string secrets.jwtPublicKey=ci-dummy-jwt-public-key \
            --set-string secrets.passwordPepper=ci-dummy-password-pepper \
            --set-string secrets.mfaEncryptionKey=ci-dummy-mfa-encryption-key-not-for-runtime \
            --set-string secrets.stripeWebhookSecret=ci-dummy-stripe-webhook \
            --set-string secrets.stripeApiKey=ci-dummy-stripe-api-key \
            --skip-tests \
            > /tmp/helm-prod.yaml
          echo "OK: helm template (production) rendered $(wc -l < /tmp/helm-prod.yaml) lines"

      # Staging-only dummy passwords: values-staging.yaml sets
      # `postgresql.enabled: true` and `redis.enabled: true` (in-cluster
      # subcharts), so the chart's validatePasswords helper requires both
      # `postgresql.auth.password` and `redis.auth.password` at template
      # time. Production overlay disables both subcharts (RDS + ElastiCache),
      # so the production step above does not need these set. The dummies
      # are rendering-stage placeholders only — the chart's required
      # guards bypass at runtime via the externalSecrets path or operator-
      # supplied --set values. Same design contract as the secrets.* dummies.
      - name: Phase A4 — helm chart template (values-staging.yaml)
        run: |
          helm template aquaculture \
            infrastructure/helm/aquaculture \
            --values infrastructure/helm/aquaculture/values.yaml \
            --values infrastructure/helm/aquaculture/values-staging.yaml \
            --set-string secrets.databaseUrl=postgres://ci:dummy@localhost:5432/ci \
            --set-string secrets.redisUrl=redis://:dummy@localhost:6379 \
            --set-string secrets.natsUrl=tls://nats:4222 \
            --set-string secrets.jwtPrivateKey=ci-dummy-jwt-private-key \
            --set-string secrets.jwtPublicKey=ci-dummy-jwt-public-key \
            --set-string secrets.passwordPepper=ci-dummy-password-pepper \
            --set-string secrets.mfaEncryptionKey=ci-dummy-mfa-encryption-key-not-for-runtime \
            --set-string secrets.stripeWebhookSecret=ci-dummy-stripe-webhook \
            --set-string secrets.stripeApiKey=ci-dummy-stripe-api-key \
            --set-string postgresql.auth.password=ci-dummy-postgres-pw \
            --set-string redis.auth.password=ci-dummy-redis-pw \
            --skip-tests \
            > /tmp/helm-staging.yaml
          echo "OK: helm template (staging) rendered $(wc -l < /tmp/helm-staging.yaml) lines"

      # ── Phase A4 — required-secret manifest lint ─────────────────────────
      # `infrastructure/deploy/required-secrets.yaml` is the SSoT for which
      # env vars are mandatory at deploy time. `validate-required-secrets.py`
      # asserts that the manifest's secret list and the `${VAR:?}` patterns
      # across every listed compose file are in lockstep, and that each
      # secret's `required_by:` matches the compose files actually using it.
      # Any drift fails CI with an explicit "missing: VAR_NAME" message
      # (not a generic YAML parse error).
      #
      # The compose-↔-env interpolation check runs in Phase A2 above against
      # an auto-derived dummy env (Tier-2 Make-Automatic); this Phase A4 step
      # is the operator-facing manifest contract — it documents which secrets
      # the operator MUST provision in `/var/aqua-saas/.env` at deploy time.
      #
      # This closes the "operator adds ${STRIPE_SECRET_KEY:?} to compose but
      # forgets to update the deploy pre-flight manifest" failure mode that
      # crashed the 2026-04-14 deploy cascade.
      - name: Phase A4 — required-secret manifest SSoT
        run: python3 scripts/ci/validate-required-secrets.py

      - name: Phase A5 — deploy SSOT immutability gates
        run: bash scripts/ci/validate-deploy-ssot.sh

  # ---------------------------------------------------------------------------
  # PR-time infrastructure image build gate
  #
  # Main deploy builds infrastructure-owned runtime images such as Mosquitto.
  # This gate mirrors that build surface for PRs that touch those Docker
  # contexts, so broken upstream binary URLs, Dockerfile syntax, or package
  # install drift fail before the commit reaches main.
  # ---------------------------------------------------------------------------
  infra-image-build-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.infra_image_changed == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build Mosquitto infrastructure image (no push)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: infrastructure/mosquitto
          file: infrastructure/mosquitto/Dockerfile
          platforms: linux/amd64
          push: false
          tags: aquaculture-platform/mosquitto-ci:${{ github.sha }}

  # M-FE-03: npm audit on every PR — catches vulnerable dependencies before merge.
  # Only runs on PRs (not push to main) to avoid blocking deploys.
  security-audit:
    needs: [install, detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit
      - name: Validate dependency graph contracts
        run: npm ls typeorm uuid @nestjs/apollo @apollo/server @apollo/gateway @opentelemetry/api @opentelemetry/sdk-node
      - name: Run npm audit
        run: |
          set +e
          npm audit --audit-level=high --omit=dev --json > npm-audit-root.json
          AUDIT_STATUS=$?
          node scripts/ci/audit-source-map.mjs npm-audit-root.json npm-audit-source-map.md
          exit "$AUDIT_STATUS"
      - name: Upload npm audit source map
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-audit-source-map-${{ github.run_number }}
          path: |
            npm-audit-root.json
            npm-audit-source-map.md
          retention-days: 14

  docs-check:
    needs: detect-changes
    if: |
      always() &&
      contains(github.event.head_commit.modified, 'docs/') ||
      contains(github.event.head_commit.added, 'docs/')
    runs-on: ubuntu-latest
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Check markdown files
        run: markdownlint 'docs/**/*.md' --ignore node_modules

  sensor-service-gates:
    needs: [install, detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit
      - name: Run sensor enterprise gate fixtures
        run: >
          npx jest --config apps/sensor-service/jest.config.ts --runInBand
          --forceExit
          apps/sensor-service/src/edge-device/__tests__/agent-io-config-v2.spec.ts
          apps/sensor-service/src/edge-device/__tests__/edge-device.resolver.permissions.spec.ts
          apps/sensor-service/src/ingestion/__tests__/mqtt-listener.service.spec.ts

  sens-api-gateway-rust:
    needs: [install, detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: 1.88.0
      - name: Install TPM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libtss2-dev
      - name: Cargo check locked curated CI features
        working-directory: sens-api-gateway
        run: cargo check --locked --release --all-targets --features "$SENS_API_GATEWAY_CI_FEATURES"

  sens-enterprise-validation:
    needs: [install, detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore node_modules
        id: cache-nm
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Fallback install if cache missed
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit
      - name: Run Sens enterprise validation
        run: npm run gates:sens-enterprise-validation
      - name: Upload Sens enterprise validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sens-enterprise-validation-${{ github.run_number }}
          path: artifacts/sens-enterprise-validation/**
          if-no-files-found: error
          retention-days: 14

  sens-enterprise-summary:
    needs:
      - detect-changes
      - install
      - lint
      - type-check
      - test
      - sensor-service-gates
      - sens-api-gateway-rust
      - sens-enterprise-validation
      - build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on skipped, cancelled or failed Sens dependencies
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            exit 0
          fi
          if [ "${{ needs.detect-changes.outputs.has_changes }}" != "true" ]; then
            exit 0
          fi
          for result in \
            "${{ needs.install.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.type-check.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.sensor-service-gates.result }}" \
            "${{ needs.sens-api-gateway-rust.result }}" \
            "${{ needs.sens-enterprise-validation.result }}" \
            "${{ needs.build.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Sens enterprise dependency did not succeed: $result"
              exit 1
            fi
          done

  # ---------------------------------------------------------------------------
  deploy-staging:
    permissions:
      contents: write
      packages: write
    needs:
      - detect-changes
      - release-decision
      - install
      - lint
      - type-check
      - test
      - build
      - pre-flight
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.release-decision.outputs.deploy_required == 'true' &&
      needs.release-decision.outputs.obsolete != 'true' &&
      needs.detect-changes.result == 'success' &&
      (
        needs.detect-changes.outputs.has_changes != 'true' ||
        (
          needs.install.result == 'success' &&
          needs.lint.result == 'success' &&
          needs.type-check.result == 'success' &&
          needs.test.result == 'success' &&
          needs.build.result == 'success' &&
          needs.pre-flight.result == 'success'
        )
      )
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Deploy to DigitalOcean — production droplet (push-to-main only).
  #
  # ARCH-CI-009 + ADR-016: PRs run affected lint/type-check/test/build before
  # merge, and push-to-main runs the same affected job surface before invoking
  # deploy-digitalocean.yml. Production deploy must never start from a run where
  # affected gates were skipped solely because the event was `push`.
  #
  # Restoration history:
  #   - deploy-digitalocean.yml was authored as a workflow_call subworkflow
  #     ("invoked from .github/workflows/ci-affected.yml as the final job
  #     after lint/type-check/test/build all pass on push to main"). That
  #     invocation never landed in ci-affected.yml; the deploy workflow
  #     could only fire via manual workflow_dispatch and was therefore
  #     decoupled from main, breaking the staging-gate audit trail.
  #   - This job closes that gap: every push to main triggers the deploy
  #     subworkflow with `services: 'auto'` and no staging-gate bypass after
  #     the affected main gates above have succeeded.
  #     Operator-initiated workflow_dispatch is unchanged.
  #
  # secrets: inherit forwards DROPLET_HOST, DROPLET_SSH_KEY, DROPLET_USER,
  # STAGING_DROPLET_HOST + GITHUB_TOKEN (packages:write) to the called
  # workflow. The called workflow declares its own permissions at the
  # workflow level (contents: write, packages: write, id-token: write),
  # which override this caller's contents:read constraint.
  # ---------------------------------------------------------------------------
  deploy:
    # ARCH-CI-016 — reusable-workflow caller permission elevation.
    #
    # The called workflow `deploy-digitalocean.yml` declares
    #   contents: write   (push deployed/production tag)
    #   packages: write   (push GHCR images)
    #   id-token: write   (OIDC auth)
    # GitHub Actions inherits permissions FROM the caller into the called
    # workflow; a called workflow can LOWER but never RAISE the caller's
    # permission scope. This workflow's top-level `permissions: contents: read`
    # is therefore too narrow — every push-to-main run since PR #293's
    # deploy-chain restoration aborts BEFORE the deploy job starts with
    # `startup_failure` and no surfaced log (the validation phase rejects
    # the call before any job container boots).
    #
    # The job-level permissions block below is the architecturally correct
    # fix: scope the elevation to JUST this one job (deploy), keep the
    # top-level read-only posture for every other job, and make the
    # caller→called permission relationship a static, reviewable contract.
    #
    # SSoT pair invariant: adding/removing a permission to
    # deploy-digitalocean.yml's top-level permissions block MUST be
    # mirrored here in the same PR — otherwise the next push-to-main
    # reintroduces startup_failure on the new permission delta.
    permissions:
      contents: write
      packages: write
      id-token: write
    needs:
      - detect-changes
      - release-decision
      - deploy-staging
      - install
      - lint
      - type-check
      - test
      - build
      - pre-flight
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.release-decision.outputs.deploy_required == 'true' &&
      needs.release-decision.outputs.obsolete != 'true' &&
      needs.deploy-staging.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      (
        needs.detect-changes.outputs.has_changes != 'true' ||
        (
          needs.install.result == 'success' &&
          needs.lint.result == 'success' &&
          needs.type-check.result == 'success' &&
          needs.test.result == 'success' &&
          needs.build.result == 'success' &&
          needs.pre-flight.result == 'success'
        )
      )
    uses: ./.github/workflows/deploy-digitalocean.yml
    secrets: inherit
    # bypass_staging_gate + bypass_reason are intentionally NOT passed —
    # the called workflow defaults them to 'false' / '' which is the
    # correct posture for an automated push-to-main deploy. Passing
    # them explicitly here would force a string value past actionlint's
    # bool/string parser ambiguity for the literal 'false', and emergency
    # bypass remains operator-initiated via workflow_dispatch.
    with:
      services: 'auto'

  production-post-deploy-verify:
    needs:
      - deploy
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    uses: ./.github/workflows/production-post-deploy-verify.yml
    secrets: inherit
    with:
      target_sha: ${{ github.sha }}

  merge-gate:
    needs:
      - detect-changes
      - install
      - lint
      - type-check
      - test
      - build
      - pre-flight
      - infra-image-build-check
      - security-audit
      - sensor-service-gates
      - sens-api-gateway-rust
      - sens-enterprise-validation
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Assert required PR checks
        run: |
          set -euo pipefail
          if [ "${{ needs.detect-changes.result }}" != "success" ]; then
            echo "::error::detect-changes did not succeed"
            exit 1
          fi
          if [ "${{ needs.detect-changes.outputs.has_changes }}" != "true" ]; then
            echo "No affected code/deploy changes; merge gate passes."
            exit 0
          fi
          for entry in \
            "install:${{ needs.install.result }}" \
            "lint:${{ needs.lint.result }}" \
            "type-check:${{ needs.type-check.result }}" \
            "test:${{ needs.test.result }}" \
            "build:${{ needs.build.result }}" \
            "pre-flight:${{ needs.pre-flight.result }}" \
            "infra-image-build-check:${{ needs.infra-image-build-check.result }}" \
            "security-audit:${{ needs.security-audit.result }}" \
            "sensor-service-gates:${{ needs.sensor-service-gates.result }}" \
            "sens-api-gateway-rust:${{ needs.sens-api-gateway-rust.result }}" \
            "sens-enterprise-validation:${{ needs.sens-enterprise-validation.result }}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              echo "::error::${name} result=${result}"
              exit 1
            fi
          done
          echo "Merge gate passed."
