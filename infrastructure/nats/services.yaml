      - 'events.*.AiServiceTenantDataErasureFailed'
      - 'events.*.AiServiceTenantErasureBlocked'
      - 'events.platform.schema-migration.>'
      - 'events.security.events.>'
      # create_task actuation tool → farm-service responder (request-reply)
      - 'request.farm.createTask'
      - 'request.farm.getTankRegistry'
      - 'request.farm.getBatchOverview'
      - 'request.farm.getWaterQualityOverview'
      - 'request.farm.getHarvestOverview'
