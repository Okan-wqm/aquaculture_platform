# =============================================================================
# Redis TLS Configuration - Aquaculture Platform (Production)
# =============================================================================
#
# This config enables TLS on Redis. Use this for production deployments
# where encryption in transit is required.
#
# Prerequisites:
#   1. Mount certificates into /etc/redis/certs/:
#        - ca-cert.pem     (CA certificate)
#        - redis-cert.pem  (server certificate)
#        - redis-key.pem   (server private key)
#
#   2. In docker-compose, mount this file as /etc/redis/redis.conf
#      and the certs directory:
#
#        volumes:
#          - ./infrastructure/docker/redis/redis-tls.conf:/etc/redis/redis.conf:ro
#          - ./certs/redis:/etc/redis/certs:ro
#
#   3. Set REDIS_TLS=true in all backend service environments.
#
#   4. Update the Redis healthcheck to use TLS:
#        test: ["CMD-SHELL", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli --tls --cacert /etc/redis/certs/ca-cert.pem ping"]
#
# Certificate generation (self-signed, for internal use):
#   # CA key and cert
#   openssl genrsa -out ca-key.pem 4096
#   openssl req -new -x509 -days 3650 -key ca-key.pem -out ca-cert.pem -subj "/CN=Aqua Redis CA"
#
#   # Server key and cert
#   openssl genrsa -out redis-key.pem 2048
#   openssl req -new -key redis-key.pem -out redis.csr -subj "/CN=redis"
#   openssl x509 -req -days 365 -in redis.csr -CA ca-cert.pem -CAkey ca-key.pem -CAcreateserial -out redis-cert.pem
#   rm redis.csr
#
# =============================================================================

# --- General ---
appendonly yes

# --- TLS ---
# Disable unencrypted port
port 0

# Enable TLS on the standard Redis port
tls-port 6379

# Certificate paths (mounted from host)
tls-cert-file /etc/redis/certs/redis-cert.pem
tls-key-file /etc/redis/certs/redis-key.pem
tls-ca-cert-file /etc/redis/certs/ca-cert.pem

# Do not require client certificates (services authenticate via password)
# Set to "yes" if you want mutual TLS (mTLS)
tls-auth-clients no

# TLS protocol versions (minimum TLS 1.2)
tls-protocols "TLSv1.2 TLSv1.3"

# Prefer server cipher order
tls-prefer-server-ciphers yes

# --- Network ---
bind 0.0.0.0

# --- Security ---
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
# rename-command DEBUG ""
