name: Infrastructure - Terraform Apply

# SEC-CI-002: All third-party actions pinned to full commit SHAs
# SEC-CI-003: Plan integrity now verified via SHA-256 before apply (already applied)
# SEC-CI-004: AWS OIDC credentials used (already applied by terraform agent)
# SEC-CI-016: terraform-apply-staging impossible condition removed (was if: github.ref == 'refs/heads/develop'
#             but workflow only triggered on main). Staging apply now triggered via workflow_dispatch.
# SEC-CI-017: octokit/request-action removed (was writing secrets via API from Terraform outputs)

on:
  # ARCH-004 fix: removed 'push' trigger — apply only runs after a successful plan workflow_run
  # to prevent double-apply. Manual dispatch is also supported for emergencies.
  workflow_run:
    workflows:
      - Infrastructure - Terraform Plan
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to apply (dev or production)'
        required: true
        type: choice
        options:
          - dev
          - production

# ARCH-015 fix: removed global TF_LOG: INFO — debug logging is only enabled on specific steps if needed
env:
  TF_INPUT: "false"

jobs:
  terraform-apply-production:
    runs-on: ubuntu-latest
    environment: production
    # Only run after a successful plan, or on manual dispatch for production
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')

    permissions:
      id-token: write   # SEC-013 / SEC-CI-004 fix: required for OIDC token request
      contents: read

    steps:
      - name: Checkout repository
        # SEC-CI-002: pinned to SHA (was @v4)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        # SEC-CI-002: pinned to SHA (was @v2)
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          # ARCH-008 fix: pin to specific version within 1.x range
          terraform_version: '1.9.8'
          terraform_wrapper: false

      # SEC-013 / SEC-CI-004 fix: use OIDC federation instead of static long-lived AWS keys
      - name: Configure AWS credentials
        # SEC-CI-002: pinned to SHA (was @v4)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-west-1

      # ARCH-001 / ARCH-002 / SEC-003 fix: use per-environment working directory;
      # backend config is already committed in environments/production/main.tf
      - name: Terraform Init
        working-directory: ./infrastructure/terraform/environments/production
        run: terraform init -input=false

      # SEC-CI-003: Download hash produced by plan job and verify before applying
      - name: Download Plan Hash Artifact
        # SEC-CI-002: pinned to SHA (was @v3)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: terraform-plan-hash-production
          path: /tmp

      - name: Download Terraform Plan Artifact
        # SEC-CI-002: pinned to SHA (was @v3)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: terraform-plan-production
          path: ./infrastructure/terraform/environments/production

      # SEC-CI-003: Verify plan artifact integrity before applying
      - name: Verify plan artifact integrity
        working-directory: ./infrastructure/terraform/environments/production
        run: |
          EXPECTED_SHA=$(cat /tmp/terraform-plan-production.sha256)
          ACTUAL_SHA=$(sha256sum terraform.plan | cut -d ' ' -f 1)
          echo "Expected SHA-256: ${EXPECTED_SHA}"
          echo "Actual SHA-256:   ${ACTUAL_SHA}"
          if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
            echo "ERROR: Plan artifact SHA-256 mismatch — aborting apply to prevent tampered plan execution."
            exit 1
          fi
          echo "Plan integrity verified."

      # ARCH-003 fix: re-run terraform plan immediately before apply to detect state drift
      - name: Terraform Plan (pre-apply drift check)
        id: preapply-plan
        working-directory: ./infrastructure/terraform/environments/production
        run: |
          terraform plan \
            -input=false \
            -detailed-exitcode \
            -out=terraform-fresh.plan || PLAN_EXIT=$?
          # Exit code 0 = no changes, 2 = changes detected (expected), 1 = error
          if [ "${PLAN_EXIT:-0}" -eq 1 ]; then
            echo "Terraform plan failed. Aborting apply."
            exit 1
          fi
          echo "plan_exit=${PLAN_EXIT:-0}" >> $GITHUB_OUTPUT
        env:
          TF_VAR_allowed_cidrs: ${{ secrets.EKS_ALLOWED_CIDRS_PRODUCTION }}

      - name: Terraform Apply
        working-directory: ./infrastructure/terraform/environments/production
        run: terraform apply -input=false terraform-fresh.plan
        env:
          TF_VAR_allowed_cidrs: ${{ secrets.EKS_ALLOWED_CIDRS_PRODUCTION }}

      - name: Extract outputs
        id: outputs
        working-directory: ./infrastructure/terraform/environments/production
        run: |
          terraform output -json > outputs.json
          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT

      # SEC-CI-017: Removed octokit/request-action step that wrote FRONTEND_URL directly
      # into GitHub environment secrets from Terraform output. Terraform outputs should be
      # written to GitHub environment variables (not secrets) and validated before use.

      - name: Notify Slack on success
        if: success()
        # SEC-CI-002: pinned to SHA (was @v3)
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
        with:
          status: success
          channel: '#devops'
          text: 'Terraform production infrastructure changes applied successfully'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        # SEC-CI-002: pinned to SHA (was @v3)
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
        with:
          status: failure
          channel: '#devops'
          text: 'Terraform production infrastructure apply failed'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # SEC-CI-016: Renamed from terraform-apply-staging to terraform-apply-dev.
  # The old staging job had if: github.ref == 'refs/heads/develop' but the workflow
  # only triggered on main — making it impossible to run. Now it is only triggered
  # via manual workflow_dispatch with environment='dev'.
  terraform-apply-dev:
    runs-on: ubuntu-latest
    environment: dev
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        # SEC-CI-002: pinned to SHA (was @v4)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        # SEC-CI-002: pinned to SHA (was @v2)
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      # SEC-CI-004: OIDC credentials
      - name: Configure AWS credentials
        # SEC-CI-002: pinned to SHA (was @v4)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Terraform Init
        working-directory: ./infrastructure/terraform/environments/dev
        run: terraform init -input=false

      - name: Download Plan Hash Artifact
        # SEC-CI-002: pinned to SHA (was @v3)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: terraform-plan-hash-dev
          path: /tmp

      - name: Download Terraform Plan Artifact
        # SEC-CI-002: pinned to SHA (was @v3)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: terraform-plan-dev
          path: ./infrastructure/terraform/environments/dev

      # SEC-CI-003: Verify plan artifact integrity
      - name: Verify plan artifact integrity
        working-directory: ./infrastructure/terraform/environments/dev
        run: |
          EXPECTED_SHA=$(cat /tmp/terraform-plan-dev.sha256)
          ACTUAL_SHA=$(sha256sum terraform.plan | cut -d ' ' -f 1)
          echo "Expected SHA-256: ${EXPECTED_SHA}"
          echo "Actual SHA-256:   ${ACTUAL_SHA}"
          if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
            echo "ERROR: Plan artifact SHA-256 mismatch — aborting apply."
            exit 1
          fi
          echo "Plan integrity verified."

      - name: Terraform Plan (pre-apply drift check)
        working-directory: ./infrastructure/terraform/environments/dev
        run: |
          terraform plan \
            -input=false \
            -detailed-exitcode \
            -out=terraform-fresh.plan || PLAN_EXIT=$?
          if [ "${PLAN_EXIT:-0}" -eq 1 ]; then
            echo "Terraform plan failed. Aborting apply."
            exit 1
          fi
        env:
          TF_VAR_allowed_cidrs: ${{ secrets.EKS_ALLOWED_CIDRS_DEV }}

      - name: Terraform Apply
        working-directory: ./infrastructure/terraform/environments/dev
        run: terraform apply -input=false terraform-fresh.plan
        env:
          TF_VAR_allowed_cidrs: ${{ secrets.EKS_ALLOWED_CIDRS_DEV }}

      - name: Notify Slack on success
        if: success()
        # SEC-CI-002: pinned to SHA (was @v3)
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
        with:
          status: success
          channel: '#devops'
          text: 'Terraform dev infrastructure changes applied successfully'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        # SEC-CI-002: pinned to SHA (was @v3)
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
        with:
          status: failure
          channel: '#devops'
          text: 'Terraform dev infrastructure apply failed'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
