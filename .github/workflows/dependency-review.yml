name: Dependency Review

# SEC-CI-002: All third-party actions pinned to full commit SHAs

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        # SEC-CI-002: pinned to SHA (was @v4)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review
        # SEC-CI-002: pinned to SHA (was @v3)
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: moderate
          # Allowlisted advisories — every entry MUST have a matching tracked
          # finding in docs/reviews/_registry/findings.jsonl and mirror the
          # ignore entries in deny.toml [advisories] + .cargo/audit.toml. Drift
          # between these three lists is a review-blocker. Full rationale +
          # threat-model justification lives in deny.toml.
          # allow-ghsas expects a COMMA-separated list. Prior `|` multi-line form
          # produced a single blob string that the action could not parse.
          allow-ghsas: GHSA-xgp8-3hg3-c2mh,GHSA-965h-392x-2mh5,GHSA-pwjx-qhcg-rvj4
