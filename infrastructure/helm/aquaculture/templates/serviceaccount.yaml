{{/*
=============================================================================
Aquaculture Platform - Service Accounts and RBAC
=============================================================================
Per-service ServiceAccounts are created to limit blast radius of a pod
compromise. automountServiceAccountToken is set to false on all accounts and
Deployments — no service requires direct Kubernetes API access at runtime.

A single scoped Role is created for the namespace covering only the
permissions the application actually needs (ConfigMap reads for config
hot-reloads). Each service SA is bound to this Role via a RoleBinding.
=============================================================================
*/}}

{{- if .Values.serviceAccount.create }}

{{/* ---- Backend ServiceAccounts ---- */}}

{{- if .Values.gatewayApi.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aquaculture.fullname" . }}-gateway-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aquaculture.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}

