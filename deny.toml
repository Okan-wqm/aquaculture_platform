[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Each ignored advisory MUST carry: (a) a tracking finding id, (b) an
# explicit owner, (c) a deadline, (d) the threat-model justification.
# Anything that cannot satisfy all four belongs in the build, not in
# this list. Ignores are reviewed at every quarterly security audit, and
# scripts/ci/check-advisory-ignore-sync.ts fails CI on any entry whose
# deadline has passed or that drifts from .cargo/audit.toml / the CI
# --ignore flags.
#
# 2026-06-11 — RUST-CVE-001 RESOLVED: the rumqttc-chain ignores
# (RUSTSEC-2026-0098/0099/0049/0104, RUSTSEC-2025-0134) were removed.
# rumqttc now resolves to the vendored fork at crates/local-rumqttc
# (rustls-webpki >= 0.103, PEM decoding via rustls-pki-types), and the
# testcontainers 0.27 bump cleared the last rustls-pemfile consumer
# (bollard >= 0.20). The [bans] table below makes reintroduction of
# either vulnerable line a build failure, not an audit warning.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
# Workspace members carry `license = "Proprietary"` (publish = false, first-
# party). "Proprietary" is not a valid SPDX identifier, so cargo-deny would
# otherwise flag them as unlicensed. private.ignore tells cargo-deny to skip
# license enforcement for crates that are workspace-private — exactly the
# semantic we want. Third-party deps still go through the SPDX allow list above.
private = { ignore = true }

[[licenses.exceptions]]
allow = ["OpenSSL"]
name = "ring"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# OpenSSL banned platform-wide — rustls only (matches sens-api-gateway policy).
# In-process cert handling: use rustls + x509-parser + pem.
# Dependency bypasses go through ADR amendment, not deny.toml exceptions.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    # RUST-CVE-001 regression guards: the vulnerable rustls-webpki line
    # (RUSTSEC-2026-0098/0099/0049/0104) and the unmaintained
    # rustls-pemfile (RUSTSEC-2025-0134) must never re-enter the graph.
    # The fix lives in crates/local-rumqttc (see UPSTREAM.md).
    { name = "rustls-webpki", version = "<0.103" },
    { name = "rustls-pemfile" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
