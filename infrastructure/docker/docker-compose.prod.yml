    container_name: aqua-admin-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-aquaculture}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DATABASE_SCHEMA: admin
      DATABASE_SYNC: 'false' # ARCH-DB-001: Production'da synchronize kapalı, migration kullanılmalı
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET}
      # Rate limiting: admin panel fires ~15 requests on page load
      THROTTLE_DEFAULT_LIMIT: 500
      THROTTLE_DEFAULT_TTL: 60
    depends_on:
      - postgres
      - redis
    networks:
      - aqua-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health/live"]
