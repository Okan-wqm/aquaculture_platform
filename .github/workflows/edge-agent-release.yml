name: Edge Agent Release

# ADR-048 DEC-8.5, DEC-20, DEC-28 — the edge agent release pipeline.
#
# RELEASE-CONTRACT: release creation is tag-only. Do not use manual arbitrary-version dispatch.
#
# Every build row comes from `scripts/edge/edge_release.py plan`, which derives
# it from contracts/suderra-edge/v1 (boards.json, artifact-naming.json) and
# sens-api-gateway/release/edge-release.toml:
#   - Suderra OS channel: one suderra-agent-os-<version>-<board_profile>-<arch>.tar.gz
#     per buildable boards.json board, holding exactly `suderra-agent`, built with
#     exactly the board's cargo features, with its DSSE suderra.edge-release.v1
#     statement <artifact>.release.dsse.json beside it;
#   - generic-Linux channel (frozen, DEC-28): suderra-agent-<version>-<slug>.tar.gz
#     for x86_64-linux, aarch64-linux and armv7-linux, holding `edge-agent`.
#
# Order: the tag's commit passes the gateway CI and the profile CI (every
# feature set tested, every row cross-built) -> cache-free release builds ->
# a separate signing job in the protected `edge-release` environment signs the
# statements over the exact artifact bytes -> the publish job verifies every
# statement before cosign (provenance only, DEC-3.8) and the GitHub release.

on:
  push:
    tags:
      - 'agent-v*'

# Cancel in-progress runs for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: '1.88.0'
  CROSS_VERSION: '0.2.5'

jobs:
  release-ref-contract:
    name: Release ref contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.contract.outputs.tag }}
      version: ${{ steps.contract.outputs.version }}
      cargo_version: ${{ steps.contract.outputs.cargo_version }}
      channel: ${{ steps.contract.outputs.channel }}
      prerelease: ${{ steps.contract.outputs.prerelease }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release ref
        id: contract
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "Edge releases must run from a pushed tag, got event=${GITHUB_EVENT_NAME} ref_type=${GITHUB_REF_TYPE:-unset}"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#agent-v}"
          if [ "${VERSION}" = "${GITHUB_REF_NAME}" ]; then
            echo "Release tag must use canonical agent-v<semver> format, got ${GITHUB_REF_NAME}"
            exit 1
          fi
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "Release tag must use canonical agent-v<exact Cargo semver>, got ${GITHUB_REF_NAME}"
            exit 1
          fi
          CARGO_VERSION="$(awk -F' = ' '/^version = / { gsub(/"/, "", $2); print $2; exit }' sens-api-gateway/Cargo.toml)"
          if [ -z "${CARGO_VERSION}" ]; then
            echo "Could not read sens-api-gateway Cargo package version"
            exit 1
          fi
          if [ "${VERSION}" != "${CARGO_VERSION}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match Cargo version ${CARGO_VERSION}; expected agent-v${CARGO_VERSION}"
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "agent-v${CARGO_VERSION}" ]; then
            echo "Release tag must be exactly agent-v${CARGO_VERSION}, got ${GITHUB_REF_NAME}"
            exit 1
          fi
          if printf '%s' "${VERSION}" | grep -q -- '-'; then
            CHANNEL="${VERSION#*-}"
            PRERELEASE="true"
          else
            CHANNEL="stable"
            PRERELEASE="false"
          fi

          # Tag-triggered checkouts do not reliably keep branch tracking refs.
          # Fetch main via a fully-qualified refspec so the reachability guard
          # cannot accidentally prune or miss refs/remotes/origin/main.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git show-ref --verify --quiet refs/remotes/origin/main
          TAG_COMMIT="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} (${TAG_COMMIT}) is not reachable from origin/main"
            exit 1
          fi

          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "cargo_version=${CARGO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

  sens-enterprise-validation:
    name: Sens enterprise validation
    needs: release-ref-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release-ref.outputs.tag }}
      version: ${{ steps.release-ref.outputs.version }}
    env:
      SENS_ENTERPRISE_RELEASE: '1'
      SENS_ENTERPRISE_RELEASE_PROFILE: edge-agent-scada-display
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # DEC-20: nothing a release job restores from a cache.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Run Sens enterprise validation
        run: npm run gates:sens-enterprise-validation -- --release --release-profile=edge-agent-scada-display

      - name: Export validated release ref
        id: release-ref
        run: |
          echo "tag=${{ needs.release-ref-contract.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ needs.release-ref-contract.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Upload Sens enterprise validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sens-enterprise-release-validation-${{ needs.release-ref-contract.outputs.tag }}-${{ github.run_number }}
          path: artifacts/sens-enterprise-validation/**
          if-no-files-found: error
          retention-days: 30

  plan:
    name: Release plan (contracts/suderra-edge/v1)
    needs: release-ref-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails before any build when the contract, the release facts and the
      # crate's cargo features disagree, or a statement field would not pass
      # the contract schema.
      - name: Plan every build row from the contract
        id: plan
        env:
          RELEASE_VERSION: ${{ needs.release-ref-contract.outputs.version }}
        run: python3 -I scripts/edge/edge_release.py plan --expect-version "${RELEASE_VERSION}" --github-output "${GITHUB_OUTPUT}"

  # INFRA-HIGH-237: the release builds only a commit whose own CI is green.
  # fmt, check, clippy, every test job (including the suderra-os profile),
  # cargo deny and cargo audit run on the tag's commit itself.
  gateway-ci:
    name: Gateway CI on the release commit
    needs: release-ref-contract
    permissions:
      contents: read
    uses: ./.github/workflows/sens-api-gateway-ci.yml

  # Every release feature set (gpio for rpi4-cm4, suderra-os, the generic
  # tier) tested on the host, and every release row cross-built and packaged
  # through the ELF NEEDED check, on the tag's commit.
  profile-ci:
    name: Profile CI on the release commit
    needs: release-ref-contract
    permissions:
      contents: read
    uses: ./.github/workflows/ci-edge.yml

  build:
    name: Build ${{ matrix.artifact }}
    needs:
      - release-ref-contract
      - sens-enterprise-validation
      - plan
      - gateway-ci
      - profile-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    env:
      RELEASE_TAG: ${{ needs.release-ref-contract.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-ref-contract.outputs.version }}
      CHANNEL: ${{ matrix.channel }}
      BUILD_ID: ${{ matrix.id }}
      RUST_TARGET: ${{ matrix.rust_target }}
      FEATURES: ${{ matrix.features }}
      ARTIFACT: ${{ matrix.artifact }}
      ARTIFACT_BASE: ${{ matrix.base }}
      CARGO_BIN: ${{ matrix.cargo_bin }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/sens-api-gateway/target
    # DEC-20: release builds restore nothing from a cache; the binary that is
    # signed is built only from the tag's sources, the locked registry graph
    # and the pinned toolchain.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_target }}

      - name: Install cross
        run: cargo install cross --version "${CROSS_VERSION}" --locked

      - name: Build release binary
        working-directory: sens-api-gateway
        # BATCH-001-CI-FIX-012: LIBCLANG_PATH points the aws-lc-sys bindgen
        # library at the LLVM 12 install that Cross.toml's pre-build step
        # places at /usr/lib/llvm-12/lib. cross propagates this env var
        # INTO the container via `[build.env] passthrough = ["LIBCLANG_PATH"]`
        # in Cross.toml — the documented cross integration pattern.
        env:
          LIBCLANG_PATH: /usr/lib/llvm-12/lib
        run: cross build --locked --release --target-dir "$CARGO_TARGET_DIR" --target "$RUST_TARGET" --no-default-features --features "$FEATURES"

      # DEC-8.5: the binary is the row's architecture, asks for the glibc
      # loader and links only the runtime the OS provides; the archive holds
      # exactly the contract's member, root-owned, at the commit time.
      - name: Package binary and release evidence
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python3 -I scripts/edge/edge_release.py package \
            --channel "$CHANNEL" --id "$BUILD_ID" \
            --binary "${CARGO_TARGET_DIR}/${RUST_TARGET}/release/${CARGO_BIN}" \
            --out-dir dist
          cargo metadata --manifest-path sens-api-gateway/Cargo.toml --locked --format-version=1 \
            > "dist/${ARTIFACT_BASE}.cargo-metadata.sbom.json"
          python3 -I scripts/edge/edge_release.py provenance \
            --channel "$CHANNEL" --id "$BUILD_ID" \
            --artifact "dist/${ARTIFACT}" --tag "$RELEASE_TAG" --out-dir dist
          cp sens-api-gateway/docs/commercial/third-party-notices.md "dist/${ARTIFACT_BASE}.NOTICE.md"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.base }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
            dist/${{ matrix.base }}.cargo-metadata.sbom.json
            dist/${{ matrix.base }}.intoto.jsonl
            dist/${{ matrix.base }}.NOTICE.md
          if-no-files-found: error
          retention-days: 5

  # ADR-048 DEC-3.9 / DEC-20: the edge-release signature, in its own minimal
  # job: no cache, no third-party action, no toolchain — the runner's python3
  # and OpenSSL 3, GitHub's checkout and artifact transfer. It runs in the
  # protected environment `edge-release` (required reviewers; deployments only
  # from agent-v* tags), which holds:
  #   secret   EDGE_RELEASE_SIGNING_KEY  PKCS#8 PEM of the Ed25519 edge-release
  #            private key. P0: the dev/CI key (Suderra-OS scripts/gen-dev-keys.sh
  #            <dir>/edge/edge-release/1.key), pinned only by dev and QEMU images.
  #            From P1 the production key stays offline (DEC-3.9) and this job
  #            hands the unsigned payloads to its custodians.
  #   variable EDGE_RELEASE_KEYID        lowercase hex SHA-256 of that key's raw
  #            public key: the keyid the targeted images pin. The job refuses
  #            any other key, and every TEST-ONLY contract key.
  # Keys are never committed. A missing environment, secret or variable fails
  # the release.
  sign:
    name: Sign release statements (edge-release)
    needs:
      - release-ref-contract
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: edge-release
    permissions:
      contents: read
    outputs:
      keyid: ${{ steps.sign.outputs.keyid }}
    env:
      RELEASE_VERSION: ${{ needs.release-ref-contract.outputs.version }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      # The payload names the digests recomputed here from the downloaded
      # bytes, never digests a build job reported.
      - name: Build the unsigned release statements
        run: python3 -I scripts/edge/edge_release.py statements --artifacts dist --out-dir payloads --expect-version "${RELEASE_VERSION}"

      - name: Sign with the edge-release key
        id: sign
        env:
          EDGE_RELEASE_SIGNING_KEY: ${{ secrets.EDGE_RELEASE_SIGNING_KEY }}
          EDGE_RELEASE_KEYID: ${{ vars.EDGE_RELEASE_KEYID }}
        run: |
          set -euo pipefail
          python3 -I scripts/edge/edge_release.py sign \
            --artifacts dist --payloads payloads --out-dir statements \
            --key-env EDGE_RELEASE_SIGNING_KEY --expect-keyid "${EDGE_RELEASE_KEYID}"
          echo "keyid=${EDGE_RELEASE_KEYID}" >> "$GITHUB_OUTPUT"

      - name: Upload the unsigned payloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-statements
          path: payloads/*.release.payload.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload the signed statements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-statements
          path: |
            statements/*.release.dsse.json
            statements/edge-release.pub
          if-no-files-found: error
          retention-days: 5

  release:
    name: Create GitHub Release
    needs:
      - release-ref-contract
      - build
      - sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # SEC-CI-022: id-token required for keyless cosign signing via sigstore OIDC
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release-ref-contract.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-ref-contract.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.release-ref-contract.outputs.channel }}
      RELEASE_PRERELEASE: ${{ needs.release-ref-contract.outputs.prerelease }}
      STATEMENT_KEYID: ${{ needs.sign.outputs.keyid }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-*
          path: artifacts
          merge-multiple: true

      - name: Download signed release statements
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-release-statements
          path: statements

      # SENSOR-CRITICAL-202: nothing is published unless every planned
      # Suderra OS artifact carries a statement that verifies under the
      # edge-release key and names exactly these bytes.
      - name: Verify every release statement
        run: |
          set -euo pipefail
          python3 -I scripts/edge/edge_release.py verify \
            --artifacts artifacts --statements statements \
            --public-key statements/edge-release.pub --expect-keyid "${STATEMENT_KEYID}"
          cp statements/*.release.dsse.json artifacts/

      - name: List artifacts
        run: ls -lh artifacts/

      # SEC-CI-022: Install cosign for artifact signing
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # DEC-3.8: cosign keyless signatures are provenance evidence for the
      # cloud's release admission; devices trust only the Ed25519 statement.
      - name: Sign release artifacts with cosign
        run: |
          set -euo pipefail
          for file in artifacts/*.tar.gz artifacts/*.cargo-metadata.sbom.json artifacts/*.intoto.jsonl artifacts/*.NOTICE.md artifacts/*.release.dsse.json; do
            if [ ! -f "${file}" ]; then
              continue
            fi
            echo "Signing ${file}..."
            cosign sign-blob \
              --yes \
              --output-certificate "${file}.pem" \
              --output-signature "${file}.sig" \
              "${file}"
            echo "Signed: ${file}"
          done

      - name: Create release manifest
        run: |
          set -euo pipefail
          python3 -I scripts/edge/edge_release.py manifest \
            --artifacts artifacts --tag "${RELEASE_TAG}" --channel "${RELEASE_CHANNEL}" \
            --prerelease "${RELEASE_PRERELEASE}" --statement-keyid "${STATEMENT_KEYID}"

      - name: Sign release manifest with cosign
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --output-certificate artifacts/edge-release-manifest.json.pem \
            --output-signature artifacts/edge-release-manifest.json.sig \
            artifacts/edge-release-manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2.2.1
        with:
          name: "Edge Agent ${{ env.RELEASE_TAG }}"
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          generate_release_notes: true
          body: |
            ## Suderra Edge Agent ${{ env.RELEASE_TAG }}

            Tag-only release built from a commit reachable from `origin/main`,
            after the gateway CI and the profile CI passed on that commit.
            `edge-release-manifest.json` lists every file with its digest.

            ### Suderra OS channel (ADR-048)

            One `suderra-agent-os-${{ env.RELEASE_VERSION }}-<board_profile>-<arch>.tar.gz`
            per board of `contracts/suderra-edge/v1/boards.json`, holding `suderra-agent`,
            with its Ed25519 DSSE release statement `<artifact>.release.dsse.json`
            (`suderra.edge-release.v1`, edge-release key `${{ env.STATEMENT_KEYID }}`).
            Suderra OS installs it only through a signed provisioning manifest that
            names the statement; root verifies the statement and both digests.

            ### Generic-Linux channel (ADR-048 DEC-28)

            `suderra-agent-${{ env.RELEASE_VERSION }}-<slug>.tar.gz` for `x86_64-linux`,
            `aarch64-linux` and `armv7-linux`, holding `edge-agent`. The cloud's
            installer and update scripts fetch and install it.

            ### Provenance

            Every file carries `.sig`/`.pem` cosign keyless signature material, plus
            `.sha256`, `.cargo-metadata.sbom.json`, `.intoto.jsonl` and `.NOTICE.md`
            per artifact. Verify a signature:

            ```bash
            cosign verify-blob \
              --certificate <file>.pem \
              --signature <file>.sig \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/edge-agent-release.yml@refs/tags/${{ env.RELEASE_TAG }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              <file>
            ```
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/*.sig
            artifacts/*.cargo-metadata.sbom.json
            artifacts/*.intoto.jsonl
            artifacts/*.release.dsse.json
            artifacts/edge-release-manifest.json
            artifacts/*.NOTICE.md
            artifacts/*.pem
