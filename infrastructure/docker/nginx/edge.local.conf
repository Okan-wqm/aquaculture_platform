# =============================================================================
# Local edge reverse proxy — docker-compose.yml / docker-compose.dev.yml
#
# APA-253: the LOCAL compose stacks previously published the shell container on
# :8080 directly, and the shell's own nginx (shell.conf, ARCH-NM-003) serves
# static assets ONLY — it has no /api routing. So /api/* fell through to the SPA
# fallback and returned index.html (HTTP 200) instead of reaching admin-api,
# which the FE http-client then fed to JSON.parse (opaque SyntaxError).
#
# This edge restores the SAME /api contract production uses by `include`ing the
# shared SSoT fragment, and fronts the shell + Module-Federation remotes so
# localhost:8080 behaves identically to the droplet/prod edge. The shell no
# longer publishes 8080 directly, preserving ARCH-NM-003 (shell serves static).
#
# Mounted as /etc/nginx/conf.d/default.conf; the stock nginx image's main
# nginx.conf provides the surrounding http{} context and includes conf.d/*.conf.
# =============================================================================

# Docker embedded DNS — required for the variable-based proxy_pass in the shared
# fragment (and below) so upstream container IPs re-resolve after recreation.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Rate-limit zone consumed by the shared /api fragment (the stock image's
# nginx.conf does not define it, unlike droplet.conf / the prod outer nginx.conf).
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

server {
    listen 80;
    server_name _;

    # nginx-level health check (compose healthcheck target).
    location = /nginx-health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ── /api contract (SSoT) — shared with droplet.conf + nginx.prod.conf ────
    include /etc/nginx/includes/api-routing.conf;

    # ── Module Federation remotes ────────────────────────────────────────────
    # The dev-build shell (vite `command === 'serve'`) loads remotes from
    # http://localhost:8080/mf/<module>/remoteEntry.js; the containerized
    # (production-build) shell loads them from /remotes/<module>/. Route both to
    # the module containers (path-stripped) so either shell build resolves. The
    # captured <module> segment IS the module container's docker hostname
    # (dashboard, farm-module, admin-panel, tenant-admin, hr-module,
    # sensor-module, hydroponics-module).
    location ~ ^/(?:mf|remotes)/([a-z0-9-]+)/(.*)$ {
        set $mf_upstream $1;
        proxy_pass http://$mf_upstream:80/$2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── Shell (host SPA) — catch-all. The shell container's own nginx handles
    # SPA fallback (try_files -> /index.html), so no error_page rewrite here.
    location / {
        set $shell_upstream shell;
        proxy_pass http://$shell_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
