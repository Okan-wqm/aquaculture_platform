# Design-system adoption ratchet for the web tree (FE-HIGH-065, FE-HIGH-066,
# FE-MEDIUM-067). Consumed by tests/invariants/web-design-system-ratchet.spec.ts.
#
# September 2026 survey: shared-ui is a real design system (61 colour tokens,
# Modal / ConfirmModal / Drawer with one shared dialog behaviour, Button, form
# fields) that the product mostly does not use. Three things were measured and
# are pinned here so they can only shrink:
#
#   overlays    — files outside shared-ui that carry their own `fixed inset-0`
#                 overlay. Keyed by FILE; every listed file must still contain
#                 one, so a migrated file cannot stay listed. Batches:
#                   dialog  → shared-ui Modal / ConfirmModal
#                   drawer  → shared-ui Drawer
#                   mobile  → bottom sheet (aquamobil)
#                   runtime → a genuine full-screen surface, not a dialog;
#                             re-evaluated at expiry, not migrated blindly
#   rawHex      — `#rrggbb` occurrences outside theme.css, per package. The
#                 tokens they should use live in web/shared-ui/src/styles/theme.css
#                 (primary/secondary/accent/success/warning/error/info/neutral/gray).
#   rawPalette  — colour utilities on Tailwind's raw hues (bg-blue-600,
#                 text-red-400, ring-indigo-500) instead of the theme scales,
#                 per package. shared-ui is never granted a ceiling: the
#                 primitives paint from primary / secondary / accent / success /
#                 warning / error / info / neutral.
#   rawMutation — direct TanStack useMutation( calls per package (web/apps and
#                 the admin panel's useAdminMutation wrapper excluded); a
#                 mutation declares its outcome through useFeedbackMutation.
#   rawButton   — raw <button> elements per package, primitives excluded.
#   rawField    — raw <input> / <select> / <textarea> per package, primitives excluded.
#   inlineStyle — `style={{` occurrences, per package.
#   rawSpinner  — hand-rolled loading spinners (a lucide loader icon or an
#                 inline <svg> spun by animate-spin, or a bordered ring spun
#                 the same way), per package. shared-ui Spinner (aquamobil:
#                 components/ui/Spinner) is the loading indicator.
#   rawPageTitle — hand-written page titles (an h1 in text-2xl/text-xl/text-lg
#                 bold or semibold), per package. shared-ui PageHeader is the
#                 title row; AquaMobil's components/ui/PageHeader is the band.
#   darkSurface — light-only surfaces (a class string painting bg-white,
#                 bg-gray-50 or bg-gray-100 with no `dark:` sibling), per
#                 package, shared-ui included. theme.css keys `dark:` on the
#                 shell's data-theme; a surface is dark-aware when every light
#                 class it paints has a dark counterpart.
#
# Per-package ceilings are EXACT live counts (the spec rejects slack), so the
# workflow is: remove occurrences, run the spec, lower the ceiling to the number
# it reports. Keyed by package/file, never by line number.
