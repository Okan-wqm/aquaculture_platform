# IP-1: TLS configuration — included from a separate file so it can be
# conditionally mounted (dev: no file, prod: nats-tls-enabled.conf mounted).
# WHY relative path: NATS resolves `include` paths relative to the config
# file's directory (/etc/nats/), so absolute paths get double-prefixed
# (e.g. /etc/nats/ + /etc/nats/nats-tls.conf → /etc/nats/etc/nats/...).
include nats-tls.conf
