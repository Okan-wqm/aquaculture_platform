      # SEC-015 (CRITICAL-002): Per-service NATS credentials
      <<: *nats-billing-env
      JWT_PUBLIC_KEY_PATH: /etc/ssl/jwt/public.pem
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET required}
      # Stripe credentials — OPTIONAL in compose, REQUIRED before billing goes live.
      #
      # Architectural decision (2026-04-14): the `:?` strict-requirement was
      # too tight for environments that haven't onboarded Stripe yet (dev,
      # staging, droplets running before payment integration is live). The
      # billing-service code already implements proper graceful degradation:
      #
      #   - stripe-webhook.controller.ts:74 reads the secret with default ''
      #   - line 77 logs a warning "Webhook signature verification will
      #     reject all requests" when missing
      #   - line 106 explicitly rejects every webhook with 400 when missing
      #
      # So an empty default does NOT silently accept unauthenticated webhooks
      # (the controller fails closed). It just lets the service BOOT without
      # forcing operators to populate Stripe keys before they're using
      # billing. Operators MUST set both vars before flipping billing on
      # in production — see docs/runbooks/secret-rotation.md (P5 plan).
      #
      # Empty-string defaults instead of unset because the controller's
      # configService.get() with a default ('' fallback) treats unset and
      # empty as the same case — both trigger the missing-secret warning
      # path. Either form would work; empty-string is more explicit about
      # the contract.
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
