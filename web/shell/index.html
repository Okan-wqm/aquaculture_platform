<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aquaculture Platform - Su Ürünleri Yetiştiriciliği Yönetim Sistemi" />
    <meta name="theme-color" content="#0073e6" />
    <!--
      SEC-M01: Application-level Content-Security-Policy (defense-in-depth).
      The primary CSP is enforced via NGINX HTTP headers (higher priority).
      This meta tag acts as a fallback for environments where NGINX headers
      are not yet configured (e.g., local dev, preview deployments).
      NOTE: meta-tag CSP cannot set frame-ancestors or report-uri directives;
      those MUST be configured in the NGINX HTTP header.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://cdn.jsdelivr.net;
      script-src-elem 'self' https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
      style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
      worker-src 'self' blob:;
      img-src 'self' data: blob: https://*.tile.openstreetmap.org https://server.arcgisonline.com https://*.basemaps.cartocdn.com;
      connect-src 'self' wss: https://cdn.jsdelivr.net https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org;
      font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net;
      frame-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />
    <title>Aquaculture Platform</title>
    <!-- The three families theme.css names (--font-sans, --font-mono, --font-display) and no others (FE-MEDIUM-090) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- First paint (FE-MEDIUM-083): the boot splash lives in #root until React replaces it,
         so the federation runtime and the fonts never leave a blank page behind. -->
    <style>
      .boot-splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #f9fafb; color: #4b5563; font: 500 14px/1.4 Inter, system-ui, -apple-system, sans-serif; }
      .boot-splash__mark { width: 40px; height: 40px; border-radius: 12px; background: #0ea5e9; box-shadow: 0 8px 24px rgb(14 165 233 / 0.35); }
      .boot-splash__spinner { width: 20px; height: 20px; border-radius: 999px; border: 2px solid rgb(107 114 128 / 0.3); border-top-color: #0ea5e9; animation: boot-splash-spin 0.8s linear infinite; }
      @keyframes boot-splash-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) { .boot-splash { background: #111827; color: #d1d5db; } }
      @media (prefers-reduced-motion: reduce) { .boot-splash__spinner { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-live="polite">
        <div class="boot-splash__mark" aria-hidden="true"></div>
        <div class="boot-splash__spinner" aria-hidden="true"></div>
        <span>Aquaculture Platform</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
