      - "request.billing.admin.cancelSubscription"
      - "request.billing.admin.reactivateSubscription"
      - "request.billing.admin.extendSubscriptionTrial"
      - "request.billing.tenant.provisionSubscription"
      - "request.auth.admin.createUser"
      - "request.auth.admin.resetUserPassword"
      - "request.auth.admin.updateUser"
      - "request.auth.admin.deactivateUser"
      - "request.auth.admin.forceLogoutUser"
      - "request.auth.admin.inviteUser"
      - "request.auth.admin.checkUserLimit"
      - "request.auth.tenant.ReserveTenant"
      - "request.auth.tenant.SetupRoles"
      - "request.auth.tenant.AssignModules"
      - "request.auth.tenant.CreateFirstAdminInvite"
      - "request.auth.tenant.ActivateTenant"
      - "request.auth.tenant.FailProvisioning"
      - "request.auth.tenant.DeprovisionTenant"
      - "request.auth.tenant.SuspendTenant"
      - "request.auth.tenant.ArchiveTenant"
      - "request.auth.tenant.RemoveModule"
      - "request.auth.tenant.RollbackProvisioning"
      - "policy.ingest_backend.>"
      - "events.platform.schema-migration.>"
      - "events.security.events.>"
      - "$JS.API.>"
      - "_INBOX.>"
    subscribe:
      - "events.>"
      - "policy.ingest_backend.snapshot"
      - "st.language.>"
      - "_INBOX.>"
      - "$JS.API.>"

  # ---------------------------------------------------------------------------
  # notification-service: outbound push/email command handling
  # ---------------------------------------------------------------------------
  - name: notification_service
    description: Outbound push / email notification commands, delivery tracking
    publish:
      - "events.*.AlertTriggered"
      - "events.*.NotificationDelivered"
      - "events.*.NotificationFailed"
      - "events.*.NotificationSent"
      - "events.platform.schema-migration.>"
      - "events.security.events.>"
      - "$JS.API.>"
      - "_INBOX.>"
    subscribe:
      - "commands.notification.sendEmail"
      - "commands.notification.sendPush"
      - "$JS.API.>"
      - "_INBOX.>"

  # ---------------------------------------------------------------------------
  # ai-service: AI chat, tool execution, conversations
  # ---------------------------------------------------------------------------
  - name: ai_service
    description: AI domain — model/tool execution and agent conversations
    publish:
