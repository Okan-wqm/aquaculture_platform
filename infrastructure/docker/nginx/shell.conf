# =============================================================================
# Aquaculture Platform - Shell Application Nginx Configuration
# SPA with Module Federation support
#
# ARCH-NM-003: Backend API proxies removed. All /api/ and /graphql traffic
# must be routed through the outer nginx reverse proxy. This container serves
# only static assets and the SPA index.html.
# ARCH-NM-004: MFE paths standardized to use short form (/mf/farm/ etc.)
#              to match the outer nginx routing convention.
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # SEC-NM-014: X-XSS-Protection removed (deprecated; CSP is sufficient)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss:;" always;

    # Gzip for performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/wasm;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"shell"}';
        add_header Content-Type application/json;
    }

    # Static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Module Federation remoteEntry files - no cache
    location ~* remoteEntry\.js$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Runtime config
    location /config.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback - all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;

        # No cache for index.html
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
