  # ===========================================================================

  gateway-api:
    image: ghcr.io/okan-wqm/aquaculture_platform/gateway-api:${TAG:-latest}
    container_name: aqua-gateway
    restart: unless-stopped
    environment:
      SERVICE_NAME: gateway-api
      NODE_ENV: production
      GATEWAY_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=384'
      # M-RL-01: Redis-backed rate limiting — prevents multi-replica bypass
      RATE_LIMIT_USE_REDIS: "true"
      DATABASE_HOST: postgres
      DATABASE_SSL: "true"
      DATABASE_SSL_REJECT_UNAUTHORIZED: "false"
      DATABASE_PORT: 5432
      # SEC-015 (CRITICAL-001): Per-service DB role — gateway_service can only access gateway schema
      DATABASE_USER: ${GATEWAY_SERVICE_DB_USER:-gateway_service}
      DATABASE_PASSWORD: ${GATEWAY_SERVICE_DB_PASS:-${POSTGRES_PASSWORD:-changeme}}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # SEC-015 (CRITICAL-002): Per-service NATS credentials
      <<: *nats-gateway-env
      JWT_PUBLIC_KEY_PATH: /etc/ssl/jwt/public.pem
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      AUTH_SERVICE_URL: http://auth-service:3000/graphql
      FARM_SERVICE_URL: http://farm-service:3000/graphql
      SENSOR_SERVICE_URL: http://sensor-service:3000/graphql
      ALERT_SERVICE_URL: http://alert-engine:3000/graphql
      HR_SERVICE_URL: http://hr-service:3000/graphql
      BILLING_SERVICE_URL: http://billing-service:3000/graphql
      NOTIFICATION_SERVICE_URL: http://notification-service:3000/graphql
      HYDROPONICS_SERVICE_URL: http://hydroponics-service:3000/graphql
      ADMIN_SERVICE_URL: http://admin-api-service:3000/graphql
      CONFIG_SERVICE_URL: http://config-service:3000/graphql
      MESSAGING_SERVICE_URL: http://messaging-service:3000/graphql
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_USER:?MINIO_USER is required}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-aquaculture}
      MINIO_REGION: us-east-1
      TRUST_PROXY: "1"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      WS_CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      THROTTLE_DEFAULT_LIMIT: 500
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET required}
      DATABASE_SYNC: "false" # ARCH-DB-001: Production'da synchronize kapalı, migration kullanılmalı
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      # WS10: schema state must be at the current version before gateway-api
      # starts. If the migration container fails, the deploy workflow
      # aborts BEFORE this service ever runs.
      db-migrate:
        condition: service_completed_successfully
      # ARCH-GW-002: All subgraph dependencies use service_started (not service_healthy).
      #
      # WHY: Gateway has RetryableIntrospectAndCompose with 12 attempts and ~36s budget.
      # It already handles subgraphs that aren't ready yet by retrying composition.
      # Using service_healthy here creates a fragile dependency chain:
      #   messaging unhealthy → gateway can't start → nginx can't start → entire platform down
      # With service_started, gateway starts immediately and retries composition until
      # all subgraphs are available. If a subgraph never comes up, gateway logs the error
      # and the health check reports degraded — but nginx and other services stay up.
      auth-service:
        condition: service_started
      farm-service:
        condition: service_started
      sensor-service:
        condition: service_started
      alert-engine:
        condition: service_started
      billing-service:
        condition: service_started
      hr-service:
        condition: service_started
      hydroponics-service:
        condition: service_started
      config-service:
        condition: service_started
      notification-service:
        condition: service_started
      messaging-service:
        condition: service_started
      admin-api-service:
        condition: service_started
      observability-service:
        condition: service_started
    volumes:
      - *nats-ca-mount
      - *nats-clients-mount
      - *nats-client-cert-mount
      - *nats-client-key-mount
      - *jwt-public-key-mount
    networks:
      - aqua-network
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health/live"]
      interval: 30s
