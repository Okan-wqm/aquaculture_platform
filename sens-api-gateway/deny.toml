# cargo-deny configuration for Suderra Edge Agent
# https://embarkstudios.github.io/cargo-deny/
#
# IEC 62443 SL2 Compliance: Dependency security and license management

[graph]
# Targets to check (edge devices are typically x86_64 or ARM Linux)
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "armv7-unknown-linux-gnueabihf",
]

[advisories]
# Vulnerability database check
# db-path removed: ~/.cargo resolves to user home which may not have a
# pre-populated advisory DB in CI. cargo-deny auto-fetches from db-urls
# when no local path is configured.
# db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# Deny known vulnerabilities
version = 2

# Ignore specific advisories — policy mirror of `.cargo/audit.toml`.
# cargo-deny reads THIS file; cargo-audit reads the other. Both tools
# run in CI so both allowlists MUST agree; otherwise CI fails on the
# same advisory through the other tool. When upstream fixes land,
# REMOVE entry from BOTH files in the same commit.
#
# Policy (plan discipline): delay with tracked-IDs permitted only with
# explicit owner + deadline + finding-ID + upstream blocker reference.
ignore = [
    # -----------------------------------------------------------------
    # EDGE-CI-001: rustls-webpki 0.102.8 × 3 advisories — rumqttc 0.25.1
    # transitive. Owner: platform-team. Deadline: 2026-07-01.
    # Upstream: rumqttc/bytebeamio main branch still on 0.102.8.
    # Our Batch 11 mTLS uses SHA-256 fingerprint pinning (not name-
    # constraint validation) so advisory code paths are not exercised.
    # If rumqttc 0.26 misses deadline: suderra fork OR paho-mqtt-rust.
    # -----------------------------------------------------------------
    "RUSTSEC-2026-0098", # Name constraints for URI names incorrectly accepted
    "RUSTSEC-2026-0099", # Name constraints accepted for wildcard cert asserts
    "RUSTSEC-2026-0049", # CRLs not considered authoritative by Distribution Point
    # -----------------------------------------------------------------
    # EDGE-CI-007: rustls-webpki 0.102.8 CRL parser panic.
    # Owner: platform-team. Deadline: 2026-07-01.
    # 2026-04-30: crates.io reports rumqttc 0.25.1 as the latest release, so
    # the upstream upgrade path is blocked. Same dependency root and mitigation
    # as EDGE-CI-001; if no upstream release lands by deadline, fork rumqttc or
    # replace the MQTT client.
    # -----------------------------------------------------------------
    "RUSTSEC-2026-0104",

    # -----------------------------------------------------------------
    # EDGE-CI-002: rsa 0.9.10 Marvin Attack — NO UPSTREAM FIX.
    # Owner: platform-team. Deadline: RE-EVAL QUARTERLY.
    # Marvin Attack requires timing-measurable decryption oracle;
    # async-opcua X.509 VERIFICATION path does NOT expose one. OPC UA
    # feature `opc-ua-server` off-by-default; opt-in only.
    # -----------------------------------------------------------------
    "RUSTSEC-2023-0071",

    # -----------------------------------------------------------------
    # EDGE-CI-003: bincode 1.3.3 unmaintained (RUSTSEC-2025-0141).
    # Owner: platform-team. Deadline: 2026-09-01 (bincode 2.x migration).
    # Plan Batch 1 PINS for wire-format stability of audit HMAC chain +
    # canonical bytes. Migration = breaking on-wire change; ADR-level
    # coordinated fleet event (re-sign every live audit record).
    # -----------------------------------------------------------------
    "RUSTSEC-2025-0141",

    # -----------------------------------------------------------------
    # EDGE-CI-004: derivative 2.2.0 unmaintained (RUSTSEC-2024-0388).
    # Owner: platform-team. Deadline: 2026-09-01 (async-opcua upstream).
    # Via async-opcua 0.18 OPC UA binary serialization layer. No active
    # advisory — unmaintained signal only.
    # -----------------------------------------------------------------
    "RUSTSEC-2024-0388",

    # -----------------------------------------------------------------
    # EDGE-CI-005: rustls-pemfile 2.2.0 unmaintained (RUSTSEC-2025-0134).
    # Owner: platform-team. Deadline: 2026-07-01 (with rumqttc 0.26).
    # Same rumqttc 0.25.1 transitive as EDGE-CI-001; tied to its
    # resolution.
    # -----------------------------------------------------------------
    "RUSTSEC-2025-0134",

    # -----------------------------------------------------------------
    # EDGE-CI-006: atomic-polyfill 1.0.3 unmaintained (RUSTSEC-2023-0089).
    # Owner: platform-team. Deadline: 2026-09-01.
    # New transitive via async-opcua 0.18. Upstream migrating to
    # std::sync::atomic. No active vulnerability.
    # -----------------------------------------------------------------
    "RUSTSEC-2023-0089",
]

[licenses]
# Confidence threshold for license detection
confidence-threshold = 0.93

# Allowed licenses (OSI-approved, permissive)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "OpenSSL",  # Used by aws-lc-sys cryptography (permissive)
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",      # ICU/Unicode crates (OSI-approved)
    "Unlicense",
    "MPL-2.0",  # Weak copyleft, file-level
    "CDLA-Permissive-2.0",  # Community Data License (webpki-roots)
    "LicenseRef-Proprietary",  # Our own proprietary code
]

# Exceptions for crates with complex license situations
exceptions = [
    # ring uses a custom license combining ISC, MIT, and OpenSSL
    { allow = ["ISC", "MIT", "OpenSSL"], crate = "ring" },
]

# Private crates that use non-SPDX licenses
private = { ignore = true }

# Skip checking our own crate's license (it's proprietary)
[[licenses.clarify]]
crate = "suderra-agent"
expression = "LicenseRef-Proprietary"
license-files = []

# rodbus is licensed under BSD-3-Clause but manifest doesn't specify
# See: https://github.com/stepfunc/rodbus/blob/main/LICENSE.txt
[[licenses.clarify]]
crate = "rodbus"
expression = "BSD-3-Clause"
license-files = [
    { path = "LICENSE.txt", hash = 0x3754c5f8 }
]

[bans]
# Warn about multiple versions of the same crate (bloat)
multiple-versions = "warn"

# Deny wildcard dependencies (reproducibility)
wildcards = "deny"

# Deny specific problematic crates
deny = [
    # 2026-04-30: OpenSSL's high-level TLS crate remains denied so network TLS
    # cannot regress from rustls. We do not ban `openssl-sys` globally because
    # SQLCipher at-rest encryption intentionally reaches it through
    # `rusqlite -> libsqlite3-sys` with the vendored SQLCipher/OpenSSL feature.
    # Cargo-deny's `skip` is for duplicate-version traversal, not for overriding
    # an explicit ban, so the architectural boundary must live at the crate ban.
    { name = "openssl", reason = "Use rustls for cross-platform TLS" },
]

# Skip checking tree for these crates
skip-tree = []

[sources]
# Deny crates from unknown registries
unknown-registry = "deny"

# Warn about crates from git (less reproducible)
unknown-git = "warn"

# Allow crates from crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# No allowed git sources by default
allow-git = []
