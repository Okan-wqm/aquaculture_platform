name: Restore ARIA state
description: >-
  Restore the persistent ARIA state tree from the `aria/state` branch, and
  report whether the tree descends from a published one or from an
  operator-acknowledged first bootstrap.

# PLAN Wave 1 PR 2.6b — THE LANE CUTOVER. This action used to download the
# newest `aria-tools-state` artifact. It now checks out the durable store.
#
# WHY THE TRANSPORT HAD TO CHANGE, not just be guarded better.
#
# ORPHAN-CRITICAL-484/488/513 are three guards around one structural fact: an
# artifact upload CANNOT enforce ancestry. `overwrite: true` will bury the
# accumulated state under a bootstrap-empty tree, and an empty tree passes
# `integrity verify` because it is trivially consistent. So the artifact era
# had to compensate procedurally — the `restored` / `bootstrap` outputs below
# ARE that compensation, and 513 is what it cost when only one of the two lanes
# carried it.
#
# `aria/state` moves the guarantee into the transport. `publish_state` pushes
# fast-forward-only, so a tree that does not descend from the tip is rejected
# by the SERVER. The compensation stays as defence in depth — it answers a
# different question ("did this job start from real state?") than the push does
# ("does this commit descend from the tip?") — but it is no longer the only
# thing standing between a failed restore and an erased history.
#
# THE OUTPUT CONTRACT IS UNCHANGED ON PURPOSE. Both lanes gate their publish on
# `restored || bootstrap`, and `tests/invariants/aria-single-restore-path.spec.ts`
# asserts the outputs exist and that no negative form (`restored=false`) is ever
# written. Absence is still the signal: a refusal, a transport failure, a
# skipped step and a crash all leave both unset, and all block the publish.
#
# The three states map onto exit codes the kernel already separates
# (`cli.py` state command): 0 with `bootstrapped=false` is a restore, 0 with
# `bootstrapped=true` is an acknowledged first bootstrap, 3 is a REFUSAL (an
# unacknowledged bootstrap, or an ancestry that cannot be proven) and 1 is a
# transport failure. The artifact implementation had to hand-code that split;
# here it is read off the command.
#
# ONE RESTORE PATH, STILL. RC-6 extracted this from two hand-copied heredocs
# that had already drifted. A second implementation around a hash-chained
# ledger is two transactions around one ledger, which is how a ledger diverges;
# the invariant spec above pins that there is exactly one, and its detector was
# re-aimed at this transport in the same commit so it cannot pass vacuously.

inputs:
  bootstrap-ack:
    description: >-
      Operator acknowledgement authorising creation of the `aria/state` branch
      on a genuine first run, as `owner/repo`. Empty on every normal run: the
      store REFUSES to create the branch without it, because a process that can
      create the branch when it cannot SEE it is a process that replaces
      history with emptiness on a network blip. See
      docs/runbooks/aria-state-branch-bootstrap.md.
    required: false
    default: ''
  token:
    description: >-
      Token used to READ the `aria/state` branch. Defaults to the job's
      `github.token`. The publish side has always been authenticated; the
      restore side fell back to anonymous git, which is what made both ARIA
      lanes intermittently fail with `could not read Username for
      'https://github.com'`. Read and write now travel the same credential
      path. It is set in the checkout step's environment only, never written
      to `.git/config`, so it cannot outlive the step or reach a later
      subprocess.
    required: false
    default: ''

  writer-lease-ttl-minutes:
    description: >-
      ARIA-HIGH-342 — set by every lane that PUBLISHES aria/state, to its own
      job `timeout-minutes` plus the leased-publish margin
      (`state_writer_lease.PUBLISH_MARGIN_MINUTES`, GSEC-MEDIUM-003; pinned
      by tests/test_state_single_writer.py). The action then takes the
      aria/state writer lease
      (branch `aria/state-lease`) BEFORE checking the store out, so no other
      writer can publish between this restore and this lane's publish; the
      lane releases it with ./.github/actions/release-aria-state-lease in an
      `always()` step. Empty on read-only lanes, which take no lease. The
      token must be able to push (contents:write), as the publish already
      requires.
    required: false
    default: ''
  writer-lease-wait-seconds:
    description: >-
      How long to wait for another writer's lease before YIELDING: no
      checkout, `writer-lease=yielded`, the holder named in a warning and the
      step summary, and every publish gate stays closed. Nothing has been
      restored, so a yield loses no work.
    required: false
    default: '0'

outputs:
  writer-lease-token:
    description: >-
      The writer lease's capability (GSEC-MEDIUM-001), masked. A lane passes
      it by `env:` / `with:` to its publish, merge and release steps ONLY
      (GSEC-LOW-002); it is never written to $GITHUB_ENV.
    value: ${{ steps.writer_lease.outputs.token }}
  writer-lease:
    description: >-
      'held' when this lane took the aria/state writer lease, 'yielded' when
      another writer kept it past the wait; empty on a read-only lane.
    value: ${{ steps.writer_lease.outputs.writer_lease }}
  restored:
    description: >-
      'true' only when the store was checked out at a published tip. Never
      'false' — absence is the signal, so a refusal, a transport failure, a
      skipped step and a crash all read the same as a failed restore.
    value: ${{ steps.restore.outputs.restored }}
  bootstrap:
    description: >-
      'true' only on an operator-acknowledged first bootstrap. Distinct from
      `restored` so a newborn ARIA can publish its first snapshot while a
      broken restore still cannot.
    value: ${{ steps.restore.outputs.bootstrap }}
  tools-root:
    description: >-
      The store-resident aria-tools root the lane must bind to. Emitted rather
      than restated by each caller: a second copy of the path convention is how
      two roots drift. Also EXPORTED as `ARIA_TOOLS_DIR` — see the binding step.
    value: ${{ steps.restore.outputs.tools-root }}
  workspace-root:
    description: The store-resident workspace root for this repository.
    value: ${{ steps.restore.outputs.workspace-root }}
  findings-root:
    description: The store-resident findings root.
    value: ${{ steps.restore.outputs.findings-root }}

runs:
  using: composite
  steps:
    # The credential lives in one step's environment, mirroring the publish
    # side exactly (see aria-agent-executor.yml "Mint the aria/state push
    # credential"). count=0 when no token is available, which makes git
    # ignore KEY_0/VALUE_0 entirely rather than send a malformed header —
    # an unauthenticated read of a public repo still works, it is just no
    # longer the only path.
    - name: Mint the aria/state read credential
      id: read_credential
      shell: bash
      env:
        RESTORE_TOKEN: ${{ inputs.token || github.token }}
      run: |
        set -euo pipefail
        if [ -z "${RESTORE_TOKEN:-}" ]; then
          echo "count=0" >> "$GITHUB_OUTPUT"
          echo "header=" >> "$GITHUB_OUTPUT"
          echo "no token available; aria/state will be read anonymously"
        else
          HEADER="$(printf 'x-access-token:%s' "$RESTORE_TOKEN" | base64 -w0)"
          echo "::add-mask::${HEADER}"
          echo "count=1" >> "$GITHUB_OUTPUT"
          echo "header=${HEADER}" >> "$GITHUB_OUTPUT"
        fi

    # ARIA-HIGH-342 — one writer at a time, and the turn is taken BEFORE the
    # checkout: a lease taken after it would leave the restored tip stale the
    # moment another writer published in between, which is the 2026-10-04
    # data loss exactly. Same credential, same step-scoped environment as the
    # checkout below; the lease branch is pushed fast-forward-only.
    - name: Acquire the aria/state writer lease
      id: writer_lease
      if: inputs.writer-lease-ttl-minutes != ''
      shell: bash
      env:
        GIT_CONFIG_COUNT: ${{ steps.read_credential.outputs.count }}
        GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
        GIT_CONFIG_VALUE_0: 'AUTHORIZATION: basic ${{ steps.read_credential.outputs.header }}'
        LEASE_TTL_MINUTES: ${{ inputs.writer-lease-ttl-minutes }}
        LEASE_WAIT_SECONDS: ${{ inputs.writer-lease-wait-seconds }}
        # ARIA-HIGH-350 — run-liveness reaping: a held gha: lease whose run
        # attempt has concluded (a cancelled job runs no always() release) is
        # taken over by CAS. The read uses the token this step already holds
        # (the job needs actions: read); no answer means no reap.
        GH_TOKEN: ${{ inputs.token || github.token }}
      run: |
        set -uo pipefail
        VERDICT="${RUNNER_TEMP}/aria-state-writer-lease.json"
        TOKEN_FILE="${RUNNER_TEMP}/aria-state-writer-lease.token"
        PYTHONPATH=aria-kernel python3 -m aria_kernel state lease acquire \
             --repo-root . \
             --ttl-minutes "$LEASE_TTL_MINUTES" \
             --wait-seconds "$LEASE_WAIT_SECONDS" \
             --token-file "$TOKEN_FILE" > "$VERDICT"
        LEASE_EXIT=$?
        # The capability is on disk BEFORE the push that makes it the lease's
        # (R-2), so it is handed on whatever the exit: an acquire that died
        # after its push still lets the always() release step free the lease
        # by token. Masked before it is ever an output, the file gone the
        # moment it is read, never exported to the job environment.
        if [ -s "$TOKEN_FILE" ]; then
          LEASE_TOKEN="$(cat "$TOKEN_FILE")"
          echo "::add-mask::${LEASE_TOKEN}"
          echo "token=${LEASE_TOKEN}" >> "$GITHUB_OUTPUT"
        fi
        rm -f "$TOKEN_FILE"
        if [ "$LEASE_EXIT" -eq 0 ]; then
          echo "writer_lease=held" >> "$GITHUB_OUTPUT"
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); print("aria/state writer lease held:", v["lease_id"], "epoch", v["epoch"], "until", v["expires_at"])' "$VERDICT"
        else
          # A YIELD is exit 3 AND a verdict naming the holder — another
          # writer's turn — and nothing else (PR #1779 re-review R-1). Exit 4
          # (an unreadable or missing record) and every other failure are
          # RED: one broken record must not make every writer yield green.
          if [ "$LEASE_EXIT" -ne 3 ] || ! python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("holder") else 1)' "$VERDICT" 2>/dev/null; then
            echo "::error::the aria/state writer lease is not usable (exit ${LEASE_EXIT}); see \`state lease status\` and \`state lease repair --reason\` (docs/runbooks/aria-state-branch-bootstrap.md)." >&2
            head -c 4000 "$VERDICT" >&2 || true
            exit 1
          fi
          # A YIELD, recorded where the operator looks: nothing was
          # restored, so nothing this run did is lost.
          echo "writer_lease=yielded" >> "$GITHUB_OUTPUT"
          REASON="$(python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); print(v["refusal"], "| holder:", v["holder"]["owner"])' "$VERDICT")"
          echo "::warning::aria/state writer lease yielded: ${REASON}"
          {
            echo '### aria/state writer lease: yielded'
            echo '```json'
            head -c 4000 "$VERDICT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Check out the aria/state store
      id: restore
      if: inputs.writer-lease-ttl-minutes == '' || steps.writer_lease.outputs.writer_lease == 'held'
      shell: bash
      env:
        ARIA_STATE_BOOTSTRAP_ACK: ${{ inputs.bootstrap-ack }}
        GIT_CONFIG_COUNT: ${{ steps.read_credential.outputs.count }}
        GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
        GIT_CONFIG_VALUE_0: 'AUTHORIZATION: basic ${{ steps.read_credential.outputs.header }}'
      run: |
        set -uo pipefail
        # NOT `set -e`. A refusal (exit 3) and a transport failure (exit 1) are
        # different verdicts and both must be REPORTED before the step ends;
        # aborting on the command would lose the kernel's structured reason.
        # The step still fails at the end for both — what changes is that the
        # operator sees which one it was.
        VERDICT="${RUNNER_TEMP}/aria-state-checkout.json"
        if PYTHONPATH=aria-kernel python3 -m aria_kernel state checkout \
             --repo-root . > "$VERDICT" 2>"${VERDICT}.err"; then
          python3 - <<'PY'
        import json
        import os

        with open(os.environ["RUNNER_TEMP"] + "/aria-state-checkout.json", encoding="utf-8") as fh:
            verdict = json.load(fh)

        # ORPHAN-CRITICAL-484 — positive proof, written on the success path
        # only. There is no negative form to get wrong.
        signal = "bootstrap" if verdict["bootstrapped"] else "restored"
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"{signal}=true\n")
            fh.write(f"tools-root={verdict['tools_root']}\n")
            fh.write(f"workspace-root={verdict['workspace_root']}\n")
            fh.write(f"findings-root={verdict['findings_root']}\n")

        # THE BINDING, exported rather than described. Three roots have to
        # agree; a lane that got two right would look like it was working
        # while a third of ARIA's memory kept dying with the runner. The
        # kernel emits the whole mapping from `store_environment`, so the
        # workflow never restates the path convention — and cannot restate
        # two thirds of it.
        #
        # Exporting is load-bearing, not convenience. `aria-tools/` in the
        # CHECKOUT carries a tracked `repo_identity.json`, so `tools_dir()`'s
        # walk-up would find it and every ledger would be written to the tree
        # that dies with the runner — a silent success, which is the failure
        # mode this whole PR exists to end. With the binding in the job
        # environment and `set -u` at every callsite, an absent binding is a
        # failed step instead.
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
            for key, value in sorted(verdict["environment"].items()):
                fh.write(f"{key}={value}\n")

        # The operator ACK rides the same export path as the binding. Every
        # later gate in the job — publish's continuity check in state_store
        # and the cycle's memory-gap check — reads ARIA_STATE_BOOTSTRAP_ACK
        # from the process environment. Delivering it only to `state
        # checkout` leaves those gates blind to an operator-acknowledged
        # state reduction (compaction, fresh start), so every publish after
        # the 2026-08-31 compaction refused with
        # state_publish_continuity_surfaces_lost despite the acknowledgment.
        # Absent ACK (variable unset) exports nothing and the gates stay
        # fail-closed.
        _ack = os.environ.get("ARIA_STATE_BOOTSTRAP_ACK", "").strip()
        if _ack:
            with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
                fh.write(f"ARIA_STATE_BOOTSTRAP_ACK={_ack}\n")
        print(f"aria/state checked out ({signal}); tools root {verdict['tools_root']}")
        PY
          # A CHECKED-OUT STORE IS NOT YET A USABLE TOOLS ROOT, and this is the
          # one definition of making it one.
          #
          # `repo_identity.json` records an absolute `bound_repo_root`, so it is
          # machine-local binding state and the shared branch deliberately does
          # not carry it (see state_manifest.py, where declaring it would have
          # been the tempting wrong fix). What arrives from the branch is
          # therefore a tools root full of covered state with NO identity —
          # exactly the shape `ensure_tools_dir` rejects as
          # `ambiguous_tools_root`.
          #
          # ORPHAN-HIGH-556 — this step used to run `migrate-tools-bootstrap`,
          # and it is a BIND, not a migration. The two shared one code path
          # because the tree could not state its own contract version: that
          # version lived only in the host-local identity file, so a restored
          # tree reported 0 and a healthy v3 tree was migrated from nothing
          # EVERY NIGHT — a whole-tree backup, a rewrite of every covered
          # ledger, and nine ceremony rows, measured. `tools_contract.json` now
          # travels with the tree, so `bind-tools-root` mints this host's
          # identity and stops. It still delegates to the migration when one is
          # genuinely required, and records that it did.
          #
          # No `--acknowledge`: nobody is present at 01:00, and a flag the
          # automation always sets acknowledges nothing. The delegated
          # migration still requires one, where a tree is actually rewritten.
          #
          # HERE rather than in each lane, because only one lane had it. The
          # producer ran the bootstrap; the executor never did, so the first
          # executor run against a restored store would have died on
          # `ambiguous_tools_root` at the lease check — the RC-6 drift shape
          # exactly, one lane carrying a step the other needed just as much.
          PYTHONPATH=aria-kernel python3 -m aria_kernel \
            integrity bind-tools-root \
            --tools-dir "$(python3 -c 'import json,os,sys; print(json.load(open(sys.argv[1]))["tools_root"])' "$VERDICT")" \
            --workspace-root "$PWD" \
            --reason "bind the restored aria/state store to this checkout"
        else
          STATUS=$?
          # 3 is the kernel's REFUSAL code — an unacknowledged bootstrap or an
          # ancestry it could not prove. Distinguished from a transport failure
          # so an operator does not retry a refusal into a success.
          if [ "$STATUS" -eq 3 ]; then
            echo "::error::aria/state refused the checkout (verdict, not a transport failure). See docs/runbooks/aria-state-branch-bootstrap.md." >&2
          else
            echo "::error::aria/state checkout failed to reach the remote (exit ${STATUS})." >&2
          fi
          # THE REASON THE KERNEL GAVE, read from the stream it actually uses.
          #
          # `cli.py` prints a refusal as JSON on STDOUT and returns 3, and this
          # step redirects stdout into $VERDICT. So the line below used to print
          # `${VERDICT}.err` — stderr — and on every refusal that file is EMPTY.
          # The structured reason this step exists to preserve was captured and
          # then discarded: the comment above promises not to lose it, and the
          # code lost it by naming the wrong stream. Measured on run
          # 30977606839, where the operator was told the checkout was refused,
          # was pointed at a runbook, and was never told which refusal it was.
          python3 - "$VERDICT" >&2 <<'PY' || true
        import json
        import sys

        try:
            with open(sys.argv[1], encoding="utf-8") as fh:
                verdict = json.load(fh)
        except (OSError, ValueError):
            verdict = {}
        reason = verdict.get("refusal") if isinstance(verdict, dict) else None
        if reason:
            print(f"aria/state refusal: {reason}")
        elif verdict:
            print(f"aria/state verdict: {json.dumps(verdict, sort_keys=True)[:2000]}")
        else:
            print("aria/state wrote no verdict — the command failed before judging.")
        PY
          head -c 4000 "${VERDICT}.err" >&2 || true
          exit "$STATUS"
        fi
