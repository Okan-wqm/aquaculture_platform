name: aria-agent-executor

# Plan ARIA-V3 §B1 — scheduled CI executor for ARIA's bound-agent
# pipeline. Runs once per off-hours window OR on manual dispatch; pulls
# the next pending agent request from the kernel's queue, invokes the
# Claude Code CLI via a managed login session, submits the result.
#
# Argv contract status (DEBT-2026-05-08-001 retired by V3 §B1): the
# kernel-side argv shape is now PROVEN — see
# tools/aria-poc/ci_executor_contract_proven.md (locked by invariant
# I-V3-21). The workflow ships with CLAUDE_CLI_MOCK default flipped
# to 'false' (production); `vars.ARIA_MOCK_KILL_SWITCH` is read
# AHEAD of the default so operators can keep mock active without
# editing this file (INFRA-MEDIUM-011). The operator's single
# supervised live invocation populates the verified_at_commit /
# claude_cli_version_minimum fields in the proven-contract doc.
#
# Lease-token redaction:
#   - LEASE token flows ONLY through ARIA_LEASE_TOKEN env var.
#   - artifact upload limited to expected_output_path only.
#   - the GHA log ::add-mask:: directive masks any accidental leak.

on:
  schedule:
    # 02:00 UTC daily (off-hours for most ARIA contributors)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Specific request ID to process (overrides next-pending lookup)'
        required: false
        type: string
      mock:
        description: 'Run in mock mode (no real Claude Code CLI invocation)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      breaker_quarantine_reason:
        description: >-
          RC-6 RECOVERY MODE. Non-empty turns this run into a breaker-evidence
          repair instead of an agent run: restore, quarantine the undecodable
          rows of the failure ledger, republish. No request is claimed and no
          agent is invoked -- a repair must be one auditable transaction, not a
          repair mixed with a night's work. Requires operator_approval_ref.
        required: false
        type: string
      operator_approval_ref:
        description: >-
          Audit reference recorded against the quarantine (issue, incident or
          approval ID). Required whenever breaker_quarantine_reason is set; the
          kernel refuses the operation without one.
        required: false
        type: string

concurrency:
  group: aria-agent-executor-main
  cancel-in-progress: false

permissions:
  contents: read
  # ORPHAN-CRITICAL-420 S1 — actions:read is required to locate and
  # download the previous run's aria-tools-state artifact (the queue
  # bridge between the 01:00 producer and this 02:00 consumer).
  actions: read

jobs:
  executor:
    runs-on: [self-hosted, linux, claude]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - uses: ./.github/actions/setup-aria-kernel

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      # Plan ARIA-V3 §B1 INFRA-CRITICAL-003 — verify the pinned Claude
      # Code CLI floor BEFORE the executor step. The proven-contract doc
      # (tools/aria-poc/ci_executor_contract_proven.md) is the SSoT
      # for the argv shape; this step ensures the binary that
      # interprets that argv is present and version-pinned. The
      # --ignore-scripts flag satisfies V2 I-25 clause 4
      # (INFRA-CRITICAL-001 supply chain).
      - name: Pre-flight - Claude Code CLI present
        # RC-6 — skipped in recovery mode. A breaker repair invokes no agent, and
        # refusing the run because the Claude CLI is absent would make the
        # recovery lever depend on the very lane that may be broken.
        if: inputs.breaker_quarantine_reason == ''
        run: |
          set -euo pipefail
          REQUIRED_CLAUDE_VERSION="2.1.197"
          CLAUDE_VERSION="$(claude --version | awk '{print $1}')"
          python3 - "$REQUIRED_CLAUDE_VERSION" "$CLAUDE_VERSION" <<'PY'
          import sys
          def parse(value):
              return tuple(int(part) for part in value.split('.'))
          required = parse(sys.argv[1])
          current = parse(sys.argv[2])
          if current < required:
              raise SystemExit(f"claude-code {sys.argv[2]} is below required {sys.argv[1]}")
          print(f"claude-code {sys.argv[2]} satisfies required {sys.argv[1]}")
          PY
      # ORPHAN-CRITICAL-420 S1 — moved AHEAD of the state restore.
      # workflow_contracts rejects a preflight that runs after the job's
      # first governed mutation, and the restore writes the whole state
      # tree, so the restore cannot precede this step. Moving it here also
      # means it can no longer name request-scoped paths: the request_id
      # does not exist until the queue has been restored and read.
      - name: Persist enterprise workflow preflight
        env:
          PYTHONPATH: aria-kernel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          from aria_kernel.preflight import verify_workflow_preflight

          # The executor now restores and republishes the persistent
          # aria-tools tree, so the declared write root is the tree itself
          # rather than the four ledger files the pre-S1 executor touched.
          allowed = ["aria-tools"]
          verdict = verify_workflow_preflight(
              workflow_id="aria-agent-executor",
              job_id="executor",
              profile="autonomous",
              workspace_root=os.environ["GITHUB_WORKSPACE"],
              allowed_write_roots=allowed,
              path_allowlist=allowed,
              network_policy=["github_artifact"],
              network_enforcement_evidence=(
                  "artifact restore/upload limited to the aria-tools-state artifact, "
                  "the run-scoped quarantine-evidence-<run_id> artifact and the exact "
                  "response envelope path, all via the Actions artifact API"
              ),
              token_provenance="github_actions_artifact_token",
              require_github_app=False,
              dlp_mode="fail_closed",
              dlp_scan_clean=True,
              audit_reason="restore, extend and republish the persistent aria-tools state tree around one bound-agent invocation",
              audit_artifact_path=Path(os.environ["RUNNER_TEMP"]) / "aria-agent-executor-preflight.json",
              external_root_allowlist=[str(Path(os.environ["RUNNER_TEMP"]).resolve())],
          )
          if not verdict.valid:
              raise SystemExit(";".join(verdict.reasons))
          PY

      # ORPHAN-CRITICAL-420 S1 — bridge the agent-invocation queue.
      # The 01:00 aria-auto-cycle mints requests into aria-tools/, which
      # .gitignore excludes; this 02:00 executor is the only consumer that
      # claims them (agent next-pending filters on no role). Without this
      # step the two lanes sat either side of an unbridged artifact
      # boundary and next_pending_request always returned None.
      # It runs BEFORE the lease check on purpose: lease_state('aria-tools')
      # reads this same tree, so a bootstrap-empty tree made the cross-host
      # lease unable to observe a held lease at all.
      - name: Restore aria-tools state from previous run
        id: restore_state
        # RC-6 — one definition, both lanes. The two hand-copied heredocs that
        # used to sit here had already drifted: only the executor's carried the
        # ORPHAN-CRITICAL-484/488 restore-proof outputs, so the producer lane
        # could publish a bootstrap-empty tree over the accumulated state. The
        # action's header records what that cost.
        uses: ./.github/actions/restore-aria-tools-state
        with:
          github-token: ${{ github.token }}
      - name: Pre-flight — cross-host autonomous-loop lease check
        id: lease_check
        run: |
          set -euo pipefail
          PYTHONPATH=aria-kernel python3 - <<'PY' 2>&1 | head -20
          import json
          import os
          import sys

          from aria_kernel.autonomous_host_lease import lease_state

          state = lease_state('aria-tools')
          print(json.dumps(state))
          if state['state'] == 'fresh':
              host = state.get('host_id', '')
              # If the fresh lease is held by a local (non-GHA) host
              # we refuse. GHA-runner-held leases come from prior
              # cron runs and should be allowed to renew through the
              # acquire_lease path below.
              if not host.startswith('gha-runner:'):
                  print(f'::warning::autonomous_host_lease_blocked: held by {host}', file=sys.stderr)
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
                      f.write('blocked=true\n')
                      f.write(f'blocked_host={host}\n')
                  sys.exit(0)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('blocked=false\n')
          PY

      # This step ANNOUNCES the skip; it does not perform it. `exit 0` ends a
      # STEP, never the JOB, so before the per-step guards below existed a
      # lease-blocked run walked straight on: it claimed a request, invoked an
      # agent against a tree another host was actively mutating, and then
      # discarded the result at the publish gate (which does carry the guard).
      # The abort is the `blocked != 'true'` condition on EVERY step from here
      # down, mirroring the sibling producer aria-auto-cycle.yml.
      - name: Skip autonomous loop when local lease is fresh
        if: steps.lease_check.outputs.blocked == 'true'
        run: |
          echo "Local host holds autonomous-loop lease; exiting cleanly per Plan ARIA-V3 §2n."
          exit 0

      # RC-6 second half — recovery runs WHERE THE STATE LIVES.
      #
      # `quarantine_breaker_evidence` moves the undecodable rows of
      # autonomous-failures.jsonl to a sidecar so the breaker can be judged on
      # the surviving evidence. It shipped with a CLI, and that CLI operates on
      # a local `--tools-dir` — while the ledger travels between runs inside the
      # aria-tools-state artifact. An operator running it on their laptop
      # repairs a copy nothing reads. The only lever that reached the real
      # ledger was deleting the artifact, which also destroys the agent queue
      # ORPHAN-CRITICAL-469 exists to carry: the recovery path for one breaker
      # was the destruction of an unrelated subsystem.
      #
      # WHY HERE AND NOT IN A NEW WORKFLOW. A recovery workflow would need its
      # own restore and its own publish -- a second transaction around a
      # hash-chained ledger, which is how a ledger diverges. This job already
      # restores, verifies and republishes; the repair is one step inside that
      # existing transaction.
      #
      # WHY BEFORE THE CLAUDE PREFLIGHT. A recovery must not depend on the agent
      # path being healthy. The steps below refuse the job when the Claude CLI
      # or its managed session is absent, and a runner in that state is exactly
      # where an operator still needs to repair a breaker.
      #
      # WHY IT STILL CARRIES THE LEASE GUARD. The repair mutates the same tree a
      # local daemon may be holding; publishing over it would race.
      - name: Quarantine damaged breaker evidence (recovery dispatch)
        id: breaker_quarantine
        if: steps.lease_check.outputs.blocked != 'true' && inputs.breaker_quarantine_reason != ''
        env:
          # Plan 024 v3 §B-3 — operator text reaches the shell through the
          # environment, never through `${{ }}` splicing into the script source.
          QUARANTINE_REASON: ${{ inputs.breaker_quarantine_reason }}
          QUARANTINE_APPROVAL_REF: ${{ inputs.operator_approval_ref }}
        run: |
          set -euo pipefail
          if [ -z "${QUARANTINE_APPROVAL_REF:-}" ]; then
            echo "::error::operator_approval_ref is required with breaker_quarantine_reason" >&2
            exit 1
          fi
          # Validate BEFORE any use, per the §B-3 pattern. The kernel validates
          # again; this refuses early with a message naming the input rather
          # than surfacing an argparse error from three layers down.
          if ! [[ "$QUARANTINE_APPROVAL_REF" =~ ^[A-Za-z0-9/_.:#-]{1,128}$ ]]; then
            echo "::error::operator_approval_ref has an unexpected format" >&2
            exit 1
          fi
          if ! [[ "$QUARANTINE_REASON" =~ ^[A-Za-z0-9\ _.,:;()/#-]{8,256}$ ]]; then
            echo "::error::breaker_quarantine_reason must be 8-256 plain characters" >&2
            exit 1
          fi
          # `--acknowledge` is the kernel's own refusal-to-guess gate; dispatching
          # this workflow with a reason and an approval ref IS the acknowledgement.
          # Exits non-zero when the breaker is still tripped after the repair,
          # which is the CORRECT outcome for real in-window failures: quarantine
          # makes the state evaluable, it does not clear it. The publish below
          # runs under `always()`, so the repaired tree is still republished.
          PYTHONPATH=aria-kernel python3 -m aria_kernel breaker quarantine \
            --tools-dir aria-tools \
            --acknowledge \
            --reason "$QUARANTINE_REASON" \
            --operator-approval-ref "$QUARANTINE_APPROVAL_REF"

      # Plan ARIA-V3 §B1 INFRA-CRITICAL-002 — refuse to start when
      # the workflow is in live mode but managed Claude Code auth is
      # absent. The kill switch (vars.ARIA_MOCK_KILL_SWITCH) is read
      # AHEAD of the workflow default — operator opt-out path (Plan
      # ARIA-V3 §B1 INFRA-MEDIUM-011). The mock_source value flows
      # into the ci_executor via CLAUDE_CLI_MOCK_SOURCE so the
      # claude_mock_mode_resolved audit event (AUDITTRAIL-HIGH-009)
      # records exactly which layer decided the mock state.
      - name: Pre-flight - Claude Code auth + mock-mode kill-switch resolution
        id: preflight
        # RC-6 — see the CLI floor above: a recovery run needs no managed
        # Claude session, and this step hard-fails the job without one.
        if: steps.lease_check.outputs.blocked != 'true' && inputs.breaker_quarantine_reason == ''
        env:
          KILL_SWITCH: ${{ vars.ARIA_MOCK_KILL_SWITCH }}
          INPUT_MOCK: ${{ github.event.inputs.mock }}
        run: |
          set -euo pipefail
          if [ -n "${KILL_SWITCH:-}" ]; then
            EFFECTIVE_MOCK="${KILL_SWITCH}"
            MOCK_SOURCE="kill_switch"
          elif [ -n "${INPUT_MOCK:-}" ]; then
            EFFECTIVE_MOCK="${INPUT_MOCK}"
            MOCK_SOURCE="workflow_dispatch_input"
          else
            EFFECTIVE_MOCK="false"
            MOCK_SOURCE="workflow_default_claude"
          fi
          echo "effective_mock=${EFFECTIVE_MOCK}" >> "$GITHUB_OUTPUT"
          echo "mock_source=${MOCK_SOURCE}" >> "$GITHUB_OUTPUT"
          if [ "${EFFECTIVE_MOCK}" = "false" ]; then
            if env | grep -E '^(ANTHROPIC_API_KEY|CLAUDE_API_KEY|ANTHROPIC_AUTH_TOKEN)=' >/dev/null; then
              echo "::error::API-key Claude mode is disallowed for ARIA; use a managed Claude Code login on the trusted runner." >&2
              exit 1
            fi
            claude --version >/tmp/aria-claude-auth.txt 2>/tmp/aria-claude-auth.err \
              || { echo "::error::Claude Code CLI preflight failed" >&2; cat /tmp/aria-claude-auth.err >&2; exit 1; }
            CLAUDE_AUTH_DIR="${CLAUDE_CONFIG_DIR:-$HOME/.claude}"
            if [ ! -f "${CLAUDE_AUTH_DIR}/.credentials.json" ] && [ ! -f "${CLAUDE_AUTH_DIR}/config.json" ]; then
              echo "::error::Claude Code managed-auth session not found on the trusted runner" >&2
              exit 1
            fi
          fi

      - name: Find next pending request
        id: pending
        # RC-6 — a recovery run claims nothing. Leaving request_id empty is what
        # skips the executor, the envelope upload and the sandbox provisioning:
        # they are already guarded on it, so recovery mode needs no second
        # condition threaded through each of them.
        if: steps.lease_check.outputs.blocked != 'true' && inputs.breaker_quarantine_reason == ''
        env:
          # Plan 024 v3 §B-3 — env-only interpolation; raw shell access
          # to ${{ github.event.inputs.request_id }} is closed because
          # GHA expands the substitution into the script source where
          # an attacker-controlled value can escape quoting.
          REQUEST_ID_INPUT: ${{ github.event.inputs.request_id }}
        run: |
          set -euo pipefail
          if [ -n "${REQUEST_ID_INPUT:-}" ]; then
            # Plan 024 v3 §B-3 — request_id regex matches the kernel's
            # AIR-* request_id schema (alphanumeric + - + _, ≤ 64 chars).
            if ! [[ "$REQUEST_ID_INPUT" =~ ^[A-Za-z0-9_-]{1,64}$ ]]; then
              echo "::error::invalid request_id format: $REQUEST_ID_INPUT" >&2
              exit 1
            fi
            echo "request_id=${REQUEST_ID_INPUT}" >> "$GITHUB_OUTPUT"
          else
            REQ_ID=$(PYTHONPATH=aria-kernel python3 -m aria_kernel agent next-pending \
              --tools-dir aria-tools | jq -r '.request_id // empty')
            echo "request_id=${REQ_ID}" >> "$GITHUB_OUTPUT"
          fi


      # Plan 020 Phase 3.C — session_start handoff snapshot.
      # WHY here: every CI executor run is a discrete session boundary.
      # Snapshotting at start captures "what was open before we touched
      # anything" — the operator-readable diff against session_stop is
      # how an audit reviewer reconstructs what the run actually changed
      # without having to grep governance.jsonl by timestamp.
      - name: Handoff snapshot — session_start
        id: handoff_start
        if: steps.lease_check.outputs.blocked != 'true'
        run: |
          set -euo pipefail
          SESSION_ID="gha-aria-agent-executor-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "session_id=${SESSION_ID}" >> "$GITHUB_OUTPUT"
          PYTHONPATH=aria-kernel python3 -m aria_kernel handoff snapshot \
            --session-id "${SESSION_ID}" \
            --trigger session_start \
            --tools-dir aria-tools \
            --repo-root .

      - name: Skip if no pending request
        # RC-6 — excluded in recovery mode, where request_id is empty BY DESIGN.
        # Announcing "no pending requests" for a deliberate repair would be a
        # message that misdescribes the run, which is the class of defect this
        # branch keeps closing.
        if: steps.lease_check.outputs.blocked != 'true' && steps.pending.outputs.request_id == '' && inputs.breaker_quarantine_reason == ''
        run: echo "no pending requests; exiting cleanly"

      # ORPHAN-CRITICAL-439 — the containment layer needs a backend to exist.
      # claude_runtime._apply_write_containment refuses every write-capable
      # spawn when sandbox_backend() is None, so without this the executor
      # does not run unconfined, it does not run at all — and the failure
      # looks like an agent problem rather than a missing package.
      # RC-9 — one definition, called by both lanes. The pair of steps that
      # used to sit here was duplicated between aria-agent-executor and
      # aria-auto-cycle, with a comment saying they were copied so the lanes
      # could not drift; copying is how they drift. The action also probes
      # BEFORE installing, so an already-provisioned runner needs no apt call.
      - name: Ensure a verified sandbox backend
        if: steps.lease_check.outputs.blocked != 'true' && steps.pending.outputs.request_id != ''
        uses: ./.github/actions/ensure-sandbox-backend

      - name: Run CI executor
        if: steps.lease_check.outputs.blocked != 'true' && steps.pending.outputs.request_id != ''
        env:
          CLAUDE_CLI_MOCK: ${{ steps.preflight.outputs.effective_mock }}
          CLAUDE_CLI_MOCK_SOURCE: ${{ steps.preflight.outputs.mock_source }}
          ARIA_CLAUDE_REQUIRE_USAGE: '1'
          # Wave 0 §0.7 — executor-lane PRs open through the kernel CLI
          # (pr_manager gate + breaker producer) only; the raw
          # `gh pr create` allowlist row is refused under this flag. The
          # flag and the legacy row are deleted together after one green
          # scheduled run (docs/plans/2026-08-02-aria-full-autonomy-program).
          ARIA_EXECUTOR_PR_VIA_KERNEL: '1'
          MAX_TURNS_PER_RUN: '12'
          MAX_REQUESTS_PER_RUN: '30'
          MAX_TIMEOUT_SECONDS: '1800'
        run: |
          PYTHONPATH=aria-kernel python3 tools/aria-poc/ci_executor.py \
            "${{ steps.pending.outputs.request_id }}"

      - name: Upload response envelope (artefact)
        if: steps.lease_check.outputs.blocked != 'true' && steps.pending.outputs.request_id != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Limited scope — response envelope plus its transcript anchor. claims.jsonl +
          # runs.jsonl deliberately excluded (lease token / over-disclosure
          # protection per spike doc artefact policy).
          name: aria-response-${{ steps.pending.outputs.request_id }}
          path: |
            aria-tools/agent-invocations/outputs/${{ steps.pending.outputs.request_id }}.json
            aria-tools/agent-invocations/outputs/${{ steps.pending.outputs.request_id }}.transcript.jsonl
          if-no-files-found: error
          retention-days: 7

      # Plan 020 Phase 3.C — session_stop handoff snapshot.
      # WHY here (post-upload, always): runs even when the executor
      # short-circuits the request lookup ("no pending requests; exiting
      # cleanly") so the audit trail still captures session boundary
      # state. The if: always() pairs with handoff_start so an audit
      # reviewer can diff session_start vs session_stop snapshots and
      # see exactly what the run touched (or did not touch).
      - name: Handoff snapshot — session_stop
        if: always() && steps.lease_check.outputs.blocked != 'true' && steps.handoff_start.outputs.session_id != ''
        run: |
          set -euo pipefail
          PYTHONPATH=aria-kernel python3 -m aria_kernel handoff snapshot \
            --session-id "${{ steps.handoff_start.outputs.session_id }}" \
            --trigger session_stop \
            --tools-dir aria-tools \
            --repo-root .

      # ORPHAN-CRITICAL-420 S1 — the return half of the queue bridge.
      # Without a publish the executor's own writes (claims, results,
      # governance, handoffs) die with the runner, so the next auto-cycle
      # would re-mint work this run already claimed. Verified BEFORE
      # publishing, mirroring aria-auto-cycle: only an integrity-clean tree
      # is allowed to become the next run's starting state.
      - name: Verify aria-tools state integrity
        id: integrity
        if: always() && steps.lease_check.outputs.blocked != 'true'
        run: |
          set -uo pipefail
          # RUNNER_TEMP, not /tmp — the only external write root this job's
          # contract allows (external_root_allowlist).
          VERDICT="${RUNNER_TEMP}/aria-integrity-verdict.json"
          VERDICT_ERR="${RUNNER_TEMP}/aria-integrity-verdict.err"
          if PYTHONPATH=aria-kernel python3 -m aria_kernel integrity verify \
               --tools-dir aria-tools \
               --workspace-root "$GITHUB_WORKSPACE" > "$VERDICT" 2>"$VERDICT_ERR"; then
            echo "state_valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "state_valid=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo '### aria-tools state integrity'
            echo '```json'
            head -c 4000 "$VERDICT" 2>/dev/null || echo '{}'
            echo '```'
            if [ -s "$VERDICT_ERR" ]; then
              echo '```'
              tail -20 "$VERDICT_ERR"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist aria-tools state (verified)
        if: always() && steps.lease_check.outputs.blocked != 'true' && steps.integrity.outputs.state_valid == 'true' && (steps.restore_state.outputs.restored == 'true' || steps.restore_state.outputs.bootstrap == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-tools-state
          path: aria-tools/
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      # Unverified state is preserved for forensics under a run-scoped name
      # the restore step never selects — restore queries
      # `name=aria-tools-state`, so a quarantined tree cannot be picked up
      # as the next run's starting state.
      - name: Quarantine unverified aria-tools state
        # The blocked guard matches the sibling producer and the publish/fail
        # steps either side of it: when the lease check refused the run the
        # integrity step above is skipped, so state_valid is the empty string
        # and an unguarded `!= 'true'` would quarantine a tree this run never
        # touched — turning every blocked night into a forensics artifact.
        if: always() && steps.lease_check.outputs.blocked != 'true' && (steps.integrity.outputs.state_valid != 'true' || (steps.restore_state.outputs.restored != 'true' && steps.restore_state.outputs.bootstrap != 'true'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quarantine-evidence-${{ github.run_id }}
          path: |
            aria-tools/
            ${{ runner.temp }}/aria-integrity-verdict.json
            ${{ runner.temp }}/aria-integrity-verdict.err
          retention-days: 30
          if-no-files-found: warn
          overwrite: true

      - name: Fail when aria-tools state was not published
        # ORPHAN-CRITICAL-484 — mirrors the sibling producer
        # (aria-auto-cycle.yml). Without this the executor can do real work,
        # publish NOTHING under the canonical name, and still report green —
        # and the failure is absorbing: each such night buries the good
        # artifact one run deeper until the 30-day retention window closes.
        if: always() && steps.lease_check.outputs.blocked != 'true' && (steps.integrity.outputs.state_valid != 'true' || (steps.restore_state.outputs.restored != 'true' && steps.restore_state.outputs.bootstrap != 'true'))
        run: |
          set -euo pipefail
          echo "::error::aria-tools state was NOT published under the canonical name."
          echo "state_valid=${{ steps.integrity.outputs.state_valid }}"
          echo "restored=${{ steps.restore_state.outputs.restored }}"
          echo "bootstrap=${{ steps.restore_state.outputs.bootstrap }}"
          echo "The tree is preserved as quarantine-evidence-${{ github.run_id }}."
          exit 1
