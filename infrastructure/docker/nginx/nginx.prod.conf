# =============================================================================
# Aquaculture Platform - Production Server Configuration
# Place this in /etc/nginx/conf.d/default.conf
# =============================================================================

# WebSocket upgrade map (SEC-NM-008: fix Connection header conflict)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# MFE cache control map: remoteEntry.js = no-cache, /assets/ = immutable, rest = default
map $uri $mfe_cache_control {
    default                "";
    "~*remoteEntry\.js$"   "no-cache, no-store, must-revalidate";
    "~*/assets/"           "public, max-age=31536000, immutable";
}

# CORS origin allowlist map (SEC-NM-004: replace wildcard CORS)
map $http_origin $cors_origin {
    default                     "";
    "https://app.suderra.com"   "https://app.suderra.com";
    "https://m.suderra.com"     "https://m.suderra.com";
}

# Upstream definitions
upstream gateway {
    server gateway-api:3000;
    keepalive 32;
}

upstream shell {
    server shell:80;
}

upstream aquamobil {
    server aquamobil:80;
}

upstream dashboard {
    server dashboard:80;
}

upstream farm-module {
    server farm-module:80;
}

upstream hr-module {
    server hr-module:80;
}

upstream sensor-module {
    server sensor-module:80;
}

upstream hydroponics-module {
    server hydroponics-module:80;
}

upstream admin-panel {
    server admin-panel:80;
}

upstream tenant-admin {
    server tenant-admin:80;
}

# ==========================================================================
# HTTP -> HTTPS Redirect (Port 80)
# ==========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Security: Hide nginx version
    server_tokens off;

    # Health check endpoint (keep on HTTP for internal monitoring)
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Block metrics from public traffic (SEC-NM-005)
    location /metrics {
        deny all;
        return 403;
    }

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================================================
# Main Application Server (HTTPS - Port 443)
# ==========================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # SSL certificates
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security: Hide nginx version
    server_tokens off;

    # Request body limit (SEC-NM-016)
    client_max_body_size 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # SEC-NM-014: X-XSS-Protection removed (deprecated); CSP provides equivalent protection
    # SEC-NM-017: unsafe-eval removed; Vite production builds do not require eval()
    # D14-SC-02: unsafe-inline removed from script-src; Vite production builds emit no inline scripts
    # M-07: Unencrypted ws: removed from connect-src; only wss: is permitted in production
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; script-src-elem 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; worker-src 'self' blob:; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://server.arcgisonline.com https://*.basemaps.cartocdn.com; connect-src 'self' wss: https://cdn.jsdelivr.net https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    # SEC-NM-015: Permissions-Policy added
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Block /metrics from public traffic (SEC-NM-005)
    location /metrics {
        deny all;
        return 403;
    }

    # Socket.IO WebSocket proxy (all namespaces: /farms, /messaging, /sensors, /st-language)
    location /socket.io/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # GraphQL API (SEC-NM-008: use map-based Connection header)
    location /graphql {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for subscriptions (SEC-NM-008: fixed duplicate Connection header)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    # REST API
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Mobile PWA (AquaMobil) - /mobile path
    location /mobile/ {
        proxy_pass http://aquamobil/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Microfrontend modules
    location /mf/dashboard/ {
        proxy_pass http://dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mf/farm/ {
        proxy_pass http://farm-module/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mf/hr/ {
        proxy_pass http://hr-module/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mf/sensor/ {
        proxy_pass http://sensor-module/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mf/hydroponics/ {
        proxy_pass http://hydroponics-module/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mf/admin/ {
        proxy_pass http://admin-panel/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mf/tenant/ {
        proxy_pass http://tenant-admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================================================================
    # Production remotes - Shell build uses /remotes/ prefix for Module Federation
    # Cache policy via $mfe_cache_control map:
    #   remoteEntry.js  -> no-cache (always fetch latest)
    #   /assets/        -> immutable, 1 year (content-hashed filenames)
    # =========================================================================

    location /remotes/dashboard/ {
        proxy_pass http://dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control $mfe_cache_control;
    }

    location /remotes/farm-module/ {
        proxy_pass http://farm-module/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control $mfe_cache_control;
    }

    location /remotes/hr-module/ {
        proxy_pass http://hr-module/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control $mfe_cache_control;
    }

    location /remotes/sensor-module/ {
        proxy_pass http://sensor-module/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control $mfe_cache_control;
    }

    location /remotes/hydroponics-module/ {
        proxy_pass http://hydroponics-module/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control $mfe_cache_control;
    }

    location /remotes/admin-panel/ {
        proxy_pass http://admin-panel/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control $mfe_cache_control;
    }

    location /remotes/tenant-admin/ {
        proxy_pass http://tenant-admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control $mfe_cache_control;
    }

    # Shell (main frontend) - catch all
    location / {
        proxy_pass http://shell;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ==========================================================================
# Mobile App Subdomain HTTP -> HTTPS Redirect
# ==========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name m.* mobile.*;

    # Security: Hide nginx version
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Block metrics from public traffic (SEC-NM-005)
    location /metrics {
        deny all;
        return 403;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================================================
# Mobile App Subdomain (m.domain.com or mobile.domain.com) - HTTPS
# ARCH-NM-011: Complete header set to match main server block
# ==========================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name m.* mobile.*;

    # SSL certificates
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security: Hide nginx version
    server_tokens off;

    # Request body limit (SEC-NM-016)
    client_max_body_size 10m;

    # Security Headers (ARCH-NM-011: aligned with main server block)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # SEC-NM-014: X-XSS-Protection removed (deprecated)
    # SEC-NM-017: unsafe-eval removed; Vite production builds do not require eval()
    # D14-SC-02: unsafe-inline removed from script-src; Vite production builds emit no inline scripts
    # M-07: Unencrypted ws: removed from connect-src; only wss: is permitted in production
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; script-src-elem 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; worker-src 'self' blob:; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://server.arcgisonline.com https://*.basemaps.cartocdn.com; connect-src 'self' wss: https://cdn.jsdelivr.net https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    # SEC-NM-015: Permissions-Policy added
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=()" always;

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Block /metrics from public traffic (SEC-NM-005)
    location /metrics {
        deny all;
        return 403;
    }

    # GraphQL API proxy
    # SEC-NM-009: rate limiting added; SEC-NM-008: fixed Connection header
    location /graphql {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for subscriptions
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    # Mobile PWA
    location / {
        proxy_pass http://aquamobil;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
