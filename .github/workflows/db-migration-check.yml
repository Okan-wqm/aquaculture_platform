name: Database Migration Check

# =============================================================================
# Database Migration Check — TypeORM Migration Validation
#
# PURPOSE
# -------
# Fast, hermetic validation of the TypeORM migration files that actually
# ship with this codebase, with no database, no NX build, and no docker.
# The previous revision of this workflow tried to:
#
#   1. Build gateway-api with `npx nx build gateway-api`, then run
#      `typeorm migration:run -d dist/apps/gateway-api/src/data-source.js`.
#      Neither gateway-api nor any other service owns a `data-source.ts`
#      file — migrations are registered as class references inside
#      `TypeOrmModule.forRoot({ migrations: [...] })` and executed at
#      service-boot time by `MigrationRunnerService`, not by the typeorm
#      CLI. The step has never worked in this codebase.
#
#   2. Run Flyway validate against `database/migrations/core/**` and
#      `database/migrations/modules/**`. The Flyway tree is a
#      vestigial scaffolding experiment that was never wired into
#      the runtime — nothing in the application code references
#      `database/migrations/**` (every service registers its own
#      TypeORM migration classes via TypeOrmModule.forRoot per the
#      WHAT THIS WORKFLOW CHECKS NOW section below). The Flyway
#      job was removed when this workflow was rewritten.
#
#      DATA-LOW-002 cure: a previous revision of this comment
#      claimed "9 of the 13 SQL files in that tree are empty (0
#      bytes)". Direct file-size check at 2026-04-29 showed every
#      `database/migrations/core/V*.sql` carried 281–2491 bytes
#      and every `database/migrations/modules/<svc>/V*.sql` carried
#      762–5598 bytes. None empty. The misclaim was a documentation-
#      rot artifact from a much earlier iteration of the tree —
#      kept here as a historical note in case future maintainers
#      grep for the old phrasing.
#
#      The Flyway tree itself is left in place so the git history
#      stays intact and anyone looking for the old Flyway design
#      can still find it. DATA-HIGH-001 (the agent's separate
#      tracking finding for the orphan tree) covers the eventual
#      removal — until that lands, this workflow neither validates
#      the tree nor relies on it.
#
# Beyond that, the `npx nx build` step hung silently for hours on every
# run because the Windows-generated `package-lock.json` has no
# `@nx/nx-linux-x64-gnu` binary; without it NX hangs until the 6-hour
# GitHub Actions runner timeout. Five zombie runs piled up at
# 09:36Z, 12:27Z, 13:37Z, 13:53Z, and 14:28Z on 2026-04-07 before this
# rewrite landed.
#
# WHAT THIS WORKFLOW CHECKS NOW
# -----------------------------
# The real migration path in this codebase is
# `apps/<service>/src/**/migrations/<timestamp>-<Name>.ts`, one class
# per file, registered in the service's AppModule. The checks below
# match that reality:
#
#   1. Filename convention — every migration file name must match
#      `<13-digit-timestamp>-<PascalCaseName>.ts`.
#   2. Class name consistency — the exported class inside must be
#      named `<PascalCaseName><timestamp>` and match the file name.
#   3. Global timestamp uniqueness — no two migrations anywhere in the
#      repo may share the same timestamp. Collisions would produce
#      undefined ordering under TypeORM's migration runner.
#   4. Syntax / type check — each migration file compiles under
#      `tsc --noEmit` against the service's `tsconfig.build.json` so
#      structural errors (missing imports, bad decorator usage, typos
#      in table names as SQL string literals — the latter caught only
#      at runtime but the former all caught here) surface at PR time
#      instead of at deploy time.
#
# The job finishes in well under a minute and has no external
# dependencies: no postgres, no docker, no native binaries, no NX.
# It cannot hang.
#
# Real integration-level migration validation — i.e. "does the
# migration actually run against a database" — happens at deploy time
# via `MigrationRunnerService.onApplicationBootstrap()` and the
# deploy workflow's `Verify deployment` health check. Two different
# quality gates at two different layers, neither duplicating the
# other's work.
#
# SEC-CI-002: All third-party actions pinned to full commit SHAs.
# =============================================================================

on:
  pull_request:
    paths:
      - 'apps/*/src/**/migrations/**'
      - 'apps/*/src/**/*.entity.ts'
      - '.github/workflows/db-migration-check.yml'
  push:
    branches: [main, develop]
    paths:
      - 'apps/*/src/**/migrations/**'
      - '.github/workflows/db-migration-check.yml'

# SEC-CI-021: Minimum token permissions.
permissions:
  contents: read

jobs:
  typeorm-migration-validation:
    runs-on: ubuntu-latest
    # Bounded budget — the checks take ~30 seconds on a cold runner.
    # 10 minutes is a generous ceiling that still guarantees no zombies.
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      # -------------------------------------------------------------------
      # Check 1 + 2: filename convention and class name consistency.
      # Pure shell — no node_modules needed. Fails fast on the first bad
      # file with an inline GitHub annotation so the PR reviewer can
      # click straight to the offending line.
      # -------------------------------------------------------------------
      - name: Validate migration filename and class name conventions
        run: |
          set -euo pipefail
          INVALID=0
          while IFS= read -r file; do
            base=$(basename "$file")
            # Expected: <13-digit-timestamp>-<PascalCaseName>.ts
            if ! echo "$base" | grep -qE '^[0-9]{13}-[A-Z][A-Za-z0-9]*\.ts$'; then
              echo "::error file=$file::Invalid migration filename: '$base' (expected <13-digit-timestamp>-<PascalCaseName>.ts)"
              INVALID=1
              continue
            fi

            # Derive the expected class name from the file name:
            #   "1781900000000-ConvertAuditColumnsToTimestamptz.ts"
            # → class "ConvertAuditColumnsToTimestamptz1781900000000"
            ts=$(echo "$base" | cut -d- -f1)
            name_ts=$(echo "$base" | sed -E 's/\.ts$//')
            name=${name_ts#*-}
            expected_class="${name}${ts}"

            if ! grep -qE "^export class ${expected_class}\b" "$file"; then
              echo "::error file=$file::Class name mismatch — expected 'export class ${expected_class}' based on filename '$base'"
              INVALID=1
            fi
          done < <(find apps -type f -name '[0-9]*-*.ts' -not -name '*.spec.ts' -not -name '*.test.ts' -path '*/migrations/*' 2>/dev/null | sort)

          if [ "$INVALID" -eq 1 ]; then
            exit 1
          fi
          echo "All migration filenames and class names match convention."

      # -------------------------------------------------------------------
      # Check 3: no two migrations WITHIN A SINGLE SERVICE share a
      # timestamp. Each service owns its own `migrations` tracking table
      # (TypeORM runs migrations per DataSource, and every service
      # instantiates its own), so collisions only matter inside a service's
      # migration lineage. Collisions ACROSS services are not only allowed
      # but actively useful — they let a cross-cutting fix (e.g. NEW-H1,
      # which ships `1781900000000-ConvertAuditColumnsToTimestamptz` to
      # 5 services simultaneously) advertise its relationship through a
      # shared timestamp that's easy to grep and correlate in incident
      # forensics. Within a single service, however, TypeORM orders the
      # migration list by this timestamp and a duplicate produces
      # non-deterministic ordering — the classic "silently marks both as
      # applied even though only one actually runs" production nightmare.
      #
      # Implementation note: we group by the service directory extracted
      # from the path (everything between `apps/` and `/src/...`), then
      # count duplicate timestamps inside each group independently.
      # -------------------------------------------------------------------
      - name: Check for duplicate migration timestamps within each service
        run: |
          set -euo pipefail
          FAILED=0
          # Derive the list of services that actually own migrations.
          services=$(
            find apps -type f -name '[0-9]*-*.ts' -not -name '*.spec.ts' -not -name '*.test.ts' -path '*/migrations/*' \
              | sed -E 's|^apps/([^/]+)/.*|\1|' \
              | sort -u
          )
          for svc in $services; do
            dupes=$(
              find "apps/${svc}" -type f -name '[0-9]*-*.ts' -not -name '*.spec.ts' -not -name '*.test.ts' -path '*/migrations/*' \
                -exec basename {} \; \
                | cut -d- -f1 \
                | sort \
                | uniq -d
            )
            if [ -n "$dupes" ]; then
              echo "::error::Duplicate migration timestamps detected within service '$svc':"
              for ts in $dupes; do
                echo "  $ts is used by:"
                find "apps/${svc}" -type f -name "${ts}-*.ts" -not -name '*.spec.ts' -not -name '*.test.ts' -path '*/migrations/*' | sed 's/^/    /'
              done
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "All migration timestamps are unique within each service."

      # -------------------------------------------------------------------
      # Check 4 — REMOVED in TRACK C (scope realignment).
      #
      # The previous revision compiled EVERY service that owns
      # migrations with `tsc --noEmit`, regardless of whether the PR
      # touched migration code. That made this gate fail on pre-existing
      # TS strict-null errors in totally unrelated libraries (e.g.
      # `libs/aquaculture-engines/water-chemistry/reagents.ts`) every
      # time anyone touched any `.entity.ts` file.
      #
      # Type-checking belongs in `ci-affected.yml`'s dedicated
      # `type-check` job which uses `nx affected -t type-check` —
      # only the services actually affected by a change get checked,
      # and the same gate applies uniformly to the whole codebase
      # (not just services that happen to own migrations).
      #
      # This workflow now focuses strictly on its named purpose:
      # migration filename / class-name / timestamp-uniqueness
      # conventions. The whole-service compile is no longer this
      # workflow's concern.
      # -------------------------------------------------------------------
