# =============================================================================
# Required Secrets — Single Source of Truth for Deploy Pre-flight
# =============================================================================
#
# This file is THE authoritative classification of every environment variable
# that a production-shape compose file declares as mandatory via `${VAR:?...}`
# substitution syntax. It exists so pre-flight checks at two separate gates
# (CI at PR time, deploy at rollout time) can both assert the same invariant
# against a single declarative manifest — no drift between the two.
#
# # Maintenance contract
#
# Adding a new mandatory secret to a compose file:
#   1. Add `SERVICE_THING: ${SERVICE_THING:?SERVICE_THING is required}` to
#      the compose env block
#   2. Add an entry to `secrets:` below with the same name + purpose line
#
# Adding a new mandatory non-secret runtime variable to a compose file:
#   1. Add `${SERVICE_THING:?SERVICE_THING is required}` to the compose field
#   2. Add an entry to `runtime_required_env:` below with the same name +
#      purpose line and the deploy automation that supplies it
#
# Removing a mandatory secret:
#   1. Remove from the compose env block
#   2. Remove the entry here
#
# Compose interpolation itself is auto-validated by
# `scripts/ci/preflight-validate.ts` (CI Phase A2): it scans each compose
# file for `${VAR:?}` references and synthesises a throwaway dummy env at
# run time, so `docker compose config --quiet` succeeds without any
# hand-maintained ci-test.env. That keeps the compose file as the SSoT
# for "what prod needs at interpolation time" — Tier-2 Make-Automatic
# per CLAUDE.md.
#
# The CI invariant `scripts/ci/validate-required-secrets.py` fails the build
# if ANY of the following drift:
#   - A `${VAR:?}` in a listed compose file has no `secrets` or
#     `runtime_required_env` entry here
#   - An entry here has no `${VAR:?}` in any listed compose file
#   - An entry's `required_by` list does not match the compose files it
#     actually appears in
#
# # Consumers
#
# - `.github/workflows/ci-affected.yml` pre-flight job (at PR time)
# - `.github/workflows/deploy-digitalocean.yml` pre-flight step (at deploy
#   time — commit 607f9d9d added the first version of this check inline;
#   a future workstream will migrate it to read this manifest so both gates
#   share one source)
# - Operators: `grep name infrastructure/deploy/required-secrets.yaml`
#   lists everything that MUST be in `.env` before deploy
#
# =============================================================================

version: 1

# Compose files whose `${VAR:?}` interpolations MUST be covered by the
# `secrets` list below. The validator scans each file with a regex for
# `${VAR:?...}` patterns; every unique VAR found must appear as a `name`
# in `secrets`. Order matches deploy priority (droplet is the active
# production shape; prod.yml is the historical compose).
compose_files:
  - docker-compose.droplet.yml
  - docker-compose.prod.yml
  - docker-compose.yml

runtime_required_env:
  - name: TAG
    purpose: Immutable release image tag for droplet deploys; supplied by GitHub Actions/droplet-up.sh from DEPLOY_SHA, not operator secret material
    required_by: [docker-compose.droplet.yml]

secrets:
  # ---------------------------------------------------------------------------
  # Database — PostgreSQL + per-service role passwords (ADR-011)
  # ---------------------------------------------------------------------------
  - name: POSTGRES_PASSWORD
    purpose: PostgreSQL superuser password (postgres role); used by init scripts to create per-service roles
    required_by: [docker-compose.droplet.yml, docker-compose.prod.yml]

  - name: AUTH_SERVICE_DB_PASS
    purpose: auth-service DB role password (scoped to auth schema)
    required_by: [docker-compose.prod.yml]

  - name: FARM_SERVICE_DB_PASS
    purpose: farm-service DB role password (scoped to farm schema)
    required_by: [docker-compose.prod.yml]

  - name: SENSOR_SERVICE_DB_PASS
    purpose: sensor-service DB role password (scoped to sensor schema)
    required_by: [docker-compose.prod.yml]

  - name: HR_SERVICE_DB_PASS
    purpose: hr-service DB role password (scoped to hr schema)
    required_by: [docker-compose.prod.yml]

  - name: BILLING_SERVICE_DB_PASS
    purpose: billing-service DB role password (scoped to billing schema)
    required_by: [docker-compose.prod.yml]

  - name: ALERT_SERVICE_DB_PASS
    purpose: alert-engine DB role password (scoped to alert schema)
    required_by: [docker-compose.prod.yml]

  - name: NOTIFICATION_SERVICE_DB_PASS
    purpose: notification-service DB role password (scoped to notification schema)
    required_by: [docker-compose.prod.yml]

  - name: ADMIN_SERVICE_DB_PASS
    purpose: admin-api-service DB role password (scoped to admin schema)
    required_by: [docker-compose.prod.yml]

  - name: GATEWAY_SERVICE_DB_PASS
    purpose: gateway-api DB role password (cross-schema reads via RLS)
    required_by: [docker-compose.prod.yml]

  # ---------------------------------------------------------------------------
  # Cache / Queue
  # ---------------------------------------------------------------------------
  - name: REDIS_PASSWORD
    purpose: Redis AUTH password; required by every service and by redis-server --requirepass
    required_by: [docker-compose.droplet.yml, docker-compose.prod.yml]

  # ---------------------------------------------------------------------------
  # Object storage
  # ---------------------------------------------------------------------------
  - name: MINIO_USER
    purpose: MinIO root user (also used as access key by backend services)
    required_by: [docker-compose.droplet.yml]

  - name: MINIO_PASSWORD
    purpose: MinIO root password (also used as secret key by backend services)
    required_by: [docker-compose.droplet.yml]

  # ---------------------------------------------------------------------------
  # Cross-service authentication — platform secrets
  # ---------------------------------------------------------------------------
  - name: INTERNAL_SERVICE_SECRET
    purpose: HMAC secret for gateway-api to subgraph service-identity binding (libs/backend-common/utils/service-identity.util.ts)
    required_by: [docker-compose.droplet.yml]

  - name: JWT_SECRET
    purpose: Legacy HS256 JWT secret (superseded by RS256 keypair; retained for docker-compose.yml dev compatibility)
    required_by: [docker-compose.yml]

  - name: ENCRYPTION_KEY
    purpose: Platform-wide AES-256 encryption key for column-level secrets (32-byte hex)
    required_by: [docker-compose.droplet.yml, docker-compose.prod.yml, docker-compose.yml]

  - name: PASSWORD_PEPPER
    purpose: auth-service bcrypt pepper added to every password hash (rotation-safe)
    required_by: [docker-compose.droplet.yml, docker-compose.prod.yml]

  - name: MFA_ENCRYPTION_KEY
    purpose: auth-service AES-256-GCM key for encrypted MFA TOTP secrets; production startup fails without it
    required_by: [docker-compose.droplet.yml, docker-compose.prod.yml]

  - name: SUPER_ADMIN_PASSWORD
    purpose: Platform super-admin account bootstrap password (first-run seed)
    required_by: [docker-compose.droplet.yml]

  # ---------------------------------------------------------------------------
  # MQTT — Mosquitto broker + sensor-service client
  # ---------------------------------------------------------------------------
  - name: MQTT_AUTH_SECRET
    purpose: Shared HMAC secret between Mosquitto go-auth plugin and sensor-service auth API
    required_by: [docker-compose.droplet.yml]

  - name: MQTT_SENSOR_SERVICE_HASH
    purpose: Pre-computed bcrypt hash of MQTT_SENSOR_SERVICE_PASSWORD (provisioned into mosquitto.passwd)
    required_by: [docker-compose.droplet.yml]

  - name: MQTT_SENSOR_SERVICE_PASSWORD
    purpose: Sensor-service cleartext MQTT password (sensor-service client → Mosquitto broker)
    required_by: [docker-compose.droplet.yml]

  # ---------------------------------------------------------------------------
  # Sensor credentials + webhooks
  # ---------------------------------------------------------------------------
  - name: CREDENTIAL_ENCRYPTION_KEY
    purpose: sensor-service column-level encryption for stored sensor credentials
    required_by: [docker-compose.droplet.yml]

  - name: WEBHOOK_ENCRYPTION_KEY
    purpose: billing-service Stripe webhook signing-secret encryption (min 32 chars)
    required_by: [docker-compose.droplet.yml]

  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------
  - name: OBSERVABILITY_INTERNAL_API_KEY
    purpose: observability-service internal API key (services post metrics/traces via this key)
    required_by: [docker-compose.droplet.yml, docker-compose.prod.yml]
