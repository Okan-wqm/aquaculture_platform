<html lang="tr">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .scada-container {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
    }
    .scada-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      height: 48px; min-height: 48px;
    }
    .scada-header-left {
      display: flex; align-items: center; gap: 12px;
    }
    .scada-header-title {
      font-size: 16px; font-weight: 600; color: #f1f5f9;
    }
    .scada-header-right {
      display: flex; align-items: center; gap: 12px; font-size: 13px;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      display: inline-block;
    }
    .status-dot.connected { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .status-dot.connecting { background: #eab308; animation: pulse 1.5s infinite; }
    .status-dot.disconnected { background: #ef4444; }
    .status-dot.failed { background: #ef4444; }
    .scada-body {
      flex: 1; position: relative; overflow: hidden;
    }
    /* ReactFlow overrides for dark theme */
    .react-flow__background { background: #0f172a !important; }
    .react-flow__controls { box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .react-flow__controls-button { background: #1e293b; border-color: #475569; color: #e2e8f0; }
    .react-flow__controls-button:hover { background: #334155; }
    .react-flow__minimap { background: #1e293b; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    /* Node styles */
    .react-flow__node-scadaEquipment,
    .react-flow__node-equipment,
    .react-flow__node-blower,
    .react-flow__node-drumFilter,
    .react-flow__node-uvUnit,
    .react-flow__node-radialSettler,
    .react-flow__node-fishTank,
    .react-flow__node-connectionPoint,
    .react-flow__node-tankInlet {
      padding: 0; border-radius: 8px;
      background: #1e293b; border: 1px solid #334155;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      color: #e2e8f0;
    }
    .react-flow__node-algaeBagRed,
    .react-flow__node-algaeBagGreen,
    .react-flow__node-algaeBagYellow,
    .react-flow__node-demandFeeder,
    .react-flow__node-automaticFeeder {
      padding: 0; background: transparent; border: none; box-shadow: none;
    }
    .react-flow__node-connectionPoint { border-radius: 50%; }
    .react-flow__handle {
      width: 10px; height: 10px;
      background: #1e293b; border: 2px solid #60a5fa;
    }
    .react-flow__edge-path { stroke-width: 2; }
    .sensor-badge {
      display: inline-flex; align-items: center; gap: 2px;
      padding: 2px 6px; border-radius: 4px;
      font-size: 12px; font-weight: 600;
    }
    .sensor-badge.normal { background: #14532d; color: #86efac; border: 1px solid #22c55e; }
    .sensor-badge.warning { background: #713f12; color: #fde047; border: 1px solid #eab308; }
    .sensor-badge.critical { background: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; }
    .sensor-badge.offline { background: #1e293b; color: #64748b; border: 1px solid #475569; }
    .scada-node-wrapper { position: relative; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.15); }
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .clock { font-size: 13px; color: #94a3b8; font-variant-numeric: tabular-nums; }

    /* Tab bar */
    .tab-bar { display: flex; gap: 4px; }
    .tab-btn { padding: 6px 16px; border-radius: 8px 8px 0 0; border: none; background: transparent; color: #94a3b8; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; font-family: inherit; }
    .tab-btn.active { background: #0f172a; color: #f1f5f9; font-weight: 600; }
    .tab-btn:hover { color: #e2e8f0; }

    /* Status footer */
    .status-footer { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px; background: #1e293b; border-top: 1px solid #334155; height: 36px; min-height: 36px; font-size: 12px; color: #94a3b8; }
    .status-footer-left { display: flex; align-items: center; gap: 12px; }
    .status-footer-right { display: flex; align-items: center; gap: 12px; }

    /* Slider input */
    input[type=range] { -webkit-appearance: none; appearance: none; height: 8px; background: #334155; border-radius: 4px; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #3b82f6; cursor: pointer; }

    /* Waiting screen styles */
    .waiting-screen {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0f172a; position: relative; overflow: hidden;
    }
    .waiting-screen::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 50%, rgba(59,130,246,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .waiting-content {
      display: flex; flex-direction: column; align-items: center;
      gap: 32px; z-index: 1; text-align: center; padding: 24px;
    }
    .waiting-icon {
      width: 80px; height: 80px; border-radius: 20px;
      background: linear-gradient(135deg, #1e3a5f 0%, #1e293b 100%);
      border: 1px solid #334155;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    .waiting-icon svg { width: 40px; height: 40px; color: #3b82f6; }
    .waiting-spinner {
      width: 48px; height: 48px; border-radius: 50%;
      border: 3px solid #1e293b;
      border-top-color: #3b82f6;
      animation: spin 1s linear infinite;
    }
    .waiting-title { font-size: 22px; font-weight: 600; color: #f1f5f9; letter-spacing: -0.01em; }
    .waiting-subtitle { font-size: 14px; color: #64748b; max-width: 380px; line-height: 1.5; }
    .waiting-device-info { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 8px; }
    .waiting-device-chip {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 8px;
      background: #1e293b; border: 1px solid #334155;
      font-size: 13px; color: #94a3b8;
    }
    .waiting-device-chip .chip-label { color: #64748b; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
    .waiting-device-chip .chip-value { color: #e2e8f0; font-weight: 500; }
    .ws-status-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: 8px;
      background: #1e293b; border: 1px solid #334155;
      font-size: 13px;
    }
    .ws-status-bar .status-dot { width: 8px; height: 8px; }
    .ws-status-bar.ws-connected { border-color: rgba(34,197,94,0.3); }
    .ws-status-bar.ws-connecting { border-color: rgba(234,179,8,0.3); }
    .ws-status-bar.ws-disconnected { border-color: rgba(239,68,68,0.3); }

    /* Portrait orientation warning overlay */
    @media (orientation: portrait) {
      .scada-container::after {
        content: 'Lutfen cihazi yatay konuma cevirin';
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #0f172a; color: #94a3b8;
        font-size: 18px; text-align: center; padding: 24px;
      }
    }
    /* Larger touch targets for ReactFlow controls */
    .react-flow__controls-button {
      width: 48px !important; height: 48px !important;
      font-size: 18px !important;
    }
    /* Hide MiniMap on small screens */
    @media (max-width: 600px) {
      .react-flow__minimap { display: none !important; }
    }
    /* iOS safe area insets */
    .scada-header {
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }
    .scada-container {
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Alarm badge in header */
    .alarm-badge {
      display: flex; align-items: center; gap: 4px;
      padding: 2px 10px; border-radius: 12px;
      font-size: 12px; font-weight: 600;
      cursor: pointer;
    }
    .alarm-badge.has-alarms { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
    .alarm-badge.no-alarms { background: rgba(34,197,94,0.1); color: #86efac; border: 1px solid rgba(34,197,94,0.2); }
  </style>

<body>
  <div id="root"></div>
  <script type="text/javascript">
    var h = React.createElement;
    var useState = React.useState;
    var useCallback = React.useCallback;
    var useRef = React.useRef;
    var useEffect = React.useEffect;
    var useMemo = React.useMemo;
    var createRoot = ReactDOM.createRoot;
    var RF = window.ReactFlow;
    var ReactFlowComp = RF.ReactFlow;
    var ReactFlowProvider = RF.ReactFlowProvider;
    var useNodesState = RF.useNodesState;
    var useEdgesState = RF.useEdgesState;
    var Controls = RF.Controls;
    var Background = RF.Background;
    var MiniMap = RF.MiniMap;
    var Handle = RF.Handle;
    var Position = RF.Position;
    var MarkerType = RF.MarkerType;

    // ============================================
    // Global Mutable State
    // ============================================
    var tagStore = {};
    var trendDataStore = {};
    var TAG_STORE_STALE_MS = 5 * 60 * 1000; // 5 min stale threshold
    var TREND_MAX_POINTS = 1000; // max data points per tag (FIFO)
    var activeAlarms = [];

    // Periodic cleanup of stale tags (runs every 60s)
    setInterval(function() {
      var now = Date.now();
      Object.keys(tagStore).forEach(function(key) {
        var tag = tagStore[key];
        if (tag && tag._lastSeen && (now - tag._lastSeen) > TAG_STORE_STALE_MS) {
          delete tagStore[key];
        }
      });
      // Trim trend data that exceeds max points
      Object.keys(trendDataStore).forEach(function(key) {
        if (trendDataStore[key] && trendDataStore[key].length > TREND_MAX_POINTS) {
          trendDataStore[key] = trendDataStore[key].slice(-TREND_MAX_POINTS);
        }
      });
    }, 60000);
    var emergencyActive = false;
    var pinSessionValid = false;
    var currentPackage = null;

    // ============================================
    // WebSocket Connection Manager
    // ============================================
    var MAX_RECONNECT_ATTEMPTS = 15;
    var BASE_RECONNECT_DELAY = 3000;

    function useScadaWebSocket(url) {
      var statusState = useState('disconnected');
      var status = statusState[0], setStatus = statusState[1];
      var wsRef = useRef(null);
      var msgState = useState(null);
      var lastMessage = msgState[0], setLastMessage = msgState[1];
      var reconnectTimer = useRef(null);
      var retryCount = useRef(0);

      var send = useCallback(function(msg) {
        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
          wsRef.current.send(JSON.stringify(msg));
        }
      }, []);

      var connect = useCallback(function() {
        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) return;
        if (retryCount.current >= MAX_RECONNECT_ATTEMPTS) {
          console.error('[scada-edge] Max reconnect attempts reached');
          setStatus('failed');
          return;
        }
        setStatus('connecting');
        var ws = new WebSocket(url);
        wsRef.current = ws;
        ws.onopen = function() {
          console.log('[scada-edge] WebSocket connected');
          setStatus('connected');
          retryCount.current = 0;
        };
        ws.onmessage = function(event) {
          try { setLastMessage(JSON.parse(event.data)); } catch (e) { console.warn('[scada-edge] Invalid WS message:', e); }
        };
        ws.onclose = function() {
          setStatus('disconnected');
          wsRef.current = null;
          var delay = Math.min(BASE_RECONNECT_DELAY * Math.pow(1.5, retryCount.current), 30000);
          retryCount.current++;
          console.log('[scada-edge] Disconnected, retry ' + retryCount.current + '/' + MAX_RECONNECT_ATTEMPTS + ' in ' + Math.round(delay) + 'ms');
          reconnectTimer.current = setTimeout(connect, delay);
        };
        ws.onerror = function(err) { console.error('[scada-edge] WS error:', err); ws.close(); };
      }, [url]);

      var reconnect = useCallback(function() {
        retryCount.current = 0;
        if (reconnectTimer.current) clearTimeout(reconnectTimer.current);
        if (wsRef.current) wsRef.current.close();
        connect();
      }, [connect]);

      useEffect(function() {
        connect();
        return function() {
          if (reconnectTimer.current) clearTimeout(reconnectTimer.current);
          if (wsRef.current) wsRef.current.close();
        };
      }, [connect]);

      return { status: status, lastMessage: lastMessage, reconnect: reconnect, send: send };
    }

    // ============================================
    // Status helpers
    // ============================================
    function getStatusColor(st) {
      if (st === 'operational' || st === 'active') return '#22c55e';
      if (st === 'maintenance') return '#eab308';
      if (st === 'out_of_service') return '#ef4444';
      return '#94a3b8';
    }
    function getSensorStatusColor(st) {
      if (st === 'normal') return 'normal';
      if (st === 'warning') return 'warning';
      if (st === 'critical') return 'critical';
      return 'offline';
    }

    // ============================================
    // Generic SCADA Equipment Node
    // ============================================
    function ScadaEquipmentNode(props) {
      var data = props.data || {};
      var equipmentId = data.equipmentId || data.id;
      var sensors = equipmentId ? (tagStore[equipmentId] ? [tagStore[equipmentId]] : []) : [];
      var statusColor = getStatusColor(data.status);
      return h('div', { style: { padding: '8px 12px', minWidth: 120, position: 'relative', background: '#1e293b', borderRadius: 8 } }, [
        h(Handle, { key: 'target', type: 'target', position: Position.Left }),
        h(Handle, { key: 'source', type: 'source', position: Position.Right }),
        h('div', { key: 'header', style: { display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4 } }, [
          h('div', { key: 'dot', style: { width: 8, height: 8, borderRadius: '50%', background: statusColor, flexShrink: 0 } }),
          h('div', { key: 'label', style: { fontSize: 12, fontWeight: 600, color: '#f1f5f9' } }, data.label || 'Equipment'),
        ]),
      ]);
    }

    // ============================================
    // SCADA Node Wrapper
    // ============================================
    function createScadaNode(BaseNodeComponent) {
      return function ScadaWrapper(props) {
        var data = props.data || {};
        var equipmentId = data.equipmentId;
        var sensorDataStore = {};
        if (equipmentId && tagStore[equipmentId]) {
          sensorDataStore[equipmentId] = Array.isArray(tagStore[equipmentId]) ? tagStore[equipmentId] : [tagStore[equipmentId]];
        }
        var sensors = sensorDataStore[equipmentId] || [];
        var hasAlerts = sensors.some(function(s) { return s.status === 'warning' || s.status === 'critical'; });
        var scadaProps = Object.assign({}, props, { data: Object.assign({}, props.data, { isScadaMode: true }) });
        return h('div', { className: 'scada-node-wrapper', style: { position: 'relative' } }, [
          h(BaseNodeComponent, Object.assign({}, scadaProps, { key: 'base' })),
          sensors.length > 0 && h('div', { key: 'overlay', style: { position: 'absolute', top: -8, right: -8, zIndex: 20, display: 'flex', flexDirection: 'column', gap: 2, alignItems: 'flex-end' } },
            sensors.slice(0, 3).map(function(s, i) {
              return h('span', { key: i, className: 'sensor-badge ' + getSensorStatusColor(s.status) }, (typeof s.value === 'number' ? s.value.toFixed(1) : '--') + ' ' + (s.unit || ''));
            })
          ),
          hasAlerts && h('div', { key: 'alert', style: { position: 'absolute', top: -4, left: -4, width: 12, height: 12, borderRadius: '50%', background: sensors.some(function(s) { return s.status === 'critical'; }) ? '#ef4444' : '#eab308', animation: 'pulse 1.5s infinite', zIndex: 20 } }),
        ]);
      };
    }

    // ============================================
    // Node types
    // ============================================
    var AQ = window.AquacultureNodes || {};
    var hasBundle = !!AQ.EquipmentNode;
    if (!hasBundle) {
      console.warn('[scada-edge] UMD bundle yuklenemedi. Fallback generic node kullaniliyor.');
    }
    var nodeTypes = hasBundle ? {
      scadaEquipment: ScadaEquipmentNode,
      equipment: createScadaNode(AQ.EquipmentNode),
      blower: createScadaNode(AQ.BlowerNode),
      drumFilter: createScadaNode(AQ.DrumFilterNode),
      uvUnit: createScadaNode(AQ.UVUnitNode),
      radialSettler: createScadaNode(AQ.RadialSettlerNode),
      fishTank: createScadaNode(AQ.FishTankNode),
      connectionPoint: AQ.ConnectionPointNode,
      tankInlet: AQ.TankInletNode,
      sensor: AQ.SensorNode,
      chartWidget: AQ.ChartWidgetNode ? createScadaNode(AQ.ChartWidgetNode) : undefined,
      algaeBagRed: AQ.AlgaeBagNode,
      algaeBagGreen: AQ.AlgaeBagNode,
      algaeBagYellow: AQ.AlgaeBagNode,
      demandFeeder: createScadaNode(AQ.DemandFeederNode),
      automaticFeeder: createScadaNode(AQ.AutomaticFeederNode),
      pump: createScadaNode(AQ.PumpNode),
      valve: createScadaNode(AQ.ValveNode),
      heater: createScadaNode(AQ.HeaterNode),
      dosingPump: createScadaNode(AQ.DosingPumpNode),
      ultrafiltration: createScadaNode(AQ.UltrafiltrationNode),
      dualDrainTank: createScadaNode(AQ.DualDrainTankNode),
      cleanWaterTank: createScadaNode(AQ.CleanWaterTankNode),
      dirtyWaterTank: createScadaNode(AQ.DirtyWaterTankNode),
      waterSupply: createScadaNode(AQ.WaterSupplyNode),
      waterDischarge: createScadaNode(AQ.WaterDischargeNode),
      mbbr: createScadaNode(AQ.MBBRNode),
      hepaFilter: createScadaNode(AQ.HEPAFilterNode),
      shellAndTubeHeatExchanger: createScadaNode(AQ.ShellTubeHeatExchangerNode),
      plateHeatExchanger: createScadaNode(AQ.PlateHeatExchangerNode),
      chiller: createScadaNode(AQ.ChillerNode),
      gasGenerator: createScadaNode(AQ.GasGeneratorNode),
      dieselGenerator: createScadaNode(AQ.DieselGeneratorNode),
      ozoneGenerator: createScadaNode(AQ.OzoneGeneratorNode),
      oxygenGenerator: createScadaNode(AQ.OxygenGeneratorNode),
    } : { scadaEquipment: ScadaEquipmentNode };

    var safeNodeTypes = typeof Proxy !== 'undefined' ? new Proxy(nodeTypes, {
      get: function(target, prop) {
        if (prop in target) return target[prop];
        if (typeof prop === 'string' && prop !== 'then' && prop !== 'toJSON' && !prop.startsWith('$$')) {
          console.warn('[scada-edge] Unknown node type: ' + prop + ', using fallback');
          return ScadaEquipmentNode;
        }
        return undefined;
      }
    }) : nodeTypes;

    var edgeTypes = AQ.edgeTypes || {};
    var getEdgeStyle = AQ.getEdgeStyle || function() { return { stroke: '#475569', strokeWidth: 2 }; };

    // ============================================
    // SVG Arc Helper
    // ============================================
    function describeArc(cx, cy, r, startDeg, endDeg) {
      var startRad = (startDeg - 90) * Math.PI / 180;
      var endRad = (endDeg - 90) * Math.PI / 180;
      var x1 = cx + r * Math.cos(startRad);
      var y1 = cy + r * Math.sin(startRad);
      var x2 = cx + r * Math.cos(endRad);
      var y2 = cy + r * Math.sin(endRad);
      var largeArc = (endDeg - startDeg) > 180 ? 1 : 0;
      return 'M ' + x1 + ' ' + y1 + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + x2 + ' ' + y2;
    }

    // ============================================
    // Clock Component
    // ============================================
    function Clock() {
      var st = useState(new Date());
      var time = st[0], setTime = st[1];
      useEffect(function() {
        var id = setInterval(function() { setTime(new Date()); }, 1000);
        return function() { clearInterval(id); };
      }, []);
      return h('span', { className: 'clock' }, time.toLocaleTimeString());
    }

    // ============================================
    // Waiting Screen Component
    // ============================================
    function WaitingScreen(props) {
      var status = props.status, deviceInfo = props.deviceInfo, reconnect = props.reconnect;
      var statusLabel = status === 'connected' ? 'Bagli' : status === 'connecting' ? 'Baglaniyor...' : status === 'failed' ? 'Baglanti Basarisiz' : 'Bagli Degil';
      var wsClass = 'ws-' + status;
      var scadaIcon = h('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.5, strokeLinecap: 'round', strokeLinejoin: 'round' }, [
        h('rect', { key: '1', x: 2, y: 3, width: 20, height: 14, rx: 2 }),
        h('line', { key: '2', x1: 8, y1: 21, x2: 16, y2: 21 }),

        dots.push(h('div', { key: di, style: { width: 16, height: 16, borderRadius: '50%', background: di < pin.length ? '#3b82f6' : '#475569' } }));
      }

      return h('div', { style: { position: 'fixed', inset: 0, zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(0,0,0,0.6)' } },
        h('div', { style: { background: '#1e293b', borderRadius: 16, padding: 24, maxWidth: 320, border: '1px solid #334155' } }, [
          h('div', { key: 't', style: { fontSize: 16, fontWeight: 600, color: '#f1f5f9', marginBottom: 8, textAlign: 'center' } }, 'PIN Girisi'),
          h('div', { key: 'display', style: { display: 'flex', justifyContent: 'center', gap: 8, marginBottom: 16 } }, dots),
          error && h('div', { key: 'err', style: { color: '#ef4444', fontSize: 12, textAlign: 'center', marginBottom: 8 } }, error),
          h('div', { key: 'pad', style: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8 } },
            digits.map(function(d, i) {
              if (d === null) return h('div', { key: i });
              return h('button', { key: i, onClick: function() { if (d === '\u232B') { setPin(pin.slice(0, -1)); } else { addDigit(d); } }, style: { padding: 16, borderRadius: 8, border: 'none', background: '#334155', color: '#e2e8f0', fontSize: 20, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' } }, d + '');
            })
          ),
          h('div', { key: 'acts', style: { display: 'flex', gap: 8, marginTop: 16 } }, [
            h('button', { key: 'cancel', onClick: onCancel, style: { flex: 1, padding: 12, borderRadius: 8, border: '1px solid #475569', background: 'transparent', color: '#94a3b8', cursor: 'pointer', fontFamily: 'inherit' } }, 'Iptal'),
            h('button', { key: 'ok', onClick: submit, disabled: pin.length < 4, style: { flex: 1, padding: 12, borderRadius: 8, border: 'none', background: pin.length >= 4 ? '#3b82f6' : '#475569', color: '#fff', fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' } }, 'Giris'),
          ]),
        ])
      );
    }

    // ============================================
    // Toast Container
    // ============================================
    function ToastContainer(props) {
      var toasts = props.toasts || [];
      return h('div', { style: { position: 'fixed', top: 60, right: 16, zIndex: 999, display: 'flex', flexDirection: 'column', gap: 8, maxWidth: 320 } },
        toasts.map(function(t, i) {
          var bg = t.type === 'success' ? '#14532d' : t.type === 'error' ? '#7f1d1d' : '#1e293b';
          var border = t.type === 'success' ? '#22c55e' : t.type === 'error' ? '#ef4444' : '#334155';
          return h('div', { key: t.id || i, style: { padding: '10px 16px', borderRadius: 8, background: bg, border: '1px solid ' + border, color: '#e2e8f0', fontSize: 13, animation: 'fadeIn 0.2s' } }, t.message);
        })
      );
    }

    // ============================================
    // Main App
    // ============================================
    function ScadaEdgeApp() {
      var wsProto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
      var wsUrl = wsProto + window.location.host + '/ws/scada';
      var ws = useScadaWebSocket(wsUrl);
      var status = ws.status, lastMessage = ws.lastMessage, reconnect = ws.reconnect, send = ws.send;

      var screenState = useState(null);
      var activeScreen = screenState[0], setActiveScreen = screenState[1];
      var screensState = useState([]);
      var screens = screensState[0], setScreens = screensState[1];
      var pkgState = useState(null);
      var package_ = pkgState[0], setPackage = pkgState[1];
      var allTagsState = useState({});
      var allTags = allTagsState[0], setAllTags = allTagsState[1];
      var alarmsState = useState([]);
      var alarms = alarmsState[0], setAlarms = alarmsState[1];
      var emergState = useState(false);
      var emergency = emergState[0], setEmergency = emergState[1];
      var confirmState = useState(null);
      var showConfirm = confirmState[0], setShowConfirm = confirmState[1];
      var pinState = useState(null);
      var showPin = pinState[0], setShowPin = pinState[1];
      var toastsState = useState([]);
      var toasts = toastsState[0], setToasts = toastsState[1];
      var calibStateHolder = useState(null);
      var calibState = calibStateHolder[0], setCalibState = calibStateHolder[1];
      var deviceInfoState = useState(null);
      var deviceInfo = deviceInfoState[0], setDeviceInfo = deviceInfoState[1];
      var trendTickState = useState(0);
      var trendTick = trendTickState[0], setTrendTick = trendTickState[1];

      // Debounced tag update via requestAnimationFrame
      var tagUpdatePending = useRef(false);
      var scheduledTagUpdate = function() {
        if (!tagUpdatePending.current) {
          tagUpdatePending.current = true;
          requestAnimationFrame(function() {
            scheduledTagUpdate();
            tagUpdatePending.current = false;
          });
        }
      };
      // Debounced trend tick via requestAnimationFrame
      var trendUpdatePending = useRef(false);
      var scheduledTrendUpdate = function() {
        if (!trendUpdatePending.current) {
          trendUpdatePending.current = true;
          requestAnimationFrame(function() {
            scheduledTrendUpdate();
            trendUpdatePending.current = false;
          });
        }
      };

      // Auto-dismiss toasts
      useEffect(function() {
        if (toasts.length === 0) return;
        var id = setTimeout(function() {
          setToasts(function(prev) { return prev.slice(1); });
        }, 4000);
        return function() { clearTimeout(id); };
      }, [toasts]);

      var addToast = function(message, type) {
        setToasts(function(prev) { return prev.concat([{ id: Date.now(), message: message, type: type || 'info' }]); });
      };

      // Handle WS messages
      useEffect(function() {
        if (!lastMessage) return;
        var msg = lastMessage;
        var type = msg.type;
        var data = msg.data || msg;

        if (type === 'deviceInfo' && msg.data) {
          setDeviceInfo(msg.data);
          return;
        }

        if (type === 'setPackage' && data) {
          currentPackage = data;
          setPackage(data);
          var pkgScreens = data.screens || [];
          setScreens(pkgScreens);
          if (pkgScreens.length > 0) {
            var defaultScreen = pkgScreens.find(function(s) { return s.isDefault || s.is_default; });
            setActiveScreen(defaultScreen ? defaultScreen.id : pkgScreens[0].id);
          }
          return;
        }

        // Backward compat: setProcess -> single process screen
        if (type === 'setProcess' && data) {
          currentPackage = { name: data.name || 'SCADA', screens: [{ id: 'process', name: data.name || 'Proses', screenType: 'process', isDefault: true, icon: 'schematic', layout: { cols: 1, rows: 1 }, widgets: [{ id: 'pv0', widgetType: 'processView', position: { col: 0, row: 0, w: 1, h: 1 }, config: { nodes: data.nodes, edges: data.edges } }] }] };
          setPackage(currentPackage);
          setScreens(currentPackage.screens);
          setActiveScreen('process');
          return;
        }

        if (type === 'sensorData' && data) {
          var _now = Date.now();
          if (data.equipmentData || data.equipment_data) {
            var eqData = data.equipmentData || data.equipment_data;
            Object.entries(eqData).forEach(function(entry) {
              var eqId = entry[0], readings = entry[1];
              if (Array.isArray(readings)) {
                readings.forEach(function(r) {
                  var rName = r.tagName || r.tag_name || r.tag || r.name;
                  if (rName) tagStore[rName] = Object.assign({}, r, { _lastSeen: _now });
                });
              } else if (typeof readings === 'object') {
                tagStore[eqId] = Object.assign({}, readings, { _lastSeen: _now });
              }
            });
          }
          scheduledTagUpdate();
          return;
        }

        if (type === 'allTags' && data) {
          var _nowTags = Date.now();
          var tagsArr = Array.isArray(data) ? data : (data.tags || []);
          tagsArr.forEach(function(t) {
            var name = t.tagName || t.tag_name || t.tag;
            if (name) {
              tagStore[name] = Object.assign(tagStore[name] || {}, t, { value: t.value, quality: t.quality, unit: t.unit || tagStore[name] && tagStore[name].unit, _lastSeen: _nowTags });
            }
          });
          scheduledTagUpdate();
          return;
        }

        if (type === 'alarm' && data) {
          activeAlarms = activeAlarms.concat([data]);
          setAlarms([].concat(activeAlarms));
          return;
        }

        if (type === 'alarmClear' && data) {
          var alarmId = data.alarmId || data.alarm_id;
          activeAlarms = activeAlarms.filter(function(a) { return (a.alarmId || a.alarm_id || a.id) !== alarmId; });
          setAlarms([].concat(activeAlarms));
          return;
        }

        if (type === 'commandResult' && data) {
          addToast(data.message || (data.success ? 'Komut basarili' : 'Komut basarisiz'), data.success ? 'success' : 'error');
          return;
        }

        if (type === 'confirmRequest' && data) {
          setShowConfirm({ text: data.text || data.message || 'Onayliyor musunuz?', onYes: function() { send({ type: 'confirmResponse', requestId: data.requestId, confirmed: true }); setShowConfirm(null); } });
          return;
        }

        if (type === 'pinRequest' && data) {
          setShowPin({ tag: data.tag, onSuccess: function(pin) { send({ type: 'pinResponse', requestId: data.requestId, pin: pin }); setShowPin(null); } });
          return;
        }

        if (type === 'calibrationState' && data) {
          setCalibState(function(prev) {
            if (!prev) return data;
            return Object.assign({}, prev, data);
          });
          return;
        }

        if (type === 'trendData') {
          var tTag = msg.tag;
          if (tTag && Array.isArray(data)) {
            trendDataStore[tTag] = data.length > TREND_MAX_POINTS ? data.slice(-TREND_MAX_POINTS) : data;
          } else if (tTag && data && Array.isArray(data.data)) {
            trendDataStore[tTag] = data.data.length > TREND_MAX_POINTS ? data.data.slice(-TREND_MAX_POINTS) : data.data;
          }
          scheduledTrendUpdate();
          return;
        }

        if (type === 'emergency') {
          emergencyActive = !!data.active;
          setEmergency(emergencyActive);
          if (emergencyActive) addToast('ACIL DURUM AKTIF!', 'error');
          return;
        }
      }, [lastMessage]);

      var onConfirm = function(opts) { setShowConfirm(opts); };
      var onPin = function(opts) { setShowPin(opts); };

      var handleConfirmYes = function() {
        if (showConfirm && showConfirm.onYes) showConfirm.onYes();
        setShowConfirm(null);
      };
      var handleConfirmNo = function() { setShowConfirm(null); };

      var handlePinSubmit = function(pin) {
        if (showPin && showPin.onSuccess) showPin.onSuccess(pin);
        setShowPin(null);
      };
      var handlePinCancel = function() { setShowPin(null); };

      // Compute active screen object
      var activeScreenObj = null;
      if (screens.length > 0 && activeScreen) {
        activeScreenObj = screens.find(function(s) { return s.id === activeScreen; }) || null;
      }

      var hasPackage = !!package_;
      var showWaiting = !hasPackage && status !== 'connected' || (!hasPackage && Object.keys(tagStore).length === 0);

      var statusLabel = status === 'connected' ? 'Bagli' : status === 'connecting' ? 'Baglaniyor...' : status === 'failed' ? 'Basarisiz' : 'Bagli Degil';
      var tagCount = Object.keys(tagStore).length;

      return h('div', { className: 'scada-container' }, [
        // Header
        h('div', { key: 'header', className: 'scada-header' }, [
          h('div', { key: 'left', className: 'scada-header-left' }, [
            h('div', { key: 'title', className: 'scada-header-title' }, (package_ && package_.name) ? package_.name : 'Suderra SCADA'),
            hasPackage && screens.length > 1 && h(TabBar, { key: 'tabs', screens: screens, activeScreen: activeScreen, onSelect: setActiveScreen, alarmCount: activeAlarms.length }),
          ]),
          h('div', { key: 'right', className: 'scada-header-right' }, [
            activeAlarms.length > 0
              ? h('div', { key: 'alarm', className: 'alarm-badge has-alarms' }, '\uD83D\uDD34 ' + activeAlarms.length + ' alarm')
              : h('div', { key: 'alarm', className: 'alarm-badge no-alarms' }, '\u2713'),
            h('span', { key: 'dot', className: 'status-dot ' + status }),
            h('span', { key: 'label', style: { color: status === 'connected' ? '#86efac' : '#94a3b8' } }, statusLabel),
            h(Clock, { key: 'clock' }),
          ]),
        ]),

        // Body
        showWaiting
          ? h(WaitingScreen, { key: 'waiting', status: status, deviceInfo: deviceInfo, reconnect: reconnect })
          : h('div', { key: 'body', className: 'scada-body' },
              hasPackage && activeScreenObj
                ? h(ScreenRenderer, { screen: activeScreenObj, send: send, onConfirm: onConfirm, onPin: onPin, calibState: calibState, setCalibState: setCalibState, tick: trendTick })
                : h(TagDashboard, { tagStore: tagStore })
            ),

        // Status footer
        !showWaiting && h('div', { key: 'footer', className: 'status-footer' }, [
          h('div', { key: 'left', className: 'status-footer-left' }, [
            activeAlarms.length > 0
              ? h('span', { key: 'alarm', style: { color: '#fca5a5' } }, '\u26A0 ' + activeAlarms.length + ' aktif alarm')
              : h('span', { key: 'alarm', style: { color: '#22c55e' } }, '\u2713 Alarm yok'),
            h('span', { key: 'sep', style: { color: '#334155' } }, '|'),
            h('span', { key: 'tags' }, tagCount + ' tag'),
          ]),
          h('div', { key: 'right', className: 'status-footer-right' }, [
            h('span', { key: 'dot', className: 'status-dot ' + status }),
            h('span', { key: 'status' }, statusLabel),
            h(Clock, { key: 'clock' }),
          ]),
        ]),

        // Overlays
        showConfirm && h(ConfirmDialog, { key: 'confirm', text: showConfirm.text, onYes: handleConfirmYes, onNo: handleConfirmNo }),
        showPin && h(PinDialog, { key: 'pin', onSubmit: handlePinSubmit, onCancel: handlePinCancel, error: showPin.error }),
        h(ToastContainer, { key: 'toasts', toasts: toasts }),
      ]);
    }

    // Render
    var root = createRoot(document.getElementById('root'));
    root.render(h(ReactFlowProvider, null, h(ScadaEdgeApp)));

    // Register PWA service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function(err) {
        console.warn('[scada-edge] Service Worker registration failed:', err);
      });
    }
  </script>
</body>
</html>
