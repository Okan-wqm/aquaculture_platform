# =============================================================================
# Ingress
# =============================================================================

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Rate limiting — protects backend services in addition to application-level limits
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # Security response headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "X-XSS-Protection: 1; mode=block";
  hosts:
    - host: app.aquaculture.io
      paths:
        - path: /
          pathType: Prefix
          service: shell
    - host: api.aquaculture.io
      paths:
        - path: /
          pathType: Prefix
          service: gateway-api
  tls:
    - secretName: aquaculture-tls
      hosts:
        - app.aquaculture.io
        - api.aquaculture.io

# =============================================================================
# Security
# =============================================================================

serviceAccount:
  create: true
  name: aquaculture-sa
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

networkPolicy:
  enabled: true

# =============================================================================
# Secrets
# =============================================================================
# All credential fields are REQUIRED and have no default.
# Supply them via --set, a sealed-secrets overlay, or externalSecrets.

secrets:
  # REQUIRED: full PostgreSQL connection URL
  # e.g. postgres://aquaculture:<password>@postgresql:5432/aquaculture
  databaseUrl: ""
  # REQUIRED: full Redis connection URL
  # e.g. redis://:<password>@redis-master:6379
  redisUrl: ""
  # REQUIRED: pre-generated JWT signing secret (min 64 chars, generated externally)
  jwtSecret: ""
  # REQUIRED: NATS connection URL including credentials token
  # e.g. nats://<token>@nats:4222
  natsUrl: ""

# External secrets (e.g., from AWS Secrets Manager, Vault)
externalSecrets:
  enabled: false
  secretStore:
    name: ""
    kind: ClusterSecretStore
  # Path prefix for remote secret store keys.
  # Set per environment: "aquaculture/production" or "aquaculture/staging"
  pathPrefix: "aquaculture/production"
  # Refresh interval — lower during incident credential rotation (e.g., "5m")
  refreshInterval: "1h"

# =============================================================================
# Infrastructure Dependencies
# =============================================================================

postgresql:
  enabled: true
  auth:
    username: aquaculture
    # REQUIRED — set via --set postgresql.auth.password=<value>
    # An empty string disables PostgreSQL authentication. Never ship empty.
    password: ""
    database: aquaculture
  primary:
    persistence:
      size: 20Gi

redis:
  enabled: true
  auth:
    # REQUIRED — set via --set redis.auth.password=<value>
    # An empty string disables Redis authentication. Never ship empty.
    password: ""
  master:
    persistence:
      size: 5Gi

nats:
  enabled: true
  config:
    # Enable token-based authentication for NATS
    authorization:
      timeout: 5
    jetstream:
      enabled: true
      memStorage:
        size: 1Gi
      fileStorage:
        enabled: true
        size: 5Gi

# =============================================================================
# Monitoring
# =============================================================================

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s

# =============================================================================
# Probes
# =============================================================================

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
