# =============================================================================
# CD - Staging (DISABLED - no K8s staging cluster provisioned yet)
#
# Re-enable when deploy/staging/ manifests and KUBE_CONFIG_STAGING are ready.
# =============================================================================

name: CD - Staging (Disabled)

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  IMAGE_TAG: staging-${{ github.sha }}

jobs:
  # ===========================================================================
  # Build & Test with Nx
  # ===========================================================================
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      # ARCH-CI-006: Removed github.sha from NX cache key
      - name: Cache Nx
        # SEC-CI-002: pinned to SHA
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          key: nx-staging-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            nx-staging-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit

      - name: Lint & Test
        run: npx nx affected -t lint test --parallel=3
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

      - name: Build all
        run: npx nx run-many -t build --all --parallel=4
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

      - name: Upload build artifacts
        # SEC-CI-002: pinned to SHA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Check if deploy needed
        id: check
        run: echo "should_deploy=true" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Build Backend Docker Images (Parallel)
  # ===========================================================================
  build-backend:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service:
          - gateway-api
          - auth-service
          - farm-service
          - sensor-service
          - alert-engine
          - billing-service
          - hr-service
          - notification-service
          - admin-api-service
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download build artifacts
        # SEC-CI-002: pinned to SHA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      # SEC-CI-002: pinned to SHA
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # SEC-CI-002: pinned to SHA
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        # SEC-CI-002: pinned to SHA
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile.backend.simple
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:staging
          build-args: SERVICE_NAME=${{ matrix.service }}
          # ARCH-CI-002: Namespaced buildcache tag to avoid collision with deploy-digitalocean.yml
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:buildcache-staging
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:buildcache-staging,mode=max

  # ===========================================================================
  # Build Frontend Docker Images (Parallel)
  # ===========================================================================
  build-frontend:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - module: shell
            dockerfile: infrastructure/docker/Dockerfile.shell
            module_path: web/shell
          - module: dashboard
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/dashboard
          - module: farm-module
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/farm-module
          - module: hr-module
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/hr-module
          - module: sensor-module
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/sensor-module
          - module: admin-panel
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/admin-panel
          - module: tenant-admin
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/tenant-admin
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download build artifacts
        # SEC-CI-002: pinned to SHA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      # SEC-CI-002: pinned to SHA
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # SEC-CI-002: pinned to SHA
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.module }}
        # SEC-CI-002: pinned to SHA
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:staging
          build-args: MODULE_PATH=${{ matrix.module_path }}
          # ARCH-CI-002: Namespaced buildcache tag to avoid collision with deploy-digitalocean.yml
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:buildcache-staging
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:buildcache-staging,mode=max

  # ===========================================================================
  # Deploy to Staging
  # ===========================================================================
  deploy-staging:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup kubectl
        # SEC-CI-002: pinned to SHA (was @v3)
        uses: azure/setup-kubectl@776a8e6b4aef30da69c3b5e05a40e4edca87e552 # v4.0.1
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          # SEC-CI-010: Write kubeconfig to file; will be cleaned up in cleanup step below
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig

      # ARCH-CI-008: Preflight check - fail fast if K8s manifests directory doesn't exist
      - name: Check staging manifests directory
        run: |
          if [ ! -d deploy/staging ]; then
            echo "::error::Staging manifests directory 'deploy/staging/' not found."
            echo "::error::Provision the staging K8s manifests before enabling this deploy job."
            exit 1
          fi

      - name: Deploy to staging
        run: |
          export KUBECONFIG=$PWD/kubeconfig

          # Update image tags in deployment manifests
          for service in gateway-api auth-service farm-service sensor-service alert-engine billing-service hr-service notification-service admin-api-service; do
            if [ -f "deploy/staging/${service}-deployment.yaml" ]; then
              sed -i "s|${{ env.IMAGE_PREFIX }}/${service}:.*|${{ env.IMAGE_PREFIX }}/${service}:${{ env.IMAGE_TAG }}|g" deploy/staging/${service}-deployment.yaml
            fi
          done

          # Apply Kubernetes manifests
          kubectl apply -f deploy/staging/ --recursive

          # Wait for rollouts (|| true retained for staging only - non-critical environment)
          kubectl rollout status deployment -n aquaculture-staging --timeout=5m || true

      # SEC-CI-010: Always clean up kubeconfig file from disk
      - name: Cleanup kubeconfig
        if: always()
        run: rm -f kubeconfig

  # ===========================================================================
  # Smoke Tests
  # ===========================================================================
  smoke-tests:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Wait for deployment
        run: sleep 30

      - name: Run smoke tests
        run: |
          # Health check
          curl -sf https://staging.aquaculture-platform.example.com/health || echo "Health check endpoint not available"

      - name: Notify on failure
        if: failure()
        # SEC-CI-002: pinned to SHA (was @v3)
        uses: 8398a7/action-slack@047b09b154480ed39076984b64f324fff010d703 # v3.9.3
        with:
          status: failure
          channel: '#ci-cd'
          text: 'Staging deployment smoke tests failed!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
