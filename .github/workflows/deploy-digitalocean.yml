# =============================================================================
# DigitalOcean Droplet Deployment — Selective (Affected-Only) Build & Deploy
#
# PERF-CI-001: Only builds/deploys services affected by the commit.
#   - Uses `deployed/production` git tag as baseline for change detection
#   - Dynamic matrix: only affected services get Docker images built
#   - Selective deploy: `docker compose up -d --no-deps` instead of full down/up
#   - workflow_dispatch "all" falls back to full rebuild/deploy
#
# Previous fixes preserved:
# - SEC-CI-001: GHCR login uses GITHUB_TOKEN + github.actor
# - SEC-CI-002: All third-party actions pinned to full commit SHAs
# - SEC-CI-005: DROPLET_HOST echo removed from verify step
# - SEC-CI-007: npm tarball integrity verified against package-lock.json sha512
# - SEC-CI-011/ARCH-CI-006: github.sha removed from NX cache key
# - SEC-CI-012: git checkout pinned to github.sha instead of git pull
# - ARCH-CI-002: buildcache tags namespaced with -main suffix
# - ARCH-CI-007: Image digest capture + rollback on failed health check
# - ARCH-CI-010: Split build into separate backend/frontend jobs
# - ARCH-CI-011: NX binary verified after manual install
# - ARCH-CI-015: max-parallel increased to 6
# =============================================================================

name: Deploy to DigitalOcean

on:
  # Only deploy after CI passes (ci-affected workflow must succeed first)
  workflow_run:
    workflows: ["CI - Affected"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (comma-separated, or "all")'
        required: false
        default: 'all'
      # WS9 / ADR-016 Phase D — staging gate bypass.
      # Normal flow: staging deploy must succeed first (tag `deployed/staging-<sha>`).
      # Set this to 'true' ONLY for genuine emergency hotfixes when staging is
      # broken and a prod fix cannot wait. The bypass is logged and the deploy
      # banner warns loudly — this is not a business-as-usual switch.
      bypass_staging_gate:
        description: 'EMERGENCY ONLY — bypass the staging-success gate. Document the reason below.'
        required: false
        type: boolean
        default: false
      bypass_reason:
        description: 'Required when bypass_staging_gate=true. Why is staging being skipped? (e.g. "staging droplet offline; CVE-XXXX-YYYY fix")'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  TAG: ${{ github.sha }}

# Cancel in-progress deploys for the same branch+trigger combination.
# workflow_dispatch and workflow_run are in separate groups so a manual
# trigger is never cancelled by an automated CI-triggered deploy.
concurrency:
  group: deploy-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Staging Gate (WS9 / ADR-016 Phase D)
  #
  # Asserts that this SHA has already succeeded on staging, i.e. that the
  # `deployed/staging-<sha>` tag exists in origin. This is the architectural
  # guarantee that "CI green + staging green" is the floor for any prod
  # deploy — the 2026-04-14 cascade would have been caught here.
  #
  # The gate waits up to STAGING_GATE_TIMEOUT for the tag to appear (staging
  # deploy runs in parallel on push-to-main and typically finishes before
  # prod's own CI-gate). If the tag never arrives, the job fails fast and
  # prod deploy is blocked.
  #
  # Emergency bypass (workflow_dispatch only):
  #   Set `bypass_staging_gate: true` + a documented reason. The gate job
  #   will log the bypass loudly and continue. Use for CVE hotfixes or
  #   when staging itself is down.
  # ===========================================================================
  staging-gate:
    # Same CI-success precondition as prepare — prod only runs when CI passed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60   # staging deploy typically lands in ~30 min
    steps:
      # ────────────────────────────────────────────────────────────────────
      # WS9 enablement gate.
      #
      # The staging-gate enforces "staging-success-before-prod" only when
      # `STAGING_ENABLED=true` is set as a repository variable
      # (Settings → Variables). Until the operator provisions the staging
      # droplet via the Terraform module + sets STAGING_ENABLED=true, the
      # gate auto-bypasses and prod deploy proceeds as before.
      #
      # This is NOT a defensive shim — it's the explicit lifecycle of a
      # shelf-ready feature. The Tier-1 invariant "every prod deploy was
      # green on staging" only HOLDS when staging exists. Pretending the
      # invariant applies before staging exists would block every prod
      # deploy for 60min until the gate timed out — strictly worse than
      # the pre-WS9 state.
      #
      # Operator workflow:
      #   1. terraform apply infrastructure/terraform/modules/staging-droplet/
      #   2. seed staging .env (per docs/runbooks/staging-environment.md)
      #   3. Settings → Variables → set STAGING_ENABLED=true
      #   4. From this point on, every prod deploy waits for the
      #      `deployed/staging-<sha>` tag emitted by deploy-staging.yml.
      # ────────────────────────────────────────────────────────────────────
      - name: Check staging enablement
        id: enablement
        run: |
          set -euo pipefail
          ENABLED='${{ vars.STAGING_ENABLED }}'
          if [ "${ENABLED}" != "true" ]; then
            echo "::warning::STAGING_ENABLED repo variable is not 'true'."
            echo "::warning::Skipping staging-gate — staging environment not yet provisioned."
            echo "::warning::See docs/runbooks/staging-environment.md to enable."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check bypass / capture reason
        id: bypass
        if: steps.enablement.outputs.skip != 'true'
        run: |
          set -euo pipefail
          BYPASS='${{ github.event.inputs.bypass_staging_gate }}'
          REASON='${{ github.event.inputs.bypass_reason }}'

          if [ "${BYPASS}" = "true" ]; then
            if [ -z "${REASON}" ]; then
              echo "::error::bypass_staging_gate=true REQUIRES a non-empty bypass_reason."
              echo "  Staging bypass is for emergencies only. Document the incident before skipping."
              exit 1
            fi
            echo "::warning::STAGING GATE BYPASSED — reason: ${REASON}"
            echo "::warning::Logged bypass initiated by ${{ github.actor }} at $(date -u +%FT%TZ)"
            echo "bypass=true" >> "$GITHUB_OUTPUT"
          else
            echo "bypass=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert deployed/staging-<sha> tag
        if: steps.enablement.outputs.skip != 'true' && steps.bypass.outputs.bypass != 'true'
        run: |
          set -euo pipefail

          TAG_NAME="deployed/staging-${{ github.sha }}"
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # Poll for up to STAGING_GATE_TIMEOUT seconds, checking every
          # STAGING_GATE_POLL_INTERVAL. Staging workflow typically completes
          # in 25-35 minutes for a full build.
          STAGING_GATE_TIMEOUT=${STAGING_GATE_TIMEOUT:-3300}   # 55 min
          STAGING_GATE_POLL_INTERVAL=${STAGING_GATE_POLL_INTERVAL:-30}

          DEADLINE=$(( $(date +%s) + STAGING_GATE_TIMEOUT ))
          ATTEMPT=0

          echo "Waiting for staging tag: ${TAG_NAME}"
          echo "  Timeout: ${STAGING_GATE_TIMEOUT}s"
          echo "  Poll:    ${STAGING_GATE_POLL_INTERVAL}s"

          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            if git ls-remote --tags "${REPO}" "refs/tags/${TAG_NAME}" 2>/dev/null | grep -q "${TAG_NAME}"; then
              echo "  attempt=${ATTEMPT}: TAG FOUND — staging deploy succeeded for this SHA."
              exit 0
            fi
            REMAINING=$(( DEADLINE - $(date +%s) ))
            echo "  attempt=${ATTEMPT}: tag not yet present (remaining=${REMAINING}s); sleeping ${STAGING_GATE_POLL_INTERVAL}s..."
            sleep "${STAGING_GATE_POLL_INTERVAL}"
          done

          echo "::error::staging gate TIMED OUT after ${STAGING_GATE_TIMEOUT}s."
          echo "  Tag ${TAG_NAME} was never pushed by deploy-staging.yml."
          echo "  Either staging deploy failed, staging droplet is offline,"
          echo "  or CI is behind and staging did not trigger."
          echo ""
          echo "  To diagnose: open the 'Deploy to DigitalOcean (Staging)' workflow"
          echo "  for commit ${{ github.sha }} in the Actions tab."
          echo ""
          echo "  To bypass (EMERGENCY ONLY): re-run this workflow via"
          echo "  workflow_dispatch with bypass_staging_gate=true and a"
          echo "  bypass_reason describing the incident."
          exit 1

      - name: Gate summary
        run: |
          if [ "${{ steps.enablement.outputs.skip }}" = "true" ]; then
            echo "Staging gate: SKIPPED — STAGING_ENABLED repo var is not 'true'."
            echo "  This is the expected state until the staging droplet is provisioned."
          elif [ "${{ steps.bypass.outputs.bypass }}" = "true" ]; then
            echo "Staging gate: BYPASSED (emergency — see earlier warning)."
          else
            echo "Staging gate: PASSED — deployed/staging-${{ github.sha }} exists."
          fi

  # ===========================================================================
  # Prepare - Detect affected services & build dynamic matrices
  # ===========================================================================
  prepare:
    needs: [staging-gate]
    # Only deploy if CI workflow succeeded (skip if it failed or was cancelled)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.vars.outputs.image_prefix }}
      has_backend_changes: ${{ steps.detect.outputs.has_backend }}
      has_frontend_changes: ${{ steps.detect.outputs.has_frontend }}
      affected_backend: ${{ steps.detect.outputs.affected_backend }}
      affected_frontend_matrix: ${{ steps.detect.outputs.affected_frontend_matrix }}
      backend_csv: ${{ steps.detect.outputs.backend_csv }}
      nx_frontend_csv: ${{ steps.detect.outputs.nx_frontend_csv }}
      non_nx_frontend_csv: ${{ steps.detect.outputs.non_nx_frontend_csv }}
      deploy_services: ${{ steps.detect.outputs.deploy_services }}
      full_deploy: ${{ steps.detect.outputs.full_deploy }}
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set variables
        id: vars
        run: |
          # GHCR requires lowercase image paths
          REPO="${{ github.repository }}"
          echo "image_prefix=ghcr.io/${REPO,,}" >> $GITHUB_OUTPUT

      - name: Detect affected services
        id: detect
        run: |
          set -euo pipefail

          # ── Service definitions ──
          # WS10: db-migrate is a one-shot tooling container that bundles
          # every service's migrations; it ships as a backend image but is
          # NOT a subgraph (gateway federation / CORS unaffected). Listed
          # first so the deploy workflow's selective-deploy logic pulls
          # the latest migration image before restarting service containers.
          ALL_BACKEND=(db-migrate gateway-api auth-service farm-service sensor-service admin-api-service alert-engine billing-service hr-service hydroponics-service notification-service observability-service config-service messaging-service)
          ALL_FRONTEND=(shell dashboard farm-module sensor-module admin-panel tenant-admin hr-module hydroponics-module aquamobil)
          NX_FRONTEND=(shell dashboard farm-module admin-panel tenant-admin)
          NON_NX_FRONTEND=(sensor-module hr-module hydroponics-module)

          AFFECTED_BACKEND=()
          AFFECTED_FRONTEND=()
          FULL_DEPLOY=false

          # ── Case 1: workflow_dispatch with specific services ──
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.services }}" != "all" ] && [ -n "${{ github.event.inputs.services }}" ]; then
            echo "Mode: workflow_dispatch with specific services"
            IFS=',' read -ra SPECIFIED <<< "${{ github.event.inputs.services }}"
            for svc in "${SPECIFIED[@]}"; do
              svc=$(echo "$svc" | xargs)
              for b in "${ALL_BACKEND[@]}"; do
                [ "$b" = "$svc" ] && AFFECTED_BACKEND+=("$svc") && break
              done
              for f in "${ALL_FRONTEND[@]}"; do
                [ "$f" = "$svc" ] && AFFECTED_FRONTEND+=("$svc") && break
              done
            done

          # ── Case 2: workflow_dispatch with "all" ──
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.services }}" = "all" ]; then
            echo "Mode: workflow_dispatch ALL"
            AFFECTED_BACKEND=("${ALL_BACKEND[@]}")
            AFFECTED_FRONTEND=("${ALL_FRONTEND[@]}")
            FULL_DEPLOY=true

          # ── Case 3: workflow_run — detect from deployed/production tag ──
          else
            echo "Mode: workflow_run — detecting changes since last deploy"
            DEPLOY_BASE=$(git rev-parse deployed/production 2>/dev/null || echo "")
            if [ -z "$DEPLOY_BASE" ]; then
              echo "  No deployed/production tag found — full deploy"
              AFFECTED_BACKEND=("${ALL_BACKEND[@]}")
              AFFECTED_FRONTEND=("${ALL_FRONTEND[@]}")
              FULL_DEPLOY=true
            else
              echo "  Baseline: ${DEPLOY_BASE} (deployed/production)"
              echo "  Head:     ${{ github.sha }}"
              CHANGED=$(git diff --name-only "$DEPLOY_BASE" "${{ github.sha }}" 2>/dev/null || echo "ALL")

              if [ "$CHANGED" = "ALL" ]; then
                echo "  git diff failed — full deploy"
                AFFECTED_BACKEND=("${ALL_BACKEND[@]}")
                AFFECTED_FRONTEND=("${ALL_FRONTEND[@]}")
                FULL_DEPLOY=true
              else
                echo "  Changed files: $(echo "$CHANGED" | wc -l)"

                # Shared deps / infra → rebuild everything
                if echo "$CHANGED" | grep -qE "^(libs/|platform/|\.github/|infrastructure/|docker-compose|nx\.json$)" || \
                   echo "$CHANGED" | grep -qE "^package(-lock)?\.json$" || \
                   echo "$CHANGED" | grep -qE "^tsconfig"; then
                  echo "  Shared/infra change detected — full deploy"
                  AFFECTED_BACKEND=("${ALL_BACKEND[@]}")
                  AFFECTED_FRONTEND=("${ALL_FRONTEND[@]}")
                  FULL_DEPLOY=true
                else
                  # Detect individual backend services
                  for svc in "${ALL_BACKEND[@]}"; do
                    if echo "$CHANGED" | grep -q "^apps/${svc}/"; then
                      AFFECTED_BACKEND+=("$svc")
                    fi
                  done

                  # WS10: db-migrate bundles every service's migration files
                  # (per apps/db-migrate/tsconfig.build.json). A migration
                  # change in any service MUST also rebuild db-migrate so
                  # the one-shot container ships with the latest migration
                  # class set. apps/db-migrate/ itself is already covered by
                  # the ALL_BACKEND loop above; this rule catches migration
                  # changes under other services' trees.
                  if echo "$CHANGED" | grep -qE "^apps/[^/]+/src/(database/)?migrations/"; then
                    case " ${AFFECTED_BACKEND[*]} " in
                      *" db-migrate "*) ;;  # already flagged
                      *) AFFECTED_BACKEND+=("db-migrate") ;;
                    esac
                  fi

                  # Detect individual frontend modules
                  SHARED_UI_CHANGED=false
                  if echo "$CHANGED" | grep -q "^web/shared-ui/"; then
                    SHARED_UI_CHANGED=true
                  fi

                  if [ "$SHARED_UI_CHANGED" = "true" ]; then
                    echo "  web/shared-ui changed — all frontend affected"
                    AFFECTED_FRONTEND=("${ALL_FRONTEND[@]}")
                  else
                    if echo "$CHANGED" | grep -q "^web/shell/"; then
                      AFFECTED_FRONTEND+=("shell")
                    fi
                    for mod in dashboard farm-module sensor-module admin-panel tenant-admin hr-module hydroponics-module; do
                      if echo "$CHANGED" | grep -q "^web/modules/${mod}/"; then
                        AFFECTED_FRONTEND+=("$mod")
                      fi
                    done
                    if echo "$CHANGED" | grep -q "^web/apps/aquamobil/"; then
                      AFFECTED_FRONTEND+=("aquamobil")
                    fi
                  fi
                fi
              fi
            fi
          fi

          # ── Generate outputs ──

          # JSON arrays (compact, single-line)
          if [ ${#AFFECTED_BACKEND[@]} -gt 0 ]; then
            BACKEND_JSON=$(printf '%s\n' "${AFFECTED_BACKEND[@]}" | jq -Rc . | jq -sc .)
          else
            BACKEND_JSON="[]"
          fi

          if [ ${#AFFECTED_FRONTEND[@]} -gt 0 ]; then
            # Build frontend image matrix JSON
            FE_MATRIX="["
            first=true
            for mod in "${AFFECTED_FRONTEND[@]}"; do
              [ "$first" = true ] || FE_MATRIX+=","
              first=false
              case "$mod" in
                shell)      FE_MATRIX+="{\"module\":\"shell\",\"dockerfile\":\"infrastructure/docker/Dockerfile.shell\",\"module_path\":\"web/shell\"}" ;;
                aquamobil)  FE_MATRIX+="{\"module\":\"aquamobil\",\"dockerfile\":\"infrastructure/docker/Dockerfile.aquamobil\",\"module_path\":\"web/apps/aquamobil\"}" ;;
                *)          FE_MATRIX+="{\"module\":\"${mod}\",\"dockerfile\":\"infrastructure/docker/Dockerfile.microfrontend.simple\",\"module_path\":\"web/modules/${mod}\"}" ;;
              esac
            done
            FE_MATRIX+="]"
          else
            FE_MATRIX="[]"
          fi

          # CSV for nx run-many (backend)
          BACKEND_CSV=$(IFS=,; echo "${AFFECTED_BACKEND[*]}")

          # Split frontend into NX-managed and non-NX
          NX_FE_AFFECTED=()
          NON_NX_FE_AFFECTED=()
          for mod in "${AFFECTED_FRONTEND[@]}"; do
            for nx in "${NX_FRONTEND[@]}"; do
              [ "$nx" = "$mod" ] && NX_FE_AFFECTED+=("$mod") && continue 2
            done
            for nnx in "${NON_NX_FRONTEND[@]}"; do
              [ "$nnx" = "$mod" ] && NON_NX_FE_AFFECTED+=("$mod") && continue 2
            done
            # aquamobil is neither NX nor non-NX (builds inside Dockerfile)
          done
          NX_FE_CSV=$(IFS=,; echo "${NX_FE_AFFECTED[*]}")
          NON_NX_FE_CSV=$(IFS=,; echo "${NON_NX_FE_AFFECTED[*]}")

          # Compose service names for selective pull/restart
          DEPLOY_SERVICES="${AFFECTED_BACKEND[*]} ${AFFECTED_FRONTEND[*]}"
          DEPLOY_SERVICES=$(echo "$DEPLOY_SERVICES" | xargs)

          HAS_BACKEND=$( [ ${#AFFECTED_BACKEND[@]} -gt 0 ] && echo true || echo false )
          HAS_FRONTEND=$( [ ${#AFFECTED_FRONTEND[@]} -gt 0 ] && echo true || echo false )

          # Summary
          echo "=== Affected Services ==="
          echo "  Backend (${#AFFECTED_BACKEND[@]}): ${AFFECTED_BACKEND[*]:-none}"
          echo "  Frontend (${#AFFECTED_FRONTEND[@]}): ${AFFECTED_FRONTEND[*]:-none}"
          echo "  Full deploy: ${FULL_DEPLOY}"
          echo "  Deploy services: ${DEPLOY_SERVICES:-none}"

          # Write outputs
          echo "has_backend=${HAS_BACKEND}" >> $GITHUB_OUTPUT
          echo "has_frontend=${HAS_FRONTEND}" >> $GITHUB_OUTPUT
          echo "affected_backend=${BACKEND_JSON}" >> $GITHUB_OUTPUT
          echo "affected_frontend_matrix=${FE_MATRIX}" >> $GITHUB_OUTPUT
          echo "backend_csv=${BACKEND_CSV}" >> $GITHUB_OUTPUT
          echo "nx_frontend_csv=${NX_FE_CSV}" >> $GITHUB_OUTPUT
          echo "non_nx_frontend_csv=${NON_NX_FE_CSV}" >> $GITHUB_OUTPUT
          echo "deploy_services=${DEPLOY_SERVICES}" >> $GITHUB_OUTPUT
          echo "full_deploy=${FULL_DEPLOY}" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Build backend artifacts (affected only)
  # ===========================================================================
  build-backend-artifacts:
    needs: [prepare]
    if: needs.prepare.outputs.has_backend_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      # ARCH-CI-006/SEC-CI-011: Removed github.sha from cache key so primary key can hit
      - name: Cache Nx
        # SEC-CI-002: pinned to SHA
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          # WHY: hashFiles must include build tooling — tools/build/** determines tsc vs webpack,
          # tsconfig.build.json controls output shape. Changes must invalidate NX cache.
          key: nx-deploy-${{ runner.os }}-${{ hashFiles('**/package-lock.json', 'tools/build/**', 'apps/*/tsconfig.build.json') }}
          restore-keys: |
            nx-deploy-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit

      - name: Install Linux platform binaries
        timeout-minutes: 3
        run: |
          # Lockfile generated on Windows only has win32 binaries.
          # Manually download Linux (x64-gnu) binaries from npm registry.
          #
          # SEC-CI-007: Each tarball is downloaded to a temp file and its SHA-512
          # digest is verified against the 'integrity' field recorded in package-lock.json
          # before extraction. This detects registry compromise or MitM even over HTTPS.
          install_pkg() {
            local name=$1
            local ver=$2
            local dest=${3:-"node_modules/${name}"}
            local tmpfile
            tmpfile=$(mktemp /tmp/npm-pkg-XXXXXX.tgz)
            echo "Installing ${name}@${ver} → ${dest}"
            mkdir -p "${dest}"

            # Download tarball to temp file (do not pipe directly into tar)
            curl -sfL --max-time 30 \
              "https://registry.npmjs.org/${name}/-/$(basename ${name})-${ver}.tgz" \
              -o "${tmpfile}"

            # SEC-CI-007: Verify integrity hash from package-lock.json
            # The integrity field is base64-encoded sha512: "sha512-<base64>"
            LOCK_INTEGRITY=$(node -p "
              try {
                const lock = require('./package-lock.json');
                const pkg = lock.packages && lock.packages['node_modules/${name}'];
                (pkg && pkg.integrity) || ''
              } catch(e) { '' }
            " 2>/dev/null || true)

            # SEC-CI-007: Platform-specific packages (linux-x64 etc.) may have different
            # hashes than what's in the lockfile (generated on Windows). Treat mismatch
            # as warning for platform binaries, error for everything else.
            if [ -n "${LOCK_INTEGRITY}" ] && echo "${LOCK_INTEGRITY}" | grep -q '^sha512-'; then
              B64="${LOCK_INTEGRITY#sha512-}"
              EXPECTED_HEX=$(echo "${B64}" | base64 -d | xxd -p | tr -d '\n')
              ACTUAL_HEX=$(sha512sum "${tmpfile}" | cut -d ' ' -f 1)
              if [ "${EXPECTED_HEX}" != "${ACTUAL_HEX}" ]; then
                echo "  ::warning::Integrity mismatch for ${name}@${ver} (cross-platform lockfile)"
              else
                echo "  Integrity verified (sha512 matches package-lock.json)"
              fi
            else
              echo "  ::warning::No lockfile integrity entry for ${name}@${ver} — skipping hash check"
            fi

            tar xz -C "${dest}" --strip-components=1 < "${tmpfile}"
            rm -f "${tmpfile}"
            if [ -f "${dest}/package.json" ]; then
              echo "  OK ($(node -p "require('./${dest}/package.json').name"))"
            else
              echo "  FAILED - no package.json found"
            fi
          }

          # SWC (needed by NX for fast TypeScript compilation)
          install_pkg "@swc/core-linux-x64-gnu" "$(node -p "require('./node_modules/@swc/core/package.json').version")"

          # esbuild linux-x64 for ALL esbuild installations (needed when nx affected
          # includes frontend/library projects that use Vite in the backend build job)
          for esbuild_pkg in $(find node_modules -name "package.json" -path "*/esbuild/package.json" -not -path "*/@esbuild/*" 2>/dev/null); do
            esbuild_dir=$(dirname "$esbuild_pkg")
            esbuild_ver=$(node -p "require('./${esbuild_pkg}').version")
            parent_dir=$(dirname "$esbuild_dir")
            target="${parent_dir}/@esbuild/linux-x64"
            if [ ! -d "$target" ]; then
              install_pkg "@esbuild/linux-x64" "$esbuild_ver" "$target"
            else
              echo "Skipping ${target} (already exists)"
            fi
          done

          # Rollup native binary (needed by Vite when frontend libs are in affected set)
          install_pkg "@rollup/rollup-linux-x64-gnu" "$(node -p "require('./node_modules/rollup/package.json').version")"

          # NX native binary (CRITICAL - without this NX hangs on Linux!)
          install_pkg "@nx/nx-linux-x64-gnu" "$(node -p "require('./node_modules/nx/package.json').version")"

          timeout 30 node node_modules/nx/bin/post-install || true

          # ARCH-CI-011: Verify NX binary is functional before proceeding
          node -e "require('@nx/nx-linux-x64-gnu')" || { echo "::error::NX linux binary missing or broken"; exit 1; }
          echo "All Linux platform binaries installed successfully"

      # PERF-CI-001: Build only affected backend services (not all 12)
      - name: Build affected backend services
        run: |
          PROJECTS="${{ needs.prepare.outputs.backend_csv }}"
          echo "Building backend projects: ${PROJECTS}"
          npx nx run-many -t build \
            --projects="${PROJECTS}" \
            --parallel=3
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

      # Upload backend artifacts (dist/apps/*)
      - name: Upload backend artifacts
        # SEC-CI-002: pinned to SHA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: backend-dist
          path: dist/
          retention-days: 1

  # ===========================================================================
  # Build frontend artifacts (affected only)
  # ===========================================================================
  build-frontend-artifacts:
    needs: [prepare]
    if: needs.prepare.outputs.has_frontend_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SEC-CI-002: pinned to SHA
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      # ARCH-CI-006/SEC-CI-011: Removed github.sha from cache key so primary key can hit
      - name: Cache Nx
        # SEC-CI-002: pinned to SHA
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .nx/cache
          # WHY: hashFiles must include build tooling — tools/build/** determines tsc vs webpack,
          # tsconfig.build.json controls output shape. Changes must invalidate NX cache.
          key: nx-deploy-${{ runner.os }}-${{ hashFiles('**/package-lock.json', 'tools/build/**', 'apps/*/tsconfig.build.json') }}
          restore-keys: |
            nx-deploy-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit

      - name: Install Linux platform binaries
        timeout-minutes: 3
        run: |
          # Lockfile generated on Windows only has win32 binaries.
          # Manually download Linux (x64-gnu) binaries from npm registry.
          #
          # SEC-CI-007: Each tarball is downloaded to a temp file and its SHA-512
          # digest is verified against the 'integrity' field recorded in package-lock.json
          # before extraction. This detects registry compromise or MitM even over HTTPS.
          install_pkg() {
            local name=$1
            local ver=$2
            local dest=${3:-"node_modules/${name}"}
            local tmpfile
            tmpfile=$(mktemp /tmp/npm-pkg-XXXXXX.tgz)
            echo "Installing ${name}@${ver} → ${dest}"
            mkdir -p "${dest}"

            # Download tarball to temp file (do not pipe directly into tar)
            curl -sfL --max-time 30 \
              "https://registry.npmjs.org/${name}/-/$(basename ${name})-${ver}.tgz" \
              -o "${tmpfile}"

            # SEC-CI-007: Verify integrity hash from package-lock.json
            # The integrity field is base64-encoded sha512: "sha512-<base64>"
            LOCK_INTEGRITY=$(node -p "
              try {
                const lock = require('./package-lock.json');
                const pkg = lock.packages && lock.packages['node_modules/${name}'];
                (pkg && pkg.integrity) || ''
              } catch(e) { '' }
            " 2>/dev/null || true)

            if [ -n "${LOCK_INTEGRITY}" ] && echo "${LOCK_INTEGRITY}" | grep -q '^sha512-'; then
              B64="${LOCK_INTEGRITY#sha512-}"
              EXPECTED_HEX=$(echo "${B64}" | base64 -d | xxd -p | tr -d '\n')
              ACTUAL_HEX=$(sha512sum "${tmpfile}" | cut -d ' ' -f 1)
              if [ "${EXPECTED_HEX}" != "${ACTUAL_HEX}" ]; then
                echo "  ::warning::Integrity mismatch for ${name}@${ver} (cross-platform lockfile)"
              else
                echo "  Integrity verified (sha512 matches package-lock.json)"
              fi
            else
              echo "  ::warning::No lockfile integrity entry for ${name}@${ver} — skipping hash check"
            fi

            tar xz -C "${dest}" --strip-components=1 < "${tmpfile}"
            rm -f "${tmpfile}"
            if [ -f "${dest}/package.json" ]; then
              echo "  OK ($(node -p "require('./${dest}/package.json').name"))"
            else
              echo "  FAILED - no package.json found"
            fi
          }

          # esbuild linux-x64 for ALL esbuild installations (root + nested in vite)
          for esbuild_pkg in $(find node_modules -name "package.json" -path "*/esbuild/package.json" -not -path "*/@esbuild/*" 2>/dev/null); do
            esbuild_dir=$(dirname "$esbuild_pkg")
            esbuild_ver=$(node -p "require('./${esbuild_pkg}').version")
            parent_dir=$(dirname "$esbuild_dir")
            target="${parent_dir}/@esbuild/linux-x64"
            if [ ! -d "$target" ]; then
              install_pkg "@esbuild/linux-x64" "$esbuild_ver" "$target"
            else
              echo "Skipping ${target} (already exists)"
            fi
          done

          # Rollup native binary (needed by Vite for frontend builds)
          install_pkg "@rollup/rollup-linux-x64-gnu" "$(node -p "require('./node_modules/rollup/package.json').version")"

          # NX native binary (CRITICAL - without this NX hangs on Linux!)
          install_pkg "@nx/nx-linux-x64-gnu" "$(node -p "require('./node_modules/nx/package.json').version")"

          timeout 30 node node_modules/nx/bin/post-install || true

          # ARCH-CI-011: Verify NX binary is functional before proceeding
          node -e "require('@nx/nx-linux-x64-gnu')" || { echo "::error::NX linux binary missing or broken"; exit 1; }
          echo "All Linux platform binaries installed successfully"

      # PERF-CI-001: Build only affected frontend modules (not all 8+aquamobil)
      #
      # Build strategy:
      #   - NX projects (have project.json): built via nx run-many
      #   - Non-NX workspace modules (sensor/hr/hydroponics): built via npm workspaces
      #   - aquamobil (web/apps/aquamobil): builds inside its own Dockerfile — skipped here
      - name: Build affected frontend modules
        run: |
          NX_CSV="${{ needs.prepare.outputs.nx_frontend_csv }}"
          NON_NX_CSV="${{ needs.prepare.outputs.non_nx_frontend_csv }}"

          # NX-managed frontend apps
          if [ -n "$NX_CSV" ]; then
            echo "Building NX frontend projects: ${NX_CSV}"
            npx nx run-many -t build \
              --projects="${NX_CSV}" \
              --parallel=3
          else
            echo "No NX frontend projects affected — skipping"
          fi

          # Non-NX workspace modules (vite build, deps already hoisted to root node_modules)
          # These modules import from @aquaculture/shared-ui which resolves to web/shared-ui/dist,
          # so shared-ui must be built first.
          if [ -n "$NON_NX_CSV" ]; then
            echo "Building shared-ui (dependency for non-NX modules)"
            npm run build --workspace="web/shared-ui"

            IFS=',' read -ra NON_NX_MODS <<< "$NON_NX_CSV"
            for mod in "${NON_NX_MODS[@]}"; do
              echo "Building non-NX module: ${mod}"
              npm run build --workspace="web/modules/${mod}"
            done
          else
            echo "No non-NX frontend modules affected — skipping"
          fi
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

      # Upload frontend artifacts (web/shell/dist + web/modules/*/dist).
      # ARCH-CI-016: Always produce a frontend-dist artifact, even when empty.
      # Downstream build-frontend-images job depends on this artifact existing.
      # Without if-no-files-found: warn, the upload fails when no modules were
      # built (e.g., only aquamobil changed). The .gitkeep placeholder ensures
      # the artifact is always non-empty, preventing "Artifact not found" errors
      # in the download step of build-frontend-images matrix entries that need it.
      - name: Ensure frontend-dist artifact is always producible
        run: mkdir -p web/.artifact-marker && echo "placeholder" > web/.artifact-marker/.gitkeep

      - name: Upload frontend artifacts
        # SEC-CI-002: pinned to SHA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: frontend-dist
          path: |
            web/shell/dist/
            web/modules/*/dist/
            web/.artifact-marker/
          if-no-files-found: warn
          retention-days: 1

  # ===========================================================================
  # Build Backend Docker Images (dynamic matrix — affected only)
  # ===========================================================================
  build-backend-images:
    needs: [prepare, build-backend-artifacts]
    if: needs.prepare.outputs.has_backend_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # ARCH-CI-015: Increased from 4 to 6 for fewer sequential waves
      max-parallel: 6
      matrix:
        # PERF-CI-001: Dynamic matrix — only affected backend services
        service: ${{ fromJson(needs.prepare.outputs.affected_backend) }}
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download backend artifacts
        # SEC-CI-002: pinned to SHA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-dist
          path: dist/

      # SEC-CI-002: pinned to SHA
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # SEC-CI-002: pinned to SHA
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # WS10: pick the right Dockerfile per service. db-migrate uses its
      # own Dockerfile (no HEALTHCHECK, one-shot CMD) while every other
      # backend shares the Dockerfile.backend.simple posture.
      - name: Select Dockerfile
        id: dockerfile
        run: |
          if [ "${{ matrix.service }}" = "db-migrate" ]; then
            echo "file=infrastructure/docker/Dockerfile.db-migrate" >> $GITHUB_OUTPUT
          else
            echo "file=infrastructure/docker/Dockerfile.backend.simple" >> $GITHUB_OUTPUT
          fi

      - name: Build and push ${{ matrix.service }}
        # SEC-CI-002: pinned to SHA
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.service }}:${{ env.TAG }}
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.service }}:latest
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          # ARCH-CI-002: Namespaced buildcache tag to avoid collision with cd-production.yml
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}/${{ matrix.service }}:buildcache-main-v2
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}/${{ matrix.service }}:buildcache-main-v2,mode=max

  # ===========================================================================
  # Build Frontend Docker Images (dynamic matrix — affected only)
  # ===========================================================================
  build-frontend-images:
    needs: [prepare, build-frontend-artifacts]
    if: needs.prepare.outputs.has_frontend_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # ARCH-CI-015: Increased from 4 to 6
      max-parallel: 6
      matrix:
        # PERF-CI-001: Dynamic matrix — only affected frontend modules
        include: ${{ fromJson(needs.prepare.outputs.affected_frontend_matrix) }}
    steps:
      # SEC-CI-002: pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Download frontend artifacts — upload strips common ancestor 'web/',
      # so we extract into 'web/' to restore original paths (web/shell/dist, web/modules/*/dist).
      # ARCH-CI-016: The upstream upload step always produces a frontend-dist artifact
      # (with at least a placeholder file), so this download never fails with "not found".
      # Aquamobil does not use the downloaded dist/ files (it builds inside its Dockerfile),
      # but downloading the artifact is harmless and avoids special-casing the matrix.
      # ARCH-CI-016: Download frontend dist artifacts for shell/MFE images.
      # Aquamobil builds entirely inside its Dockerfile and does not need
      # the downloaded artifacts. continue-on-error prevents the entire
      # matrix from failing when the artifact expires or is unavailable.
      - name: Download frontend artifacts
        # SEC-CI-002: pinned to SHA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: frontend-dist
          path: web

      # SEC-CI-002: pinned to SHA
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # SEC-CI-002: pinned to SHA
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.module }}
        # SEC-CI-002: pinned to SHA
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.module }}:${{ env.TAG }}
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.module }}:latest
          build-args: |
            MODULE_PATH=${{ matrix.module_path }}
          # ARCH-CI-002: Namespaced buildcache tag to avoid collision with cd-production.yml
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}/${{ matrix.module }}:buildcache-main-v2
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}/${{ matrix.module }}:buildcache-main-v2,mode=max

  # ===========================================================================
  # Deploy to DigitalOcean Droplet (selective — affected services only)
  # ===========================================================================
  deploy:
    needs: [prepare, build-backend-artifacts, build-frontend-artifacts, build-backend-images, build-frontend-images]
    # Only deploy if at least one image build succeeded (artifact jobs may be skipped when there are no changes)
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.build-backend-artifacts.result == 'success' || needs.build-backend-artifacts.result == 'skipped') &&
      (needs.build-frontend-artifacts.result == 'success' || needs.build-frontend-artifacts.result == 'skipped') &&
      (needs.build-backend-images.result == 'success' || needs.build-backend-images.result == 'skipped') &&
      (needs.build-frontend-images.result == 'success' || needs.build-frontend-images.result == 'skipped') &&
      (needs.build-backend-images.result == 'success' || needs.build-frontend-images.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    environment: production
    permissions:
      contents: write
      packages: read
    steps:
      # SEC-CI-002: pinned to SHA (needed for tag update step)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Deploy to DigitalOcean Droplet
        # SEC-CI-002: pinned to SHA
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 75m  # Sequential pulls on slow disk + service bootstrap for 22+ Docker images
          script: |
            set -e
            cd /var/aqua-saas

            DEPLOY_SERVICES="${{ needs.prepare.outputs.deploy_services }}"
            FULL_DEPLOY="${{ needs.prepare.outputs.full_deploy }}"

            # SEC-CI-012: Checkout to the specific SHA that triggered the workflow
            # instead of git pull (prevents TOCTOU race if another commit lands mid-deploy)
            echo "=== Checking out deploy SHA ==="
            git fetch --force --prune origin
            git checkout -f ${{ github.sha }}

            # IP-1: Auto-generate/renew TLS certificates for NATS/Redis/PostgreSQL.
            #
            # ARCHITECTURAL CHANGE 2026-04-14: ALWAYS run generate-internal-certs.sh.
            #
            # Previous gate "if redis cert valid > 30 days, skip generation" caused
            # an outage: new per-service NATS client certs (commit 11c21fda added
            # auth_service / farm_service / .../ messaging_service / hydroponics_service
            # certs to the script's `for svc in ...` loop) were NEVER generated on
            # droplets where redis cert was still valid — the gate skipped the
            # whole script. Result: clients/<svc>-cert.pem files missing → mTLS
            # handshake fails → 'Authorization Violation' across every backend.
            #
            # Tier-1 Make-Impossible fix: ALWAYS invoke the script. Its per-file
            # skip-if-exists logic (line 45-46 of generate-internal-certs.sh)
            # makes the no-op case ~100ms total. New per-service certs added in
            # lockstep with services.yaml will land on next deploy automatically,
            # without operator intervention. --force is reserved for proactive
            # renewal of existing certs nearing expiry.
            echo "=== TLS certificate generation (always-run; idempotent) ==="
            CERT_RENEW=false
            if [ -f "certs/redis/redis-cert.pem" ]; then
              EXPIRY=$(openssl x509 -enddate -noout -in certs/redis/redis-cert.pem 2>/dev/null | cut -d= -f2)
              if [ -n "$EXPIRY" ]; then
                EXPIRY_EPOCH=$(date -d "$EXPIRY" +%s 2>/dev/null || echo 0)
                NOW_EPOCH=$(date +%s)
                DAYS_LEFT=$(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))
                echo "  Server certificate expires in ${DAYS_LEFT} days"
                if [ "$DAYS_LEFT" -lt 30 ]; then
                  echo "  Expiring soon — proactive full regeneration"
                  CERT_RENEW=true
                fi
              fi
            fi
            if [ "$CERT_RENEW" = true ]; then
              bash infrastructure/docker/scripts/generate-internal-certs.sh --force
            else
              # No --force: script generates ONLY missing certs; existing valid
              # certs stay untouched. Catches "new service added since last
              # deploy" → its client cert gets generated even if shared CA cert
              # is still valid for 300+ days.
              bash infrastructure/docker/scripts/generate-internal-certs.sh
            fi

            # ──────────────────────────────────────────────────────────────
            # ADR-016 Phase A — Pre-flight validation
            # ──────────────────────────────────────────────────────────────
            #
            # All checks below MUST pass before we touch live production
            # state. A bad commit caught here means zero-impact rollback
            # (we never destroyed the running containers). A bad commit
            # NOT caught here costs 5 minutes of timeout + log dive +
            # health-check rollback.
            #
            # Tier-1 Make-Impossible: the compose interpolation, NATS
            # SSoT drift, and required-secret presence are all detectable
            # in <1s without touching containers. Failing fast here is
            # always cheaper than failing during boot.
            #
            # Phase A2 — docker-compose interpolation valid
            echo "=== Pre-flight: compose interpolation ==="
            if ! docker compose -f docker-compose.droplet.yml config --quiet; then
              echo "::error::docker-compose.droplet.yml interpolation failed."
              echo "  Likely cause: missing :? required env var in /var/aqua-saas/.env"
              echo "  Aborting BEFORE any container actions — no production state changed."
              exit 1
            fi
            echo "  OK: compose interpolates cleanly"

            # Phase A3 — NATS SSoT not drifted from generated nats.conf
            echo "=== Pre-flight: NATS SSoT drift check ==="
            if [ -f scripts/nats/generate-nats-conf.py ]; then
              python3 scripts/nats/generate-nats-conf.py
              if ! git diff --quiet infrastructure/docker/nats/nats.conf; then
                echo "::error::nats.conf drifted from infrastructure/nats/services.yaml"
                echo "  Run 'python3 scripts/nats/generate-nats-conf.py' locally and commit the diff."
                git diff infrastructure/docker/nats/nats.conf | head -50
                exit 1
              fi
              echo "  OK: nats.conf matches services.yaml"
            else
              echo "  SKIP: generator script not present (commit predates ADR-015)"
            fi

            # Phase A4 — required secrets present in .env (don't generate, just check)
            echo "=== Pre-flight: required secrets presence ==="
            REQUIRED_SECRETS=(
              POSTGRES_PASSWORD
              REDIS_PASSWORD
              INTERNAL_SERVICE_SECRET
              PASSWORD_PEPPER
            )
            MISSING=()
            for SECRET in "${REQUIRED_SECRETS[@]}"; do
              if ! grep -q "^${SECRET}=" /var/aqua-saas/.env 2>/dev/null; then
                MISSING+=("$SECRET")
              fi
            done
            if [ ${#MISSING[@]} -gt 0 ]; then
              echo "::error::Required secrets missing from /var/aqua-saas/.env: ${MISSING[*]}"
              echo "  Aborting BEFORE container actions — set these and retry."
              exit 1
            fi
            echo "  OK: ${#REQUIRED_SECRETS[@]} required secrets present"

            # End of pre-flight ──────────────────────────────────────────

            # SEC-CI-001: GITHUB_TOKEN (packages:read) is substituted at template time by the
            # GitHub Actions runner and masked as *** in all logs. Short-lived, run-scoped only.
            echo "=== Logging into GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # ARCH-CI-007: Capture current image digests for rollback before pulling new images
            echo "=== Capturing current image digests for rollback ==="
            PREV_GATEWAY=$(docker inspect --format='{{.Image}}' aqua-saas-gateway-api-1 2>/dev/null || echo "")
            echo "Previous gateway digest: ${PREV_GATEWAY:-none}"

            if [ "$FULL_DEPLOY" = "true" ]; then
              # ── Full deploy mode (workflow_dispatch "all" or first deploy) ──
              echo "=== FULL DEPLOY: Pulling images sequentially (avoids disk I/O contention) ==="
              for svc in $(docker compose -f docker-compose.droplet.yml config --services); do
                echo "  Pulling $svc..."
                docker compose -f docker-compose.droplet.yml pull "$svc" 2>&1 || echo "  WARN: $svc pull failed, continuing..."
              done

              echo "=== Stopping all services ==="
              docker compose -f docker-compose.droplet.yml down --remove-orphans --timeout 30 2>&1 || true
              # Force-remove ALL aqua containers (including ones compose couldn't remove)
              echo "Force-removing any remaining aqua containers..."
              docker ps -a --format '{{.Names}}' | grep -E 'aqua-' | while read -r name; do
                echo "  Removing $name..."
                docker rm -f "$name" 2>&1 || true
              done
              sleep 5
              # Verify clean slate
              REMAINING=$(docker ps -a --format '{{.Names}}' | grep -E 'aqua-' || true)
              if [ -n "$REMAINING" ]; then
                echo "WARNING: containers still exist after cleanup: $REMAINING"
                echo "Attempting docker stop + rm..."
                echo "$REMAINING" | xargs -r docker stop --time 5 2>&1 || true
                echo "$REMAINING" | xargs -r docker rm -f 2>&1 || true
                sleep 5
              fi
              echo "Containers after cleanup:"
              docker ps -a --format '{{.Names}}' | grep -E 'aqua-' || echo "none (clean)"

              # ARCH-031: Pre-deploy NATS JetStream storage maintenance.
              # If JetStream data exceeds server limit (nats.conf max_file_store: 2GB),
              # purge the data directory to allow clean startup. NATS will recreate
              # streams via nats-event-bus.ts setupStream() on first service connection.
              # This prevents "insufficient storage resources available" (error 10047).
              echo "=== NATS JetStream storage maintenance ==="
              NATS_DATA_DIR="/var/lib/docker/volumes/aqua-saas_nats_data/_data/jetstream"
              if [ -d "$NATS_DATA_DIR" ]; then
                JS_SIZE=$(du -sm "$NATS_DATA_DIR" 2>/dev/null | awk '{print $1}')
                echo "JetStream storage usage: ${JS_SIZE:-0}MB / 2048MB limit"
                if [ "${JS_SIZE:-0}" -gt 1800 ]; then
                  echo "⚠️  JetStream storage near limit (${JS_SIZE}MB > 1800MB). Purging old data..."
                  rm -rf "$NATS_DATA_DIR"
                  echo "JetStream data purged. Streams will be recreated on startup."
                fi
              else
                echo "No existing JetStream data directory found (first deploy or volume not mounted)"
              fi

              # ================================================================
              # Per-service credential provisioning (CRITICAL-002 / CRITICAL-001)
              #
              # Each service needs its own NATS user/password and DB role password.
              # These are generated ONCE and persisted in .env. Subsequent deploys
              # detect existing values and skip generation (idempotent).
              # ================================================================
              echo "=== Ensuring per-service credentials exist ==="
              ENV_FILE="/var/aqua-saas/.env"

              generate_credential() {
                local VAR_NAME="$1"
                if grep -q "^${VAR_NAME}=" "$ENV_FILE" 2>/dev/null; then
                  echo "  ${VAR_NAME}: already set"
                else
                  local VALUE=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
                  echo "${VAR_NAME}=${VALUE}" >> "$ENV_FILE"
                  echo "  ${VAR_NAME}: generated"
                fi
              }

              # ADR-015 (cert-is-identity): NATS per-service identity is the
              # mTLS cert CN via `verify_and_map: true`. The previous
              # set_canonical NATS_*_USER / generate_credential NATS_*_PASS
              # provisioning block was removed — those env vars are no longer
              # consumed by nats.conf (literal user names from services.yaml)
              # or by the client factory (mtls-cert mode omits user/pass from
              # CONNECT frame). Keeping them provisioned would resurrect the
              # 3-way drift surface (.env ↔ nats.conf ↔ cert CN) that caused
              # the 2026-04-14 Authorization Violation outage.
              #
              # Canonical service name list now lives exclusively at
              # infrastructure/nats/services.yaml and is consumed by:
              #   - scripts/nats/generate-nats-conf.py (generates nats.conf)
              #   - infrastructure/docker/scripts/generate-internal-certs.sh
              #     (cert CN list — hand-written in lockstep, CI-validated)
              #   - e2e/tests/integration/nats-invariants.spec.ts (drift
              #     detection)
              #
              # If the SSoT gets out of sync with generated artifacts, the
              # nats-invariants CI test fails the build — no need for deploy
              # workflow to enforce it.
              #
              # NATS_*_SVC_USER / NATS_*_SVC_PASS are historical (internal
              # deploy bookkeeping, not client auth). Preserved to avoid
              # churning deploy-state conventions in the same PR as the
              # architectural refactor. Tracked as BACKLOG-NATS-003 to audit
              # whether they're still read by any pipeline step and remove
              # them if not.

              # NATS per-service internal bookkeeping credentials (unrelated
              # to client auth; legacy — see comment above)
              for SVC in AUTH FARM SENSOR GATEWAY NOTIFICATION BILLING ALERT HR MESSAGING HYDROPONICS; do
                generate_credential "NATS_${SVC}_SVC_USER"
                generate_credential "NATS_${SVC}_SVC_PASS"
              done

              # PostgreSQL per-service role passwords
              for SVC in AUTH FARM SENSOR BILLING HR ALERT ADMIN GATEWAY NOTIFICATION HYDROPONICS MESSAGING; do
                generate_credential "${SVC}_SERVICE_DB_PASS"
              done

              # Application secrets
              generate_credential "WEBHOOK_ENCRYPTION_KEY"

              echo "=== Per-service credentials provisioned ==="

              # RSA key pair for JWT RS256 signing (auth-service signs, all verify)
              echo "=== Ensuring JWT RSA key pair exists ==="
              JWT_KEY_DIR="/var/aqua-saas/certs/jwt"
              if [ ! -f "$JWT_KEY_DIR/private.pem" ]; then
                echo "  Generating RSA-2048 key pair for JWT..."
                mkdir -p "$JWT_KEY_DIR"
                openssl genrsa -out "$JWT_KEY_DIR/private.pem" 2048
                openssl rsa -in "$JWT_KEY_DIR/private.pem" -pubout -out "$JWT_KEY_DIR/public.pem"
                chmod 644 "$JWT_KEY_DIR/private.pem"
                chmod 644 "$JWT_KEY_DIR/public.pem"
                # Write PEM paths to .env
                grep -q "^JWT_PRIVATE_KEY_PATH=" "$ENV_FILE" || echo "JWT_PRIVATE_KEY_PATH=/etc/ssl/jwt/private.pem" >> "$ENV_FILE"
                grep -q "^JWT_PUBLIC_KEY_PATH=" "$ENV_FILE" || echo "JWT_PUBLIC_KEY_PATH=/etc/ssl/jwt/public.pem" >> "$ENV_FILE"
                echo "  JWT RSA key pair generated"
              else
                echo "  JWT RSA key pair already exists"
                # Ensure .env has the path vars even if keys were generated in a prior deploy
                grep -q "^JWT_PRIVATE_KEY_PATH=" "$ENV_FILE" || echo "JWT_PRIVATE_KEY_PATH=/etc/ssl/jwt/private.pem" >> "$ENV_FILE"
                grep -q "^JWT_PUBLIC_KEY_PATH=" "$ENV_FILE" || echo "JWT_PUBLIC_KEY_PATH=/etc/ssl/jwt/public.pem" >> "$ENV_FILE"
              fi

              echo "=== Ensuring infrastructure databases exist ==="
              # Start only postgres first to create additional databases
              docker compose -f docker-compose.droplet.yml up -d --no-build postgres 2>&1 || true
              sleep 10

              # DB-PWD-SYNC: Verify POSTGRES_PASSWORD matches what's in the data volume.
              # If the .env password was regenerated but the volume persists from a prior init,
              # db-init and all services will fail to authenticate. Fix by resetting the
              # password via local trust auth (docker exec uses Unix socket, not TCP).
              echo "=== Verifying PostgreSQL superuser password ==="
              if docker exec aqua-postgres psql -U "${POSTGRES_USER:-aquaculture}" -c "SELECT 1" >/dev/null 2>&1; then
                if docker exec aqua-postgres bash -c "PGPASSWORD='${POSTGRES_PASSWORD}' psql -h 127.0.0.1 -U '${POSTGRES_USER:-aquaculture}' -c 'SELECT 1'" >/dev/null 2>&1; then
                  echo "  PostgreSQL superuser password matches .env"
                else
                  echo "  WARNING: PostgreSQL superuser password mismatch — resetting via local auth"
                  docker exec aqua-postgres psql -U "${POSTGRES_USER:-aquaculture}" \
                    -c "ALTER USER \"${POSTGRES_USER:-aquaculture}\" WITH PASSWORD '${POSTGRES_PASSWORD}'"
                  echo "  PostgreSQL superuser password reset to match .env"
                fi
              else
                echo "  ERROR: Cannot connect to PostgreSQL via local auth — manual intervention required"
              fi

              # Create observability database if it doesn't exist (postgres init scripts only run on first start)
              docker exec aqua-postgres psql -U "${POSTGRES_USER:-aquaculture}" -tc "SELECT 1 FROM pg_database WHERE datname = 'aquaculture_observability'" | grep -q 1 || \
                docker exec aqua-postgres psql -U "${POSTGRES_USER:-aquaculture}" -c "CREATE DATABASE aquaculture_observability" 2>&1 || true

              # ─────────────────────────────────────────────────────────────
              # WS10 / ADR-016 Phase E — one-shot schema migration container.
              #
              # Run aqua-db-migrate BEFORE service containers so schema state
              # is at the known-good version when gateway-api / auth-service
              # / every other backend boots.
              #
              # --exit-code-from aqua-db-migrate: compose blocks until the
              # container exits and surfaces its exit code to the script.
              # Exit 0 → proceed. Non-zero → abort deploy BEFORE service
              # containers ever start (services' depends_on
              # service_completed_successfully would enforce this at
              # compose level too, but the explicit early exit here gives
              # the operator a clear failure signal without compose's
              # more verbose error output).
              #
              # Phase 1 backward-compat: if the migration container fails
              # (exit code != 0), the deploy aborts. Services' own
              # createMigrationRunnerService is still in place as a
              # safety-net, but operators MUST fix the upstream issue
              # rather than relying on the fallback.
              # ─────────────────────────────────────────────────────────────
              echo "=== Running aqua-db-migrate (one-shot schema runner) ==="
              # Pull the migration image separately so its failure doesn't
              # cascade into the service-container pull logic below.
              # The compose SERVICE name is `db-migrate` (the container_name
              # is `aqua-db-migrate` but `docker compose` operates on service
              # names, not container names).
              docker compose -f docker-compose.droplet.yml pull db-migrate 2>&1 || true
              if ! docker compose -f docker-compose.droplet.yml \
                    up --no-build --abort-on-container-exit \
                    --exit-code-from db-migrate db-migrate; then
                echo "::error::aqua-db-migrate failed — schema migration aborted BEFORE service containers started."
                echo "Inspect logs: docker logs aqua-db-migrate"
                exit 1
              fi
              echo "  aqua-db-migrate completed successfully"

              echo "=== Starting all services ==="
              docker compose -f docker-compose.droplet.yml up -d --no-build 2>&1 || true

              echo "=== Waiting 90s for services to bootstrap ==="
              sleep 90

              # ARCH-NM-DNS: Graceful nginx reload after full deploy to ensure
              # all upstream hostnames are resolved to current container IPs.
              echo "=== Reloading nginx to pick up new container IPs ==="
              docker exec aqua-nginx nginx -s reload 2>&1 || true
              sleep 2

              # ARCH-GW-006: Force Apollo Gateway to recompose supergraph schema.
              # After backend services restart with new GraphQL types/fields, the
              # gateway may hold a stale supergraph from the previous composition.
              # The pollIntervalInMs (300s) would eventually refresh it, but during
              # that window frontend queries for new fields return 400.
              # Restarting the gateway forces immediate schema introspection.
              echo "=== Restarting gateway for schema recomposition ==="
              docker compose -f docker-compose.droplet.yml restart gateway-api 2>&1 || true
              sleep 15

            else
              # ── Selective deploy mode (only affected services) ──
              echo "=== SELECTIVE DEPLOY: ${DEPLOY_SERVICES} ==="

              # ARCH-031: Pre-deploy NATS JetStream storage maintenance (selective path).
              echo "=== NATS JetStream storage maintenance ==="
              NATS_DATA_DIR="/var/lib/docker/volumes/aqua-saas_nats_data/_data/jetstream"
              if [ -d "$NATS_DATA_DIR" ]; then
                JS_SIZE=$(du -sm "$NATS_DATA_DIR" 2>/dev/null | awk '{print $1}')
                echo "JetStream storage usage: ${JS_SIZE:-0}MB / 2048MB limit"
                if [ "${JS_SIZE:-0}" -gt 1800 ]; then
                  echo "⚠️  JetStream storage near limit (${JS_SIZE}MB > 1800MB). Purging old data..."
                  docker stop aqua-nats 2>/dev/null || true
                  rm -rf "$NATS_DATA_DIR"
                  echo "JetStream data purged. Streams will be recreated on startup."
                fi
              else
                echo "No existing JetStream data directory found"
              fi

              # Per-service credential provisioning (same as full deploy path).
              # ADR-015: no NATS client-auth credential provisioning here —
              # mTLS cert CN IS identity. Only legacy internal bookkeeping
              # credentials + DB role passwords get generated.
              echo "=== Ensuring per-service credentials exist ==="
              ENV_FILE="/var/aqua-saas/.env"
              generate_credential() {
                local VAR_NAME="$1"
                if grep -q "^${VAR_NAME}=" "$ENV_FILE" 2>/dev/null; then
                  echo "  ${VAR_NAME}: already set"
                else
                  local VALUE=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
                  echo "${VAR_NAME}=${VALUE}" >> "$ENV_FILE"
                  echo "  ${VAR_NAME}: generated"
                fi
              }
              # NATS per-service internal bookkeeping (legacy; see full-deploy
              # block above for BACKLOG-NATS-003 to audit whether any pipeline
              # step still consumes these).
              for SVC in AUTH FARM SENSOR GATEWAY NOTIFICATION BILLING ALERT HR MESSAGING HYDROPONICS; do
                generate_credential "NATS_${SVC}_SVC_USER"
                generate_credential "NATS_${SVC}_SVC_PASS"
              done
              for SVC in AUTH FARM SENSOR BILLING HR ALERT ADMIN GATEWAY NOTIFICATION HYDROPONICS MESSAGING; do
                generate_credential "${SVC}_SERVICE_DB_PASS"
              done

              # Application secrets
              generate_credential "WEBHOOK_ENCRYPTION_KEY"

              # Ensure infrastructure services are running (no-op if already up)
              echo "=== Ensuring infrastructure is running ==="
              docker compose -f docker-compose.droplet.yml up -d --no-build postgres redis nats mosquitto minio nginx 2>&1 || true
              sleep 5

              # ─────────────────────────────────────────────────────────────
              # WS10 / ADR-016 Phase E — one-shot schema migration container.
              #
              # Even on a selective deploy, run aqua-db-migrate before the
              # affected services restart. Pending migrations only land on
              # services that were changed, but the migration SET typically
              # spans schemas a service change did not touch (e.g. a shared
              # auth-schema tenant_id column rename lands in auth-service's
              # own migration but other services' RLS policies depend on
              # the new column name). Running the full migration pass keeps
              # schema state coherent regardless of which services this
              # deploy restarts.
              # ─────────────────────────────────────────────────────────────
              echo "=== Running aqua-db-migrate (one-shot schema runner) ==="
              # The compose SERVICE name is `db-migrate` (container_name is
              # `aqua-db-migrate`).
              docker compose -f docker-compose.droplet.yml pull db-migrate 2>&1 || true
              if ! docker compose -f docker-compose.droplet.yml \
                    up --no-build --abort-on-container-exit \
                    --exit-code-from db-migrate db-migrate; then
                echo "::error::aqua-db-migrate failed — selective deploy aborted BEFORE restarting services."
                echo "Inspect logs: docker logs aqua-db-migrate"
                exit 1
              fi
              echo "  aqua-db-migrate completed successfully"

              echo "=== Pulling affected images sequentially: ${DEPLOY_SERVICES} ==="
              for svc in ${DEPLOY_SERVICES}; do
                echo "  Pulling $svc..."
                docker compose -f docker-compose.droplet.yml pull "$svc" 2>&1 || echo "  WARN: $svc pull failed, continuing..."
              done

              echo "=== Restarting affected services (no-deps): ${DEPLOY_SERVICES} ==="
              docker compose -f docker-compose.droplet.yml up -d --no-deps --no-build ${DEPLOY_SERVICES} 2>&1 || true

              echo "=== Waiting 30s for services to bootstrap ==="
              sleep 30

              # ARCH-NM-DNS: Graceful nginx reload after container recreation.
              # Belt-and-suspenders: the nginx config uses resolver + variable proxy_pass
              # for dynamic DNS, but a reload ensures immediate resolution of new IPs
              # without waiting for the resolver TTL to expire.
              echo "=== Reloading nginx to pick up new container IPs ==="
              docker exec aqua-nginx nginx -s reload 2>&1 || docker compose -f docker-compose.droplet.yml restart nginx 2>&1 || true
              sleep 2

              # ARCH-GW-006: Force gateway schema recomposition when backend services change.
              # Only restart gateway when a backend subgraph service was deployed, since
              # frontend-only deploys don't affect the supergraph schema.
              BACKEND_PATTERN="gateway-api|auth-service|farm-service|sensor-service|alert-engine|billing-service|hr-service|hydroponics-service|notification-service|config-service|messaging-service"
              if echo "${DEPLOY_SERVICES}" | grep -qE "${BACKEND_PATTERN}"; then
                echo "=== Backend subgraph changed — restarting gateway for schema recomposition ==="
                docker compose -f docker-compose.droplet.yml restart gateway-api 2>&1 || true
                sleep 15
              fi
            fi

            echo "=== Container health status ==="
            docker compose -f docker-compose.droplet.yml ps --format 'table {{.Name}}\t{{.Status}}' 2>/dev/null || true

            echo "=== Logs from non-healthy/restarting containers ==="
            for c in $(docker ps -a --format '{{.Names}}' --filter "label=com.docker.compose.project=aqua-saas"); do
              HEALTH=$(docker inspect --format='{{.State.Health.Status}}' "$c" 2>/dev/null || echo "none")
              RESTARTS=$(docker inspect --format='{{.RestartCount}}' "$c" 2>/dev/null || echo "0")
              if [ "$HEALTH" != "healthy" ] || [ "$RESTARTS" -gt 0 ] 2>/dev/null; then
                echo "--- $c (health=$HEALTH, restarts=$RESTARTS) last 80 lines ---"
                docker logs --tail 200 "$c" 2>&1 || true
              fi
            done

            # ADR-016 Phase C / WS6 — criticality-aware multi-service health
            # gate. Replaces the old "poll only gateway-api /health/live" block
            # that silently passed when other backends crash-looped (2026-04-14
            # cascade failure mode). The script reads
            # `infrastructure/deploy/service-criticality.yaml` and rolls back
            # only when a `critical` level service fails to reach healthy
            # inside the SLA. Non-critical services surface as warnings.
            # Uses Node 22 built-in TypeScript type-stripping so no
            # tsc/tsx/python is required on the droplet — Node is already
            # a base dependency for the service containers.
            echo "=== Waiting for all critical services ==="
            if ! COMPOSE_FILE=docker-compose.droplet.yml \
                 MANIFEST=infrastructure/deploy/service-criticality.yaml \
                 POLL_INTERVAL=10 \
                 node scripts/deploy/check-service-health.ts; then
              echo "::error::Critical service health check failed. Initiating rollback."
              if [ -n "$PREV_GATEWAY" ]; then
                echo "Rolling back to previous gateway image: ${PREV_GATEWAY}"
                docker tag "${PREV_GATEWAY}" $(docker compose -f docker-compose.droplet.yml config | grep 'image:.*gateway-api' | awk '{print $2}' | head -1) 2>/dev/null || true
                docker compose -f docker-compose.droplet.yml up -d --no-build --remove-orphans
                echo "Rollback complete. Please investigate the failed deploy."
              else
                echo "No previous image digest available; manual intervention required."
              fi
              exit 1
            fi

            # ADR-016 Phase F / WS7 — boot-signal assertion. "Healthy"
            # is necessary but not sufficient for deploy success — a
            # service can be healthy while silently skipping NATS mTLS,
            # schema-drift scan, or migration runner. This step greps
            # `docker compose logs` for canonical signal strings
            # declared in required-signals.yaml. Missing signal =
            # failed deploy = rollback.
            echo "=== Asserting boot signals ==="
            if ! COMPOSE_FILE=docker-compose.droplet.yml \
                 MANIFEST=infrastructure/deploy/required-signals.yaml \
                 POLL_INTERVAL=10 \
                 node scripts/deploy/assert-service-signals.ts; then
              echo "::error::Boot signal assertion failed. Initiating rollback."
              if [ -n "$PREV_GATEWAY" ]; then
                echo "Rolling back to previous gateway image: ${PREV_GATEWAY}"
                docker tag "${PREV_GATEWAY}" $(docker compose -f docker-compose.droplet.yml config | grep 'image:.*gateway-api' | awk '{print $2}' | head -1) 2>/dev/null || true
                docker compose -f docker-compose.droplet.yml up -d --no-build --remove-orphans
                echo "Rollback complete. Investigate why required signals did not fire."
              else
                echo "No previous image digest available; manual intervention required."
              fi
              exit 1
            fi

            echo "=== Cleanup old images ==="
            docker image prune -f --filter "dangling=true"
            docker image prune -f --filter "until=24h" --filter "label!=deployed=current"

            echo "=== Container status ==="
            docker compose -f docker-compose.droplet.yml ps

            echo "=== Deployment completed at $(date) ==="

      # PERF-CI-001: Update deployed/production tag so next deploy only builds changes since this SHA
      - name: Update deploy baseline tag
        run: |
          git tag -f deployed/production ${{ github.sha }}
          git push -f origin deployed/production
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SEC-CI-005: Removed echo of DROPLET_HOST to prevent leaking server IP in logs
      - name: Verify deployment
        run: |
          echo "Deployment initiated successfully"
          echo "Commit: ${{ github.sha }}"
          echo "Services deployed: ${{ needs.prepare.outputs.deploy_services }}"
          echo "Full deploy: ${{ needs.prepare.outputs.full_deploy }}"
