name: Dependency Review

# SEC-CI-002: All third-party actions pinned to full commit SHAs

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        # SEC-CI-002: pinned to SHA (was @v4)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        # SEC-CI-002: pinned to SHA (was @v3)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Allowlisted advisories — every entry MUST have a matching tracked
          # finding in docs/reviews/_registry/findings.jsonl and mirror the
          # ignore entries in deny.toml [advisories] + .cargo/audit.toml. Drift
          # between these three lists is a review-blocker. Full rationale +
          # threat-model justification lives in deny.toml.
          # allow-ghsas expects a COMMA-separated list. Prior `|` multi-line form
          # produced a single blob string that the action could not parse.
          #
          # Inventory:
          #   GHSA-h395-gr6q-cpjc  jsonwebtoken < 10.3.0 Type Confusion       (RUST-CVE-002)
          #   GHSA-9q82-xgwf-vj6h  Apollo Server 4 XS-Search                 (docs/bugs/2026-05-02/apollo-graphql-eol-install-surface.md)
          # 2026-06-11 (RUST-CVE-001 RESOLVED): the three rustls-webpki GHSAs
          # (GHSA-xgp8-3hg3-c2mh / GHSA-965h-392x-2mh5 / GHSA-pwjx-qhcg-rvj4)
          # were removed — rumqttc resolves to the vendored fork at
          # crates/local-rumqttc (rustls-webpki >= 0.103); deny.toml [bans]
          # blocks reintroduction of the vulnerable line.
          # Apollo Server 4 is runtime-mitigated by explicit csrfPrevention:
          # true in every Apollo gateway/subgraph module and enforced by
          # scripts/ci/check-apollo-csrf-prevention.mjs. The permanent fix is
          # Apollo Router or peer-clean Apollo Server 5 migration.
          allow-ghsas: GHSA-h395-gr6q-cpjc,GHSA-9q82-xgwf-vj6h
