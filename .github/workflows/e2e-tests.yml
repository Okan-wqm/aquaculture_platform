name: E2E Tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      pr_head_sha:
        required: true
        type: string

jobs:
  isolated-candidate:
    name: Hosted candidate authentication and mobile E2E
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      HEAD_SHA: ${{ inputs.head_sha }}
      PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
      RUNNER_ENVIRONMENT: ${{ runner.environment }}
      NODE_OPTIONS: '--max-old-space-size=6144'
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5.6.0
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Install candidate build and browser dependencies on hosted runner
        run: |
          npm ci --ignore-scripts --no-audit
          npm ci --prefix e2e --ignore-scripts --no-audit
          node e2e/node_modules/@playwright/test/cli.js install --with-deps chromium
          python3 -m pip install PyYAML==6.0.2
      - name: Generate isolated runtime configuration and ephemeral certificates
        run: node scripts/ci/hosted-e2e-stack.mjs prepare
      - name: Build the exact candidate service and frontend images
        run: node scripts/ci/hosted-e2e-stack.mjs build
      - name: Migrate authoritative schemas and start isolated full stack
        run: node scripts/ci/hosted-e2e-stack.mjs up
      - name: Execute real login, MFA, security and mobile browser proof
        run: node scripts/ci/hosted-e2e-proof.mjs
      - name: Upload exact candidate images, test counts and proof receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-authentication-e2e-${{ github.run_attempt }}
          path: artifacts/hosted-e2e/
          if-no-files-found: error
          retention-days: 14
      - name: Remove only the isolated runner generation
        if: always()
        run: node scripts/ci/hosted-e2e-stack.mjs down
