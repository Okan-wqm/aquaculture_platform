name: aria-agent-eval

# Plan 020 Phase 6.D — weekly off-hours agent eval harness.
#
# Mock-mode is the only path running in CI today (Plan 020 Phase 5
# left the OAuth contract closure as DEBT-2026-05-08-001, operator-
# supervised). The workflow re-runs every committed fixture under
# aria-tools/agent-evals/fixtures/*.json against the kernel's
# run_agent_eval() in mock mode + asserts every run passes.
#
# Once the operator closes DEBT-006 and the OAuth contract surface is
# verified, an additional matrix entry (mock_mode=false) will run the
# real-mode evaluator. Until then the mock-mode counter
# aria_agent_eval_mock_only_total is the only one that ticks.

on:
  schedule:
    # 03:30 UTC weekly Sunday (off-hours; non-overlap with daily executor).
    - cron: '30 3 * * 0'
  workflow_dispatch: {}

permissions:
  # The eval ledger is the point of this workflow, and until now the runner
  # threw it away: every week wrote five rows to `runs.jsonl` inside an
  # ephemeral checkout and discarded them. `compare_eval_windows` needs five
  # runs PER WINDOW to speak, so `agent-eval delta` was structurally condemned
  # to `insufficient_evidence` for as long as CI was the only producer — the
  # baseline existed on one operator's disk and nowhere else.
  #
  # Publishing to `aria/state` is what makes the measurement real. Same
  # transport, same restore action and same `state publish` verb the nightly
  # producer already uses; nothing new is invented here. The token can only
  # append a commit descending from that branch's tip, which is exactly what
  # publishing is.
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-aria-kernel

      - name: Persist enterprise workflow preflight
        env:
          PYTHONPATH: aria-kernel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          from aria_kernel.preflight import verify_workflow_preflight

          # The ledger lives in the durable store now, not in the ephemeral
          # checkout, so the declared write root follows it. Naming the old
          # `aria-tools/...` paths would declare a reach this job no longer
          # has and omit the one it now uses — a preflight that describes the
          # wrong lane proves nothing.
          allowed = [".aria-state-store"]
          verdict = verify_workflow_preflight(
              workflow_id="aria-agent-eval",
              job_id="eval",
              profile="standard",
              workspace_root=os.environ["GITHUB_WORKSPACE"],
              allowed_write_roots=allowed,
              path_allowlist=allowed,
              # `github_git` is what persistence costs: the state branch is
              # fetched and pushed over the repository remote. Declared
              # separately from artifact access because they are different
              # credentials with different blast radii, and a reviewer has to
              # be able to see the git one. The eval itself still reaches no
              # third-party network — the fixtures remain local.
              network_policy=["github_artifact", "github_git"],
              network_enforcement_evidence=(
                  "mock-mode eval uses local fixtures only; network reach is the "
                  "aria/state fetch+push over the repository remote"
              ),
              # The truthful provenance: the eval job persists its ledger to
              # aria/state with `github.token` (PUBLISH_TOKEN below), and the
              # job contract declares token_source="github_actions_artifact_token".
              # This line still said "none" from before the durable-store move,
              # so the kernel preflight refused every run at start
              # (`token_provenance_mismatch:none!=github_actions_artifact_token`)
              # — the weekly eval lane had been dead on arrival since the
              # contract was tightened.
              token_provenance="github_actions_artifact_token",
              require_github_app=False,
              dlp_mode="fail_closed",
              dlp_scan_clean=True,
              audit_reason="run mock-mode agent eval fixtures against local ledgers",
              audit_artifact_path=Path(os.environ["RUNNER_TEMP"]) / "aria-agent-eval-preflight.json",
              external_root_allowlist=[str(Path(os.environ["RUNNER_TEMP"]).resolve())],
          )
          if not verdict.valid:
              raise SystemExit(";".join(verdict.reasons))
          PY

      # One definition, both lanes: the same action the nightly producer uses,
      # which also EXPORTS the store binding as ARIA_TOOLS_DIR. Every
      # `--tools-dir` below names that variable rather than a literal, so the
      # eval appends to the accumulated ledger instead of starting from an
      # empty tree each week.
      - name: Restore ARIA state from the aria/state branch
        id: restore_state
        uses: ./.github/actions/restore-aria-state
        with:
          bootstrap-ack: ${{ vars.ARIA_STATE_BOOTSTRAP_ACK }}

      - name: Run all eval fixtures (mock mode)
        id: run
        run: |
          set -euo pipefail
          mkdir -p /tmp/aria-tests /tmp/aria-workspaces
          export ARIA_TEST_TMPDIR=/tmp/aria-tests
          export ARIA_WORKSPACE_BASE=/tmp/aria-workspaces
          fail_count=0
          for fixture_file in aria-tools/agent-evals/fixtures/*.json; do
            fid=$(basename "${fixture_file}" .json)
            echo "::group::eval ${fid}"
            PYTHONPATH=aria-kernel python3 -m aria_kernel agent-eval add-fixture \
              --fixture-file "${fixture_file}" \
              --tools-dir "$ARIA_TOOLS_DIR" >/dev/null
            run_json=$(PYTHONPATH=aria-kernel python3 -m aria_kernel agent-eval run \
              --fixture-id "${fid}" \
              --tools-dir "$ARIA_TOOLS_DIR")
            echo "${run_json}" | jq .
            passed=$(echo "${run_json}" | jq -r '.passed')
            if [ "${passed}" != "true" ]; then
              fail_count=$((fail_count + 1))
            fi
            echo "::endgroup::"
          done
          echo "fail_count=${fail_count}" >> "$GITHUB_OUTPUT"
          if [ "${fail_count}" -gt 0 ]; then
            echo "::error::${fail_count} fixture(s) failed mock-mode eval"
            exit 1
          fi

      - name: Aggregate eval metrics per agent
        run: |
          set -euo pipefail
          for agent in aria-evidence-judge aria-adversarial-judge \
                       aria-consensus-arbiter architectural-arbiter \
                       auth-security-expert; do
            echo "::group::aggregate ${agent}"
            PYTHONPATH=aria-kernel python3 -m aria_kernel agent-eval aggregate \
              --target-agent "${agent}" \
              --window-days 30 \
              --mock-mode true \
              --tools-dir "$ARIA_TOOLS_DIR" | jq .
            echo "::endgroup::"
          done

      # The delta is the question the program asks of itself: is round N+1
      # better than round N? It could not be answered before, because there
      # was never a round N to compare against.
      - name: Report the window-over-window delta per agent
        if: always() && (steps.restore_state.outputs.restored == 'true' || steps.restore_state.outputs.bootstrap == 'true')
        run: |
          set -euo pipefail
          for agent in aria-evidence-judge aria-adversarial-judge \
                       aria-consensus-arbiter architectural-arbiter \
                       auth-security-expert; do
            echo "::group::delta ${agent}"
            # `insufficient_evidence` is a legitimate answer here, not a
            # failure: two thin windows cannot tell improvement from noise,
            # and a loop that celebrates noise never stops for the right
            # reason. It stays non-fatal until the ledger has depth.
            PYTHONPATH=aria-kernel python3 -m aria_kernel agent-eval delta \
              --target-agent "${agent}" \
              --window-days 30 \
              --mock-mode true \
              --tools-dir "$ARIA_TOOLS_DIR" | jq .
            echo "::endgroup::"
          done

      # The credential is minted here and consumed by the next step only. Kept
      # out of `.git/config` so it cannot outlive the push.
      - name: Mint the aria/state push credential
        id: publish_credential
        if: always() && (steps.restore_state.outputs.restored == 'true' || steps.restore_state.outputs.bootstrap == 'true')
        env:
          PUBLISH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEADER="$(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 -w0)"
          echo "::add-mask::${HEADER}"
          echo "header=${HEADER}" >> "$GITHUB_OUTPUT"

      # `always()` on purpose: a week where a fixture regressed is exactly the
      # week whose rows the trend needs. Publishing only on success would make
      # the ledger a record of good weeks, which is not a measurement.
      - name: Publish ARIA state to the aria/state branch
        if: always() && (steps.restore_state.outputs.restored == 'true' || steps.restore_state.outputs.bootstrap == 'true')
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: 'AUTHORIZATION: basic ${{ steps.publish_credential.outputs.header }}'
        run: |
          set -euo pipefail
          PYTHONPATH=aria-kernel python3 -m aria_kernel state publish \
            --repo-root . \
            --snapshot-id "agent-eval-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --cycle-id "agent-eval-${GITHUB_RUN_ID}"

      # ADR-036 — upload the enterprise-preflight audit proof so the eval
      # job's governed-write decision is retained as CI evidence.
      - name: Upload eval preflight proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-agent-eval-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aria-agent-eval-preflight.json
          if-no-files-found: error
          retention-days: 7
