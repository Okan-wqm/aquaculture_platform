# =============================================================================
# AquaMobil PWA - Nginx Configuration
# Optimized for Progressive Web App with offline support
#
# ARCH-NM-016: GraphQL and API proxy locations removed. All API traffic
# must be routed through the outer nginx reverse proxy. This container
# serves only static PWA assets. WebSocket subscriptions are handled by
# the outer nginx /graphql location.
# =============================================================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security: Hide nginx version
    server_tokens off;

    # DNS resolver for Docker internal networking
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # Security headers — single source of truth in the snippet (SEC-MEDIUM-052).
    # Re-included in every overriding location below because nginx's add_header is
    # NOT additive across levels: a location that sets its own add_header (e.g.
    # Cache-Control) would otherwise drop the CSP + the whole security set.
    include /etc/nginx/snippets/security-headers.conf;

    # Health check
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"aquamobil"}';
        add_header Content-Type application/json;
    }

    # Service Workers - MUST NOT be cached
    # FE-CRITICAL-050-SW: the injectManifest build emits the hand-written SW as
    # `messaging-sw.js` (VitePWA filename: 'messaging-sw.ts'); the FCM push worker
    # is `firebase-messaging-sw.js`. Both must always be revalidated so a deploy
    # ships a fresh SW immediately. Service-Worker-Allowed: / lets each control
    # any scope at or below its own path (the FCM worker claims the deeper
    # /mobile/firebase-cloud-messaging-push-scope).
    location ~* ^/(messaging-sw|firebase-messaging-sw)\.js$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Service-Worker-Allowed "/";
        include /etc/nginx/snippets/security-headers.conf; # SEC-MEDIUM-052
        try_files $uri =404;
    }

    # Legacy Workbox service worker cleanup. Older AquaMobil builds registered
    # /mobile/sw.js; keep serving JS here so stale clients can unregister it
    # instead of receiving the SPA HTML fallback.
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Service-Worker-Allowed "/";
        include /etc/nginx/snippets/security-headers.conf; # SEC-MEDIUM-052
        types { } default_type "application/javascript";
        try_files $uri =404;
    }

    # Workbox runtime chunks emitted by the SW build (if ever split out)
    location ~* ^/workbox-.*\.js$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf; # SEC-MEDIUM-052
        try_files $uri =404;
    }

    # Manifest - short cache for updates
    location = /manifest.webmanifest {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf; # SEC-MEDIUM-052
        types { } default_type "application/manifest+json";
    }

    # Static assets - aggressive caching (versioned by Vite)
    # `^~` — see the note on /fonts/ below: without it the asset-extension
    # regex block wins and these lose their immutable year entirely.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        include /etc/nginx/snippets/security-headers.conf; # SEC-MEDIUM-052
    }

    # Icons and images
    location ^~ /icons/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security-headers.conf; # SEC-MEDIUM-052
    }

    # Self-hosted fonts. Long-lived but NOT immutable: the filenames are stable
    # (geist-latin.woff2, not a content hash), so an immutable year would pin a
    # stale face until the name changed. A day lets a font swap land.
    # `^~` is load-bearing: without it the asset-extension regex block below
    # wins (nginx checks regex locations before plain prefix ones) and these
    # would ship with no Cache-Control at all — verified against a real nginx.
    location ^~ /fonts/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf; # SEC-MEDIUM-052
    }

    # The theme + density pre-paint script. MUST NOT be cached.
    #
    # ORPHAN-HIGH-582 was an inline <script> silently blocked by `script-src
    # 'self'`, which left every user on the fallback theme and gloved workers on
    # standard-size controls — in production only. The fix moved it to this
    # same-origin file, and this block stops the fix from rotting: the filename
    # is UNHASHED and its logic must stay in step with useTheme.ts/useDensity.ts,
    # so a heuristically-cached copy could drift a deploy behind the hashed
    # bundle and reproduce the same divergence by a different route.
    location = /theme-init.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf; # SEC-MEDIUM-052
    }

    # SPA fallback - all routes go to index.html
    #
    # DELIBERATELY NOT a fallback for real asset extensions. `try_files ... /index.html`
    # answers a MISSING .js/.css/.woff2 with index.html and HTTP 200, so a build
    # that failed to emit theme-init.js or a font would serve HTML that the
    # browser tries to execute as JavaScript (parse error, theme layer silently
    # dead — ORPHAN-HIGH-582's shape) or parse as a font (silent fallback to
    # system-ui — ORPHAN-MEDIUM-572's shape). Both are invisible to a status-code
    # check. Assets 404 honestly; only routes fall through.
    location ~* \.(?:js|mjs|css|woff2?|png|svg|ico|json|map)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf; # SEC-MEDIUM-052
    }

    location / {
        try_files $uri $uri/ /index.html;

        # index.html should not be cached (for PWA updates). It is the PWA
        # DOCUMENT, so it MUST carry the CSP — its own Cache-Control add_header
        # would otherwise drop every inherited security header (SEC-MEDIUM-052).
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            include /etc/nginx/snippets/security-headers.conf;
        }
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
