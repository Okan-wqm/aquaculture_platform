# event-store publishes GDPR erasure-proof + outbox events (INFRA-HIGH-003
# onboarding) but never received NATS wiring — the gap stayed latent until the
# event-bus config SSoT fail-fast (correctly) refused the localhost default in
# production and the service crash-looped (ORPHAN-HIGH-391). CN is already
# minted in infrastructure/nats/services.yaml (event_store_service) and the
# client cert pair ships with the deploy checkout like every other service.
x-nats-event-store-env: &nats-event-store-env
  NATS_URL: tls://nats:4222
  NATS_TLS_CA: /etc/ssl/nats-ca.pem
  NATS_TLS_CERT: /etc/ssl/nats-clients/event_store_service-cert.pem
  NATS_TLS_KEY: /etc/ssl/nats-clients/event_store_service-key.pem
  NATS_TLS_ENABLED: 'true'

