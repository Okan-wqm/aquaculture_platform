# The live format of infrastructure/nats/services.yaml: unquoted list items,
# the NATS identity (certificate CN) in `name:` and the nx project in
# `application:`. One item keeps the quoted spelling the SSoT used until
# 2026-08-01, so both spellings stay pinned (ARIA-HIGH-306). The file is held
# to infrastructure/nats/services.schema.json like the live one
# (tools/gates/nats-services.ts), so every service carries the grant minimums.
version: 1
services:
  - name: farm_service
    application: farm-service
    description: farm domain publisher
    publish:
      - events.*.BatchHarvested
      - $JS.API.INFO
      - _INBOX.>
    subscribe:
      - events.*.SensorReading
      - _INBOXFARM_SERVICE.>
  - name: notification_service
    application: notification-service
    description: notification dispatch
    publish:
      - events.*.NotificationSent
      - $JS.API.INFO
      - _INBOX.>
    subscribe:
      - 'events.*.BatchHarvested'
      - commands.notification.sendEmail
