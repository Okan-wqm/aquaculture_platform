      - "events.*.CleanerFishTransferred"
      - "events.*.CullRecorded"
      - "events.*.DepartmentCreated"
      - "events.*.DepartmentDeleted"
      - "events.*.DepartmentUpdated"
      - "events.*.DiseaseOutbreakReported"
      - "events.*.EquipmentCreated"
      - "events.*.EquipmentDeleted"
      - "events.*.EquipmentUpdated"
      - "events.*.EscapeReported"
      - "events.*.FeedInventoryAdjusted"
      - "events.*.FeedInventoryConsumed"
      - "events.*.FeedInventoryLow"
      - "events.*.FeedInventoryReceived"
      - "events.*.FeederCalibrationsSaved"
      - "events.*.FeedingRecordUpdated"
      - "events.*.FeedingRecorded"
      - "events.*.GrowthSampleRecorded"
      - "events.*.HarvestRecordCancelled"
      - "events.*.HarvestRecordUpdated"
      - "events.*.HarvestRegulatoryRecorded"
      - "events.*.LowStockDetected"
      - "events.*.MortalityAlertRaised"
      - "events.*.MortalityRecorded"
      - "events.*.SiteContactsChanged"
      - "events.*.SiteCreated"
      - "events.*.SiteDeleted"
      - "events.*.SiteUpdated"
      - "events.*.StockMovementRecorded"
      - "events.*.SubEquipmentCreated"
      - "events.*.SubEquipmentDeleted"
      - "events.*.SubEquipmentUpdated"
      - "events.*.SupplierApprovedSitesChanged"
      - "events.*.SystemCreated"
      - "events.*.SystemDeleted"
      - "events.*.SystemUpdated"
      - "events.*.TankCleared"
      - "events.*.TankCreated"
      - "events.*.TankDeleted"
      - "events.*.TankStatusChanged"
      - "events.*.TankUpdated"
      - "events.*.TaskAssigned"
      - "events.*.TaskCompleted"
      - "events.*.TaskCreated"
      - "events.*.TaskOverdue"
      - "events.*.TaskStatusChanged"
      - "events.*.TenantDataErased"
      - "events.*.TenantDataErasureFailed"
      - "events.*.TenantErasureBlocked"
      - "events.*.TenantOnboardingAck"
      - "events.*.TenantOnboardingFailed"
      - "events.*.WaterQualityCritical"
      - "events.*.WaterQualityMeasurementCreated"
      - "events.*.WelfareEventReported"
      - "events.platform.schema-migration.>"
      - "events.security.events.>"
      - "$JS.API.>"
      - "_INBOX.>"
    subscribe:
      - "$JS.API.>"
      - "_INBOX.>"

  # ---------------------------------------------------------------------------
  # sensor-service: IoT/edge device readings, VFDs, LoRa, automation
  # ---------------------------------------------------------------------------
  - name: sensor_service
    description: Sensor/edge devices, VFD readings, LoRa, automation, ST Language runtime
    publish:
      - "events.*.AutomationFBDefinitionsChanged"
      - "events.*.AutomationProgramDeployed"
      - "events.*.AutomationProgramSaved"
      - "events.*.AutomationTagsUpdated"
      - "events.*.EdgeDeviceAlarm"
      - "events.*.EdgeDeviceHeartbeat"
      - "events.*.EdgeDeviceIoData"
      - "events.*.EdgeDeviceResponse"
      - "events.*.IoConfigPushResult"
      - "events.*.LoRaDeviceEvent"
      - "events.*.ParentReadingRouted"
      - "events.*.SensorDeleted"
      - "events.*.SensorDeprovisioned"
      - "events.*.SensorReading"
      - "st.language.>"
      - "events.platform.schema-migration.>"
      - "events.security.events.>"
      - "$JS.API.>"
      - "_INBOX.>"
    subscribe:
      - "request.sensor.>"
      - "sensor.lookup.by-topic"
      - "st.language.>"
      - "$JS.API.>"
      - "_INBOX.>"

  # ---------------------------------------------------------------------------
  # sensor-ingestion: Rust sidecar (ADR-025 / ADR-027) — co-equal producer of
  # SensorReading events alongside sensor-service during the strangler-fig
  # rollout. Distinct CN so the broker can attribute every published event
  # to its actual producer (audit + per-tenant rollback granularity).
  # ---------------------------------------------------------------------------
  - name: sensor-ingestion
    description: Rust ingestion sidecar — MQTT subscribe → COPY → SensorReading event publish
    publish:
      - "events.*.SensorReading"
      - "sensor.lookup.by-topic"
      - "$JS.API.>"
      - "_INBOX.>"
    subscribe:
      - "policy.ingest_backend.>"
      - "_INBOX.>"
      - "$JS.API.>"

