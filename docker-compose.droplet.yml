  # ===========================================================================
  # Reverse Proxy (Nginx)
  # ===========================================================================
  nginx:
    logging: *default-logging
    # Pinned 2026-04-05. To update: verify changelog at https://nginx.org/en/CHANGES, test in staging first.
    image: nginx:1.27.5-alpine
    container_name: aqua-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '8883:8883'
    volumes:
      - ./infrastructure/nginx/droplet.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - gateway-api
      - shell
      - mosquitto
    networks:
      - aqua-network
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:80/nginx-health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Monitoring stack (ORPHAN-090) ──────────────────────────────────────────
  # The droplet exposed every service /metrics but ran NO scraper, so nothing
  # collected them. These four containers consume the configs that already live
  # under infrastructure/monitoring/droplet/ (prometheus.yml + the catalog-
  # GENERATED file_sd/aqua-services.json + rules/ + alertmanager.yml). They are
  # ADDITIVE — no existing service is touched — and stay on the internal network
  # only (no host port published; reach the UI via an ssh tunnel).
  #
  # INFRA-OWNER DECISIONS PENDING before this is deployed:
  #   - Prometheus retention/disk (15d default below; size is the operator's call).
  #   - Alertmanager receivers: alertmanager.yml needs real SMTP/webhook secrets
  #     before any alert actually notifies.
  #   - observability-service /metrics is INTERNAL_API_KEY-gated; its scrape job is
  #     intentionally NOT enabled until that auth header is wired into prometheus.yml.
  prometheus:
    logging: *default-logging
    image: prom/prometheus:v2.54.1
    container_name: aqua-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./infrastructure/monitoring/droplet/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/droplet/rules:/etc/prometheus/rules:ro
      - ./infrastructure/monitoring/droplet/file_sd:/etc/prometheus/file_sd:ro
      - prometheus_data:/prometheus
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 512M

  cadvisor:
    logging: *default-logging
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: aqua-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M

  node-exporter:
    logging: *default-logging
    image: prom/node-exporter:v1.8.2
    container_name: aqua-node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 128M

  alertmanager:
    logging: *default-logging
    image: prom/alertmanager:v0.27.0
    container_name: aqua-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    volumes:
      - ./infrastructure/monitoring/droplet/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 128M
