# AquaMobil PWA security headers — single source of truth (SEC-MEDIUM-052).
#
# WHY a snippet: nginx `add_header` is NOT additive across configuration levels —
# the moment a `location` declares ANY `add_header` of its own (e.g. Cache-Control
# on the service workers or on index.html), it INHERITS NONE of the server-level
# `add_header` directives, silently dropping the Content-Security-Policy and the
# rest of the security set on exactly the responses that matter most (the PWA
# document + the service workers). Defining the headers once here and `include`-ing
# this file in every such location re-applies them without drift.
#
# D14-SC-02: unsafe-inline removed from script-src; Vite production builds emit no inline scripts.
# M-07: unencrypted ws: removed from connect-src; only wss: is permitted in production.
# SEC-NM-014: X-XSS-Protection intentionally omitted (deprecated; CSP supersedes it).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss:; font-src 'self'; manifest-src 'self';" always;
