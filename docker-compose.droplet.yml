# =============================================================================
# Aquaculture Platform - DigitalOcean Droplet (4 CPU / 8GB RAM)
#
# All services enabled. Total memory budget: ~7GB
#
# Usage:
#   docker compose -f docker-compose.droplet.yml pull
#   docker compose -f docker-compose.droplet.yml up -d
# =============================================================================

networks:
  aqua-network:
    driver: bridge
  aqua-internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:

services:
  # ===========================================================================
  # Infrastructure
  # ===========================================================================

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: aqua-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquaculture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-aquaculture}
      POSTGRES_SHARED_BUFFERS: 512MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1536MB
      POSTGRES_WORK_MEM: 16MB
      POSTGRES_MAINTENANCE_WORK_MEM: 128MB
    command: >
      postgres
      -c max_connections=300
      -c search_path=public,auth,admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquaculture}"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aqua-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required} --maxmemory 192mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: aqua-nats
    restart: unless-stopped
    command: ["--jetstream", "--store_dir=/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: aqua-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Backend Services
  # ===========================================================================

  gateway-api:
    image: ghcr.io/okan-wqm/aquaculture_platform/gateway-api:latest
    container_name: aqua-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=384'
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-aquaculture}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      AUTH_SERVICE_URL: http://auth-service:3000/graphql
      FARM_SERVICE_URL: http://farm-service:3000/graphql
      SENSOR_SERVICE_URL: http://sensor-service:3000/graphql
      ALERT_SERVICE_URL: http://alert-engine:3000/graphql
      HR_SERVICE_URL: http://hr-service:3000/graphql
      BILLING_SERVICE_URL: http://billing-service:3000/graphql
      NOTIFICATION_SERVICE_URL: http://notification-service:3000/graphql
      HYDROPONICS_SERVICE_URL: http://hydroponics-service:3000/graphql
      ADMIN_SERVICE_URL: http://admin-api-service:3000/graphql
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-aquaculture}
      MINIO_REGION: us-east-1
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      WS_CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      THROTTLE_DEFAULT_LIMIT: 500
      DATABASE_SYNC: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - aqua-network
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  auth-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/auth-service:latest
    container_name: aqua-auth
    restart: unless-stopped
    environment:
      NODE_ENV: production
