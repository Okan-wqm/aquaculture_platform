# ---------------------------------------------------------------------------
# NetworkPolicy — backend services
# SEC-007: replace 0.0.0.0/0 egress with specific known external endpoints
# SEC-008: use kubernetes.io/metadata.name instead of custom name: label
# ---------------------------------------------------------------------------
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
  namespace: aquaculture
spec:
  podSelector:
    matchLabels:
      tier: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: backend
        - podSelector:
            matchLabels:
              tier: frontend
        # SEC-008: use auto-set kubernetes.io/metadata.name label (set since k8s 1.21)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow intra-cluster backend communication
    - to:
        - podSelector:
            matchLabels:
              tier: backend
    # Allow database access
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: postgres
    # Allow Redis access
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: redis
    # Allow NATS messaging
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: nats
    # Allow cluster DNS (kube-dns)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # SEC-007: restrict external HTTPS to specific known IP ranges only
    # Replace these placeholder CIDRs with actual IPs of your SMTP relay,
    # payment provider, SMS API, etc. Do NOT use 0.0.0.0/0.
    # Example: Mailgun US region SMTP relay (replace with actual IPs)
    - to:
        - ipBlock:
            # SMTP relay (e.g., Mailgun, SendGrid) — replace with actual CIDR
            cidr: 198.61.254.0/24
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 587
    # Payment provider (e.g., Stripe) — replace with actual CIDR
    - to:
        - ipBlock:
            cidr: 54.187.174.169/32
      ports:
        - protocol: TCP
          port: 443

---
# NetworkPolicy for frontend pods
# SEC-008: use kubernetes.io/metadata.name label
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-network-policy
  namespace: aquaculture
spec:
  podSelector:
    matchLabels:
      tier: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        # SEC-008: use auto-set kubernetes.io/metadata.name label
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
