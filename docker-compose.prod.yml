      - ./certs/nats/ca-cert.pem:/etc/ssl/nats/ca-cert.pem:ro
      - ./certs/nats/clients/billing_service-cert.pem:/etc/ssl/nats/clients/billing_service-cert.pem:ro
      - ./certs/nats/clients/billing_service-key.pem:/etc/ssl/nats/clients/billing_service-key.pem:ro
