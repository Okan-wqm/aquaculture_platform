# observability-service connects as a CONSUMER to NATS (migration audit sink +
# security events sink). Phase 6 Step 6 added SchemaMigrationEventsConsumer
# which subscribes to `events.platform.schema-migration.>`; the existing
# SecurityEventsConsumerService subscribes to `events.security.events.>`. Both
# require a cert-CN-authenticated NATS identity per ADR-015. Registered in
# infrastructure/nats/services.yaml as `observability_service` so the cert
# generator mints clients/observability_service-{cert,key}.pem and
# generate-nats-conf.py emits the matching `CN=observability_service` user.
x-nats-observability-env: &nats-observability-env
  NATS_URL: tls://nats:4222
  NATS_TLS_CA: /etc/ssl/nats-ca.pem
  NATS_TLS_CERT: /etc/ssl/nats-clients/observability_service-cert.pem
  NATS_TLS_KEY: /etc/ssl/nats-clients/observability_service-key.pem
  NATS_TLS_ENABLED: 'true'

