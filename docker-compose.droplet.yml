      - *nats-client-key-mount
      - *jwt-public-key-mount
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  hydroponics-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/hydroponics-service:${TAG:-latest}
    container_name: aqua-hydroponics
    restart: unless-stopped
    environment:
      SERVICE_NAME: hydroponics-service
      NODE_ENV: production
      HYDROPONICS_SERVICE_PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=256'
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.suderra.com}
      DATABASE_HOST: postgres
      DATABASE_SSL: "true"
      DATABASE_SSL_REJECT_UNAUTHORIZED: "false"
      DATABASE_PORT: 5432
      # SEC-015 (CRITICAL-001): Per-service DB role — hydroponics_service can only access hydroponics schema
      DATABASE_USER: ${HYDROPONICS_SERVICE_DB_USER:-hydroponics_service}
      DATABASE_PASSWORD: ${HYDROPONICS_SERVICE_DB_PASS:-${POSTGRES_PASSWORD:-changeme}}
      DATABASE_NAME: ${POSTGRES_DB:-aquaculture}
      DATABASE_SYNC: "false" # ARCH-DB-001: Production'da synchronize kapalı, migration kullanılmalı
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      # SEC-015 (CRITICAL-002): Per-service NATS credentials
      <<: *nats-hydroponics-env
      JWT_PUBLIC_KEY_PATH: /etc/ssl/jwt/public.pem
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # WS10: ADR-016 Phase E Phase 1 — schema pre-applied by aqua-db-migrate.
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - *nats-ca-mount
      - *nats-clients-mount
      - *nats-client-cert-mount
      - *nats-client-key-mount
      - *jwt-public-key-mount
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

