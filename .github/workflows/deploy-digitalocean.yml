# =============================================================================
# DigitalOcean Droplet Deployment
#
# Fixes applied:
# - GHCR lowercase image paths (Docker registry requirement)
# - Frontend artifact upload (was missing web/*/dist)
# - Deploy condition: only deploys when build succeeds
# - Build timeout: 30 min max
# - Optimized for 2GB RAM droplet (uses docker-compose.droplet.yml)
# =============================================================================

name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (comma-separated, or "all")'
        required: false
        default: 'all'

env:
  REGISTRY: ghcr.io
  TAG: ${{ github.sha }}

# Cancel in-progress deploys for the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Prepare - Set lowercase image prefix & detect changes
  # ===========================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.vars.outputs.image_prefix }}
      has_backend_changes: ${{ steps.changes.outputs.has_backend }}
      has_frontend_changes: ${{ steps.changes.outputs.has_frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set variables
        id: vars
        run: |
          # GHCR requires lowercase image paths
          REPO="${{ github.repository }}"
          echo "image_prefix=ghcr.io/${REPO,,}" >> $GITHUB_OUTPUT

      - name: Detect changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || echo "ALL")

          if [ "$CHANGED" = "ALL" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_backend=true" >> $GITHUB_OUTPUT
            echo "has_frontend=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Shared libs change = rebuild everything
          if echo "$CHANGED" | grep -q "^libs/\|^platform/"; then
            echo "has_backend=true" >> $GITHUB_OUTPUT
            echo "has_frontend=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          HAS_BACKEND=$(echo "$CHANGED" | grep -q "^apps/" && echo true || echo false)
          HAS_FRONTEND=$(echo "$CHANGED" | grep -q "^web/" && echo true || echo false)
          echo "has_backend=$HAS_BACKEND" >> $GITHUB_OUTPUT
          echo "has_frontend=$HAS_FRONTEND" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Build with NX
  # ===========================================================================
  build:
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-deploy-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-deploy-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            nx-deploy-${{ runner.os }}-

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps --ignore-scripts --no-audit
          # npm ci --ignore-scripts skips platform binary downloads.
          # Use npm rebuild to properly install them without hanging.
          npm rebuild esbuild @swc/core
          node node_modules/nx/bin/post-install || true

      - name: Build backend services
        run: |
          npx nx run-many -t build --parallel=2 \
            --projects=gateway-api,auth-service,farm-service,sensor-service,admin-api-service,alert-engine,notification-service,hr-service,billing-service,hydroponics-service
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NX_DAEMON: 'false'

      - name: Build frontend modules
        run: |
          npx nx run-many -t build --parallel=2 \
            --projects=shared-ui,shell,dashboard,farm-module,sensor-module,admin-panel,hr-module,tenant-admin,hydroponics-module
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NX_DAEMON: 'false'

      # Upload backend artifacts (dist/apps/*)
      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: dist/
          retention-days: 1

      # Upload frontend artifacts (web/*/dist/)
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            web/shell/dist/
            web/modules/*/dist/
          retention-days: 1

  # ===========================================================================
  # Build Backend Docker Images
  # ===========================================================================
  build-backend-images:
    needs: [prepare, build]
    if: needs.prepare.outputs.has_backend_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service:
          - gateway-api
          - auth-service
          - farm-service
          - sensor-service
          - admin-api-service
          - alert-engine
          - notification-service
          - hr-service
          - billing-service
          - hydroponics-service
    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: dist/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.backend.simple
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.service }}:${{ env.TAG }}
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.service }}:latest
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}/${{ matrix.service }}:buildcache,mode=max

  # ===========================================================================
  # Build Frontend Docker Images
  # ===========================================================================
  build-frontend-images:
    needs: [prepare, build]
    if: needs.prepare.outputs.has_frontend_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - module: shell
            dockerfile: infrastructure/docker/Dockerfile.shell
            module_path: web/shell
          - module: dashboard
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/dashboard
          - module: farm-module
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/farm-module
          - module: sensor-module
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/sensor-module
          - module: hr-module
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/hr-module
          - module: admin-panel
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/admin-panel
          - module: tenant-admin
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/tenant-admin
          - module: hydroponics-module
            dockerfile: infrastructure/docker/Dockerfile.microfrontend.simple
            module_path: web/modules/hydroponics-module
    steps:
      - uses: actions/checkout@v4

      # Download frontend artifacts to workspace root (preserves web/*/dist/ paths)
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.module }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.module }}:${{ env.TAG }}
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.module }}:latest
          build-args: |
            MODULE_PATH=${{ matrix.module_path }}
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}/${{ matrix.module }}:buildcache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image_prefix }}/${{ matrix.module }}:buildcache,mode=max

  # ===========================================================================
  # Deploy to DigitalOcean Droplet
  # ===========================================================================
  deploy:
    needs: [prepare, build, build-backend-images, build-frontend-images]
    # Only deploy if build succeeded, and at least one image build succeeded or was skipped
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.build-backend-images.result == 'success' || needs.build-backend-images.result == 'skipped') &&
      (needs.build-frontend-images.result == 'success' || needs.build-frontend-images.result == 'skipped') &&
      (needs.build-backend-images.result == 'success' || needs.build-frontend-images.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /var/aqua-saas

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Logging into GHCR ==="
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "=== Pulling latest images ==="
            docker compose -f docker-compose.droplet.yml pull --ignore-pull-failures

            echo "=== Starting services ==="
            docker compose -f docker-compose.droplet.yml up -d --no-build --remove-orphans

            echo "=== Waiting for services ==="
            sleep 30

            echo "=== Health check ==="
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "Gateway API: OK"
            else
              echo "Gateway API: not responding yet (may still be starting)"
            fi

            echo "=== Cleanup old images ==="
            docker image prune -f --filter "until=24h"

            echo "=== Container status ==="
            docker compose -f docker-compose.droplet.yml ps

            echo "=== Deployment completed at $(date) ==="

      - name: Verify deployment
        run: |
          echo "Deployment initiated successfully"
          echo "Server: ${{ secrets.DROPLET_HOST }}"
          echo "Commit: ${{ github.sha }}"
