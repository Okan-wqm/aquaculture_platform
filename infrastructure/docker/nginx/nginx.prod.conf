# =============================================================================
# Aquaculture Platform - Production Server Configuration
# Place this in /etc/nginx/conf.d/default.conf
# =============================================================================

# Upstream definitions
upstream gateway {
    server gateway-api:3000;
    keepalive 32;
}

upstream shell {
    server shell:80;
}

upstream aquamobil {
    server aquamobil:80;
}

upstream dashboard {
    server dashboard:80;
}

upstream farm-module {
    server farm-module:80;
}

upstream hr-module {
    server hr-module:80;
}

upstream sensor-module {
    server sensor-module:80;
}

upstream hydroponics-module {
    server hydroponics-module:80;
}

upstream admin-panel {
    server admin-panel:80;
}

upstream tenant-admin {
    server tenant-admin:80;
}

# ==========================================================================
# Main Application Server (Port 80)
# ==========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # GraphQL API
    location /graphql {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # WebSocket support for subscriptions
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # REST API
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mobile PWA (AquaMobil) - /mobile path
    location /mobile/ {
        proxy_pass http://aquamobil/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Microfrontend modules
    location /mf/dashboard/ {
        proxy_pass http://dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /mf/farm/ {
        proxy_pass http://farm-module/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /mf/hr/ {
        proxy_pass http://hr-module/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /mf/sensor/ {
        proxy_pass http://sensor-module/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /mf/hydroponics/ {
        proxy_pass http://hydroponics-module/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /mf/admin/ {
        proxy_pass http://admin-panel/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /mf/tenant/ {
        proxy_pass http://tenant-admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Shell (main frontend) - catch all
    location / {
        proxy_pass http://shell;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==========================================================================
# Mobile App Subdomain (m.domain.com or mobile.domain.com)
# ==========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name m.* mobile.*;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # GraphQL API proxy
    location /graphql {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mobile PWA
    location / {
        proxy_pass http://aquamobil;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
