{{/*
=============================================================================
Aquaculture Platform - Internal Leaf Certificates (SECURITY MEDIUM-002)
=============================================================================
NATS, Redis and PostgreSQL server certs plus one NATS client cert per runtime
identity are issued (and auto-renewed) by the internal CA.
Each Certificate produces a Kubernetes Secret with keys tls.crt / tls.key /
ca.crt — the shape our services' connection factories already consume.

Renewal cadence default: 1 year lifetime, renew at 30 days before expiry.
Adjust per-service via values.yaml certManager.internal.leafDuration /
leafRenewBefore if a specific compliance window demands shorter rotation.
=============================================================================
*/}}
{{- if and .Values.certManager .Values.certManager.internal .Values.certManager.internal.enabled }}
{{- $leafDuration := .Values.certManager.internal.leafDuration | default "8760h" }}
{{- $leafRenewBefore := .Values.certManager.internal.leafRenewBefore | default "720h" }}
{{- $issuerRef := printf "%s-internal-ca-issuer" (include "aquaculture.fullname" .) }}

{{/* NATS server certificate */}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "aquaculture.fullname" . }}-nats-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aquaculture.labels" . | nindent 4 }}
spec:
  secretName: {{ include "aquaculture.fullname" . }}-nats-server-tls
  duration: {{ $leafDuration | quote }}
  renewBefore: {{ $leafRenewBefore | quote }}
  commonName: nats
  dnsNames:
    - nats
    - {{ include "aquaculture.fullname" . }}-nats
    - {{ include "aquaculture.fullname" . }}-nats.{{ .Values.namespace }}.svc.cluster.local
  usages:
    - server auth
    - digital signature
    - key encipherment
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: {{ $issuerRef }}
    kind: Issuer
    group: cert-manager.io

---
{{/* Redis server certificate */}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "aquaculture.fullname" . }}-redis-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aquaculture.labels" . | nindent 4 }}
spec:
  secretName: {{ include "aquaculture.fullname" . }}-redis-server-tls
  duration: {{ $leafDuration | quote }}
  renewBefore: {{ $leafRenewBefore | quote }}
  commonName: redis
  dnsNames:
    - redis
    - {{ include "aquaculture.fullname" . }}-redis-master
    - {{ include "aquaculture.fullname" . }}-redis-master.{{ .Values.namespace }}.svc.cluster.local
  usages:
    - server auth
    - digital signature
    - key encipherment
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: {{ $issuerRef }}
    kind: Issuer
    group: cert-manager.io

---
{{/* PostgreSQL server certificate */}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "aquaculture.fullname" . }}-postgres-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aquaculture.labels" . | nindent 4 }}
spec:
  secretName: {{ include "aquaculture.fullname" . }}-postgres-server-tls
  duration: {{ $leafDuration | quote }}
  renewBefore: {{ $leafRenewBefore | quote }}
  commonName: postgres
  dnsNames:
    - postgres
    - {{ include "aquaculture.fullname" . }}-postgresql
    - {{ include "aquaculture.fullname" . }}-postgresql.{{ .Values.namespace }}.svc.cluster.local
  usages:
    - server auth
    - digital signature
    - key encipherment
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: {{ $issuerRef }}
    kind: Issuer
    group: cert-manager.io

---
{{/*
  Per-runtime NATS client certificates. The generated roster and broker ACL
  are both derived from infrastructure/nats/services.yaml; cert CN is the
  authorization identity under verify_and_map.
*/}}
{{- $identityRegistry := .Files.Get "files/nats-service-identities.yaml" | fromYaml }}
{{ range $index, $identity := $identityRegistry.identities }}
{{ if gt $index 0 }}
---
{{ end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "aquaculture.natsClientSecretName" (list $ $identity) }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "aquaculture.labels" $ | nindent 4 }}
spec:
  secretName: {{ include "aquaculture.natsClientSecretName" (list $ $identity) }}
  duration: {{ $leafDuration | quote }}
  renewBefore: {{ $leafRenewBefore | quote }}
  commonName: {{ $identity | quote }}
  usages:
    - client auth
    - digital signature
    - key encipherment
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: {{ $issuerRef }}
    kind: Issuer
    group: cert-manager.io
{{ end }}

{{- end }}
