name: Quality Gates

# =============================================================================
# Phase 2 of docs/plans/2026-04-17-agentic-post-audit-consolidation-plan.md.
#
# Runs the tools/gates/**.ts CLIs on every PR:
#   - banned-phrase        : scans diff + commit bodies for CLAUDE.md banned
#                            phrases (live)
#   - migration-sql-lint   : enforces data-expert's migration-delta safety
#                            invariants on newly-added or modified migration
#                            files — R1 destructive marker, R2 single-step
#                            NOT NULL, R3 non-concurrent index on live table,
#                            R4 session-scoped SET search_path, R5 overbroad
#                            EXCEPTION catch (live)
#   - tier-claim-lint      : validates `// tier-N:` comment discipline
#                            per _shared/tier-claim-syntax.md — range,
#                            justification, mechanism reference,
#                            block open/close symmetry, tier-4-in-domain
#                            allowlist (live)
#   - finding-registry     : verify subcommand — hash-chain integrity
#                            mirror of the Jest invariant (live)
#
# commit-msg-validator lives in closes-footer-check.yml because its surface
# is the commit trailer itself, not a diff walk.
#
# These gates are the Tier-3 automated enforcement backing CLAUDE.md's
# "Architectural Approach" section (no patches, no workarounds, no deferrals
# without owner + deadline + finding-ID, OR plan-phase reference).
# =============================================================================

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  banned-phrase-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # SEC-CI-002: pinned to full SHA (infra-expert invariant)
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies (minimal — ts-node only)
        # Dependency resolution must be peer-clean. This job is a gate, not
        # a place to hide package graph conflicts.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Determine commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            # On first push to a new branch, github.event.before is 40-zero
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE=$(git rev-parse HEAD~1)
            fi
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "Checking range: $BASE..$HEAD"

      # ORPHAN-012 fix: assert pinned ts-node + typescript versions
      # BEFORE any gate runs. A version drift here means subsequent
      # gate output is suspect (TS5103/TS5107 noise); fail fast.
      - name: Verify pinned gate dependencies (ORPHAN-012)
        run: |
          ./node_modules/.bin/ts-node --transpile-only tools/gates/check-pin.ts

      - name: Run banned-phrase gate
        id: banned-phrase
        run: |
          ./node_modules/.bin/ts-node --project tools/gates/tsconfig.json \
            tools/gates/banned-phrase.ts \
            --mode=range "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"

      # Round-2 cluster-0: code-construct sibling of the phrase gate.
      # Catches `as any` / ts-ignore / test-skip / eslint-disable / bare
      # getRepository( on ADDED lines — including spec files, where
      # .eslintrc relaxes no-explicit-any (the bypass this step closes).
      - name: Run banned-construct gate
        if: always()
        run: |
          ./node_modules/.bin/ts-node --project tools/gates/tsconfig.json \
            tools/gates/banned-construct.ts \
            --mode=range "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"

      # tools/ lives outside every Nx project, so `affected` and `run-many`
      # both skip it and these specs ran nowhere. That is not acceptable for
      # code with production intervention authority: the T0 supervisor
      # restarts containers on the droplet, and the watchdog probe decides
      # who gets paged.
      - name: Run tools test suites (supervisor + watchdog)
        if: always()
        run: npm run tools:test

      - name: Run dependency-policy gate
        if: always()
        run: node scripts/ci/check-dependency-policy.mjs

      - name: Run Apollo CSRF prevention gate
        if: always()
        run: node scripts/ci/check-apollo-csrf-prevention.mjs

      - name: Run messaging tenant routing gate
        if: always()
        run: node scripts/ci/check-messaging-tenant-entity-routing.mjs

      - name: Run farm-service enterprise guardrails
        if: always()
        run: |
          ./node_modules/.bin/ts-node --project tools/gates/tsconfig.json \
            tools/gates/farm-service-enterprise-guardrails.ts \
            --mode=range "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"

      - name: Run Apollo Router static fallback gate
        if: always()
        run: node scripts/apollo-router/check-router-static-fallback.mjs

      # `if: always()` so a banned-phrase failure does not hide a migration
      # finding. Both gates independent; surfacing both failures in one run
      # saves a retry cycle.
      - name: Run migration-sql-lint gate
        if: always()
        run: |
          ./node_modules/.bin/ts-node --project tools/gates/tsconfig.json \
            tools/gates/migration-sql-lint.ts \
            --mode=range "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"

      - name: Run tier-claim-lint gate
        if: always()
        run: |
          ./node_modules/.bin/ts-node --project tools/gates/tsconfig.json \
            tools/gates/tier-claim-lint.ts \
            --mode=range "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"

      - name: Verify finding registry integrity (CLI mirror)
        if: always()
        run: |
          ./node_modules/.bin/ts-node --project tools/gates/tsconfig.json \
            tools/gates/finding-registry.ts verify

      # eslint-rules-dist-drift: source/compiled-output parity.
      # tools/eslint-rules/dist/ is committed (see .gitignore exception)
      # so every CI runner + deploy job has a functional
      # eslint-plugin-aquaculture without a runtime build step. The
      # invariant is that dist/ matches what `tsc -p tsconfig.json`
      # would produce from the current source. Without this gate, a
      # contributor could edit rules/*.ts without rebuilding, and
      # production would load stale compiled rules — silent divergence.
      - name: ESLint-rules dist drift check
        if: always()
        run: |
          (cd tools/eslint-rules && npm run build)
          if ! git diff --exit-code tools/eslint-rules/dist/ ; then
            echo "::error::tools/eslint-rules/dist/ is out of sync with source. Run \`(cd tools/eslint-rules && npm run build)\` and commit the updated dist/."
            exit 1
          fi

      # ORPHAN-MEDIUM-117: the committed tools/quality/format-scope.json must
      # match what `format-scope generate` derives from the current tree (the
      # manifest assigns every formattable file a class + owner). Left unenforced
      # it drifted ~2000 lines until the gate was red on main and silently
      # ignored. Enforced here it stays synchronized: a PR that adds or removes an
      # in-scope file must run `npm run quality:format-scope:generate` and commit
      # the regenerated manifest. Same committed-artifact↔source contract as the
      # ESLint-rules dist drift check above.
      - name: Run format-scope drift gate
        if: always()
        run: npm run quality:format-scope:check

  # =============================================================================
  # invariants-fast: promote the Jest invariant suite from a developer-
  # only local gate to a CI hard gate. Before A.4 of the cold-audit
  # remediation, `npm run invariants:fast` was never invoked in CI — it
  # covered semantics the CLI gates cannot (knowledge-ssot consistency,
  # schema conformance of registry entries, orchestrator routing
  # coverage, agent roster uniqueness, etc.), and the suite had drifted
  # to 3 red tests by 2026-04-22. Making it a required job means the
  # next drift breaks the PR, not the next audit.
  #
  # Kept as a separate job (not folded into banned-phrase-gate) so that
  # a gate-CLI change and an invariant-spec change surface in
  # independently-retryable lanes of the GitHub checks UI.
  # =============================================================================
  invariants-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Jest invariants (layer-1 + layer-3 fast subset)
        # entity-diff-implies-migration.spec.ts runs the entity-diff-witness
        # gate, which honours `ENTITY-DIFF-OK:` PR-body waivers via PR_BODY.
        # Without this env the invariant cannot see the waiver and fails any
        # entity edit that has no accompanying migration (e.g. a read-replica
        # entity whose change is pure TypeScript typing, zero DDL). Mirrors
        # db-migration-check.yml, which already sets PR_BODY for the same gate.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: npm run invariants:fast
