name: Closes Footer Check

# =============================================================================
# Closes: Footer Traceability Gate — Phase 6 of abstract-brewing-mochi plan
#
# Enforces CLAUDE.md "Review Finding Traceability" rule:
#   Every fix(), security(), or refactor(agentic,phase-*) commit MUST carry
#   a `Closes: docs/reviews/<agent>/<date>-<topic>.md#<FINDING-ID>` trailer,
#   AND the referenced review file must exist, AND the FINDING-ID must be
#   present in docs/reviews/_registry/findings.jsonl.
#
# Missing / unresolvable trailers fail the PR, preventing agent review
# findings from silently rotting without resolution.
#
# Reference: /root/.claude/plans/abstract-brewing-mochi.md#Phase-6
# =============================================================================

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-closes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # SEC-CI-002: pinned to full SHA per infra-expert rule
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # need full history to walk PR commit range

      - name: Determine PR commit range
        id: range
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Validating range: $BASE_SHA..$HEAD_SHA"

      - name: Validate Closes: trailers
        run: node tools/scripts/validate-closes-footer.mjs "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"

      - name: Validate registry integrity (hash chain)
        run: |
          # Re-compute the hash chain to detect mid-chain tampering.
          # Uses the same canonical-JSON + sha256hex algorithm as
          # tools/scripts/seed-finding-registry.mjs so this is a
          # self-contained check with no external deps.
          node -e "
          const { createHash } = require('crypto');
          const { readFileSync, existsSync } = require('fs');
          const registry = 'docs/reviews/_registry/findings.jsonl';
          if (!existsSync(registry)) { console.log('No registry file; skipping.'); process.exit(0); }
          const lines = readFileSync(registry, 'utf8').trim().split('\n').filter(Boolean);
          function canon(v){if(v===null||typeof v!=='object')return JSON.stringify(v);if(Array.isArray(v))return '['+v.map(canon).join(',')+']';const k=Object.keys(v).sort();return '{'+k.map(x=>JSON.stringify(x)+':'+canon(v[x])).join(',')+'}';}
          let prev = '0'.repeat(64);
          for (let i = 0; i < lines.length; i++) {
            const e = JSON.parse(lines[i]);
            if (e.prev_hash !== prev) { console.error('Chain break at entry', i, e.id); process.exit(1); }
            const { content_hash, ...rest } = e;
            const recomp = createHash('sha256').update(canon(rest), 'utf8').digest('hex');
            if (recomp !== content_hash) { console.error('Hash mismatch at entry', i, e.id); process.exit(1); }
            prev = content_hash;
          }
          console.log('Registry chain valid (' + lines.length + ' entries).');
          "
