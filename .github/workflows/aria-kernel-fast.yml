name: aria-kernel-fast

# Plan ARIA-V2 §3.7 (Phase 6) — fast pre-merge gate.
#   * push: trigger added so snowball commits get a green/red signal
#     without waiting for the full kernel cycle (covers I-25 clause 3).
#   * paths-ignore on docs/** + aria-tools/reports/daily/** so the
#     aria-bot daily commit does not re-fire the gate.
#   * Same hardening surface as aria-kernel.yml / aria-kernel-full.yml.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "aria-kernel/**"
      - "docs/aria/**"
      - ".github/workflows/aria-kernel*.yml"
      - "tools/aria-poc/**"
      - "tools/shared/**"
  push:
    branches:
      - snowball
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "aria-tools/reports/daily/**"

permissions:
  contents: read

concurrency:
  group: aria-kernel-fast-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel:. python3 -m unittest discover aria-kernel -p '*test*.py'
