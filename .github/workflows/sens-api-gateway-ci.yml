name: SENS API Gateway CI

# 2026-04-29: This workflow closes the previous CI blind spot where
# sens-api-gateway changes did not trigger the repository's Rust checks. The
# gateway is a standalone Cargo package, so every command below runs from its
# own manifest directory instead of the repository-root Rust workspace.
on:
  pull_request:
    branches: [main, develop, agentic]
    paths:
      - "sens-api-gateway/**"
      - ".github/workflows/sens-api-gateway-ci.yml"
      - ".github/workflows/edge-agent-release.yml"
      - ".github/workflows/ci-edge.yml"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
  push:
    branches: [main, develop, agentic]
    paths:
      - "sens-api-gateway/**"
      - ".github/workflows/sens-api-gateway-ci.yml"
      - ".github/workflows/edge-agent-release.yml"
      - ".github/workflows/ci-edge.yml"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
  workflow_dispatch: {}

concurrency:
  group: sens-api-gateway-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  SENS_API_GATEWAY_DIR: sens-api-gateway
  # 2026-04-30: CI feature set compiles every software protocol/security path
  # while excluding `sx1302-vendor-hal`, which is a real hardware C HAL build
  # and must fail closed unless vendor/sx1302_hal sources are present.
  SENS_API_GATEWAY_RELEASE_FEATURES: scada-display
  SENS_API_GATEWAY_CI_FEATURES: health,telemetry,metrics,strict-security,scada-display,lorawan,signed-deploy,tpm,st-bytecode,multi-task-scheduler,opc-ua-server,live-debug,license-enforce

jobs:
  release-contract:
    name: edge release contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate Edge release contract
        run: |
          set -euo pipefail
          if grep -q "workflow_dispatch" .github/workflows/edge-agent-release.yml; then
            echo "edge-agent-release.yml must not allow arbitrary manual release dispatch"
            exit 1
          fi
          grep -q "EDGE_RELEASE_FEATURES: scada-display" .github/workflows/edge-agent-release.yml
          grep -q "Release ref contract" .github/workflows/edge-agent-release.yml
          grep -q 'refs/tags/' .github/workflows/edge-agent-release.yml
          grep -q "cargo-metadata.sbom.json" .github/workflows/edge-agent-release.yml
          grep -q "intoto.jsonl" .github/workflows/edge-agent-release.yml
          grep -q "NOTICE.md" .github/workflows/edge-agent-release.yml
          grep -q 'version = "2.0.0-rc.4"' sens-api-gateway/Cargo.toml
          if grep -q "apps/admin-api-service/src/edge" docs/evidence/sens-api-gateway-edge-v2.0.0-rc4.md; then
            grep -q "Excluded" docs/evidence/sens-api-gateway-edge-v2.0.0-rc4.md
          fi

  format:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.88.0
          components: rustfmt

      # 2026-04-29: Formatting is a hard gate for the gateway package so
      # generated diffs cannot hide behavioral changes in large PLC/security
      # edits. The command is scoped to sens-api-gateway to avoid coupling this
      # package to unrelated repository-root Rust formatting state.
      - name: Check gateway formatting
        working-directory: ${{ env.SENS_API_GATEWAY_DIR }}
        run: cargo fmt -- --check

  check-default:
    name: cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.88.0

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: sens-api-gateway -> target
          shared-key: sens-api-gateway-default
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/agentic' }}

      # 2026-04-29: Default-feature compilation is the fast PR signal for the
      # production binary shape used by the current gateway fleet. It catches
      # type and link-contract regressions without requiring TPM system libs.
      - name: Check gateway default build
        working-directory: ${{ env.SENS_API_GATEWAY_DIR }}
        run: cargo check --locked

  check-release-features:
    name: cargo check --features scada-display
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.88.0

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: sens-api-gateway -> target
          shared-key: sens-api-gateway-release-features
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/agentic' }}

      # Release profile parity gate. The tag-only release workflow builds
      # this exact feature tier across the cross targets; this host-native
      # PR gate catches manifest/profile drift before a release tag is pushed.
      - name: Check gateway release feature profile
        working-directory: ${{ env.SENS_API_GATEWAY_DIR }}
        run: cargo check --locked --features "$SENS_API_GATEWAY_RELEASE_FEATURES"

  check-ci-features:
    name: cargo check --release --all-targets --features curated
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.88.0

      # 2026-04-29: The TPM feature depends on tss-esapi/tss2-sys, which needs
      # pkg-config plus the tpm2-tss development headers at compile time. Local
      # verification failed before code compilation when these packages were
      # missing; CI installs them explicitly so all feature gates are real.
      - name: Install TPM build dependencies
        uses: ./.github/actions/install-tpm-build-dependencies

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: sens-api-gateway -> target
          shared-key: sens-api-gateway-ci-features
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/agentic' }}

      # 2026-04-30: This is the architectural PR guardrail for optional
      # software modules. Hardware HAL validation is a separate explicit gate
      # because `sx1302-vendor-hal` requires Semtech C sources and must not be
      # simulated by accident.
      - name: Check gateway CI feature targets
        working-directory: ${{ env.SENS_API_GATEWAY_DIR }}
        run: cargo check --locked --release --all-targets --features "$SENS_API_GATEWAY_CI_FEATURES"

  clippy:
    name: cargo clippy --all-targets --features curated
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.88.0
          components: clippy

      - name: Install TPM build dependencies
        uses: ./.github/actions/install-tpm-build-dependencies

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: sens-api-gateway -> target
          shared-key: sens-api-gateway-clippy
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/agentic' }}

      # 2026-04-30: Clippy runs against the CI software feature set. The
      # hardware HAL feature is excluded here and covered by the explicit HAL
      # gate so missing vendor C sources cannot hide a software regression.
      #
      # 2026-05-12: The gateway package carries a large pre-existing hardening
      # lint backlog through Cargo.toml package lints. Keep this PR gate focused
      # on correctness/perf plus suspicious regressions while explicitly
      # allowing the tracked legacy baseline until that cleanup has its own PR.
      - name: Lint gateway CI feature targets
        working-directory: ${{ env.SENS_API_GATEWAY_DIR }}
        run: >
          cargo clippy --locked --all-targets --features "$SENS_API_GATEWAY_CI_FEATURES" --
          -D clippy::correctness
          -D clippy::suspicious
          -D clippy::perf
          -A clippy::await_holding_lock
          -A clippy::cmp_owned
          -A clippy::dbg_macro
          -A clippy::expect_fun_call
          -A clippy::expect_used
          -A clippy::indexing_slicing
          -A clippy::large_stack_arrays
          -A clippy::print_stderr
          -A clippy::print_stdout
          -A clippy::todo
          -A clippy::unimplemented
          -A clippy::unnecessary_to_owned
          -A clippy::unwrap_used
          -A clippy::vec_init_then_push

  test:
    name: cargo test --all-targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.88.0

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: sens-api-gateway -> target
          shared-key: sens-api-gateway-test
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/agentic' }}

      # 2026-04-29: The gateway test suite is intentionally left as a CI gate
      # rather than a local-only convention because small edge servers are prone
      # to SIGKILL under cargo's test-link workload. CI gives deterministic CPU,
      # memory, and logs for the full enterprise validation pass.
      - name: Run gateway tests
        working-directory: ${{ env.SENS_API_GATEWAY_DIR }}
        run: cargo test --locked --all-targets --no-fail-fast -- --test-threads=1

  test-ci-features:
    name: cargo test --all-targets --features curated
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.88.0

      - name: Install TPM build dependencies
        uses: ./.github/actions/install-tpm-build-dependencies

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: sens-api-gateway -> target
          shared-key: sens-api-gateway-test-ci-features
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/agentic' }}

      # 2026-04-30: CI feature tests cover optional software modules without
      # requiring SX1302 vendor C sources. Hardware HAL builds remain explicit.
      - name: Run gateway CI feature tests
        working-directory: ${{ env.SENS_API_GATEWAY_DIR }}
        run: cargo test --locked --all-targets --features "$SENS_API_GATEWAY_CI_FEATURES" --no-fail-fast -- --test-threads=1

  sx1302-vendor-hal-contract:
    name: sx1302-vendor-hal contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.88.0

      # 2026-04-30: The real HAL build is intentionally fail-closed: if a
      # release or HIL operator asks for `sx1302-vendor-hal`, Semtech C sources
      # must be present instead of silently compiling a simulated concentrator.
      - name: Check SX1302 HAL vendor source presence
        working-directory: ${{ env.SENS_API_GATEWAY_DIR }}
        run: test -d vendor/sx1302_hal/libloragw/src

  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install cargo-deny
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-deny

      - name: Check gateway supply-chain policy
        working-directory: ${{ env.SENS_API_GATEWAY_DIR }}
        run: cargo deny check advisories bans licenses sources

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install cargo-audit
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-audit

      # 2026-04-29: Security audit is scoped to the gateway lockfile so RustSec
      # regressions in the edge binary are visible in the gateway PR itself.
      # The explicit ignores mirror sens-api-gateway/deny.toml; each is a
      # tracked dependency-risk finding with owner/deadline in that policy file,
      # so cargo-audit and cargo-deny cannot drift silently —
      # scripts/ci/check-advisory-ignore-sync.ts enforces the lock-step.
      # 2026-06-11 (RUST-CVE-001): the rumqttc-chain ignores
      # (RUSTSEC-2026-0098/0099/0049/0104, RUSTSEC-2025-0134) were removed —
      # vendored fork at crates/local-rumqttc; deny.toml [bans] guards regression.
      - name: Audit gateway lockfile
        working-directory: ${{ env.SENS_API_GATEWAY_DIR }}
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2024-0388 \
            --ignore RUSTSEC-2023-0089 \
            --ignore RUSTSEC-2026-0173

  doc:
    name: cargo doc -D warnings
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.88.0

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: sens-api-gateway -> target
          shared-key: sens-api-gateway-doc
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/agentic' }}

      # 2026-04-29: Rustdoc warnings are release blockers because internal API
      # docs are part of the gateway's dated security evidence trail.
      - name: Build gateway docs
        working-directory: ${{ env.SENS_API_GATEWAY_DIR }}
        run: cargo doc --locked --no-deps --document-private-items

  sens-api-gateway-summary:
    name: Sens API Gateway summary
    needs:
      - release-contract
      - format
      - check-default
      - check-release-features
      - check-ci-features
      - clippy
      - test
      - test-ci-features
      - deny
      - audit
      - doc
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on skipped, cancelled or failed gateway dependencies
        run: |
          for result in \
            "${{ needs.release-contract.result }}" \
            "${{ needs.format.result }}" \
            "${{ needs.check-default.result }}" \
            "${{ needs.check-release-features.result }}" \
            "${{ needs.check-ci-features.result }}" \
            "${{ needs.clippy.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.test-ci-features.result }}" \
            "${{ needs.deny.result }}" \
            "${{ needs.audit.result }}" \
            "${{ needs.doc.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Sens API Gateway dependency did not succeed: $result"
              exit 1
            fi
          done
