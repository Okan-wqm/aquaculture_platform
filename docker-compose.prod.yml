      - ./certs/jwt/public.pem:/var/run/jwt/public.pem:ro
      # SECURITY (HIGH-002): NATS mTLS — CA plus admin-api's dedicated cert/key only.
      - ./certs/nats/ca-cert.pem:/etc/ssl/nats/ca-cert.pem:ro
      - ./certs/nats/clients/admin_api_service-cert.pem:/etc/ssl/nats/clients/admin_api_service-cert.pem:ro
