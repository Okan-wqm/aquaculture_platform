{{/*
=============================================================================
Aquaculture Platform - Secrets
=============================================================================
*/}}
{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aquaculture.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aquaculture.labels" . | nindent 4 }}
type: Opaque
stringData:
  databaseUrl: {{ required "secrets.databaseUrl must be set — provide a full PostgreSQL connection URL" .Values.secrets.databaseUrl | quote }}
  redisUrl: {{ required "secrets.redisUrl must be set — provide a full Redis connection URL" .Values.secrets.redisUrl | quote }}
  # SECURITY (CRITICAL-001): RS256 asymmetric keypair for JWT signing/verification.
  # jwtPrivateKey is consumed only by auth-service (sole issuer).
  # jwtPublicKey is consumed by every backend service for verification.
  # Chart 2.0.0 REMOVED the legacy `jwtSecret` HS256 field — production only
  # accepts RS256. Dev clusters needing HS256 pass ALLOW_DEV_JWT_SECRET +
  # DEV_JWT_SECRET at the service level, not via the chart.
  jwtPrivateKey: {{ required "secrets.jwtPrivateKey must be set — RS256 private key PEM (auth-service issuer). Run infrastructure/docker/scripts/generate-jwt-keypair.sh" .Values.secrets.jwtPrivateKey | quote }}
  jwtPublicKey: {{ required "secrets.jwtPublicKey must be set — RS256 public key PEM distributed to every backend service for token verification" .Values.secrets.jwtPublicKey | quote }}
  # SECURITY (HIGH-006): auth-service consumes PASSWORD_PEPPER to HMAC user
  # passwords before bcrypt. Kept separate from the DB so an exfiltrated
  # password table cannot be bruteforced without also stealing this pepper.
  passwordPepper: {{ required "secrets.passwordPepper must be set (auth-service HMAC pepper; openssl rand -base64 48)" .Values.secrets.passwordPepper | quote }}
  natsUrl: {{ required "secrets.natsUrl must be set — e.g. tls://nats:4222" .Values.secrets.natsUrl | quote }}
  # ADR-015 (cert-is-identity): per-service NATS identity comes from the
  # mTLS client cert CN via `verify_and_map: true`. The previous per-service
  # user/password secret entries (natsAuthUser/Pass ... natsHydroponicsPass —
  # 20 fields) were removed in the SSoT refactor. Username is implicit (cert
  # CN), password is not a thing (server ignores CONNECT-frame auth fields).
  #
  # Client cert material is distributed via the separate `nats-client-certs`
  # secret (not this Secret) and mounted at
  # /etc/ssl/nats-clients/<service>-{cert,key}.pem in every backend deploy.
  # The cert CN list IS the service name list — single source of truth lives
  # at infrastructure/nats/services.yaml + generate-internal-certs.sh.
  # Stripe webhook HMAC signing key + server-side API key — consumed by
  # billing-service's stripe-webhook.controller.ts and stripe API client.
  # Obtain from Stripe Dashboard → Developers → Webhooks (signing secret)
  # and Developers → API keys (server key). Required: without the webhook
  # secret, every inbound Stripe event is rejected with signature-verify
  # failure; without the API key, billing cannot create checkout sessions
  # or query subscription state. Rotation documented in
  # docs/runbooks/secret-rotation.md.
  stripeWebhookSecret: {{ required "secrets.stripeWebhookSecret must be set — Stripe Dashboard → Developers → Webhooks → signing secret" .Values.secrets.stripeWebhookSecret | quote }}
  stripeApiKey: {{ required "secrets.stripeApiKey must be set — Stripe Dashboard → Developers → API keys (server-side key, NOT publishable)" .Values.secrets.stripeApiKey | quote }}
{{- else }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "aquaculture.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aquaculture.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStore.kind }}
    name: {{ required "externalSecrets.secretStore.name must be set" .Values.externalSecrets.secretStore.name }}
  target:
    name: {{ include "aquaculture.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: databaseUrl
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/database-url
    - secretKey: redisUrl
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/redis-url
    - secretKey: jwtPrivateKey
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/jwt-private-key
    - secretKey: jwtPublicKey
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/jwt-public-key
    - secretKey: passwordPepper
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/password-pepper
    - secretKey: natsUrl
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-url
    # SECURITY (HIGH-001): per-service NATS credentials from secret store.
    - secretKey: natsAuthUser
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-auth-user
    - secretKey: natsAuthPass
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-auth-pass
    - secretKey: natsFarmUser
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-farm-user
    - secretKey: natsFarmPass
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-farm-pass
    - secretKey: natsSensorUser
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-sensor-user
    - secretKey: natsSensorPass
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-sensor-pass
    - secretKey: natsGatewayUser
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-gateway-user
    - secretKey: natsGatewayPass
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-gateway-pass
    - secretKey: natsNotificationUser
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-notification-user
    - secretKey: natsNotificationPass
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-notification-pass
    - secretKey: natsBillingUser
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-billing-user
    - secretKey: natsBillingPass
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-billing-pass
    - secretKey: natsAlertUser
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-alert-user
    - secretKey: natsAlertPass
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-alert-pass
    - secretKey: natsHrUser
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-hr-user
    - secretKey: natsHrPass
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-hr-pass
    - secretKey: natsMessagingUser
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-messaging-user
    - secretKey: natsMessagingPass
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-messaging-pass
    - secretKey: natsHydroponicsUser
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-hydroponics-user
    - secretKey: natsHydroponicsPass
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/nats-hydroponics-pass
    - secretKey: stripeWebhookSecret
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/stripe-webhook-secret
    - secretKey: stripeApiKey
      remoteRef:
        key: {{ .Values.externalSecrets.pathPrefix }}/stripe-api-key
{{- end }}
