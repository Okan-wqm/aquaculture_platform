---
{{- /* Billing Service */}}
{{- if .Values.billingService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aquaculture.fullname" . }}-billing-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aquaculture.backendLabels" . | nindent 4 }}
    app: billing-service
spec:
  replicas: {{ .Values.billingService.replicaCount }}
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
        tier: backend
    spec:
      serviceAccountName: {{ include "aquaculture.fullname" . }}-billing-service
      automountServiceAccountToken: false
      {{- include "aquaculture.podSecurityContext" . | nindent 6 }}
      containers:
        - name: billing-service
          image: {{ include "aquaculture.image" (dict "global" .Values.global "image" .Values.billingService.image) }}
          imagePullPolicy: {{ .Values.billingService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.billingService.service.targetPort }}
          env:
            {{- include "aquaculture.backendEnv" . | nindent 12 }}
            {{- include "aquaculture.natsServiceEnv" (list . "billing_service") | nindent 12 }}
            # Stripe credentials — pulled from the aggregated secret (see
            # templates/secrets.yaml). stripe-webhook.controller.ts reads
            # STRIPE_WEBHOOK_SECRET to verify inbound Stripe signatures;
            # STRIPE_SECRET_KEY (the canonical name read by stripeClientFactory
            # + PLATFORM_SECRET_ENV_VARS — NOT STRIPE_API_KEY) authenticates
            # outbound calls to Stripe's API. STRIPE_BILLING_ENABLED is the
            # non-secret SSoT flag: false (default) → billing boots with a
            # disabled client (fail-closed at request time); true → STRIPE_SECRET_KEY
            # is required and the factory throws at boot if it is missing.
            - name: STRIPE_BILLING_ENABLED
              value: {{ .Values.billingService.stripeBillingEnabled | default "false" | quote }}
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "aquaculture.fullname" . }}-secrets
                  key: stripeWebhookSecret
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aquaculture.fullname" . }}-secrets
                  key: stripeApiKey
            {{- range $key, $val := .Values.billingService.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          volumeMounts:
            {{- include "aquaculture.natsServiceVolumeMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.billingService.resources | nindent 12 }}
          {{- include "aquaculture.livenessProbe" (dict "Values" .Values "port" .Values.billingService.service.targetPort) | nindent 10 }}
          {{- include "aquaculture.readinessProbe" (dict "Values" .Values "port" .Values.billingService.service.targetPort) | nindent 10 }}
          {{- include "aquaculture.securityContext" . | nindent 10 }}
      volumes:
        {{- include "aquaculture.natsServiceVolume" (list . "billing_service") | nindent 8 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aquaculture.fullname" . }}-billing-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aquaculture.labels" . | nindent 4 }}
    app: billing-service
spec:
  type: {{ .Values.billingService.service.type }}
  ports:
    - port: {{ .Values.billingService.service.port }}
      targetPort: {{ .Values.billingService.service.targetPort }}
      name: http
  selector:
    app: billing-service

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aquaculture.fullname" . }}-billing-service-pdb
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aquaculture.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: billing-service
{{- end }}

