      timeout: 10s
      retries: 3

  billing-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/billing-service:${TAG:-latest}
    container_name: aqua-billing
    restart: unless-stopped
    environment:
      SERVICE_NAME: billing-service
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://billing_service:${BILLING_SERVICE_DB_PASS:?BILLING_SERVICE_DB_PASS is required}@postgres:5432/${POSTGRES_DB:-aquaculture}?sslmode=require
      # ADR-016/031: production schema DDL belongs to aqua-db-migrate.
      # Keep this as a real container env var because AppModule import-time
      # wiring decides whether runtime DDL providers are registered.
      DB_MIGRATE_AUTHORITATIVE: 'true'
      DATABASE_MIGRATIONS_RUN: 'false'
      REDIS_URL: rediss://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: tls://nats:4222
      # SECURITY (HIGH-002): mTLS required — NATS server runs with verify: true.
      NATS_TLS_ENABLED: 'true'
      NATS_TLS_CA: /etc/ssl/nats/ca-cert.pem
      # SECURITY (HIGH-002 / V4): per-service mTLS — CN=billing_service maps to NATS user.
      NATS_TLS_CERT: /etc/ssl/nats/clients/billing_service-cert.pem
      NATS_TLS_KEY: /etc/ssl/nats/clients/billing_service-key.pem
      # SECURITY (HIGH-001): billing-service NATS account with billing-scoped subject ACLs.
      # SECURITY (CRITICAL-001): RS256 public-key verification (consumer only).
      JWT_PUBLIC_KEY_PATH: /var/run/jwt/public.pem
