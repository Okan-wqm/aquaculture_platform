name: ARIA State Maintenance

# =============================================================================
# Why this exists: the aria/state branch accumulated 842MB of historical
# data (runs, raw-findings, hot artifacts). The nightly cycle OOMs on
# restore because cloning 842MB on a 7.8GB shared runner exceeds memory.
# The auto-compact at cycle-end never fires because the cycle can't
# complete — a catch-22.
#
# This lane breaks the loop: it runs INDEPENDENTLY of the cycle (on a
# GitHub-hosted runner with no memory constraint), compacts the state,
# and pushes the slim branch. The cycle then restores a small state.
#
# It also cleans hot artifacts — the single biggest contributor (529MB
# from old cycles' tool_run.json files) that the JSONL-only compact
# never touched.
# =============================================================================

on:
  schedule:
    # 15:13 UTC daily — two hours before the 17:13 UTC cycle
    - cron: '13 15 * * *'
  workflow_dispatch:
    inputs:
      retain_days:
        description: 'Days of data to retain (default 7)'
        default: '7'
        required: false

permissions:
  contents: write
