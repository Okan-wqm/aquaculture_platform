name: Secret Rotation Reminder

# SEC-CI-002: All third-party actions pinned to full commit SHAs.
# INFRA-ROTATION-001: Opens a GitHub issue during the lead-time window before
# each scheduled secret rotation. The issue IS the reminder — we do not rely
# on calendar invites or tribal knowledge.
#
# Cadence table of record: docs/runbooks/secret-rotation.md#rotation-cadence
#
# The workflow is idempotent: if an open issue with the same `Rotation due:`
# title already exists, no new issue is created (prevents daily spam).

on:
  schedule:
    # 08:00 UTC Monday = start of the EU work week. Matches the oncall handoff.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: secret-rotation-reminder
  cancel-in-progress: false

jobs:
  check-due-rotations:
    name: Open reminders for rotations coming due
    runs-on: ubuntu-latest
    steps:
      # SEC-CI-002: pinned to SHA
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open reminder issues for rotations in lead-time window
        # SEC-CI-002: pinned to SHA
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Single source of truth for the cadence. Mirrors the table in
            // docs/runbooks/secret-rotation.md#rotation-cadence. When you
            // change the cadence there, change it here too — a CI lint
            // check for this cross-reference is INFRA-ROTATION-002 (future).
            const SECRETS = [
              { id: 'jwt-keypair',       intervalDays: 90,  leadDays: 14, team: 'auth-oncall',    label: 'auth' },
              { id: 'stripe-webhook',    intervalDays: 90,  leadDays: 14, team: 'billing-oncall', label: 'billing' },
              { id: 'stripe-api-key',    intervalDays: 90,  leadDays: 14, team: 'billing-oncall', label: 'billing' },
              { id: 'db-passwords',      intervalDays: 90,  leadDays: 14, team: 'data-oncall',    label: 'data' },
              { id: 'password-pepper',   intervalDays: 180, leadDays: 30, team: 'auth-oncall',    label: 'auth' },
              { id: 'redis-password',    intervalDays: 180, leadDays: 30, team: 'infra-oncall',   label: 'infra' },
              { id: 'nats-client-certs', intervalDays: 365, leadDays: 30, team: 'infra-oncall',   label: 'infra' },
              { id: 'spaces-keys',       intervalDays: 90,  leadDays: 14, team: 'infra-oncall',   label: 'infra' },
              // Plan ARIA-V3 §A5 — HMAC key for ack-ledger signing lives on
              // operator filesystem (aria-tools/secrets/ack_hmac.key). 90-day
              // rotation per docs/runbooks/aria-ack-key-rotation.md.
              { id: 'aria-ack-hmac-key',       intervalDays: 90,  leadDays: 14, team: 'aria-oncall',   label: 'aria' },
            ];

            const today = new Date();
            const dayMs = 86400 * 1000;

            // Anchor-resolution convention:
            //
            // Reminder issues are opened with title "Rotation due: <id> (<due>)"
            // and label `secret-rotation`. The operator rotates the secret,
            // verifies, then CLOSES the issue with a closing comment that
            // contains the literal token:
            //
            //     Rotated-at: <id>
            //
            // The anchor is the `closed_at` timestamp of the most recent such
            // closed issue whose title starts with `Rotation due: <id>`.
            //
            // The token lives in a CLOSING COMMENT, not in the reminder body,
            // so the reminder cannot self-anchor. The earlier implementation
            // searched `in:body "Rotation complete:"` which matched the
            // reminder's own acceptance instruction — self-poisoning.
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const ANCHOR_SEED_DATE = new Date('2026-04-14');

            async function lastRotationDate(secretId) {
              // issues.listForRepo returns issues AND PRs. Filter PRs out
              // so a mislabelled PR cannot be mistaken for a rotation record.
              const closed = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo,
                state: 'closed',
                labels: 'secret-rotation',
                sort: 'updated',
                direction: 'desc',
                per_page: 100,
              });
              const titlePrefix = `Rotation due: ${secretId} `;
              const token = `Rotated-at: ${secretId}`;
              for (const issue of closed) {
                if (issue.pull_request) continue;          // reject PRs
                if (!issue.title.startsWith(titlePrefix)) continue;
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: issue.number, per_page: 100,
                });
                if (!comments.some(c => (c.body || '').includes(token))) continue;
                return new Date(issue.closed_at);
              }
              return null;
            }

            async function openIssueTitled(title) {
              const res = await github.rest.issues.listForRepo({
                owner, repo, state: 'open', labels: 'secret-rotation', per_page: 100,
              });
              // Filter out PRs (listForRepo returns both issues and PRs).
              return res.data.find(i => !i.pull_request && i.title === title);
            }

            for (const s of SECRETS) {
              const last = await lastRotationDate(s.id);
              const anchor = last ?? ANCHOR_SEED_DATE;
              const dueDate = new Date(anchor.getTime() + s.intervalDays * dayMs);
              const reminderOpensOn = new Date(dueDate.getTime() - s.leadDays * dayMs);

              if (today < reminderOpensOn) {
                core.info(`[${s.id}] reminder window opens ${reminderOpensOn.toISOString().slice(0,10)} — skipping`);
                continue;
              }
              if (today > dueDate) {
                core.warning(`[${s.id}] rotation OVERDUE since ${dueDate.toISOString().slice(0,10)}`);
              }

              const title = `Rotation due: ${s.id} (${dueDate.toISOString().slice(0,10)})`;
              const existing = await openIssueTitled(title);
              if (existing) {
                core.info(`[${s.id}] reminder already open: #${existing.number}`);
                continue;
              }

              // GitHub issue bodies do NOT resolve `../blob/main/...` against
              // the repo root, so build an absolute URL the native way.
              const runbookUrl = `https://github.com/${owner}/${repo}/blob/main/docs/runbooks/secret-rotation.md#rotation-cadence`;

              const body = [
                `**Secret:** \`${s.id}\``,
                `**Due:** ${dueDate.toISOString().slice(0,10)}`,
                `**Owner team:** ${s.team}`,
                `**Procedure:** [docs/runbooks/secret-rotation.md](${runbookUrl})`,
                ``,
                `### Acceptance`,
                ``,
                `Close this issue only after the new secret is in effect AND verified. The CLOSING COMMENT MUST contain the exact token \`Rotated-at: ${s.id}\` — the workflow reads closing comments (not the issue body) to anchor the next reminder window. Without that token the next reminder will open again prematurely.`,
                ``,
                `### Deferral`,
                ``,
                `A single deferral is allowed; see the cadence table. Deferring twice in a row auto-escalates to CRITICAL under \`INFRA-ROTATION-001\`.`,
              ].join('\n');

              const created = await github.rest.issues.create({
                owner, repo,
                title,
                body,
                labels: ['secret-rotation', s.label],
              });
              core.notice(`[${s.id}] opened reminder issue #${created.data.number}`);
            }
