# =============================================================================
# Aquaculture Platform - Production Values Overlay
# =============================================================================
# Apply with:
#   helm install aquaculture ./aquaculture \
#     -n aquaculture --create-namespace \
#     -f values-production.yaml \
#     --set secrets.jwtSecret=$JWT_SECRET \
#     --set secrets.databaseUrl=$DATABASE_URL \
#     --set secrets.redisUrl=$REDIS_URL \
#     --set secrets.natsUrl=$NATS_URL \
#     --set postgresql.auth.password=$PG_PASSWORD \
#     --set redis.auth.password=$REDIS_PASSWORD
#
# Credentials MUST be passed via --set or external-secrets, never committed.
# =============================================================================

global:
  nodeEnv: production
  imageRegistry: ghcr.io

namespace: aquaculture

# Pin image tags to the specific release being deployed.
# Override these per-service in your CI/CD pipeline.
gatewayApi:
  replicaCount: 3
  image:
    tag: "1.0.0"  # Override: --set gatewayApi.image.tag=<sha>

authService:
  replicaCount: 2
  image:
    tag: "1.0.0"

farmService:
  replicaCount: 2
  image:
    tag: "1.0.0"

sensorService:
  replicaCount: 3
  image:
    tag: "1.0.0"

alertEngine:
  replicaCount: 2
  image:
    tag: "1.0.0"

notificationService:
  replicaCount: 2
  image:
    tag: "1.0.0"

billingService:
  replicaCount: 2
  image:
    tag: "1.0.0"

hrService:
  replicaCount: 2
  image:
    tag: "1.0.0"

shell:
  replicaCount: 2
  image:
    tag: "1.0.0"

dashboard:
  replicaCount: 2
  image:
    tag: "1.0.0"

farmModule:
  replicaCount: 2
  image:
    tag: "1.0.0"

processEditor:
  enabled: false

adminPanel:
  replicaCount: 2
  image:
    tag: "1.0.0"

# Use external managed services in production (AWS RDS, ElastiCache)
postgresql:
  enabled: false  # Use RDS — set secrets.databaseUrl to RDS endpoint

redis:
  enabled: false  # Use ElastiCache — set secrets.redisUrl to ElastiCache endpoint

# Enable external secrets integration in production
externalSecrets:
  enabled: true
  secretStore:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  pathPrefix: "aquaculture/production"
  refreshInterval: "1h"

networkPolicy:
  enabled: true

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
