# =============================================================================
# Aquaculture Platform - DigitalOcean Droplet (2GB RAM Optimized)
#
# Minimal deployment for small servers.
# Total memory usage: ~1.2GB (leaves room for OS + swap)
#
# Usage:
#   docker compose -f docker-compose.droplet.yml pull
#   docker compose -f docker-compose.droplet.yml up -d
#
# To add more services, uncomment the sections below.
# =============================================================================

networks:
  aqua-network:
    driver: bridge
  aqua-internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  nats_data:

services:
  # ===========================================================================
  # Infrastructure (required)
  # ===========================================================================

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: aqua-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquaculture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-aquaculture}
      # Memory optimization for 2GB server
      POSTGRES_SHARED_BUFFERS: 128MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 256MB
      POSTGRES_WORK_MEM: 4MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquaculture}"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aqua-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required} --maxmemory 48mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: aqua-nats
    restart: unless-stopped
    command: ["--jetstream", "--store_dir=/data", "--max_mem_store=32MB"]
    volumes:
      - nats_data:/data
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 48M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Core Backend Services (required)
  # ===========================================================================

  gateway-api:
    image: ghcr.io/okan-wqm/aquaculture_platform/gateway-api:latest
    container_name: aqua-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=128'
      DATABASE_URL: postgres://${POSTGRES_USER:-aquaculture}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aquaculture}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      AUTH_SERVICE_URL: http://auth-service:3000/graphql
      FARM_SERVICE_URL: http://farm-service:3000/graphql
      SENSOR_SERVICE_URL: http://sensor-service:3000/graphql
      HR_SERVICE_URL: http://hr-service:3000/graphql
      ADMIN_SERVICE_URL: http://admin-api-service:3000/graphql
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - aqua-network
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 192M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  auth-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/auth-service:latest
    container_name: aqua-auth
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=96'
      DATABASE_URL: postgres://${POSTGRES_USER:-aquaculture}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aquaculture}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    depends_on:
      - postgres
      - redis
    networks:
      - aqua-internal
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  farm-service:
    image: ghcr.io/okan-wqm/aquaculture_platform/farm-service:latest
    container_name: aqua-farm
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=96'
