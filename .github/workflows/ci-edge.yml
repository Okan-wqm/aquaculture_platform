name: CI - Edge Agent (sens-api-gateway)

# Batch 70: PR-time CI gate for the Rust edge agent.
#
# WHY this exists:
#   Until Batch 70, the ONLY workflow referencing `sens-api-gateway/**`
#   was `edge-agent-release.yml`, triggered ONLY on `agent-v*` tags or
#   manual workflow_dispatch. Every PR touching the edge agent landed
#   WITHOUT automated compile / test-compile validation.
#
#   ORPHAN-HIGH-012 surfaced this gap — test-code drift (18 errors
#   across 6 modules) existed on HEAD for an unknown window because
#   no PR-time gate ran `cargo check --features health --tests`.
#
# WHAT this workflow enforces:
#   1. `cargo check --features health` — production compile (deny
#      lints from Cargo.toml [lints.clippy] apply at this stage:
#      unwrap_used, expect_used, indexing_slicing, todo,
#      unimplemented, dbg_macro, print_stdout, print_stderr,
#      large_stack_arrays, unsafe_op_in_unsafe_fn).
#   2. `cargo check --features health --tests` — TEST CRATE
#      compile gate (the root-cause fix for ORPHAN-HIGH-012).
#      Catches production-type→test-code drift at PR time.
#
# WHAT this workflow DOES NOT enforce (yet):
#   - `cargo clippy -- -D warnings` — the 153-warning baseline is
#     intentionally allowed; elevating all warnings to errors would
#     require a parallel baseline-cleanup batch.
#   - `cargo fmt --check` — no prior fmt baseline asserted; adding
#     the check without baseline verification risks red CI from
#     legacy formatting.
#   - Cross-arch build — `cross build` is slow (~12 min) and stays
#     scoped to the release workflow. Host-native checks catch the
#     vast majority of drift in seconds.
#
# Batch 86 upgrade: `cargo test --features health --bin suderra-agent`
# now runs as a gate. ORPHAN-HIGH-013 closure in Batch 85 brought the
# suite to 855/855 green (was 849/855). Any future PR that regresses
# even one test is now blocked at merge.
#
# WHY only on path changes:
#   Edge agent is ~35K LoC Rust; running on every PR (including
#   TypeScript-only changes) burns CI minutes + slot contention.
#   Path-filter matches `edge-agent-release.yml`'s scope exactly.

on:
  push:
    branches: [main, develop, agentic, 'feature/*', 'hotfix/*']
    paths:
      - 'sens-api-gateway/**'
      - '.github/workflows/ci-edge.yml'
      - '.github/workflows/edge-agent-release.yml'
      - '.github/workflows/sens-api-gateway-ci.yml'
  pull_request:
    branches: [main, develop, agentic]
    paths:
      - 'sens-api-gateway/**'
      - '.github/workflows/ci-edge.yml'
      - '.github/workflows/edge-agent-release.yml'
      - '.github/workflows/sens-api-gateway-ci.yml'
  workflow_dispatch:

# SEC-CI-021: minimum token permissions.
permissions:
  contents: read

# Cancel in-progress runs on the same branch — saves CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: stable

jobs:
  check:
    name: compile + test-compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            sens-api-gateway/target/
          key: ${{ runner.os }}-cargo-edge-${{ hashFiles('sens-api-gateway/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-edge-

      - name: cargo check (production, features=health)
        working-directory: sens-api-gateway
        # Production compile gate. Cargo.toml [lints.clippy/rust] deny
        # entries apply at this stage — any use of unwrap()/expect()/
        # indexing, any todo!/unimplemented!/dbg!, any print_stdout/
        # print_stderr, any unsafe_op_in_unsafe_fn will hard-fail here.
        # 153-warning baseline is INTENTIONALLY not asserted as a count
        # gate (follow-up batch); this step fails only on hard errors.
        run: cargo check --features health

      - name: cargo check --tests (ORPHAN-HIGH-012 closure)
        working-directory: sens-api-gateway
        # TEST CRATE compile gate. Closes ORPHAN-HIGH-012 root cause:
        # test-code drift out of sync with current production API
        # types (Permission::ReadTag tuple→unit, WriteTag tuple→struct,
        # FileBackedAcceptance missing Debug) MUST be caught at PR
        # time, not discovered N batches later in a manual verify run.
        # Pre-Batch-69 this produced 18 errors on HEAD; Batch 69 fixed
        # them and this step now gates against recurrence.
        run: cargo check --features health --tests

      - name: cargo test (ORPHAN-HIGH-013 closure gate)
        working-directory: sens-api-gateway
        # Batch 86: full unit-test gate, unblocked by Batch 85's
        # ORPHAN-HIGH-013 closure. Pre-Batch-85 the suite had 6
        # pre-existing failing tests (audit chain tamper, sorted
        # mutating commands, CommandResponse serde, i2c enumeration,
        # monotonic clock flake, ST CASE parser). Batch 85 brought
        # the suite to 855/855 green; this gate now blocks any PR
        # that regresses even one test.
        #
        # Scoped to --bin suderra-agent (main production binary) +
        # the registered [[test]] invariant harnesses. Integration
        # tests behind --ignored stay out of PR gate (those are
        # slow; release workflow runs them).
        run: cargo test --features health --bin suderra-agent
