# =============================================================================
# NATS TLS Configuration (enabled — production)
#
# Mount this file at /etc/nats/nats-tls.conf to enable TLS.
# Requires cert files mounted at /etc/nats/certs/.
#
# SECURITY (HIGH-002): mTLS enforced — `verify: true`. NATS rejects any client
# that does not present a certificate signed by the configured CA. Application-
# level identity (per-service user/pass with subject ACLs) is unchanged; mTLS
# adds a transport-layer trust gate so compromised containers without the
# client cert cannot reach the broker at all.
# Generate the client cert pair with:
#   infrastructure/docker/scripts/generate-internal-certs.sh
# =============================================================================
tls {
  cert_file: "/etc/nats/certs/nats-cert.pem"
  key_file: "/etc/nats/certs/nats-key.pem"
  ca_file: "/etc/nats/certs/ca-cert.pem"
  verify: true
  timeout: 5
}
