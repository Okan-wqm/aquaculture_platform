name: aria-auto-cycle

# ARIA Operationalization S1+S2 (operator-approved plan 2026-07-02,
# ORPHAN-MEDIUM-296) — the scheduled PRODUCER lane. aria-agent-executor
# only drains an already-minted queue; this workflow runs the
# full `aria-kernel autonomy run` orchestration (discovery → pressure →
# triage → planner/bridge/worker drains) on its schedule.
#
# ORPHAN-HIGH-728 — the profile is RESOLVED, not fixed, and the resolution
# is BOUNDED. The `profile_gate` step calls
# `autonomy_unlock.resolve_scheduled_profile`, which proposes `strict` when
# the L1 ladder is valid and then bounds that proposal by the
# operator-recorded `scheduler_profile_ceiling` (default `standard`). Strict
# is what `runtime_profile` defines as the full implementation pipeline
# (claim → planned → committed → validated → PR); standard withholds
# `pr_create`, which is why this lane used to converge plans it could never
# turn into a pull request — and why reaching strict on a schedule takes an
# operator gesture rather than a night of good evidence. Merge authority is
# untouched by either: `pr_merge` is autonomous-only and no resolution here
# can emit `autonomous`.
#
# Two dispatch modes:
#   mode=cycle           — one ceiling-bounded, L1-resolved cycle (default)
#   mode=burn-in-observe — REAL-mode observe burn-in (30 cycles, LLM-free)
#                          + the operator bridge that records
#                          observe_success acceptance events toward the
#                          L1 autonomy unlock (Plan 031c ladder).
#
# State model (PLAN Wave 1 PR 2.6b — the lane cutover): ARIA's whole
# runtime state travels between runs on the `aria/state` branch — checkout
# the tip, run against it, fast-forward-push. The enterprise
# acceptance/unlock ledgers and monthly cost-attribution shards must
# accumulate between nights, and the 30-day artifact that used to carry
# them could not enforce that: `overwrite: true` would bury the
# accumulated tree under a bootstrap-empty one, and an empty tree passes
# `integrity verify` because it is trivially consistent.
#
# There is NO fail-open on state any more. A restore that cannot reach a
# published tip fails the run; it does not start over quietly. Fresh
# bootstrap now requires `vars.ARIA_STATE_BOOTSTRAP_ACK` — an operator
# naming the repository — because a process that can create the branch
# when it cannot SEE it is a process that replaces history with emptiness
# on a network blip. Auth/policy stay fail-closed as before.
#
# Brakes (all pre-existing kernel mechanisms):
#   - vars.ARIA_MOCK_KILL_SWITCH (read AHEAD of dispatch input/default)
#   - ARIA_STOP file in the store's tools root → orchestrator exits cleanly
#   - cross-host autonomous-loop lease (refuses when a local daemon runs)
#   - per-cycle wall-clock deadline (--cycle-deadline-seconds) + the
#     executor's pre-dispatch wall-clock ceiling derived from this job's
#     own timeout-minutes. ORPHAN-HIGH-472 removed the USD caps that used
#     to be listed here: ARIA runs on a Claude Code subscription session,
#     so there is no per-run charge for a dollar cap to bound, and the two
#     figures ($20.00/run, $3.00/cycle) contradicted each other anyway.
#   - concurrency group, cancel-in-progress: false
#
# ARIA-HIGH-415 — the post-cycle observation steps (doctor, self_improve,
# deliver) carry NO ARIA_STOP guard, deliberately. They spawn no agent and
# write only the store's own ledgers (notifications outbox, governance,
# missions), and the ARIA_STOP a night writes by itself is the
# orchestrator's own, on a deadline overrun (autonomy_orchestrator,
# phase `cycle_deadline_exceeded`): that is the night that most needs a
# doctor reading. They run under always(), even on a cancelled run, like the
# publish they feed; each is bounded by its own timeout-minutes, and the
# close-out margin of the cycle step prices them.

on:
  schedule:
    # 17:13 UTC = 19:13 Oslo (CEST) — operator decision 2026-08-27: the cycle
    # runs INSIDE the operator's evening work window (7pm Norway), not at
    # night, so the operator can watch the run and intervene while awake.
    # Still before aria-agent-executor's drain so queue rows this cycle
    # leaves behind get a second drain pass the same evening.
    # 13 past, not :00 — GitHub fires top-of-hour crons up to ~75min late
    # under shared-infra load (measured 2026-08-18: 01:00 fired 02:13).
    - cron: '13 17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'cycle = one cycle at min(operator scheduler ceiling, L1 ladder verdict); burn-in-observe = REAL observe burn-in + L1 ladder bridge'
        required: false
        default: 'cycle'
        type: choice
        options:
          - 'cycle'
          - 'burn-in-observe'
      max_cycles:
        description: 'Cycles per invocation (mode=cycle only)'
        required: false
        default: '1'
        type: string
      unquarantine_tool_ids:
        description: 'Comma-separated tool ids to unquarantine before the cycle (audited; one approval ref per id)'
        required: false
        default: ''
        type: string
      unquarantine_approval_ref:
        description: 'Comma-separated gh:<owner>/<repo>#<n>/comment/<id> (or /review/<id>) refs, one per tool id in order: operator GitHub acts carrying `aria-kernel operator approval-template --surface tool_unquarantine tool=<id>`'
        required: false
        default: ''
        type: string
      mock:
        description: 'Run in mock mode (no real Claude Code CLI invocation)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      channel_check:
        description: 'Send two test notices before the cycle; the second must comment on the issue the first opened'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      # ARIA-MEDIUM-271 — a kernel-owned runtime signal, by name
      # (runtime_signal_bridge.STANDING_RUNTIME_SIGNALS), that this cycle
      # ingests into its own store before it runs. The dataflow watchdog
      # dispatches with it: the watchdog's own checkout is thrown away with
      # its job, and this lane owns the store's publish.
      runtime_signal:
        description: 'A standing runtime signal to ingest before the cycle (none = no signal)'
        required: false
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'dataflow_integrity_critical'

# Z1 (ORPHAN-712) → ARIA-MEDIUM-277 — this lane's OWN group. A GitHub
# concurrency group holds ONE pending slot and an arriving run evicts the
# queued one, so a group shared with another lane let that lane's dispatch
# cancel this lane's pending run (measured: the dataflow watchdog's CRITICAL
# dispatch, the executor's chained cycle). In a per-lane group only this
# lane's own duplicate can evict this lane's pending run — dedup, not
# starvation. The workspace serialization the shared group used to lend the
# one shared workspace is carried by the host workspace lock
# (.github/actions/selfhosted-workspace-lock), taken by this job below; see
# dataflow-integrity-watchdog.yml for the measured wipe this prevents.
concurrency:
  group: aria-auto-cycle
  cancel-in-progress: false

permissions:
  id-token: write # ARIA-AUDIT-016: attestation needs the Actions OIDC channel
  # PLAN Wave 1 PR 2.6b — contents:write is what the cutover costs. The store
  # publishes by pushing `aria/state`, so the lane needs write on this
  # repository's refs. The blast radius is bounded on the SERVER, not here: the
  # branch ruleset blocks force-pushes and deletions, so the widest thing this
  # token can do to `aria/state` is append a commit that descends from the tip
  # — which is exactly what publishing is. See
  # docs/runbooks/aria-state-branch-bootstrap.md step 1.
  contents: write
  # actions:read remains for the run/job introspection the cycle reports on.
  # It is no longer used to fetch state: that moved to the branch.
  actions: read
  # ORPHAN-HIGH-626 — the pr_ci_scan phase reads the check verdicts of
  # ARIA's OWN open PRs (aria/*, automation/*) so a red check becomes this
  # cycle's pressure instead of a silently blocked PR. Read-only pair.
  checks: read
  pull-requests: read
  # ARIA-CRITICAL-216 — the operator unquarantine step reads the operator's
  # approval comment back from GitHub; issue comments need this read.
  # ARIA-MEDIUM-227 — a self-merge freeze is written mid-cycle and reaches
  # aria/state only at this job's end publish; the self-revert producer
  # therefore opens the freeze's issue at once (label `self-merge-freeze`),
  # and the merge lane reads it as a freeze. Issues only: no code, no refs.
  # Write covers both; nothing here needs more than issues.
  issues: write

jobs:
  # B8 (2026-09-12) — a run that cannot get its runner fails by name. The
  # only runner carrying [self-hosted, linux, claude] went offline on
  # 2026-09-08 09:48Z; every scheduled run since queued with zero jobs and
  # was CANCELLED ~12h later by the next schedule taking this concurrency
  # group's single pending slot (cancel-in-progress: false keeps ONE pending
  # run). No red, no error, no notification: green by absence. This hosted
  # job refuses the run with a named reason unless an ONLINE runner carries
  # every label the self-hosted job needs; the self-hosted job `needs` it,
  # so a run is either dispatched or red within a minute. One definition
  # for every self-hosted lane: .github/actions/require-self-hosted-runner
  # (decision logic: aria-kernel/aria_kernel/runner_availability.py; wiring
  # pinned by aria-kernel/tests/test_runner_availability.py).
  runner-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: ./.github/actions/require-self-hosted-runner
        with:
          # Verbatim the self-hosted job's runs-on; the invariant test
          # compares the two so they cannot drift apart.
          required-labels: self-hosted,linux,claude
          app-id: ${{ secrets.ARIA_GH_APP_ID }}
          app-installation-id: ${{ secrets.ARIA_GH_APP_INSTALLATION_ID }}
          app-private-key: ${{ secrets.ARIA_GH_APP_PRIVATE_KEY }}

  cycle:
    needs: runner-preflight
    runs-on: [self-hosted, linux, claude]
    # Mode-aware sizing: a REAL observe burn-in is 30 kernel-guarded cycles at
    # ~2.5 min/cycle ≈ 80-90 min (run 28577469404 was cancelled mid-burn-in by
    # the previous flat 50-minute limit, producing ZERO ladder evidence because
    # the acceptance verdict is all-or-nothing). Schedule/cycle runs keep 50.
    # Operator decision (2026-08-13): the night's window is UNBOUNDED — in
    # GitHub terms that is a stated cap, not an omitted field (there is no
    # 360-minute platform ceiling on a self-hosted runner; the executor job
    # runs 602). 360 → 454 when the close-out margin was re-derived from the
    # kernel's own publish bounds (ARIA-LOW-585): the cap moves WITH the
    # margin, so the spawn window — what the night may spend — is the same
    # 260 minutes it was. Smoke runs 1-3 proved a small cap was the binding
    # constraint (the cycle needs adapters + queue drain + spawns); the
    # deadline defence pair (ORPHAN-661 spawn clamp + ORPHAN-662 night-close)
    # keeps ANY value safe: the night seals and publishes whatever the wall
    # is.
    timeout-minutes: 454
    env:
      # Kernel-workflow parity: no .pyc litter in the checkout — the
      # burn-in pre-clean guard treats any untracked path as dirty.
      PYTHONDONTWRITEBYTECODE: '1'
      # ARIA-LOW-551 — the close-out margin and the one term of it that no
      # timeout bounds, in one place. The cycle step takes the margin off the
      # job cap for its spawn deadline; "Measure the unbounded close-out"
      # checks the basis against every real night; and
      # aria-kernel/tests/test_auto_cycle_observation_steps.py proves
      # basis + every declared step timeout after the cycle <= margin.
      # The basis is the one #1371 measurement (842 MB of state: handoff 5 +
      # integrity verify 40 + mint 2 + publish 10 = 57 minutes); the doctor,
      # self_improve and deliver steps add their timeouts (10 + 12 + 5;
      # measured 229 s / 245 s / 5 s on the 2026-10-10 store, when
      # self_improve still ran the doctor a second time — it reads the doctor
      # step's report since ARIA-LOW-559), 84 of the 100 minutes.
      # ARIA-LOW-585 — the margin itself is DERIVED from the kernel's priced
      # publish bounds, not a separate measured literal: the lifecycle
      # liveness (2700) + the leased publish's preamble (4500) + the kernel's
      # close-out steps allowance (#1371's 2820) + those bounded step
      # timeouts (1620) = 11640 — the old 6000 was below the kernel's priced
      # worst case for the publish arc alone (7200), the same publish priced
      # two ways. The cap moved with it (360 → 454), so the spawn window is
      # unchanged; the basis stays the nightly measurement's to check.
      ARIA_CLOSE_OUT_MARGIN_SECONDS: '11640'
      ARIA_CLOSE_OUT_UNBOUNDED_BASIS_SECONDS: '3420'
    steps:
      # ARIA-MEDIUM-277 — the host workspace lock, FIRST, before the reset
      # and any checkout below: those are the wipe vectors the lock exists
      # to serialize across the lanes that share this workspace. The lock
      # replaces the serialization the shared aria-selfhosted-workspace
      # group used to provide (its single pending slot evicted other
      # lanes' queued runs); GitHub's runner queue, which never evicts,
      # does the waiting. timeout-seconds sits just above the cycle job's
      # own 454-min cap so a lane chained behind a full cycle eventually
      # gets the workspace instead of failing on the wait.
      - name: Take the shared self-hosted workspace lock
        uses: ./.github/actions/selfhosted-workspace-lock
        with:
          timeout-seconds: '27300'

      # ORPHAN-HIGH-802 — reset the persistent workspace HERE, so checkout
      # does not have to. actions/checkout's `clean` runs `git clean -ffdx`,
      # and `-x` deletes gitignored paths — including node_modules, which the
      # worktree-clean guard this cleaning exists to satisfy never inspects,
      # because `git status` does not report ignored files. The cost was paid
      # every run: a full `npm ci` (measured 2m50s, ~1.6 GB peak RSS) on a
      # self-hosted runner that shares its box with production and is
      # deliberately the first OOM victim (oom_score_adj=500). The kernel
      # killed that install on 2026-09-03 and twice more, and each kill left
      # node_modules half-populated, so the NEXT run reinstalled from scratch
      # and was killed again. Same reset, one exclusion, loop gone.
      # ARIA-HIGH-426 — git clean cannot remove what another account wrote
      # here (a root-run rescue publish, 2026-10-08: every ARIA job failed at
      # this step for 11 h with a bare exit 1). On failure the step names each
      # path this account does not own and the remedy. The body is identical
      # in aria-auto-cycle.yml and aria-agent-executor.yml (pinned by
      # aria-kernel/tests/test_workspace_reset_names_foreign_owner.py); it runs
      # before checkout, so no repository action or script can hold it.
      - name: Reset the persistent workspace, keeping installed dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .git ]; then
            if ! { git reset --hard && git clean -ffdx -e node_modules; }; then
              me="$(id -un)"
              foreign="${RUNNER_TEMP}/aria-workspace-foreign-owned.txt"
              find . -xdev -name node_modules -prune -o ! -uid "$(id -u)" -printf '%u %p\n' > "$foreign" 2>/dev/null || true
              count="$(wc -l < "$foreign")"
              if [ "$count" -gt 0 ]; then
                echo "::error title=Foreign-owned files in the persistent workspace::${count} path(s) under ${GITHUB_WORKSPACE} are not owned by ${me}, so git clean cannot remove them (ARIA-HIGH-426). As root on the runner host: chown -R ${me}:${me} each listed path, or move it aside. Run python and kernel commands on this tree only as ${me} (sudo -u ${me} ...)."
                head -n 50 "$foreign"
                {
                  echo "### Foreign-owned paths in the persistent workspace (${count}, first 50)"
                  echo '```'
                  head -n 50 "$foreign"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error title=Persistent workspace reset failed::git reset or git clean failed and every path is owned by ${me}; the git output above names the cause."
              fi
              exit 1
            fi
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          # The kernel reads this checkout's HISTORY, not only its tree: the
          # twin's churn and co-change layers replay `git log -n400`, the
          # incremental refresh asks whether the prior map's anchor commit
          # exists, the executor's anchor gate asks the same of a previous
          # run's commit, and intent context reads per-file logs.
          # actions/checkout defaults to depth 1, and on this persistent
          # workspace a depth-1 fetch RE-SHALLOWS a full clone, so the run
          # that wrote the live map (2026-09-12) counted one commit: churn
          # and co-change never reached their recurrence thresholds and an
          # empty history layer was published as a healthy map, while every
          # refresh was a full rebuild (`refresh.reason=unknown_anchor`).
          # 0 = the whole history; on an already-shallow workspace the
          # action fetches `--unshallow`. The kernel refuses a shallow
          # checkout by name (`twin_history_unavailable_shallow`) and
          # aria-kernel/tests/invariants/test_kernel_lanes_check_out_full_history.py
          # pins this flag on every lane that runs the kernel. The
          # aria/state store is NOT this checkout: the restore action
          # materialises it through the kernel's own fetch (no depth) into a
          # sibling worktree, and its history length is governed by
          # aria-state-maintenance, not by this step.
          fetch-depth: 0
          # Self-hosted workspace persists between ALL jobs (CI, executor,
          # this lane). A dispatch-triggered run inherits whatever the
          # previous job left behind; the mid-run preflight's
          # workspace_worktree_not_clean guard then rejects the run for
          # files this lane never created. The reset step above already put
          # the tree back to the committed state, so checkout does not repeat
          # it with the one flag that also throws the dependencies away.
          clean: false

      # ARIA-HIGH-019 — anchor the job's wall-clock at the earliest possible
      # step, BEFORE checkout and provisioning: every setup minute spent
      # before the epoch is a minute stolen from the close-out margin. The
      # nightly step used to compute its seal deadline from its OWN start
      # time, assuming ~5m of setup before it; a fresh-store restore of the
      # aria/state branch measures 17m41s (run 32771477211), which spent
      # the whole close-out margin before the first cycle phase and pushed the
      # seal 8 minutes past the 360m platform ceiling — the job was cancelled
      # between seal and publish (again on run 33172463619, cancelled at the
      # ceiling mid-handoff with the anchor still after setup).
      - name: Anchor the job launch epoch
        run: echo "ARIA_JOB_LAUNCH_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-aria-kernel

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Same dependency step as aria-operational-proof — the fresh
      # tool-cache Python on the self-hosted runner ships without the
      # kernel's deps (first live run failed importing yaml inside
      # verify_workflow_preflight, ORPHAN-LOW-302).
      - name: Pre-flight - Claude Code CLI present
        run: |
          set -euo pipefail
          # The floor's one owner is .github/manifests/aria-claude-floor.json (ARIA-HIGH-500).
          REQUIRED_CLAUDE_VERSION="$(PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel python3 -c 'from aria_kernel.doctor import claude_cli_version_floor; print(claude_cli_version_floor())')"
          CLAUDE_VERSION="$(claude --version | awk '{print $1}')"
          python3 - "$REQUIRED_CLAUDE_VERSION" "$CLAUDE_VERSION" <<'PY'
          import sys
          def parse(value):
              return tuple(int(part) for part in value.split('.'))
          required = parse(sys.argv[1])
          current = parse(sys.argv[2])
          if current < required:
              raise SystemExit(f"claude-code {sys.argv[2]} is below required {sys.argv[1]}")
          print(f"claude-code {sys.argv[2]} satisfies required {sys.argv[1]}")
          PY

      - name: Pre-flight - Claude Code auth + mock-mode kill-switch resolution
        id: preflight
        env:
          KILL_SWITCH: ${{ vars.ARIA_MOCK_KILL_SWITCH }}
          INPUT_MOCK: ${{ github.event.inputs.mock }}
        run: |
          set -euo pipefail
          if [ -n "${KILL_SWITCH:-}" ]; then
            EFFECTIVE_MOCK="${KILL_SWITCH}"
            MOCK_SOURCE="kill_switch"
          elif [ -n "${INPUT_MOCK:-}" ]; then
            EFFECTIVE_MOCK="${INPUT_MOCK}"
            MOCK_SOURCE="workflow_dispatch_input"
          else
            EFFECTIVE_MOCK="false"
            MOCK_SOURCE="workflow_default_claude"
          fi
          # Plan 032 Faz 032a — the kill switch is a raw repository variable
          # and the kernel's boolean parser raises on anything but
          # true/false, so a value like `enabled` would not force mock: it
          # would crash the executor after the claim. Refuse it HERE, where
          # the operator can read the reason, and name the source.
          case "${EFFECTIVE_MOCK}" in
            true|false) ;;
            *)
              echo "::error::ARIA mock resolution from ${MOCK_SOURCE} is '${EFFECTIVE_MOCK}'; only 'true' or 'false' is accepted" >&2
              exit 1
              ;;
          esac
          echo "effective_mock=${EFFECTIVE_MOCK}" >> "$GITHUB_OUTPUT"
          echo "mock_source=${MOCK_SOURCE}" >> "$GITHUB_OUTPUT"
          if [ "${EFFECTIVE_MOCK}" = "false" ]; then
            if env | grep -E '^(ANTHROPIC_API_KEY|CLAUDE_API_KEY|ANTHROPIC_AUTH_TOKEN)=' >/dev/null; then
              echo "::error::API-key Claude mode is disallowed for ARIA; use the kernel's Claude token ('claude setup-token' into the 0600 file ARIA_CLAUDE_OAUTH_TOKEN_FILE names) on the trusted runner." >&2
              exit 1
            fi
            claude --version >/tmp/aria-claude-auth.txt 2>/tmp/aria-claude-auth.err \
              || { echo "::error::Claude Code CLI preflight failed" >&2; cat /tmp/aria-claude-auth.err >&2; exit 1; }
            # ARIA-MEDIUM-563 — the kernel's own Claude token, read by the
            # kernel's one credential reader (the gateway injects it).
            if ! CLAUDE_CREDENTIAL="$(PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=aria-kernel python3 -m aria_kernel.provider_credentials check anthropic)"; then
              echo "::error::the kernel's Claude credential boundary refused (${CLAUDE_CREDENTIAL})" >&2
              exit 1
            fi
          fi

      - name: Persist enterprise workflow preflight
        env:
          PYTHONPATH: aria-kernel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          from aria_kernel.preflight import verify_workflow_preflight
          from aria_kernel.runtime_profile import SCHEDULER_MAX_PROPOSABLE_PROFILE

          # PLAN Wave 1 PR 2.6b — ONE declared write root, because after the
          # cutover there is one. The cycle's three state roots (tools,
          # workspace, findings) all live inside the store worktree, so the
          # pair of checkout-relative roots this used to declare would now
          # be write roots nothing writes to — a declaration that stopped
          # describing the run. Everything outside the store stays read-only,
          # which is a STRONGER claim than before: `aria-findings/` in the
          # checkout is no longer written at all.
          allowed = [".aria-state-store"]
          verdict = verify_workflow_preflight(
              workflow_id="aria-auto-cycle",
              job_id="cycle",
              # ORPHAN-HIGH-728 — this preflight runs BEFORE the state store
              # is bound, so it cannot know tonight's profile; what it can
              # declare honestly is the lane's STRUCTURAL ceiling, the most
              # any resolution here could ever produce. Read from the kernel
              # rather than written as a literal, so a constant that moves
              # moves this declaration with it. The profile the run actually
              # took is declared by the second preflight after the resolver,
              # and recorded by `set_profile` in runtime-profile-history.jsonl.
              profile=SCHEDULER_MAX_PROPOSABLE_PROFILE,
              workspace_root=os.environ["GITHUB_WORKSPACE"],
              allowed_write_roots=allowed,
              path_allowlist=allowed,
              # `github_git` is what the cutover added to this lane's reach:
              # the state branch is fetched and pushed over the repository
              # remote. Declared rather than folded into `github_artifact`,
              # because they are different credentials with different blast
              # radii and a reviewer must be able to see the git one.
              network_policy=["github_api", "github_artifact", "github_git"],
              network_enforcement_evidence=(
                  "state restore/publish limited to the aria/state branch over "
                  "the repository remote; artifact upload limited to the "
                  "run-scoped aria-state-cache-<run_id> and "
                  "quarantine-evidence-<run_id> names, both via the Actions "
                  "artifact API"
              ),
              token_provenance="github_actions_artifact_token",
              require_github_app=False,
              dlp_mode="fail_closed",
              dlp_scan_clean=True,
              audit_reason=(
                  "nightly producer cycle over the durable aria/state store; "
                  "profile resolved per run from the L1 autonomy ladder "
                  "(strict when valid, standard otherwise)"
              ),
              audit_artifact_path=Path(os.environ["RUNNER_TEMP"]) / "aria-auto-cycle-preflight.json",
              external_root_allowlist=[str(Path(os.environ["RUNNER_TEMP"]).resolve())],
          )
          if not verdict.valid:
              raise SystemExit(";".join(verdict.reasons))
          PY

      - name: Restore ARIA state from the aria/state branch
        id: restore_state
        # RC-6 — one definition, both lanes. The two hand-copied heredocs that
        # used to sit here had already drifted: only the executor's carried the
        # ORPHAN-CRITICAL-484/488 restore-proof outputs, so the producer lane
        # could publish a bootstrap-empty tree over the accumulated state. The
        # action's header records what that cost.
        #
        # PLAN Wave 1 PR 2.6b — the transport is the durable store now, not the
        # 30-day artifact. The output contract is unchanged, deliberately: both
        # publish gates below still read `restored` / `bootstrap`. The action
        # also EXPORTS the store binding into the job environment, which is why
        # every `--tools-dir` below names "$ARIA_TOOLS_DIR" and never a literal.
        uses: ./.github/actions/restore-aria-state
        with:
          bootstrap-ack: ${{ vars.ARIA_STATE_BOOTSTRAP_ACK }}
          # ARIA-HIGH-342 — this job writes aria/state, so it takes the writer
          # lease before the checkout and holds it to the release step at the
          # end: no other lane can publish in between. The expiry is this
          # job's own timeout-minutes plus the 80-minute leased-publish margin
          # (GSEC-MEDIUM-003); the wait covers the hosted writers' whole
          # bounds (at most 25 min) before the run yields by name. The TTL
          # moves with the cap (440 → 534 when 360 → 454, ARIA-LOW-585): a
          # publish at the very end of a longer job must still find a whole
          # leased publish left on the lease.
          writer-lease-ttl-minutes: '534'
          writer-lease-wait-seconds: '1800'
      - name: Pre-flight - cross-host autonomous-loop lease check
        id: lease_check
        env:
          WRITER_LEASE: ${{ steps.restore_state.outputs.writer-lease }}
        run: |
          set -euo pipefail
          PYTHONPATH=aria-kernel python3 - <<'PY' 2>&1 | head -20
          import json
          import os
          import sys

          from aria_kernel.autonomous_host_lease import lease_state

          # ARIA-HIGH-342 — no writer lease, no store: the restore yielded
          # (another lane is writing aria/state) and checked nothing out, so
          # this run blocks here, before anything reads the tree.
          if os.environ.get('WRITER_LEASE') != 'held':
              print('::warning::aria/state writer lease not held; run yielded', file=sys.stderr)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
                  f.write('blocked=true\n')
                  f.write('blocked_host=aria/state-writer-lease\n')
              sys.exit(0)

          # os.environ[...] rather than a literal: the lease ledger lives in
          # the store, and a KeyError here is the correct outcome if the
          # restore did not bind it. The literal would have read a DIFFERENT,
          # empty lease ledger in the ephemeral checkout and reported "no
          # lease held" — the exact false clear ORPHAN-CRITICAL-469 was.
          state = lease_state(os.environ['ARIA_TOOLS_DIR'])
          print(json.dumps(state))
          if state['state'] == 'fresh':
              host = state.get('host_id', '')
              if not host.startswith('gha-runner:'):
                  print(f'::warning::autonomous_host_lease_blocked: held by {host}', file=sys.stderr)
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
                      f.write('blocked=true\n')
                      f.write(f'blocked_host={host}\n')
                  sys.exit(0)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('blocked=false\n')
          PY

      - name: Skip when local lease is fresh
        if: steps.lease_check.outputs.blocked == 'true'
        run: |
          echo "Local host holds autonomous-loop lease; exiting cleanly per Plan ARIA-V3 §2n."
          exit 0

      # Every `--tools-dir` below names "$ARIA_TOOLS_DIR", the binding the
      # restore step exported, and never the literal `aria-tools`. The literal
      # is not merely stale — `aria-tools/repo_identity.json` is TRACKED in the
      # checkout, so it names a real, valid, and completely wrong tools root:
      # the run would succeed while writing every ledger to a tree that dies
      # with the runner. `set -u` turns an absent binding into a failed step,
      # which is the only acceptable alternative to the right root.
      #
      # The `integrity migrate-tools-bootstrap` step that used to sit here moved
      # INTO the restore action (PLAN Wave 1 PR 2.6b). It was this lane's alone,
      # and the executor needed it just as much: a store checkout is not a
      # usable tools root until it is bound. One definition, both lanes — the
      # same correction RC-6 made to the restore itself.
      - name: Handoff snapshot - session_start
        if: steps.lease_check.outputs.blocked != 'true'
        run: |
          set -euo pipefail
          PYTHONPATH=aria-kernel python3 -m aria_kernel handoff snapshot \
            --session-id "auto-cycle-${GITHUB_RUN_ID}" \
            --tools-dir "$ARIA_TOOLS_DIR" \
            --trigger session_start

      # ARIA-HIGH-415 — the operator's proof that the channel reaches a person
      # (gate f). Two notices with one fixed title: the first opens the issue,
      # the second must COMMENT on it, which proves the lookup finds a
      # just-created issue (the old search-index lookup did not, and opened a
      # second one). Before the cycle, so the answer is minutes away, not hours;
      # the outbox rows ride the night's publish.
      #
      # ARIA-LOW-553 — the check proves the channel; it does not gate the
      # night. A failed send or a second notice that did not comment used to
      # fail this step, and every provisioning and cycle step after it carries
      # a plain `if:` (an implied success()), so the dispatch that asked for
      # the proof lost its night with it. Scheduled nights never run the check
      # and the doctor judges the channel after every cycle either way. The
      # verdict now leaves as `verified` (the `::error` annotation still lands
      # here, minutes in) and "Fail on a failed notification channel check"
      # turns the run red after the publish. A step the platform kills is a
      # failed step too and would skip the night the same way, so each send
      # runs under notify's own priced worst case (NOTIFY_WORST_CASE_SECONDS,
      # 1380 s, aria_kernel/notify.py: the bound a caller running a notifying
      # command as a child sizes its wall clock from) and the step's timeout
      # covers both sends: 2 x (1380 s + 30 s) = 2820 s < 50 min. A send cut
      # there is a false verdict, not a lost night.
      - name: Notification channel check (dispatch-gated)
        id: channel_check
        if: steps.lease_check.outputs.blocked != 'true' && steps.lease_check.outputs.blocked == 'false' && github.event.inputs.channel_check == 'true'
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ github.token }}
          ARIA_NOTIFY_CHANNELS: github_issue
          ARIA_NOTIFY_GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for n in 1 2; do
            PYTHONPATH=aria-kernel timeout --kill-after=30s 1380s python3 -m aria_kernel notify send --kind test \
              --title "ARIA notification channel check" \
              --body "channel check ${n}/2 from run ${GITHUB_RUN_ID}" \
              --key "channel-check:${GITHUB_RUN_ID}:${n}" \
              --tools-dir "$ARIA_TOOLS_DIR" > "${RUNNER_TEMP}/aria-channel-check-${n}.json" \
              || echo "::warning title=ARIA channel check::send ${n}/2 exited $?"
          done
          if python3 - "${RUNNER_TEMP}/aria-channel-check-1.json" "${RUNNER_TEMP}/aria-channel-check-2.json" <<'PY'
          import json
          import sys

          first, second = (json.load(open(path, encoding="utf-8")) for path in sys.argv[1:3])
          actions = [rows[0]["detail"].get("action") for rows in (first, second)]
          print(f"channel check: {actions}")
          if [r["status"] for r in (*first, *second)] != ["sent", "sent"] or actions[1] != "commented":
              raise SystemExit(f"::error title=ARIA channel check::expected sent+sent with the second commented, got {actions}")
          PY
          then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the composed supergraph for the drift scan
        if: steps.lease_check.outputs.blocked != 'true' && (github.event.inputs.mode || 'cycle') == 'cycle'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ARIA-HIGH-333 — the scan judges a UI option list against what the GraphQL transport carries, which it
          # reads from the composed supergraph. This host does not compose one; the artifact CI composed for HEAD's
          # exact schema is fetched instead. Without it the scan reports wire_unverifiable rather than guessing.
          SG_DIR="${RUNNER_TEMP}/aria-supergraph"
          if out="$(python3 tools/aria-poc/fetch_supergraph.py --repo-root "$GITHUB_WORKSPACE" --repo "$GITHUB_REPOSITORY" --out-dir "$SG_DIR")"; then
            echo "ARIA_SUPERGRAPH=${SG_DIR}/supergraph.graphql" >> "$GITHUB_ENV"
          fi
          echo "$out"

      - name: Seed drift findings from fresh scan
        if: steps.lease_check.outputs.blocked != 'true' && (github.event.inputs.mode || 'cycle') == 'cycle'
        run: |
          set -euo pipefail
          # A fresh PoC mechanical scan at HEAD feeds the empty-cycle guard and
          # the pressure pipeline with real, never-stale drift findings
          # (ORPHAN-MEDIUM-297). The seeder resolves its output through the
          # kernel's own `repo_state_root`, so the seeds land in the store the
          # cycle_guard reads from — writing them to the checkout instead would
          # be a producer that stays green feeding a consumer that stays empty.
          python3 tools/aria-poc/seed_drift_findings.py --repo-root "$GITHUB_WORKSPACE" ${ARIA_SUPERGRAPH:+--supergraph "$ARIA_SUPERGRAPH"} | tail -12

      - name: Cycle guard (advisory)
        if: steps.lease_check.outputs.blocked != 'true' && (github.event.inputs.mode || 'cycle') == 'cycle'
        run: |
          set -euo pipefail
          PYTHONPATH=aria-kernel python3 -m aria_kernel cycle-guard evaluate \
            --cycle-id "auto-cycle-${GITHUB_RUN_ID}" \
            --workspace-root "$GITHUB_WORKSPACE" \
            --tools-dir "$ARIA_TOOLS_DIR" | tee /tmp/cycle-guard.json || true
          {
            echo '### Cycle guard (advisory)'
            echo '```json'
            cat /tmp/cycle-guard.json 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ORPHAN-HIGH-471 — the nightly lane spawns agents through the same
      # run_claude_exec path the executor lane does, but shipped without a
      # sandbox backend. bwrap is not present on a bare runner, so
      # wrap_bash_in_sandbox raises SandboxUnavailable: the lane fails closed
      # rather than running unconfined, which is correct but means it could
      # not do real agent work at all. These two steps are copied from
      # aria-agent-executor.yml so the two lanes cannot drift.
      #
      # Not gated on effective_mock: a mock cycle still runs every adapter,
      # and adapters run only inside the bwrap room (ARIA-CRITICAL-399,
      # aria_kernel/adapter_room.py), so the backend is verified on every
      # cycle run, mock or real.
      # RC-9 — one definition, called by both lanes. The pair of steps that
      # used to sit here was duplicated between aria-agent-executor and
      # aria-auto-cycle, with a comment saying they were copied so the lanes
      # could not drift; copying is how they drift. The action also probes
      # BEFORE installing, so an already-provisioned runner needs no apt call.
      - name: Ensure a verified sandbox backend
        if: steps.lease_check.outputs.blocked != 'true'
        uses: ./.github/actions/ensure-sandbox-backend

      # ARIA-HIGH-383 — self-revert and branch-update validate in the same
      # room as the executor's apply gate (`validation_sandbox_for`), and
      # that room binds every toolchain the tree declares: the root
      # Cargo.toml declares cargo + rustc. Without them the room is
      # refused by name (`validation_toolchain_unresolvable:cargo`).
      - name: Provision the Rust toolchain the tree declares
        if: steps.lease_check.outputs.blocked != 'true' && steps.preflight.outputs.effective_mock == 'false'
        uses: ./.github/actions/setup-rust-workspace

      # The adapter manifests declare `npx ts-node …` runners, and the tool
      # runner refuses to execute them when the workspace has no repo-local
      # ts-node — correctly: silently resolving a global one would run
      # unpinned code. This lane never provisioned what the manifests
      # declare, so the first cycle after the registry sync ran six adapters
      # into six `tool_unhealthy` rows (missing node_modules/ts-node). The
      # runner is self-hosted and the checkout persists, so the guard makes
      # this a no-op on every run after the first.
      # Operator-gated unquarantine, BEFORE the cycle so the same run's
      # tools phase can exercise the lifted tools and the same publish step
      # carries the audited transition. The kernel verb refuses without an
      # approval ref; empty inputs make this a no-op, so the scheduled
      # nightly never touches it. Added because six adapters were quarantined
      # by an environment fault (missing node deps priced as tool guilt) and
      # unquarantine_tool was API-only — no operator-reachable caller.
      # ARIA-CRITICAL-216 — each ref is an operator's GitHub act approving one
      # tool, verified by the kernel through the API and spent once, so the
      # refs pair with the ids one to one.
      - name: Operator unquarantine (dispatch-gated)
        if: steps.lease_check.outputs.blocked != 'true' && github.event.inputs.unquarantine_tool_ids != ''
        env:
          TOOL_IDS: ${{ github.event.inputs.unquarantine_tool_ids }}
          APPROVAL_REF: ${{ github.event.inputs.unquarantine_approval_ref }}
          ARIA_TOOLS: ${{ env.ARIA_TOOLS_DIR }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -n "${APPROVAL_REF}" ] || { echo '::error::unquarantine requires an approval ref'; exit 1; }
          if ! printf '%s' "${TOOL_IDS}" | grep -Eq '^[a-z0-9-]+(,[a-z0-9-]+)*$'; then
            echo '::error::tool ids must be comma-separated slugs'; exit 1
          fi
          # ARIA-HIGH-238 — the kernel owns the ref grammar; a regex copy here
          # drifts the day the kernel's grammar moves. One ref per tool id.
          PYTHONPATH=aria-kernel python3 -m aria_kernel operator check-ref \
            --list \
            --ref "${APPROVAL_REF}"
          IFS=',' read -ra IDS <<< "${TOOL_IDS}"
          IFS=',' read -ra REFS <<< "${APPROVAL_REF}"
          if [ "${#IDS[@]}" -ne "${#REFS[@]}" ]; then
            echo '::error::one approval ref per tool id, in the same order'; exit 1
          fi
          for i in "${!IDS[@]}"; do
            PYTHONPATH=aria-kernel python3 -m aria_kernel tool unquarantine \
              --tool-id "${IDS[$i]}" \
              --reason "operator dispatch: environment-fault quarantine lifted" \
              --operator-approval-ref "${REFS[$i]}" \
              --root-cause-note "quarantined by missing workspace node deps (ORPHAN-HIGH-607); the tool never executed" \
              --fixture-update-ref "n/a: no fixture change; environment fault" \
              --tools-dir "${ARIA_TOOLS}"
          done

      # ARIA-MEDIUM-271 — the signal the dispatching watchdog names lands in
      # THIS store, before the cycle reads its pressure, and the same publish
      # step carries it. The name is a closed vocabulary twice over: the
      # input's choice options and the kernel's standing-signal table.
      - name: Runtime signal from the dispatching watchdog (dispatch-gated)
        if: steps.lease_check.outputs.blocked != 'true' && (github.event.inputs.mode || 'cycle') == 'cycle' && (github.event.inputs.runtime_signal || 'none') != 'none'
        env:
          RUNTIME_SIGNAL: ${{ github.event.inputs.runtime_signal }}
        run: |
          set -euo pipefail
          PYTHONPATH=aria-kernel python3 -m aria_kernel --tools-dir "$ARIA_TOOLS_DIR" \
            runtime signal ingest-standing --name "${RUNTIME_SIGNAL}"

      # A2 — one definition, both lanes (RC-9): the inline copy that used to
      # sit here is now .github/actions/ensure-node-deps, shared with the
      # executor lane whose missing provisioning tripped FAZ 5's pre-claim
      # gate (`env_deps_missing`, run 31456376668).
      - name: Provision the node dependencies the adapter manifests declare
        if: steps.lease_check.outputs.blocked != 'true'
        uses: ./.github/actions/ensure-node-deps

      # FAZ 5a — the merge gate's attestation producer, at lane start so the
      # row describes the host that will run the merge. Refusals (no sandbox,
      # no managed auth, API key present) are reported, not fatal here: the
      # merge-time verify is the enforcement point and now fails with the
      # refusal's named cause instead of a bare "attestation required".
      - name: Probe and record runner attestation
        if: steps.lease_check.outputs.blocked != 'true' && steps.preflight.outputs.effective_mock == 'false'
        uses: ./.github/actions/probe-runner-attestation
        with:
          tools-dir: ${{ env.ARIA_TOOLS_DIR }}

      # ORPHAN-HIGH-728 — WHICH PROFILE THE NIGHT RUNS UNDER IS A VERDICT
      # THE OPERATOR BOUNDS, NOT A LITERAL AND NOT A SELF-GRANT.
      #
      # This lane hardcoded `--profile standard` while `runtime_profile`
      # withholds `pr_create`/`pr_open` from standard, so every night ARIA
      # could converge a plan and then had no authority to open the pull
      # request that plan describes. The pipeline the profile table calls
      # "full implementation (claim -> planned -> committed -> validated ->
      # PR)" is `strict`, and this step is what asks whether the repository
      # has earned it tonight.
      #
      # Earning it is not the same as being granted it. ADR-033 records
      # strict as an operator decision and ADR-041 spends a week of observed
      # standard-profile nights before one; a lane that read its own
      # acceptance evidence as that grant would be handing itself the gesture
      # both documents reserve for a human — and would end the observation
      # window with the very event that window exists to produce. So the
      # answer is bounded by `scheduler_profile_ceiling`, an operator value
      # persisted through the EXISTING `runtime_profile` control plane
      # (default `standard`): the ladder chooses WITHIN the grant and can
      # never widen it. Raising it is one recorded command:
      #   aria-kernel profile set --profile standard \
      #     --scheduler-ceiling strict --operator-approval-ref <ref>
      #
      # The decision itself lives in `autonomy_unlock.resolve_scheduled_profile`
      # and not in this heredoc, because it is a governed rule with three
      # inputs and a defined order; a copy of it in YAML would be the second
      # answer to "may ARIA act" that this whole change exists to delete. The
      # step prints what the kernel decided.
      #
      # The ladder is asked through `evaluate_autonomy_unlock`, the read-only
      # half: this step decides a profile, it does not spend the merge gate's
      # verdict row. An unreadable ladder DEMOTES to standard with a named
      # reason and does not fail the job — losing the night's discovery would
      # trade a missing PR for a missing cycle — and an operator hold
      # (`frozen`/`observe`) is returned before the ladder is read at all, so
      # a stopped kernel is not written to by the step deciding whether to
      # honour the stop.
      - name: Resolve the cycle profile within the operator ceiling
        id: profile_gate
        if: steps.lease_check.outputs.blocked != 'true' && (github.event.inputs.mode || 'cycle') == 'cycle'
        env:
          PYTHONPATH: aria-kernel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          from aria_kernel.autonomy_unlock import resolve_scheduled_profile

          decision = resolve_scheduled_profile(
              lane="L1", base_dir=Path(os.environ["ARIA_TOOLS_DIR"]),
          )
          reasons = "; ".join(decision.reasons)
          # `l1_valid` is three-valued on purpose: an operator hold means the
          # ladder was never asked, and "false" would misreport that as
          # evidence found wanting.
          l1_valid = (
              "not-consulted" if decision.l1_valid is None
              else str(decision.l1_valid).lower()
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"profile={decision.profile}\n")
              handle.write(f"l1_valid={l1_valid}\n")
              handle.write(f"ceiling={decision.ceiling}\n")
          # `reasons` deliberately does NOT become a step output: a reason
          # code carrying a newline would terminate the KEY=VALUE record and
          # let the rest be read as a further output. It reaches a human via
          # the summary and the annotation below, both of which are text.
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(
                  f"### Cycle profile: `{decision.profile}` "
                  f"(L1 unlock valid={l1_valid})\n"
                  f"- persisted profile on entry: `{decision.persisted}`\n"
                  f"- operator scheduler ceiling: `{decision.ceiling}`\n"
                  f"- ladder proposal: `{decision.ladder_profile}`\n"
                  f"- counts: `{decision.counts}`\n"
                  f"- reasons: {reasons}\n"
              )
          if decision.ladder_profile is None:
              print(
                  f"::warning::operator_held_profile_preserved: "
                  f"{decision.persisted} holds no action authority; the "
                  "ladder was not consulted"
              )
          elif decision.profile != decision.ladder_profile:
              print(
                  "::warning::scheduler_ceiling_bound: the L1 ladder proposed "
                  f"{decision.ladder_profile}; the operator ceiling is "
                  f"{decision.ceiling}, so the cycle runs "
                  f"{decision.profile} ({reasons})"
              )
          elif decision.l1_valid is not True:
              print(
                  "::warning::l1_autonomy_unlock_invalid: refusing strict, "
                  f"running under {decision.profile} ({reasons})"
              )
          PY

      # ORPHAN-HIGH-728 — the SECOND preflight, and the one that can tell the
      # truth. The pre-restore preflight above runs before the state store is
      # bound, so it can only declare this lane's structural ceiling; by here
      # the profile is resolved, which is what makes
      # `frozen_profile_blocks_mutating_workflow` reachable on this lane at
      # all. That gate was dead code here while the declaration was a literal
      # — newly consequential now that the resolver deliberately PRESERVES a
      # frozen hold instead of thawing it: a kernel an operator stopped must
      # not have a workflow declaring write roots run against it.
      - name: Persist enterprise workflow preflight for the resolved profile
        if: steps.lease_check.outputs.blocked != 'true' && (github.event.inputs.mode || 'cycle') == 'cycle'
        env:
          PYTHONPATH: aria-kernel
          RESOLVED_PROFILE: ${{ steps.profile_gate.outputs.profile }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          from aria_kernel.preflight import verify_workflow_preflight

          allowed = [".aria-state-store"]
          verdict = verify_workflow_preflight(
              workflow_id="aria-auto-cycle",
              job_id="cycle",
              profile=os.environ["RESOLVED_PROFILE"],
              workspace_root=os.environ["GITHUB_WORKSPACE"],
              allowed_write_roots=allowed,
              path_allowlist=allowed,
              network_policy=["github_api", "github_artifact", "github_git"],
              network_enforcement_evidence=(
                  "state restore/publish limited to the aria/state branch over "
                  "the repository remote; artifact upload limited to the "
                  "run-scoped aria-state-cache-<run_id> and "
                  "quarantine-evidence-<run_id> names, both via the Actions "
                  "artifact API"
              ),
              token_provenance="github_actions_artifact_token",
              require_github_app=False,
              dlp_mode="fail_closed",
              dlp_scan_clean=True,
              audit_reason=(
                  "nightly producer cycle over the durable aria/state store, "
                  "declared with the profile the run resolved within the "
                  "operator scheduler ceiling"
              ),
              audit_artifact_path=(
                  Path(os.environ["RUNNER_TEMP"])
                  / "aria-auto-cycle-preflight-resolved.json"
              ),
              external_root_allowlist=[str(Path(os.environ["RUNNER_TEMP"]).resolve())],
          )
          if not verdict.valid:
              raise SystemExit(";".join(verdict.reasons))
          PY

      - name: Start the GitHub App token broker (ARIA-MEDIUM-583)
        id: token_broker
        if: steps.lease_check.outputs.blocked != 'true' && (github.event.inputs.mode || 'cycle') == 'cycle'
        env:
          # ARIA-MEDIUM-583 — the App key enters THIS step's env only, on its
          # way to the broker's stdin. The broker is a SIBLING of the cycle
          # process (a later step), not its ancestor: on this runner's Yama
          # ptrace_scope=1 the cycle cannot read its memory, the key lives in
          # the broker's memory alone, and what the cycle step inherits is the
          # socket path exported below. The broker mints only the closed
          # allowlist of named permission sets, caps mints per night and
          # clamps every TTL to the deadline this step computes.
          ARIA_GH_APP_PRIVATE_KEY: ${{ secrets.ARIA_GH_APP_PRIVATE_KEY }}
          ARIA_GH_APP_ID: ${{ secrets.ARIA_GH_APP_ID }}
          ARIA_GH_APP_INSTALLATION_ID: ${{ secrets.ARIA_GH_APP_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          if [ -z "$ARIA_GH_APP_PRIVATE_KEY" ]; then
            # No App configured: nothing to hold. The cycle's Mode A mint
            # then refuses by name (ARIA_REQUIRE_MODE_A), exactly as it
            # refuses today when the key is missing.
            echo "socket=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The broker dies with the job's own cap (anchored at job launch,
          # the env the anchor step exported): a broker the runner fails to
          # reap cannot hold the key past the job, and no token it mints can
          # outlive it either. The pairing with the job's timeout-minutes is
          # pinned by test_delivery_identity_lanes.py.
          BROKER_DEADLINE=$(( ARIA_JOB_LAUNCH_EPOCH + 454 * 60 ))
          SOCKET="$(printf '%s\n' "$ARIA_GH_APP_PRIVATE_KEY" | PYTHONPATH=aria-kernel python3 -m aria_kernel.token_broker start \
            --app-id "$ARIA_GH_APP_ID" \
            --installation-id "$ARIA_GH_APP_INSTALLATION_ID" \
            --deadline-epoch "$BROKER_DEADLINE" \
            --ledger "${RUNNER_TEMP}/aria-token-broker-ledger-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl")"
          echo "socket=${SOCKET}" >> "$GITHUB_OUTPUT"
          echo "ARIA_GH_TOKEN_BROKER_SOCKET=${SOCKET}" >> "$GITHUB_ENV"

      - name: Run the nightly cycle under the resolved profile
        if: steps.lease_check.outputs.blocked != 'true' && (github.event.inputs.mode || 'cycle') == 'cycle'
        env:
          # ORPHAN-HIGH-626 — the pr_ci_scan phase's gh reads (own-PR list +
          # check verdicts) authenticate with the job token; without it the
          # checks reader reports gh_token_absent and the scan is a visible
          # no-op instead of a silent one.
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CLI_MOCK: ${{ steps.preflight.outputs.effective_mock }}
          CLAUDE_CLI_MOCK_SOURCE: ${{ steps.preflight.outputs.mock_source }}
          ARIA_CLAUDE_REQUIRE_USAGE: '1'
          MAX_TURNS_PER_RUN: '12'
          # ARIA-HIGH-208 — the App a delivery mints its PR credential from.
          # ARIA_REQUIRE_MODE_A: that mint is Mode A or refuses by name; it
          # never copies the ambient GH_TOKEN (Mode B) into a PR's author.
          ARIA_REQUIRE_MODE_A: 'true'
          # ARIA-MEDIUM-583 — the App key lives in the broker this job
          # started (the step above); this process holds the broker's socket
          # path only (ARIA_GH_TOKEN_BROKER_SOCKET, exported by that step).
          # REQUIRE_TOKEN_BROKER refuses any in-process key mint by name,
          # even if a key were ever handed back to this step.
          ARIA_REQUIRE_TOKEN_BROKER: 'true'
          MAX_REQUESTS_PER_RUN: '30'
          MAX_TIMEOUT_SECONDS: '1800'
          # Plan 032 Faz 032a — the dispatcher factories poll for an envelope
          # consumer INSIDE the cycle, and on this lane no consumer runs
          # until the executor lane starts after the cycle ends: every poll
          # structurally lost its full 600s (13/13 in production). Zero
          # returns the structured fallback at once; the executor still
          # drains the minted envelope, and the chain brings the answer back.
          ARIA_DISPATCHER_POLL_TIMEOUT_SECONDS: '0'
          MAX_CYCLES_INPUT: ${{ github.event.inputs.max_cycles }}
          # ORPHAN-HIGH-728 — the resolved verdict, carried as data. A
          # literal here is exactly the drift the gate above exists to
          # remove, and `autonomous` is unreachable from this lane by
          # construction: the resolver proposes at most
          # `SCHEDULER_MAX_PROPOSABLE_PROFILE` and then bounds that by the
          # operator ceiling.
          ARIA_CYCLE_PROFILE: ${{ steps.profile_gate.outputs.profile }}
          # `set_profile` demands an approval ref on EVERY transition and
          # synthesises `cli-flag:<daemon>:<epoch>` when the flag is absent
          # — a ref that names nothing an auditor can follow. The executor
          # lane enforces the PERSISTED profile, so this string is what a
          # later reader has to reconstruct the night's authority from: it
          # names the gate that granted it and the run that recorded it.
          ARIA_PROFILE_APPROVAL_REF: >-
            aria-auto-cycle:ceiling=${{ steps.profile_gate.outputs.ceiling }}:l1-unlock=${{ steps.profile_gate.outputs.l1_valid }}:run=${{ github.run_id }}
          # ARIA-HIGH-415 — where the kernel's notices go: one issue per fixed
          # title on this repository, written with the job token above (an
          # installation token; `issues: write` at the top of this file).
          # Without the repository name `github_issue` is not configured, and
          # every notice was an `unconfigured` outbox row (268 of 268 on
          # aria/state f5c5c86a1). `github_issue` is named so `stdout` is never
          # selected: a journal is not an inbox.
          ARIA_NOTIFY_CHANNELS: github_issue
          ARIA_NOTIFY_GITHUB_REPO: ${{ github.repository }}
        run: |
          # ARIA-HIGH-208 (was ORPHAN-722) — PR identity. A PR opened with
          # the job token is authored by github-actions[bot] and GitHub parks
          # its workflows in action_required (anti-recursion, not a repo
          # setting): aria-merge-authority, the readiness claim and the merge
          # runner never start. Every PR this lane opens goes through a
          # delivery hold (`delivery_credentials`) that mints its own App
          # installation token where it is consumed and revokes it after;
          # ARIA_REQUIRE_MODE_A (env above) makes that mint refuse by name
          # when the App is not configured, instead of falling back.
          # ARIA-CRITICAL-246 — the ambient GH_TOKEN (env above) is the job
          # token and nothing else. It serves the lane's own gh reads and the
          # kernel's issue writes, which GitHub authors as a Bot. The runner
          # .env's operator PAT (ARIA_GH_TOKEN) is never exported: a write
          # made with it is authored by the operator, and an operator act is
          # what an ARIA-APPROVE line is verified against.
          # ARIA-MEDIUM-583 — the App key this step used to write to
          # $RUNNER_TEMP and export as ARIA_GH_APP_PRIVATE_KEY_PATH is gone
          # from the cycle process entirely: the delivery mints through the
          # broker step above (ARIA_GH_TOKEN_BROKER_SOCKET, exported by it),
          # which holds the key in memory and answers narrowed, capped,
          # TTL-clamped tokens. Narrowing the job token (ARIA-MEDIUM-555)
          # now actually takes repository write away from this process.
          set -euo pipefail
          MAX_CYCLES="${MAX_CYCLES_INPUT:-1}"
          if ! [[ "$MAX_CYCLES" =~ ^[0-9]{1,2}$ ]]; then
            echo "::error::invalid max_cycles: ${MAX_CYCLES}" >&2
            exit 1
          fi
          # Smoke-run 31645296013 — a spawn that cannot finish before the
          # job dies must not start. Export the ABSOLUTE deadline this job
          # runs under: its own timeout-minutes minus the close-out margin
          # (ARIA_CLOSE_OUT_MARGIN_SECONDS, job env above, with its
          # arithmetic) for every step after this one, so claude_runtime
          # clamps every spawn's timeout to the remaining wall-clock instead
          # of letting the last spawn be cut mid-flight and the whole night
          # quarantine.
          # ARIA-HIGH-019 — the epoch is anchored at the job-launch step
          # near the top of this job ($ARIA_JOB_LAUNCH_EPOCH), NOT here: a
          # fresh-store restore measured 17m41s before this step (run
          # 32771477211), which consumed the margin computed from the step
          # clock and sealed the cycle 8 minutes past the job cap. Anchoring
          # here is only the local-dispatch fallback (env unset). The cap and
          # the margin move together (ARIA-LOW-585), so the spawn deadline —
          # the window the night may spend — is the same 260 minutes.
          JOB_TIMEOUT_MINUTES=454
          ANCHOR_EPOCH="${ARIA_JOB_LAUNCH_EPOCH:-$(date +%s)}"
          export ARIA_JOB_DEADLINE_EPOCH=$(( ANCHOR_EPOCH + JOB_TIMEOUT_MINUTES * 60 - ARIA_CLOSE_OUT_MARGIN_SECONDS ))
          echo "spawn deadline: $(date -u -d @${ARIA_JOB_DEADLINE_EPOCH} +%H:%M:%SZ) (job cap ${JOB_TIMEOUT_MINUTES}m - $(( ARIA_CLOSE_OUT_MARGIN_SECONDS / 60 ))m margin, anchored $( [ -n "${ARIA_JOB_LAUNCH_EPOCH:-}" ] && echo at-job-launch || echo at-step ))"
          # The per-cycle wall clock is DERIVED from the job budget, not
          # hardcoded. It used to be a flat 1800s while the job cap was 360m:
          # the SIGALRM fired ~17s after the last discovery adapter finished
          # and killed every night before the planner phase ever ran (run
          # 33821426201 and every run back to 2026-08-21). Splitting the
          # remaining wall clock across the remaining cycles keeps the
          # deadline a safety net rather than a guillotine, and still cannot
          # outlive the job.
          CYCLE_BUDGET_SECONDS=$(( ARIA_JOB_DEADLINE_EPOCH - $(date +%s) ))
          if [ "$CYCLE_BUDGET_SECONDS" -lt 900 ]; then
            echo "::error::only ${CYCLE_BUDGET_SECONDS}s left before the job deadline; refusing to start a cycle that cannot finish" >&2
            exit 1
          fi
          CYCLE_DEADLINE_SECONDS=$(( CYCLE_BUDGET_SECONDS / MAX_CYCLES ))
          echo "per-cycle deadline: ${CYCLE_DEADLINE_SECONDS}s (${CYCLE_BUDGET_SECONDS}s budget / ${MAX_CYCLES} cycles)"
          ARIA_CONSENSUS_PROMOTION_ACK="${{ vars.ARIA_CONSENSUS_PROMOTION_ACK }}" \
          PYTHONUNBUFFERED=1 \
          PYTHONPATH=aria-kernel python3 -m aria_kernel autonomy run \
            --workspace-root "$GITHUB_WORKSPACE" \
            --tools-dir "$ARIA_TOOLS_DIR" \
            --profile "$ARIA_CYCLE_PROFILE" \
            --operator-approval-ref "$ARIA_PROFILE_APPROVAL_REF" \
            --max-cycles "$MAX_CYCLES" \
            --cycle-deadline-seconds "$CYCLE_DEADLINE_SECONDS" | tee /tmp/cycle-summary.txt
          {
            echo '### Nightly cycle summary'
            echo '```'
            tail -40 /tmp/cycle-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run REAL observe burn-in + L1 ladder bridge
        if: steps.lease_check.outputs.blocked != 'true' && github.event.inputs.mode == 'burn-in-observe'
        env:
          # REAL mode by design: no ARIA_DRY_RUN here (the dry-run variant
          # lives in aria-operational-proof.yml); CLAUDE_CLI_MOCK is the
          # preflight's resolved value.
          # Observe cycles are LLM-free (NoOp cost hook) — near-zero cost.
          CLAUDE_CLI_MOCK: ${{ steps.preflight.outputs.effective_mock }}
        run: |
          set -euo pipefail
          # The kernel guards observe burn-in with
          # observe_burn_in_tools_dir_must_be_outside_workspace_root
          # (ORPHAN-LOW-304): the burn-in gets its own RUNNER_TEMP tools
          # root, while the LADDER BRIDGE below writes acceptance events
          # into the STORE's tools tree, which the aria/state push persists
          # across nights.
          # Visibility for the kernel's clean-tree guard: any dirty path
          # here is the exact refusal reason (ORPHAN-LOW-306).
          echo "pre-burn-in worktree status:"; git status --porcelain | head -10
          BURN_TOOLS="$(mktemp -d "${RUNNER_TEMP}/aria-burn-tools.XXXXXX")"
          # Second kernel guard (ORPHAN-LOW-305): the output dir must
          # live UNDER the burn-in tools root's burn-in/ subtree.
          BURN_IN_DIR="${BURN_TOOLS}/burn-in/run-${GITHUB_RUN_ID}"
          WORKSPACE_BASE="$(mktemp -d "${RUNNER_TEMP}/aria-workspaces.XXXXXX")"
          mkdir -p "$BURN_IN_DIR"
          PYTHONPATH=aria-kernel:. python3 -m aria_kernel \
            autonomy burn-in observe \
            --tools-dir "$BURN_TOOLS" \
            --workspace-root "$GITHUB_WORKSPACE" \
            --workspace-base "$WORKSPACE_BASE" \
            --target-ref "$GITHUB_SHA" \
            --cycles 30 \
            --min-valid-cycles 20 \
            --output-dir "$BURN_IN_DIR"
          # Persist the burn-in evidence bundle alongside the ladder
          # ledger so the published state carries proof + events together.
          mkdir -p "${ARIA_TOOLS_DIR}/burn-in/run-${GITHUB_RUN_ID}"
          cp "$BURN_IN_DIR"/autonomy-burn-in-report.json "${ARIA_TOOLS_DIR}/burn-in/run-${GITHUB_RUN_ID}/"
          PYTHONPATH=aria-kernel:. python3 - "$BURN_IN_DIR" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from aria_kernel.autonomy_ladder import record_burn_in_acceptance
          from aria_kernel.autonomy_unlock import evaluate_autonomy_unlock

          burn_in_dir = Path(sys.argv[1])
          report = json.loads((burn_in_dir / "autonomy-burn-in-report.json").read_text())
          verdict = report.get("acceptance_verdict")
          print(f"burn-in acceptance_verdict={verdict}")
          if verdict != "passed":
              raise SystemExit(f"burn-in did not pass ({verdict}); ladder bridge refused (fail-closed)")
          # The store's tools root, not a literal. Ladder acceptance events
          # written to the ephemeral checkout would be evidence toward an
          # unlock that no later run can ever see — the ladder counting to
          # thirty and resetting to zero every night.
          tools_root = os.environ["ARIA_TOOLS_DIR"]
          bridged = record_burn_in_acceptance(report=report, mode="real", base_dir=tools_root)
          print(f"ladder bridge: recorded={bridged.get('recorded')} skipped={bridged.get('skipped')}")
          unlock = evaluate_autonomy_unlock(lane="L1", base_dir=tools_root)
          print(f"L1 unlocked: {unlock.valid}")
          print(f"counts: {unlock.counts}")
          if not unlock.valid:
              for reason in unlock.reasons:
                  print(f"  reason: {reason}")
          PY
          {
            echo '### Burn-in observe + L1 ladder bridge'
            echo '```json'
            cat "$BURN_IN_DIR/autonomy-burn-in-report.json" | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ARIA-HIGH-415 — the doctor, self-improvement and the daily summary run
      # in the live lane. The gateway daemon that was meant to schedule them is
      # not deployed on production, so until this the doctor's organs were read
      # by nobody and no self_improvement mission had ever opened. They run
      # after the cycle whatever its outcome (always(): a failed night is the
      # one to read), only on a cycle run, only when the lease check positively
      # cleared (`blocked == 'false'`: a run whose restore failed bound no
      # store to read), and before the integrity verify and the publish, so
      # their rows (outbox, governance, missions) are verified and published
      # with the night. Each one's exit is 0 on an unhealthy reading: the
      # reading is the output, and a red step would only hide the publish.
      - name: Doctor - record the failing organs
        if: always() && steps.lease_check.outputs.blocked != 'true' && steps.lease_check.outputs.blocked == 'false' && (github.event.inputs.mode || 'cycle') == 'cycle'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          ARIA_NOTIFY_CHANNELS: github_issue
          ARIA_NOTIFY_GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PYTHONPATH=aria-kernel python3 -m aria_kernel schedule run --action doctor \
            --tools-dir "$ARIA_TOOLS_DIR" \
            --workspace-root "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/aria-doctor.json"
          python3 - "$RUNNER_TEMP/aria-doctor.json" <<'PY'
          import json, os, sys
          detail = json.load(open(sys.argv[1], encoding="utf-8"))["detail"]
          counts = detail["summary"]
          lines = [f"### ARIA doctor — {'healthy' if detail['healthy'] else 'UNHEALTHY'}", "",
                   f"ok {counts['ok']} · warn {counts['warn']} · fail {counts['fail']}", ""]
          lines += [f"- `{organ['name']}` — {organ['reason']}" for organ in detail["failing"]]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          if not detail["healthy"]:
              names = ", ".join(organ["name"] for organ in detail["failing"])
              print(f"::error title=ARIA doctor unhealthy::failing organs: {names}")
          PY

      # ARIA-LOW-559 — reads the report the doctor step above wrote (the
      # doctor action's output carries it) instead of running every organ a
      # second time inside `scan_signals`. With no doctor run here, it holds
      # no notify env: it writes missions, never an issue, and the
      # notifications organ that judged the lane's channel was read above.
      # A missing or foreign report fails the step rather than re-running
      # the doctor.
      - name: Self-improve - open missions for failing organs
        if: always() && steps.lease_check.outputs.blocked != 'true' && steps.lease_check.outputs.blocked == 'false' && (github.event.inputs.mode || 'cycle') == 'cycle'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          PYTHONPATH=aria-kernel python3 -m aria_kernel schedule run --action self_improve \
            --tools-dir "$ARIA_TOOLS_DIR" \
            --workspace-root "$GITHUB_WORKSPACE" \
            --doctor-report "$RUNNER_TEMP/aria-doctor.json" | tee "$RUNNER_TEMP/aria-self-improve.json"

      # One comment a day on one issue: the delivery SLO and the
      # HUMAN_REQUIRED backlog counts (a record notifies on its own only when
      # CRITICAL).
      - name: Deliver - the daily summary with the human-required backlog
        if: always() && steps.lease_check.outputs.blocked != 'true' && steps.lease_check.outputs.blocked == 'false' && (github.event.inputs.mode || 'cycle') == 'cycle'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          ARIA_NOTIFY_CHANNELS: github_issue
          ARIA_NOTIFY_GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PYTHONPATH=aria-kernel python3 -m aria_kernel schedule run --action deliver \
            --tools-dir "$ARIA_TOOLS_DIR" \
            --workspace-root "$GITHUB_WORKSPACE"

      # ARIA-LOW-551 — where the close-out steps that carry no timeout of
      # their own begin (handoff, integrity verify, mint, publish): the
      # margin's basis prices exactly this stretch, and "Measure the unbounded
      # close-out" reads the anchor after the publish.
      - name: Anchor the unbounded close-out
        if: always() && steps.lease_check.outputs.blocked != 'true' && (github.event.inputs.mode || 'cycle') == 'cycle'
        run: echo "ARIA_UNBOUNDED_CLOSE_OUT_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Handoff snapshot - session_stop
        if: always() && steps.lease_check.outputs.blocked != 'true'
        run: |
          set -euo pipefail
          PYTHONPATH=aria-kernel python3 -m aria_kernel handoff snapshot \
            --session-id "auto-cycle-${GITHUB_RUN_ID}" \
            --tools-dir "$ARIA_TOOLS_DIR" \
            --trigger session_stop || true

      # ORPHAN-HIGH-424 — fail-closed publication gate. Pre-fix the upload
      # below ran under a bare `if: always()` with `overwrite: true`, so a
      # cycle killed mid-write republished its partial tree under the
      # canonical artifact name and the NEXT run restored it as
      # authoritative. `integrity verify` already exits non-zero on drift
      # (cli.py returns 1 when status != "ok") and already reports
      # started-without-terminal cycles, so the gate needs no new verifier
      # — only that its verdict decide which artifact name the state gets.
      # This step deliberately carries NO error-suppression flag, and the
      # sentence cannot spell the flag either: the
      # workflows_do_not_continue_on_error claim in
      # tools/gates/sens-enterprise-validation.ts is a raw text scan over the
      # whole file, so even a comment naming the pattern fails a required check.
      # Suppression was never needed here — the `integrity verify` call sits
      # inside an `if`, so `set -e` cannot abort the job on it — and the
      # fail-closed verdict is published by the separate
      # "Fail on unverified ARIA state" step below.
      - name: Verify ARIA state integrity
        id: integrity
        if: always() && steps.lease_check.outputs.blocked != 'true'
        run: |
          set -uo pipefail
          # RUNNER_TEMP, not /tmp — it is the only external write root the
          # workflow contract allows for this job
          # (external_root_allowlist in workflow_contract_registry.py).
          VERDICT="${RUNNER_TEMP}/aria-integrity-verdict.json"
          VERDICT_ERR="${RUNNER_TEMP}/aria-integrity-verdict.err"
          if PYTHONPATH=aria-kernel python3 -m aria_kernel integrity verify \
               --tools-dir "$ARIA_TOOLS_DIR" \
               --workspace-root "$GITHUB_WORKSPACE" > "$VERDICT" 2>"$VERDICT_ERR"; then
            echo "state_valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "state_valid=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo '### ARIA state integrity'
            echo '```json'
            head -c 4000 "$VERDICT" 2>/dev/null || echo '{}'
            echo '```'
            if [ -s "$VERDICT_ERR" ]; then
              echo '```'
              tail -20 "$VERDICT_ERR"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # RC-6 — the ORPHAN-CRITICAL-484/488 restore-proof gate the consumer
      # lane has always carried and this producer never did. Without it a
      # restore that failed or was skipped leaves a bootstrap-empty tree,
      # which passes `integrity verify` (an empty tree is trivially
      # consistent) and then overwrites the accumulated state under the
      # canonical name. The drift was invisible while the restore was two
      # hand-copied heredocs; it is one action now, so the outputs exist here.
      #
      # PLAN Wave 1 PR 2.6b — publish to the durable store. The `if:` is
      # UNCHANGED from the artifact era on purpose: `state_valid` plus the
      # restore proof is what stops a partial or bootstrap-empty tree being
      # published, and that reasoning did not depend on the transport.
      #
      # What the transport adds is the guarantee the artifact could never give.
      # `publish_state` pushes fast-forward-only, so a tree that does not
      # descend from the published tip is rejected by the SERVER — the failure
      # mode ORPHAN-CRITICAL-484 describes stops being something a gate has to
      # catch and becomes something the push cannot do.
      #
      # The credential is minted here and consumed by the next step only. Kept
      # out of `.git/config` so it cannot outlive the push.
      - name: Mint the aria/state push credential
        id: publish_credential
        if: always() && steps.lease_check.outputs.blocked != 'true' && steps.integrity.outputs.state_valid == 'true' && (steps.restore_state.outputs.restored == 'true' || steps.restore_state.outputs.bootstrap == 'true')
        env:
          PUBLISH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEADER="$(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 -w0)"
          echo "::add-mask::${HEADER}"
          echo "header=${HEADER}" >> "$GITHUB_OUTPUT"

      - name: Publish ARIA state to the aria/state branch
        if: always() && steps.lease_check.outputs.blocked != 'true' && steps.integrity.outputs.state_valid == 'true' && (steps.restore_state.outputs.restored == 'true' || steps.restore_state.outputs.bootstrap == 'true')
        env:
          # persist-credentials stays FALSE on the checkout, deliberately: a
          # persisted token is readable by every later step, including the
          # Claude CLI subprocess this lane exists to run. So the credential
          # lives in THIS STEP'S environment only.
          #
          # GIT_CONFIG_* is git's own env form of `-c`, so it reaches
          # state_store's git calls without state_store knowing about tokens —
          # `_run_git` passes no `env=`, so the subprocess inherits this and
          # nothing else does. No token is written to .git/config, which is
          # what would have leaked it forward.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: 'AUTHORIZATION: basic ${{ steps.publish_credential.outputs.header }}'
          # ARIA-HIGH-342 — the writer-lease capability, as a masked step
          # output into this step only (GSEC-LOW-002).
          ARIA_STATE_WRITER_LEASE_TOKEN: ${{ steps.restore_state.outputs.writer-lease-token }}
        run: |
          set -euo pipefail
          PYTHONPATH=aria-kernel python3 -m aria_kernel state publish \
            --repo-root . \
            --snapshot-id "auto-cycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --cycle-id "auto-cycle-${GITHUB_RUN_ID}"

      # ARIA-LOW-551 — the margin's unbounded basis was one measurement (#1371)
      # and no night that did real post-work had checked it. Every cycle night
      # now measures the stretch from the anchor to the end of the publish and
      # warns, by name, when it ran over the basis: the arithmetic that proves
      # the margin (basis + the declared step timeouts) no longer holds, and a
      # night that runs its cycle to the spawn deadline can be cut before its
      # publish ends.
      - name: Measure the unbounded close-out
        if: always() && steps.lease_check.outputs.blocked != 'true' && (github.event.inputs.mode || 'cycle') == 'cycle'
        run: |
          set -euo pipefail
          SPENT=$(( $(date +%s) - ARIA_UNBOUNDED_CLOSE_OUT_START_EPOCH ))
          {
            echo '### ARIA close-out'
            echo "unbounded close-out (handoff, verify, mint, publish): ${SPENT}s of the ${ARIA_CLOSE_OUT_UNBOUNDED_BASIS_SECONDS}s basis in the ${ARIA_CLOSE_OUT_MARGIN_SECONDS}s margin"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SPENT" -gt "$ARIA_CLOSE_OUT_UNBOUNDED_BASIS_SECONDS" ]; then
            echo "::warning title=ARIA close-out margin::the close-out steps without a timeout took ${SPENT}s, over the ${ARIA_CLOSE_OUT_UNBOUNDED_BASIS_SECONDS}s basis the ${ARIA_CLOSE_OUT_MARGIN_SECONDS}s margin is priced from; re-derive the margin (job env)"
          fi

      # FORENSIC CACHE ONLY — and the run-scoped name is the whole point.
      # `aria/state` is authoritative; this exists so a run that publishes and
      # then loses the remote still leaves its tree readable. It is deliberately
      # NOT the canonical name the old restore selected: an artifact that
      # anything restores from is a SECOND source of truth for one hash-chained
      # ledger, and it is the one that cannot enforce ancestry, so it would win
      # whenever it was newer. Nothing reads a `-<run_id>` name.
      # `aria-single-restore-path.spec.ts` pins that no lane republishes under
      # the canonical one.
      - name: Cache ARIA state tree (non-authoritative)
        if: always() && steps.lease_check.outputs.blocked != 'true' && steps.integrity.outputs.state_valid == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aria-state-cache-${{ github.run_id }}
          path: |
            .aria-state-store/
            !.aria-state-store/tools/human-required/genesis:*
          # The four pre-rename genesis escalations (2026-08-18 04:03) keep
          # their colon filenames on the live store — renaming a
          # ledger-referenced record would break hash-chained refs
          # (ORPHAN-714) — and GitHub's uploader rejects ':' in paths, so
          # the forensic copy must EXCLUDE them or every sealed run stays
          # red at this step. The records themselves remain in the
          # authoritative aria/state publish; only this non-authoritative
          # artifact skips them.
          retention-days: 30
          # Hidden files included on purpose: the store root itself is a
          # dot-directory and `.gitkeep` markers hold its empty subtrees. A
          # forensic copy that silently dropped them would not reproduce the
          # tree it claims to preserve.
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

      # Unverified state is still preserved for forensics, under the same
      # run-scoped naming discipline. Nothing restores from it.
      - name: Quarantine unverified ARIA state
        if: always() && steps.lease_check.outputs.blocked != 'true' && (steps.integrity.outputs.state_valid != 'true' || (steps.restore_state.outputs.restored != 'true' && steps.restore_state.outputs.bootstrap != 'true'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quarantine-evidence-${{ github.run_id }}
          path: |
            .aria-state-store/
            !.aria-state-store/tools/human-required/genesis:*
            ${{ runner.temp }}/aria-integrity-verdict.json
            ${{ runner.temp }}/aria-integrity-verdict.err
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: warn
          overwrite: true

      - name: Fail on unverified ARIA state
        if: always() && steps.lease_check.outputs.blocked != 'true' && (steps.integrity.outputs.state_valid != 'true' || (steps.restore_state.outputs.restored != 'true' && steps.restore_state.outputs.bootstrap != 'true'))
        run: |
          echo "::error::ARIA state failed integrity verification; captured as quarantine-evidence-${GITHUB_RUN_ID} and NOT published to the aria/state branch." >&2
          exit 1

      # ARIA-LOW-553 — the channel check's false verdict, red here: after the
      # night ran and published, never in place of it.
      - name: Fail on a failed notification channel check
        if: always() && steps.lease_check.outputs.blocked != 'true' && steps.channel_check.outputs.verified == 'false'
        run: |
          echo "::error title=ARIA channel check::the notification channel check failed (see the 'Notification channel check (dispatch-gated)' step); the night ran and published regardless." >&2
          exit 1

      # ARIA-HIGH-342 — give back the aria/state writer lease the restore took.
      # Unconditional (GSEC-LOW-001): release is idempotent, a no-op when this
      # run yielded and holds none, and releases only by the token (kept on
      # disk before the acquire's push; there is no release by identity). A
      # runner that dies outright frees the branch at the expiry it set.
      - name: Release the aria/state writer lease
        if: always()
        uses: ./.github/actions/release-aria-state-lease
        with:
          lease-token: ${{ steps.restore_state.outputs.writer-lease-token }}

      # ARIA-MEDIUM-277 — LAST step of the job: give back the host workspace
      # lock the first step took, unconditionally, so a failed night does not
      # starve every other self-hosted lane until the holder's ceiling.
      - name: Release the shared self-hosted workspace lock
        if: always()
        uses: ./.github/actions/selfhosted-workspace-lock
        with:
          mode: release

  # ORPHAN-724 / ARIA-HIGH-386 — the drain follows the producer. The edge is
  # an explicit dispatch, not a `workflow_run` trigger on the executor:
  # GitHub creates no `workflow_run` event for a run started with the job
  # token, and the executor's `chain-next-cycle` and the dataflow watchdog
  # both start this workflow that way, so every chained cycle ended with no
  # drain after it (cycle 37728223278, 2026-10-08). A workflow_dispatch is
  # the one event the job token may create. The executor's run waits in the
  # runner queue — and, once a second runner service exists, behind the
  # workspace lock this run holds — until this run has finished, the same
  # order the trigger gave (ARIA-MEDIUM-277: per-lane groups replaced the
  # shared one, so the wait can no longer be ended by eviction). A cancelled
  # cycle is an operator stop, so it chains nothing.
  chain-executor:
    needs: cycle
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the drain that follows this cycle
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run aria-agent-executor.yml --ref main --repo "${REPOSITORY}"
          echo "::notice::chained the drain"
